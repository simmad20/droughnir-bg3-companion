<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BG3 Companions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--obs:#09080c;--slab:#121017;--hi:#1a1721;--brass:#c8a86b;--parch:#e8e0d0;--ember:#9f2b16}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--obs);color:var(--parch);font-family:"Alegreya Sans",system-ui,sans-serif}
body{background:radial-gradient(1200px 600px at 50% -200px,#2a1f2e 0%,transparent 70%),radial-gradient(900px 500px at 50% 120%,#1b1410 0%,transparent 70%),var(--obs)}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 40px}
.top{position:relative;text-align:center;padding:26px 0 34px}
.eyebrow{font-family:Cinzel,Georgia,serif;font-size:13px;letter-spacing:.34em;text-transform:uppercase;color:rgba(200,168,107,.85)}
h1{font-family:Cinzel,Georgia,serif;font-weight:500;font-size:clamp(34px,5vw,52px);letter-spacing:.12em;text-transform:uppercase;margin:10px 0 16px;color:var(--parch);text-shadow:0 2px 18px rgba(200,168,107,.18)}
.orn{display:flex;align-items:center;justify-content:center;gap:12px}
.orn span{width:min(160px,28vw);height:1px;background:linear-gradient(90deg,transparent,rgba(200,168,107,.6))}
.orn span:last-child{transform:scaleX(-1)}
.orn i{width:9px;height:9px;transform:rotate(45deg);border:1px solid var(--brass);background:rgba(200,168,107,.25)}
.fs{position:absolute;right:0;top:0;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid rgba(200,168,107,.4);background:rgba(9,8,12,.7);color:rgba(232,224,208,.85);font:inherit;font-size:15px;cursor:pointer;transition:border-color .2s,color .2s}
.fs:hover,.fs:focus-visible{border-color:var(--brass);color:var(--parch)}
.fs svg{width:16px;height:16px;color:var(--brass)}
@media (max-width:560px){.fs span{display:none}.fs{padding:0 10px}.top{padding-top:56px}}
.ov{position:fixed;inset:0;z-index:50;background:var(--obs)}
.ov iframe{width:100%;height:100%;border:0;display:block}
.brand{display:flex;align-items:center;gap:10px;font-family:Cinzel,Georgia,serif;letter-spacing:.16em;text-transform:uppercase;font-size:14px;color:rgba(200,168,107,.9)}
.brand svg{width:16px;height:16px}
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr))}
.card{position:relative;display:flex;flex-direction:column;text-decoration:none;border:1px solid rgba(200,168,107,.28);background:linear-gradient(180deg,#1a1721,#100e14);box-shadow:0 18px 40px -24px rgba(0,0,0,.9);transition:border-color .2s,transform .2s,box-shadow .2s;outline:none}
.card::before,.card::after{content:"";position:absolute;width:14px;height:14px;border-color:var(--brass);border-style:solid;opacity:.7;z-index:3;pointer-events:none}
.card::before{top:-1px;left:-1px;border-width:2px 0 0 2px}.card::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
.card:hover,.card:focus-visible{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 26px 50px -26px var(--accent)}
.card:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.pic{position:relative;aspect-ratio:1/1;overflow:hidden;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--accent) 30%,#15121a) 0%,#0e0c12 70%)}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;transition:transform .5s}
.card:hover .pic img{transform:scale(1.04)}
.ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--accent)}
.ph svg{width:34%;height:34%;opacity:.85;filter:drop-shadow(0 0 24px var(--accent))}
.shade{position:absolute;inset:auto 0 0 0;height:62%;background:linear-gradient(0deg,#0b090e 4%,rgba(11,9,14,.75) 45%,transparent);pointer-events:none}
.lv{position:absolute;left:16px;top:16px;width:54px;height:54px;transform:rotate(45deg);display:grid;place-items:center;border:1px solid rgba(200,168,107,.75);background:rgba(9,8,12,.85);box-shadow:0 0 0 4px rgba(9,8,12,.55)}
.lv span{transform:rotate(-45deg);font-family:Cinzel,serif;font-size:22px;line-height:1;text-align:center}
.lv small{display:block;font-family:"Alegreya Sans",sans-serif;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:rgba(232,224,208,.6);margin-bottom:2px}
.oath{position:absolute;right:14px;top:14px;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid;background:rgba(9,8,12,.8);font-size:13px;letter-spacing:.04em}
.oath i{width:7px;height:7px;transform:rotate(45deg);background:currentColor}
.title{position:absolute;left:20px;right:20px;bottom:16px}
.role{font-family:Cinzel,serif;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.name{font-family:Cinzel,Georgia,serif;font-size:clamp(32px,4vw,40px);line-height:1;letter-spacing:.05em;margin-top:6px;text-shadow:0 2px 8px rgba(0,0,0,.9)}
.cls{margin-top:6px;font-size:16px;color:rgba(232,224,208,.86)}
.body{padding:16px 20px 20px;display:flex;flex-direction:column;gap:14px;flex:1}
.rows{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{padding:9px 11px;border:1px solid rgba(200,168,107,.18);background:rgba(9,8,12,.55);min-width:0}
.tile b{display:block;font-family:Cinzel,serif;font-weight:400;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(200,168,107,.9)}
.tile span{display:block;margin-top:3px;font-size:15px;line-height:1.3;color:var(--parch);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile em{font-style:normal;color:rgba(232,224,208,.6);font-size:13px}
.prog{display:flex;align-items:center;gap:10px;font-size:14px;color:rgba(232,224,208,.75)}
.bar{flex:1;height:6px;background:rgba(200,168,107,.12);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brass),var(--accent))}
.miss{color:#ec9a7a}
.go{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border:1px solid #d9774f;background:linear-gradient(180deg,#b4532c,#7c2f14);font-size:16px;letter-spacing:.02em;transition:filter .2s}
.card:hover .go{filter:brightness(1.12)}
.go svg{width:18px;height:18px;transition:transform .2s}.card:hover .go svg{transform:translateX(3px)}
.foot{margin-top:30px;display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between;font-size:14px;color:rgba(232,224,208,.6)}
.foot svg{width:14px;height:14px;vertical-align:-2px;margin-right:6px;color:var(--brass)}
@media (max-width:480px){.rows{grid-template-columns:1fr}.wrap{padding:20px 14px 30px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
 <header class="top">
  <button type="button" class="fs" id="fs" title="Vollbild" aria-label="Vollbild"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path id="fsi" d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg><span id="fst">Vollbild</span></button>
  <div class="eyebrow">Baldur's Gate 3</div>
  <h1>Companions</h1>
  <div class="orn"><span></span><i></i><span></span></div>
 </header>
 <div class="grid" id="grid"></div>
 <div class="foot"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Alle Daten bleiben lokal in diesem Browser – jeder Companion speichert getrennt.</span><span>Fan-Projekt · Bilder von bg3.wiki</span></div>
</main>
<script>
const C=[{"id": "droughnir", "name": "Droughnir", "href": "./droughnir/", "key": "droughnir-bg3-v1", "ui": "droughnir-bg3-ui", "db": "droughnir-bg3-assets", "pid": "p-droughnir", "img": "./droughnir/droughnir.png", "col": "#c8502c", "race": "Roter Drachenblütiger", "cls": "Paladin", "role": "Glaskanone mit Großwaffe", "oaths": {"ob": ["Eidbrecher", "#c8502c"], "ven": ["Eid der Rache", "#d9a441"]}, "defOath": "ob", "defRoute": {"ob": "w4", "ven": "v2"}, "routes": {"w4": "Eidbrecher 7 / Hexenmeister 5", "w3": "Eidbrecher 10 / Kämpfer 2", "w1": "Reiner Eidbrecher 12", "w2": "Eidbrecher 7 / Zauberer 5", "v2": "Rache 7 / Hexklinge 5", "v1": "Rache 8 / Kampfmeister 4", "v4": "Reine Rache 12", "v3": "Rache 6 / Schattenmagie 6"}, "checks": ["a1", "o2", "o1", "o11", "o15", "o12", "o4", "a2", "a3", "a4", "a7", "a8", "a9", "a10", "a11", "a12", "a13", "a14", "a15", "a16", "a17", "o14", "o13", "o10", "a18", "b1", "o16", "b2", "b3", "o7", "b4", "o17", "o5", "o6", "b5", "c1", "c2", "c3", "o18", "c4", "o19", "c5", "c6"], "icon": "sword"}, {"id": "sylvaran", "name": "Sylvaran", "href": "./sylvaran/", "key": "druid-bg3-v1", "ui": "druid-bg3-ui", "db": "druid-bg3-assets", "pid": "p-sylvaran", "img": "./sylvaran/sylvaran.png", "col": "#6bbf9b", "race": "Halbelf (Wald)", "cls": "Druide", "role": "Beschwörer & Gestaltwandler", "oaths": {"moon": ["Zirkel des Mondes", "#9fb6ff"], "spores": ["Sporenzirkel", "#8fc96a"], "stars": ["Zirkel der Sterne", "#e5c46b"], "land": ["Zirkel des Landes", "#6bbf9b"]}, "defOath": "moon", "defRoute": {"moon": "moon", "spores": "spores", "stars": "stars", "land": "land"}, "routes": {"moon": "Mond-Druide 12", "spores": "Sporen-Nekro-Druide 12", "stars": "Sternen-Druide 12", "moonbarb": "Mond 10 / Barbar 2", "land": "Land-Druide 12", "sporenecro": "Sporen 6 / Nekromant 6"}, "checks": ["d1", "d2", "d3", "d4", "d5", "d6", "d7", "d8", "d9", "d10", "d11", "e1", "e2", "e3", "f1", "f2", "f3", "f4", "f5", "f6", "f7", "f8"], "icon": "paw"}];
const ICON={sword:'<path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="M13 19l6-6M16 16l4 4M19 21l2-2"/>',
 paw:'<circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/>'};
const get=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function portrait(c){return new Promise(res=>{try{const r=indexedDB.open(c.db,1);r.onupgradeneeded=()=>r.result.createObjectStore("assets");
 r.onsuccess=()=>{try{const q=r.result.transaction("assets","readonly").objectStore("assets").get(c.pid);q.onsuccess=()=>{const v=q.result;res(v&&v.buf?URL.createObjectURL(new Blob([v.buf],{type:v.type||"image/png"})):null)};q.onerror=()=>res(null)}catch(e){res(null)}};r.onerror=()=>res(null)}catch(e){res(null)}})}
const arrow='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
function card(c){
 const ui=get(c.ui)||{},done=get(c.key)||{};
 const lvl=Math.min(12,Math.max(1,+ui.lvl||1));
 const oath=c.oaths[ui.oath]?ui.oath:c.defOath,O=c.oaths[oath];
 const rid=ui.route&&c.routes[ui.route]?ui.route:c.defRoute[oath],route=c.routes[rid]||"–";
 const n=c.checks.filter(id=>done[id]).length,pct=Math.round(n/c.checks.length*100);
 const a=document.createElement("a");a.className="card";a.href=c.href;a.addEventListener("click",e=>{if(document.fullscreenElement&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey){e.preventDefault();openOv(c)}});a.style.setProperty("--accent",c.col);
 a.setAttribute("aria-label",`${c.name} öffnen – Stufe ${lvl}, ${c.cls}`);
 a.innerHTML=`<div class="pic"><div class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">${ICON[c.icon]}</svg></div>
  <div class="shade"></div>
  <div class="lv"><span><small>Stufe</small>${lvl}</span></div>
  <div class="oath" style="color:${O[1]};border-color:${O[1]}88"><i></i>${esc(O[0])}</div>
  <div class="title"><div class="role">${esc(c.role)}</div><div class="name">${esc(c.name)}</div><div class="cls">${esc(c.race)} · ${esc(c.cls)}</div></div></div>
 <div class="body">
  <div class="rows"><div class="tile"><b>${ui.chosen?"Dein Weg":"Empfohlener Weg"}</b><span title="${esc(route)}">${esc(route)}</span></div>
   <div class="tile"><b>Zuletzt offen</b><span>${esc(({checkliste:"Checkliste",wege:"Wege",level:"Level-Guide",ausruestung:"Ausrüstung",alchemie:"Alchemie",taktik:"Kampf & Team",atlas:"Atlas"})[ui.tab]||"Checkliste")}</span></div></div>
  <div class="prog"><span>Checkliste</span><div class="bar"><i style="width:${pct}%"></i></div><span>${n} / ${c.checks.length}</span></div>
  <div class="go">${esc(c.name)} öffnen ${arrow}</div></div>`;
 const pic=a.querySelector(".pic"),setImg=src=>{if(!src)return;const im=new Image();im.alt="";im.onload=()=>{pic.querySelector(".ph").remove();pic.prepend(im)};im.src=src};
 portrait(c).then(u=>setImg(u||c.img));
 return a;
}
const fsb=document.getElementById("fs"),fsi=document.getElementById("fsi"),fst=document.getElementById("fst");
const ON="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3",OFF="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3";
const fsUpd=()=>{const f=!!document.fullscreenElement;fsi.setAttribute("d",f?OFF:ON);fst.textContent=f?"Beenden":"Vollbild";fsb.title=f?"Vollbild beenden":"Vollbild";fsb.setAttribute("aria-label",fsb.title)};
fsb.onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
document.addEventListener("fullscreenchange",fsUpd);if(!document.fullscreenEnabled)fsb.style.display="none";
// Companion im Vollbild öffnen: ein Seitenwechsel beendet das Vollbild immer, daher im Vollbild als Ebene laden
let ov=null;
const closeOv=()=>{if(!ov)return;ov.remove();ov=null;document.title="BG3 Companions";render()};
function openOv(c){ov=document.createElement("div");ov.className="ov";const f=document.createElement("iframe");f.src=c.href;f.title=c.name;f.allow="fullscreen";ov.appendChild(f);document.body.appendChild(ov);document.title=c.name+" – BG3 Companions";history.pushState({ov:c.id},"",c.href);setTimeout(()=>{try{f.contentWindow.focus()}catch(e){}},300)}
window.addEventListener("message",e=>{if(e.origin===location.origin&&e.data&&e.data.bg3hub==="close"){if(history.state&&history.state.ov)history.back();else closeOv()}});
window.addEventListener("popstate",()=>{if(ov&&!(history.state&&history.state.ov))closeOv()});
const g=document.getElementById("grid");
function render(){g.innerHTML="";C.forEach(c=>g.appendChild(card(c)))}
render();
</script>
</body>
</html>
