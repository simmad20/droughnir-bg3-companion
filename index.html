hit and \u22121 damage each, about \u221214% damage per turn. Compensation: Elixir of Hill Giant Strength (STR 21) before boss fights. The CHA routes (Hexblade, Sorcadin) are barely affected because CHA drives their attacks.","Kampferprobter Zauberwirker (War Caster), damit Segnen h\xE4lt.":"War Caster, so Bless holds.","Ohne Ethels Haar":"Without Ethel's Hair",Levelbaum:"Level tree","Kampferprobter Zauberwirker":"War Caster","Talent: Kampferprobter Zauberwirker (War Caster)":"Feat: War Caster","Im Kampf, in dieser Reihenfolge":"In combat, in this order","Attribute beim Umskillen":"Abilities when respeccing","Divine Intervention \xB7 5. Zaubertrick":"Divine Intervention \xB7 5th cantrip","Grad-6-Zauber":"Level 6 spells","Story-Item":"Story item",Prolog:"Prologue","2W6 Hieb + 1W4 Feuer":"2d6 slashing + 1d4 fire","+2 \xB7 +1W4 nekrotisch \xB7 heilt 1W6":"+2 \xB7 +1d4 necrotic \xB7 heals 1d6","Feuer (Waffe)":"Fire (weapon)","Nekrotisch (Waffe)":"Necrotic (weapon)","Click Heels: mehr Tempo":"Click Heels: more speed","Rettungswurf erzwingen \xB7 Teleport":"Force a save success \xB7 teleport","Misty Step \xB7 immun gegen Netz":"Misty Step \xB7 immune to webs","Maximale Heilung \xB7 Auto-Stabilisierung":"Maximum healing \xB7 auto-stabilise","H\xFCgelriesen-Elixier kaufen":"Buying Hill Giant elixirs","H\xFCgelriesen-Elixier finden":"Finding Hill Giant elixirs","H\xFCgelriesen-Elixier brauen":"Brewing Hill Giant elixirs","Trank der ewigen Kraft (Araj)":"Potion of Everlasting Vigour (Araj)","So bekommst du es":"How to get it","Grundregel: H\xE4ndler f\xFCllen ihr Sortiment nach jeder langen Rast oder jedem Stufenaufstieg neu auf. Steht kein Elixier im Laden, rasten und noch einmal nachsehen.":"Basic rule: traders restock after every long rest or level-up. If there's no elixir in stock, rest and check again.","Akt 1 \u2013 Tantchen Ethel (Zelt im Smaragdhain, sp\xE4ter Uferteehaus): 3 St\xFCck pro Rast, solange ihr Laden offen ist. Zeigt sie ihre Vettel-Gestalt, flieht oder stirbt, ist er f\xFCr immer zu.":"Act 1 \u2013 Auntie Ethel (tent in the Emerald Grove, later Riverside Teahouse): 3 per rest while her shop is open. Once she reveals her hag form, flees or dies, it's closed for good.","Akt 1 \u2013 Derryth Bonecloak: Unterreich, Ebonsee-Grotte, nahe dem westlichen Eingang der Myconid-Kolonie. Hat das Elixier nur gelegentlich, bis zu 2 pro Rast. Sie verkauft auch H\xFCgelriesen-Finger zum Selberbrauen.":"Act 1 \u2013 Derryth Bonecloak: Underdark, Ebonlake Grotto, near the western entrance of the Myconid Colony. Only stocks the elixir occasionally, up to 2 per rest. She also sells Hill Giant Fingers for brewing your own.","Akt 1 \u2013 Lady Esther: Pfad zum Rosymorn-Kloster (\xFCber den Gebirgspass).":"Act 1 \u2013 Lady Esther: Rosymorn Monastery Trail (via the Mountain Pass).","Akt 2 \u2013 Araj Oblodra in den Mondaufgangst\xFCrmen (bei ihrer Alchemie-Ausr\xFCstung) sowie Quartiermeisterin Talli und Mattis im Gasthaus Letztes Licht. F\xE4llt das Gasthaus, stirbt Talli \u2013 fr\xFCh einkaufen.":"Act 2 \u2013 Araj Oblodra in Moonrise Towers (at her alchemy equipment) as well as Quartermaster Talli and Mattis at the Last Light Inn. If the inn falls, Talli dies \u2013 shop early.","Akt 3 \u2013 Entharl Danthelon (Danthelons Tanzende Axt, Wyrms\xFCbergang) und Oliver Tefoco (Beehive General Goods, Unterstadt). Ab den Panzerhandschuhen (ST\xC4 23) brauchst du es aber nicht mehr.":"Act 3 \u2013 Entharl Danthelon (Danthelon's Dancing Axe, Wyrm's Crossing) and Oliver Tefoco (Beehive General Goods, Lower City). Once you have the Gauntlets (STR 23) you won't need it anymore.","Vorrat anlegen: lieber 3\u20134 St\xFCck auf einmal kaufen. Trinken ist eine Bonusaktion und h\xE4lt bis zur langen Rast \u2013 also vor dem Bosskampf trinken, nicht mittendrin.":"Stock up: better buy 3\u20134 at once. Drinking is a bonus action and lasts until long rest \u2013 so drink before the boss fight, not in the middle of it.","In der App: im Tab \u201EAusr\xFCstung\u201C unter Aktives Elixier \u201EH\xFCgelriese\u201C w\xE4hlen \u2013 dann rechnet sie mit ST\xC4 21.":'In the app: pick "Hill Giant" under Active elixir in the Equipment tab \u2013 it then calculates with STR 21.',"Feste Fundorte gibt es laut bg3.wiki nur zwei \u2013 das meiste bekommst du \xFCber H\xE4ndler oder Alchemie.":"Per bg3.wiki there are only two fixed locations \u2013 you'll get most from traders or alchemy.","Akt 1 \u2013 Smaragdhain: ein Elixier liegt in Tantchen Ethels Laden als Ware aus. Zeigt das Hand-Symbol beim Anvisieren rot, ist Mitnehmen Diebstahl \u2013 nur unbeobachtet nehmen oder einfach kaufen.":"Act 1 \u2013 Emerald Grove: one elixir is on display in Auntie Ethel's shop. If the hand icon turns red when you hover it, taking it is theft \u2013 only take it unseen or just buy it.","Akt 3 \u2013 Wyrms\xFCbergang: zweiter Stock des S\xFCdspann-Kontrollpunkts (X \u221213 / Y 55).":"Act 3 \u2013 Wyrm's Crossing: second floor of the South Span Checkpoint (X \u221213 / Y 55).","Werfen statt trinken? Lieber nicht: Geworfen hebt es die ST\xC4 aller Figuren im Radius von 1 m nur f\xFCr 10 Z\xFCge. Getrunken h\xE4lt es bis zur langen Rast.":"Throw instead of drink? Better not: thrown, it raises the STR of everyone within 1 m for only 10 turns. Drunk, it lasts until long rest.","Gefundene Elixiere sparen und f\xFCr Bosse nutzen \u2013 im Alltag reicht deine ST\xC4 17.":"Save found elixirs for bosses \u2013 your STR 17 is fine for everyday fights.","Zutat kaufen: H\xFCgelriesen-Finger (Hill Giant Finger) bei Derryth Bonecloak an der Myconid-Kolonie im Unterreich \u2013 laut Wiki auch bei weiteren H\xE4ndlern im Spiel. Du brauchst 3 Finger pro Elixier.":"Buy the ingredient: Hill Giant Fingers from Derryth Bonecloak at the Myconid Colony in the Underdark \u2013 per the wiki also from other traders in the game. You need 3 fingers per elixir.","Generische Zutat besorgen: eine beliebige Suspension. Sie entsteht beim Extrahieren bestimmter Pflanzen, z. B. Suspension of Mergrass aus Mergrass. Einfach unterwegs Zutaten aufsammeln \u2013 sie landen automatisch im Alchemiebeutel.":"Get the generic ingredient: any Suspension. It comes from extracting certain plants, e.g. Suspension of Mergrass from Mergrass. Just pick up ingredients along the way \u2013 they go straight into the alchemy pouch.","Alchemie \xF6ffnen: Taste H, nur au\xDFerhalb des Kampfes.":"Open alchemy: H key, only outside combat.","3 H\xFCgelriesen-Finger zu Salts of Hill Giant Fingernails extrahieren. Laut Wiki schaltet genau das auch das Rezept frei.":"Extract 3 Hill Giant Fingers into Salts of Hill Giant Fingernails. Per the wiki, this is also what unlocks the recipe.","Restliche Zutaten mit \u201EAlle Zutaten extrahieren\u201C umwandeln \u2013 jede Zutat wird zu genau einem Extrakt, nichts geht verloren, und neue Rezepte werden freigeschaltet.":'Convert the remaining ingredients with "Extract All Ingredients" \u2013 each ingredient becomes exactly one extract, nothing is wasted, and new recipes unlock.',"Brauen: Salts of Hill Giant Fingernails plus eine beliebige Suspension ergibt das Elixier der H\xFCgelriesenst\xE4rke.":"Brew: Salts of Hill Giant Fingernails plus any Suspension makes the Elixir of Hill Giant Strength.","Achtung bei der Suspension: Nimm eine, die du nicht als spezielle Zutat f\xFCr ein anderes Rezept brauchst \u2013 zum Beispiel nicht die, aus der du Heiltr\xE4nke machst.":"Careful with the Suspension: use one you don't need as a specific ingredient for another recipe \u2013 e.g. not the one you make healing potions from.","Gute Zutaten-Fundorte laut Wiki: Apotheke und Keller im Verfallenen Dorf (Akt 1), Waning Moon (Akt 2), Bonecloaks Apotheke (Akt 3).":"Good ingredient spots per the wiki: the Apothecary and its cellar in the Blighted Village (Act 1), the Waning Moon (Act 2), Bonecloak's Apothecary (Act 3).","Akt 2, Mondaufgangst\xFCrme: Araj Oblodra steht bei ihrer Alchemie-Ausr\xFCstung. Astarion muss in der Gruppe sein \u2013 ist er im Lager, bittet sie dich, ihn das n\xE4chste Mal mitzubringen.":"Act 2, Moonrise Towers: Araj Oblodra stands at her alchemy equipment. Astarion must be in the party \u2013 if he's at camp, she asks you to bring him next time.","Sie bittet Astarion, sie zu bei\xDFen, damit sie Vampirbisse erforschen kann. Daf\xFCr bietet sie den Trank der ewigen Kraft an.":"She asks Astarion to bite her so she can study vampire bites. In exchange she offers the Potion of Everlasting Vigour.","Astarion z\xF6gert und warnt, mit ihrem Blut stimme etwas nicht. Er bei\xDFt, wenn seine Zustimmung hoch genug ist und er die Wahl bekommt \u2013 oder wenn du es ihm befiehlst.":"Astarion hesitates and warns that something is wrong with her blood. He bites if his approval is high enough and he's given the choice \u2013 or if you order him to.","Folge: \u22123 Zustimmung bei Astarion und eine Lagerszene, die eine Romanze mit ihm betrifft. Sonst keine Konsequenzen.":"Consequence: \u22123 approval from Astarion and a camp scene that affects a romance with him. No other consequences.","Trank trinken (Bonusaktion): +2 ST\xC4 dauerhaft \u2013 auch \xFCber 20, \xFCbersteht Tod und Umskillen. Bei Droughnir also ST\xC4 17 \u2192 19 (+4).":"Drink the potion (bonus action): +2 STR permanently \u2013 even above 20, survives death and respecs. For Droughnir that's STR 17 \u2192 19 (+4).","Er wirkt nicht, solange etwas die ST\xC4 fest setzt (Elixier, Panzerhandschuhe) \u2013 lohnt sich trotzdem f\xFCr alle K\xE4mpfe ohne Elixier.":"It has no effect while something sets STR to a fixed value (elixir, Gauntlets) \u2013 still worth it for every fight without an elixir.","In der App: Checklistenpunkt \u201ETrank der ewigen Kraft\u201C abhaken \u2013 die Werte rechnen sofort mit ST\xC4 19.":'In the app: tick the "Potion of Everlasting Vigour" checklist item \u2013 the values update to STR 19 right away.',"H\xE4ndler mit gestuftem Magie-R\xFCstungs-Sortiment bei Spielerstufe 4\u20136 \u2013 bei dir: Roah Moonglow (Zhentarim-Lager im Zerschmetterten Heiligtum)":"Traders with the levelled magic armour stock at player level 4\u20136 \u2013 for you: Roah Moonglow (Zhentarim storeroom in the Shattered Sanctum)","+1, mittlere R\xFCstung: RK 15 + GES (max. 2), Superior Material: \u22121 Hiebschaden, Nachteil auf Heimlichkeit. Mit GES 10 also RK 15 \u2013 einer mehr als der Schuppenpanzer der Rache. Deine R\xFCstung, bis der Adamant-Schienenpanzer (RK 18) aus der Grymschmiede da ist.":"+1, medium armour: AC 15 + DEX (max. 2), Superior Material: \u22121 slashing damage, disadvantage on Stealth. With DEX 10 that's AC 15 \u2013 one more than the Scale Mail of Vengeance. Your armour until the Adamantine Splint Armour (AC 18) from Grymforge.","RK 15 + GES (max. 2) \xB7 \u22121 Hiebschaden":"AC 15 + DEX (max. 2) \xB7 \u22121 slashing damage","Sel\xFBnitischer Au\xDFenposten (X 176 / Y \u2212247): verschlossene, mit einer Falle gesicherte Prunktruhe hinter einer Geheimt\xFCr \u2013 per Wahrnehmungswurf finden oder vom Raum mit dem Wegpunkt hin\xFCberspringen":"Sel\xFBnite Outpost (X 176 / Y \u2212247): locked, trapped opulent chest behind a hidden door \u2013 find it with a Perception check or jump over from the room with the waypoint","+1, mittlere R\xFCstung: RK 15 + GES (max. 2). Radiating Shockwave: Jeder glei\xDFende Schaden, den du machst \u2013 auch G\xF6ttliches Niederstrecken, G\xF6ttliche Gunst oder der Ring des kaltherzigen Leuchtens \u2013 belegt Nicht-Verb\xFCndete im Umkreis von 3 m mit Radiating Orb (\u22121 auf Angriffe je verbleibendem Zug, sie leuchten hell). Verb\xFCndete bleiben verschont. Gleiche RK wie der Schuppenpanzer +1, aber mit Effekt \u2013 \xDCbergangsr\xFCstung bis zum Adamant-Schienenpanzer.":"+1, medium armour: AC 15 + DEX (max. 2). Radiating Shockwave: any radiant damage you deal \u2013 including Divine Smite, Divine Favour or the Callous Glow Ring \u2013 inflicts Radiating Orb on non-allies within 3 m (\u22121 to attack rolls per remaining turn, they shed bright light). Allies are unaffected. Same AC as the Scale Mail +1, but with an effect \u2013 transition armour until the Adamantine Splint Armour.","RK 15 + GES (max. 2) \xB7 Glei\xDFend \u2192 Radiating Orb":"AC 15 + DEX (max. 2) \xB7 Radiant \u2192 Radiating Orb","Glei\xDFender Schaden \u2192 Radiating Orb (3 m)":"Radiant damage \u2192 Radiating Orb (3 m)","Goblinlager: Crusher tr\xE4gt ihn am Zeh (\xF6stlicher Hof beim Alten Runenkreis)":"Goblin Camp: Crusher wears it on his toe (eastern courtyard by the Ancient Rune Circle)","+3 m Bewegung, stapelt mit Longstrider. Mehr Reichweite pro Zug hei\xDFt \xF6fter an den Gegner kommen, ohne Sprint \u2013 ideal f\xFCr die Glaskanone.":"+3 m movement, stacks with Longstrider. More reach per turn means reaching the enemy more often without dashing \u2013 ideal for the glass cannon.","Fl\xFCsternde Tiefen unter dem Verfallenen Dorf: Skelett mit Rucksack (X \u2212495 / Y \u2212365)":"Whispering Depths under the Blighted Village: skeleton with a backpack (X \u2212495 / Y \u2212365)","Startest du im Kampf einen Zug mit h\xF6chstens 50 % TP, bekommst du Schwung (+1,5 m Bewegung pro verbleibendem Zug) \u2013 zum R\xFCckzug oder Nachsetzen.":"If you start a turn in combat at 50% HP or less, you gain Momentum (+1.5 m movement per remaining turn) \u2013 for retreating or pressing on.","Grymschmiede: Belohnung von Sergeant Elenna Thrinn f\xFCr \u201EFinde die verlorenen Stiefel\u201C":'Grymforge: reward from Sergeant Elenna Thrinn for "Find the Missing Boots"',"+1 RK bis zu deinem n\xE4chsten Zug, nachdem du einen Gegner st\xF6\xDFt (einmal pro Zug, jeder Sto\xDF z\xE4hlt). Mit ST\xC4 17 st\xF6\xDFt Droughnir gut \u2013 Gegner in Lava oder Abgr\xFCnde.":"+1 AC until your next turn after you shove an enemy (once per turn, any push counts). With STR 17 Droughnir shoves well \u2013 enemies into lava or chasms.","Zerschmettertes Heiligtum: Skelett im offenen Sarkophag direkt vor den Worg-Gehegen (X 338 / Y 14)":"Shattered Sanctum: skeleton in the opened sarcophagus right before the Worg Pens (X 338 / Y 14)","Resistenz gegen Giftschaden \u2013 halbiert Gift von Spinnen und Fallen. Situativ, aber kostenlos mitzunehmen.":"Resistance to poison damage \u2013 halves poison from spiders and traps. Situational, but free to grab.","Ebonsee-Grotte: Omeluum nach der Quest \u201EHilf Omeluum, den Parasiten zu untersuchen\u201C (X 144 / Y 29)":'Ebonlake Grotto: Omeluum after the quest "Help Omeluum Investigate the Parasite" (X 144 / Y 29)',"Vorteil auf Rettungsw\xFCrfe gegen Bezauberung \u2013 in Akt 1 vor allem gegen den Lockgesang der Harpyien. Eine bezauberte Glaskanone schl\xE4gt sonst die eigene Gruppe.":"Advantage on saving throws against being charmed \u2013 in Act 1 mainly against the harpies' Luring Song. Otherwise a charmed glass cannon hits its own party.","+3 m Bewegung":"+3 m movement","Schwung unter 50 % TP":"Momentum below 50% HP","+1 RK nach Sto\xDFen":"+1 AC after shoving","Resistenz gegen Gift":"Poison resistance","Vorteil gegen Bezauberung":"Advantage against charm","Halbling-H\xE4ndlerin der Zhentarim. Akt 1: im Lagerraum westlich der Haupthalle des Zerschmetterten Heiligtums (X 275 / Y \u221229). Akt 2: Eingangshalle der Mondaufgangst\xFCrme (X \u2212174 / Y \u2212176). Akt 3: Zisterne in der Kanalisation der Unterstadt, nach dem Gildenhaus-Putsch im B\xFCro des Gildenmeisters. Ihr Sortiment wird teils zuf\xE4llig gew\xFCrfelt \u2013 bei dir war der Schuppenpanzer +1 dabei. Stirbt sie vor Akt 3, ersetzt sie Friol.":"Halfling trader of the Zhentarim. Act 1: in the storeroom west of the main hall of the Shattered Sanctum (X 275 / Y \u221229). Act 2: entry hall of Moonrise Towers (X \u2212174 / Y \u2212176). Act 3: cistern in the Lower City sewers, after the Guildhall coup in the Guild Master's office. Her stock is partly randomised \u2013 yours had the Scale Mail +1. If she dies before Act 3, Friol replaces her.","Cambion-Kommandant am Steuer der Nautiloid im Prolog. K\xE4mpft dort gegen einen Gedankenschinder; der Kampf startet, sobald jemand das Steuer betritt. Ihn zu t\xF6ten ist nicht n\xF6tig, bringt aber die Everburn Blade und Extra-EP \u2013 alternativ per Befehl: Fallenlassen entwaffnen. Nach 15 Z\xFCgen kommen Cambion-Verst\xE4rkungen.":"Cambion commander at the helm of the Nautiloid in the prologue. He's fighting a mind flayer there; combat starts as soon as someone enters the helm. Killing him isn't required but gives the Everburn Blade and extra XP \u2013 alternatively disarm him with Command: Drop. After 15 turns Cambion reinforcements arrive.","K\xE4mpferin (Kampfmeisterin) des Flammenden Fausts. Versucht in der brennenden Waukeens Rast die verbarrikadierte T\xFCr aufzubrechen \u2013 ein ST\xC4-Wurf SG 10 hilft \u2013 und startet \u201ERettet den Gro\xDFherzog\u201C. Tr\xE4gt Svartlebee's Woundseeker. In Akt 2 steckt sie in einer Kapsel im Kaulquappen-Zentrum.":`Fighter (Battle Master) of the Flaming Fist. At the burning Waukeen's Rest she tries to break the barricaded door \u2013 a DC 10 STR check helps \u2013 and starts "Rescue the Grand Duke". Carries Svartlebee's Woundseeker. In Act 2 she's in a pod in the Tadpoling Centre.`,"Anf\xFChrer des Mordtribunals unter Candulhallows Grabsteinen in der Unterstadt. Tr\xE4gt das Sword of Chaos, das Amulett des Bhaal und seinen geh\xF6rnten Helm. Wird feindlich, wenn du nach Orins Tod ins Tribunal zur\xFCckkehrst.":"Leader of the Murder Tribunal under Candulhallow's Tombstones in the Lower City. Carries the Sword of Chaos, the Amulet of Bhaal and his horned helmet. Turns hostile if you return to the Tribunal after Orin's death.","Duergar-Anf\xFChrer der Absoluten in der Grymschmiede, eingeschlossen hinter einem Einsturz. Philomeen hat Sprengstoff f\xFCr den Schutt. Sprichst du mit ihm durch den Schutt, l\xE4uft ein Zeitlimit: nach zwei langen Rasten oder zweimal Grymschmiede verlassen stirbt er. Danach entweder gegen ihn k\xE4mpfen (Gnome retten) oder mit \xC4ltester Brithvar zusammenarbeiten. Beute: Disintegrating Night Walkers und 1.000 Gold.":"Duergar leader of the Absolute in Grymforge, trapped behind a cave-in. Philomeen has explosives for the rubble. Once you talk to him through the rubble, a timer runs: after two long rests or leaving Grymforge twice he dies. Then either fight him (save the gnomes) or work with Elder Brithvar. Loot: Disintegrating Night Walkers and 1,000 gold.","Tiefengnomin in der Ebonsee-Grotte (X 87 / Y \u221295) neben Spaw, vergiftet von Duergar. Startet \u201EHeile die vergiftete Gnomin\u201C \u2013 jeder Effekt gegen Vergiftung hilft. Geheilt schenkt sie dir die Boots of Speed, die sie Thrinn gestohlen hat.":'Deep gnome in the Ebonlake Grotto (X 87 / Y \u221295) next to Spaw, poisoned by duergar. Starts "Cure the Poisoned Gnome" \u2013 any effect against poison helps. Once cured she gives you the Boots of Speed she stole from Thrinn.',"Duergar-Sergeantin im Duergar-Lager der Grymschmiede (X \u2212643 / Y 300). Sucht ihre gestohlenen Stiefel (\u201EFinde die verlorenen Stiefel\u201C). Gibst du ihr die Boots of Speed, w\xE4hlst du als Belohnung das Bracing Band oder die Armour of Uninhibited Kushigo.":'Duergar sergeant in the duergar encampment of Grymforge (X \u2212643 / Y 300). Looking for her stolen boots ("Find the Missing Boots"). Give her the Boots of Speed and choose the Bracing Band or the Armour of Uninhibited Kushigo as a reward.',"Gro\xDFm\xE4uliger Goblin im \xF6stlichen Hof des Goblinlagers beim Alten Runenkreis. Tr\xE4gt Crusher's Ring am Zeh: beim erzwungenen Fu\xDFkuss abziehen (Fingerfertigkeit SG 10), per Dialog stehlen oder ihn t\xF6ten und pl\xFCndern.":"Loudmouthed goblin in the eastern courtyard of the Goblin Camp by the Ancient Rune Circle. Wears Crusher's Ring on his toe: slip it off during the forced foot kiss (DC 10 Sleight of Hand), steal it via dialogue or kill and loot him.","Anf\xFChrerin der Tiefling-Kinder im Versteck unter dem Smaragdhain. Gibt dir \u201EStehlt das heilige G\xF6tzenbild\u201C und belohnt dich mit dem Ring of Protection. Akt 2 im Letzten Licht, Akt 3 bei Sticky Dondo im Gildenhaus der Unterstadt.":'Leader of the tiefling kids in the hideout under the Emerald Grove. Gives you "Steal the Sacred Idol" and rewards you with the Ring of Protection. Act 2 at Last Light, Act 3 with Sticky Dondo at the Guildhall in the Lower City.',"Freundlicher Gedankenschinder an der Myconid-Kolonie \u2013 du triffst ihn nach einem Gespr\xE4ch mit Blurg. Quest: einen Sud aus Tongue of Madness und Timmask-Sporen bringen; danach bietet er den Ring of Mind-Shielding an. Verkauft au\xDFerdem u. a. die Boots of Stormy Clamour und den Ring of Salving.":"Friendly mind flayer at the Myconid Colony \u2013 you meet him after talking to Blurg. Quest: bring a decoction of Tongue of Madness and Timmask Spores; afterwards he offers the Ring of Mind-Shielding. Also sells the Boots of Stormy Clamour and the Ring of Salving, among others.","Waffen- und R\xFCstungsh\xE4ndler in Danthelons Tanzender Axt am Westende des Wyrms\xFCbergangs (X \u22126 / Y 133). Verkauft u. a. den Cloak of Displacement, die Gauntlets of the Warmaster und Blightbringer \u2013 und das Elixier der H\xFCgelriesenst\xE4rke.":"Weapon and armour trader at Danthelon's Dancing Axe on the west end of Wyrm's Crossing (X \u22126 / Y 133). Sells the Cloak of Displacement, the Gauntlets of the Warmaster and Blightbringer, among others \u2013 and the Elixir of Hill Giant Strength.","Das Gedankenschinder-Schiff im Prolog. Am Steuer k\xE4mpft Kommandant Zhalk mit der Everburn Blade. Nach dem Absturz nicht mehr betretbar.":"The mind flayer ship in the prologue. Commander Zhalk fights at the helm with the Everburn Blade. Can't be entered after the crash.","Verlassenes Dorf zwischen Druidenhain und Goblinlager, von Goblins besetzt. Moosbewachsene Truhe mit dem Haste Helm (X 34 / Y 394, Schl\xFCssel beim Booyahg auf dem Apothekendach), Apotheke mit Keller f\xFCr Alchemie-Zutaten, Windm\xFChle mit Barcus Wroot. Unter dem Dorf: die Fl\xFCsternden Tiefen mit dem Spurred Band \u2013 Eingang \xFCber den Brunnen (Untersuchung SG 10) oder die Schmiede.":"Abandoned village between the Druid Grove and the Goblin Camp, occupied by goblins. Moss-Covered Chest with the Haste Helm (X 34 / Y 394, key with the Booyahg on the apothecary roof), apothecary with a cellar for alchemy ingredients, windmill with Barcus Wroot. Below the village: the Whispering Depths with the Spurred Band \u2013 entrance via the well (DC 10 Investigation) or the forge.","Brennendes Gasthaus zwischen Gebirgspass und Aufgestiegener Stra\xDFe. Zeitkritisch: Schnellreise, Ortswechsel oder lange Rast lassen das Feuer alle Eingeschlossenen t\xF6ten. Gauntlet Yeva (Svartlebee's Woundseeker) bricht die T\xFCr auf, oben wartet Beraterin Florrick, hinter dem Gasthaus liegt der Geheimeingang zum Zhentarim-Versteck.":"Burning inn between the Mountain Pass and the Risen Road. Time-critical: fast travel, changing area or a long rest let the fire kill everyone trapped. Gauntlet Yeva (Svartlebee's Woundseeker) breaks open the door, Counsellor Florrick waits upstairs, and behind the inn is the secret entrance to the Zhentarim hideout.","Breite Steinbr\xFCcke von Rivington in die Unterstadt mit vielen L\xE4den \u2013 u. a. Danthelons Tanzende Axt (Cloak of Displacement). Am S\xFCdspann-Kontrollpunkt liegt ein Elixier der H\xFCgelriesenst\xE4rke, am Ende wartet die Wyrmfels-Festung mit den Helldusk Boots.":"Wide stone bridge from Rivington into the Lower City with many shops \u2013 including Danthelon's Dancing Axe (Cloak of Displacement). An Elixir of Hill Giant Strength lies at the South Span Checkpoint, and at the end the Wyrm's Rock Fortress awaits with the Helldusk Boots.","Herz von Baldur's Gate in Akt 3. Hier liegen die Schmiede der Neun (Dammon: Legacy of the Masters, Armour of Persistence), Beehive General Goods (Elixiere) und unter Candulhallows Grabsteinen das Mordtribunal mit Sarevok und dem Sword of Chaos.":"Heart of Baldur's Gate in Act 3. Here you'll find the Forge of the Nine (Dammon: Legacy of the Masters, Armour of Persistence), Beehive General Goods (elixirs) and, under Candulhallow's Tombstones, the Murder Tribunal with Sarevok and the Sword of Chaos.","Mittlere R\xFCstung: RK 15 + GES (max. +2) \u2013 mit GES 10 also RK 15":"Medium armour: AC 15 + DEX (max. +2) \u2013 with DEX 10 that's AC 15","Verzauberung +1":"Enchantment +1","Superior Material: Du nimmst 1 Hiebschaden weniger":"Superior Material: you take 1 less slashing damage","Nachteil auf Heimlichkeit":"Disadvantage on Stealth","160 gp \xB7 12 kg":"160 gp \xB7 12 kg","H\xE4ndler w\xFCrfeln magische R\xFCstungen aus einer gestuften Tabelle \u2013 der Schuppenpanzer +1 taucht bei Spielerstufe 4\u20136 auf.":"Traders roll magic armour from a levelled table \u2013 the Scale Mail +1 shows up at player level 4\u20136.","Bei dir hatte ihn Roah Moonglow im Zhentarim-Lager des Zerschmetterten Heiligtums (X 275 / Y \u221229).":"For you, Roah Moonglow had it in the Zhentarim storeroom of the Shattered Sanctum (X 275 / Y \u221229).","Steht er nicht im Angebot: nach einer langen Rast oder einem Stufenaufstieg erneut schauen.":"Not in stock? Check again after a long rest or level-up.","Mittlere R\xFCstung: RK 15 + GES (max. +2), Verzauberung +1":"Medium armour: AC 15 + DEX (max. +2), enchantment +1","Radiating Shockwave: Jeder glei\xDFende Schaden, den du machst, belegt Nicht-Verb\xFCndete im Umkreis von 3 m mit Radiating Orb":"Radiating Shockwave: any radiant damage you deal inflicts Radiating Orb on non-allies within 3 m","Radiating Orb: 2 Z\xFCge, \u22121 auf Angriffe je verbleibendem Zug, das Ziel leuchtet hell; jeder Angriff des Ziels verk\xFCrzt die Dauer um 2":"Radiating Orb: 2 turns, \u22121 to attack rolls per remaining turn, the target sheds bright light; each attack by the target reduces the duration by 2","Trifft keine Verb\xFCndeten, aber neutrale Kreaturen":"Doesn't hit allies, but does hit neutral creatures","Ausl\xF6ser f\xFCr dich: G\xF6ttliches Niederstrecken, G\xF6ttliche Gunst, Ring des kaltherzigen Leuchtens":"Triggers for you: Divine Smite, Divine Favour, Callous Glow Ring","250 gp \xB7 9 kg":"250 gp \xB7 9 kg","Im Sel\xFBnitischen Au\xDFenposten zur Stelle X 176 / Y \u2212247.":"In the Sel\xFBnite Outpost go to X 176 / Y \u2212247.","Die Prunktruhe steht hinter einer Geheimt\xFCr: per Wahrnehmungswurf entdecken \u2013 oder vom Raum mit dem Wegpunkt hin\xFCberspringen.":"The opulent chest is behind a hidden door: spot it with a Perception check \u2013 or jump over from the room with the waypoint.","Die Truhe ist verschlossen und mit einer Falle gesichert: erst die Falle entsch\xE4rfen, dann das Schloss knacken.":"The chest is locked and trapped: disarm the trap first, then pick the lock.","Im selben Au\xDFenposten liegt auch der Helm des Niederstreckens \u2013 gleich mitnehmen.":"The Helmet of Smiting is in the same outpost \u2013 grab it too.","Gro\xDFschwert, 2W6 Hieb + 1W4 Feuer":"Greatsword, 2d6 slashing + 1d4 fire","Ignoriert Resistenz gegen nicht-magischen Hiebschaden":"Ignores resistance to non-magical slashing damage","Pommel Strike (Bonusaktion): nicht-t\xF6dlicher Schlag, kann benommen machen; l\xE4dt bei kurzer Rast":"Pommel Strike (bonus action): non-lethal blow that can daze; recharges on a short rest","Prolog: Kommandant Zhalk k\xE4mpft am Steuer der Nautiloid gegen einen Gedankenschinder.":"Prologue: Commander Zhalk fights a mind flayer at the helm of the Nautiloid.","Ihn zu t\xF6ten gibt die Klinge und Extra-EP \u2013 oder ihn per Befehl: Fallenlassen entwaffnen (er besteht den Rettungswurf oft).":"Killing him gives the blade and extra XP \u2013 or disarm him with Command: Drop (he often passes the save).","Der Kampf hat ein Limit von 15 Z\xFCgen, danach kommen Cambion-Verst\xE4rkungen.":"The fight has a 15-turn limit, after which Cambion reinforcements arrive.","Nach dem Absturz nicht mehr erreichbar \u2013 f\xFCr dich also verpasst.":"Not reachable after the crash \u2013 so you've missed it.","Gro\xDFschwert +1, 2W6 Hieb":"Greatsword +1, 2d6 slashing","Deepen the Wound: +1W4 auf Angriffsw\xFCrfe mit dieser Waffe gegen Kreaturen, die schon Schaden genommen haben":"Deepen the Wound: +1d4 to attack rolls with this weapon against creatures that have already taken damage","Akt 1: Waukeens Rast (X \u221266 / Y 609) \u2013 Gauntlet Yeva vom Flammenden Faust tr\xE4gt es.":"Act 1: Waukeen's Rest (X \u221266 / Y 609) \u2013 Gauntlet Yeva of the Flaming Fist carries it.","Erbeuten l\xE4sst es sich nur, wenn Yeva f\xE4llt.":"You can only loot it if Yeva falls.","Lebt sie, steckt sie in Akt 2 in einer Kapsel im Kaulquappen-Zentrum der Gedankenschinder-Kolonie und tr\xE4gt es weiterhin.":"If she lives, in Act 2 she's in a pod in the Tadpoling Centre of the mind flayer colony and still carries it.","Gro\xDFschwert +2: 2W6 + 2 Hieb + 1W4 nekrotisch":"Greatsword +2: 2d6 + 2 slashing + 1d4 necrotic","Chaos: Jeder Schadenstreffer heilt dich um 1W6 (Schaden an Gegenst\xE4nden z\xE4hlt nicht)":"Chaos: every damaging hit heals you for 1d6 (damage to objects doesn't count)","Sehr selten \xB7 960 gp":"Very rare \xB7 960 gp","Akt 3: Mordtribunal unter Candulhallows Grabsteinen in der Unterstadt.":"Act 3: the Murder Tribunal under Candulhallow's Tombstones in the Lower City.","Sarevok Anchev tr\xE4gt es \u2013 zusammen mit dem Amulett des Bhaal und seinem geh\xF6rnten Helm.":"Sarevok Anchev carries it \u2013 along with the Amulet of Bhaal and his horned helmet.","Er wird feindlich, wenn du nach Orins Tod ins Tribunal zur\xFCckkehrst.":"He turns hostile if you return to the Tribunal after Orin's death.","Schwere R\xFCstung: RK 20":"Heavy armour: AC 20","\u22122 auf jeden erlittenen Schaden":"\u22122 to every damage taken","Dauerhaft Resistance (+1W4 auf Rettungsw\xFCrfe)":"Permanent Resistance (+1d4 to saving throws)","Dauerhaft Blade Ward (Resistenz gegen Wucht, Stich und Hieb)":"Permanent Blade Ward (resistance to bludgeoning, piercing and slashing)","Akt 3: Dammon verkauft sie in der Schmiede der Neun in der Unterstadt.":"Act 3: Dammon sells it at the Forge of the Nine in the Lower City.","Zu Kampfbeginn 3 Z\xFCge Schwung: +1,5 m Bewegung pro verbleibendem Zug":"At the start of combat 3 turns of Momentum: +1.5 m movement per remaining turn","Akt 1: Verfallenes Dorf \u2013 die Moosbewachsene Truhe steht neben einem Wagen gegen\xFCber dem Wegpunkt in der Dorfmitte (X 34 / Y 394).":"Act 1: Blighted Village \u2013 the Moss-Covered Chest stands next to a wagon across from the waypoint in the village centre (X 34 / Y 394).","Den Moosbewachsenen Schl\xFCssel tr\xE4gt ein Goblin-Booyahg auf dem Dach der Apotheke.":"A goblin Booyahg on the apothecary roof carries the Moss-Covered Key.","+2 auf Angriffs- und Schadensw\xFCrfe mit Waffen":"+2 to attack and damage rolls with weapons","+1 auf ST\xC4-Rettungsw\xFCrfe":"+1 to STR saving throws","Bekannter Bug: Die +2 auf den Angriff gelten auch f\xFCr Zauberangriffe, waffenlose und Wurfangriffe (Schaden nur bei Wurfwaffen)":"Known bug: the +2 to hit also applies to spell attacks, unarmed and throw attacks (damage only with thrown weapons)","Akt 3: Dammon verkauft sie in der Schmiede der Neun (X 5 / Y \u22127).":"Act 3: Dammon sells it at the Forge of the Nine (X 5 / Y \u22127).","Immun gegen Netz, Verstrickt und Ausrutschen":"Immune to webs, Entangled and slipping","Misty Step als Bonusaktion, einmal pro kurzer Rast":"Misty Step as a bonus action, once per short rest","Akt 1, Grymschmiede: Nere sitzt hinter einem Einsturz fest, versklavte Tiefengnome sollen ihn ausgraben.":"Act 1, Grymforge: Nere is stuck behind a cave-in; enslaved deep gnomes are supposed to dig him out.","Philomeen hat Sprengstoff f\xFCr den Schutt. Achtung: Sobald du durch den Schutt mit Nere sprichst, l\xE4uft ein Zeitlimit \u2013 nach zwei langen Rasten oder zweimal Grymschmiede verlassen stirbt er.":"Philomeen has explosives for the rubble. Careful: once you talk to Nere through the rubble, a timer runs \u2013 after two long rests or leaving Grymforge twice he dies.","Nach der Befreiung: gegen Nere und seine S\xF6ldner k\xE4mpfen (rettet die Gnome) oder mit \xC4ltester Brithvar zusammenarbeiten.":"After freeing him: fight Nere and his mercenaries (saves the gnomes) or work with Elder Brithvar.","Die Stiefel nimmst du von seiner Leiche. Vorsicht: Lava in der N\xE4he, und Nere zu sto\xDFen braucht SG 24.":"Take the boots from his corpse. Careful: lava nearby, and shoving Nere needs DC 24.","Bonusaktion \u201EClick Heels\u201C: mehr Tempo und Bewegungsfreiheit":'Bonus action "Click Heels": more speed and freedom of movement',"Laut Wiki-Bug trifft der Nachteil deine eigenen Reaktionsangriffe statt die der Gegner":"Per a wiki-noted bug the disadvantage hits your own reaction attacks instead of the enemies'","Akt 1, Ebonsee-Grotte (X 87 / Y \u221295): Die Tiefengnomin Thulla liegt neben Spaw im Sterben \u2013 vergiftet von Duergar.":"Act 1, Ebonlake Grotto (X 87 / Y \u221295): the deep gnome Thulla lies dying next to Spaw \u2013 poisoned by duergar.","Heile sie (jeder Effekt, der Vergiftung aufhebt) und versprich, den anderen Gnomen zu helfen \u2013 dann schenkt sie dir die Stiefel.":"Cure her (any effect that removes poison) and promise to help the other gnomes \u2013 then she gives you the boots.","Abw\xE4gung: Sergeant Thrinn in der Grymschmiede sucht genau diese Stiefel. Gibst du sie ihr, bekommst du daf\xFCr das Bracing Band.":"Trade-off: Sergeant Thrinn in Grymforge is looking for exactly these boots. Give them to her and you get the Bracing Band instead.","Ignorieren schwieriges Gel\xE4nde, du kannst nicht verschoben werden":"Ignore difficult terrain, you can't be moved by force","Fehlgeschlagenen Rettungswurf per Reaktion schaffen (laut Wiki einmal pro Rast)":"Turn a failed saving throw into a success with a reaction (per the wiki once per rest)","Teleport mit 2W8 Feuer als Bonusaktion":"Teleport with 2d8 fire as a bonus action","Akt 3: Wyrmfels-Festung am Ende des Wyrms\xFCbergangs \u2013 verschlossene Goldtruhe im obersten Stock.":"Act 3: Wyrm's Rock Fortress at the end of Wyrm's Crossing \u2013 locked gilded chest on the top floor.","Zu Beginn deines Zugs haben Gegner Nachteil auf Angriffe gegen dich \u2013 bis du Schaden nimmst":"At the start of your turn enemies have disadvantage on attacks against you \u2013 until you take damage","Akt 3: Entharl Danthelon verkauft ihn in Danthelons Tanzender Axt am Westende des Wyrms\xFCbergangs (X \u22126 / Y 133).":"Act 3: Entharl Danthelon sells it at Danthelon's Dancing Axe on the west end of Wyrm's Crossing (X \u22126 / Y 133).","Akt 1: Entweihter Tempel unter dem Zerschmetterten Heiligtum \u2013 vergoldete Truhe in Priesterin Guts Gemach (X 386 / Y 8).":"Act 1: Defiled Temple below the Shattered Sanctum \u2013 gilded chest in Priestess Gut's quarters (X 386 / Y 8).","Ihr wart schon dort: Habt ihr die Truhe noch nicht ge\xF6ffnet, lohnt sich der R\xFCckweg.":"You've already been there: if you haven't opened the chest yet, it's worth going back.","Wirst du niedergeschlagen, stabilisierst du dich automatisch":"If you're downed, you stabilise automatically","Heilung auf dich heilt immer den Maximalwert":"Healing on you always heals the maximum","Akt 1: Lady Esther verkauft es am Pfad zum Rosymorn-Kloster.":"Act 1: Lady Esther sells it on the Rosymorn Monastery Trail.","+1 RK":"+1 AC","+1 auf alle Rettungsw\xFCrfe":"+1 to all saving throws","Akt 1: Tiefling-Versteck unter dem Smaragdhain (X 84 / Y 73).":"Act 1: Tiefling Hideout under the Emerald Grove (X 84 / Y 73).","Freunde dich mit Mol an \u2013 sie gibt dir die Quest \u201EStehlt das heilige G\xF6tzenbild\u201C.":'Befriend Mol \u2013 she gives you the quest "Steal the Sacred Idol".',"F\xFCr das G\xF6tzenbild belohnt sie dich mit dem Ring.":"She rewards you with the ring for the idol.","Vorteil auf alle Angriffsw\xFCrfe":"Advantage on all attack rolls","Nachteil auf alle Rettungsw\xFCrfe":"Disadvantage on all saving throws","Akt 2: Araj Oblodra verkauft ihn in den Mondaufgangst\xFCrmen (X \u2212128 / Y \u2212193).":"Act 2: Araj Oblodra sells it at Moonrise Towers (X \u2212128 / Y \u2212193).","Nach einem Kill ist dein n\xE4chster Angriffswurf ein kritischer Treffer":"After a kill your next attack roll is a critical hit","L\xE4dt nach einer langen Rast":"Recharges after a long rest","Akt 2: Shar-Pr\xFCfung \u2013 Selbstgleiche Pr\xFCfung, neben dem Kohlebecken.":"Act 2: Gauntlet of Shar \u2013 Self-Same Trial, next to the brazier.","+3 m Bewegungsrate":"+3 m movement speed","Stapelt mit Longstrider":"Stacks with Longstrider","Ungew\xF6hnlich \xB7 40 gp":"Uncommon \xB7 40 gp","Crusher steht im \xF6stlichen Hof des Goblinlagers beim Alten Runenkreis (X \u221270 / Y 439).":"Crusher stands in the eastern courtyard of the Goblin Camp by the Ancient Rune Circle (X \u221270 / Y 439).","Er verlangt, dass du ihm die F\xFC\xDFe k\xFCsst: Dabei den Ring vom Zeh ziehen \u2013 Fingerfertigkeit SG 10 (Schurken mit Vorteil).":"He demands that you kiss his feet: slip the ring off his toe while doing so \u2013 DC 10 Sleight of Hand (rogues with advantage).","Oder per Dialog stehlen, oder ihn t\xF6ten und pl\xFCndern \u2013 ergibt er sich, wird er verschont.":"Or steal it via dialogue, or kill and loot him \u2013 if he surrenders, he's spared.","Ihr habt das Lager ger\xE4umt: Liegt Crusher dort, einfach seine Leiche durchsuchen.":"You cleared the camp: if Crusher lies there, just search his corpse.","Startest du im Kampf einen Zug mit h\xF6chstens 50 % TP, bekommst du Schwung f\xFCr 1 Zug":"If you start a turn in combat at 50% HP or less, you gain Momentum for 1 turn","Schwung: +1,5 m Bewegung pro verbleibendem Zug (max. 5 Z\xFCge)":"Momentum: +1.5 m movement per remaining turn (max. 5 turns)","Endet bei Festgehalten, Kampfunf\xE4hig, Liegend oder Verlangsamt":"Ends on Restrained, Incapacitated, Prone or Slowed","Akt 1: Fl\xFCsternde Tiefen unter dem Verfallenen Dorf.":"Act 1: Whispering Depths below the Blighted Village.","Eingang: der verwachsene Brunnen westlich der Dorfmitte (Untersuchung SG 10) oder durch den Keller der Schmiede.":"Entrance: the overgrown well west of the village centre (DC 10 Investigation) or through the forge cellar.","Achtung: Phasenspinnen, Ettercaps und die Phasenspinnen-Matriarchin; Netze verlangen einen GES-Rettungswurf SG 12.":"Careful: phase spiders, ettercaps and the Phase Spider Matriarch; webs require a DC 12 DEX save.","Der Ring liegt bei einem Skelett mit Rucksack (X \u2212495 / Y \u2212365).":"The ring lies by a skeleton with a backpack (X \u2212495 / Y \u2212365).","Nicht ohne Federfall in die zentrale Grube springen \u2013 der Sturz ins Unterreich ist t\xF6dlich.":"Don't jump into the central pit without Feather Fall \u2013 the fall into the Underdark is deadly.","Nachdem du einen Gegner st\xF6\xDFt: +1 RK bis zu deinem n\xE4chsten Zug":"After you shove an enemy: +1 AC until your next turn","H\xF6chstens einmal pro Zug, jeder Sto\xDF z\xE4hlt (nicht nur \u201ESto\xDFen\u201C)":'At most once per turn, any push counts (not just "Shove")',"Akt 1: Sergeant Elenna Thrinn steht im Duergar-Lager der Grymschmiede (X \u2212643 / Y 300).":"Act 1: Sergeant Elenna Thrinn stands in the duergar encampment of Grymforge (X \u2212643 / Y 300).","Sie sucht ihre gestohlenen Stiefel \u2013 die Boots of Speed, die Thulla in der Ebonsee-Grotte hat.":"She's looking for her stolen boots \u2013 the Boots of Speed that Thulla has in the Ebonlake Grotto.","Gib Thrinn die Stiefel und w\xE4hle das Bracing Band (die andere Wahl w\xE4re die Armour of Uninhibited Kushigo).":"Give Thrinn the boots and choose the Bracing Band (the other option would be the Armour of Uninhibited Kushigo).","Resistenz gegen Giftschaden":"Resistance to poison damage","Akt 1: Zerschmettertes Heiligtum \u2013 Skelett im offenen Sarkophag direkt vor den Worg-Gehegen (X 338 / Y 14).":"Act 1: Shattered Sanctum \u2013 skeleton in the opened sarcophagus right before the Worg Pens (X 338 / Y 14).","Ihr wart schon im Heiligtum: Falls noch nicht gepl\xFCndert, kurz zur\xFCck.":"You've already been in the Sanctum: if it isn't looted yet, pop back.","Vorteil auf Rettungsw\xFCrfe gegen Bezauberung":"Advantage on saving throws against being charmed","Zus\xE4tzlich der Effekt Shelter":"Also grants the Shelter effect","Selten \xB7 70 gp":"Rare \xB7 70 gp","Akt 1: Omeluum triffst du an der Myconid-Kolonie, nachdem du mit Blurg gesprochen hast.":"Act 1: you meet Omeluum at the Myconid Colony after talking to Blurg.","Er bittet um einen Sud aus Tongue of Madness und Timmask-Sporen \u2013 beides gibt es im Unterreich. Droughnir als Gildenhandwerker bekommt beim Abliefern die Inspiration \u201EMind Over Mushrooms\u201C.":'He asks for a decoction of Tongue of Madness and Timmask Spores \u2013 both are in the Underdark. As a Guild Artisan, Droughnir gets the "Mind Over Mushrooms" inspiration on delivery.',"Das Experiment schl\xE4gt fehl und st\xE4rkt die Kaulquappe dessen, der trinkt (Survival Instinct).":"The experiment fails and strengthens the tadpole of whoever drinks (Survival Instinct).","Danach bietet Omeluum den Ring an: \xFCberzeugen, einsch\xFCchtern, bezahlen oder ihm von der Nautiloid erz\xE4hlen.":"Then Omeluum offers the ring: persuade, intimidate, pay or tell him about the Nautiloid.","Entweihter Tempel unter dem Zerschmetterten Heiligtum: vergoldete Truhe in Priesterin Guts Gemach (X 386 / Y 8)":"Defiled Temple below the Shattered Sanctum: gilded chest in Priestess Gut's quarters (X 386 / Y 8)","Ruine im Unterreich, Ziel des Abstiegs aus dem Entweihten Tempel. Verschlossene vergoldete Truhe (X 163 / Y \u2212248) mit dem Helm des Niederstreckens; hinter einer Geheimt\xFCr eine Prunktruhe mit Falle (X 176 / Y \u2212247) mit der Luminous Armour.":"Ruin in the Underdark, the end of the descent from the Defiled Temple. Locked gilded chest (X 163 / Y \u2212248) with the Helmet of Smiting; behind a hidden door a trapped opulent chest (X 176 / Y \u2212247) with the Luminous Armour.","H\xE4ndlerin in der Ebonsee-Grotte nahe dem westlichen Eingang der Myconid-Kolonie. Verkauft das \xC4tzende Band, gelegentlich bis zu 2 Elixiere der H\xFCgelriesenst\xE4rke pro Rast und H\xFCgelriesen-Finger zum Brauen. In Akt 3 betreibt sie Bonecloaks Apotheke in der Unterstadt.":"Trader in the Ebonlake Grotto near the western entrance of the Myconid Colony. Sells the Caustic Band, occasionally up to 2 Elixirs of Hill Giant Strength per rest, and Hill Giant Fingers for brewing. In Act 3 she runs Bonecloak's Apothecary in the Lower City.","H\xE4ndlerin auf dem Pfad zum Rosymorn-Kloster. Verkauft die Gloves of Baneful Striking, das Periapt of Wound Closure und Elixiere der H\xFCgelriesenst\xE4rke.":"Trader on the Rosymorn Monastery Trail. Sells the Gloves of Baneful Striking, the Periapt of Wound Closure and Elixirs of Hill Giant Strength.","Vampir-affine Tr\xE4nkebrauerin bei ihrer Alchemie-Ausr\xFCstung in den Mondaufgangst\xFCrmen. Lass Astarion sie bei\xDFen und du bekommst den Trank der ewigen Kraft (+2 ST\xC4 dauerhaft). Verkauft den Risky Ring und Elixiere der H\xFCgelriesenst\xE4rke. In Akt 3 (falls sie lebt und Blut gespendet wurde) im Purpurtrunk in der Unterstadt.":"Vampire-obsessed potion brewer at her alchemy equipment in Moonrise Towers. Let Astarion bite her and you get the Potion of Everlasting Vigour (+2 STR permanently). Sells the Risky Ring and Elixirs of Hill Giant Strength. In Act 3 (if she lives and blood was donated) at the Crimson Draughts in the Lower City.","Tiefling-Schmied in der Mulde des Smaragdhains. Akt 1: Jagdkurzbogen. Akt 2 im Letzten Licht: schmiedet aus Infernalem Eisen die fehlerhaften H\xF6llend\xE4mmerungs-Teile \u2013 je ein Eisen pro Teil. Akt 3 in der Schmiede der Neun (Unterstadt): verkauft Legacy of the Masters und die Armour of Persistence.":"Tiefling smith in the Hollow of the Emerald Grove. Act 1: Hunting Shortbow. Act 2 at Last Light: forges the Flawed Helldusk pieces from Infernal Iron \u2013 one iron per piece. Act 3 at the Forge of the Nine (Lower City): sells Legacy of the Masters and the Armour of Persistence.",Eigenschaften:"Properties","So kommst du dran":"How to get it","Gro\xDFes Mausoleum in Reithwin (Schattenverfluchte Lande): verschlossene Reisetruhe in der S\xFCdostecke (X \u2212259 / Y \u2212882), Fingerfertigkeit SG 14":"Grand Mausoleum in Reithwin (Shadow-Cursed Lands): locked traveller's chest in the south-east corner (X \u2212259 / Y \u2212882), DC 14 Sleight of Hand","8 tempor\xE4re TP, wann immer du im Nahkampf einen Zauber wirkst \u2013 auch wenn er verfehlt oder das Ziel den Rettungswurf schafft. F\xFCr Droughnir mit Wrathful Smite, Magischer Waffe, Befehl oder Person festhalten mitten im Gemenge ein kostenloses Polster. Defensiv-Alternative zum Umhang des Schutzes.":"8 temporary HP whenever you cast a spell in melee \u2013 even if it misses or the target makes the save. For Droughnir, Wrathful Smite, Magic Weapon, Command or Hold Person in the thick of combat give a free buffer. Defensive alternative to the Cloak of Protection.","8 temp. TP bei Zauber im Nahkampf":"8 temp HP when casting in melee","Arcane Vivaciousness: Du bekommst 8 tempor\xE4re TP, nachdem du im Nahkampf einen Zauber gewirkt hast":"Arcane Vivaciousness: you gain 8 temporary HP after casting a spell in melee","L\xF6st auch aus, wenn der Zauberangriff verfehlt oder das Ziel den Rettungswurf schafft":"Also triggers if the spell attack misses or the target makes the save","\u201EIm Nahkampf\u201C hei\xDFt: Ein Nahkampf-Gegner bedroht dich (Zustand Bedroht) \u2013 Gegner mit Fernkampfwaffen z\xE4hlen nicht":`"In melee" means a melee enemy threatens you (Threatened condition) \u2013 enemies with ranged weapons don't count`,"Tempor\xE4re TP stapeln nicht: Neue ersetzen alte nur, wenn sie h\xF6her sind":"Temporary HP don't stack: new ones only replace old ones if higher","Ungew\xF6hnlich \xB7 70 gp \xB7 0,5 kg":"Uncommon \xB7 70 gp \xB7 0.5 kg","Akt 2, Schattenverfluchte Lande: das Gro\xDFe Mausoleum in Reithwin.":"Act 2, Shadow-Cursed Lands: the Grand Mausoleum in Reithwin.","Eing\xE4nge: vom n\xF6rdlichsten Weg des Friedhofs von Reithwin einen kleinen Hang hinauf, \xFCber die Ranke am Dach der Bibliothek im Haus der Heilung (X \u2212192 / Y 62) oder nach der Unheilvollen Spalte \xFCber die Felsen nach Westen.":"Entrances: from the northernmost path of the Reithwin Graveyard up a small slope, via the vine on the roof of the House of Healing library (X \u2212192 / Y 62), or after the Ominous Crevice over the rocks to the west.","Drinnen auf Fallen achten (D\xFCsen, Marmorplatten, Wasserspeier-K\xF6pfe): Wahrnehmung SG 10 deckt sie auf.":"Watch for traps inside (vents, marble plates, gargoyle heads): DC 10 Perception reveals them.","Die verschlossene Reisetruhe steht in der S\xFCdostecke (X \u2212259 / Y \u2212882): Fingerfertigkeit SG 14. Darin liegen auch Alchemie-Zutaten.":"The locked traveller's chest is in the south-east corner (X \u2212259 / Y \u2212882): DC 14 Sleight of Hand. It also holds alchemy ingredients.","Am Fischerhaus vor dem Mausoleum lauern verfluchte Kuo-Toa im Wasser (Wahrnehmung SG 30, um sie zu bemerken) \u2013 vorbereitet hingehen.":"At the fisher's shack in front of the mausoleum cursed kuo-toa lurk in the water (DC 30 Perception to spot them) \u2013 go in prepared.","Das Gem\xE4lde-R\xE4tsel im Mausoleum (Mondaufgangst\xFCrme, Trauer, General) \xF6ffnet den Weg zur Shar-Pr\xFCfung.":"The painting puzzle in the mausoleum (Moonrise Towers, Grief, General) opens the way to the Gauntlet of Shar.",'"Gale h\xE4lt ein Ziel mit Person festhalten \u2013 Auto-Krits f\xFCr deine Smites"':"Gale holds a target with Hold Person \u2013 auto-crits for your smites","Gale h\xE4lt ein Ziel mit Person festhalten \u2013 Auto-Krits f\xFCr deine Smites":"Gale holds a target with Hold Person \u2013 auto-crits for your smites","Schl\xF6sser und Fallen: vorschicken, bevor Droughnir Truhen \xF6ffnet":"Locks and traps: send him ahead before Droughnir opens chests","Mitten in eine Gruppe laufen und z\xFCnden \u2013 danach kann niemand fliehen. Gale h\xE4lt danach mit Person festhalten das gef\xE4hrlichste Ziel fest \u2013 Auto-Krits f\xFCr deine Smites.":"Run into the middle of a group and trigger it \u2013 then nobody can flee. Gale then holds the most dangerous target with Hold Person \u2013 auto-crits for your smites.","Duergar-Festung mit der Adamant-Schmiede. Auf dem Weg dorthin Korsar Greymon mit Jorgorals Gro\xDFschwert. Die Schmiede l\xE4sst sich zweimal anfeuern: Schienenpanzer f\xFCr Droughnir, Schuppenpanzer f\xFCr Schattenherz.":"Duergar stronghold with the Adamantine Forge. On the way there Corsair Greymon with Jorgoral's Greatsword. The forge can be fired twice: splint armour for Droughnir, scale mail for Shadowheart.","Tiefling-Schmied in der Mulde des Smaragdhains. Akt 2 im Letzten Licht: schmiedet aus Infernalem Eisen die fehlerhaften H\xF6llend\xE4mmerungs-Teile \u2013 je ein Eisen pro Teil. Akt 3 in der Schmiede der Neun (Unterstadt): verkauft Legacy of the Masters und die Armour of Persistence.":"Tiefling smith in the Hollow of the Emerald Grove. Act 2 at Last Light: forges the Flawed Helldusk pieces from Infernal Iron \u2013 one iron per piece. Act 3 at the Forge of the Nine (Lower City): sells Legacy of the Masters and the Armour of Persistence.","Beliebiger Bogen \u2013 Fallen und Schl\xF6sser sind seine Hauptrolle":"Any bow \u2013 traps and locks are his main role","Helm (Schattenherz)":"Helmet (Shadowheart)","Smaragdhain: Belohnung von Zevlor f\xFCr \u201ERettet die Fl\xFCchtlinge\u201C \u2013 nur wenn du die Geldbelohnung annimmst (Abgeschiedene Kammer, X \u221253 / Y 67)":"Emerald Grove: Zevlor's reward for \u201CSave the Refugees\u201D \u2013 only if you accept the monetary reward (Secluded Chamber, X \u221253 / Y 67)","Heilt Schattenherz einen Verb\xFCndeten, heilt sie sich selbst um 1W6 mit. So bleibt deine Heilerin l\xE4nger stehen \u2013 und kann dich weiter hochheilen.":"Whenever Shadowheart heals an ally, she also heals herself for 1d6. That keeps your healer standing longer \u2013 so she can keep healing you.","Umhang (Schattenherz)":"Cloak (Shadowheart)","Sturmufer-Tabernakel (Unterstadt): Vikar Humbletoes verkauft ihn (X 107 / Y \u221222)":"Stormshore Tabernacle (Lower City): sold by Vicar Humbletoes (X 107 / Y \u221222)","Kreuzrittermantel (Crusader's Mantle) als Grad-3-Zauber, l\xE4dt bei kurzer Rast. Verb\xFCndete in der Aura machen mit Waffenangriffen zus\xE4tzlich 1W4 glei\xDFenden Schaden \u2013 also auch Droughnir und Lae'zel.":"Crusader's Mantle as a level 3 spell, recharges on a short rest. Allies in the aura deal an extra 1d4 radiant damage with weapon attacks \u2013 Droughnir and Lae'zel included.","R\xFCstung (Schattenherz)":"Armour (Shadowheart)","Grymschmiede: Gussform Schuppenpanzer (X \u2212618 / Y 264) + Mithril-Erz an der Adamant-Schmiede":"Grymforge: Scale Mail Mould (X \u2212618 / Y 264) + Mithral Ore at the Adamantine Forge","Mittlere R\xFCstung mit RK 16 + GES (max. +2), keine kritischen Treffer und 1 Schaden weniger pro Treffer. Schattenherz steht dicht hinter dir \u2013 so h\xE4lt sie Segnen und Schutzgeister l\xE4nger.":"Medium armour with AC 16 + DEX (max +2), no critical hits and 1 less damage per hit. Shadowheart stands right behind you \u2013 this way she keeps Bless and Spirit Guardians up longer.","Handschuhe (Schattenherz)":"Gloves (Shadowheart)","Smaragdhain: Zevlor (Abgeschiedene Kammer, X \u221253 / Y 67) \u2013 Belohnung f\xFCr \u201ET\xF6te Kagha\u201C oder \u201EUntersuche Kagha\u201C, sonst stehlen oder pl\xFCndern":"Emerald Grove: Zevlor (Secluded Chamber, X \u221253 / Y 67) \u2013 reward for \u201CKill Kagha\u201D or \u201CInvestigate Kagha\u201D, otherwise steal or loot","Heilt Schattenherz dich, hast du 2 Runden Resistenz gegen Wucht-, Stich- und Hiebschaden von Waffenangriffen \u2013 genau das, was der Glaskanone fehlt.":"When Shadowheart heals you, you get 2 turns of resistance to bludgeoning, piercing and slashing damage from weapon attacks \u2013 exactly what the glass cannon lacks.","Stiefel (Schattenherz)":"Boots (Shadowheart)","Goblinlager: H\xE4ndler Grat (X \u221299 / Y 424)":"Goblin Camp: trader Grat (X \u221299 / Y 424)","Jede Heilung von Schattenherz gibt dem Ziel zus\xE4tzlich 3 tempor\xE4re TP \u2013 auch bei Gruppenheilung und bei vollen TP. Ein Puffer vor dem ersten Treffer.":"Every heal from Shadowheart also gives the target 3 temporary HP \u2013 with group heals and at full HP too. A buffer before the first hit.","Waffe (Schattenherz)":"Weapon (Shadowheart)","Rosymorn-Kloster: Quest \u201EFinde das Blut Lathanders\u201C":"Rosymorn Monastery: quest \u201CFind the Blood of Lathander\u201D","Legend\xE4rer +3-Streitkolben. F\xE4llt die Tr\xE4gerin auf 0 TP, steht sie 1\xD7 pro langer Rast mit 2W6 TP wieder auf und heilt alle Verb\xFCndeten im Umkreis von 9 m um 1W6.":"Legendary +3 mace. If the wearer drops to 0 HP, once per long rest she gets back up with 2d6 HP and heals all allies within 9 m for 1d6.","Amulett (Schattenherz)":"Amulet (Shadowheart)","Smaragdhain: tr\xE4gt Kagha im Inneren Heiligtum (X \u2212461 / Y \u221222); alternativ auf Kolls Warentisch in der High Hall (X 235 / Y 44)":"Emerald Grove: worn by Kagha in the Inner Sanctum (X \u2212461 / Y \u221222); alternatively on Koll's table of goods in the High Hall (X 235 / Y 44)","Wird Schattenherz geheilt, macht ihre Waffe 3 Runden lang +1W6 Giftschaden. Passt zur Kampf-Klerikerin mit dem Blut Lathanders, die sich selbst mitheilt (Wapira's Crown).":"Whenever Shadowheart is healed, her weapon deals +1d6 poison damage for 3 turns. Fits the front-line cleric with the Blood of Lathander who heals herself along the way (Wapira's Crown).","Sturmufer-Tabernakel (Unterstadt): zentrale Opfertruhe im Keller":"Stormshore Tabernacle (Lower City): central offering chest in the basement","+2 auf den Zauber-SG und eine zus\xE4tzliche Ladung G\xF6ttliche Macht (Channel Divinity) \u2013 mehr Untote vertreiben, mehr Strahlende Abwehr. F\xFCr Klerikerinnen gemacht, f\xFCr Paladine fast nutzlos.":"+2 to spell save DC and an extra Channel Divinity charge \u2013 more Turn Undead, more Radiance of the Dawn. Made for clerics, almost useless for paladins.","Ebonsee-Grotte: Omeluum nach \u201EHilf Omeluum, den Parasiten zu untersuchen\u201C (X 144 / Y 29)":"Ebonlake Grotto: Omeluum after \u201CHelp Omeluum Investigate the Parasite\u201D (X 144 / Y 29)","Jede Heilung von Schattenherz an anderen heilt 2 TP mehr. Mit Wapira's Crown, den Boots of Aid and Comfort und Hellrider's Pride wird jedes Heilende Wort zum Komplettpaket.":"Every heal Shadowheart casts on others heals 2 more HP. With Wapira's Crown, the Boots of Aid and Comfort and Hellrider's Pride every Healing Word becomes a full package.","Helm (Gale)":"Helmet (Gale)","Ebonsee-Grotte: H\xE4ndler Blurg (X 111 / Y \u221289)":"Ebonlake Grotto: trader Blurg (X 111 / Y \u221289)","Ein kostenloser Sengender Strahl (Scorching Ray, Grad 2) pro langer Rast \u2013 Burst gegen ein Ziel, das Droughnir gerade nicht erreicht.":"A free Scorching Ray (level 2) per long rest \u2013 burst against a target Droughnir can't reach right now.","Philgraves Anwesen (Unterstadt): Mystic Carrion verkauft sie (X 14 / Y \u2212160)":"Philgrave's Mansion (Lower City): sold by Mystic Carrion (X 14 / Y \u2212160)","+2 auf Zauber-SG und Zauberangriffe \u2013 Person festhalten und Monster festhalten sitzen deutlich \xF6fter, das hei\xDFt Auto-Krits f\xFCr deine Smites.":"+2 to spell DC and spell attacks \u2013 Hold Person and Hold Monster land much more often, which means auto-crits for your smites.","Umhang (Gale)":"Cloak (Gale)","Devil's Fee (Unterstadt): Helsik, sobald ihr Sonderangebot freigeschaltet ist (X \u221238 / Y 17)":"Devil's Fee (Lower City): Helsik, once her special stock is unlocked (X \u221238 / Y 17)","+1 auf Zauber-SG und Zauberangriffe plus Elemente absorbieren 1\xD7 pro kurzer Rast \u2013 Gale \xFCberlebt Feuerb\xE4lle besser.":"+1 to spell DC and spell attacks plus Absorb Elements once per short rest \u2013 Gale survives fireballs better.","R\xFCstung (Gale)":"Armour (Gale)","Smaragdhain: Truhe im Geheimgew\xF6lbe des Inneren Heiligtums (X 183 / Y \u221282); laut Gale-Questseite auch Belohnung f\xFCr \u201ERettet den Druiden Halsin\u201C":"Emerald Grove: trunk in the Hidden Vault of the Inner Sanctum (X 183 / Y \u221282); according to Gale's quest page also a reward for \u201CRescue the Druid Halsin\u201D","Kleidung (RK 10 + GES) mit K\xE4lteresistenz. Als Zauberer tr\xE4gt Gale keine R\xFCstung \u2013 so funktionieren Magierr\xFCstung und Bracers of Defence weiter.":"Clothing (AC 10 + DEX) with cold resistance. As a wizard Gale wears no armour \u2013 so Mage Armour and the Bracers of Defence keep working.","Ramazith's Tower (Tempelbezirk): in einem Globus der Unverwundbarkeit (X 4970 / Y 705)":"Ramazith's Tower (Temples district): inside a Globe of Invulnerability (X 4970 / Y 705)","Endgame-Robe: RK +2, +1 auf Zauber-SG und Zauberangriffe und Heilung, wenn Gale einen Rettungswurf gegen einen Zauber schafft.":"Endgame robe: AC +2, +1 to spell DC and spell attacks and healing whenever Gale succeeds on a saving throw against a spell.","Handschuhe (Gale)":"Gloves (Gale)","Verfallenes Dorf: vergoldete Truhe im Keller der Apotheke (X \u2212656 / Y \u2212370)":"Blighted Village: gilded chest in the Apothecary's Cellar (X \u2212656 / Y \u2212370)","+2 RK, solange Gale keine R\xFCstung und keinen Schild tr\xE4gt \u2013 Roben z\xE4hlen nicht als R\xFCstung, Magierr\xFCstung stapelt mit.":"+2 AC while Gale wears no armour and holds no shield \u2013 robes don't count as armour, Mage Armour stacks.","Stiefel (Gale)":"Boots (Gale)","Belegt Gale einen Feind mit einem Zustand, bekommt dieser 2 Runden Nachhall (Reverberation) dazu \u2013 senkt Rettungsw\xFCrfe gegen ST\xC4/GES/KON und stapelt zu Donnerschaden.":"Whenever Gale inflicts a condition on an enemy, it also gets 2 turns of Reverberation \u2013 lowers STR/DEX/CON saves and stacks into thunder damage.","Waffe (Gale)":"Weapon (Gale)","+1 auf Zauber-SG und Zauberangriffe schon in Akt 1 \u2013 wirkt als Stat-Stick, auch wenn Gale nie damit zuschl\xE4gt. Dazu Melfs S\xE4urepfeil 1\xD7 pro langer Rast.":"+1 to spell DC and spell attacks already in Act 1 \u2013 works as a stat stick even if Gale never swings it. Plus Melf's Acid Arrow once per long rest.","Ramazith's Tower (Tempelbezirk): im Globus der Unverwundbarkeit (X 4970 / Y 705)":"Ramazith's Tower (Temples district): inside the Globe of Invulnerability (X 4970 / Y 705)","Legend\xE4rer +2-Kampfstab: verst\xE4rkt Gales Zauber, l\xE4sst sich auf ein Element einstimmen und wirkt 1\xD7 pro langer Rast einen Zauber kostenlos.":"Legendary +2 quarterstaff: empowers Gale's spells, can be tuned to an element and casts a spell for free once per long rest.","Amulett (Gale)":"Amulet (Gale)","Stellt 1\xD7 pro langer Rast einen verbrauchten Zauberplatz bis Grad 3 wieder her \u2013 in Akt 2 ein zweites Hast f\xFCr Droughnir. Akt-1-Vorstufe zum Spellcrux Amulet.":"Restores one expended spell slot up to level 3 once per long rest \u2013 in Act 2 a second Haste for Droughnir. Act 1 forerunner of the Spellcrux Amulet.","Gef\xE4ngnis der Mondaufgangst\xFCrme: tr\xE4gt die W\xE4rterin (X 569 / Y \u2212650)":"Moonrise Towers Prison: worn by the Warden (X 569 / Y \u2212650)","Stellt 1\xD7 pro langer Rast als Bonusaktion einen verbrauchten Zauberplatz beliebigen Grades wieder her. Ab Akt 3 hei\xDFt das ein zweites Monster festhalten oder ein verbrauchter Grad-6-Platz zur\xFCck.":"Restores one expended spell slot of any level as a bonus action once per long rest. From Act 3 on that means a second Hold Monster or an expended level 6 slot back.","Ring (Gale)":"Ring (Gale)","Dunkelsicht 12 m f\xFCr den Menschen Gale \u2013 im Unterreich und in den Schattenverfluchten Landen sieht er Ziele, die er sonst nicht anvisieren kann.":"12 m darkvision for the human Gale \u2013 in the Underdark and the Shadow-Cursed Lands he sees targets he couldn't target otherwise.","Letztes Licht: tr\xE4gt Faust Marcus (X \u221263 / Y 163)":"Last Light Inn: worn by Fist Marcus (X \u221263 / Y 163)","Unsichtbarkeit und Verschwimmen je 1\xD7 pro langer Rast ohne Zauberplatz \u2013 Gale bleibt aus dem Fokus, w\xE4hrend er Hast auf Droughnir h\xE4lt.":"Invisibility and Blur once per long rest each without a spell slot \u2013 Gale stays out of focus while he keeps Haste on Droughnir.","Heilt sich 1W6 beim Heilen":"Heals herself 1d6 when healing","Kreuzrittermantel pro kurzer Rast":"Crusader's Mantle per short rest","RK 16 \xB7 keine Krits":"AC 16 \xB7 no crits","Geheilte: Resistenz gegen Waffen":"Healed: resistance to weapons","Geheilte: 3 temp. TP":"Healed: 3 temp HP","+3 \xB7 Rettung bei 0 TP":"+3 \xB7 rescue at 0 HP","Geheilt: +1W6 Gift":"Healed: +1d6 poison","+2 Zauber-SG \xB7 +1 G\xF6ttliche Macht":"+2 spell DC \xB7 +1 Channel Divinity","+2 TP beim Heilen anderer":"+2 HP when healing others","Sengender Strahl 1\xD7 pro Rast":"Scorching Ray once per rest","+2 Zauber-SG & Angriff":"+2 spell DC & attack","+1 Zauber-SG \xB7 Elemente absorbieren":"+1 spell DC \xB7 Absorb Elements","Resistenz gegen K\xE4lte":"Cold resistance","RK +2 \xB7 +1 Zauber-SG":"AC +2 \xB7 +1 spell DC","+2 RK ohne R\xFCstung":"+2 AC without armour","Zustand \u2192 Nachhall":"Condition \u2192 Reverberation","+1 Zauber-SG & Angriff":"+1 spell DC & attack","+2 \xB7 Element einstimmen":"+2 \xB7 tune to an element","Zauberplatz bis Grad 3 zur\xFCck":"Spell slot up to level 3 back","Zauberplatz beliebigen Grades zur\xFCck":"Spell slot of any level back","Dunkelsicht 12 m":"Darkvision 12 m","Unsichtbarkeit & Verschwimmen":"Invisibility & Blur","Crowning Glory: Heilt die Tr\xE4gerin eine andere Kreatur, erh\xE4lt sie selbst 1W6 TP":"Crowning Glory: when the wearer heals another creature, she regains 1d6 HP","L\xF6st bei jeder Heilung eines anderen aus \u2013 auch beim Heilenden Wort als Bonusaktion":"Triggers on every heal of someone else \u2013 Healing Word as a bonus action included","Ungew\xF6hnlich \xB7 90 gp \xB7 0,5 kg":"Uncommon \xB7 90 gp \xB7 0.5 kg","Nach dem Goblin-Angriff am Tor Zevlor ansprechen und die Unterquest \u201EBesiege die Goblins\u201C annehmen.":"After the goblin attack at the gate, talk to Zevlor and accept the sub-quest \u201CDefeat the Goblins\u201D.","Im Goblinlager die drei Anf\xFChrer ausschalten: Dror Ragzlin, Priesterin Gut und Minthara.":"Take out the three leaders in the Goblin Camp: Dror Ragzlin, Priestess Gut and Minthara.","Zur\xFCck in der Abgeschiedenen Kammer (X \u221253 / Y 67) die Geldbelohnung annehmen \u2013 Zevlor gibt dir einen geflickten Sack mit Gold und der Krone. Lehnst du das Gold ab, gibt es die Krone nicht.":"Back in the Secluded Chamber (X \u221253 / Y 67) accept the monetary reward \u2013 Zevlor hands you a patched-together sack with gold and the crown. Refuse the gold and there is no crown.","Stellst du dich auf die Seite der Goblins, ist die Krone verloren \u2013 sie ist nur auf diesem Weg erh\xE4ltlich.":"If you side with the goblins, the crown is lost \u2013 this is the only way to get it.","Kreuzrittermantel (Aktion): Wirken als Grad-3-Zauber, l\xE4dt bei kurzer Rast":"Crusader's Mantle (action): cast as a level 3 spell, recharges on a short rest","Verb\xFCndete in der Aura: +1W4 glei\xDFender Schaden bei Waffenangriffen":"Allies in the aura: +1d4 radiant damage on weapon attacks","Konzentration \u2013 nicht gleichzeitig mit Segnen oder Schutzgeistern":"Concentration \u2013 not at the same time as Bless or Spirit Guardians","Glei\xDFender Schaden: tr\xE4gt Droughnir die Luminous Armour, l\xF6st der Bonus auch die Radiating Shockwave aus":"Radiant damage: if Droughnir wears the Luminous Armour, the bonus also triggers Radiating Shockwave","Sehr selten \xB7 630 gp \xB7 0,5 kg":"Very rare \xB7 630 gp \xB7 0.5 kg","Akt 3: Das Sturmufer-Tabernakel liegt in der Unterstadt von Baldur's Gate.":"Act 3: the Stormshore Tabernacle is in the Lower City of Baldur's Gate.","Vikar Humbletoes h\xFCtet das Tabernakel und handelt mit dir \u2013 den Mantel kaufen oder stehlen.":"Vicar Humbletoes guards the tabernacle and trades with you \u2013 buy or steal the mantle.","Im gleichen Sortiment: The Reviving Hands und The Sacred Star.":"Same stock: The Reviving Hands and The Sacred Star.","Mittlere R\xFCstung: RK 16 + GES (max. +2) \u2013 Schattenherz hat die n\xF6tige \xDCbung":"Medium armour: AC 16 + DEX (max +2) \u2013 Shadowheart has the proficiency","Angreifer k\xF6nnen keine kritischen Treffer gegen die Tr\xE4gerin landen":"Attackers can't land critical hits on the wearer","Magical Plate: jeder eingehende Schaden \u22121":"Magical Plate: all incoming damage \u22121","Adamantine Backlash: Trifft sie ein Nahkampfangriff, taumelt der Angreifer 2 Runden (Reeling)":"Adamantine Backlash: when a melee attack hits her, the attacker is Reeling for 2 turns","Sehr selten \xB7 1300 gp \xB7 12 kg":"Very rare \xB7 1300 gp \xB7 12 kg","Gussform Schuppenpanzer: in der Grymschmiede nahe dem Wegpunkt der alten Schmiede, auf dem Boden neben einer Fackel (X \u2212618 / Y 264).":"Scale Mail Mould: in Grymforge near the Ancient Forge waypoint, on the floor next to a standing torch (X \u2212618 / Y 264).","Mithril-Erz an der Adamant-Schmiede einsammeln \u2013 wie beim Schienenpanzer von Droughnir.":"Collect Mithral Ore at the Adamantine Forge \u2013 just like for Droughnir's splint armour.","Die Schmiede l\xE4sst sich mit allen Erzen genau zweimal anfeuern: einmal Schienenpanzer f\xFCr Droughnir, einmal Schuppenpanzer f\xFCr Schattenherz.":"With all the ores the forge can be fired exactly twice: once splint armour for Droughnir, once scale mail for Shadowheart.","ST\xC4-Rettungsw\xFCrfe +1":"STR saving throws +1","Helm's Protection: Heilt die Tr\xE4gerin eine andere Kreatur, hat diese 2 Runden Resistenz gegen Wucht-, Stich- und Hiebschaden durch Waffenangriffe":"Helm's Protection: when the wearer heals another creature, it has resistance to bludgeoning, piercing and slashing damage from weapon attacks for 2 turns","bg3.wiki f\xFChrt dazu einen bekannten Bug":"bg3.wiki lists a known bug for this","Ungew\xF6hnlich \xB7 110 gp \xB7 0,5 kg":"Uncommon \xB7 110 gp \xB7 0.5 kg","Zevlor bittet dich nach dem Goblin-Angriff, Kagha vom Dornenritual abzubringen.":"After the goblin attack Zevlor asks you to stop Kagha's Rite of Thorns.","L\xF6se \u201EUntersuche Kagha\u201C (ihren Pakt mit den Schattendruiden aufdecken) oder \u201ET\xF6te Kagha\u201C \u2013 dann gibt er dir die Handschuhe.":"Finish \u201CInvestigate Kagha\u201D (expose her pact with the Shadow Druids) or \u201CKill Kagha\u201D \u2013 then he gives you the gloves.","Alternativ tr\xE4gt er sie: stehlen oder von ihm pl\xFCndern \u2013 kostet aber den Frieden im Hain.":"Alternatively he wears them: steal or loot them from him \u2013 but that costs you the peace in the grove.","Kreaturen, die die Tr\xE4gerin heilt, erhalten 3 tempor\xE4re TP":"Creatures the wearer heals gain 3 temporary HP","Wirkt bei Mehrfachzielen (z. B. Massen-Heilendes Wort) auf jedes Ziel":"Works on every target of multi-target heals (e.g. Mass Healing Word)","L\xF6st auch bei vollen TP aus \u2013 vor dem Kampf heilen ist also ein Schild":"Also triggers at full HP \u2013 healing before a fight works as a shield","Ungew\xF6hnlich \xB7 70 gp":"Uncommon \xB7 70 gp","Das Goblinlager friedlich betreten \u2013 Grat steht im Lager (X \u221299 / Y 424).":"Enter the Goblin Camp peacefully \u2013 Grat stands in the camp (X \u221299 / Y 424).","Kaufen, solange er handelt: Greifst du das Lager an, musst du ihn pl\xFCndern.":"Buy while he trades: if you attack the camp, you have to loot him.","Bei ihm gibt es auch das Gro\xDFschwert +1 f\xFCr Droughnir.":"He also sells the Greatsword +1 for Droughnir.","+3 Streitkolben: 1W6 + 3 Wuchtschaden":"+3 mace: 1d6 + 3 bludgeoning","F\xE4llt die Tr\xE4gerin auf 0 TP: 1\xD7 pro langer Rast heilt sie 2
