Der Verdorrte (Withers) den Respec f\xFCr den Rest des Durchgangs \u2013 auch nach einer sp\xE4teren R\xFCckkehr zum Eid.",tags:["quest","miss"]},{id:"o15",act:1,area:"Camp",t:"Schattenherz auf Dom\xE4ne des Lichts umskillen",d:"Ihre Trickserei-Dom\xE4ne hilft dir kaum. Licht gilt in Patch-8-Guides als beste Allround-Wahl, Leben, wenn sie die einzige Heilerin ist. Sie ist kein Eidbrecher, Der Verdorrte skillt sie ganz normal um. Erstes Talent f\xFCr sie: Kriegszauberer (War Caster), damit Segnen h\xE4lt.",tags:["quest"]},{id:"o12",act:1,area:"Camp",t:"Elixiere der H\xFCgelriesenst\xE4rke horten",d:"ST\xC4 21 bis zur langen Rast \u2013 bis zu den Panzerhandschuhen dein Standard-Elixier vor Bossk\xE4mpfen. Nur ein Elixier gleichzeitig aktiv.",tags:["item"]},{id:"o4",act:1,area:"Camp",t:"Kein Respec mehr bei Der Verdorrte",d:"Withers skillt Eidbrecher nicht um. Stufenaufstiege bewusst planen \u2013 Klasse hinzuf\xFCgen beim Aufstieg geht weiterhin normal. Umskillen nur nach Wiederherstellung des Eides (1.000 Gold).",tags:["quest","miss"]},{id:"a2",act:1,area:"Camp",t:"ST\xC4-17-Entscheidung treffen",d:"ST\xC4 17 behalten und mit Tantchen Ethels Haar (Auntie Ethel's Hair) vor Stufe 4 auf 18 bringen. Der alte Plan B (Umskillen bei Der Verdorrte) geht als Eidbrecher nicht mehr.",tags:["quest"]},{id:"a3",act:1,area:"Smaragdhain",t:"Gro\xDFschwert +1 (Greatsword +1) kaufen \u2013 \xDCbergangswaffe",d:"Ersatz f\xFCr die verpasste Immergl\xFCh-Klinge (Everburn Blade). Bei Dammon oft im Sortiment, bei Grat im Goblinlager garantiert. Rund 85 gp Basispreis. Alternative: Blutige Gro\xDFaxt (Blooded Greataxe).",tags:["item"]},{id:"a4",act:1,area:"Smaragdhain",t:"Das fl\xFCsternde Versprechen (The Whispering Promise) bei Volo",d:"Rund 84 gp. Volo verschwindet nach seinem Auftritt im Hain; Fallback ist Grat im Goblinlager. An Schattenherz geben.",tags:["item","miss"]},{id:"a5",act:1,area:"Smaragdhain",t:"Jagdkurzbogen (Hunting Shortbow) f\xFCr Astarion",d:"Bei Dammon (laut Nizar GG). \xDCbergangsbogen f\xFCr Astarion, bis der Bogen der Todesfee da ist.",tags:["item"]},{id:"a7",act:1,area:"Smaragdhain \u2192 Uferteehaus",t:"Quest \u201ERettet Mayrina\u201C (Tantchen Ethel) starten",d:"Ethel im Hain ansprechen; die Spur f\xFChrt zum Uferteehaus (Riverside Teahouse).",tags:["quest"]},{id:"a8",act:1,area:"Eulenb\xE4renh\xF6hle",t:"Mondtropfenanh\xE4nger (Moondrop Pendant)",d:"Die Sel\xFBne-Truhe ist versiegelt: Gebetsblatt hinter der Sel\xFBne-Statue finden (Wahrnehmung) und davor vorlesen. Effekt: unter 50 % TP keine Gelegenheitsangriffe.",tags:["item"]},{id:"a9",act:1,area:"Ethels Versteck",t:"Tantchen Ethels Haar \u2192 +1 ST\xC4",d:"Nur im Versteck (nicht im Teehaus) unter etwa 20 % TP bringen und warten \u2013 sie feilscht um ihr Leben. Nicht verstummen lassen! Mayrina kannst du per \xDCberzeugen trotzdem retten. Das Haar kann Werte \xFCber 20 heben. ST\xC4 oder CHA? Siehe Tab \u201EWege\u201C \u2013 kurz: ST\xC4 bringt dir in Akt 1\u20132 sofort +1 Treffer und Schaden, CHA erst mit weiteren ungeraden Boni.",tags:["item","miss","quest"]},{id:"a9b",act:1,area:"Ethels Versteck",t:"Trank \u201EGebrochene Versprechen\u201C (Broken Promises) NICHT trinken",d:"Hexentrank aus Ethels Werkstatt: +2 ST\xC4 bis zur langen Rast, danach \u22121 ST\xC4 dauerhaft. Verkaufen oder liegen lassen.",tags:["item","miss"]},{id:"a10",act:1,area:"Goblinlager",t:"Grat: Gro\xDFschwert +1 / Das fl\xFCsternde Versprechen (Fallback)",d:"Falls im Hain verpasst.",tags:["item"]},{id:"a11",act:1,area:"Zerschmettertes Heiligtum",t:"Handschuhe des grummelnden Verlierers (Gloves of the Growling Underdog)",d:"Dror Ragzlins Schatzkisten hinter dem Eisentor (X 298 / Y 66): SG 18 Fingerfertigkeit oder Drors Schl\xFCssel. Vorteil auf Angriffe, wenn 2+ Gegner nahe dem Ziel stehen.",tags:["item"]},{id:"a12",act:1,area:"Zerschmettertes Heiligtum",t:"Stiefel des Schreitens (Boots of Striding) \u2013 Minthara",d:"Guter Pfad: Minthara besiegen und pl\xFCndern. W\xE4hrend Konzentration nicht umsto\xDFbar, Konzentrationszauber geben Schwung \u2013 ideal mit Krone des Wahnsinns und Hast.",tags:["item","miss"]},{id:"a13",act:1,area:"Sel\xFBnitischer Au\xDFenposten (Unterreich)",t:"Helm des Niederstreckens (Helmet of Smiting)",d:"Verschlossene vergoldete Truhe (X 163 / Y \u2212248). Zugang z. B. \xFCber den Geheimgang im Zerschmetterten Heiligtum.",tags:["item"]},{id:"a14",act:1,area:"Unterreich \u2013 Myconid-Kolonie",t:"\xC4tzendes Band (Caustic Band) bei Derryth Bonecloak",d:"+2 S\xE4ureschaden pro Waffentreffer \u2013 doppelt wertvoll ab Zus\xE4tzlicher Angriff. Derryth verkauft es in Akt 3 erneut.",tags:["item"]},{id:"a15",act:1,area:"Boot zur Grymschmiede",t:"Jorgorals Gro\xDFschwert (Jorgoral's Greatsword) \u2013 Korsar Greymon",d:"+1, 2W6+1 Hieb, Spezialaktion Kolossaler Ansturm (Colossal Onslaught). Kaufen oder pl\xFCndern \u2013 Greymon NICHT ins Wasser sto\xDFen, sonst ist die Beute weg.",tags:["item","miss"]},{id:"o3",act:1,area:"Boot zur Grymschmiede",t:"Bogen der Todesfee (Bow of the Banshee) f\xFCr Astarion \u2013 Korsar Greymon",d:"Seltener +1-Kurzbogen: kann bei Treffer Ver\xE4ngstigt ausl\xF6sen und gibt +1W4 auf Angriff und Schaden gegen ver\xE4ngstigte Ziele. Auf dem Boot pl\xFCndern oder sp\xE4ter bei Greymon in der Grymschmiede kaufen.",tags:["item","miss"]},{id:"a16",act:1,area:"Grymschmiede",t:"Adamant-Schienenpanzer (Adamantine Splint Armour) schmieden",d:"Schienen-Gussform (Splint Mould) bei X \u2212593 / Y 311 nahe Wegpunkt Alte Schmiede, dazu Mithrilerz. Danach Grym besiegen. RK 18, immun gegen Krits.",tags:["item","quest"]},{id:"a17",act:1,area:"Gebirgspass",t:"Lae'zels Quest / Rosymorn-Kloster (optional)",d:"H\xE4ndler und Loot im Pass mitnehmen.",tags:["quest"]},{id:"o14",act:1,area:"Aufgestiegene Stra\xDFe",t:"Schwert der Gerechtigkeit (Sword of Justice) \u2013 Anders",d:"Ungew\xF6hnliches +1-Gro\xDFschwert mit dem Zauber Tyrs Schutz. Anders gibt es dir f\xFCr Karlachs Kopf \u2013 oder du nimmst es ihm ab, wenn du dich auf Karlachs Seite stellst und ihn besiegst (empfohlen, so bekommst du Karlach als Gef\xE4hrtin).",tags:["item","miss"]},{id:"o13",act:1,area:"Gebirgspass \u2013 Krippe Y'llek",t:"Ring des seltsamen Leiters (Strange Conduit Ring)",d:"Truhe in der Kammer des Inquisitors in der Krippe Y'llek. +1W4 psychisch auf Waffenangriffe, solange du dich auf einen Zauber konzentrierst \u2013 mit Magische Waffe ab Stufe 5 praktisch dauerhaft.",tags:["item","miss"]},{id:"o10",act:1,area:"Gebirgspass \u2013 Pfad zum Rosymorn-Kloster",t:"Gloves of Baneful Striking bei Lady Esther",d:"Ungew\xF6hnlich, sp\xE4tes Akt 1. Erreichbar \xFCber den Gebirgspass oder von der Goblinlager-Seite. Nach jedem Waffentreffer \u22121W4 auf den Rettungswurf des Ziels gegen deinen n\xE4chsten Zauber.",tags:["item"]},{id:"a18",act:1,area:"Point of no Return",t:"Vor Akt 2: Akt-1-Restliste pr\xFCfen",d:"Ethels Haar, Helm (Au\xDFenposten), Adamant-R\xFCstung, Jorgoral, H\xE4ndlerk\xE4ufe. Nach dem \xDCbergang ins Schattenverfluchte Land kommst du nicht zur\xFCck.",tags:["miss","quest"]},{id:"b1",act:2,area:"Letztes Licht (Last Light Inn)",t:"Umhang des Schutzes (Cloak of Protection) \u2013 Quartiermeisterin Talli",d:"+1 RK, +1 auf alle Rettungsw\xFCrfe. F\xE4llt das Gasthaus, stirbt Talli \u2013 sofort kaufen.",tags:["item","miss"]},{id:"o16",act:2,area:"Letztes Licht (Last Light Inn)",t:"Fehlerhafte H\xF6llend\xE4mmerungs-Handschuhe (Flawed Helldusk Gloves) bei Dammon",d:"Dammon schmiedet aus Infernalem Eisen in fester Reihenfolge: erst R\xFCstung, dann Helm, dann Handschuhe \u2013 du brauchst also drei St\xFCck. +1W4 Feuer auf jeden Waffenangriff.",tags:["item","miss"]},{id:"b2",act:2,area:"Letztes Licht",t:"Gasthaus und Isobel sch\xFCtzen",d:"Sichert H\xE4ndler und Story-Pfad.",tags:["quest","miss"]},{id:"b3",act:2,area:"Level 5",t:"Zus\xE4tzlicher Angriff + Magische Waffe einsatzbereit",d:"Neue Eidzauber: Krone des Wahnsinns (Crown of Madness) und Dunkelheit (Darkness). Magische Waffe (Magic Weapon) vorbereiten. Gale lernt Hast (Haste) und castet sie auf Droughnir; Person festhalten \xFCbernimmt ebenfalls Gale.",tags:["quest"]},{id:"o7",act:2,area:"Schattenverfluchte Lande",t:"Ab Stufe 6: Schatten und Gespenster kontrollieren",d:"Schatten und Gespenster (Wraiths) sind Level 5. Bonus: Wer im Schattenfluch stirbt, steht nach ein, zwei Runden als Untoter wieder auf und l\xE4sst sich dann kontrollieren.",tags:["quest"]},{id:"b4",act:2,area:"Mondaufgangst\xFCrme",t:"Trank der ewigen Kraft (Potion of Everlasting Vigour): +2 ST\xC4 dauerhaft",d:"Araj Oblodra im Erdgeschoss ansprechen und Astarion \xFCberreden, sie zu bei\xDFen. Erledigen, bevor du die T\xFCrme st\xFCrmst.",tags:["item","miss"]},{id:"o17",act:2,area:"Shar-Pr\xFCfung (Gauntlet of Shar)",t:"Ring des kaltherzigen Leuchtens (Callous Glow Ring)",d:"Prunktruhe ganz rechts in der Schatzkammer neben Balthazar; die T\xFCr hat SG 30 Fingerfertigkeit. +2 glei\xDFend gegen beleuchtete Ziele \u2013 bei jeder Schadensinstanz.",tags:["item"]},{id:"o5",act:2,area:"Level 7 \u2013 vor dem Haus der Heilung",t:"Aura des Hasses aktivieren",d:"+CHA-Mod Schaden auf Nahkampfwaffenangriffe f\xFCr dich und alle Unholde und Untoten in 3 m \u2013 auch feindliche. Einmal anklicken, danach bleibt sie aktiv. Feindliche Untote neben dir zuerst t\xF6ten.",tags:["quest"]},{id:"o6",act:2,area:"Haus der Heilung",t:"Ab Stufe 8: Malus Thorm kontrollieren",d:"Malus Thorm ist Level 7 und \u2013 anders als Balthazar und die anderen Thorms \u2013 nicht immun. So umgehst du den Bosskampf gro\xDFteils. Die untoten Krankenschwestern (Level 6) gehen schon ab Stufe 7.",tags:["quest","miss"]},{id:"b5",act:2,area:"Level 6",t:"Aura des Schutzes aktiv \u2013 Gruppe eng halten",d:"+CHA-Mod auf Rettungsw\xFCrfe f\xFCr alle Verb\xFCndeten in 3 m.",tags:["quest"]},{id:"c1",act:3,area:"Haus der Hoffnung \u2013 Archiv",t:"Panzerhandschuhe der H\xFCgelriesenst\xE4rke (Gauntlets of Hill Giant Strength)",d:"Setzen ST\xC4 auf 23. Sockelfalle: SG 20 Fingerfertigkeit. Kein Respec n\xF6tig \u2013 dein investierter ST\xC4-Wert ist dann einfach \xFCbersch\xFCssig.",tags:["item"]},{id:"c2",act:3,area:"Haus der Hoffnung \u2013 Archiv",t:"Amulett der gr\xF6\xDFeren Gesundheit (Amulet of Greater Health)",d:"Setzt KON auf 23 \u2013 im gleichen Raum wie die Panzerhandschuhe.",tags:["item"]},{id:"c3",act:3,area:"Haus der Hoffnung",t:"H\xF6llend\xE4mmerungs-R\xFCstung (Helldusk Armour)",d:"Raphael besiegen. RK 21, Fliegen ohne Konzentration, Feuerresistenz (f\xFCr dich doppelt). Die passenden Stiefel tr\xE4gt Gortash (Wyrmfels).",tags:["item","miss"]},{id:"o18",act:3,area:"Unterstadt \u2013 Haus der Trauer",t:"Spiegel des Verlusts (Mirror of Loss): +2 CHA",d:"Nur der Spiegel im Haus der Trauer (Schattenherz' Quest) funktioniert, der in der Shar-Pr\xFCfung ist zerbrochen. SG 25 Arkane Kunde und SG 20 Religion, dann eine Erinnerung opfern: \u22122 auf ein unwichtiges Attribut (mit Fluch brechen entfernbar), +2 dauerhaft auf CHA.",tags:["item","miss"]},{id:"c4",act:3,area:"Drachenweg unter Wyrmfels",t:"Baldurans Riesent\xF6ter (Balduran's Giantslayer)",d:"Legend\xE4r, +3. Beide Drachenkopf-Fackeln mit Blitzschaden treffen, vier Pr\xFCfungen bestehen, Ansur besiegen. Die Passive addiert deinen ST\xC4-Modifikator ein zweites Mal, Vorteil gegen gro\xDFe Ziele \u2013 deine Endwaffe.",tags:["item"]},{id:"o19",act:3,area:"Drachenweg unter Wyrmfels",t:"Helm des Balduran (Helm of Balduran)",d:"Auf dem Altar hinter Ansur. Heilt 2 TP pro Zug \u2013 kleine Dauer-Regeneration f\xFCr die Glaskanone.",tags:["item"]},{id:"c5",act:3,area:"Camp",t:"Handschuhe und Amulett anlegen \u2013 ohne Respec",d:"Als Eidbrecher skillt Der Verdorrte nicht um. Panzerhandschuhe (ST\xC4 23) und Amulett (KON 23) wirken trotzdem voll; CHA hebst du per Talent auf 18.",tags:["quest"]},{id:"c6",act:3,area:"Vorrat",t:"Elixiere der H\xFCgelriesenst\xE4rke (ST\xC4 21) f\xFCr Bosse",d:"Bis die Handschuhe da sind, je ein Elixier pro Bosskampf.",tags:["item"]}],th=["a1","o2","o1","o11","o amantine Splint Armour",r:"veryrare",w:"Adamantschmiede, Grymschmiede (Schienen-Gussform + Mithrilerz)",y:"RK 18, Krit-Immunit\xE4t \u2013 perfekt f\xFCr einen Nahk\xE4mpfer mitten im Gedr\xE4nge."},{slot:"R\xFCstung",ic:"armor",act:"Akt 3",n:"H\xF6llend\xE4mmerungs-R\xFCstung",en:"Helldusk Armour",r:"legendary",w:"Raphael besiegen, Haus der Hoffnung",y:"RK 21, Fliegen ohne Konzentration, automatische \xDCbung. Die Feuerresistenz hast du als Roter Drachenbl\xFCtiger schon \u2013 f\xFCr die Glaskanone z\xE4hlt die RK."},{slot:"Helm",ic:"helm",act:"Akt 1",n:"Helm des Niederstreckens",en:"Helmet of Smiting",r:"uncommon",w:"Sel\xFBnitischer Au\xDFenposten, vergoldete Truhe (X 163 / Y \u2212248)",y:"Temp-TP in H\xF6he des CHA-Mods, wenn ein Smite-Zauber einen Zustand ausl\xF6st; +1 auf KON-Rettungsw\xFCrfe (Konzentration f\xFCr Krone des Wahnsinns/Hast)."},{slot:"Handschuhe",ic:"gloves",act:"Akt 1",n:"Handschuhe des grummelnden Verlierers",en:"Gloves of the Growling Underdog",r:"uncommon",w:"Zerschmettertes Heiligtum, Drors Schatz (SG 18 oder Schl\xFCssel)",y:"Gratis-Vorteil gleicht den GWM-Malus aus und verdoppelt fast deine Krit-Chance."},{slot:"Handschuhe",ic:"gloves",act:"Akt 2",n:"Fehlerhafte H\xF6llend\xE4mmerungs-Handschuhe",en:"Flawed Helldusk Gloves",r:"rare",w:"Dammon, Letztes Licht \u2013 aus Infernalem Eisen (drittes geschmiedetes Teil)",y:"+1W4 Feuer auf jeden Waffenangriff, ST\xC4-Rettungsw\xFCrfe +1. Bei 3\u20136 Treffern pro Zug sp\xFCrbar; Teufel und D\xE4monen sind oft feuerresistent."},{slot:"Handschuhe",ic:"gloves",act:"Akt 3",n:"Panzerhandschuhe der H\xFCgelriesenst\xE4rke",en:"Gauntlets of Hill Giant Strength",r:"veryrare",w:"Haus der Hoffnung, Archiv (Falle SG 20)",y:"ST\xC4 23 \u2013 als Eidbrecher ohne Respec, der investierte ST\xC4-Wert ist dann einfach \xFCbersch\xFCssig."},{slot:"Helm",ic:"helm",act:"Akt 3",n:"Helm des Balduran",en:"Helm of Balduran",r:"legendary",w:"Altar neben Ansur im Drachenheiligtum, Drachenweg (X 636 / Y \u2212964)",y:"+ 1.000 Gold wieder her oder best\xE4tigt dich als Eidbrecher. Niemals t\xF6ten \u2013 sonst gibt es f\xFCr den Rest des Spiels keinen Respec mehr."},{id:"npc-dammon",n:"Dammon",en:"Dammon",kind:"H\xE4ndler",act:1,loc:["loc-grove","loc-lastlight"],d:"Tiefling-Schmied. Akt 1: Gro\xDFschwert +1 (oft) und Jagdkurzbogen. Akt 2 im Letzten Licht: schmiedet aus Infernalem Eisen die fehlerhaften H\xF6llend\xE4mmerungs-Teile."},{id:"npc-volo",n:"Volo",en:"Volo",kind:"H\xE4ndler",act:1,loc:["loc-grove"],d:"Barde mit kurzem Auftritt im Hain. Verkauft Das fl\xFCsternde Versprechen f\xFCr rund 84 gp \u2013 danach verschwindet er."},{id:"npc-grat",n:"Grat",en:"Grat",kind:"H\xE4ndler",act:1,loc:["loc-goblin"],d:"Goblin-H\xE4ndler im Lager. Garantiert Gro\xDFschwert +1, Fallback f\xFCr Das fl\xFCsternde Versprechen."},{id:"npc-derryth",n:"Derryth Bonecloak",en:"Derryth Bonecloak",kind:"H\xE4ndler",act:1,loc:["loc-myconid"],d:"H\xE4ndlerin in der Myconid-Kolonie, verkauft das \xC4tzende Band \u2013 in Akt 3 erneut."},{id:"npc-greymon",n:"Korsar Greymon",en:"Corsair Greymon",kind:"H\xE4ndler",act:1,loc:["loc-grymforge"],d:"Duergar auf dem Flo\xDF zur Grymschmiede. Tr\xE4gt Jorgorals Gro\xDFschwert und den Bogen der Todesfee. Nicht ins Wasser sto\xDFen \u2013 sonst ist die Beute weg."},{id:"npc-esther",n:"Lady Esther",en:"Lady Esther",kind:"H\xE4ndler",act:1,loc:["loc-rosymorn"],d:"H\xE4ndlerin auf dem Pfad zum Rosymorn-Kloster. Verkauft die Gloves of Baneful Striking."},{id:"npc-talli",n:"Quartiermeisterin Talli",en:"Quartermaster Talli",kind:"H\xE4ndler",act:2,loc:["loc-lastlight"],d:"Verkauft den Umhang des Schutzes. F\xE4llt das Letzte Licht, stirbt sie \u2013 sofort kaufen."},{id:"npc-araj",n:"Araj Oblodra",en:"Araj Oblodra",kind:"Quest",act:2,loc:["loc-moonrise"],d:"Vampir-affine Tr\xE4nkebrauerin. Lass Astarion sie bei\xDFen und du bekommst den Trank der ewigen Kraft (+2 ST\xC4 dauerhaft)."},{id:"npc-ethel",n:"Tantchen Ethel",en:"Auntie Ethel",kind:"Gegner",act:1,loc:["loc-grove","loc-ethel"],d:"Gr\xFCnes Weib in Verkleidung. Unter 20 % TP feilscht sie um ihr Leben \u2013 deine Chance auf das Haar."},{id:"npc-dror",n:"Dror Ragzlin",en:"Dror Ragzlin",kind:"Gegner",act:1,loc:["loc-goblin"],d:"Goblin-Anf\xFChrer im Heiligtum. Hinter dem Eisentor (X 298 / Y 66) liegen seine Schatzkisten mit den Handschuhen des grummelnden Verlierers."},{id:"npc-minthara",n:"Minthara",en:"Minthara",kind:"Gegner",act:1,loc:["loc-goblin"],d:"Drow-Anf\xFChrerin. Auf dem guten Pfad besiegen: Sie tr\xE4gt die Stiefel des Schreitens."},{id:"npc-anders",n:"Anders",en:"Anders",kind:"Gegner",act:1,loc:["loc-risen"],d:"Falscher Tyr-Paladin, jagt Karlach. Besiegst du ihn, geh\xF6rt das Schwert der Gerechtigkeit dir \u2013 und Karlach schlie\xDFt sich an."},{id:"npc-grym",n:"Grym",en:"Grym",kind:"Gegner",act:1,loc:["loc-grymforge"],d:"Adamant-Golem der Schmiede. Erscheint, sobald du das Lavaventil zum ersten Mal \xF6ffnest; gilt als immun gegen Klingen und Zauber. Droppt den Grymskull-Helm."},{id:"npc-malus",n:"Malus Thorm",en:"Malus Thorm",kind:"Gegner",act:2,loc:["loc-healing"],d:"Level-7-Boss ohne Immunit\xE4t gegen Untote kontrollieren \u2013 ab deiner Stufe 8 einfach \xFCbernehmen."},{id:"npc-raphael",n:"Raphael",en:"Raphael",kind:"Gegner",act:3,loc:["loc-hope"],d:"Teufel und Hausherr. Besiegst du ihn, bekommst du die H\xF6llend\xE4mmerungs-R\xFCstung."},{id:"npc-ansur",n:"Ansur",en:"Ansur",kind:"Gegner",act:3,loc:["loc-wyrmway"],d:"Bronzedrache und einstiger Gef\xE4hrte Baldurans. Droppt Baldurans Riesent\xF6ter."}],qd=[{id:"tut-ethel",n:"Tantchen Ethels Haar",loc:"loc-ethel",steps:["Kampf im Versteck austragen (Uferteehaus \u2192 \xFCberwucherter Tunnel). Im Teehaus selbst verhandelt sie nicht um Mayrina.","Ethel unter 20 % ihrer maximalen TP bringen. Nicht verstummen lassen und nicht bewusstlos schlagen \u2013 dann kann sie nicht verhandeln.","In ihrem Zug bettelt sie: SG 20 auf T\xE4uschen oder Einsch\xFCchtern. Erfolg = Haar plus befreite Mayrina, Ethel kommt frei. Misslingt eine Probe, ist die andere gesperrt.","Haar essen und ein Attribut w\xE4hlen: +1 dauerhaft, auch \xFCber 20. Wirkt nicht auf Werte, die Items oder Elixiere fest setzen.","Als Eidbrecher egal: Paladine brechen durch einen Deal mit ihr ihren Eid \u2013 deiner ist schon gebrochen."]},{id:"tut-forge",n:"Adamant-Schienenpanzer schmieden",loc:"loc-grymforge",steps:["Schienen-Gussform holen: X \u2212593 / Y 311 nahe dem Wegpunkt Alte Schmiede.","Mithrilerz holen \u2013 es gibt nur zwei: am Lavafluss s\xFCdwestlich des Wegpunkts (X \u2212645 / Y 255) und in einem Torbogen \xF6stlich des Abstiegs (X \u2212558 / Y 278).","\xDCber den Felspfad auf die Plattform (etwa X \u2212568 / Y 243). Erz und Gussform in ihre Kammern legen.","Hebel in der Mitte des Podests ziehen \u2013 der Hammer senkt sich. Dann die Plattform mit dem Knopf dahinter absenken.","Lavaventil am Ofen \xF6ffnen. Achtung: Beim ersten \xD6ffnen erscheinen Grym und Magma-Mephiten.","Hebel erneut ziehen, Gussform auswerfen, R\xFCstung aufheben. Tipp: Droughnir ist Gildenhandwerker \u2013 hebt er das erste geschmiedete St\xFCck auf, bekommt er die Inspiration Art Endures."]},{id:"tut-moondrop",n:"Mondtropfenanh\xE4nger",loc:"loc-owlbear",steps:["In der Eulenb\xE4renh\xF6hle hinten zur versiegelten Sel\xFBne-Truhe.","Hinter der Sel\xFBne-Statue das Gebetsblatt suchen (Wahrnehmung).","Das Gebet vor der Statue vorlesen \u2013 die Truhe \xF6ffnet sich. Effekt des Anh\xE4ngers: unter 50 % TP keine Gelegenheitsangriffe."]},{id:"tut-wyrmway",n:"Drachenweg & Riesent\xF6ter",loc:"loc-wyrmway",steps:["Im Westfl\xFCgel des Wyrmfelsen-Gef\xE4ngnisses beide Drachenkopf-Fackeln mit Blitzschaden treffen. Die Flammen werden blau, die Wand dazwischen wird zur Illusion.","Pr\xFCfung der Gerechtigkeit (ganz links): Die Antwort lautet \u201EDie Zelle\u201C.","Pr\xFCfung der Einsicht (unsichtbarer Pfad zwischen den linken Statuen): Fliegende B\xFCcher mit SG 15 Fingerfertigkeit fangen und lesen.","Pr\xFCfung der Strategie (unten rechts): Lanzenbrett-R\xE4tsel \u2013 Schwarz in zwei Z\xFCgen mattsetzen, drei Versuche.","Pr\xFCfung des Mutes (rechte H\xF6hle): Vier Runden Kampf, der Fackeltr\xE4ger muss bei Bewusstsein bleiben. Kristalle zerschlagen f\xFCr Elementarresistenz.","Danach \xF6ffnet sich das Heiligtum: Ansur besiegen \u2013 er droppt Baldurans Riesent\xF6ter. Der Helm des Balduran liegt auf dem Sockel hinter ihm."]},{id:"tut-archive",n:"Archiv im Haus der Hoffnung",loc:"loc-hope",steps:["Im Archiv liegen die Panzerhandschuhe der H\xFCgelriesenst\xE4rke auf einem Sockel; das Amulett der gr\xF6\xDFeren Gesundheit ist im selben Raum.","Falle vor dem Nehmen entsch\xE4rfen: SG 20 Fingerfertigkeit.","Alternative: einen Gegenstand mit gleichem Gewicht auf den Sockel legen und dann die Handschuhe nehmen \u2013 so sparst du dir Wahrnehmung und Entsch\xE4rfen.","Kein Respec n\xF6tig: Handschuhe und Amulett setzen ST\xC4 und KON auch als Eidbrecher auf 23."]},{id:"tut-mirror",n:"Spiegel des Verlusts",loc:"loc-grief",steps:["Der Spiegel in der Shar-Pr\xFCfung (Akt 2) ist zerbrochen \u2013 nutzbar ist nur der im Haus der Trauer (Akt 3).","Probe auf Arkane Kunde (SG 25) und Religion (SG 20) bestehen.","Eine Erinnerung opfern: \u22122 auf ein unwichtiges Attribut, daf\xFCr +2 dauerhaft auf CHA. Die \u22122 l\xE4sst sich mit Fluch brechen (Remove Curse) entfernen.","Jede Figur bekommt den Bonus nur einmal."]},{id:"tut-knight",n:"Eid gebrochen \u2013 was jetzt?",loc:"loc-camp",steps:["Nach dem Eidbruch sind deine Eid-F\xE4higkeiten gesperrt, bis du im Lager mit dem Eidbrecher-Ritter sprichst.","Eidbrecher annehmen (kostenlos) \u2013 oder den alten Eid f\xFCr 1.000 Gold wiederherstellen (danach 2.000, ab dem dritten Mal 10.000).","Als Eidbrecher: keine Grunds\xE4tze, aber kein Respec bei Der Verdorrte.","Den Ritter niemals t\xF6ten \u2013 sonst gibt es f\xFCr den Rest des Spiels keinen Respec mehr."]}],vt=Object.fromEntries(In.map(e=>[e.id,e])),oi=Object.fromEntries(_a.map(e=>[e.id,e])),gs=Object.fromEntries(qd.map(e=>[e.id,e])),yn={a1:{loc:["loc-ruins"]},o2:{loc:["loc-ruins"]},o1:{loc:["loc-camp"],npc:["npc-knight"],tut:"tut-knight"},o11:{loc:["loc-camp"],npc:["npc-knight"],tut:"tut-knight"},o15:{loc:["loc-camp"],npc:["npc-withers"]},o4:{loc:["loc-camp"],npc:["npc-withers"]},a2:{npc:["npc-ethel"],tut:"tut-ethel"},a3:{loc:["loc-grove","loc-goblin"],npc:["npc-dammon","npc-grat"]},a4:{loc:["loc-grove"],npc:["npc-volo","npc-grat"]},a5:{loc:["loc-grove"],npc:["npc-dammon"]},a6:{},a7:{loc:["loc-grove","loc-ethel"],npc:["npc-ethel"]},a8:{loc:["loc-owlbear"],tut:"tut-moondrop"},a9:{loc:["loc-ethel"],npc:["npc-ethel"],tut:"tut-ethel"},a9b:{loc:["loc-ethel"]},a10:{loc:["loc-goblin"],npc:["npc-grat"]},a11:{loc:["loc-goblin"],npc:["npc-dror"]},a12:{loc:["loc-goblin"],npc:["npc-minthara"]},a13:{loc:["loc-outpost"]},a14:{loc:["loc-myconid"],npc:["npc-derryth"]},a15:{loc:["loc-grymforge"],npc:["npc-greymon"]},o3:{loc:["loc-grymforge"],npc:["npc-greymon"]},a16:{loc:["loc-grymforge"],npc:["npc-grym"],tut:"tut-forge"},o14:{loc:["loc-risen"],npc:["npc-anders"]},o13:{loc:["loc-creche"]},o10:{loc:["loc-rosymorn"],npc:["npc-esther"]},b1:{loc:["loc-lastlight"],npc:["npc-talli"]},b2:{loc:["loc-lastlight"]},o16:{loc:["loc-lastlight"],npc:["npc-dammon"]},b4:{loc:["loc-moonrise"],npc:["npc-araj"]},o17:{loc:["loc-gauntlet"]},o7:{loc:["loc-shadowlands"]},o6:{loc:["loc-healing"],npc:["npc-malus"]},c1:{loc:["loc-hope"],tut:"tut-archive"},c2:{loc:["loc-hope"],tut:"tut-archive"},c3:{loc:["loc-hope"],npc:["npc-raphael"]},o18:{loc:["loc-grief"],tut:"tut-mirror"},c4:{loc:["loc-wyrmway"],npc:["npc-ansur"],tut:"tut-wyrmway"},o19:{loc:["loc-wyrmway"],npc:["npc-ansur"],tut:"tut-wyrmway"}},Bt={H\u00E4ndler:"#c8a86b",Gegner:"#c0562c",Quest:"#8b5cf6",Lager:"#7aa2c8",Untot:"#8fc9a8"},ci={"s-vow-enmity":{t:"Bonusaktion",src:"Eid der Rache 3 \xB7 Eid-Ladung",r:"3 m",d:"10 Runden",rest:"Eid-Ladung l\xE4dt bei kurzer Rast",mech:"Du hast 10 Runden lang Vorteil auf alle Angriffsw\xFCrfe gegen ein Ziel.",tac:["Vor dem ersten Schlag gegen Bosse. Vorteil gleicht den GWM-Malus (\u22125) fast komplett aus \u2013 mit dem Gel\xFCbde lohnt sich \u201EAll In\u201C praktisch immer.","Vorteil verdoppelt fast deine Krit-Chance (rund 10 % statt 5 % pro Angriff) und damit die Zahl der Krit-Smites."],warn:"Paladine haben nur eine Eid-Ladung pro kurzer Rast \u2013 Gel\xFCbde, Macht des Inquisitors und Feind bannen teilen sie sich."},"s-inquisitors-might":{t:"Bonusaktion",src:"Eid der Rache 1 \xB7 Eid-Ladung",r:"9 m",d:"2 Runden",rest:"Eid-Ladung l\xE4dt bei kurzer Rast",mech:"Du oder ein Verb\xFCndeter verursacht mit Waffenangriffen zus\xE4tzlichen glei\xDFenden Schaden in H\xF6he deines CHA-Modifikators (mindestens 1). Treffer machen Gegner 1 Runde benommen \u2013 ohne Rettungswurf.",tac:"F\xFCr einen kurzen Burst-Zug mit vielen Treffern (Tatendrang, Hast, drei Angriffe auf W/R-Hexklinge). Bei l\xE4ngeren K\xE4mpfen ist das Gel\xFCbde die bessere Wahl f\xFCr die Ladung.",warn:"Glei\xDFender Schaden \u2013 gegen Gegner mit Strahlender Vergeltung (Shar-Pr\xFCfung, Haus der Trauer) nicht benutzen."},"s-abjure-enemy":{t:"Aktion",src:"Eid der Rache 3 \xB7 Eid-Ladung",mech:"Ein Gegner wird ver\xE4ngstigt: Nachteil auf Attributs- und Angriffsw\xFCrfe, er kann sich nicht bewegen.",tac:"Notbremse gegen einen gef\xE4hrlichen Nahk\xE4mpfer. F\xFCr Schaden ist das Gel\xFCbde fast immer besser."},"s-hunters-mark":{t:"Bonusaktion",src:"Eidzauber Rache 3 \xB7 Grad 1",d:"Konzentration",k:!0,mech:"Das markierte Ziel nimmt bei jedem deiner Waffentreffer 1W6 zus\xE4tzlichen Schaden. Stirbt es, versetzt du das Mal per Bonusaktion.",tac:"G\xFCnstiger Dauerschaden \u2013 je mehr Angriffe pro Zug, desto mehr bringt es.",warn:"Konzentration: vertr\xE4gt sich nicht mit Magischer Waffe, eigener Hast oder Zornigem Niederstrecken."},"s-relentless-avenger":{t:"Passiv",src:"Eid der Rache 7",mech:"Triffst du mit einem Gelegenheitsangriff, bewegst du dich im n\xE4chsten Zug 4,5 m weiter.",tac:"Kein Schaden, aber hilft beim Nachsetzen gegen Fernk\xE4mpfer und Fliehende."},"s-misty-step":{t:"Bonusaktion",src:"Eidzauber Rache 5 \xB7 Grad 2",mech:"Teleportiert dich an einen sichtbaren Punkt in Reichweite.",tac:"Immer vorbereitet: direkt an den Boss, auf erh\xF6hte Positionen oder aus der Umzingelung \u2013 die Glaskanone kommt schneller an ihr Ziel und wieder weg."},"s-hexblade-curse":{t:"Bonusaktion",src:"Hexenmeister 1 (Hexklinge)",rest:"Kurze Rast",mech:"Verflucht ein Ziel: Deine Angriffe dagegen verursachen zus\xE4tzlichen Schaden in H\xF6he deines \xDCbungsbonus und sind schon bei 19\u201320 kritisch.",tac:"Fluch und Gel\xFCbde auf denselben Boss: Vorteil plus Krit ab 19 ergibt etwa 19 % Krit-Chance pro Angriff \u2013 fast jeder zweite Zug bringt einen Krit-Smite."},"s-shadow-blade":{t:"Bonusaktion (beschw\xF6ren)",src:"Zauberer / Hexenmeister \xB7 Grad 2",d:"Bis zur langen Rast",mech:"Beschw\xF6rt ein psychisches Kurzschwert: 2W8 psychischer Schaden, hochgewirkt 3W8, h\xF6chstens 4W8 (seit Patch 8).",tac:"Kern des Sorcadin-Wegs (R3). Aus Dunkelheit heraus mit Vorteil angreifen. Der Resonanzstein (Ende Akt 2) macht Gegner in 9 m verwundbar gegen psychischen Schaden.",warn:"Keine schwere Waffe \u2013 Meisterschaft gro\xDFer Waffen gilt nicht. Konstrukte sind gegen psychischen Schaden immun."},"s-booming-blade":{t:"Aktion (Zaubertrick)",src:"Zaubertrick (seit Patch 8)",mech:"Nahkampf-Waffenangriff mit Donnerenergie: Bewegt sich das Ziel danach, nimmt es zus\xE4tzlichen Schallschaden.",tac:"Ersetzt beim Sorcadin den Standardangriff gegen Ziele, die fliehen oder sich neu positionieren wollen."},"s-divine-smite":{t:"Reaktion bei Treffer",src:"Paladin 2 \xB7 Zauberplatz ab Grad 1",r:"Nahkampf",d:"Sofort",mech:["Nach einem Nahkampftreffer opferst du einen Zauberplatz f\xFCr glei\xDFenden Zusatzschaden. Der Schaden h\xE4ngt von keinem Attribut ab \u2013 weder ST\xC4 noch CHA \u2013, sondern nur vom Grad des Platzes:","Grad 1: 2W8 \xB7 Grad 2: 3W8 \xB7 Grad 3: 4W8 \xB7 Grad 4: 5W8 \u2013 das ist die harte Obergrenze. Gegen Untote und Unholde kommt 1W8 dazu. Bei einem kritischen Treffer werden alle Smite-W\xFCrfel verdoppelt.","ST\xC4 und CHA wirken nur indirekt: auf die Trefferchance, den Waffenschaden und (ab Stufe 7) die Aura des Hasses."],tac:"Pl\xE4tze f\xFCr Krits aufheben \u2013 gegen gel\xE4hmte Ziele (Person festhalten) ist jeder Nahkampftreffer ein Krit. Kampf mit gro\xDFen Waffen und Wilder Angreifer w\xFCrfeln Smite-W\xFCrfel in BG3 neu.",warn:["H\xF6llischer Tadel teilt sich dieselben Pl\xE4tze \u2013 dessen Reaktion ausschalten.","Strahlende Vergeltung (Radiant Retort): Die Dunklen Justiziare in der Shar-Pr\xFCfung (Akt 2) sowie die Sharraner und Viconia im Haus der Trauer (Akt 3) werfen glei\xDFenden Schaden doppelt als Energieschaden auf dich zur\xFCck. Laut bg3.wiki haben einige Justiziare die Eigenschaft erst ab Taktiker \u2013 pr\xFCfe trotzdem vor jedem Smite den Tooltip des Gegners. Ein gro\xDFer Krit-Smite kann Droughnir sonst selbst umhauen.","Im Haus der Hoffnung (Akt 3) haben Raphaels Rachs\xFCchtige Kreaturen (Cambion, Imp, Merregon) stattdessen Fl\xFCchtiger Schutz: Der erste glei\xDFende Treffer kommt doppelt als Feuerschaden zur\xFCck, danach endet der Schutz."],gear:["Helmet of Smiting"],loc:["loc-gauntlet","loc-grief","loc-hope"]},"s-control-undead":{t:"Aktion",src:"Eidbrecher 3 \xB7 Eid-Ladung",r:"6 m",d:"Bis zur langen Rast",rest:"Eid-Ladung l\xE4dt bei kurzer Rast",mech:["Ein lebender, also aktiver untoter Gegner mit niedrigerem Level als du legt einen Weisheitsrettungswurf gegen deinen Zauber-SG ab. Misslingt er, k\xE4mpft er als KI-Verb\xFCndeter f\xFCr dich.","Leichen kannst du damit nicht erwecken \u2013 daf\xFCr gibt es ab Paladin-Stufe 9 den Eidzauber Tote beleben (Animate Dead).","Heilzauber wie Wunden heilen und Handauflegen wirken nicht auf Untote. Rechne damit, dass sich dein Untoter nur \xFCber eine kurze Rast erholt."],tac:["Akt 1: Es gibt kaum Ziele \u2013 praktisch nur Gruft-Schreiber und Gruft-Krieger in der Feuchten Gruft unter den \xDCberwucherten Ruinen. Die eine Eid-Ladung ist meist besser bei Trotziges Leid (Bosse) oder Gr\xE4ssliches Aussehen (Gruppen) aufgehoben.","Ab Akt 2 lohnt es sich: Schattenverfluchte Lande, Reithwin und das Haus der Heilung mit Malus Thorm (ab Stufe 8 ein Boss-Skip) bieten viele starke Ziele.","Untote mit Waffen bevorzugen \u2013 ab Stufe 7 profitieren nur sie neben dir von der Aura des Hasses, Ghule oder Zombies mit Klauen nicht."],warn:["Gehst du zu Boden, ist der Untote endg\xFCltig weg. Teilt sich die Eid-Ladung mit Trotziges Leid und Gr\xE4ssliches Aussehen.","Die Level-Angaben gelten f\xFCr \u201EAusgewogen\u201C \u2013 auf Taktiker und Ehrenmodus k\xF6nnen Gegner h\xF6her sein."],chk:["o2","o6"],loc:["loc-ruins","loc-shadowlands","loc-healing"],npc:["npc-malus"]},"s-dreadful-aspect":{t:"Aktion",src:"Eidbrecher 3 \xB7 Eid-Ladung",r:"9 m um dich",d:"2 Runden",rest:"Eid-Ladung l\xE4dt bei kurzer Rast",mech:"Alle Feinde im Umkreis legen einen Weisheitsrettungswurf ab. Bei Misserfolg sind sie ver\xE4ngstigt: keine Bewegung, Nachteil auf Angriffe und Attributsw\xFCrfe.",tac:"Mitten in eine Gruppe laufen und z\xFCnden \u2013 danach kann niemand fliehen. Astarion mit dem Bogen der Todesfee bekommt +1W4 gegen Ver\xE4ngstigte.",gear:["Bow of the Banshee"],who:["Astarion"]},"s-spiteful-suffering":{t:"Aktion",src:"Eidbrecher 1 \xB7 Eid-Ladung",r:"3 m",d:"3 Runden",rest:"Eid-Ladung l\xE4dt bei kurzer Rast",mech:"Das Ziel legt einen Charismarettungswurf ab. Misslingt er, nimmt es jede Runde 1W4 + CHA-Mod nekrotischen Schaden, und alle Angriffe gegen es haben Vorteil. Zu Beginn jedes Zuges darf es erneut w\xFCrfeln.",tac:"Der Boss-Opener: Vorteil gleicht den GWM-Malus von \u22125 aus. Zug 1 Trotziges Leid, ab Zug 2 alles mit \u201EAll In\u201C."},"s-aura-hate":{t:"Passiv (Aura)",src:"Eidbrecher 7",r:"3 m",d:"Dauerhaft",mech:"Du und alle Unholde und Untoten in der Aura \u2013 auch feindliche \u2013 addieren deinen CHA-Modifikator zum Schaden ihrer Nahkampfwaffenangriffe.",tac:"Je mehr Treffer pro Zug, desto mehr bringt die Aura \u2013 deshalb vergleicht der Tab \u201EWege\u201C Builds mit 3 und mehr Angriffen.",warn:"Feindliche Untote und Unholde neben dir profitieren mit. Klauen-Untote ohne Waffe bekommen keinen Bonus. F\xE4llt weg, solange du bewusstlos bist.",chk:["o5"]},"s-hellish-rebuke":{t:"Reaktion",src:"Eidzauber \xB7 Grad 1",r:"Fernkampf",d:"Sofort",mech:"Wenn dich ein Feind verletzt, schl\xE4gt er Feuer zur\xFCck: 2W10 Feuerschaden, ein Geschicklichkeitsrettungswurf halbiert, +1W10 je h\xF6herem Grad.",tac:"F\xFCr eine Glaskanone kaum wert \u2013 jeder Platz geh\xF6rt in Smites.",warn:"Reaktion auf Aus stellen. Sonst l\xF6st sie bei jedem Treffer gegen dich aus und verbraucht genau die Pl\xE4tze, die du f\xFCr G\xF6ttliches Niederstrecken brauchst."},"s-inflict-wounds":{t:"Aktion",src:"Eidzauber \xB7 Grad 1",r:"Nahkampf (Ber\xFChrung)",d:"Sofort",mech:"Nahkampf-Zauberangriff mit 3W10 nekrotischem Schaden, +1W10 je h\xF6herem Grad.",tac:"Nur eine Notl\xF6sung. Ein Smite auf einen Waffentreffer bringt mit GWM und Aura fast immer mehr."},"s-animate-dead":{t:"Aktion",src:"Eidzauber Eidbrecher 9 \xB7 Grad 3",r:"Leiche in der N\xE4he",d:"Bis zur langen Rast",mech:"Erweckt eine Leiche als Skelett oder Zombie, der f\xFCr dich k\xE4mpft.",tac:"Zusammen mit Untote kontrollieren eine kleine Untoten-Truppe bis zur langen Rast \u2013 das kontrollierte Ziel z\xE4hlt nicht gegen das Limit.",warn:"Klauen-Untote bekommen keinen Bonus durch die Aura des Hasses."},"s-magic-weapon":{t:"Aktion",src:"Paladin 5 \xB7 Grad 2",r:"Ber\xFChrung (1,5 m)",d:"Bis zur langen Rast",k:!0,mech:"Die Waffe bekommt einen Verzauberungsbonus auf Angriff und Schaden; laut bg3.wiki stapelt er mit vorhandenen Verzauberungen.",tac:"Gleicht einen Teil des GWM-Malus aus und h\xE4lt als Konzentrationszauber den Ring des seltsamen Leiters (+1W4 psychisch) dauerhaft an.",warn:"Belegt deine Konzentration \u2013 Hast von Gale bleibt davon unber\xFChrt, eigene Konzentrationszauber ersetzen ihn.",gear:["Strange Conduit Ring"],chk:["o13"]},"s-divine-favour":{t:"Bonusaktion",src:"Paladin 2 \xB7 Grad 1",r:"Selbst",d:"3 Runden",k:!0,mech:"Deine Waffenangriffe verursachen 1W4 zus\xE4tzlichen glei\xDFenden Schaden.",tac:"Billiger Schadens-Boost f\xFCr kurze K\xE4mpfe und Konzentrations-Ausl\xF6ser f\xFCr den Ring des seltsamen Leiters.",warn:"Nur 3 Runden \u2013 f\xFCr lange K\xE4mpfe ist Magische Waffe besser.",gear:["Strange Conduit Ring"]},"s-hold-person":{t:"Aktion",src:"Grad 2 (Gale, Schattenherz)",r:"Fernkampf",d:"Bis zu 10 Runden",k:!0,mech:"Ein humanoides Ziel legt einen Weisheitsrettungswurf ab, sonst ist es gel\xE4hmt. Am Ende jedes seiner Z\xFCge darf es erneut w\xFCrfeln. Nahkampftreffer gegen gel\xE4hmte Ziele aus n\xE4chster N\xE4he sind automatisch kritisch.",tac:"Die Krit-Maschine: Ziel festhalten lassen, dann jeden Treffer mit dem h\xF6chsten Platz smiten \u2013 doppelte Smite-W\xFCrfel.",warn:"Bricht die Konzentration des Wirkers, ist die L\xE4hmung sofort vorbei.",gear:["Gloves of Baneful Striking"],who:["Gale","Schattenherz"]},"s-haste":{t:"Aktion",src:"Grad 3 (Gale, Zauberer 5)",r:"9 m",d:"10 Runden",k:!0,mech:"Hast: +2 RK, Vorteil auf Geschicklichkeitsrettungsw\xFCrfe, +9 m Bewegung und eine zus\xE4tzliche Aktion pro Zug.",tac:"Die zus\xE4tzliche Aktion ist ein voller Angriff mit Extra-Angriff \u2013 auf den meisten Wegen verdoppelt Hast deinen Schaden pro Zug.",warn:"Endet Hast vorzeitig, ist das Ziel einen Zug lethargisch: keine Bewegung, keine Aktionen, keine Reaktionen. Deshalb lieber Gale halten lassen.",who:["Gale"]},"s-wrathful-smite":{t:"Aktion (Waffenangriff)",src:"Paladin \xB7 Grad 1",r:"Nahkampf",d:"Ver\xE4ngstigt 2 Runden",k:!0,mech:"Waffenangriff mit 1W6 zus\xE4tzlichem psychischem Schaden. Das Ziel legt einen Weisheitsrettungswurf ab, sonst ist es ver\xE4ngstigt.",tac:"Stapelt mit G\xF6ttlichem Niederstrecken \u2013 bei Treffer kommt zus\xE4tzlich die Smite-Abfrage.",warn:"Braucht Konzentration und ersetzt damit Magische Waffe oder G\xF6ttliche Gunst."},"s-gwm":{t:"Passiv (Talent, umschaltbar)",src:"Talent \xB7 Paladin 4",r:"Nahkampf",d:"Dauerhaft",mech:"\u201EAll In\u201C: \u22125 auf den Angriffswurf, daf\xFCr +10 Schaden mit schweren Nahkampfwaffen. Nach einem Krit oder Kill bekommst du einen Bonusangriff.",tac:"Nur mit Vorteil, Segnen oder gegen niedrige RK aktiv lassen. Ein Kill durch G\xF6ttliches Niederstrecken l\xF6st den Bonusangriff nicht aus.",gear:["Gloves of the Growling Underdog"]},"s-bless":{t:"Aktion",src:"Grad 1 (Schattenherz)",r:"Fernkampf, bis zu 3 Ziele",d:"10 Runden",k:!0,mech:"Gesegnete Ziele addieren 1W4 zu Angriffsw\xFCrfen und Rettungsw\xFCrfen.",tac:"Gleicht im Schnitt 2,5 Punkte des GWM-Malus aus. \xDCber Das fl\xFCsternde Versprechen bekommst du den Segen sogar ohne ihre Konzentration.",gear:["The Whispering Promise"],chk:["a4"],who:["Schattenherz"]},"s-healing-word":{t:"Bonusaktion",src:"Grad 1 (Schattenherz)",r:"Fernkampf",d:"Sofort",mech:"Heilt ein Ziel aus der Distanz um 1W4 + Weisheitsmodifikator.",tac:"Tr\xE4gt Schattenherz Das fl\xFCsternde Versprechen, wird das geheilte Ziel zus\xE4tzlich gesegnet \u2013 ohne dass sie sich konzentrieren muss. So bleibt ihre Konzentration f\xFCr Schutzgeister oder Person festhalten frei.",gear:["The Whispering Promise"],chk:["a4"],who:["Schattenherz"]},"s-aura-protection":{t:"Passiv (Aura)",src:"Paladin 6",r:"3 m",d:"Dauerhaft",mech:"Du und Verb\xFCndete in der Aura addieren deinen CHA-Modifikator (mindestens +1) zu allen Rettungsw\xFCrfen.",tac:"Die wichtigste Defensive der Glaskanone. Steht Schattenherz nah bei dir, h\xE4lt sie ihre Konzentration viel zuverl\xE4ssiger.",chk:["b5"]},"s-shield":{t:"Reaktion",src:"Zauberer 1 \xB7 Grad 1",r:"Selbst",d:"Bis zu deinem n\xE4chsten Zug",mech:"+5 RK, bis dein n\xE4chster Zug beginnt; Magische Geschosse prallen ab.",tac:"Nur auf dem Zauberer-Weg verf\xFCgbar. Auf Nachfragen stellen, damit sie nicht an kleine Treffe
