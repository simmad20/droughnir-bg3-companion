rin. Hinten steht die versiegelte Sel\xFBne-Truhe mit dem Mondtropfenanh\xE4nger."},{id:"loc-ethel",n:"Ethels Versteck",en:"Auntie Ethel's Ancient Abode",act:1,I:ha,tut:"tut-ethel",d:"Erreichbar \xFCber das Uferteehaus und den \xFCberwucherten Tunnel. Nur hier verhandelt Ethel um Mayrina \u2013 und gibt dir ihr Haar."},{id:"loc-goblin",n:"Goblinlager & Zerschmettertes Heiligtum",en:"Goblin Camp & Shattered Sanctum",act:1,I:sr,d:"H\xE4ndler Grat, Anf\xFChrer Dror Ragzlin (Schatzkammer mit den Handschuhen des grummelnden Verlierers) und Minthara (Stiefel des Schreitens). Geheimgang Richtung Unterreich."},{id:"loc-risen",n:"Aufgestiegene Stra\xDFe",en:"Risen Road",act:1,I:mr,d:"Hier triffst du Anders und seine falschen Tyr-Paladine \u2013 und die Entscheidung f\xFCr oder gegen Karlach."},{id:"loc-outpost",n:"Sel\xFBnitischer Au\xDFenposten",en:"Sel\xFBnite Outpost",act:1,I:Ma,d:"Ruine im Unterreich, Ziel des Abstiegs aus dem Entweihten Tempel. Verschlossene vergoldete Truhe (X 163 / Y \u2212248) mit dem Helm des Niederstreckens; hinter einer Geheimt\xFCr eine Prunktruhe mit Falle (X 176 / Y \u2212247) mit der Luminous Armour."},{id:"loc-myconid",n:"Myconid-Kolonie",en:"Myconid Colony",act:1,tut:"tut-hgs-brew",I:al,d:"Pilzvolk im Unterreich. H\xE4ndlerin Derryth Bonecloak verkauft das \xC4tzende Band."},{id:"loc-grymforge",n:"Grymschmiede",en:"Grymforge",act:1,I:dr,tut:"tut-forge",d:"Duergar-Festung mit der Adamant-Schmiede. Auf dem Weg dorthin Korsar Greymon mit Jorgorals Gro\xDFschwert. Die Schmiede l\xE4sst sich zweimal anfeuern: Schienenpanzer f\xFCr Droughnir, Schuppenpanzer f\xFCr Schattenherz."},{id:"loc-rosymorn",n:"Pfad zum Rosymorn-Kloster",en:"Rosymorn Monastery Trail",act:1,I:Da,d:"Erreichbar \xFCber den Gebirgspass oder die Goblinlager-Seite. H\xE4ndlerin Lady Esther, Ghule und Todeshirte."},{id:"loc-creche",n:"Krippe Y'llek",en:"Cr\xE8che Y'llek",act:1,I:hi,d:"Githyanki-Brutst\xE4tte am Gebirgspass. In der Kammer des Inquisitors liegt der Ring des seltsamen Leiters."},{id:"loc-lastlight",n:"Letztes Licht",en:"Last Light Inn",act:2,I:Rn,d:"Letzte sichere Zuflucht im Schattenfluch. Quartiermeisterin Talli und Dammon \u2013 f\xE4llt das Gasthaus, sind die H\xE4ndler weg."},{id:"loc-moonrise",n:"Mondaufgangst\xFCrme",en:"Moonrise Towers",act:2,tut:"tut-vigour",I:sr,d:"Festung des Absolut-Kults. Im Erdgeschoss Araj Oblodra mit dem Trank der ewigen Kraft."},{id:"loc-shadowlands",n:"Schattenverfluchte Lande & Reithwin",en:"Shadow-Cursed Lands",act:2,I:Ma,d:"Vom Schattenfluch verdunkeltes Land rund um Reithwin. Wer hier stirbt, kann als Untoter wieder aufstehen \u2013 Schatten und Gespenster (Level 5) sind ab deiner Stufe 6 kontrollierbar."},{id:"loc-healing",n:"Haus der Heilung",en:"House of Healing",act:2,I:mi,d:"Verlassenes Spital in Reithwin. Untote Krankenschwestern und Malus Thorm \u2013 ab Stufe 8 kontrollierbar."},{id:"loc-gauntlet",n:"Shar-Pr\xFCfung",en:"Gauntlet of Shar",act:2,I:Ma,d:"Unterirdische Tempelanlage. In der Schatzkammer neben Balthazar (T\xFCr SG 30) liegt der Ring des kaltherzigen Leuchtens."},{id:"loc-hope",n:"Haus der Hoffnung",en:"House of Hope",act:3,I:Jt,tut:"tut-archive",d:"Raphaels H\xF6llenpalast. Im Archiv die Panzerhandschuhe der H\xFCgelriesenst\xE4rke und das Amulett der gr\xF6\xDFeren Gesundheit; Raphael selbst tr\xE4gt die H\xF6llend\xE4mmerungs-R\xFCstung."},{id:"loc-wyrmway",n:"Drachenweg",en:"The Wyrmway",act:3,I:Me,tut:"tut-wyrmway",d:"Pr\xFCfungsgruft unter der Wyrmfelsen-Festung. Vier Pr\xFCfungen, dann Ansur \u2013 und dahinter Baldurans Riesent\xF6ter und der Helm des Balduran."},{id:"loc-grief",n:"Haus der Trauer",en:"House of Grief",act:3,I:mi,tut:"tut-mirror",d:"Shar-Tempel in der Unterstadt, Teil von Schattenherz' Quest. Nur hier funktioniert der Spiegel des Verlusts."},{id:"loc-nautiloid",n:"Nautiloid",en:"Nautiloid",act:1,I:ea,d:"Das Gedankenschinder-Schiff im Prolog. Am Steuer k\xE4mpft Kommandant Zhalk mit der Everburn Blade. Nach dem Absturz nicht mehr betretbar."},{id:"loc-blighted",n:"Verfallenes Dorf",en:"Blighted Village",act:1,I:ha,d:"Verlassenes Dorf zwischen Druidenhain und Goblinlager, von Goblins besetzt. Moosbewachsene Truhe mit dem Haste Helm (X 34 / Y 394, Schl\xFCssel beim Booyahg auf dem Apothekendach), Apotheke mit Keller f\xFCr Alchemie-Zutaten, Windm\xFChle mit Barcus Wroot. Unter dem Dorf: die Fl\xFCsternden Tiefen mit dem Spurred Band \u2013 Eingang \xFCber den Brunnen (Untersuchung SG 10) oder die Schmiede."},{id:"loc-waukeen",n:"Waukeens Rast",en:"Waukeen's Rest",act:1,I:wi,d:"Brennendes Gasthaus zwischen Gebirgspass und Aufgestiegener Stra\xDFe. Zeitkritisch: Schnellreise, Ortswechsel oder lange Rast lassen das Feuer alle Eingeschlossenen t\xF6ten. Gauntlet Yeva (Svartlebee's Woundseeker) bricht die T\xFCr auf, oben wartet Beraterin Florrick, hinter dem Gasthaus liegt der Geheimeingang zum Zhentarim-Versteck."},{id:"loc-wyrmscrossing",n:"Wyrms\xFCbergang",en:"Wyrm's Crossing",act:3,I:fr,d:"Breite Steinbr\xFCcke von Rivington in die Unterstadt mit vielen L\xE4den \u2013 u. a. Danthelons Tanzende Axt (Cloak of Displacement). Am S\xFCdspann-Kontrollpunkt liegt ein Elixier der H\xFCgelriesenst\xE4rke, am Ende wartet die Wyrmfels-Festung mit den Helldusk Boots."},{id:"loc-lowercity",n:"Unterstadt",en:"Lower City",act:3,I:hi,d:"Herz von Baldur's Gate in Akt 3. Hier liegen die Schmiede der Neun (Dammon: Legacy of the Masters, Armour of Persistence), Beehive General Goods (Elixiere) und unter Candulhallows Grabsteinen das Mordtribunal mit Sarevok und dem Sword of Chaos."},{id:"loc-tabernacle",n:"Sturmufer-Tabernakel",en:"Stormshore Tabernacle",act:3,I:fr,d:"Tempel in der Unterstadt, geh\xFCtet von Vikar Humbletoes. Gegen eine Spende gibt es einen Segen \u2013 sie steigt mit deiner Stufe (Stufe 1: 400 gp, Stufe 10: 4000 gp). Im Keller Opfertruhen: in der zentralen das Amulet of the Devout."},{id:"loc-devilsfee",n:"Devil's Fee",en:"Devil's Fee",act:3,I:br,d:"Laden in der Unterstadt (X \u221238 / Y 17), gef\xFChrt von Helsik. Ihr freigeschaltetes Sonderangebot enth\xE4lt den Cloak of the Weave f\xFCr Gale."},{id:"loc-philgrave",n:"Philgraves Anwesen",en:"Philgrave's Mansion",act:3,I:ha,d:"Herrenhaus in der Unterstadt (X 14 / Y \u2212160). Hier residiert Mystic Carrion mit der Hood of the Weave. Quest: \u201EFinde Mystic Carrions Diener\u201C."},{id:"loc-ramazith",n:"Ramazith's Tower",en:"Ramazith's Tower",act:3,I:sr,d:"Pagodenartiger Turm im Tempelbezirk von Baldur's Gate, Sitz von Lorroakan. In einem Globus der Unverwundbarkeit liegen Robe of the Weave und Markoheshkir (X 4970 / Y 705): mit Unsichtbares sehen den Hebel finden, dann Arkanwurf SG 20."}],Za=[{id:"npc-zevlor",n:"Zevlor",en:"Zevlor",kind:"Quest",act:1,loc:["loc-grove"],d:"Tiefling-Anf\xFChrer der Fl\xFCchtlinge in der Abgeschiedenen Kammer in der Mulde des Smaragdhains (X \u221253 / Y 67). Belohnt \u201EBesiege die Goblins\u201C mit Gold und Wapira's Crown \u2013 nur, wenn du die Geldbelohnung annimmst. Tr\xE4gt Hellrider's Pride: Belohnung f\xFCr \u201ET\xF6te Kagha\u201C oder \u201EUntersuche Kagha\u201C, sonst stehlen oder pl\xFCndern."},{id:"npc-kagha",n:"Kagha",en:"Kagha",kind:"Quest",act:1,loc:["loc-grove"],d:"Waldelfische Druidin, die sich in Halsins Abwesenheit zur Ersten Druidin ernannt hat und das Dornenritual betreibt. Bleibt im Inneren Heiligtum (X \u2212461 / Y \u221222), bis ihre Quests gel\xF6st sind. Tr\xE4gt Broodmother's Revenge \u2013 stirbt sie, pl\xFCnderst du es von ihrer Leiche."},{id:"npc-blurg",n:"Blurg",en:"Blurg",kind:"H\xE4ndler",act:1,loc:["loc-myconid"],d:"Mitglied der Gesellschaft der Brillanz in der Ebonsee-Grotte (X 111 / Y \u221289). Verkauft Melf's First Staff, Circlet of Blasting und Sunwalker's Gift. \xDCber ihn lernst du Omeluum kennen."},{id:"npc-warden",n:"Die W\xE4rterin",en:"The Warden",kind:"Gegner",act:2,loc:["loc-moonrise"],d:"W\xE4rterin des Gef\xE4ngnisses der Mondaufgangst\xFCrme (X 569 / Y \u2212650), im B\xFCroturm in der Mitte. L\xE4sst sich nicht bestechen. Tr\xE4gt das Spellcrux Amulet, den Gef\xE4ngnisschl\xFCssel und den Wachschl\xFCssel der T\xFCrme."},{id:"npc-humbletoes",n:"Vikar Humbletoes",en:"Vicar Humbletoes",kind:"H\xE4ndler",act:3,loc:["loc-tabernacle"],d:"H\xFCter des Sturmufer-Tabernakels in der Unterstadt. Verkauft Mantle of the Holy Warrior, The Reviving Hands und The Sacred Star."},{id:"npc-helsik",n:"Helsik",en:"Helsik",kind:"H\xE4ndler",act:3,loc:["loc-devilsfee"],d:"H\xE4ndlerin im Devil's Fee in der Unterstadt (X \u221238 / Y 17). Ihr Sonderangebot muss erst freigeschaltet werden \u2013 darin Cloak of the Weave, Caitiff Staff, Spellseeking Gloves und mehr."},{id:"npc-carrion",n:"Mystic Carrion",en:"Mystic Carrion",kind:"H\xE4ndler",act:3,loc:["loc-philgrave"],d:"Nekromant in Philgraves Anwesen (X 14 / Y \u2212160). Verkauft Hood of the Weave, Armour of the Sporekeeper und Veil of the Morning. T\xF6test du ihn, l\xE4sst er die Hood fallen."},{id:"npc-marcus",n:"Faust Marcus",en:"Fist Marcus",kind:"Gegner",act:2,loc:["loc-lastlight"],d:"Flammende Faust im Dienst des Absoluten. Taucht im Letzten Licht auf, um Isobel zu entf\xFChren (X \u221263 / Y 163). Tr\xE4gt den Shifting Corpus Ring."},{id:"npc-roah",n:"Roah Moonglow",en:"Roah Moonglow",kind:"H\xE4ndler",act:1,loc:["loc-goblin","loc-moonrise"],d:"Halbling-H\xE4ndlerin der Zhentarim. Akt 1: im Lagerraum westlich der Haupthalle des Zerschmetterten Heiligtums (X 275 / Y \u221229). Akt 2: Eingangshalle der Mondaufgangst\xFCrme (X \u2212174 / Y \u2212176). Akt 3: Zisterne in der Kanalisation der Unterstadt, nach dem Gildenhaus-Putsch im B\xFCro des Gildenmeisters. Ihr Sortiment wird teils zuf\xE4llig gew\xFCrfelt \u2013 bei dir war der Schuppenpanzer +1 dabei. Stirbt sie vor Akt 3, ersetzt sie Friol."},{id:"npc-zhalk",n:"Kommandant Zhalk",en:"Commander Zhalk",kind:"Gegner",act:1,loc:["loc-nautiloid"],d:"Cambion-Kommandant am Steuer der Nautiloid im Prolog. K\xE4mpft dort gegen einen Gedankenschinder; der Kampf startet, sobald jemand das Steuer betritt. Ihn zu t\xF6ten ist nicht n\xF6tig, bringt aber die Everburn Blade und Extra-EP \u2013 alternativ per Befehl: Fallenlassen entwaffnen. Nach 15 Z\xFCgen kommen Cambion-Verst\xE4rkungen."},{id:"npc-yeva",n:"Gauntlet Yeva",en:"Gauntlet Yeva",kind:"Quest",act:1,loc:["loc-waukeen"],d:"K\xE4mpferin (Kampfmeisterin) des Flammenden Fausts. Versucht in der brennenden Waukeens Rast die verbarrikadierte T\xFCr aufzubrechen \u2013 ein ST\xC4-Wurf SG 10 hilft \u2013 und startet \u201ERettet den Gro\xDFherzog\u201C. Tr\xE4gt Svartlebee's Woundseeker. In Akt 2 steckt sie in einer Kapsel im Kaulquappen-Zentrum."},{id:"npc-sarevok",n:"Sarevok Anchev",en:"Sarevok Anchev",kind:"Gegner",act:3,loc:["loc-lowercity"],d:"Anf\xFChrer des Mordtribunals unter Candulhallows Grabsteinen in der Unterstadt. Tr\xE4gt das Sword of Chaos, das Amulett des Bhaal und seinen geh\xF6rnten Helm. Wird feindlich, wenn du nach Orins Tod ins Tribunal zur\xFCckkehrst."},{id:"npc-nere",n:"Nere",en:"Nere",kind:"Gegner",act:1,loc:["loc-grymforge"],d:"Duergar-Anf\xFChrer der Absoluten in der Grymschmiede, eingeschlossen hinter einem Einsturz. Philomeen hat Sprengstoff f\xFCr den Schutt. Sprichst du mit ihm durch den Schutt, l\xE4uft ein Zeitlimit: nach zwei langen Rasten oder zweimal Grymschmiede verlassen stirbt er. Danach entweder gegen ihn k\xE4mpfen (Gnome retten) oder mit \xC4ltester Brithvar zusammenarbeiten. Beute: Disintegrating Night Walkers und 1.000 Gold."},{id:"npc-thulla",n:"Thulla",en:"Thulla",kind:"Quest",act:1,loc:["loc-myconid"],d:"Tiefengnomin in der Ebonsee-Grotte (X 87 / Y \u221295) neben Spaw, vergiftet von Duergar. Startet \u201EHeile die vergiftete Gnomin\u201C \u2013 jeder Effekt gegen Vergiftung hilft. Geheilt schenkt sie dir die Boots of Speed, die sie Thrinn gestohlen hat."},{id:"npc-thrinn",n:"Sergeant Elenna Thrinn",en:"Elenna Thrinn",kind:"Quest",act:1,loc:["loc-grymforge"],d:"Duergar-Sergeantin im Duergar-Lager der Grymschmiede (X \u2212643 / Y 300). Sucht ihre gestohlenen Stiefel (\u201EFinde die verlorenen Stiefel\u201C). Gibst du ihr die Boots of Speed, w\xE4hlst du als Belohnung das Bracing Band oder die Armour of Uninhibited Kushigo."},{id:"npc-crusher",n:"Crusher",en:"Crusher",kind:"Gegner",act:1,loc:["loc-goblin"],d:"Gro\xDFm\xE4uliger Goblin im \xF6stlichen Hof des Goblinlagers beim Alten Runenkreis. Tr\xE4gt Crusher's Ring am Zeh: beim erzwungenen Fu\xDFkuss abziehen (Fingerfertigkeit SG 10), per Dialog stehlen oder ihn t\xF6ten und pl\xFCndern."},{id:"npc-mol",n:"Mol",en:"Mol",kind:"Quest",act:1,loc:["loc-grove","loc-lastlight","loc-lowercity"],d:"Anf\xFChrerin der Tiefling-Kinder im Versteck unter dem Smaragdhain. Gibt dir \u201EStehlt das heilige G\xF6tzenbild\u201C und belohnt dich mit dem Ring of Protection. Akt 2 im Letzten Licht, Akt 3 bei Sticky Dondo im Gildenhaus der Unterstadt."},{id:"npc-omeluum",n:"Omeluum",en:"Omeluum",kind:"H\xE4ndler",act:1,loc:["loc-myconid"],d:"Freundlicher Gedankenschinder an der Myconid-Kolonie \u2013 du triffst ihn nach einem Gespr\xE4ch mit Blurg. Quest: einen Sud aus Tongue of Madness und Timmask-Sporen bringen; danach bietet er den Ring of Mind-Shielding an. Verkauft au\xDFerdem u. a. die Boots of Stormy Clamour und den Ring of Salving."},{id:"npc-entharl",n:"Entharl Danthelon",en:"Entharl Danthelon",kind:"H\xE4ndler",act:3,loc:["loc-wyrmscrossing"],d:"Waffen- und R\xFCstungsh\xE4ndler in Danthelons Tanzender Axt am Westende des Wyrms\xFCbergangs (X \u22126 / Y 133). Verkauft u. a. den Cloak of Displacement, die Gauntlets of the Warmaster und Blightbringer \u2013 und das Elixier der H\xFCgelriesenst\xE4rke."},{id:"npc-withers",n:"Der Verdorrte",en:"Withers",kind:"Lager",act:0,loc:["loc-camp"],d:"Skillt f\xFCr 100 Gold um \u2013 Begleiter jederzeit, dich als Eidbrecher aber nicht. Ist immun gegen Untote kontrollieren."},{id:"npc-knight",n:"Eidbrecher-Ritter",en:"Oathbreaker Knight",kind:"Lager",act:0,loc:["loc-camp"],d:"Erscheint nach dem Eidbruch. Stellt deinen alten Eid f\xFCr 1.000 Gold wieder her oder best\xE4tigt dich als Eidbrecher. Niemals t\xF6ten \u2013 sonst gibt es f\xFCr den Rest des Spiels keinen Respec mehr."},{id:"npc-dammon",n:"Dammon",en:"Dammon",kind:"H\xE4ndler",act:1,loc:["loc-grove","loc-lastlight","loc-lowercity"],d:"Tiefling-Schmied in der Mulde des Smaragdhains. Akt 2 im Letzten Licht: schmiedet aus Infernalem Eisen die fehlerhaften H\xF6llend\xE4mmerungs-Teile \u2013 je ein Eisen pro Teil. Akt 3 in der Schmiede der Neun (Unterstadt): verkauft Legacy of the Masters und die Armour of Persistence."},{id:"npc-volo",n:"Volo",en:"Volo",kind:"H\xE4ndler",act:1,loc:["loc-grove"],d:"Barde mit kurzem Auftritt am Heiligen Teich. Verkauft Das fl\xFCsternde Versprechen f\xFCr 40 gp (Handel-Button unten links) \u2013 sp\xE4ter auch im Lager."},{id:"npc-grat",n:"Grat",en:"Grat",kind:"H\xE4ndler",act:1,loc:["loc-goblin"],d:"Goblin-H\xE4ndler im Lager (X \u221299 / Y 424). Verkauft immer das Gro\xDFschwert +1; Das fl\xFCsternde Versprechen nur, wenn du es nicht von Volo hast und solange Volo im Lager ist."},{id:"npc-derryth",n:"Derryth Bonecloak",en:"Derryth Bonecloak",kind:"H\xE4ndler",act:1,loc:["loc-myconid"],d:"H\xE4ndlerin in der Ebonsee-Grotte nahe dem westlichen Eingang der Myconid-Kolonie. Verkauft das \xC4tzende Band, gelegentlich bis zu 2 Elixiere der H\xFCgelriesenst\xE4rke pro Rast und H\xFCgelriesen-Finger zum Brauen. In Akt 3 betreibt sie Bonecloaks Apotheke in der Unterstadt."},{id:"npc-greymon",n:"Korsar Greymon",en:"Corsair Greymon",kind:"H\xE4ndler",act:1,loc:["loc-grymforge"],d:"Duergar auf dem Flo\xDF zur Grymschmiede. Tr\xE4gt Jorgorals Gro\xDFschwert und verkauft es sp\xE4ter in der Grymschmiede. Nicht per Athletik-Dialog vom Flo\xDF sto\xDFen \u2013 sonst ist die Beute dauerhaft weg."},{id:"npc-esther",n:"Lady Esther",en:"Lady Esther",kind:"H\xE4ndler",act:1,loc:["loc-rosymorn"],d:"H\xE4ndlerin auf dem Pfad zum Rosymorn-Kloster. Verkauft die Gloves of Baneful Striking, das Periapt of Wound Closure und Elixiere der H\xFCgelriesenst\xE4rke."},{id:"npc-talli",n:"Quartiermeisterin Talli",en:"Quartermaster Talli",kind:"H\xE4ndler",act:2,loc:["loc-lastlight"],d:"Verkauft den Umhang des Schutzes (200 gp) und Elixiere des Blutdursts. F\xE4llt das Letzte Licht, stirbt sie \u2013 sofort kaufen."},{id:"npc-araj",n:"Araj Oblodra",en:"Araj Oblodra",kind:"Quest",act:2,loc:["loc-moonrise"],d:"Vampir-affine Tr\xE4nkebrauerin bei ihrer Alchemie-Ausr\xFCstung in den Mondaufgangst\xFCrmen. Lass Astarion sie bei\xDFen und du bekommst den Trank der ewigen Kraft (+2 ST\xC4 dauerhaft). Verkauft den Risky Ring und Elixiere der H\xFCgelriesenst\xE4rke. In Akt 3 (falls sie lebt und Blut gespendet wurde) im Purpurtrunk in der Unterstadt."},{id:"npc-ethel",n:"Tantchen Ethel",en:"Auntie Ethel",kind:"Gegner",act:1,loc:["loc-grove","loc-ethel"],d:"Gr\xFCnes Weib in Verkleidung. Solange sie freundlich ist, verkauft sie 3\xD7 Elixier der H\xFCgelriesenst\xE4rke pro langer Rast. Unter 20 % TP feilscht sie im Versteck um ihr Leben \u2013 deine Chance auf das Haar."},{id:"npc-dror",n:"Dror Ragzlin",en:"Dror Ragzlin",kind:"Gegner",act:1,loc:["loc-goblin"],d:"Goblin-Anf\xFChrer im Heiligtum. Hinter dem Eisentor (X 298 / Y 66) liegen seine Schatzkisten mit den Handschuhen des grummelnden Verlierers."},{id:"npc-minthara",n:"Minthara",en:"Minthara",kind:"Gegner",act:1,loc:["loc-goblin"],d:"Drow-Anf\xFChrerin. Auf dem guten Pfad besiegen: Sie tr\xE4gt die Stiefel des Schreitens."},{id:"npc-anders",n:"Anders",en:"Anders",kind:"Gegner",act:1,loc:["loc-risen"],d:"Falscher Tyr-Paladin, jagt Karlach. Besiegst du ihn, geh\xF6rt das Schwert der Gerechtigkeit dir \u2013 und Karlach schlie\xDFt sich an."},{id:"npc-grym",n:"Grym",en:"Grym",kind:"Gegner",act:1,loc:["loc-grymforge"],d:"Adamant-Golem der Schmiede. Erscheint, sobald du das Lavaventil zum ersten Mal \xF6ffnest; gilt als immun gegen Klingen und Zauber. Droppt den Grymskull-Helm."},{id:"npc-malus",n:"Malus Thorm",en:"Malus Thorm",kind:"Gegner",act:2,loc:["loc-healing"],d:"Level-7-Boss ohne Immunit\xE4t gegen Untote kontrollieren \u2013 ab deiner Stufe 8 einfach \xFCbernehmen."},{id:"npc-raphael",n:"Raphael",en:"Raphael",kind:"Gegner",act:3,loc:["loc-hope"],d:"Teufel und Hausherr. Besiegst du ihn, bekommst du die H\xF6llend\xE4mmerungs-R\xFCstung."},{id:"npc-ansur",n:"Ansur",en:"Ansur",kind:"Gegner",act:3,loc:["loc-wyrmway"],d:"Bronzedrache und einstiger Gef\xE4hrte Baldurans. Droppt Baldurans Riesent\xF6ter."}],Yc=[{id:"tut-ethel",n:"Tantchen Ethels Haar",loc:"loc-ethel",steps:["Vorher Elixiere kaufen: Solange Ethel im Hain freundlich ist, verkauft sie 3\xD7 Elixier der H\xFCgelriesenst\xE4rke, aufgef\xFCllt nach jeder langen Rast oder jedem Stufenaufstieg. Sobald sie ihre Vettel-Gestalt zeigt, flieht oder im Teehaus stirbt, ist ihr Laden f\xFCr immer zu.","Den Kampf im Versteck austragen (Uferteehaus \u2192 \xFCberwucherter Tunnel). Im Teehaus verhandelt sie nie \u2013 auch nicht unter 20 % TP.","Ethel unter 20 % ihrer maximalen TP bringen und ihren Zug abwarten. Nicht verstummen lassen (Stille), nicht bewusstlos schlagen \u2013 dann kann sie nicht verhandeln. Keine Schadensfl\xE4chen (Feuer, S\xE4ure) um sie herum, die sie vor ihrem Zug t\xF6ten k\xF6nnten.","Droughnir m\xF6glichst nah an sie stellen \u2013 viele Spieler berichten, dass sie die n\xE4chststehende Figur anspricht (laut bg3.wiki nicht best\xE4tigt).","In ihrem Zug bettelt sie: SG 20 T\xE4uschen oder Einsch\xFCchtern (K\xE4mpfer und Barbaren: SG 15 Einsch\xFCchtern mit Vorteil). Erfolg = Haar plus befreite Mayrina, Ethel kommt frei.","G\xF6ttliche F\xFChrung (Guidance) vorher im Kampf wirken, nicht erst im W\xFCrfel-Dialog: Im Ehrenmodus vor Patch 7 brach ein Zauber dort die Verhandlung ab und das Haar war weg. Bardische Inspiration funktioniert immer.","Misslingt eine Probe, ist die andere gesperrt. Dann bleiben: Deal annehmen (Haar, Ethel beh\xE4lt Mayrina), Mayrina befreien oder Ethel t\xF6ten.","Haar essen und ein Attribut w\xE4hlen: +1 dauerhaft, ohne Obergrenze. Wirkt nicht auf Werte, die Items oder Elixiere fest setzen.","Eid: Jeder Deal mit Ethel bricht den Paladin-Eid. Als Eidbrecher egal \u2013 planst du die R\xFCckkehr zur Rache, das Haar vorher holen oder die Kosten einplanen."]},{id:"tut-forge",n:"Adamant-Schienenpanzer schmieden",loc:"loc-grymforge",steps:["Schienen-Gussform holen: auf einem Felsvorsprung \xFCber den Lavabecken nahe dem Wegpunkt Alte Schmiede (X \u2212593 / Y 311).","Mithrilerz holen \u2013 es gibt nur zwei: am Lavafluss s\xFCdwestlich des Wegpunkts (X \u2212645 / Y 255) und in einem Torbogen \xF6stlich des Abstiegs (X \u2212558 / Y 278).","Auf die Plattform der Schmiede (X \u2212558 / Y 230). Erz und Gussform in ihre Kammern legen \u2013 die Gussform-Kammer liegt neben dem Tiegel.","Hebel in der Mitte des Podests ziehen \u2013 der Hammer senkt sich. Die Plattform muss unten sein; der Knopf hinter dem Hebel hebt sie an, dann funktioniert die Schmiede nicht.","Lavaventil am Ofen \xF6ffnen. Achtung: Beim ersten \xD6ffnen erscheinen Grym und Magma-Mephiten.","Hammer erneut fallen lassen, dann mit dem Hebel neben der Kammer die Gussform auswerfen und die R\xFCstung aufheben. Tipp: Droughnir ist Gildenhandwerker \u2013 hebt er das erste St\xFCck selbst auf, bekommt er die Inspiration Art Endures."]},{id:"tut-moondrop",n:"Mondtropfenanh\xE4nger",loc:"loc-owlbear",steps:["In der Eulenb\xE4renh\xF6hle (X \u2212321 / Y \u2212135) hinten zur versiegelten Sel\xFBne-Truhe.","Hinter der Sel\xFBne-Statue liegt das Gebetsblatt auf dem Boden (Wahrnehmung).","Das Gebet vor der Truhe vorlesen \u2013 sie \xF6ffnet sich. Effekt des Anh\xE4ngers: bei 50 % TP oder weniger keine Gelegenheitsangriffe. Legst du ihn erst an, wenn du schon darunter bist, greift er erst nach dem n\xE4chsten Schaden oder der n\xE4chsten Heilung."]},{id:"tut-wyrmway",n:"Drachenweg & Riesent\xF6ter",loc:"loc-wyrmway",steps:["Im Westfl\xFCgel des Wyrmfelsen-Gef\xE4ngnisses beide Drachenkopf-Fackeln mit Blitzschaden treffen (Schockgriff, Hexenpfeil, Blitzpfeile). Die Flammen werden blau, die Wand dazwischen wird passierbar. Vorsicht: Angriffe k\xF6nnen Wachen alarmieren.","Pr\xFCfung der Gerechtigkeit: Zuerst den Richter-Schatten vor den Gem\xE4lden magisch entfernen (Fluch brechen auf jedes Gem\xE4lde, Verbannung oder Untote vertreiben). Dann \u201EDie Zelle\u201C auf das Pult legen \u2013 Freiheit oder Henken rufen Untote.","Pr\xFCfung der Einsicht: Die B\xFCcher lassen sich mit SG 15 Fingerfertigkeit fangen (ein Versuch pro Figur) oder mit Befehl stoppen. Die L\xF6sung: den Geist Suelto am Ende der Kammer angreifen (1 TP) \u2013 seine B\xFCcher zeigen eine grausame Ideologie.","Pr\xFCfung der Strategie: Lanzenbrett-R\xE4tsel \u2013 Schwarz in zwei Z\xFCgen mattsetzen, drei Versuche. Alternative: den schwarzen K\xF6nig mit Blitzschaden zerst\xF6ren (50 TP auf Ausgewogen). Gale kennt die L\xF6sung.","Pr\xFCfung des Mutes: Wer die Statue ber\xFChrt, tr\xE4gt die Fackel. 4 Runden \xFCberleben, nicht zu Boden gehen und den Raum nicht verlassen. Heiligtum oder ein Trank der universellen Resistenz auf dem Tr\xE4ger machen es leicht.","Danach \xF6ffnet sich das Heiligtum. Baldurans Riesent\xF6ter liegt auf Ansurs Leichnam \u2013 Ansprechen oder Pl\xFCndern startet den Kampf gegen Ansur und zwei Wasser-Myrmidonen. Den Helm des Balduran auf dem Altar im Norden kannst du seit Patch 8 nehmen, ohne Ansur zu wecken."]},{id:"tut-archive",n:"Archiv im Haus der Hoffnung",loc:"loc-hope",steps:["Im Archiv liegen die Panzerhandschuhe der H\xFCgelriesenst\xE4rke auf einem Sockel; das Amulett der gr\xF6\xDFeren Gesundheit ist im selben Raum.","Falle vor dem Nehmen entsch\xE4rfen: SG 20 Fingerfertigkeit.","Alternative: einen Gegenstand mit gleichem Gewicht auf den Sockel legen und dann die Handschuhe nehmen \u2013 so sparst du dir Wahrnehmung und Entsch\xE4rfen.","Kein Respec n\xF6tig: Handschuhe und Amulett setzen ST\xC4 und KON auch als Eidbrecher auf 23."]},{id:"tut-mirror",n:"Spiegel des Verlusts",loc:"loc-grief",steps:["Der Spiegel in der Shar-Pr\xFCfung (Akt 2) ist zerbrochen \u2013 nutzbar ist nur der im Haus der Trauer (Kreuzgang der d\xFCsteren Umarmung, Akt 3).","Spiegel identifizieren: SG 20 Religion oder SG 25 Arkane Kunde \u2013 eine Figur reicht. Alternativ die hastige Notiz in der Nachtorchideen-H\xF6hle lesen.","Jede Figur betet einmal: SG 25 Religion. Misslingt das Gebet, ist +2 f\xFCr diese Figur nie mehr m\xF6glich \u2013 vorher alle Boni auf Religion sammeln.","Erinnerungen opfern (bis zu 6, je eine pro Attribut): Jede kostet \u22122 auf das Attribut bis zur langen Rast oder bis Fluch brechen bzw. M\xE4chtige Genesung. Nach erfolgreichem Gebet etwa 60 % Chance pro Versuch auf +2 (bis max. 24), 20 % auf Patriars Erinnerung (+1 CHA).","Nach einem +2 kannst du keine weiteren Erinnerungen opfern. Jede Figur bekommt +2 nur einmal."]},{id:"tut-hgs-shop",n:"H\xFCgelriesen-Elixier kaufen",loc:"loc-myconid",steps:["Grundregel: H\xE4ndler f\xFCllen ihr Sortiment nach jeder langen Rast oder jedem Stufenaufstieg neu auf. Steht kein Elixier im Laden, rasten und noch einmal nachsehen.","Akt 1 \u2013 Tantchen Ethel (Zelt im Smaragdhain, sp\xE4ter Uferteehaus): 3 St\xFCck pro Rast, solange ihr Laden offen ist. Zeigt sie ihre Vettel-Gestalt, flieht oder stirbt, ist er f\xFCr immer zu.","Akt 1 \u2013 Derryth Bonecloak: Unterreich, Ebonsee-Grotte, nahe dem westlichen Eingang der Myconid-Kolonie. Hat das Elixier nur gelegentlich, bis zu 2 pro Rast. Sie verkauft auch H\xFCgelriesen-Finger zum Selberbrauen.","Akt 1 \u2013 Lady Esther: Pfad zum Rosymorn-Kloster (\xFCber den Gebirgspass).","Akt 2 \u2013 Araj Oblodra in den Mondaufgangst\xFCrmen (bei ihrer Alchemie-Ausr\xFCstung) sowie Quartiermeisterin Talli und Mattis im Gasthaus Letztes Licht. F\xE4llt das Gasthaus, stirbt Talli \u2013 fr\xFCh einkaufen.","Akt 3 \u2013 Entharl Danthelon (Danthelons Tanzende Axt, Wyrms\xFCbergang) und Oliver Tefoco (Beehive General Goods, Unterstadt). Ab den Panzerhandschuhen (ST\xC4 23) brauchst du es aber nicht mehr.","Vorrat anlegen: lieber 3\u20134 St\xFCck auf einmal kaufen. Trinken ist eine Bonusaktion und h\xE4lt bis zur langen Rast \u2013 also vor dem Bosskampf trinken, nicht mittendrin.","In der App: im Tab \u201EAusr\xFCstung\u201C unter Aktives Elixier \u201EH\xFCgelriese\u201C w\xE4hlen \u2013 dann rechnet sie mit ST\xC4 21."]},{id:"tut-hgs-loot",n:"H\xFCgelriesen-Elixier finden",loc:"loc-grove",steps:["Feste Fundorte gibt es laut bg3.wiki nur zwei \u2013 das meiste bekommst du \xFCber H\xE4ndler oder Alchemie.","Akt 1 \u2013 Smaragdhain: ein Elixier liegt in Tantchen Ethels Laden als Ware aus. Zeigt das Hand-Symbol beim Anvisieren rot, ist Mitnehmen Diebstahl \u2013 nur unbeobachtet nehmen oder einfach kaufen.","Akt 3 \u2013 Wyrms\xFCbergang: zweiter Stock des S\xFCdspann-Kontrollpunkts (X \u221213 / Y 55).","Werfen statt trinken? Lieber nicht: Geworfen hebt es die ST\xC4 aller Figuren im Radius von 1 m nur f\xFCr 10 Z\xFCge. Getrunken h\xE4lt es bis zur langen Rast.","Gefundene Elixiere sparen und f\xFCr Bosse nutzen \u2013 im Alltag reicht deine ST\xC4 17."]},{id:"tut-hgs-brew",n:"H\xFCgelriesen-Elixier brauen",loc:"loc-myconid",steps:["Zutat kaufen: H\xFCgelriesen-Finger (Hill Giant Finger) bei Derryth Bonecloak an der Myconid-Kolonie im Unterreich \u2013 laut Wiki auch bei weiteren H\xE4ndlern im Spiel. Du brauchst 3 Finger pro Elixier.","Generische Zutat besorgen: eine beliebige Suspension. Sie entsteht beim Extrahieren bestimmter Pflanzen, z. B. Suspension of Mergrass aus Mergrass. Einfach unterwegs Zutaten aufsammeln \u2013 sie landen automatisch im Alchemiebeutel.","Alchemie \xF6ffnen: Taste H, nur au\xDFerhalb des Kampfes.","3 H\xFCgelriesen-Finger zu Salts of Hill Giant Fingernails extrahieren. Laut Wiki schaltet genau das auch das Rezept frei.","Restliche Zutaten mit \u201EAlle Zutaten extrahieren\u201C umwandeln \u2013 jede Zutat wird zu genau einem Extrakt, nichts geht verloren, und neue Rezepte werden freigeschaltet.","Brauen: Salts of Hill Giant Fingernails plus eine beliebige Suspension ergibt das Elixier der H\xFCgelriesenst\xE4rke.","Achtung bei der Suspension: Nimm eine, die du nicht als spezielle Zutat f\xFCr ein anderes Rezept brauchst \u2013 zum Beispiel nicht die, aus der du Heiltr\xE4nke machst.","Gute Zutaten-Fundorte laut Wiki: Apotheke und Keller im Verfallenen Dorf (Akt 1), Waning Moon (Akt 2), Bonecloaks Apotheke (Akt 3)."]},{id:"tut-vigour",n:"Trank der ewigen Kraft (Araj)",loc:"loc-moonrise",steps:["Akt 2, Mondaufgangst\xFCrme: Araj Oblodra steht bei ihrer Alchemie-Ausr\xFCstung. Astarion muss in der Gruppe sein \u2013 ist er im Lager, bittet sie dich, ihn das n\xE4chste Mal mitzubringen.","Sie bittet Astarion, sie zu bei\xDFen, damit sie Vampirbisse erforschen kann. Daf\xFCr bietet sie den Trank der ewigen Kraft an.","Astarion z\xF6gert und warnt, mit ihrem Blut stimme etwas nicht. Er bei\xDFt, wenn seine Zustimmung hoch genug ist und er die Wahl bekommt \u2013 oder wenn du es ihm befiehlst.","Folge: \u22123 Zustimmung bei Astarion und eine Lagerszene, die eine Romanze mit ihm betrifft. Sonst keine Konsequenzen.","Trank trinken (Bonusaktion): +2 ST\xC4 dauerhaft \u2013 auch \xFCber 20, \xFCbersteht Tod und Umskillen. Bei Droughnir also ST\xC4 17 \u2192 19 (+4).","Er wirkt nicht, solange etwas die ST\xC4 fest setzt (Elixier, Panzerhandschuhe) \u2013 lohnt sich trotzdem f\xFCr alle K\xE4mpfe ohne Elixier.","In der App: Checklistenpunkt \u201ETrank der ewigen Kraft\u201C abhaken \u2013 die Werte rechnen sofort mit ST\xC4 19."]},{id:"tut-knight",n:"Eid gebrochen \u2013 was jetzt?",loc:"loc-camp",steps:["Nach dem Eidbruch sind deine Eid-F\xE4higkeiten gesperrt, bis du im Lager mit dem Eidbrecher-Ritter sprichst.","Eidbrecher annehmen (kostenlos) \u2013 oder den alten Eid f\xFCr 1.000 Gold wiederherstellen (danach 2.000, ab dem dritten Mal 10.000).","Als Eidbrecher: keine Grunds\xE4tze, aber kein Respec bei Der Verdorrte.","Den Ritter niemals t\xF6ten \u2013 sonst gibt es f\xFCr den Rest des Spiels keinen Respec mehr."]}],Et=Object.fromEntries(Ar.map(e=>[e.id,e])),cl=Object.fromEntries(Za.map(e=>[e.id,e])),Hi=Object.fromEntries(Yc.map(e=>[e.id,e])),Ti={a1:{loc:["loc-ruins"]},o2:{loc:["loc-ruins"]},o1:{loc:["loc-camp"],npc:["npc-knight"],tut:"tut-knight"},o11:{loc:["loc-camp"],npc:["npc-knight"],tut:"tut-knight"},o15:{loc:["loc-camp"],npc:["npc-withers"]},o4:{loc:["loc-camp"],npc:["npc-withers"]},a2:{loc:["loc-myconid","loc-rosymorn","loc-lastlight"],npc:["npc-ethel"],tut:"tut-hgs-shop"},a3:{loc:["loc-grove","loc-goblin"],npc:["npc-dammon","npc-grat"]},a4:{loc:["loc-grove"],npc:["npc-volo","npc-grat"]},a6:{},a7:{loc:["loc-grove","loc-ethel"],npc:["npc-ethel"]},a8:{loc:["loc-owlbear"],tut:"tut-moondrop"},a9:{loc:["loc-ethel"],npc:["npc-ethel"],tut:"tut-ethel"},a9b:{loc:["loc-ethel"]},a10:{loc:["loc-goblin"],npc:["npc-grat"]},a11:{loc:["loc-goblin"],npc:["npc-dror"]},a12:{loc:["loc-goblin"],npc:["npc-minthara"]},a13:{loc:["loc-outpost"]},a14:{loc:["loc-myconid"],npc:["npc-derryth"]},a15:{loc:["loc-grymforge"],npc:["npc-greymon"]},a16:{loc:["loc-grymforge"],npc:["npc-grym"],tut:"tut-forge"},o14:{loc:["loc-risen"],npc:["npc-anders"]},o13:{loc:["loc-creche"]},o10:{loc:["loc-rosymorn"],npc:["npc-esther"]},b1:{loc:["loc-lastlight"],npc:["npc-talli"]},b2:{loc:["loc-lastlight"]},o16:{loc:["loc-lastlight"],npc:["npc-dammon"]},b4:{loc:["loc-moonrise"],npc:["npc-araj"],tut:"tut-vigour"},o17:{loc:["loc-gauntlet"]},o7:{loc:["loc-shadowlands"]},o6:{loc:["loc-healing"],npc:["npc-malus"]},c1:{loc:["loc-hope"],tut:"tut-archive"},c2:{loc:["loc-hope"],tut:"tut-archive"},c3:{loc:["loc-hope"],npc:["npc-raphael"]},o18:{loc:["loc-grief"],tut:"tut-mirror"},c4:{loc:["loc-wyrmway"],npc:["npc-ansur"],tut:"tut-wyrmway"},o19:{loc:["loc-wyrmway"],npc:["npc-ansur"],tut:"tut-wyrmway"}},ba={H\u00E4ndler:"#c8a86b",Gegner:"#c0562c",Quest:"#8b5cf6",Lager:"#7aa2c8",Untot:"#8fc9a8"},dd={"s-vow-enmity":{t:"Bonusaktion",src:"Eid der Rache 3 \xB7 Eid-Ladung",r:"3 m",d:"10 Runden",rest:"Eid-Ladung l\xE4dt bei kurzer Rast",mech:"Du hast 10 Runden lang Vorteil auf alle Angriffsw\xFCrfe gegen ein Ziel.",tac:["Vor dem ersten Schlag gegen Bosse. Vorteil gleicht den GWM-Malus (\u22125) fast komplett aus \u2013 mit dem Gel\xFCbde lohnt sich \u201EAll In\u201C praktisch immer.","Vorteil verdoppelt fast deine Krit-Chance (rund 10 % statt 5 % pro Angriff) und damit die Zahl der Krit-Smites."],warn:"Paladine haben nur eine Eid-Ladung pro kurzer Rast \u2013 Gel\xFCbde, Macht des Inquisitors und Feind bannen teilen sie sich."},"s-inquisitors-might":{t:"Bonusaktion",src:"Eid der Rache 1 \xB7 Eid-Ladung",r:"9 m",d:"2 Runden",rest:"Eid-Ladung l\xE4dt bei kurzer Rast",mech:"Du oder ein Verb\xFCndeter verursacht mit Waffenangriffen zus\xE4tzlichen glei\xDFenden Schaden in H\xF6he deines CHA-Modifikators (mindestens 1). Treffer machen Gegner 1 Runde benommen \u2013 ohne Rettungswurf.",tac:"F\xFCr einen kurzen Burst-Zug mit vielen Treffern (Tatendrang, Hast, drei Angriffe auf W/R-Hexklinge). Bei l\xE4ngeren K\xE4mpfen ist das Gel\xFCbde die bessere Wahl f\xFCr die Ladung.",warn:"Glei\xDFender Schaden \u2013 gegen Gegner mit Strahlender Vergeltung (Shar-Pr\xFCfung, Haus der Trauer) nicht benutzen."},"s-abjure-enemy":{t:"Aktion",src:"Eid der Rache 3 \xB7 Eid-Ladung",mech:"Ein Gegner wird ver\xE4ngstigt: Nachteil auf Attributs- und Angriffsw\xFCrfe, er kann sich nicht bewegen.",tac:"Notbremse gegen einen gef\xE4hrlichen Nahk\xE4mpfer. F\xFCr Schaden ist das Gel\xFCbde fast immer besser."},"s-hunters-mark":{t:"Bonusaktion",src:"Eidzauber Rache 3 \xB7 Grad 1",d:"Konzentration",k:!0,mech:"Das markierte Ziel nimmt bei jedem deiner Waffentreffer 1W6 zus\xE4tzlichen Schaden. Stirbt es, versetzt du das Mal per Bonusaktion.",tac:"G\xFCnstiger Dauerschaden \u2013 je mehr Angriffe pro Zug, desto mehr bringt es.",warn:"Konzentration: vertr\xE4gt sich nicht mit Magischer Waffe, eigener Hast oder Zornigem Niederstrecken."},"s-relentless-avenger":{t:"Passiv",src:"Eid der Rache 7",mech:"Triffst du mit einem Gelegenheitsangriff, bewegst du dich im n\xE4chsten Zug 4,5 m weiter.",tac:"Kein Schaden, aber hilft beim Nachsetzen gegen Fernk\xE4mpfer und Fliehende."},"s-misty-step":{t:"Bonusaktion",src:"Eidzauber Rache 5 \xB7 Grad 2",mech:"Teleportiert dich an einen sichtbaren Punkt in Reichweite.",tac:"Immer vorbereitet: direkt an den Boss, auf erh\xF6hte Positionen oder aus der Umzingelung \u2013 die Glaskanone kommt schneller an ihr Ziel und wieder weg."},"s-hexblade-curse":{t:"Bonusaktion",src:"Hexenmeister 1 (Hexklinge)",rest:"Kurze Rast",mech:"Verflucht ein Ziel: Deine Angriffe dagegen verursachen zus\xE4tzlichen Schaden in H\xF6he deines \xDCbungsbonus und sind schon bei 19\u201320 kritisch.",tac:"Fluch und Gel\xFCbde auf denselben Boss: Vorteil plus Krit ab 19 ergibt etwa 19 % Krit-Chance pro Angriff \u2013 fast jeder zweite Zug bringt einen Krit-Smite."},"s-shadow-blade":{t:"Bonusaktion (beschw\xF6ren)",src:"Zauberer / Hexenmeister \xB7 Grad 2",d:"Bis zur langen Rast",mech:"Beschw\xF6rt ein psychisches Kurzschwert: 2W8 psychischer Schaden, hochgewirkt 3W8, h\xF6chstens 4W8 (seit Patch 8).",tac:"Kern des Sorcadin-Wegs (R3). Aus Dunkelheit heraus mit Vorteil angreifen. Der Resonanzstein (Ende Akt 2) macht Gegner in 9 m verwundbar gegen psychischen Schaden.",warn:"Keine schwere Waffe \u2013 Meisterschaft gro\xDFer Waffen gilt nicht. Konstrukte sind gegen psychischen Schaden immun."},"s-booming-blade":{t:"Aktion (Zaubertrick)",src:"Zaubertrick (seit Patch 8)",mech:"Nahkampf-Waffenangriff mit Donnerenergie: Bewegt sich das Ziel danach, nimmt es zus\xE4tzlichen Schallschaden.",tac:"Ersetzt beim Sorcadin den Standardangriff gegen Ziele, die fliehen oder sich neu positionieren wollen."},"s-divine-smite":{t:"Reaktion bei Treffer",src:"Paladin 2 \xB7 Zauberplatz ab Grad 1",r:"Nahkampf",d:"Sofort",mech:["Nach einem Nahkampftreffer opferst du einen Zauberplatz f\xFCr glei\xDFenden Zusatzschaden. Der Schaden h\xE4ngt von keinem Attribut ab \u2013 weder ST\xC4 noch CHA \u2013, sondern nur vom Grad des Platzes:","Grad 1: 2W8 \xB7 Grad 2: 3W8 \xB7 Grad 3: 4W8 \xB7 Grad 4: 5W8 \u2013 das ist die harte Obergrenze. Gegen Untote und Unholde kommt 1W8 dazu. Bei einem kritischen Treffer werden alle Smite-W\xFCrfel verdoppelt.","In BG3 sind das zwei getrennte Reaktionen: die normale l\xF6st bei Krits nicht aus, \u201EG\xF6ttliches Niederstrecken: Kritischer Treffer\u201C nur bei Krits (4W8 auf Grad 1). Beide einzeln einstellen.","ST\xC4 und CHA wirken nur indirekt: auf die Trefferchance, den Waffenschaden und (ab Stufe 7) die Aura des Hasses."],tac:"Pl\xE4tze f\xFCr Krits aufheben \u2013 gegen gel\xE4hmte Ziele (Person festhalten) ist jeder Nahkampftreffer ein Krit. Kampf mit gro\xDFen Waffen und Wilder Angreifer w\xFCrfeln Smite-W\xFCrfel in BG3 neu.",warn:["H\xF6llischer Tadel teilt sich dieselben Pl\xE4tze \u2013 dessen Reaktion ausschalten.","Strahlende Vergeltung (Radiant Retort): Die Dunklen Justiziare in der Shar-Pr\xFCfung (Akt 2) sowie die Sharraner und Viconia im Haus der Trauer (Akt 3) werfen glei\xDFenden Schaden doppelt als Energieschaden auf dich zur\xFCck. Laut bg3.wiki haben einige Justiziare die Eigenschaft erst ab Taktiker \u2013 pr\xFCfe trotzdem vor jedem Smite den Tooltip des Gegners. Ein gro\xDFer Krit-Smite kann Droughnir sonst selbst umhauen.","Im Haus der Hoffnung (Akt 3) haben Raphaels Rachs\xFCchtige Kreaturen (Cambion, Imp, Merregon) stattdessen Fl\xFCchtiger Schutz: Der erste glei\xDFende Treffer kommt doppelt als Feuerschaden zur\xFCck, danach endet der Schutz."],gear:["Helmet of Smiting"],loc:["loc-gauntlet","loc-grief","loc-hope"]},"s-control-undead":{t:"Aktion",src:"Eidbrecher 3 \xB7 Eid-Ladung",r:"6 m",d:"Bis zur langen Rast",rest:"Eid-Ladung l\xE4dt bei kurzer Rast",mech:["Ein lebender, also aktiver untoter Gegner mit niedrigerem Level als du legt einen Weisheitsrettungswurf gegen deinen Zauber-SG ab. Misslingt er, k\xE4mpft er als KI-Verb\xFCndeter f\xFCr dich.","Leichen kannst du damit nicht erwecken \u2013 daf\xFCr gibt es ab Paladin-Stufe 9 den Eidzauber Tote beleben (Animate Dead).","Heilzauber wie Wunden heilen und Handauflegen wirken nicht auf Untote. Rechne damit, dass sich dein Untoter nur \xFCber eine kurze Rast erholt."],tac:["Akt 1: Es gibt kaum Ziele \u2013 praktisch nur Gruft-Schreiber und Gruft-Krieger in der Feuchten Gruft unter den \xDCberwucherten Ruinen. Die eine Eid-Ladung ist meist besser bei Trotziges Leid (Bosse) oder Gr\xE4ssliches Aussehen (Gruppen) aufgehoben.","Ab Akt 2 lohnt es sich: Schattenverfluchte Lande, Reithwin und das Haus der Heilung mit Malus Thorm (ab Stufe 8 ein Boss-Skip) bieten viele starke Ziele.","Untote mit Waffen bevorzugen \u2013 ab Stufe 7 profitieren nur sie neben dir von der Aura des Hasses, Ghule oder Zombies mit Klauen nicht."],warn:["Gehst du zu Boden, ist der Untote endg\xFCltig weg. Teilt sich die Eid-Ladung mit Trotziges Leid und Gr\xE4ssliches Aussehen.","Die Level-Angaben gelten f\xFCr \u201EAusgewogen\u201C \u2013 auf Taktiker und Ehrenmodus k\xF6nnen Gegner h\xF6her sein."],chk:["o2","o6"],loc:["loc-ruins","loc-shadowlands","loc-healing"],npc:["npc-malus"]},"s-dreadful-aspect":{t:"Aktion",src:"Eidbrecher 3 \xB7 Eid-Ladung",r:"9 m um dich",d:"2 Runden",rest:"Eid-Ladung l\xE4dt bei kurzer Rast",mech:"Alle Feinde im Umkreis legen einen Weisheitsrettungswurf ab. Bei Misserfolg sind sie ver\xE4ngstigt: keine Bewegung, Nachteil auf Angriffe und Attributsw\xFCrfe.",tac:"Mitten in eine Gruppe laufen und z\xFCnden \u2013 danach kann niemand fliehen. Gale h\xE4lt danach mit Person festhalten das gef\xE4hrlichste Ziel fest \u2013 Auto-Krits f\xFCr deine Smites.",gear:[],who:["Gale"]},"s-spiteful-suffering":{t:"Aktion",src:"Eidbrecher 1 \xB7 Eid-Ladung",r:"3 m",d:"3 Runden",rest:"Eid-Ladung l\xE4dt bei kurzer Rast",mech:"Das Ziel legt einen Charismarettungswurf ab. Misslingt er, nimmt es jede Runde 1W4 + CHA-Mod nekrotischen Schaden, und alle Angriffe gegen es haben Vorteil. Zu Beginn jedes Zuges darf es erneut w\xFCrfeln.",tac:"Der Boss-Opener: Vorteil gleicht den GWM-Malus von \u22125 aus. Zug 1 Trotziges Leid, ab Zug 2 alles mit \u201EAll In\u201C."},"s-aura-hate":{t:"Passiv (Aura)",src:"Eidbrecher 7",r:"3 m",d:"Dauerhaft",mech:"Du und alle Unholde und Untoten in der Aura \u2013 auch feindliche \u2013 addieren deinen CHA-Modifikator zum Schaden ihrer Nahkampfwaffenangriffe.",tac:"Je mehr Treffer pro Zug, desto mehr bringt die Aura \u2013 deshalb vergleicht der Tab \u201EWege\u201C Builds mit 3 und mehr Angriffen.",warn:"Feindliche Untote und Unholde neben dir profitieren mit. Klauen-Untote ohne Waffe bekommen keinen Bonus. F\xE4llt weg, solange du bewusstlos bist.",chk:["o5"]},"s-hellish-rebuke":{t:"Reaktion",src:"Eidzauber \xB7 Grad 1",r:"Fernkampf",d:"Sofort",mech:"Wenn dich ein Feind verletzt, schl\xE4gt er Feuer zur\xFCck: 2W10 Feuerschaden, ein Geschicklichkeitsrettungswurf halbiert, +1W10 je h\xF6herem Grad.",tac:"F\xFCr eine Glaskanone kaum wert \u2013 jeder Platz geh\xF6rt in Smites.",warn:"Reaktion auf Aus stellen. Sonst l\xF6st sie bei jedem Treffer gegen dich aus und verbraucht genau die Pl\xE4tze, die du f\xFCr G\xF6ttliches Niederstrecken brauchst."},"s-inflict-wounds":{t:"Aktion",src:"Eidzauber \xB7 Grad 1",r:"Nahkampf (Ber\xFChrung)",d:"Sofort",mech:"Nahkampf-Zauberangriff mit 3W10 nekrotischem Schaden, +1W10 je h\xF6herem Grad.",tac:"Nur eine Notl\xF6sung. Ein Smite auf einen Waffentreffer bringt mit GWM und Aura fast immer mehr."},"s-animate-dead":{t:"Aktion",src:"Eidzauber Eidbrecher 9 \xB7 Grad 3",r:"Leiche in der N\xE4he",d:"Bis zur langen Rast",mech:"Erweckt eine Leiche als Skelett oder Zombie, der f\xFCr dich k\xE4mpft.",tac:"Zusammen mit Untote kontrollieren eine kleine Untoten-Truppe bis zur langen Rast \u2013 das kontrollierte Ziel z\xE4hlt nicht gegen das Limit.",warn:"Klauen-Untote bekommen keinen Bonus durch die Aura des Hasses."},"s-magic-weapon":{t:"Aktion",src:"Paladin 5 \xB7 Grad 2",r:"Ber\xFChrung (1,5 m)",d:"Bis zur langen Rast",k:!0,mech:"Die Waffe bekomm einen Extra-Angriff.",who:["Gale"]},"s-wrathful-smite":{t:"Waffenangriff \xB7 bei Treffer Bonusaktion",src:"Paladin \xB7 Grad 1",r:"Nahkampf",d:"Ver\xE4ngstigt 2 Runden",k:!0,mech:"Waffenangriff mit 1W6 zus\xE4tzlichem psychischem Schaden. Das Ziel legt einen Weisheitsrettungswurf ab, sonst ist es ver\xE4ngstigt.",tac:"Stapelt mit G\xF6ttlichem Niederstrecken \u2013 bei Treffer kommt zus\xE4tzlich die Smite-Abfrage.",warn:"Braucht Konzentration und ersetzt damit Magische Waffe oder G\xF6ttliche Gunst."},"s-gwm":{t:"Passiv (Talent, umschaltbar)",src:"Talent \xB7 Paladin 4",r:"Nahkampf",d:"Dauerhaft",mech:"\u201EAll In\u201C: \u22125 auf den Angriffswurf, daf\xFCr +10 Schaden mit schweren Nahkampfwaffen. Nach einem Krit oder Kill bekommst du einen Bonusangriff.",tac:"Nur mit Vorteil, Segnen oder gegen niedrige RK aktiv lassen. Gilt nur f\xFCr zweih\xE4ndig gef\xFChrte Waffen, mit denen du ge\xFCbt bist.",gear:["Gloves of the Growling Underdog"]},"s-bless":{t:"Aktion",src:"Grad 1 (Schattenherz)",r:"Fernkampf, bis zu 3 Ziele",d:"10 Runden",k:!0,mech:"Gesegnete Ziele addieren 1W4 zu Angriffsw\xFCrfen und Rettungsw\xFCrfen.",tac:"Gleicht im Schnitt 2,5 Punkte des GWM-Malus aus. \xDCber Das fl\xFCsternde Versprechen bekommst du den Segen sogar ohne ihre Konzentration.",gear:["The Whispering Promise"],chk:["a4"],who:["Schattenherz"]},"s-healing-word":{t:"Bonusaktion",src:"Grad 1 (Schattenherz)",r:"Fernkampf",d:"Sofort",mech:"Heilt ein Ziel aus der Distanz um 1W4 + Weisheitsmodifikator.",tac:"Tr\xE4gt Schattenherz Das fl\xFCsternde Versprechen, wird das geheilte Ziel zus\xE4tzlich gesegnet \u2013 ohne dass sie sich konzentrieren muss. So bleibt ihre Konzentration f\xFCr Schutzgeister oder Person festhalten frei.",gear:["The Whispering Promise"],chk:["a4"],who:["Schattenherz"]},"s-aura-protection":{t:"Passiv (Aura)",src:"Paladin 6",r:"3 m",d:"Dauerhaft",mech:"Du und Verb\xFCndete in der Aura addieren deinen CHA-Modifikator (mindestens +1) zu allen Rettungsw\xFCrfen.",tac:"Die wichtigste Defensive der Glaskanone. Steht Schattenherz nah bei dir, h\xE4lt sie ihre Konzentration viel zuverl\xE4ssiger.",chk:["b5"]},"s-shield":{t:"Reaktion",src:"Zauberer 1 \xB7 Grad 1",r:"Selbst",d:"Bis zu deinem n\xE4chsten Zug",mech:"+5 RK, bis dein n\xE4chster Zug beginnt; Magische Geschosse prallen ab.",tac:"Nur auf dem Zauberer-Weg verf\xFCgbar. Auf Nachfragen stellen, damit sie nicht an kleine Treffer verpufft."},"s-pact-blade":{t:"Klassenmerkmal",src:"Hexenmeister 3",r:"Eigene Waffe",d:"Bis zur langen Rast",mech:"Du bindest eine Waffe: Angriff und Schaden laufen \xFCber CHA, die Waffe gilt als magisch. Mit Vertieftem Pakt (Hexenmeister 5) kommt au\xDFerhalb des Ehrenmodus ein dritter Angriff dazu.",tac:"Baldurans Riesent\xF6ter binden: Die Passive addiert weiterhin ST\xC4, du bekommst also CHA + ST\xC4 auf den Schaden.",warn:"Der dritte Angriff braucht laut deiner Quelle die gebundene Waffe \u2013 im Spiel pr\xFCfen.",gear:["Balduran's Giantslayer"]},"s-action-surge":{t:"Frei (keine Aktion)",src:"K\xE4mpfer 2",r:"Selbst",d:"Dieser Zug",rest:"Kurze Rast",mech:"Du bekommst sofort eine zus\xE4tzliche Aktion \u2013 mit vollem Extra-Angriff, auch im Ehrenmodus.",tac:"F\xFCr den Er\xF6ffnungs-Burst: Angriff, Tatendrang, Hast-Aktion \u2013 bis zu sechs Angriffe in einem Zug."},"s-improved-smite":{t:"Passiv",src:"Paladin 11",r:"Nahkampf",d:"Dauerhaft",mech:"Jeder Nahkampfwaffentreffer verursacht 1W8 zus\xE4tzlichen glei\xDFenden Schaden \u2013 ohne Zauberplatz.",tac:"Nur der reine Eidbrecher kommt hierhin. Wirkt auch beim GWM-Bonusangriff."},"s-savage-attacker":{t:"Passiv (Talent)",src:"Talent",r:"Nahkampf",d:"Dauerhaft",mech:"Waffenschadensw\xFCrfel werden zweimal geworfen, der h\xF6here Wurf z\xE4hlt.",tac:"W\xFCrfelt in BG3 auch die W\xFCrfel von G\xF6ttliches Niederstrecken neu \u2013 deshalb das dritte Talent beim reinen Eidbrecher."},"s-quickened":{t:"Metamagie",src:"Zauberer 2 \xB7 3 Zauberpunkte",r:"\u2013",d:"\u2013",mech:"Ein Zauber, der eine Aktion kostet, kostet nur eine Bonusaktion.",tac:"Hast als Bonusaktion auf dich selbst, dann direkt angreifen. Nur auf dem Zauberer-Weg."},"s-shield-of-faith":{t:"Bonusaktion",src:"Grad 1 (Paladin, Schattenherz)",r:"Fernkampf",d:"10 Runden",k:!0,mech:"+2 RK f\xFCr ein Ziel.",tac:"Schattenherz' Alternative zu Segnen, wenn du viel Schaden frisst.",who:["Schattenherz"]},"s-aid":{t:"Aktion",src:"Grad 2 (Paladin, Schattenherz)",r:"Bis zu 3 Verb\xFCndete",d:"Bis zur langen Rast",mech:"Erh\xF6ht die maximalen und aktuellen TP der Ziele (5 auf Grad 2, mehr auf h\xF6heren Graden).",tac:"Direkt nach der langen Rast wirken \u2013 kostet keine Konzentration und h\xE4lt den ganzen Tag.",who:["Schattenherz"]},"s-warding-bond":{t:"Aktion",src:"Grad 2 (Schattenherz)",r:"Ber\xFChrung",d:"Bis zur langen Rast",mech:"+1 RK und Rettungsw\xFCrfe sowie Resistenz gegen allen Schaden f\xFCr dich \u2013 Schattenherz nimmt daf\xFCr denselben Schaden.",tac:"Macht die Glaskanone deutlich z\xE4her. Nur nutzen, wenn Schattenherz selbst hinten sicher steht.",warn:"F\xE4llt Schattenherz, endet der Schutz \u2013 und du verlierst deine Heilerin.",who:["Schattenherz"]},"s-spirit-guardians":{t:"Aktion",src:"Grad 3 (Schattenherz)",r:"Aura um die Wirkerin",d:"10 Runden",k:!0,mech:"Geister umkreisen Schattenherz: Feinde in der Aura nehmen Schaden (Weisheitsrettungswurf halbiert) und sind verlangsamt.",tac:"Schattenherz direkt hinter dir in den Nahkampf stellen \u2013 Feinde, die zu dir wollen, laufen durch die Geister.",who:["Schattenherz"]},"s-mass-healing-word":{t:"Bonusaktion",src:"Grad 3 (Schattenherz)",r:"Fernkampf, mehrere Ziele",d:"Sofort",mech:"Heilt bis zu sechs Verb\xFCndete gleichzeitig aus der Distanz.",tac:"Die Notbremse, wenn mehrere am Boden liegen \u2013 kostet keine Aktion.",who:["Schattenherz"]},"s-revivify":{t:"Aktion",src:"Grad 3 (Schattenherz)",r:"Ber\xFChrung",d:"Sofort",mech:"Holt eine gerade gestorbene Figur mit 1 TP zur\xFCck.",tac:"Pflicht f\xFCr die Glaskanone. Bei Untote kontrollieren ,npc:["npc-zevlor"],loc:["loc-grove","loc-goblin"]},"Mantle of the Holy Warrior":{props:["Kreuzrittermantel (Aktion): Wirken als Grad-3-Zauber, l\xE4dt bei kurzer Rast","Verb\xFCndete in der Aura: +1W4 glei\xDFender Schaden bei Waffenangriffen","Konzentration \u2013 nicht gleichzeitig mit Segnen oder Schutzgeistern","Glei\xDFender Schaden: tr\xE4gt Droughnir die Luminous Armour, l\xF6st der Bonus auch die Radiating Shockwave aus","Sehr selten \xB7 630 gp \xB7 0,5 kg"],how:["Akt 3: Das Sturmufer-Tabernakel liegt in der Unterstadt von Baldur's Gate.","Vikar Humbletoes h\xFCtet das Tabernakel und handelt mit dir \u2013 den Mantel kaufen oder stehlen.","Im gleichen Sortiment: The Reviving Hands und The Sacred Star."],npc:["npc-humbletoes"],loc:["loc-tabernacle"]},"Adamantine Scale Mail":{props:["Mittlere R\xFCstung: RK 16 + GES (max. +2) \u2013 Schattenherz hat die n\xF6tige \xDCbung","Angreifer k\xF6nnen keine kritischen Treffer gegen die Tr\xE4gerin landen","Magical Plate: jeder eingehende Schaden \u22121","Adamantine Backlash: Trifft sie ein Nahkampfangriff, taumelt der Angreifer 2 Runden (Reeling)","Sehr selten \xB7 1300 gp \xB7 12 kg"],how:["Gussform Schuppenpanzer: in der Grymschmiede nahe dem Wegpunkt der alten Schmiede, auf dem Boden neben einer Fackel (X \u2212618 / Y 264).","Mithril-Erz an der Adamant-Schmiede einsammeln \u2013 wie beim Schienenpanzer von Droughnir.","Die Schmiede l\xE4sst sich mit allen Erzen genau zweimal anfeuern: einmal Schienenpanzer f\xFCr Droughnir, einmal Schuppenpanzer f\xFCr Schattenherz."],npc:[],loc:["loc-grymforge"]},"Hellrider's Pride":{props:["ST\xC4-Rettungsw\xFCrfe +1","Helm's Protection: Heilt die Tr\xE4gerin eine andere Kreatur, hat diese 2 Runden Resistenz gegen Wucht-, Stich- und Hiebschaden durch Waffenangriffe","bg3.wiki f\xFChrt dazu einen bekannten Bug","Ungew\xF6hnlich \xB7 110 gp \xB7 0,5 kg"],how:["Zevlor bittet dich nach dem Goblin-Angriff, Kagha vom Dornenritual abzubringen.","L\xF6se \u201EUntersuche Kagha\u201C (ihren Pakt mit den Schattendruiden aufdecken) oder \u201ET\xF6te Kagha\u201C \u2013 dann gibt er dir die Handschuhe.","Alternativ tr\xE4gt er sie: stehlen oder von ihm pl\xFCndern \u2013 kostet aber den Frieden im Hain."],npc:["npc-zevlor","npc-kagha"],loc:["loc-grove"]},"Boots of Aid and Comfort":{props:["Kreaturen, die die Tr\xE4gerin heilt, erhalten 3 tempor\xE4re TP","Wirkt bei Mehrfachzielen (z. B. Massen-Heilendes Wort) auf jedes Ziel","L\xF6st auch bei vollen TP aus \u2013 vor dem Kampf heilen ist also ein Schild","Ungew\xF6hnlich \xB7 70 gp"],how:["Das Goblinlager friedlich betreten \u2013 Grat steht im Lager (X \u221299 / Y 424).","Kaufen, solange er handelt: Greifst du das Lager an, musst du ihn pl\xFCndern.","Bei ihm gibt es auch das Gro\xDFschwert +1 f\xFCr Droughnir."],npc:["npc-grat"],loc:["loc-goblin"]},"The Blood of Lathander":{props:["+3 Streitkolben: 1W6 + 3 Wuchtschaden","F\xE4llt die Tr\xE4gerin auf 0 TP: 1\xD7 pro langer Rast heilt sie 2W6, Verb\xFCndete im Umkreis von 9 m 1W6","Sein Licht kann Unholde und Untote blenden (KON-Rettungswurf SG 14)","Sonnenstrahl (Sunbeam) als Grad-6-Zauber, 1\xD7 pro langer Rast","Legend\xE4r \xB7 640 gp"],how:["Dem Pfad zum Rosymorn-Kloster folgen und ins Kloster hineingehen.","Die Quest \u201EFinde das Blut Lathanders\u201C abschlie\xDFen \u2013 das R\xE4tsel im Kloster \xF6ffnet den Weg zur Waffe.","Lichtdom\xE4ne mit Streitkolben-\xDCbung: ideal f\xFCr Schattenherz, die vorn neben dir steht."],npc:[],loc:["loc-rosymorn"]},"Broodmother's Revenge":{props:["Venomous Revenge: Wird die Tr\xE4gerin geheilt, ist ihre Waffe 3 Runden mit Gift \xFCberzogen und macht +1W6 Giftschaden","L\xF6st auch bei vollen TP aus \u2013 auch durch Heilendes Wort, Tr\xE4nke oder Handauflegen","Ungew\xF6hnlich \xB7 65 gp"],how:["Kagha h\xE4lt sich bis zum Ende ihrer Quests im Inneren Heiligtum des Hains auf (X \u2212461 / Y \u221222).","Stirbt sie \u2013 etwa beim Kampf gegen die Schattendruiden in \u201EUntersuche Kagha\u201C oder bei \u201ET\xF6te Kagha\u201C \u2013, pl\xFCnderst du das Amulett von ihrer Leiche.","Ohne Mord: Nach dem Fest (Hain gerettet) steht sie laut Wiki-Diskussion allein am Eingangstor und l\xE4sst sich nicht-t\xF6dlich niederschlagen; nach einer langen Rast ist sie wieder wach, ver\xE4rgert, aber nicht feindlich.","Zweite Quelle: Kolls Warentisch in der High Hall (X 235 / Y 44)."],npc:["npc-kagha"],loc:["loc-grove"]},"Amulet of the Devout":{props:["High Spellcasting: +2 auf den Zauber-Rettungswurf-SG","Godswill: +1 Ladung G\xF6ttliche Macht \u2013 l\xE4dt entgegen der Beschreibung auch bei kurzer Rast","Wirkt nur mit G\xF6ttlicher Macht, nicht mit dem Eid-Kanal der Paladine","Sehr selten \xB7 65 gp"],how:["Akt 3: Ins Sturmufer-Tabernakel in der Unterstadt gehen.","Im Keller stehen Opfertruhen: das Amulett liegt in der zentralen Truhe (daneben Tyrs Truhe mit dem Hammer of the Just, Helms Truhe mit dem Shield of Shielding).","Gespendete Items landen ebenfalls in diesen Truhen \u2013 die Spende f\xFCr einen Segen h\xE4ngt von deiner Stufe ab."],npc:["npc-humbletoes"],loc:["loc-tabernacle"]},"Ring of Salving":{props:["Heilt die Tr\xE4gerin eine andere Kreatur, erh\xE4lt diese 2 zus\xE4tzliche TP","Pro Ziel \u2013 lohnt sich besonders bei Gruppenheilungen","Ungew\xF6hnlich \xB7 40 gp"],how:["In der Ebonsee-Grotte zuerst mit Blurg sprechen, dann Omeluum treffen (X 144 / Y 29).","Quest \u201EHilf Omeluum, den Parasiten zu untersuchen\u201C abschlie\xDFen.","Danach bietet er den Ring an \u2013 zusammen mit Pearl of Power Amulet und Boots of Stormy Clamour f\xFCr Gale."],npc:["npc-omeluum"],loc:["loc-myconid"]},"Circlet of Blasting":{props:["Sengender Strahl (Aktion): Wirken als Grad-2-Zauber, l\xE4dt bei langer Rast","Keine R\xFCstungs\xFCbung n\xF6tig","Selten \xB7 300 gp \xB7 0,5 kg"],how:["Ins Unterreich zur Ebonsee-Grotte \u2013 Blurg steht bei X 111 / Y \u221289.","Kaufen; er verkauft auch Melf's First Staff und Sunwalker's Gift."],npc:["npc-blurg"],loc:["loc-myconid"]},"Hood of the Weave":{props:["Arcane Enchantment: +2 auf Zauber-Rettungswurf-SG und Zauberangriffsw\xFCrfe","Teil des Weave-Sets mit Cloak und Robe of the Weave","Sehr selten \xB7 1450 gp \xB7 0,5 kg"],how:["Akt 3: Philgraves Anwesen in der Unterstadt betreten (X 14 / Y \u2212160).","Mystic Carrion verkauft die Kapuze \u2013 Quest dazu: \u201EFinde Mystic Carrions Diener\u201C.","T\xF6test du ihn stattdessen, l\xE4sst er sie fallen."],npc:["npc-carrion"],loc:["loc-philgrave"]},"Cloak of the Weave":{props:["Arcane Enchantment: +1 auf Zauber-SG und Zauberangriffsw\xFCrfe","Elemente absorbieren (Reaktion), 1\xD7 pro kurzer Rast: halber Schaden vom n\xE4chsten Elementarangriff, +1W6 dieses Elements beim n\xE4chsten Angriff","Sehr selten \xB7 300 gp \xB7 0,5 kg"],how:["Akt 3: Devil's Fee in der Unterstadt (X \u221238 / Y 17) aufsuchen.","Helsiks Sonderangebot muss erst freigeschaltet werden \u2013 danach ist der Umhang dabei, neben Caitiff Staff und Spellseeking Gloves."],npc:["npc-helsik"],loc:["loc-devilsfee"]},"Robe of Summer":{props:["Kleidung: RK 10 + GES \u2013 z\xE4hlt nicht als R\xFCstung","Resistenz gegen K\xE4lteschaden","Ungew\xF6hnlich \xB7 250 gp \xB7 1,8 kg"],how:["Im Smaragdhain ins Innere Heiligtum und weiter ins Geheimgew\xF6lbe (X 183 / Y \u221282).","Die Robe liegt in einer Truhe seitlich vom Wolfsaltar; auf dem Altar liegt Sorrow.","Laut Gale-Questseite gibt es sie auch als Belohnung, wenn Halsin \xFCberlebt."],npc:[],loc:["loc-grove"]},"Robe of the Weave":{props:["Kleidung: RK 10 + GES, dazu RK +2","Arcane Enchantment: +1 auf Zauber-SG und Zauberangriffsw\xFCrfe","Weave Eater: Schafft der Tr\xE4ger einen Rettungswurf gegen einen Zauber, heilt er 1W6 TP","Sehr selten \xB7 2900 gp \xB7 1,8 kg"],how:["Akt 3: \xFCber Lorroakan und das passende Portal in Sorcerous Sundries nach Ramazith's Tower gelangen.","Robe und Markoheshkir liegen in einem Globus der Unverwundbarkeit (X 4970 / Y 705).","Mit Unsichtbares sehen (See Invisibility) den Hebel sichtbar machen, dann Arkanwurf SG 20 \u2013 der Globus f\xE4llt."],npc:[],loc:["loc-ramazith"]},"Bracers of Defence":{props:["RK +2, solange der Tr\xE4ger keine R\xFCstung tr\xE4gt und keinen Schild h\xE4lt","Kleidung wie Robe of Summer oder Robe of the Weave z\xE4hlt nicht als R\xFCstung","Stapelt mit Magierr\xFCstung (Mage Armour)"],how:["Im Verfallenen Dorf in den Keller der Apotheke gehen.","Die vergoldete Truhe steht bei X \u2212656 / Y \u2212370 \u2013 Handschuhe herausnehmen."],npc:[],loc:["loc-blighted"]},"Boots of Stormy Clamour":{props:["Arcane Echomalefaction: Belegt der Tr\xE4ger eine feindliche Kreatur mit einem Zustand, erh\xE4lt sie 2 Runden Nachhall","bg3.wiki f\xFChrt dazu einen bekannten Bug","Ungew\xF6hnlich \xB7 70 gp \xB7 0,55 kg"],how:["In der Ebonsee-Grotte mit Blurg sprechen, dann Omeluum (X 144 / Y 29).","Quest \u201EHilf Omeluum, den Parasiten zu untersuchen\u201C abschlie\xDFen \u2013 geht gr\xF6\xDFtenteils ohne Kampf.","Danach im Sortiment kaufen."],npc:["npc-omeluum"],loc:["loc-myconid"]},"Melf's First Staff":{props:["+1 Kampfstab: 1W6 + 1 (zweih\xE4ndig 1W8 + 1) Wuchtschaden, vielseitig","Arcane Enchantment: +1 auf Zauber-SG und Zauberangriffsw\xFCrfe","Melfs S\xE4urepfeil (Aktion): Wirken als Grad-2-Zauber, l\xE4dt bei langer Rast","Ungew\xF6hnlich \xB7 100 gp \xB7 1,8 kg"],how:["Ebonsee-Grotte im Unterreich, Blurg bei X 111 / Y \u221289.","Kaufen \u2013 er f\xFChrt auch Circlet of Blasting und Sunwalker's Gift."],npc:["npc-blurg"],loc:["loc-myconid"]},Markoheshkir:{props:["+2 Kampfstab, verst\xE4rkt die Zauber des Tr\xE4gers","Auf ein Element einstimmbar \u2013 schaltet zus\xE4tzliche Zauber und Effekte frei","Kereska's Favour: 1\xD7 pro langer Rast einen Zauber kostenlos wirken","Ablegen nach Kereska's Favour entfernt den Effekt"],how:["Akt 3: nach Ramazith's Tower (\xFCber das Portal in Sorcerous Sundries).","Der Stab liegt mit der Robe of the Weave im Globus der Unverwundbarkeit (X 4970 / Y 705).","Unsichtbares sehen wirken, um den Hebel zu sehen, dann Arkanwurf SG 20 \u2013 der Globus erlischt."],npc:[],loc:["loc-ramazith"]},"Pearl of Power Amulet":{props:["Pearlescent Restoration (Aktion): einen verbrauchten Zauberplatz bis Grad 3 wiederherstellen, l\xE4dt bei langer Rast","Hat der Tr\xE4ger normale und Hexenmeister-Pl\xE4tze gleichen Grades, kommt je einer zur\xFCck","Ungew\xF6hnlich \xB7 45 gp (Ehrenmodus: selten, 155 gp)"],how:["Ebonsee-Grotte: Blurg ansprechen, dann Omeluum treffen (X 144 / Y 29).","\u201EHilf Omeluum, den Parasiten zu untersuchen\u201C abschlie\xDFen, danach kaufen."],npc:["npc-omeluum"],loc:["loc-myconid"]},"Spellcrux Amulet":{props:["Spell Slot Restoration (Bonusaktion): einen verbrauchten Zauberplatz beliebigen Grades wiederherstellen, 1\xD7 pro langer Rast","Erzeugt keine neuen Pl\xE4tze \u2013 ohne verbrauchten Platz des gew\xE4hlten Grades passiert nichts","Bonusaktion statt Aktion \u2013 Gale kann im selben Zug noch zaubern","Sehr selten \xB7 210 gp \xB7 0,05 kg"],how:["Akt 2: In den Mondaufgangst\xFCrmen ins Gef\xE4ngnis hinabsteigen (X 569 / Y \u2212650).","Die W\xE4rterin geht im ersten Stock ihres B\xFCroturms in der Mitte des Gef\xE4ngnisses umher \u2013 bestechen l\xE4sst sie sich nicht.","Beim Befreien der Gefangenen (\u201ERettet die Tieflinge\u201C / \u201ERettet Wulbren\u201C) kommt es meist zum Kampf \u2013 danach das Amulett von ihr pl\xFCndern."],npc:["npc-warden"],loc:["loc-moonrise"]},"Sunwalker's Gift":{props:["Sunwalker's Gift: Der Tr\xE4ger sieht im Dunkeln bis 12 m","Laut bg3.wiki entspricht es normaler Dunkelsicht, setzt aber nicht das Charakterlicht","Ungew\xF6hnlich \xB7 40 gp"],how:["Ebonsee-Grotte, Blurg bei X 111 / Y \u221289: kaufen.","Alternativ r\xFCckt Omeluum den Ring heraus \u2013 per Einsch\xFCchtern, \xDCberreden oder f\xFCr eine Beschreibung der Nautiloid (Auftreten SG 10 oder Intelligenz SG 10, mit Vorteil, wenn du im Prolog die Runentafel dazu gelesen hast)."],npc:["npc-blurg","npc-omeluum"],loc:["loc-myconid"]},"Shifting Corpus Ring":{props:["Unsichtbarkeit (Aktion): Wirken als Grad-2-Zauber, l\xE4dt bei langer Rast","Verschwimmen (Aktion): Wirken als Grad-2-Zauber, l\xE4dt bei langer Rast","Beide brauchen Konzentration \u2013 nicht zusammen mit Hast","Selten \xB7 70 gp \xB7 0,05 kg"],how:["Akt 2: Faust Marcus taucht im Letzten Licht auf, um Isobel zu entf\xFChren.","Ihn im Kampf besiegen (X \u221263 / Y 163) und den Ring pl\xFCndern."],npc:["npc-marcus"],loc:["loc-lastlight"]},"Scale Mail +1":{props:["Mittlere R\xFCstung: RK 15 + GES (max. +2) \u2013 mit GES 10 also RK 15","Verzauberung +1","Superior Material: Du nimmst 1 Hiebschaden weniger","Nachteil auf Heimlichkeit","160 gp \xB7 12 kg"],how:["H\xE4ndler w\xFCrfeln magische R\xFCstungen aus einer gestuften Tabelle \u2013 der Schuppenpanzer +1 taucht bei Spielerstufe 4\u20136 auf.","Bei dir hatte ihn Roah Moonglow im Zhentarim-Lager des Zerschmetterten Heiligtums (X 275 / Y \u221229).","Steht er nicht im Angebot: nach einer langen Rast oder einem Stufenaufstieg erneut schauen."],npc:["npc-roah"],loc:["loc-goblin"]},"Luminous Armour":{props:["Mittlere R\xFCstung: RK 15 + GES (max. +2), Verzauberung +1","Radiating Shockwave: Jeder glei\xDFende Schaden, den du machst, belegt Nicht-Verb\xFCndete im Umkreis von 3 m mit Radiating Orb","Radiating Orb: 2 Z\xFCge, \u22121 auf Angriffe je verbleibendem Zug, das Ziel leuchtet hell; jeder Angriff des Ziels verk\xFCrzt die Dauer um 2","Trifft keine Verb\xFCndeten, aber neutrale Kreaturen","Ausl\xF6ser f\xFCr dich: G\xF6ttliches Niederstrecken, G\xF6ttliche Gunst, Ring des kaltherzigen Leuchtens","250 gp \xB7 9 kg"],how:["Im Sel\xFBnitischen Au\xDFenposten zur Stelle X 176 / Y \u2212247.","Die Prunktruhe steht hinter einer Geheimt\xFCr: per Wahrnehmungswurf entdecken \u2013 oder vom Raum mit dem Wegpunkt hin\xFCberspringen.","Die Truhe ist verschlossen und mit einer Falle gesichert: erst die Falle entsch\xE4rfen, dann das Schloss knacken.","Im selben Au\xDFenposten liegt auch der Helm des Niederstreckens \u2013 gleich mitnehmen."],loc:["loc-outpost"]},"Everburn Blade":{props:["Gro\xDFschwert, 2W6 Hieb + 1W4 Feuer","Ignoriert Resistenz gegen nicht-magischen Hiebschaden","Pommel Strike (Bonusaktion): nicht-t\xF6dlicher Schlag, kann benommen machen; l\xE4dt bei kurzer Rast"],how:["Prolog: Kommandant Zhalk k\xE4mpft am Steuer der Nautiloid gegen einen Gedankenschinder.","Ihn zu t\xF6ten gibt die Klinge und Extra-EP \u2013 oder ihn per Befehl: Fallenlassen entwaffnen (er besteht den Rettungswurf oft).","Der Kampf hat ein Limit von 15 Z\xFCgen, danach kommen Cambion-Verst\xE4rkungen.","Nach dem Absturz nicht mehr erreichbar \u2013 f\xFCr dich also verpasst."],npc:["npc-zhalk"],loc:["loc-nautiloid"]},"Svartlebee's Woundseeker":{props:["Gro\xDFschwert +1, 2W6 Hieb","Deepen the Wound: +1W4 auf Angriffsw\xFCrfe mit dieser Waffe gegen Kreaturen, die schon Schaden genommen haben"],how:["Akt 1: Waukeens Rast (X \u221266 / Y 609) \u2013 Gauntlet Yeva vom Flammenden Faust tr\xE4gt es.","Erbeuten l\xE4sst es sich nur, wenn Yeva f\xE4llt.","Lebt sie, steckt sie in Akt 2 in einer Kapsel im Kaulquappen-Zentrum der Gedankenschinder-Kolonie und tr\xE4gt es weiterhin."],npc:["npc-yeva"],loc:["loc-waukeen"]},"Sword of Chaos":{props:["Gro\xDFschwert +2: 2W6 + 2 Hieb + 1W4 nekrotisch","Chaos: Jeder Schadenstreffer heilt dich um 1W6 (Schaden an Gegenst\xE4nden z\xE4hlt nicht)","Sehr selten \xB7 960 gp"],how:["Akt 3: Mordtribunal unter Candulhallows Grabsteinen in der Unterstadt.","Sarevok Anchev tr\xE4gt es \u2013 zusammen mit dem Amulett des Bhaal und seinem geh\xF6rnten Helm.","Er wird feindlich, wenn du nach Orins Tod ins Tribunal zur\xFCckkehrst."],npc:["npc-sarevok"],loc:["loc-lowercity"]},"Armour of Persistence":{props:["Schwere R\xFCstung: RK 20","\u22122 auf jeden erlittenen Schaden","Dauerhaft Resistance (+1W4 auf Rettungsw\xFCrfe)","Dauerhaft Blade Ward (Resistenz gegen Wucht, Stich und Hieb)"],how:["Akt 3: Dammon verkauft sie in der Schmiede der Neun in der Unterstadt."],npc:["npc-dammon"]
