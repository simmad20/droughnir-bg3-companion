brecher-Ritter niemals t\xF6ten":"Never kill the Oathbreaker Knight","Ist der Ritter tot, verweigert Der Verdorrte (Withers) den Respec f\xFCr den Rest des Durchgangs \u2013 auch nach einer sp\xE4teren R\xFCckkehr zum Eid.":"If the Knight is dead, Withers refuses to respec you for the rest of the playthrough \u2013 even after returning to your oath later.","Schattenherz auf Dom\xE4ne des Lichts umskillen":"Respec Shadowheart to Light Domain","Ihre Trickserei-Dom\xE4ne hilft dir kaum. Licht gilt in Patch-8-Guides als beste Allround-Wahl, Leben, wenn sie die einzige Heilerin ist. Sie ist kein Eidbrecher, Der Verdorrte skillt sie ganz normal um. Erstes Talent f\xFCr sie: Kriegszauberer (War Caster), damit Segnen h\xE4lt.":"Her Trickery Domain barely helps you. Patch 8 guides rate Light as the best all-round pick, Life if she is your only healer. She is not an Oathbreaker, so Withers respecs her normally. Her first feat: War Caster, so Bless holds.","Elixiere der H\xFCgelriesenst\xE4rke horten":"Stockpile Elixirs of Hill Giant Strength","ST\xC4 21 bis zur langen Rast \u2013 bis zu den Panzerhandschuhen dein Standard-Elixier vor Bossk\xE4mpfen. Nur ein Elixier gleichzeitig aktiv.":"STR 21 until long rest \u2013 your standard elixir before boss fights until you get the Gauntlets. Only one elixir active at a time.","Kein Respec mehr bei Der Verdorrte":"No more respec at Withers","Withers skillt Eidbrecher nicht um. Stufenaufstiege bewusst planen \u2013 Klasse hinzuf\xFCgen beim Aufstieg geht weiterhin normal. Umskillen nur nach Wiederherstellung des Eides (1.000 Gold).":"Withers won't respec Oathbreakers. Plan level-ups carefully \u2013 adding a class on level-up still works normally. Respec only after restoring your oath (1,000 gold).","ST\xC4-17-Entscheidung treffen":"Make the STR 17 decision","ST\xC4 17 behalten und mit Tantchen Ethels Haar (Auntie Ethel's Hair) vor Stufe 4 auf 18 bringen. Der alte Plan B (Umskillen bei Der Verdorrte) geht als Eidbrecher nicht mehr.":"Keep STR 17 and raise it to 18 with Auntie Ethel's Hair before level 4. The old plan B (respec at Withers) no longer works as an Oathbreaker.","Gro\xDFschwert +1 (Greatsword +1) kaufen \u2013 \xDCbergangswaffe":"Buy Greatsword +1 \u2013 stopgap weapon","Ersatz f\xFCr die verpasste Immergl\xFCh-Klinge (Everburn Blade). Bei Dammon oft im Sortiment, bei Grat im Goblinlager garantiert. Rund 85 gp Basispreis. Alternative: Blutige Gro\xDFaxt (Blooded Greataxe).":"Replacement for the missed Everburn Blade. Often in Dammon's stock, guaranteed at Grat in the Goblin Camp. About 85 gp base price. Alternative: Blooded Greataxe.","Das fl\xFCsternde Versprechen (The Whispering Promise) bei Volo":"The Whispering Promise from Volo","Rund 84 gp. Volo verschwindet nach seinem Auftritt im Hain; Fallback ist Grat im Goblinlager. An Schattenherz geben.":"About 84 gp. Volo disappears after his performance in the Grove; fallback is Grat in the Goblin Camp. Give it to Shadowheart.","Jagdkurzbogen (Hunting Shortbow) f\xFCr Astarion":"Hunting Shortbow for Astarion","Bei Dammon (laut Nizar GG). \xDCbergangsbogen f\xFCr Astarion, bis der Bogen der Todesfee da ist.":"Sold by Dammon (per Nizar GG). Stopgap bow for Astarion until you have the Bow of the Banshee.","Smaragdhain \u2192 Uferteehaus":"Emerald Grove \u2192 Riverside Teahouse","Quest \u201ERettet Mayrina\u201C (Tantchen Ethel) starten":'Start the quest "Rescue the Grieving Mother" (Auntie Ethel)',"Ethel im Hain ansprechen; die Spur f\xFChrt zum Uferteehaus (Riverside Teahouse).":"Talk to Ethel in the Grove; the trail leads to the Riverside Teahouse.","Mondtropfenanh\xE4nger (Moondrop Pendant)":"Moondrop Pendant","Die Sel\xFBne-Truhe ist versiegelt: Gebetsblatt hinter der Sel\xFBne-Statue finden (Wahrnehmung) und davor vorlesen. Effekt: unter 50 % TP keine Gelegenheitsangriffe.":"The Sel\xFBne chest is sealed: find the prayer page behind the Sel\xFBne statue (Perception) and read it in front of it. Effect: below 50% HP no opportunity attacks against you.","Tantchen Ethels Haar \u2192 +1 ST\xC4":"Auntie Ethel's Hair \u2192 +1 STR","Nur im Versteck (nicht im Teehaus) unter etwa 20 % TP bringen und warten \u2013 sie feilscht um ihr Leben. Nicht verstummen lassen! Mayrina kannst du per \xDCberzeugen trotzdem retten. Das Haar kann Werte \xFCber 20 heben. ST\xC4 oder CHA? Siehe Tab \u201EWege\u201C \u2013 kurz: ST\xC4 bringt dir in Akt 1\u20132 sofort +1 Treffer und Schaden, CHA erst mit weiteren ungeraden Boni.":`Only in her hideout (not the teahouse): bring her below about 20% HP and wait \u2013 she bargains for her life. Don't silence her! You can still save Mayrina via Persuasion. The hair can raise scores above 20. STR or CHA? See the "Routes" tab \u2013 short: STR gives you +1 to hit and damage right away in Acts 1\u20132, CHA only with further odd bonuses.`,"Trank \u201EGebrochene Versprechen\u201C (Broken Promises) NICHT trinken":'Do NOT drink the potion "Broken Promises"',"Hexentrank aus Ethels Werkstatt: +2 ST\xC4 bis zur langen Rast, danach \u22121 ST\xC4 dauerhaft. Verkaufen oder liegen lassen.":"Witch potion from Ethel's workshop: +2 STR until long rest, then \u22121 STR permanently. Sell it or leave it.",Goblinlager:"Goblin Camp","Grat: Gro\xDFschwert +1 / Das fl\xFCsternde Versprechen (Fallback)":"Grat: Greatsword +1 / The Whispering Promise (fallback)","Falls im Hain verpasst.":"If missed in the Grove.","Zerschmettertes Heiligtum":"Shattered Sanctum","Handschuhe des grummelnden Verlierers (Gloves of the Growling Underdog)":"Gloves of the Growling Underdog","Dror Ragzlins Schatzkisten hinter dem Eisentor (X 298 / Y 66): SG 18 Fingerfertigkeit oder Drors Schl\xFCssel. Vorteil auf Angriffe, wenn 2+ Gegner nahe dem Ziel stehen.":"Dror Ragzlin's treasure chests behind the iron gate (X 298 / Y 66): DC 18 Sleight of Hand or Dror's key. Advantage on attacks when 2+ enemies are near the target.","Stiefel des Schreitens (Boots of Striding) \u2013 Minthara":"Boots of Striding \u2013 Minthara","Guter Pfad: Minthara besiegen und pl\xFCndern. W\xE4hrend Konzentration nicht umsto\xDFbar, Konzentrationszauber geben Schwung \u2013 ideal mit Krone des Wahnsinns und Hast.":"Good path: defeat and loot Minthara. Can't be knocked prone while concentrating, concentration spells grant Momentum \u2013 ideal with Crown of Madness and Haste.","Sel\xFBnitischer Au\xDFenposten (Unterreich)":"Sel\xFBnite Outpost (Underdark)","Helm des Niederstreckens (Helmet of Smiting)":"Helmet of Smiting","Verschlossene vergoldete Truhe (X 163 / Y \u2212248). Zugang z. B. \xFCber den Geheimgang im Zerschmetterten Heiligtum.":"Locked gilded chest (X 163 / Y \u2212248). Access e.g. via the secret passage in the Shattered Sanctum.","Unterreich \u2013 Myconid-Kolonie":"Underdark \u2013 Myconid Colony","\xC4tzendes Band (Caustic Band) bei Derryth Bonecloak":"Caustic Band from Derryth Bonecloak","+2 S\xE4ureschaden pro Waffentreffer \u2013 doppelt wertvoll ab Zus\xE4tzlicher Angriff. Derryth verkauft es in Akt 3 erneut.":"+2 acid damage per weapon hit \u2013 twice as valuable once you have Extra Attack. Derryth sells it again in Act 3.","Boot zur Grymschmiede":"Boat to the Grymforge","Jorgorals Gro\xDFschwert (Jorgoral's Greatsword) \u2013 Korsar Greymon":"Jorgoral's Greatsword \u2013 Corsair Greymon","+1, 2W6+1 Hieb, Spezialaktion Kolossaler Ansturm (Colossal Onslaught). Kaufen oder pl\xFCndern \u2013 Greymon NICHT ins Wasser sto\xDFen, sonst ist die Beute weg.":"+1, 2d6+1 slashing, special action Colossal Onslaught. Buy or loot it \u2013 do NOT push Greymon into the water, or the loot is gone.","Bogen der Todesfee (Bow of the Banshee) f\xFCr Astarion \u2013 Korsar Greymon":"Bow of the Banshee for Astarion \u2013 Corsair Greymon","Seltener +1-Kurzbogen: kann bei Treffer Ver\xE4ngstigt ausl\xF6sen und gibt +1W4 auf Angriff und Schaden gegen ver\xE4ngstigte Ziele. Auf dem Boot pl\xFCndern oder sp\xE4ter bei Greymon in der Grymschmiede kaufen.":"Rare +1 shortbow: can inflict Frightened on hit and gives +1d4 to attack and damage against frightened targets. Loot it on the boat or buy it later from Greymon in the Grymforge.","Adamant-Schienenpanzer (Adamantine Splint Armour) schmieden":"Forge the Adamantine Splint Armour","Schienen-Gussform (Splint Mould) bei X \u2212593 / Y 311 nahe Wegpunkt Alte Schmiede, dazu Mithrilerz. Danach Grym besiegen. RK 18, immun gegen Krits.":"Splint Mould at X \u2212593 / Y 311 near the Ancient Forge waypoint, plus Mithral Ore. Then defeat Grym. AC 18, immune to critical hits.",Gebirgspass:"Mountain Pass","Lae'zels Quest / Rosymorn-Kloster (optional)":"Lae'zel's quest / Rosymorn Monastery (optional)","H\xE4ndler und Loot im Pass mitnehmen.":"Pick up the traders and loot in the pass.","Schwert der Gerechtigkeit (Sword of Justice) \u2013 Anders":"Sword of Justice \u2013 Anders","Ungew\xF6hnliches +1-Gro\xDFschwert mit dem Zauber Tyrs Schutz. Anders gibt es dir f\xFCr Karlachs Kopf \u2013 oder du nimmst es ihm ab, wenn du dich auf Karlachs Seite stellst und ihn besiegst (empfohlen, so bekommst du Karlach als Gef\xE4hrtin).":"Uncommon +1 greatsword with the spell Tyr's Protection. Anders gives it to you for Karlach's head \u2013 or you take it from him if you side with Karlach and defeat him (recommended, so you get Karlach as a companion).","Gebirgspass \u2013 Krippe Y'llek":"Mountain Pass \u2013 Cr\xE8che Y'llek","Ring des seltsamen Leiters (Strange Conduit Ring)":"Strange Conduit Ring","Truhe in der Kammer des Inquisitors in der Krippe Y'llek. +1W4 psychisch auf Waffenangriffe, solange du dich auf einen Zauber konzentrierst \u2013 mit Magische Waffe ab Stufe 5 praktisch dauerhaft.":"Chest in the Inquisitor's Chamber in the Cr\xE8che Y'llek. +1d4 psychic on weapon attacks while you concentrate on a spell \u2013 with Magic Weapon from level 5 practically permanent.","Gebirgspass \u2013 Pfad zum Rosymorn-Kloster":"Mountain Pass \u2013 Rosymorn Monastery Trail","Gloves of Baneful Striking bei Lady Esther":"Gloves of Baneful Striking from Lady Esther","Ungew\xF6hnlich, sp\xE4tes Akt 1. Erreichbar \xFCber den Gebirgspass oder von der Goblinlager-Seite. Nach jedem Waffentreffer \u22121W4 auf den Rettungswurf des Ziels gegen deinen n\xE4chsten Zauber.":"Uncommon, late Act 1. Reachable via the Mountain Pass or from the Goblin Camp side. After every weapon hit \u22121d4 to the target's saving throw against your next spell.","Point of no Return":"Point of no Return","Vor Akt 2: Akt-1-Restliste pr\xFCfen":"Before Act 2: check the Act 1 leftovers","Ethels Haar, Helm (Au\xDFenposten), Adamant-R\xFCstung, Jorgoral, H\xE4ndlerk\xE4ufe. Nach dem \xDCbergang ins Schattenverfluchte Land kommst du nicht zur\xFCck.":"Ethel's Hair, helmet (Outpost), Adamantine armour, Jorgoral, trader purchases. After moving into the Shadow-Cursed Lands you can't come back.","Letztes Licht (Last Light Inn)":"Last Light Inn","Umhang des Schutzes (Cloak of Protection) \u2013 Quartiermeisterin Talli":"Cloak of Protection \u2013 Quartermaster Talli","+1 RK, +1 auf alle Rettungsw\xFCrfe. F\xE4llt das Gasthaus, stirbt Talli \u2013 sofort kaufen.":"+1 AC, +1 to all saving throws. If the inn falls, Talli dies \u2013 buy it right away.","Fehlerhafte H\xF6llend\xE4mmerungs-Handschuhe (Flawed Helldusk Gloves) bei Dammon":"Flawed Helldusk Gloves from Dammon","Dammon schmiedet aus Infernalem Eisen in fester Reihenfolge: erst R\xFCstung, dann Helm, dann Handschuhe \u2013 du brauchst also drei St\xFCck. +1W4 Feuer auf jeden Waffenangriff.":"Dammon forges from Infernal Iron in a fixed order: armour first, then helmet, then gloves \u2013 so you need three pieces. +1d4 fire on every weapon attack.","Gasthaus und Isobel sch\xFCtzen":"Protect the inn and Isobel","Sichert H\xE4ndler und Story-Pfad.":"Secures traders and the story path.","Level 5":"Level 5","Zus\xE4tzlicher Angriff + Magische Waffe einsatzbereit":"Extra Attack + Magic Weapon ready","Neue Eidzauber: Krone des Wahnsinns (Crown of Madness) und Dunkelheit (Darkness). Magische Waffe (Magic Weapon) vorbereiten. Gale lernt Hast (Haste) und castet sie auf Droughnir; Person festhalten \xFCbernimmt ebenfalls Gale.":"New oath spells: Crown of Madness and Darkness. Prepare Magic Weapon. Gale learns Haste and casts it on Droughnir; Gale also takes over Hold Person.","Schattenverfluchte Lande":"Shadow-Cursed Lands","Ab Stufe 6: Schatten und Gespenster kontrollieren":"From level 6: control Shadows and Wraiths","Schatten und Gespenster (Wraiths) sind Level 5. Bonus: Wer im Schattenfluch stirbt, steht nach ein, zwei Runden als Untoter wieder auf und l\xE4sst sich dann kontrollieren.":"Shadows and Wraiths are level 5. Bonus: whoever dies in the Shadow Curse rises again as undead after a turn or two and can then be controlled.","Trank der ewigen Kraft (Potion of Everlasting Vigour): +2 ST\xC4 dauerhaft":"Potion of Everlasting Vigour: +2 STR permanently","Araj Oblodra im Erdgeschoss ansprechen und Astarion \xFCberreden, sie zu bei\xDFen. Erledigen, bevor du die T\xFCrme st\xFCrmst.":"Talk to Araj Oblodra on the ground floor and persuade Astarion to bite her. Do it before you storm the towers.","Shar-Pr\xFCfung (Gauntlet of Shar)":"Gauntlet of Shar","Ring des kaltherzigen Leuchtens (Callous Glow Ring)":"Callous Glow Ring","Prunktruhe ganz rechts in der Schatzkammer neben Balthazar; die T\xFCr hat SG 30 Fingerfertigkeit. +2 glei\xDFend gegen beleuchtete Ziele \u2013 bei jeder Schadensinstanz.":"Ornate chest on the far right in the treasury next to Balthazar; the door is DC 30 Sleight of Hand. +2 radiant against illuminated targets \u2013 on every damage instance.","Level 7 \u2013 vor dem Haus der Heilung":"Level 7 \u2013 before the House of Healing","Aura des Hasses aktivieren":"Activate Aura of Hate","+CHA-Mod Schaden auf Nahkampfwaffenangriffe f\xFCr dich und alle Unholde und Untoten in 3 m \u2013 auch feindliche. Einmal anklicken, danach bleibt sie aktiv. Feindliche Untote neben dir zuerst t\xF6ten.":"+CHA modifier damage on melee weapon attacks for you and all fiends and undead within 3 m \u2013 enemies too. Click it once, then it stays active. Kill enemy undead next to you first.","Ab Stufe 8: Malus Thorm kontrollieren":"From level 8: control Malus Thorm","Malus Thorm ist Level 7 und \u2013 anders als Balthazar und die anderen Thorms \u2013 nicht immun. So umgehst du den Bosskampf gro\xDFteils. Die untoten Krankenschwestern (Level 6) gehen schon ab Stufe 7.":"Malus Thorm is level 7 and \u2013 unlike Balthazar and the other Thorms \u2013 not immune. This way you mostly skip the boss fight. The undead nurses (level 6) already work from level 7.","Level 6":"Level 6","Aura des Schutzes aktiv \u2013 Gruppe eng halten":"Aura of Protection active \u2013 keep the party close","+CHA-Mod auf Rettungsw\xFCrfe f\xFCr alle Verb\xFCndeten in 3 m.":"+CHA modifier on saving throws for all allies within 3 m.","Haus der Hoffnung \u2013 Archiv":"House of Hope \u2013 Archive","Panzerhandschuhe der H\xFCgelriesenst\xE4rke (Gauntlets of Hill Giant Strength)":"Gauntlets of Hill Giant Strength","Setzen ST\xC4 auf 23. Sockelfalle: SG 20 Fingerfertigkeit. Kein Respec n\xF6tig \u2013 dein investierter ST\xC4-Wert ist dann einfach \xFCbersch\xFCssig.":"Set STR to 23. Pedestal trap: DC 20 Sleight of Hand. No respec needed \u2013 your invested STR is then simply surplus.","Amulett der gr\xF6\xDFeren Gesundheit (Amulet of Greater Health)":"Amulet of Greater Health","Setzt KON auf 23 \u2013 im gleichen Raum wie die Panzerhandschuhe.":"Sets CON to 23 \u2013 in the same room as the Gauntlets.","H\xF6llend\xE4mmerungs-R\xFCstung (Helldusk Armour)":"Helldusk Armour","Raphael besiegen. RK 21, Fliegen ohne Konzentration, Feuerresistenz (f\xFCr dich doppelt). Die passenden Stiefel tr\xE4gt Gortash (Wyrmfels).":"Defeat Raphael. AC 21, flight without concentration, fire resistance (doubled up for you). The matching boots are worn by Gortash (Wyrm's Rock).","Unterstadt \u2013 Haus der Trauer":"Lower City \u2013 House of Grief","Spiegel des Verlusts (Mirror of Loss): +2 CHA":"Mirror of Loss: +2 CHA","Nur der Spiegel im Haus der Trauer (Schattenherz' Quest) funktioniert, der in der Shar-Pr\xFCfung ist zerbrochen. SG 25 Arkane Kunde und SG 20 Religion, dann eine Erinnerung opfern: \u22122 auf ein unwichtiges Attribut (mit Fluch brechen entfernbar), +2 dauerhaft auf CHA.":"Only the mirror in the House of Grief (Shadowheart's quest) works, the one in the Gauntlet of Shar is broken. DC 25 Arcana and DC 20 Religion, then sacrifice a memory: \u22122 on an unimportant ability (removable with Remove Curse), +2 permanently on CHA.","Drachenweg unter Wyrmfels":"Wyrmway beneath Wyrm's Rock","Baldurans Riesent\xF6ter (Balduran's Giantslayer)":"Balduran's Giantslayer","Legend\xE4r, +3. Beide Drachenkopf-Fackeln mit Blitzschaden treffen, vier Pr\xFCfungen bestehen, Ansur besiegen. Die Passive addiert deinen ST\xC4-Modifikator ein zweites Mal, Vorteil gegen gro\xDFe Ziele \u2013 deine Endwaffe.":"Legendary, +3. Hit both dragon-head torches with lightning damage, pass four trials, defeat Ansur. The passive adds your STR modifier a second time, advantage against large targets \u2013 your endgame weapon.","Helm des Balduran (Helm of Balduran)":"Helm of Balduran","Auf dem Altar hinter Ansur. Heilt 2 TP pro Zug \u2013 kleine Dauer-Regeneration f\xFCr die Glaskanone.":"On the altar behind Ansur. Heals 2 HP per turn \u2013 small permanent regeneration for the glass cannon.","Handschuhe und Amulett anlegen \u2013 ohne Respec":"Equip Gauntlets and Amulet \u2013 no respec","Als Eidbrecher skillt Der Verdorrte nicht um. Panzerhandschuhe (ST\xC4 23) und Amulett (KON 23) wirken trotzdem voll; CHA hebst du per Talent auf 18.":"As an Oathbreaker, Withers won't respec you. Gauntlets (STR 23) and Amulet (CON 23) still work fully; raise CHA to 18 with a feat.",Vorrat:"Supplies","Elixiere der H\xFCgelriesenst\xE4rke (ST\xC4 21) f\xFCr Bosse":"Elixirs of Hill Giant Strength (STR 21) for bosses","Bis die Handschuhe da sind, je ein Elixier pro Bosskampf.":"Until you have the Gauntlets, one elixir per boss fight.","Akt 1 \xB7 Ruinen \u2192 Smaragdhain \u2192 Goblinlager \u2192 Unterreich \u2192 Grymschmiede \u2192 Gebirgspass":"Act 1 \xB7 Ruins \u2192 Emerald Grove \u2192 Goblin Camp \u2192 Underdark \u2192 Grymforge \u2192 Mountain Pass","Akt 2 \xB7 Schattenverfluchtes Land":"Act 2 \xB7 Shadow-Cursed Lands","Akt 3 \xB7 Baldurs Tor":"Act 3 \xB7 Baldur's Gate",Waffe:"Weapon",Sofort:"Immediately","Dammon (Smaragdhain) oder garantiert bei Grat (Goblinlager)":"Dammon (Emerald Grove) or guaranteed at Grat (Goblin Camp)","+1 Treffer und Schaden; 2W6 profitiert maximal von Kampf mit gro\xDFen Waffen. Ersatz f\xFCr die verpasste Immergl\xFCh-Klinge.":"+1 to hit and damage; 2d6 benefits most from Great Weapon Fighting. Replacement for the missed Everburn Blade.","Akt 1":"Act 1","Korsar Greymon \u2013 Boot zur Grymschmiede (nicht ins Wasser sto\xDFen)":"Corsair Greymon \u2013 boat to the Grymforge (don't push him into the water)","+1, Kolossaler Ansturm trifft alle in einer Linie. H\xE4lt bis Akt 3.":"+1, Colossal Onslaught hits everyone in a line. Lasts until Act 3.","Anders, Aufgestiegene Stra\xDFe \u2013 besiegen (Karlachs Seite) oder als Belohnung":"Anders, Risen Road \u2013 defeat him (Karlach's side) or as a reward","+1-Gro\xDFschwert mit dem Zauber Tyrs Schutz. Gleichwertige Alternative zum Gro\xDFschwert +1, falls du Grat und Dammon verpasst.":"+1 greatsword with the spell Tyr's Protection. An equal alternative to the Greatsword +1 if you miss Grat and Dammon.","Akt 3":"Act 3","Drache Ansur, Drachenweg unter Wyrmfels (Fackeln mit Blitz treffen, 4 Pr\xFCfungen)":"Dragon Ansur, Wyrmway beneath Wyrm's Rock (hit torches with lightning, 4 trials)","+3. Die Riesent\xF6ter-Passive verdoppelt nicht den Angriffs-Modifikator, sondern addiert deinen ST\xC4-Modifikator einmal pauschal: ungebunden 1\xD7 ST\xC4 + 1\xD7 ST\xC4 (mit ST\xC4 23 also +12). Als Paktwaffe gebunden: 1\xD7 CHA + 1\xD7 ST\xC4. Dazu Vorteil gegen gro\xDFe Ziele und Riesengestalt 1\xD7 pro kurzer Rast.":"+3. The Giantslayer passive does not double the attack modifier, it adds your STR modifier once as a flat bonus: unbound 1\xD7 STR + 1\xD7 STR (so +12 with STR 23). Bound as a pact weapon: 1\xD7 CHA + 1\xD7 STR. Plus advantage against large targets and Giant Form once per short rest.",R\u00FCstung:"Armour","Adamantschmiede, Grymschmiede (Schienen-Gussform + Mithrilerz)":"Adamantine Forge, Grymforge (Splint Mould + Mithral Ore)","RK 18, Krit-Immunit\xE4t \u2013 perfekt f\xFCr einen Nahk\xE4mpfer mitten im Gedr\xE4nge.":"AC 18, crit immunity \u2013 perfect for a melee fighter in the thick of it.","Raphael besiegen, Haus der Hoffnung":"Defeat Raphael, House of Hope","RK 21, Fliegen ohne Konzentration, automatische \xDCbung. Die Feuerresistenz hast du als Roter Drachenbl\xFCtiger schon \u2013 f\xFCr die Glaskanone z\xE4hlt die RK.":"AC 21, flight without concentration, automatic proficiency. You already have fire resistance as a Red Dragonborn \u2013 for the glass cannon the AC is what counts.",Helm:"Helmet","Sel\xFBnitischer Au\xDFenposten, vergoldete Truhe (X 163 / Y \u2212248)":"Sel\xFBnite Outpost, gilded chest (X 163 / Y \u2212248)","Temp-TP in H\xF6he des CHA-Mods, wenn ein Smite-Zauber einen Zustand ausl\xF6st; +1 auf KON-Rettungsw\xFCrfe (Konzentration f\xFCr Krone des Wahnsinns/Hast).":"Temp HP equal to your CHA modifier when a smite spell applies a condition; +1 to CON saving throws (concentration for Crown of Madness/Haste).",Handschuhe:"Gloves","Zerschmettertes Heiligtum, Drors Schatz (SG 18 oder Schl\xFCssel)":"Shattered Sanctum, Dror's treasure (DC 18 or key)","Gratis-Vorteil gleicht den GWM-Malus aus und verdoppelt fast deine Krit-Chance.":"Free advantage offsets the GWM penalty and nearly doubles your crit chance.","Akt 2":"Act 2","Dammon, Letztes Licht \u2013 aus Infernalem Eisen (drittes geschmiedetes Teil)":"Dammon, Last Light Inn \u2013 from Infernal Iron (third forged piece)","+1W4 Feuer auf jeden Waffenangriff, ST\xC4-Rettungsw\xFCrfe +1. Bei 3\u20136 Treffern pro Zug sp\xFCrbar; Teufel und D\xE4monen sind oft feuerresistent.":"+1d4 fire on every weapon attack, STR saving throws +1. Noticeable at 3\u20136 hits per turn; devils and demons are often fire resistant.","Haus der Hoffnung, Archiv (Falle SG 20)":"House of Hope, Archive (trap DC 20)","ST\xC4 23 \u2013 als Eidbrecher ohne Respec, der investierte ST\xC4-Wert ist dann einfach \xFCbersch\xFCssig.":"STR 23 \u2013 as an Oathbreaker without respec, your invested STR is then simply surplus.","Altar neben Ansur im Drachenheiligtum, Drachenweg (X 636 / Y \u2212964)":"Altar next to Ansur in the dragon sanctum, Wyrmway (X 636 / Y \u2212964)","+1 RK und Rettungsw\xFCrfe, im Kampf 2 TP Heilung zu Beginn jedes Zuges, immun gegen Bet\xE4ubung, Angreifer landen keine kritischen Treffer \u2013 ersetzt die Krit-Immunit\xE4t des Adamant-Panzers.":"+1 AC and saving throws, in combat 2 HP healing at the start of each turn, immune to Stunned, attackers can't land critical hits \u2013 replaces the crit immunity of the Adamantine armour.",Stiefel:"Boots","Minthara (Zerschmettertes Heiligtum)":"Minthara (Shattered Sanctum)","W\xE4hrend Konzentration nicht umsto\xDFbar, Schwung beim Wirken \u2013 passt zu Krone des Wahnsinns und Hast.":"Can't be knocked prone while concentrating, Momentum when casting \u2013 fits Crown of Madness and Haste.",Umhang:"Cloak","Quartiermeisterin Talli, Letztes Licht":"Quartermaster Talli, Last Light Inn","+1 RK und +1 auf alle Rettungsw\xFCrfe \u2013 stapelt mit Aura des Schutzes. Glaskanone: ablegen, sobald Schattenherz Schild des Glaubens oder Sch\xFCtzendes Band zuverl\xE4ssig h\xE4lt.":"+1 AC and +1 to all saving throws \u2013 stacks with Aura of Protection. Glass cannon: take it off once Shadowheart reliably holds Shield of Faith or Warding Bond.",Amulett:"Amulet","Eulenb\xE4renh\xF6hle, Sel\xFBne-Truhe (Gebetsblatt)":"Owlbear Nest, Sel\xFBne chest (prayer page)","Unter 50 % TP keine Gelegenheitsangriffe \u2013 sicherer R\xFCckzug ohne Nebelschritt.":"Below 50% HP no opportunity attacks \u2013 safe retreat without Misty Step.","Haus der Hoffnung, Archiv":"House of Hope, Archive","KON 23 \u2013 mehr TP und sicherere Konzentration.":"CON 23 \u2013 more HP and safer concentration.",Ring:"Ring","Krippe Y'llek, Kammer des Inquisitors (Gebirgspass)":"Cr\xE8che Y'llek, Inquisitor's Chamber (Mountain Pass)","+1W4 psychisch auf Waffenangriffe, solange du dich konzentrierst. Magische Waffe oder Elementarwaffe auf dich selbst halten den Ring dauerhaft an.":"+1d4 psychic on weapon attacks while you concentrate. Magic Weapon or Elemental Weapon on yourself keep the ring active permanently.","Shar-Pr\xFCfung, Schatzkammer neben Balthazar (T\xFCr SG 30)":"Gauntlet of Shar, treasury next to Balthazar (door DC 30)","+2 glei\xDFend gegen beleuchtete Ziele bei jeder Schadensinstanz \u2013 mit Fackel oder Licht-Zauber von Schattenherz fast immer aktiv.":"+2 radiant against illuminated targets on every damage instance \u2013 almost always active with a torch or Shadowheart's Light spell.","Derryth Bonecloak, Myconid-Kolonie":"Derryth Bonecloak, Myconid Colony","+2 S\xE4ure pro Treffer \u2013 skaliert mit Zus\xE4tzlichem Angriff und GWM-Bonusangriff.":"+2 acid per hit \u2013 scales with Extra Attack and the GWM bonus attack.","Ring (Schattenherz)":"Ring (Shadowheart)","Volo (Smaragdhain) oder Grat (Goblinlager)":"Volo (Emerald Grove) or Grat (Goblin Camp)","Schattenherz heilt dich mit Heilendes Wort, du wirst ohne ihre Konzentration Gesegnet (+1W4).":"Shadowheart heals you with Healing Word and you get Blessed (+1d4) without her concentration.","Fernkampf (Astarion)":"Ranged (Astarion)","Dammon (Smaragdhain, laut Nizar GG)":"Dammon (Emerald Grove, per Nizar GG)","\xDCbergangsbogen f\xFCr Astarion bis zum Bogen der Todesfee.":"Stopgap bow for Astarion until the Bow of the Banshee.","Korsar Greymon \u2013 auf dem Boot pl\xFCndern oder in der Grymschmiede kaufen":"Corsair Greymon \u2013 loot on the boat or buy in the Grymforge","+1, kann bei Treffer Ver\xE4ngstigt ausl\xF6sen; +1W4 auf Angriff und Schaden gegen ver\xE4ngstigte Ziele \u2013 perfekt nach deinem Gr\xE4sslichen Aussehen.":"+1, can inflict Frightened on hit; +1d4 to attack and damage against frightened targets \u2013 perfect after your Dreadful Aspect.","Lady Esther, Pfad zum Rosymorn-Kloster (sp\xE4tes Akt 1)":"Lady Esther, Rosymorn Monastery Trail (late Act 1)","Nach jedem Waffentreffer \u22121W4 auf den Rettungswurf des Ziels gegen deinen n\xE4chsten Zauber (z. B. Befehl). Ob es auch f\xFCr Eid-F\xE4higkeiten gilt, ist nicht belegt.":"After every weapon hit \u22121d4 to the target's saving throw against your next spell (e.g. Command). Whether it also applies to oath abilities is not confirmed.","Paladin 2":"Paladin 2","Kampf mit gro\xDFen Waffen \xB7 G\xF6ttliches Niederstrecken (Divine Smite) \xB7 Zauberwirken":"Great Weapon Fighting \xB7 Divine Smite \xB7 Spellcasting","Vorbereiten: Befehl (Command), Donnerndes und Zorniges Niederstrecken, Schild des Glaubens (Shield of Faith), G\xF6ttliche Gunst (Divine Favour). Segnen (Bless) \xFCbernimmt Schattenherz.":"Prepare: Command, Thunderous and Wrathful Smite, Shield of Faith, Divine Favour. Shadowheart covers Bless.","Paladin 3 \u2013 Eidbrecher":"Paladin 3 \u2013 Oathbreaker","Trotziges Leid (Spiteful Suffering) \xB7 Untote kontrollieren (Control Undead) \xB7 Gr\xE4ssliches Aussehen (Dreadful Aspect) \xB7 G\xF6ttliche Gesundheit":"Spiteful Suffering \xB7 Control Undead \xB7 Dreadful Aspect \xB7 Divine Health","Eine Eid-Ladung pro kurzer Rast f\xFCr alle drei F\xE4higkeiten. Eidzauber immer vorbereitet: H\xF6llischer Tadel, Wunden verursachen. Vorbereiten (6): Befehl, Schild des Glaubens, G\xF6ttliche Gunst, Donnerndes und Zorniges Niederstrecken, Wunden heilen.":"One Channel Oath charge per short rest for all three abilities. Oath spells always prepared: Hellish Rebuke, Inflict Wounds. Prepare (6): Command, Shield of Faith, Divine Favour, Thunderous and Wrathful Smite, Cure Wounds.","Paladin 4":"Paladin 4","Talent: Meisterschaft gro\xDFer Waffen (Great Weapon Master)":"Feat: Great Weapon Master","+10 Schaden pro Treffer bei \u22125 Treffer, plus Bonusangriff nach Krit oder Kill. Ein Kill durch G\xF6ttliches Niederstrecken l\xF6st den Bonusangriff nicht aus. \u201EAll In\u201C nur mit Vorteil oder Segnen.":`+10 damage per hit at \u22125 to hit, plus a bonus attack after a crit or kill. A kill by Divine Smite doesn't trigger the bonus attack. "All In" only with advantage or Bless.`,"Paladin 5":"Paladin 5","Zus\xE4tzlicher Angriff (Extra Attack) \xB7 Grad-2-Pl\xE4tze \xB7 Eidzauber Krone des Wahnsinns & Dunkelheit":"Extra Attack \xB7 level 2 slots \xB7 oath spells Crown of Madness & Darkness","Vorbereiten: Magische Waffe (Magic Weapon) \u2013 gleicht den GWM-Malus aus und h\xE4lt den Ring des seltsamen Leiters an \u2013 plus Brandmarkendes Niederstrecken (Branding Smite).":"Prepare: Magic Weapon \u2013 offsets the GWM penalty and keeps the Strange Conduit Ring active \u2013 plus Branding Smite.","Paladin 6":"Paladin 6","Aura des Schutzes (Aura of Protection): +CHA auf Rettungsw\xFCrfe in 3 m":"Aura of Protection: +CHA on saving throws within 3 m","Die wichtigste Defensive der Glaskanone \u2013 sch\xFCtzt auch Schattenherz' Konzentration, wenn sie nah bei dir steht.":"The glass cannon's most important defence \u2013 also protects Shadowheart's concentration when she stays close to you.","Paladin 7":"Paladin 7","Aura des Hasses (Aura of Hate): +CHA-Schaden auf jeden Nahkampfwaffentreffer":"Aura of Hate: +CHA damage on every melee weapon hit","Ab hier trennen sich die Wege. Jeder zus\xE4tzliche Angriff pro Zug bekommt den Aura-Bonus \u2013 deshalb lohnen Wege mit vielen Angriffen. Vorbereiten: Schwache Genesung (Lesser Restoration).":"From here the routes split. Every extra attack per turn gets the aura bonus \u2013 that's why routes with many attacks pay off. Prepare: Lesser Restoration.","CHA (gebundene Waffe)
