costs 1,000 gold (then 2,000, from the third time 10,000).","Eidbrecher-Ritter niemals t\xF6ten":"Never kill the Oathbreaker Knight","Ist der Ritter tot, verweigert Der Verdorrte (Withers) den Respec f\xFCr den Rest des Durchgangs \u2013 auch nach einer sp\xE4teren R\xFCckkehr zum Eid.":"If the Knight is dead, Withers refuses to respec you for the rest of the playthrough \u2013 even after returning to your oath later.","Schattenherz auf Dom\xE4ne des Lichts umskillen":"Respec Shadowheart to Light Domain","Ihre Trickserei-Dom\xE4ne hilft dir kaum. Licht gilt in Patch-8-Guides als beste Allround-Wahl, Leben, wenn sie die einzige Heilerin ist. Sie ist kein Eidbrecher, Der Verdorrte skillt sie ganz normal um. Erstes Talent f\xFCr sie: Kriegszauberer (War Caster), damit Segnen h\xE4lt.":"Her Trickery Domain barely helps you. Patch 8 guides rate Light as the best all-round pick, Life if she is your only healer. She is not an Oathbreaker, so Withers respecs her normally. Her first feat: War Caster, so Bless holds.","Elixiere der H\xFCgelriesenst\xE4rke horten":"Stockpile Elixirs of Hill Giant Strength","ST\xC4 21 bis zur langen Rast \u2013 bis zu den Panzerhandschuhen dein Standard-Elixier vor Bossk\xE4mpfen. Nur ein Elixier gleichzeitig aktiv.":"STR 21 until long rest \u2013 your standard elixir before boss fights until you get the Gauntlets. Only one elixir active at a time.","Kein Respec mehr bei Der Verdorrte":"No more respec at Withers","Withers skillt Eidbrecher nicht um. Stufenaufstiege bewusst planen \u2013 Klasse hinzuf\xFCgen beim Aufstieg geht weiterhin normal. Umskillen nur nach Wiederherstellung des Eides (1.000 Gold).":"Withers won't respec Oathbreakers. Plan level-ups carefully \u2013 adding a class on level-up still works normally. Respec only after restoring your oath (1,000 gold).","ST\xC4-17-Entscheidung treffen":"Make the STR 17 decision","ST\xC4 17 behalten und mit Tantchen Ethels Haar (Auntie Ethel's Hair) vor Stufe 4 auf 18 bringen. Der alte Plan B (Umskillen bei Der Verdorrte) geht als Eidbrecher nicht mehr.":"Keep STR 17 and raise it to 18 with Auntie Ethel's Hair before level 4. The old plan B (respec at Withers) no longer works as an Oathbreaker.","Gro\xDFschwert +1 (Greatsword +1) kaufen \u2013 \xDCbergangswaffe":"Buy Greatsword +1 \u2013 stopgap weapon","Ersatz f\xFCr die verpasste Immergl\xFCh-Klinge (Everburn Blade). Bei Dammon oft im Sortiment, bei Grat im Goblinlager garantiert. Rund 85 gp Basispreis. Alternative: Blutige Gro\xDFaxt (Blooded Greataxe).":"Replacement for the missed Everburn Blade. Often in Dammon's stock, guaranteed at Grat in the Goblin Camp. About 85 gp base price. Alternative: Blooded Greataxe.","Das fl\xFCsternde Versprechen (The Whispering Promise) bei Volo":"The Whispering Promise from Volo","Rund 84 gp. Volo verschwindet nach seinem Auftritt im Hain; Fallback ist Grat im Goblinlager. An Schattenherz geben.":"About 84 gp. Volo disappears after his performance in the Grove; fallback is Grat in the Goblin Camp. Give it to Shadowheart.","Jagdkurzbogen (Hunting Shortbow) f\xFCr Astarion":"Hunting Shortbow for Astarion","Bei Dammon (laut Nizar GG). \xDCbergangsbogen f\xFCr Astarion, bis der Bogen der Todesfee da ist.":"Sold by Dammon (per Nizar GG). Stopgap bow for Astarion until you have the Bow of the Banshee.","Smaragdhain \u2192 Uferteehaus":"Emerald Grove \u2192 Riverside Teahouse","Quest \u201ERettet Mayrina\u201C (Tantchen Ethel) starten":'Start the quest "Rescue the Grieving Mother" (Auntie Ethel)',"Ethel im Hain ansprechen; die Spur f\xFChrt zum Uferteehaus (Riverside Teahouse).":"Talk to Ethel in the Grove; the trail leads to the Riverside Teahouse.","Mondtropfenanh\xE4nger (Moondrop Pendant)":"Moondrop Pendant","Die Sel\xFBne-Truhe ist versiegelt: Gebetsblatt hinter der Sel\xFBne-Statue finden (Wahrnehmung) und davor vorlesen. Effekt: unter 50 % TP keine Gelegenheitsangriffe.":"The Sel\xFBne chest is sealed: find the prayer page behind the Sel\xFBne statue (Perception) and read it in front of it. Effect: below 50% HP no opportunity attacks against you.","Tantchen Ethels Haar \u2192 +1 ST\xC4":"Auntie Ethel's Hair \u2192 +1 STR","Nur im Versteck (nicht im Teehaus) unter etwa 20 % TP bringen und warten \u2013 sie feilscht um ihr Leben. Nicht verstummen lassen! Mayrina kannst du per \xDCberzeugen trotzdem retten. Das Haar kann Werte \xFCber 20 heben. ST\xC4 oder CHA? Siehe Tab \u201EWege\u201C \u2013 kurz: ST\xC4 bringt dir in Akt 1\u20132 sofort +1 Treffer und Schaden, CHA erst mit weiteren ungeraden Boni.":`Only in her hideout (not the teahouse): bring her below about 20% HP and wait \u2013 she bargains for her life. Don't silence her! You can still save Mayrina via Persuasion. The hair can raise scores above 20. STR or CHA? See the "Routes" tab \u2013 short: STR gives you +1 to hit and damage right away in Acts 1\u20132, CHA only with further odd bonuses.`,"Trank \u201EGebrochene Versprechen\u201C (Broken Promises) NICHT trinken":'Do NOT drink the potion "Broken Promises"',"Hexentrank aus Ethels Werkstatt: +2 ST\xC4 bis zur langen Rast, danach \u22121 ST\xC4 dauerhaft. Verkaufen oder liegen lassen.":"Witch potion from Ethel's workshop: +2 STR until long rest, then \u22121 STR permanently. Sell it or leave it.",Goblinlager:"Goblin Camp","Grat: Gro\xDFschwert +1 / Das fl\xFCsternde Versprechen (Fallback)":"Grat: Greatsword +1 / The Whispering Promise (fallback)","Falls im Hain verpasst.":"If missed in the Grove.","Zerschmettertes Heiligtum":"Shattered Sanctum","Handschuhe des grummelnden Verlierers (Gloves of the Growling Underdog)":"Gloves of the Growling Underdog","Dror Ragzlins Schatzkisten hinter dem Eisentor (X 298 / Y 66): SG 18 Fingerfertigkeit oder Drors Schl\xFCssel. Vorteil auf Angriffe, wenn 2+ Gegner nahe dem Ziel stehen.":"Dror Ragzlin's treasure chests behind the iron gate (X 298 / Y 66): DC 18 Sleight of Hand or Dror's key. Advantage on attacks when 2+ enemies are near the target.","Stiefel des Schreitens (Boots of Striding) \u2013 Minthara":"Boots of Striding \u2013 Minthara","Guter Pfad: Minthara besiegen und pl\xFCndern. W\xE4hrend Konzentration nicht umsto\xDFbar, Konzentrationszauber geben Schwung \u2013 ideal mit Krone des Wahnsinns und Hast.":"Good path: defeat and loot Minthara. Can't be knocked prone while concentrating, concentration spells grant Momentum \u2013 ideal with Crown of Madness and Haste.","Sel\xFBnitischer Au\xDFenposten (Unterreich)":"Sel\xFBnite Outpost (Underdark)","Helm des Niederstreckens (Helmet of Smiting)":"Helmet of Smiting","Verschlossene vergoldete Truhe (X 163 / Y \u2212248). Zugang z. B. \xFCber den Geheimgang im Zerschmetterten Heiligtum.":"Locked gilded chest (X 163 / Y \u2212248). Access e.g. via the secret passage in the Shattered Sanctum.","Unterreich \u2013 Myconid-Kolonie":"Underdark \u2013 Myconid Colony","\xC4tzendes Band (Caustic Band) bei Derryth Bonecloak":"Caustic Band from Derryth Bonecloak","+2 S\xE4ureschaden pro Waffentreffer \u2013 doppelt wertvoll ab Zus\xE4tzlicher Angriff. Derryth verkauft es in Akt 3 erneut.":"+2 acid damage per weapon hit \u2013 twice as valuable once you have Extra Attack. Derryth sells it again in Act 3.","Boot zur Grymschmiede":"Boat to the Grymforge","Jorgorals Gro\xDFschwert (Jorgoral's Greatsword) \u2013 Korsar Greymon":"Jorgoral's Greatsword \u2013 Corsair Greymon","+1, 2W6+1 Hieb, Spezialaktion Kolossaler Ansturm (Colossal Onslaught). Kaufen oder pl\xFCndern \u2013 Greymon NICHT ins Wasser sto\xDFen, sonst ist die Beute weg.":"+1, 2d6+1 slashing, special action Colossal Onslaught. Buy or loot it \u2013 do NOT push Greymon into the water, or the loot is gone.","Bogen der Todesfee (Bow of the Banshee) f\xFCr Astarion \u2013 Korsar Greymon":"Bow of the Banshee for Astarion \u2013 Corsair Greymon","Seltener +1-Kurzbogen: kann bei Treffer Ver\xE4ngstigt ausl\xF6sen und gibt +1W4 auf Angriff und Schaden gegen ver\xE4ngstigte Ziele. Auf dem Boot pl\xFCndern oder sp\xE4ter bei Greymon in der Grymschmiede kaufen.":"Rare +1 shortbow: can inflict Frightened on hit and gives +1d4 to attack and damage against frightened targets. Loot it on the boat or buy it later from Greymon in the Grymforge.","Adamant-Schienenpanzer (Adamantine Splint Armour) schmieden":"Forge the Adamantine Splint Armour","Schienen-Gussform (Splint Mould) bei X \u2212593 / Y 311 nahe Wegpunkt Alte Schmiede, dazu Mithrilerz. Danach Grym besiegen. RK 18, immun gegen Krits.":"Splint Mould at X \u2212593 / Y 311 near the Ancient Forge waypoint, plus Mithral Ore. Then defeat Grym. AC 18, immune to critical hits.",Gebirgspass:"Mountain Pass","Lae'zels Quest / Rosymorn-Kloster (optional)":"Lae'zel's quest / Rosymorn Monastery (optional)","H\xE4ndler und Loot im Pass mitnehmen.":"Pick up the traders and loot in the pass.","Schwert der Gerechtigkeit (Sword of Justice) \u2013 Anders":"Sword of Justice \u2013 Anders","Ungew\xF6hnliches +1-Gro\xDFschwert mit dem Zauber Tyrs Schutz. Anders gibt es dir f\xFCr Karlachs Kopf \u2013 oder du nimmst es ihm ab, wenn du dich auf Karlachs Seite stellst und ihn besiegst (empfohlen, so bekommst du Karlach als Gef\xE4hrtin).":"Uncommon +1 greatsword with the spell Tyr's Protection. Anders gives it to you for Karlach's head \u2013 or you take it from him if you side with Karlach and defeat him (recommended, so you get Karlach as a companion).","Gebirgspass \u2013 Krippe Y'llek":"Mountain Pass \u2013 Cr\xE8che Y'llek","Ring des seltsamen Leiters (Strange Conduit Ring)":"Strange Conduit Ring","Truhe in der Kammer des Inquisitors in der Krippe Y'llek. +1W4 psychisch auf Waffenangriffe, solange du dich auf einen Zauber konzentrierst \u2013 mit Magische Waffe ab Stufe 5 praktisch dauerhaft.":"Chest in the Inquisitor's Chamber in the Cr\xE8che Y'llek. +1d4 psychic on weapon attacks while you concentrate on a spell \u2013 with Magic Weapon from level 5 practically permanent.","Gebirgspass \u2013 Pfad zum Rosymorn-Kloster":"Mountain Pass \u2013 Rosymorn Monastery Trail","Gloves of Baneful Striking bei Lady Esther":"Gloves of Baneful Striking from Lady Esther","Ungew\xF6hnlich, sp\xE4tes Akt 1. Erreichbar \xFCber den Gebirgspass oder von der Goblinlager-Seite. Nach jedem Waffentreffer \u22121W4 auf den Rettungswurf des Ziels gegen deinen n\xE4chsten Zauber.":"Uncommon, late Act 1. Reachable via the Mountain Pass or from the Goblin Camp side. After every weapon hit \u22121d4 to the target's saving throw against your next spell.","Point of no Return":"Point of no Return","Vor Akt 2: Akt-1-Restliste pr\xFCfen":"Before Act 2: check the Act 1 leftovers","Ethels Haar, Helm (Au\xDFenposten), Adamant-R\xFCstung, Jorgoral, H\xE4ndlerk\xE4ufe. Nach dem \xDCbergang ins Schattenverfluchte Land kommst du nicht zur\xFCck.":"Ethel's Hair, helmet (Outpost), Adamantine armour, Jorgoral, trader purchases. After moving into the Shadow-Cursed Lands you can't come back.","Letztes Licht (Last Light Inn)":"Last Light Inn","Umhang des Schutzes (Cloak of Protection) \u2013 Quartiermeisterin Talli":"Cloak of Protection \u2013 Quartermaster Talli","+1 RK, +1 auf alle Rettungsw\xFCrfe. F\xE4llt das Gasthaus, stirbt Talli \u2013 sofort kaufen.":"+1 AC, +1 to all saving throws. If the inn falls, Talli dies \u2013 buy it right away.","Fehlerhafte H\xF6llend\xE4mmerungs-Handschuhe (Flawed Helldusk Gloves) bei Dammon":"Flawed Helldusk Gloves from Dammon","Dammon schmiedet aus Infernalem Eisen in fester Reihenfolge: erst R\xFCstung, dann Helm, dann Handschuhe \u2013 du brauchst also drei St\xFCck. +1W4 Feuer auf jeden Waffenangriff.":"Dammon forges from Infernal Iron in a fixed order: armour first, then helmet, then gloves \u2013 so you need three pieces. +1d4 fire on every weapon attack.","Gasthaus und Isobel sch\xFCtzen":"Protect the inn and Isobel","Sichert H\xE4ndler und Story-Pfad.":"Secures traders and the story path.","Level 5":"Level 5","Zus\xE4tzlicher Angriff + Magische Waffe einsatzbereit":"Extra Attack + Magic Weapon ready","Neue Eidzauber: Krone des Wahnsinns (Crown of Madness) und Dunkelheit (Darkness). Magische Waffe (Magic Weapon) vorbereiten. Gale lernt Hast (Haste) und castet sie auf Droughnir; Person festhalten \xFCbernimmt ebenfalls Gale.":"New oath spells: Crown of Madness and Darkness. Prepare Magic Weapon. Gale learns Haste and casts it on Droughnir; Gale also takes over Hold Person.","Schattenverfluchte Lande":"Shadow-Cursed Lands","Ab Stufe 6: Schatten und Gespenster kontrollieren":"From level 6: control Shadows and Wraiths","Schatten und Gespenster (Wraiths) sind Level 5. Bonus: Wer im Schattenfluch stirbt, steht nach ein, zwei Runden als Untoter wieder auf und l\xE4sst sich dann kontrollieren.":"Shadows and Wraiths are level 5. Bonus: whoever dies in the Shadow Curse rises again as undead after a turn or two and can then be controlled.","Trank der ewigen Kraft (Potion of Everlasting Vigour): +2 ST\xC4 dauerhaft":"Potion of Everlasting Vigour: +2 STR permanently","Araj Oblodra im Erdgeschoss ansprechen und Astarion \xFCberreden, sie zu bei\xDFen. Erledigen, bevor du die T\xFCrme st\xFCrmst.":"Talk to Araj Oblodra on the ground floor and persuade Astarion to bite her. Do it before you storm the towers.","Shar-Pr\xFCfung (Gauntlet of Shar)":"Gauntlet of Shar","Ring des kaltherzigen Leuchtens (Callous Glow Ring)":"Callous Glow Ring","Prunktruhe ganz rechts in der Schatzkammer neben Balthazar; die T\xFCr hat SG 30 Fingerfertigkeit. +2 glei\xDFend gegen beleuchtete Ziele \u2013 bei jeder Schadensinstanz.":"Ornate chest on the far right in the treasury next to Balthazar; the door is DC 30 Sleight of Hand. +2 radiant against illuminated targets \u2013 on every damage instance.","Level 7 \u2013 vor dem Haus der Heilung":"Level 7 \u2013 before the House of Healing","Aura des Hasses aktivieren":"Activate Aura of Hate","+CHA-Mod Schaden auf Nahkampfwaffenangriffe f\xFCr dich und alle Unholde und Untoten in 3 m \u2013 auch feindliche. Einmal anklicken, danach bleibt sie aktiv. Feindliche Untote neben dir zuerst t\xF6ten.":"+CHA modifier damage on melee weapon attacks for you and all fiends and undead within 3 m \u2013 enemies too. Click it once, then it stays active. Kill enemy undead next to you first.","Ab Stufe 8: Malus Thorm kontrollieren":"From level 8: control Malus Thorm","Malus Thorm ist Level 7 und \u2013 anders als Balthazar und die anderen Thorms \u2013 nicht immun. So umgehst du den Bosskampf gro\xDFteils. Die untoten Krankenschwestern (Level 6) gehen schon ab Stufe 7.":"Malus Thorm is level 7 and \u2013 unlike Balthazar and the other Thorms \u2013 not immune. This way you mostly skip the boss fight. The undead nurses (level 6) already work from level 7.","Level 6":"Level 6","Aura des Schutzes aktiv \u2013 Gruppe eng halten":"Aura of Protection active \u2013 keep the party close","+CHA-Mod auf Rettungsw\xFCrfe f\xFCr alle Verb\xFCndeten in 3 m.":"+CHA modifier on saving throws for all allies within 3 m.","Haus der Hoffnung \u2013 Archiv":"House of Hope \u2013 Archive","Panzerhandschuhe der H\xFCgelriesenst\xE4rke (Gauntlets of Hill Giant Strength)":"Gauntlets of Hill Giant Strength","Setzen ST\xC4 auf 23. Sockelfalle: SG 20 Fingerfertigkeit. Kein Respec n\xF6tig \u2013 dein investierter ST\xC4-Wert ist dann einfach \xFCbersch\xFCssig.":"Set STR to 23. Pedestal trap: DC 20 Sleight of Hand. No respec needed \u2013 your invested STR is then simply surplus.","Amulett der gr\xF6\xDFeren Gesundheit (Amulet of Greater Health)":"Amulet of Greater Health","Setzt KON auf 23 \u2013 im gleichen Raum wie die Panzerhandschuhe.":"Sets CON to 23 \u2013 in the same room as the Gauntlets.","H\xF6llend\xE4mmerungs-R\xFCstung (Helldusk Armour)":"Helldusk Armour","Raphael besiegen. RK 21, Fliegen ohne Konzentration, Feuerresistenz (f\xFCr dich doppelt). Die passenden Stiefel tr\xE4gt Gortash (Wyrmfels).":"Defeat Raphael. AC 21, flight without concentration, fire resistance (doubled up for you). The matching boots are worn by Gortash (Wyrm's Rock).","Unterstadt \u2013 Haus der Trauer":"Lower City \u2013 House of Grief","Spiegel des Verlusts (Mirror of Loss): +2 CHA":"Mirror of Loss: +2 CHA","Nur der Spiegel im Haus der Trauer (Schattenherz' Quest) funktioniert, der in der Shar-Pr\xFCfung ist zerbrochen. SG 25 Arkane Kunde und SG 20 Religion, dann eine Erinnerung opfern: \u22122 auf ein unwichtiges Attribut (mit Fluch brechen entfernbar), +2 dauerhaft auf CHA.":"Only the mirror in the House of Grief (Shadowheart's quest) works, the one in the Gauntlet of Shar is broken. DC 25 Arcana and DC 20 Religion, then sacrifice a memory: \u22122 on an unimportant ability (removable with Remove Curse), +2 permanently on CHA.","Drachenweg unter Wyrmfels":"Wyrmway beneath Wyrm's Rock","Baldurans Riesent\xF6ter (Balduran's Giantslayer)":"Balduran's Giantslayer","Legend\xE4r, +3. Beide Drachenkopf-Fackeln mit Blitzschaden treffen, vier Pr\xFCfungen bestehen, Ansur besiegen. Die Passive addiert deinen ST\xC4-Modifikator ein zweites Mal, Vorteil gegen gro\xDFe Ziele \u2013 deine Endwaffe.":"Legendary, +3. Hit both dragon-head torches with lightning damage, pass four trials, defeat Ansur. The passive adds your STR modifier a second time, advantage against large targets \u2013 your endgame weapon.","Helm des Balduran (Helm of Balduran)":"Helm of Balduran","Auf dem Altar hinter Ansur. Heilt 2 TP pro Zug \u2013 kleine Dauer-Regeneration f\xFCr die Glaskanone.":"On the altar behind Ansur. Heals 2 HP per turn \u2013 small permanent regeneration for the glass cannon.","Handschuhe und Amulett anlegen \u2013 ohne Respec":"Equip Gauntlets and Amulet \u2013 no respec","Als Eidbrecher skillt Der Verdorrte nicht um. Panzerhandschuhe (ST\xC4 23) und Amulett (KON 23) wirken trotzdem voll; CHA hebst du per Talent auf 18.":"As an Oathbreaker, Withers won't respec you. Gauntlets (STR 23) and Amulet (CON 23) still work fully; raise CHA to 18 with a feat.",Vorrat:"Supplies","Elixiere der H\xFCgelriesenst\xE4rke (ST\xC4 21) f\xFCr Bosse":"Elixirs of Hill Giant Strength (STR 21) for bosses","Bis die Handschuhe da sind, je ein Elixier pro Bosskampf.":"Until you have the Gauntlets, one elixir per boss fight.","Akt 1 \xB7 Ruinen \u2192 Smaragdhain \u2192 Goblinlager \u2192 Unterreich \u2192 Grymschmiede \u2192 Gebirgspass":"Act 1 \xB7 Ruins \u2192 Emerald Grove \u2192 Goblin Camp \u2192 Underdark \u2192 Grymforge \u2192 Mountain Pass","Akt 2 \xB7 Schattenverfluchtes Land":"Act 2 \xB7 Shadow-Cursed Lands","Akt 3 \xB7 Baldurs Tor":"Act 3 \xB7 Baldur's Gate",Waffe:"Weapon",Sofort:"Immediately","Dammon (Smaragdhain) oder garantiert bei Grat (Goblinlager)":"Dammon (Emerald Grove) or guaranteed at Grat (Goblin Camp)","+1 Treffer und Schaden; 2W6 profitiert maximal von Kampf mit gro\xDFen Waffen. Ersatz f\xFCr die verpasste Immergl\xFCh-Klinge.":"+1 to hit and damage; 2d6 benefits most from Great Weapon Fighting. Replacement for the missed Everburn Blade.","Akt 1":"Act 1","Korsar Greymon \u2013 Boot zur Grymschmiede (nicht ins Wasser sto\xDFen)":"Corsair Greymon \u2013 boat to the Grymforge (don't push him into the water)","+1, Kolossaler Ansturm trifft alle in einer Linie. H\xE4lt bis Akt 3.":"+1, Colossal Onslaught hits everyone in a line. Lasts until Act 3.","Anders, Aufgestiegene Stra\xDFe \u2013 besiegen (Karlachs Seite) oder als Belohnung":"Anders, Risen Road \u2013 defeat him (Karlach's side) or as a reward","+1-Gro\xDFschwert mit dem Zauber Tyrs Schutz. Gleichwertige Alternative zum Gro\xDFschwert +1, falls du Grat und Dammon verpasst.":"+1 greatsword with the spell Tyr's Protection. An equal alternative to the Greatsword +1 if you miss Grat and Dammon.","Akt 3":"Act 3","Drache Ansur, Drachenweg unter Wyrmfels (Fackeln mit Blitz treffen, 4 Pr\xFCfungen)":"Dragon Ansur, Wyrmway beneath Wyrm's Rock (hit torches with lightning, 4 trials)","+3. Die Riesent\xF6ter-Passive verdoppelt nicht den Angriffs-Modifikator, sondern addiert deinen ST\xC4-Modifikator einmal pauschal: ungebunden 1\xD7 ST\xC4 + 1\xD7 ST\xC4 (mit ST\xC4 23 also +12). Als Paktwaffe gebunden: 1\xD7 CHA + 1\xD7 ST\xC4. Dazu Vorteil gegen gro\xDFe Ziele und Riesengestalt 1\xD7 pro kurzer Rast.":"+3. The Giantslayer passive does not double the attack modifier, it adds your STR modifier once as a flat bonus: unbound 1\xD7 STR + 1\xD7 STR (so +12 with STR 23). Bound as a pact weapon: 1\xD7 CHA + 1\xD7 STR. Plus advantage against large targets and Giant Form once per short rest.",R\u00FCstung:"Armour","Adamantschmiede, Grymschmiede (Schienen-Gussform + Mithrilerz)":"Adamantine Forge, Grymforge (Splint Mould + Mithral Ore)","RK 18, Krit-Immunit\xE4t \u2013 perfekt f\xFCr einen Nahk\xE4mpfer mitten im Gedr\xE4nge.":"AC 18, crit immunity \u2013 perfect for a melee fighter in the thick of it.","Raphael besiegen, Haus der Hoffnung":"Defeat Raphael, House of Hope","RK 21, Fliegen ohne Konzentration, automatische \xDCbung. Die Feuerresistenz hast du als Roter Drachenbl\xFCtiger schon \u2013 f\xFCr die Glaskanone z\xE4hlt die RK.":"AC 21, flight without concentration, automatic proficiency. You already have fire resistance as a Red Dragonborn \u2013 for the glass cannon the AC is what counts.",Helm:"Helmet","Sel\xFBnitischer Au\xDFenposten, vergoldete Truhe (X 163 / Y \u2212248)":"Sel\xFBnite Outpost, gilded chest (X 163 / Y \u2212248)","Temp-TP in H\xF6he des CHA-Mods, wenn ein Smite-Zauber einen Zustand ausl\xF6st; +1 auf KON-Rettungsw\xFCrfe (Konzentration f\xFCr Krone des Wahnsinns/Hast).":"Temp HP equal to your CHA modifier when a smite spell applies a condition; +1 to CON saving throws (concentration for Crown of Madness/Haste).",Handschuhe:"Gloves","Zerschmettertes Heiligtum, Drors Schatz (SG 18 oder Schl\xFCssel)":"Shattered Sanctum, Dror's treasure (DC 18 or key)","Gratis-Vorteil gleicht den GWM-Malus aus und verdoppelt fast deine Krit-Chance.":"Free advantage offsets the GWM penalty and nearly doubles your crit chance.","Akt 2":"Act 2","Dammon, Letztes Licht \u2013 aus Infernalem Eisen (drittes geschmiedetes Teil)":"Dammon, Last Light Inn \u2013 from Infernal Iron (third forged piece)","+1W4 Feuer auf jeden Waffenangriff, ST\xC4-Rettungsw\xFCrfe +1. Bei 3\u20136 Treffern pro Zug sp\xFCrbar; Teufel und D\xE4monen sind oft feuerresistent.":"+1d4 fire on every weapon attack, STR saving throws +1. Noticeable at 3\u20136 hits per turn; devils and demons are often fire resistant.","Haus der Hoffnung, Archiv (Falle SG 20)":"House of Hope, Archive (trap DC 20)","ST\xC4 23 \u2013 als Eidbrecher ohne Respec, der investierte ST\xC4-Wert ist dann einfach \xFCbersch\xFCssig.":"STR 23 \u2013 as an Oathbreaker without respec, your invested STR is then simply surplus.","Altar neben Ansur im Drachenheiligtum, Drachenweg (X 636 / Y \u2212964)":"Altar next to Ansur in the dragon sanctum, Wyrmway (X 636 / Y \u2212964)","+1 RK und Rettungsw\xFCrfe, im Kampf 2 TP Heilung zu Beginn jedes Zuges, immun gegen Bet\xE4ubung, Angreifer landen keine kritischen Treffer \u2013 ersetzt die Krit-Immunit\xE4t des Adamant-Panzers.":"+1 AC and saving throws, in combat 2 HP healing at the start of each turn, immune to Stunned, attackers can't land critical hits \u2013 replaces the crit immunity of the Adamantine armour.",Stiefel:"Boots","Minthara (Zerschmettertes Heiligtum)":"Minthara (Shattered Sanctum)","W\xE4hrend Konzentration nicht umsto\xDFbar, Schwung beim Wirken \u2013 passt zu Krone des Wahnsinns und Hast.":"Can't be knocked prone while concentrating, Momentum when casting \u2013 fits Crown of Madness and Haste.",Umhang:"Cloak","Quartiermeisterin Talli, Letztes Licht":"Quartermaster Talli, Last Light Inn","+1 RK und +1 auf alle Rettungsw\xFCrfe \u2013 stapelt mit Aura des Schutzes. Glaskanone: ablegen, sobald Schattenherz Schild des Glaubens oder Sch\xFCtzendes Band zuverl\xE4ssig h\xE4lt.":"+1 AC and +1 to all saving throws \u2013 stacks with Aura of Protection. Glass cannon: take it off once Shadowheart reliably holds Shield of Faith or Warding Bond.",Amulett:"Amulet","Eulenb\xE4renh\xF6hle, Sel\xFBne-Truhe (Gebetsblatt)":"Owlbear Nest, Sel\xFBne chest (prayer page)","Unter 50 % TP keine Gelegenheitsangriffe \u2013 sicherer R\xFCckzug ohne Nebelschritt.":"Below 50% HP no opportunity attacks \u2013 safe retreat without Misty Step.","Haus der Hoffnung, Archiv":"House of Hope, Archive","KON 23 \u2013 mehr TP und sicherere Konzentration.":"CON 23 \u2013 more HP and safer concentration.",Ring:"Ring","Krippe Y'llek, Kammer des Inquisitors (Gebirgspass)":"Cr\xE8che Y'llek, Inquisitor's Chamber (Mountain Pass)","+1W4 psychisch auf Waffenangriffe, solange du dich konzentrierst. Magische Waffe oder Elementarwaffe auf dich selbst halten den Ring dauerhaft an.":"+1d4 psychic on weapon attacks while you concentrate. Magic Weapon or Elemental Weapon on yourself keep the ring active permanently.","Shar-Pr\xFCfung, Schatzkammer neben Balthazar (T\xFCr SG 30)":"Gauntlet of Shar, treasury next to Balthazar (door DC 30)","+2 glei\xDFend gegen beleuchtete Ziele bei jeder Schadensinstanz \u2013 mit Fackel oder Licht-Zauber von Schattenherz fast immer aktiv.":"+2 radiant against illuminated targets on every damage instance \u2013 almost always active with a torch or Shadowheart's Light spell.","Derryth Bonecloak, Myconid-Kolonie":"Derryth Bonecloak, Myconid Colony","+2 S\xE4ure pro Treffer \u2013 skaliert mit Zus\xE4tzlichem Angriff und GWM-Bonusangriff.":"+2 acid per hit \u2013 scales with Extra Attack and the GWM bonus attack.","Ring (Schattenherz)":"Ring (Shadowheart)","Volo (Smaragdhain) oder Grat (Goblinlager)":"Volo (Emerald Grove) or Grat (Goblin Camp)","Schattenherz heilt dich mit Heilendes Wort, du wirst ohne ihre Konzentration Gesegnet (+1W4).":"Shadowheart heals you with Healing Word and you get Blessed (+1d4) without her concentration.","Fernkampf (Astarion)":"Ranged (Astarion)","Dammon (Smaragdhain, laut Nizar GG)":"Dammon (Emerald Grove, per Nizar GG)","\xDCbergangsbogen f\xFCr Astarion bis zum Bogen der Todesfee.":"Stopgap bow for Astarion until the Bow of the Banshee.","Korsar Greymon \u2013 auf dem Boot pl\xFCndern ode ds. Prepare (6): Command, Shield of Faith, Divine Favour, Thunderous and Wrathful Smite, Cure Wounds.","Paladin 4":"Paladin 4","Talent: Meisterschaft gro\xDFer Waffen (Great Weapon Master)":"Feat: Great Weapon Master","+10 Schaden pro Treffer bei \u22125 Treffer, plus Bonusangriff nach Krit oder Kill. Ein Kill durch G\xF6ttliches Niederstrecken l\xF6st den Bonusangriff nicht aus. \u201EAll In\u201C nur mit Vorteil oder Segnen.":`+10 damage per hit at \u22125 to hit, plus a bonus attack after a crit or kill. A kill by Divine Smite doesn't trigger the bonus attack. "All In" only with advantage or Bless.`,"Paladin 5":"Paladin 5","Zus\xE4tzlicher Angriff (Extra Attack) \xB7 Grad-2-Pl\xE4tze \xB7 Eidzauber Krone des Wahnsinns & Dunkelheit":"Extra Attack \xB7 level 2 slots \xB7 oath spells Crown of Madness & Darkness","Vorbereiten: Magische Waffe (Magic Weapon) \u2013 gleicht den GWM-Malus aus und h\xE4lt den Ring des seltsamen Leiters an \u2013 plus Brandmarkendes Niederstrecken (Branding Smite).":"Prepare: Magic Weapon \u2013 offsets the GWM penalty and keeps the Strange Conduit Ring active \u2013 plus Branding Smite.","Paladin 6":"Paladin 6","Aura des Schutzes (Aura of Protection): +CHA auf Rettungsw\xFCrfe in 3 m":"Aura of Protection: +CHA on saving throws within 3 m","Die wichtigste Defensive der Glaskanone \u2013 sch\xFCtzt auch Schattenherz' Konzentration, wenn sie nah bei dir steht.":"The glass cannon's most important defence \u2013 also protects Shadowheart's concentration when she stays close to you.","Paladin 7":"Paladin 7","Aura des Hasses (Aura of Hate): +CHA-Schaden auf jeden Nahkampfwaffentreffer":"Aura of Hate: +CHA damage on every melee weapon hit","Ab hier trennen sich die Wege. Jeder zus\xE4tzliche Angriff pro Zug bekommt den Aura-Bonus \u2013 deshalb lohnen Wege mit vielen Angriffen. Vorbereiten: Schwache Genesung (Lesser Restoration).":"From here the routes split. Every extra attack per turn gets the aura bonus \u2013 that's why routes with many attac erjungen Oliver \u2013 ab deiner Stufe 8 kontrollierbar.":"The ghost parents of the ghost boy Oliver \u2013 controllable from your level 8.",Aktuell:"Current","Startwerte nach Charaktererstellung.":"Starting values after character creation.","Ethels Haar":"Ethel's Hair","Tantchen Ethels Haar: ST\xC4 17 \u2192 18 (+4).":"Auntie Ethel's Hair: STR 17 \u2192 18 (+4).","ST\xC4 23 \xFCber Panzerhandschuhe, KON 23 \xFCber Amulett, CHA 16 + Talent (+2) + Spiegel des Verlusts (+2). Als Eidbrecher ohne Respec.":"STR 23 via Gauntlets, CON 23 via Amulet, CHA 16 + feat (+2) + Mirror of Loss (+2). As an Oathbreaker without respec.",Checkliste:"Checklist",Liste:"List",Wege:"Routes",Level:"Level",Ausr\u00FCstung:"Equipment",Gear:"Gear","Kampf & Team":"Combat & Team",Team:"Team",Atlas:"Atlas","Alles, was du f\xFCr die Glaskanone holen und erledigen musst \u2013 nach Akt und Gebiet, Verpassbares rot markiert.":"Everything you need to get and do for the glass cannon \u2013 by act and area, missable items marked in red.","Je vier Wege zum maximalen Schaden als Eidbrecher und mit dem Eid der Rache. Oben umschalten oder alle vergleichen, einen w\xE4hlen, dann im Level-Guide Stufe f\xFCr Stufe abhaken.":"Four routes each to maximum damage as an Oathbreaker and with the Oath of Vengeance. Switch at the top or compare all, pick one, then tick it off level by level in the Level Guide.","Droughnirs Ausr\xFCstung, Alternativen und Begleiter-Items \u2013 als Raster oder als Upgrade-Pfad pro Slot. Klick auf eine Kachel f\xFCr Fundort und Synergie.":"Droughnir's equipment, alternatives and companion items \u2013 as a grid or as an upgrade path per slot. Click a tile for location and synergy.","Dein gew\xE4hlter Weg als Zeitleiste. Hake jede Stufe ab, sobald du sie im Spiel genommen hast.":"Your chosen route as a timeline. Tick off each level as soon as you've taken it in game.","Orte, H\xE4ndler, Gegner und Schritt-f\xFCr-Schritt-Anleitungen. Klick auf eine Karte \xF6ffnet Details mit Bildergalerie \u2013 eigene Screenshots l\xE4dst du direkt dort hoch.":"Places, traders, enemies and step-by-step guides. Clicking a card opens details with an image gallery.","Drei Bereiche: die Kampf-Referenz f\xFCr den laufenden Kampf, Party & Buffs f\xFCr die Vorbereitung und Untote kontrollieren.":"Three sections: the combat reference for the current fight, Party & Buffs for preparation, and Control Undead.",Alle:"All",Verpassbar:"Missable",Items:"Items",Quests:"Quests","Dein Rastplatz. Hier warten Der Verdorrte (Umskillen, Begleiter) und nach dem Eidbruch der Eidbrecher-Ritter.":"Your resting place. Withers waits here (respec, companions) and, after breaking your oath, the Oathbreaker Knight.","Alte Kapelle nahe der Absturzstelle. Fallenraum mit feuerspeienden Drachenk\xF6pfen; darunter die Feuchte Gruft mit den ersten Untoten, die du kontrollieren kannst.":"Old chapel near the crash site. Trap room with fire-breathing dragon heads; below it the Dank Crypt with the first undead you can control.","Druidenhain mit Tiefling-Fl\xFCchtlingen. H\xE4ndler Dammon und Volo, Start der Quest um Mayrina und Tantchen Ethel.":"Druid grove with tiefling refugees. Traders Dammon and Volo, start of the quest around Mayrina and Auntie Ethel.","H\xF6hle der Eulenb\xE4rin. Hinten steht die versiegelte Sel\xFBne-Truhe mit dem Mondtropfenanh\xE4nger.":"The owlbear's cave. In the back is the sealed Sel\xFBne chest with the Moondrop Pendant.","Erreichbar \xFCber das Uferteehaus und den \xFCberwucherten Tunnel. Nur hier verhandelt Ethel um Mayrina \u2013 und gibt dir ihr Haar.":"Reached via the Riverside Teahouse and the overgrown tunnel. Only here does Ethel bargain for Mayrina \u2013 and give you her hair.","H\xE4ndler Grat, Anf\xFChrer Dror Ragzlin (Schatzkammer mit den Handschuhen des grummelnden Verlierers) und Minthara (Stiefel des Schreitens). Geheimgang Richtung Unterreich.":"Trader Grat, leader Dror Ragzlin (treasury with the Gloves of the Growling Underdog) and Minthara (Boots of Striding). Secret passage towards the Underdark.","Hier triffst du Anders und seine falschen Tyr-Paladine \u2013 und die Entscheidung f\xFCr oder gegen Karlach.":"Here you meet Anders and his fake paladins of Tyr \u2013 and decide for or against Karlach.","Ruine im Unterreich. Verschlossene vergoldete Truhe (X 163 / Y \u2212248) mit dem Helm des Niederstreckens.":"Ruin in the Underdark. Locked gilded chest (X 163 / Y \u2212248) with the Helmet of Smiting.","Pilzvolk im Unterreich. H\xE4ndlerin Derryth Bonecloak verkauft das \xC4tzende Band.":"Mushroom folk in the Underdark. Trader Derryth Bonecloak sells the Caustic Band.","Duergar-Festung mit der Adamant-Schmiede. Auf dem Weg dorthin Korsar Greymon mit Jorgorals Gro\xDFschwert und dem Bogen der Todesfee.":"Duergar fortress with the Adamantine Forge. On the way there, Corsair Greymon with Jorgoral's Greatsword and the Bow of the Banshee.","Erreichbar \xFCber den Gebirgspass oder die Goblinlager-Seite. H\xE4ndlerin Lady Esther, Ghule und Todeshirte.":"Reached via the Mountain Pass or the Goblin Camp side. Trader Lady Esther, ghouls and the Death Shepherd.","Githyanki-Brutst\xE4tte am Gebirgspass. In der Kammer des Inquisitors liegt der Ring des seltsamen Leiters.":"Githyanki nursery at the Mountain Pass. The Strange Conduit Ring is in the Inquisitor's Chamber.","Letzte sichere Zuflucht im Schattenfluch. Quartiermeisterin Talli und Dammon \u2013 f\xE4llt das Gasthaus, sind die H\xE4ndler weg.":"Last safe haven in the Shadow Curse. Quartermaster Talli and Dammon \u2013 if the inn falls, the traders are gone.","Festung des Absolut-Kults. Im Erdgeschoss Araj Oblodra mit dem Trank der ewigen Kraft.":"Fortress of the Absolute cult. Araj Oblodra with the Potion of Everlasting Vigour on the ground floor.","Vom Schattenfluch verdunkeltes Land rund um Reithwin. Wer hier stirbt, kann als Untoter wieder aufstehen \u2013 Schatten und Gespenster (Level 5) sind ab deiner Stufe 6 kontrollierbar.":"Land around Reithwin darkened by the Shadow Curse. Whoever dies here can rise again as undead \u2013 Shadows and Wraiths (level 5) can be controlled from your level 6.","Verlassenes Spital in Reithwin. Untote Krankenschwestern und Malus Thorm \u2013 ab Stufe 8 kontrollierbar.":"Abandoned hospital in Reithwin. Undead nurses and Malus Thorm \u2013 controllable from level 8.","Unterirdische Tempelanlage. In der Schatzkammer neben Balthazar (T\xFCr SG 30) liegt der Ring des kaltherzigen Leuchtens.":"Underground temple complex. The Callous Glow Ring lies in the treasury next to Balthazar (door DC 30).","Raphaels H\xF6llenpalast. Im Archiv die Panzerhandschuhe der H\xFCgelriesenst\xE4rke und das Amulett der gr\xF6\xDFeren Gesundheit; Raphael selbst tr\xE4gt die H\xF6llend\xE4mmerungs-R\xFCstung.":"Raphael's infernal palace. The Gauntlets of Hill Giant Strength and the Amulet of Greater Health are in the Archive; Raphael himself wears the Helldusk Armour.","Pr\xFCfungsgruft unter der Wyrmfelsen-Festung. Vier Pr\xFCfungen, dann Ansur \u2013 und dahinter Baldurans Riesent\xF6ter und der Helm des Balduran.":"Trial crypt beneath the Wyrm's Rock fortress. Four trials, then Ansur \u2013 and behind him Balduran's Giantslayer and the Helm of Balduran.","Shar-Tempel in der Unterstadt, Teil von Schattenherz' Quest. Nur hier funktioniert der Spiegel des Verlusts.":"Temple of Shar in the Lower City, part of Shadowheart's quest. Only here does the Mirror of Loss work.","Skillt f\xFCr 100 Gold um \u2013 Begleiter jederzeit, dich als Eidbrecher aber nicht. Ist immun gegen Untote kontrollieren.":"Respecs for 100 gold \u2013 companions any time, but not you as an Oathbreaker. Immune to Control Undead.","Erscheint nach dem Eidbruch. Stellt deinen alten Eid f\xFCr 1.000 Gold wieder her oder best\xE4tigt dich als Eidbrecher. Niemals t\xF6ten \u2013 sonst gibt es f\xFCr den Rest des Spiels keinen Respec mehr.":"Appears after you break your oath. Restores your old oath for 1,000 gold or confirms you as an Oathbreaker. Never kill him \u2013 or there's no respec for the rest of the game.",H\u00E4ndler:"Trader","Tiefling-Schmied. Akt 1: Gro\xDFschwert +1 (oft) und Jagdkurzbogen. Akt 2 im Letzten Licht: schmiedet aus Infernalem Eisen die fehlerhaften H\xF6llend\xE4mmerungs-Teile.":"Tiefling smith. Act 1: Greatsword +1 (often) and Hunting Shortbow. Act 2 at Last Light: forges the flawed Helldusk pieces from Infernal Iron.","Barde mit kurzem Auftritt im Hain. Verkauft Das fl\xFCsternde Versprechen f\xFCr rund 84 gp \u2013 danach verschwindet er.":"Bard with a short performance in the Grove. Sells The Whispering Promise for about 84 gp \u2013 then he disappears.","Goblin-H\xE4ndler im Lager. Garantiert Gro\xDFschwert +1, Fallback f\xFCr Das fl\xFCsternde Versprechen.":"Goblin trader in the camp. Guaranteed Greatsword +1, fallback for The Whispering Promise.","H\xE4ndlerin in der Myconid-Kolonie, verkauft das \xC4tzende Band \u2013 in Akt 3 erneut.":"Trader in the Myconid Colony, sells the Caustic Band \u2013 again in Act 3.","Duergar auf dem Flo\xDF zur Grymschmiede. Tr\xE4gt Jorgorals Gro\xDFschwert und den Bogen der Todesfee. Nicht ins Wasser sto\xDFen \u2013 sonst ist die Beute weg.":"Duergar on the raft to the Grymforge. Carries Jorgoral's Greatsword and the Bow of the Banshee. Don't push him into the water \u2013 or the loot is gone.","H\xE4ndlerin auf dem Pfad zum Rosymorn-Kloster. Verkauft die Gloves of Baneful Striking.":"Trader on the Rosymorn Monastery Trail. Sells the Gloves of Baneful Striking.","Verkauft den Umhang des Schutzes. F\xE4llt das Letzte Licht, stirbt sie \u2013 sofort kaufen.":"Sells the Cloak of Protection. If Last Light falls, she dies \u2013 buy right away.",Quest:"Quest","Vampir-affine Tr\xE4nkebrauerin. Lass Astarion sie bei\xDFen und du bekommst den Trank der ewigen Kraft (+2 ST\xC4 dauerhaft).":"Vampire-curious potion brewer. Let Astarion bite her and you get the Potion of Everlasting Vigour (+2 STR permanently).",Gegner:"Enemy","Gr\xFCnes Weib in Verkleidung. Unter 20 % TP feilscht sie um ihr Leben \u2013 deine Chance auf das Haar.":"Green hag in disguise. Below 20% HP she bargains for her life \u2013 your chance at the hair.","Goblin-Anf\xFChrer im Heiligtum. Hinter dem Eisentor (X 298 / Y 66) liegen seine Schatzkisten mit den Handschuhen des grummelnden Verlierers.":"Goblin leader in the Sanctum. Behind the iron gate (X 298 / Y 66) are his treasure chests with the Gloves of the Growling Underdog.","Drow-Anf\xFChrerin. Auf dem guten Pfad besiegen: Sie tr\xE4gt die Stiefel des Schreitens.":"Drow leader. Defeat her on the good path: she wears the Boots of Striding.","Falscher Tyr-Paladin, jagt Karlach. Besiegst du ihn, geh\xF6rt das Schwert der Gerechtigkeit dir \u2013 und Karlach schlie\xDFt sich an.":"Fake paladin of Tyr, hunting Karlach. Defeat him and the Sword of Justice is yours \u2013 and Karlach joins you.","Adamant-Golem der Schmiede. Erscheint, sobald du das Lavaventil zum ersten Mal \xF6ffnest; gilt als immun gegen Klingen und Zauber. Droppt den Grymskull-Helm.":"Adamantine golem of the forge. Appears as soon as you open the lava vent for the first time; counts as immune to blades and spells. Drops the Grymskull Helm.","Level-7-Boss ohne Immunit\xE4t gegen Untote kontrollieren \u2013 ab deiner Stufe 8 einfach \xFCbernehmen.":"Level 7 boss without immunity to Control Undead \u2013 simply take him over from your level 8.","Teufel und Hausherr. Besiegst du ihn, bekommst du die H\xF6llend\xE4mmerungs-R\xFCstung.":"Devil and master of the house. Defeat him to get the Helldusk Armour.","Bronzedrache und einstiger Gef\xE4hrte Baldurans. Droppt Baldurans Riesent\xF6ter.":"Bronze dragon and former companion of Balduran. Drops Balduran's Giantslayer.","Tantchen Ethels Haar":"Auntie Ethel's Hair","Kampf im Versteck austragen (Uferteehaus \u2192 \xFCberwucherter Tunnel). Im Teehaus selbst verhandelt sie nicht um Mayrina.":"Fight in her hideout (Riverside Teahouse \u2192 overgrown tunnel). In the teahouse itself she won't bargain over Mayrina.","Ethel unter 20 % ihrer maximalen TP bringen. Nicht verstummen lassen und nicht bewusstlos schlagen \u2013 dann kann sie nicht verhandeln.":"Bring Ethel below 20% of her maximum HP. Don't silence her or knock her out \u2013 then she can't bargain.","In ihrem Zug bettelt sie: SG 20 auf T\xE4uschen oder Einsch\xFCchtern. Erfolg = Haar plus befreite Mayrina, Ethel kommt frei. Misslingt eine Probe, ist die andere gesperrt.":"On her turn she begs: DC 20 Deception or Intimidation. Success = hair plus freed Mayrina, Ethel goes free. If one check fails, the other is locked.","Haar essen und ein Attribut w\xE4hlen: +1 dauerhaft, auch \xFCber 20. Wirkt nicht auf Werte, die Items oder Elixiere fest setzen.":"Eat the hair and choose an ability: +1 permanently, even above 20. Doesn't affect scores that items or elixirs set to a fixed value.","Als Eidbrecher egal: Paladine brechen durch einen Deal mit ihr ihren Eid \u2013 deiner ist schon gebrochen.":"Irrelevant as an Oathbreaker: paladins break their oath by dealing with her \u2013 yours is already broken.","Adamant-Schienenpanzer schmieden":"Forge the Adamantine Splint Armour","Schienen-Gussform holen: X \u2212593 / Y 311 nahe dem Wegpunkt Alte Schmiede.":"Get the Splint Mould: X \u2212593 / Y 311 near the Ancient Forge waypoint.","Mithrilerz holen \u2013 es gibt nur zwei: am Lavafluss s\xFCdwestlich des Wegpunkts (X \u2212645 / Y 255) und in einem Torbogen \xF6stlich des Abstiegs (X \u2212558 / Y 278).":"Get Mithral Ore \u2013 there are only two: at the lava stream southwest of the waypoint (X \u2212645 / Y 255) and in an archway east of the descent (X \u2212558 / Y 278).","\xDCber den Felspfad auf die Plattform (etwa X \u2212568 / Y 243). Erz und Gussform in ihre Kammern legen.":"Take the rock path onto the platform (about X \u2212568 / Y 243). Put the ore and mould into their chambers.","Hebel in der Mitte des Podests ziehen \u2013 der Hammer senkt sich. Dann die Plattform mit dem Knopf dahinter absenken.":"Pull the lever in the middle of the dais \u2013 the hammer lowers. Then lower the platform with the button behind it.","Lavaventil am Ofen \xF6ffnen. Achtung: Beim ersten \xD6ffnen erscheinen Grym und Magma-Mephiten.":"Open the lava vent at the furnace. Careful: the first time you open it, Grym and magma mephits appear.","Hebel erneut ziehen, Gussform auswerfen, R\xFCstung aufheben. Tipp: Droughnir ist Gildenhandwerker \u2013 hebt er das erste geschmiedete St\xFCck auf, bekommt er die Inspiration Art Endures.":"Pull the lever again, eject the mould, pick up the armour. Tip: Droughnir is a Guild Artisan \u2013 if he picks up the first forged piece, he gets the inspiration Art Endures.","In der Eulenb\xE4renh\xF6hle hinten zur versiegelten Sel\xFBne-Truhe.":"Go to the sealed Sel\xFBne chest in the back of the Owlbear Nest.","Hinter der Sel\xFBne-Statue das Gebetsblatt suchen (Wahrnehmung).":"Look for the prayer page behind the Sel\xFBne statue (Perception).","Das Gebet vor der Statue vorlesen \u2013 die Truhe \xF6ffnet sich. Effekt des Anh\xE4ngers: unter 50 % TP keine Gelegenheitsangriffe.":"Read the prayer aloud in front of the statue \u2013 the chest opens. Pendant effect: below 50% HP no opportunity attacks.","Drachenweg & Riesent\xF6ter":"Wyrmway & Giantslayer","Im Westfl\xFCgel des Wyrmfelsen-Gef\xE4ngnisses beide Drachenkopf-Fackeln mit Blitzschaden treffen. Die Flammen werden blau, die Wand dazwischen wird zur Illusion.":"In the west wing of the Wyrm's Rock prison, hit both dragon-head torches with lightning damage. The flames turn blue, the wall between them becomes an illusion.","Pr\xFCfung der Gerechtigkeit (ganz links): Die Antwort lautet \u201EDie Zelle\u201C.":'Trial of Justice (far left): the answer is "The cell".',"Pr\xFCfung der Einsicht (unsichtbarer Pfad zwischen den linken Statuen): Fliegende B\xFCcher mit SG 15 Fingerfertigkeit fangen und lesen.":"Trial of Insight (invisible path between the left statues): catch and read the flying books with DC 15 Sleight of Hand.","Pr\xFCfung der Strategie (unten rechts): Lanzenbrett-R\xE4tsel \u2013 Schwarz in zwei Z\xFCgen mattsetzen, drei Versuche.":"Trial of Strategy (bottom right): lanceboard puzzle \u2013 checkmate black in two moves, three attempts.","Pr\xFCfung des Mutes (rechte H\xF6hle): Vier Runden Kampf, der Fackeltr\xE4ger muss bei Bewusstsein bleiben. Kristalle zerschlagen f\xFCr Elementarresistenz.":"Trial of Courage (right cave): four rounds of combat, the torchbearer must stay conscious. Smash crystals for elemental resistance.","Danach \xF6ffnet sich das Heiligtum: Ansur besiegen \u2013 er droppt Baldurans Riesent\xF6ter. Der Helm des Balduran liegt auf dem Sockel hinter ihm.":"Then the sanctum opens: defeat Ansur \u2013 he drops Balduran's Giantslayer. The Helm of Balduran lies on the pedestal behind him.","Archiv im Haus der Hoffnung":"Archive in the House of Hope","Im Archiv liegen die Panzerhandschuhe der H\xFCgelriesenst\xE4rke auf einem Sockel; das Amulett der gr\xF6\xDFeren Gesundheit ist im selben Raum.":"In the Archive the Gauntlets of Hill Giant Strength lie on a pedestal; the Amulet of Greater Health is in the same room.","Falle vor dem Nehmen entsch\xE4rfen: SG 20 Fingerfertigkeit.":"Disarm the trap before taking them: DC 20 Sleight of Hand.","Alternative: einen Gegenstand mit gleichem Gewicht auf den Sockel legen und dann die Handschuhe nehmen \u2013 so sparst du dir Wahrnehmung und Entsch\xE4rfen.":"Alternative: put an object of the same weight on the pedestal and then take the gauntlets \u2013 saves you Perception and disarming.","Kein Respec n\xF6tig: Handschuhe und Amulett setzen ST\xC4 und KON auch als Eidbrecher auf 23.":"No respec needed: Gauntlets and Amulet set STR and CON to 23 even as an Oathbreaker.","Spiegel des Verlusts":"Mirror of Loss","Der Spiegel in der Shar-Pr\xFCfung (Akt 2) ist zerbrochen \u2013 nutzbar ist nur der im Haus der Trauer (Akt 3).":"The mirror in the Gauntlet of Shar (Act 2) is broken \u2013 only the one in the House of Grief (Act 3) is usable.","Probe auf Arkane Kunde (SG 25) und Religion (SG 20) bestehen.":"Pass the Arcana (DC 25) and Religion (DC 20) checks.","Eine Erinnerung opfern: \u22122 auf ein unwichtiges Attribut, daf\xFCr +2 dauerhaft auf CHA. Die \u22122 l\xE4sst sich mit Fluch brechen (Remove Curse) entfernen.":"Sacrifice a memory: \u22122 on an unimportant ability, in exchange +2 permanently on CHA. The \u22122 can be removed with Remove Curse.","Jede Figur bekommt den Bonus nur einmal.":"Each character gets the bonus only once.","Eid gebrochen \u2013 was jetzt?":"Oath broken \u2013 what now?","Nach dem Eidbruch sind deine Eid-F\xE4higkeiten gesperrt, bis du im Lager mit dem Eidbrecher-Ritter sprichst.":"After breaking your oath your oath abilities are locked until you talk to the Oathbreaker Knight at camp.","Eidbrecher annehmen (kostenlos) \u2013 oder den alten Eid f\xFCr 1.000 Gold wiederherstellen (danach 2.000, ab dem dritten Mal 10.000).":"Accept Oathbreaker (free) \u2013 or restore the old oath for 1,000 gold (then 2,000, from the third time 10,000).","Als Eidbrecher: keine Grunds\xE4tze, aber kein Respec bei Der Verdorrte.":"As an Oathbreaker: no tenets, but no respec at Withers.","Den Ritter niemals t\xF6ten \u2013 sonst gibt es f\xFCr den Rest des Spiels keinen Respec mehr.":"Never kill the Knight \u2013 or there's no respec for the rest of the game.",Bonusaktion:"Bonus action","Eid der Rache 3 \xB7 Eid-Ladung":"Oath of Vengeance 3 \xB7 Channel Oath charge","10 Runden":"10 turns","Eid-Ladung l\xE4dt bei kurzer Rast":"Channel Oath charge recharges on a short rest","Du hast 10 Runden lang Vorteil auf alle Angriffsw\xFCrfe gegen ein Ziel.":"You have advantage on all attack rolls against one target for 10 turns.","Vor dem ersten Schlag gegen Bosse. Vorteil gleicht den GWM-Malus (\u22125) fast komplett aus \u2013 mit dem Gel\xFCbde lohnt sich \u201EAll In\u201C praktisch immer.":'Before the first strike against bosses. Advantage almost completely offsets the GWM penalty (\u22125) \u2013 with the Vow, "All In" practically always pays off.',"Vorteil verdoppelt fast deine Krit-Chance (rund 10 % statt 5 % pro Angriff) und damit die Zahl der Krit-Smites.":"Advantage nearly doubles your crit chance (about 10% instead of 5% per attack) and with it the number of crit smites.","Paladine haben nur eine Eid-Ladung pro kurzer Rast \u2013 Gel\xFCbde, Macht des Inquisitors und Feind bannen teilen sie sich.":"Paladins only have one Channel Oath charge per short rest \u2013 Vow, Inquisitor's Might and Abjure Enemy share it.","Eid der Rache 1 \xB7 Eid-Ladung":"Oath of Vengeance 1 \xB7 Channel Oath charge","2 Runden":"2 turns","Du oder ein Verb\xFCndeter verursacht mit Waffenangriffen zus\xE4tzlichen glei\xDFenden Schaden in H\xF6he deines CHA-Modifikators (mindestens 1). Treffer machen Gegner 1 Runde benommen \u2013 ohne Rettungswurf.":"You or an ally deal extra radiant damage with weapon attacks equal to your CHA modifier (at least 1). Hits daze enemies for 1 turn \u2013 no saving throw.","F\xFCr einen kurzen Burst-Zug mit vielen Treffern (Tatendrang, Hast, drei Angriffe auf W/R-Hexklinge). Bei l\xE4ngeren K\xE4mpfen ist das Gel\xFCbde die bessere Wahl f\xFCr die Ladung.":"For a short burst turn with many hits (Action Surge, Haste, three attacks on W/V Hexblade). In longer fights the Vow is the better use of the charge.","Glei\xDFender Schaden \u2013 gegen Gegner mit Strahlender Vergeltung (Shar-Pr\xFCfung, Haus der Trauer) nicht benutzen.":"Radiant damage \u2013 don't use it against enemies with Radiant Retort (Gauntlet of Shar, House of Grief).",Aktion:"Action","Ein Gegner wird ver\xE4ngstigt: Nachteil auf Attributs- und Angriffsw\xFCrfe, er kann sich nicht bewegen.":"One enemy becomes frightened: disadvantage on ability checks and attack rolls, it can't move.","Notbremse gegen einen gef\xE4hrlichen Nahk\xE4mpfer. F\xFCr Schaden ist das Gel\xFCbde fast immer besser.":"Emergency brake against a dangerous melee fighter. For damage the Vow is almost always better.","Eidzauber Rache 3 \xB7 Grad 1":"Oath spell Vengeance 3 \xB7 Level 1",Konzentration:"Concentration","Das markierte Ziel nimmt bei jedem deiner Waffentreffer 1W6 zus\xE4tzlichen Schaden. Stirbt es, versetzt du das Mal per Bonusaktion.":"The marked target takes 1d6 extra damage from each of your weapon hits. If it dies, move the mark with a bonus action.","G\xFCnstiger Dauerschaden \u2013 je mehr Angriffe pro Zug, desto mehr bringt es.":"Cheap sustained damage \u2013 the more attacks per turn, the more it adds.","Konzentration: vertr\xE4gt sich nicht mit Magischer Waffe, eigener Hast oder Zornigem Niederstrecken.":"Concentration: doesn't combine with Magic Weapon, your own Haste or Wrathful Smite.",Passiv:"Passive","Eid der Rache 7":"Oath of Vengeance 7","Triffst du mit einem Gelegenheitsangriff, bewegst du dich im n\xE4chsten Zug 4,5 m weiter.":"If you hit with an opportunity attack, you move 4.5 m further on your next turn.","Kein Schaden, aber hilft beim Nachsetzen gegen Fernk\xE4mpfer und Fliehende.":"No damage, but helps chase down ranged enemies and fleeing targets.","Eidzauber Rache 5 \xB7 Grad 2":"Oath spell Vengeance 5 \xB7 Level 2","Teleportiert dich an einen sichtbaren Punkt in Reichweite.":"Teleports you to a visible point within range.","Immer vorbereitet: direkt an den Boss, auf erh\xF6hte Positionen oder aus der Umzingelung \u2013 die Glaskanone kommt schneller an ihr Ziel und wieder weg.":"Always prepared: straight to the boss, onto high ground or out of an encirclement \u2013 the glass cannon gets to its target and away again faster.","Hexenmeister 1 (Hexklinge)":"Warlock 1 (Hexblade)","Kurze Rast":"Short rest","Verflucht ein Ziel: Deine Angriffe dagegen verursachen zus\xE4tzlichen Schaden in H\xF6he deines \xDCbungsbonus und sind schon bei 19\u201320 kritisch.":"Curses a target: your attacks against it deal extra damage equal to your proficiency bonus and crit on 19\u201320.","Fluch und Gel\xFCbde auf denselben Boss: Vorteil plus Krit ab 19 ergibt etwa 19 % Krit-Chance pro Angriff \u2013 fast jeder zweite Zug bringt einen Krit-Smite.":"Curse and Vow on the same boss: advantage plus crit from 19 gives about 19% crit chance per attack \u2013 almost every other turn brings a crit smite.","Bonusaktion (beschw\xF6ren)":"Bonus action (summon)","Zauberer / Hexenmeister \xB7 Grad 2":"Sorcerer / Warlock \xB7 Level 2","Bis zur langen Rast":"Until long rest","Beschw\xF6rt ein psychisches Kurzschwert: 2W8 psychischer Schaden, hochgewirkt 3W8, h\xF6chstens 4W8 (seit Patch 8).":"Summons a psychic shortsword: 2d8 psychic damage, upcast 3d8, at most 4d8 (since Patch 8).","Kern des Sorcadin-Wegs (R3). Aus Dunkelheit heraus mit Vorteil angreifen. Der Resonanzstein (Ende Akt 2) macht Gegner in 9 m verwundbar gegen psychischen Schaden.":"Core of the Sorcadin route (V3). Attack with advantage from within Darkness. The Resonance Stone (end of Act 2) makes enemies within 9 m vulnerable to psychic damage.","Keine schwere Waffe \u2013 Meisterschaft gro\xDFer Waffen gilt nicht. Konstrukte sind gegen psychischen Schaden immun.":"Not a heavy weapon \u2013 Great Weapon Master doesn't apply. Constructs are immune to psychic damage.","Aktion (Zaubertrick)":"Action (cantrip)","Zaubertrick (seit Patch 8)":"Cantrip (since Patch 8)","Nahkampf-Waffenangriff mit Donnerenergie: Bewegt sich das Ziel danach, nimmt es zus\xE4tzlichen Schallschaden.":"Melee weapon attack with thunder energy: if the target moves afterwards, it takes extra thunder damage.","Ersetzt beim Sorcadin den Standardangriff gegen Ziele, die fliehen oder sich neu positionieren wollen.":"For the Sorcadin, replaces the standard attack against targets that want to flee or reposition.","Reaktion bei Treffer":"Reaction on hit","Paladin 2 \xB7 Zauberplatz ab Grad 1":"Paladin 2 \xB7 spell slot level 1+",Nahkampf:"Melee","Nach einem Nahkampftreffer opferst du einen Zauberplatz f\xFCr glei\xDFenden Zusatzschaden. Der Schaden h\xE4ngt von keinem Attribut ab \u2013 weder ST\xC4 noch CHA \u2013, sondern nur vom Grad des Platzes:":"After a melee hit you spend a spell slot for extra radiant damage. The damage depends on no ability \u2013 neither STR nor CHA \u2013 only on the slot level:","Grad 1: 2W8 \xB7 Grad 2: 3W8 \xB7 Grad 3: 4W8 \xB7 Grad 4: 5W8 \u2013 das ist die harte Obergrenze. Gegen Untote und Unholde kommt 1W8 dazu. Bei einem kritischen Treffer werden alle Smite-W\xFCrfel verdoppelt.":"Level 1: 2d8 \xB7 Level 2: 3d8 \xB7 Level 3: 4d8 \xB7 Level 4: 5d8 \u2013 that's the hard cap. Against undead and fiends add 1d8. On a critical hit all smite dice are doubled.","ST\xC4 und CHA wirken nur indirekt: auf die Trefferchance, den Waffenschaden und (ab Stufe 7) die Aura des Hasses.":"STR and CHA only matter indirectly: for hit chance, weapon damage and (from level 7) Aura of Hate.","Pl\xE4tze f\xFCr Krits aufheben \u2013 gegen gel\xE4hmte Ziele (Person festhalten) ist jeder Nahkampftreffer ein Krit. Kampf mit gro\xDFen Waffen und Wilder Angreifer w\xFCrfeln Smite-W\xFCrfel in BG3 neu.":"Save slots for crits \u2013 against paralysed targets (Hold Person) every melee hit is a crit. Great Weapon Fighting and Savage Attacker reroll smite dice in BG3.","H\xF6llischer Tadel teilt sich dieselben Pl\xE4tze \u2013 dessen Reaktion ausschalten.":"Hellish Rebuke uses the same slots \u2013 switch off its reaction.","Strahlende Vergeltung (Radiant Retort): Die Dunklen Justiziare in der Shar-Pr\xFCfung (Akt 2) sowie die Sharraner und Viconia im Haus der Trauer (Akt 3) werfen glei\xDFenden Schaden doppelt als Energieschaden auf dich zur\xFCck. Laut bg3.wiki haben einige Justiziare die Eigenschaft erst ab Taktiker \u2013 pr\xFCfe trotzdem vor jedem Smite den Tooltip des Gegners. Ein gro\xDFer Krit-Smite kann Droughnir sonst selbst umhauen.":"Radiant Retort: the Dark Justiciars in the Gauntlet of Shar (Act 2) as well as the Sharrans and Viconia in the House of Grief (Act 3) reflect radiant damage back at you doubled as force damage. According to bg3.wiki some Justiciars only have it from Tactician \u2013 still check the enemy tooltip before every smite. Otherwise a big crit smite can take Droughnir down himself.","Im Haus der Hoffnung (Akt 3) haben Raphaels Rachs\xFCchtige Kreaturen (Cambion, Imp, Merregon) stattdessen Fl\xFCchtiger Schutz: Der erste glei\xDFende Treffer kommt doppelt als Feuerschaden zur\xFCck, danach endet der Schutz.":"In the House of Hope (Act 3) Raphael's Vengeful creatures (cambion, imp, merregon) have Fleeting Protection instead: the first radiant hit comes back doubled as fire damage, then the protection ends.","Eidbrecher 3 \xB7 Eid-Ladung":"Oathbreaker 3 \xB7 Channel Oath charge","Ein lebender, also aktiver untoter Gegner mit niedrigerem Level als du legt einen Weisheitsrettungswurf gegen deinen Zauber-SG ab. Misslingt er, k\xE4mpft er als KI-Verb\xFCndeter f\xFCr dich.":"A living, i.e. active undead enemy of a lower level than you makes a Wisdom saving throw against your spell save DC. If it fails, it fights for you as an AI ally.","Leichen kannst du damit nicht erwecken \u2013 daf\xFCr gibt es ab Paladin-Stufe 9 den Eidzauber Tote beleben (Animate Dead).":"You can't raise corpses with it \u2013 for that there's the oath spell Animate Dead from paladin level 9.","Heilzauber wie Wunden heilen und Handauflegen wirken nicht auf Untote. Rechne damit, dass sich dein Untoter nur \xFCber eine kurze Rast erholt.":"Healing spells like Cure Wounds and Lay on Hands don't work on undead. Expect your undead to recover only through a short rest.","Akt 1: Es gibt kaum Ziele \u2013 praktisch nur Gruft-Schreiber und Gruft-Krieger in der Feuchten Gruft unter den \xDCberwucherten Ruinen. Die eine Eid-Ladung ist meist besser bei Trotziges Leid (Bosse) oder Gr\xE4ssliches Aussehen (Gruppen) aufgehoben.":"Act 1: There are hardly any targets \u2013 practically only Entombed Scribes and Warriors in the Dank Crypt beneath the Overgrown Ruins. The single Channel Oath charge is usually better spent on Spiteful Suffering (bosses) or Dreadful Aspect (groups).","Ab Akt 2 lohnt es sich: Schattenverfluchte Lande, Reithwin und das Haus der Heilung mit Malus Thorm (ab Stufe 8 ein Boss-Skip) bieten viele starke Ziele.":"From Act 2 it pays off: the Shadow-Cursed Lands, Reithwin and the House of Healing with Malus Thorm (a boss skip from level 8) offer many strong targets.","Untote mit Waffen bevorzugen \u2013 ab Stufe 7 profitieren nur sie neben dir von der Aura des Hasses, Ghule oder Zombies mit Klauen nicht.":"Prefer undead with weapons \u2013 from level 7 only they benefit from Aura of Hate next to you, clawed ghouls or zombies don't.","Gehst du zu Boden, ist der Untote endg\xFCltig weg. Teilt sich die Eid-Ladung mit Trotziges Leid und Gr\xE4ssliches Aussehen.":"If you go down, the undead is gone for good. Shares the Channel Oath charge with Spiteful Suffering and Dreadful Aspect.","Die Level-Angaben gelten f\xFCr \u201EAusgewogen\u201C \u2013 auf Taktiker und Ehrenmodus k\xF6nnen Gegner h\xF6her sein.":'Levels apply to "Balanced" \u2013 on Tactician and Honour Mode enemies can be higher.',"Alle Feinde im Umkreis legen einen Weisheitsrettungswurf ab. Bei Misserfolg sind sie ver\xE4ngstigt: keine Bewegung, Nachteil auf Angriffe und Attributsw\xFCrfe.":"All enemies in the area make a Wisdom saving throw. On a failure they're frightened: no movement, disadvantage on attacks and ability checks.","Mitten in eine Gruppe laufen und z\xFCnden \u2013 danach kann niemand fliehen. Astarion mit dem Bogen der Todesfee bekommt +1W4 gegen Ver\xE4ngstigte.":"Run into the middle of a group and trigger it \u2013 afterwards nobody can flee. Astarion with the Bow of the Banshee gets +1d4 against frightened targets.","Eidbrecher 1 \xB7 Eid-Ladung":"Oathbreaker 1 \xB7 Channel Oath charge","3 Runden":"3 turns","Das Ziel legt einen Charismarettungswurf ab. Misslingt er, nimmt es jede Runde 1W4 + CHA-Mod nekrotischen Schaden, und alle Angriffe gegen es haben Vorteil. Zu Beginn jedes Zuges darf es erneut w\xFCrfeln.":"The target makes a Charisma saving throw. If it fails, it takes 1d4 + CHA modifier necrotic damage each turn, and all attacks against it have advantage. It may reroll at the start of each turn.","Der Boss-Opener: Vorteil gleicht den GWM-Malus von \u22125 aus. Zug 1 Trotziges Leid, ab Zug 2 alles mit \u201EAll In\u201C.":'The boss opener: advantage offsets the \u22125 GWM penalty. Turn 1 Spiteful Suffering, from turn 2 everything "All In".',"Passiv (Aura)":"Passive (aura)","Eidbrecher 7":"Oathbreaker 7",Dauerhaft:"Permanent","Du und alle Unholde und Untoten in der Aura \u2013 auch feindliche \u2013 addieren deinen CHA-Modifikator zum Schaden ihrer Nahkampfwaffenangriffe.":"You and all fiends and undead in the aura \u2013 enemies too \u2013 add your CHA modifier to the damage of their melee weapon attacks.","Je mehr Treffer pro Zug, desto mehr bringt die Aura \u2013 deshalb vergleicht der Tab \u201EWege\u201C Builds mit 3 und mehr Angriffen.":`The more hits per turn, the more the aura adds \u2013 that's why the "Routes" tab compares builds with 3 or more attacks.`,"Feindliche Untote und Unholde neben dir profitieren mit. Klauen-Untote ohne Waffe bekommen keinen Bonus. F\xE4llt weg, solange du bewusstlos bist.":"Enemy undead and fiends next to you benefit too. Clawed undead without weapons get no bonus. Lost while you're unconscious.",Reaktion:"Reaction","Eidzauber \xB7 Grad 1":"Oath spell \xB7 Level 1",Fernkampf:"Ranged","Wenn dich ein Feind verletzt, schl\xE4gt er Feuer zur\xFCck: 2W10 Feuerschaden, ein Geschicklichkeitsrettungswurf halbiert, +1W10 je h\xF6herem Grad.":"When an enemy damages you, you strike back with fire: 2d10 fire damage, a Dexterity save halves it, +1d10 per higher level.","F\xFCr eine Glaskanone kaum wert \u2013 jeder Platz geh\xF6rt in Smites.":"Hardly worth it for a glass cannon \u2013 every slot belongs to smites.","Reaktion auf Aus stellen. Sonst l\xF6st sie bei jedem Treffer gegen dich aus und verbraucht genau die Pl\xE4tze, die du f\xFCr G\xF6ttliches Niederstrecken brauchst.":"Set the reaction to off. Otherwise it triggers on every hit against you and uses exactly the slots you need for Divine Smite.","Nahkampf (Ber\xFChrung)":"Melee (touch)","Nahkampf-Zauberangriff mit 3W10 nekrotischem Schaden, +1W10 je h\xF6herem Grad.":"Melee spell attack with 3d10 necrotic damage, +1d10 per higher level.","Nur eine Notl\xF6sung. Ein Smite auf einen Waffentreffer bringt mit GWM und Aura fast immer mehr.":"Only a stopgap. A smite on a weapon hit almost always deals more with GWM and the aura.","Eidzauber Eidbrecher 9 \xB7 Grad 3":"Oath spell Oathbreaker 9 \xB7 Level 3","Leiche in der N\xE4he":"Corpse nearby","Erweckt eine Leiche als Skelett oder Zombie, der f\xFCr dich k\xE4mpft.":"Raises a corpse as a skeleton or zombie that fights for you.","Zusammen mit Untote kontrollieren eine kleine Untoten-Truppe bis zur langen Rast \u2013 das kontrollierte Ziel z\xE4hlt nicht gegen das Limit.":"Together with Control Undead a small undead squad until long rest \u2013 the controlled target doesn't count against the limit.","Klauen-Untote bekommen keinen Bonus durch die Aura des Hasses.":"Clawed undead get no bonus from Aura of Hate.","Paladin 5 \xB7 Grad 2":"Paladin 5 \xB7 Level 2","Ber\xFChrung (1,5 m)":"Touch (1.5 m)","Die Waffe bekommt einen Verzauberungsbonus auf Angriff und Schaden; laut bg3.wiki stapelt er mit vorhandenen Verzauberungen.":"The weapon gets an enchantment bonus to attack and damage; according to bg3.wiki it stacks with existing enchantments.","Gleicht einen Teil des GWM-Malus aus und h\xE4lt als Konzentrationszauber den Ring des seltsamen Leiters (+1W4 psychisch) dauerhaft an.":"Offsets part of the GWM penalty and, as a concentration spell, keeps the Strange Conduit Ring (+1d4 psychic) permanently active.","Belegt deine Konzentration \u2013 Hast von Gale bleibt davon unber\xFChrt, eigene Konzentrationszauber ersetzen ihn.":"Occupies your concentration \u2013 Haste from Gale is unaffected, your own concentration spells replace it.","Paladin 2 \xB7 Grad 1":"Paladin 2 \xB7 Level 1",Selbst:"Self","Deine Waffenangriffe verursachen 1W4 zus\xE4tzlichen glei\xDFenden Schaden.":"Your weapon attacks deal 1d4 extra radiant damage.","Billiger Schadens-Boost f\xFCr kurze K\xE4mpfe und Konzentrations-Ausl\xF6ser f\xFCr den Ring des seltsamen Leiters.":"Cheap damage boost for short fights and a concentration trigger for the Strange Conduit Ring.","Nur 3 Runden \u2013 f\xFCr lange K\xE4mpfe ist Magische Waffe besser.":"Only 3 turns \u2013 Magic Weapon is better for long fights.","Grad 2 (Gale, Schattenherz)":"Level 2 (Gale, Shadowheart)","Bis zu 10 Runden":"Up to 10 turns","Ein humanoides Ziel legt einen Weisheitsrettungswurf ab, sonst ist es gel\xE4hmt. Am Ende jedes seiner Z\xFCge darf es erneut w\xFCrfeln. Nahkampftreffer gegen gel\xE4hmte Ziele aus n\xE4chster N\xE4he sind automatisch kritisch.":"A humanoid target makes a Wisdom saving throw or is paralysed. It may reroll at the end of each of its turns. Melee hits against paralysed targets at close range are automatically critical.","Die Krit-Maschine: Ziel festhalten lassen, dann jeden Treffer mit dem h\xF6chsten Platz smiten \u2013 doppelte Smite-W\xFCrfel.":"The crit machine: have the target held, then smite every hit with your highest slot \u2013 doubled smite dice.","Bricht die Konzentration des Wirkers, ist die L\xE4hmung sofort vorbei.":"If the caster's concentration breaks, the paralysis ends immediately.","Grad 3 (Gale, Zauberer 5)":"Level 3 (Gale, Sorcerer 5)","Hast: +2 RK, Vorteil auf Geschicklichkeitsrettungsw\xFCrfe, +9 m Bewegung und eine zus\xE4tzliche Aktion pro Zug.":"Haste: +2 AC, advantage on Dexterity saving throws, +9 m movement and an extra action per turn.","Die zus\xE4tzliche Aktion ist ein voller Angriff mit Extra-Angriff \u2013 auf den meisten Wegen verdoppelt Hast deinen Schaden pro Zug.":"The extra action is a full attack with Extra Attack \u2013 on most routes Haste doubles your damage per turn.","Endet Hast vorzeitig, ist das Ziel einen Zug lethargisch: keine Bewegung, keine Aktionen, keine Reaktionen. Deshalb lieber Gale halten lassen.":"If Haste ends early, the target is lethargic for a turn: no movement, no actions, no reactions. That's why Gale should hold it.","Aktion (Waffenangriff)":"Action (weapon attack)","Paladin \xB7 Grad 1":"Paladin \xB7 Level 1","Ver\xE4ngstigt 2 Runden":"Frightened 2 turns","Waffenangriff mit 1W6 zus\xE4tzlichem psychischem Schaden. Das Ziel legt einen Weisheitsrettungswurf ab, sonst ist es ver\xE4ngstigt.":"Weapon attack with 1d6 extra psychic damage. The target makes a Wisdom saving throw or is frightened.","Stapelt mit G\xF6ttlichem Niederstrecken \u2013 bei Treffer kommt zus\xE4tzlich die Smite-Abfrage.":"Stacks with Divine Smite \u2013 on a hit you also get the smite prompt.","Braucht Konzentration und ersetzt damit Magische Waffe oder G\xF6ttliche Gunst.":"Needs concentration and therefore replaces Magic Weapon or Divine Favour.","Passiv (Talent, umschaltbar)":"Passive (feat, toggleable)","Talent \xB7 Paladin 4":"Feat \xB7 Paladin 4","\u201EAll In\u201C: \u22125 auf den Angriffswurf, daf\xFCr +10 Schaden mit schweren Nahkampfwaffen. Nach einem Krit oder Kill bekommst du einen Bonusangriff.":'"All In": \u22125 to the attack roll, in exchange +10 damage with heavy melee weapons. After a crit or kill you get a bonus attack.',"Nur mit Vorteil, Segnen oder gegen niedrige RK aktiv lassen. Ein Kill durch G\xF6ttliches Niederstrecken l\xF6st den Bonusangriff nicht aus.":"Only keep it on with advantage, Bless or against low AC. A kill by Divine Smite doesn't trigger the bonus attack.","Grad 1 (Schattenherz)":"Level 1 (Shadowheart)","Fernkampf, bis zu 3 Ziele":"Ranged, up to 3 targets","Gesegnete Ziele addieren 1W4 zu Angriffsw\xFCrfen und Rettungsw\xFCrfen.":"Blessed targets add 1d4 to attack rolls and saving throws.","Gleicht im Schnitt 2,5 Punkte des GWM-Malus aus. \xDCber Das fl\xFCsternde Versprechen bekommst du den Segen sogar ohne ihre Konzentration.":"Offsets 2.5 points of the GWM penalty on average. Via The Whispering Promise you even get the blessing without her concentration.","Heilt ein Ziel aus der Distanz um 1W4 + Weisheitsmodifikator.":"Heals a target at range for 1d4 + Wisdom modifier.","Tr\xE4gt Schattenherz Das fl\xFCsternde Versprechen, wird das geheilte Ziel zus\xE4tzlich gesegnet \u2013 ohne dass sie sich konzentrieren muss. So bleibt ihre Konzentration f\xFCr Schutzgeister oder Person festhalten frei.":"If Shadowheart wears The Whispering Promise, the healed target is also blessed \u2013 without her needing to concentrate. That keeps her concentration free for Spirit Guardians or Hold Person.","Du und Verb\xFCndete in der Aura addieren deinen CHA-Modifikator (mindestens +1) zu allen Rettungsw\xFCrfen.":"You and allies in the aura add your CHA modifier (at least +1) to all saving throws.","Die wichtigste Defensive der Glaskanone. Steht Schattenherz nah bei dir, h\xE4lt sie ihre Konzentration viel zuverl\xE4ssiger.":"The glass cannon's most important defence. If Shadowheart stays close to you, she holds her concentration much more reliably.","Zauberer 1 \xB7 Grad 1":"Sorcerer 1 \xB7 Level 1","Bis zu deinem n\xE4chsten Zug":"Until your next turn","+5 RK, bis dein n\xE4chster Zug beginnt; Magische Geschosse prallen ab.":"+5 AC until your next turn starts; Magic Missiles bounce off.","Nur auf dem Zauberer-Weg verf\xFCgbar. Auf Nachfragen stellen, damit sie nicht an kleine Treffer verpufft.":`Only available on the Sorcerer route. Set it to "Ask" so it isn't wasted on small hits.`,Klassenmerkmal:"Class feature","Eigene Waffe":"Own weapon","Du bindest eine Waffe: Angriff und Schaden laufen \xFCber CHA, die Waffe gilt als magisch. Mit Vertieftem Pakt (Hexenmeister 5) kommt au\xDFerhalb des Ehrenmodus ein dritter Angriff dazu.":"You bind a weapon: attack and damage use CHA, the weapon counts as magical. With Deepened Pact (Warlock 5) a third attack is added outside Honour Mode.","Baldurans Riesent\xF6ter binden: Die Passive addiert weiterhin ST\xC4, du bekommst also CHA + ST\xC4 auf den Schaden.":"Bind Balduran's Giantslayer: the passive still adds STR, so you get CHA + STR on damage.","Der dritte Angriff braucht laut deiner Quelle die gebundene Waffe \u2013 im Spiel pr\xFCfen.":"According to your source the third attack needs the bound weapon \u2013 check in game.","Frei (keine Aktion)":"Free (no action)","Dieser Zug":"This turn","Du bekommst sofort eine zus\xE4tzliche Aktion \u2013 mit vollem Extra-Angriff, auch im Ehrenmodus.":"You immediately get an extra action \u2013 with full Extra Attack, in Honour Mode too.","F\xFCr den Er\xF6ffnungs-Burst: Angriff, Tatendrang, Hast-Aktion \u2013 bis zu sechs Angriffe in einem Zug.":"For the opening burst: attack, Action Surge, Haste action \u2013 up to six attacks in one turn.","Jeder Nahkampfwaffentreffer verursacht 1W8 zus\xE4tzlichen glei\xDFenden Schaden \u2013 ohne Zauberplatz.":"Every melee weapon hit deals 1d8 extra radiant damage \u2013 no spell slot.","Nur der reine Eidbrecher kommt hierhin. Wirkt auch beim GWM-Bonusangriff.":"Only the pure Oathbreaker gets here. Works on the GWM bonus attack too.","Passiv (Talent)":"Passive (feat)",Talent:"Feat","Waffenschadensw\xFCrfel werden zweimal geworfen, der h\xF6here Wurf z\xE4hlt.":"Weapon damage dice are rolled twice, the higher roll counts.","W\xFCrfelt in BG3 auch die W\xFCrfel von G\xF6ttliches Niederstrecken neu \u2013 deshalb das dritte Talent beim reinen Eidbrecher.":"In BG3 also rerolls the Divine Smite dice \u2013 that's why it's the third feat for the pure Oathbreaker.",Metamagie:"Metamagic","Zauberer 2 \xB7 3 Zauberpunkte":"Sorcerer 2 \xB7 3 sorcery points","Ein Zauber, der eine Aktion kostet, kostet nur eine Bonusaktion.":"A spell that costs an action only costs a bonus action.","Hast als Bonusaktion auf dich selbst, dann direkt angreifen. Nur auf dem Zauberer-Weg.":"Haste as a bonus action on yourself, then attack right away. Only on the Sorcerer route.","Grad 1 (Paladin, Schattenherz)":"Level 1 (Paladin, Shadowheart)","+2 RK f\xFCr ein Ziel.":"+2 AC for one target.","Schattenherz' Alternative zu Segnen, wenn du viel Schaden frisst.":"Shadowheart's alternative to Bless when you're taking a lot of damage.","Grad 2 (Paladin, Schattenherz)":"Level 2 (Paladin, Shadowheart)","Bis zu 3 Verb\xFCndete":"Up to 3 allies","Erh\xF6ht die maximalen und aktuellen TP der Ziele (5 auf Grad 2, mehr auf h\xF6heren Graden).":"Increases the targets' maximum and current HP (5 at level 2, more at higher levels).","Direkt nach der langen Rast wirken \u2013 kostet keine Konzentration und h\xE4lt den ganzen Tag.":"Cast right after the long rest \u2013 costs no concentration and lasts all day.","Grad 2 (Schattenherz)":"Level 2 (Shadowheart)",Ber\u00FChrung:"Touch","+1 RK und Rettungsw\xFCrfe sowie Resistenz gegen allen Schaden f\xFCr dich \u2013 Schattenherz nimmt daf\xFCr denselben Schaden.":"+1 AC and saving throws plus resistance to all damage for you \u2013 Shadowheart takes the same damage in return.","Macht die Glaskanone deutlich z\xE4her. Nur nutzen, wenn Schattenherz selbst hinten sicher steht.":"Makes the glass cannon much tougher. Only use it when Shadowheart herself stands safely at the back.","F\xE4llt Schattenherz, endet der Schutz \u2013 und du verlierst deine Heilerin.":"If Shadowheart falls, the protection ends \u2013 and you lose your healer.","Grad 3 (Schattenherz)":"Level 3 (Shadowheart)","Aura um die Wirkerin":"Aura around the caster","Geister umkreisen Schattenherz: Feinde in der Aura nehmen Schaden (Weisheitsrettungswurf halbiert) und sind verlangsamt.":"Spirits circle Shadowheart: enemies in the aura take damage (Wisdom save halves) and are slowed.","Schattenherz direkt hinter dir in den Nahkampf stellen \u2013 Feinde, die zu dir wollen, laufen durch die Geister.":"Place Shadowheart right behind you in melee \u2013 enemies that want to reach you walk through the spirits.","Fernkampf, mehrere Ziele":"Ranged, multiple targets","Heilt bis zu sechs Verb\xFCndete gleichzeitig aus der Distanz.":"Heals up to six allies at once at range.","Die Notbremse, wenn mehrere am Boden liegen \u2013 kostet keine Aktion.":"The emergency brake when several are down \u2013 costs no action.","Holt eine gerade gestorbene Figur mit 1 TP zur\xFCck.":"Brings back a character who just died with 1 HP.","Pflicht f\xFCr die Glaskanone. Bei Untote kontrollieren gilt: F\xE4llst du, ist der Untote trotzdem weg.":"A must for the glass cannon. With Control Undead: if you fall, the undead is gone anyway.","Grad 4 (Schattenherz)":"Level 4 (Shadowheart)","F\xE4llt das Ziel das erste Mal auf 0 TP, bleibt es stattdessen mit 1 TP stehen.":"The first time the target drops to 0 HP, it stays up with 1 HP instead.","Vor jedem Bosskampf auf dich \u2013 h\xE4lt ohne Konzentration.":"On you before every boss fight \u2013 lasts without concentration.","Das Ziel kann nicht gel\xE4hmt oder festgehalten werden und ignoriert schwieriges Gel\xE4nde.":"The target can't be paralysed or restrained and ignores difficult terrain.","Gegen Gegner mit L\xE4hmung oder Netzen \u2013 sonst niedrige Priorit\xE4t.":"Against enemies with paralysis or webs \u2013 otherwise low priority.","Grad 6 (Schattenherz)":"Level 6 (Shadowheart)","Ganze Gruppe":"Whole party","Ein Festmahl: Immunit\xE4t gegen Gift und Angst und mehr maximale TP f\xFCr alle.":"A feast: immunity to poison and fear and more maximum HP for everyone.","Vor dem gro\xDFen Endkampf eines Tages \u2013 gerade gegen Angst-Effekte wertvoll.":"Before the big final fight of a day \u2013 especially valuable against fear effects.","Gro\xDFe Einzelheilung und Entfernen einiger Zust\xE4nde wie Blindheit.":"Big single-target heal and removal of some conditions like blindness.","Holt dich aus einem Burst sofort zur\xFCck auf volle Kampfkraft.":"Brings you straight back to full fighting strength after a burst.","Grad 4 (Gale)":"Level 4 (Gale)",
