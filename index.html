el",steps:["Kampf im Versteck austragen (Uferteehaus \u2192 \xFCberwucherter Tunnel). Im Teehaus selbst verhandelt sie nicht um Mayrina.","Ethel unter 20 % ihrer maximalen TP bringen. Nicht verstummen lassen und nicht bewusstlos schlagen \u2013 dann kann sie nicht verhandeln.","In ihrem Zug bettelt sie: SG 20 auf T\xE4uschen oder Einsch\xFCchtern. Erfolg = Haar plus befreite Mayrina, Ethel kommt frei. Misslingt eine Probe, ist die andere gesperrt.","Haar essen und ein Attribut w\xE4hlen: +1 dauerhaft, auch \xFCber 20. Wirkt nicht auf Werte, die Items oder Elixiere fest setzen.","Als Eidbrecher egal: Paladine brechen durch einen Deal mit ihr ihren Eid \u2013 deiner ist schon gebrochen."]},{id:"tut-forge",n:"Adamant-Schienenpanzer schmieden",loc:"loc-grymforge",steps:["Schienen-Gussform holen: X \u2212593 / Y 311 nahe dem Wegpunkt Alte Schmiede.","Mithrilerz holen \u2013 es gibt nur zwei: am Lavafluss s\xFCdwestlich des Wegpunkts (X \u2212645 / Y 255) und in einem Torbogen \xF6stlich des Abstiegs (X \u2212558 / Y 278).","\xDCber den Felspfad auf die Plattform (etwa X \u2212568 / Y 243). Erz und Gussform in ihre Kammern legen.","Hebel in der Mitte des Podests ziehen \u2013 der Hammer senkt sich. Dann die Plattform mit dem Knopf dahinter absenken.","Lavaventil am Ofen \xF6ffnen. Achtung: Beim ersten \xD6ffnen erscheinen Grym und Magma-Mephiten.","Hebel erneut ziehen, Gussform auswerfen, R\xFCstung aufheben. Tipp: Droughnir ist Gildenhandwerker \u2013 hebt er das erste geschmiedete St\xFCck auf, bekommt er die Inspiration Art Endures."]},{id:"tut-moondrop",n:"Mondtropfenanh\xE4nger",loc:"loc-owlbear",steps:["In der Eulenb\xE4renh\xF6hle hinten zur versiegelten Sel\xFBne-Truhe.","Hinter der Sel\xFBne-Statue das Gebetsblatt suchen (Wahrnehmung).","Das Gebet vor der Statue vorlesen \u2013 die Truhe \xF6ffnet sich. Effekt des Anh\xE4ngers: unter 50 % TP keine Gelegenheitsangriffe."]},{id:"tut-wyrmway",n:"Drachenweg & Riesent\xF6ter",loc:"loc-wyrmway",steps:["Im Westfl\xFCgel des Wyrmfelsen-Gef\xE4ngnisses beide Drachenkopf-Fackeln mit Blitzschaden treffen. Die Flammen werden blau, die Wand dazwischen wird zur Illusion.","Pr\xFCfung der Gerechtigkeit (ganz links): Die Antwort lautet \u201EDie Zelle\u201C.","Pr\xFCfung der Einsicht (unsichtbarer Pfad zwischen den linken Statuen): Fliegende B\xFCcher mit SG 15 Fingerfertigkeit fangen und lesen.","Pr\xFCfung der Strategie (unten rechts): Lanzenbrett-R\xE4tsel \u2013 Schwarz in zwei Z\xFCgen mattsetzen, drei Versuche.","Pr\xFCfung des Mutes (rechte H\xF6hle): Vier Runden Kampf, der Fackeltr\xE4ger muss bei Bewusstsein bleiben. Kristalle zerschlagen f\xFCr Elementarresistenz.","Danach \xF6ffnet sich das Heiligtum: Ansur besiegen \u2013 er droppt Baldurans Riesent\xF6ter. Der Helm des Balduran liegt auf dem Sockel hinter ihm."]},{id:"tut-archive",n:"Archiv im Haus der Hoffnung",loc:"loc-hope",steps:["Im Archiv liegen die Panzerhandschuhe der H\xFCgelriesenst\xE4rke auf einem Sockel; das Amulett der gr\xF6\xDFeren Gesundheit ist im selben Raum.","Falle vor dem Nehmen entsch\xE4rfen: SG 20 Fingerfertigkeit.","Alternative: einen Gegenstand mit gleichem Gewicht auf den Sockel legen und dann die Handschuhe nehmen \u2013 so sparst du dir Wahrnehmung und Entsch\xE4rfen.","Kein Respec n\xF6tig: Handschuhe und Amulett setzen ST\xC4 und KON auch als Eidbrecher auf 23."]},{id:"tut-mirror",n:"Spiegel des Verlusts",loc:"loc-grief",steps:["Der Spiegel in der Shar-Pr\xFCfung (Akt 2) ist zerbrochen \u2013 nutzbar ist nur der im Haus der Trauer (Akt 3).","Probe auf Arkane Kunde (SG 25) und Religion (SG 20) bestehen.","Eine Erinnerung opfern: \u22122 auf ein unwichtiges Attribut, daf\xFCr +2 dauerhaft auf CHA. Die \u22122 l\xE4sst sich mit Fluch brechen (Remove Curse) entfernen.","Jede Figur bekommt den Bonus nur einmal."]},{id:"tut-knight",n:"Eid gebrochen \u2013 was jetzt?",loc:"loc-camp",steps:["Nach dem Eidbruch sind deine Eid-F\xE4higkeiten gesperrt, bis du im Lager mit dem Eidbrecher-Ritter sprichst.","Eidbrecher annehmen (kostenlos) \u2013 oder den alten Eid f\xFCr 1.000 Gold wiederherstellen (danach 2.000, ab dem dritten Mal 10.000).","Als Eidbrecher: keine Grunds\xE4tze, aber kein Respec bei Der Verdorrte.","Den Ritter niemals t\xF6ten \u2013 sonst gibt es f\xFCr den Rest des Spiels keinen Respec mehr."]}],Ct=Object.fromEntries(Rr.map(e=>[e.id,e])),ko=Object.fromEntries(oa.map(e=>[e.id,e])),Li=Object.fromEntries(sc.map(e=>[e.id,e])),Wn={a1:{loc:["loc-ruins"]},o2:{loc:["loc-ruins"]},o1:{loc:["loc-camp"],npc:["npc-knight"],tut:"tut-knight"},o11:{loc:["loc-camp"],npc:["npc-knight"],tut:"tut-knight"},o15:{loc:["loc-camp"],npc:["npc-withers"]},o4:{loc:["loc-camp"],npc:["npc-withers"]},a2:{npc:["npc-ethel"],tut:"tut-ethel"},a3:{loc:["loc-grove","loc-goblin"],npc:["npc-dammon","npc-grat"]},a4:{loc:["loc-grove"],npc:["npc-volo","npc-grat"]},a5:{loc:["loc-grove"],npc:["npc-dammon"]},a6:{},a7:{loc:["loc-grove","loc-ethel"],npc:["npc-ethel"]},a8:{loc:["loc-owlbear"],tut:"tut-moondrop"},a9:{loc:["loc-ethel"],npc:["npc-ethel"],tut:"tut-ethel"},a9b:{loc:["loc-ethel"]},a10:{loc:["loc-goblin"],npc:["npc-grat"]},a11:{loc:["loc-goblin"],npc:["npc-dror"]},a12:{loc:["loc-goblin"],npc:["npc-minthara"]},a13:{loc:["loc-outpost"]},a14:{loc:["loc-myconid"],npc:["npc-derryth"]},a15:{loc:["loc-grymforge"],npc:["npc-greymon"]},o3:{loc:["loc-grymforge"],npc:["npc-greymon"]},a16:{loc:["loc-grymforge"],npc:["npc-grym"],tut:"tut-forge"},o14:{loc:["loc-risen"],npc:["npc-anders"]},o13:{loc:["loc-creche"]},o10:{loc:["loc-rosymorn"],npc:["npc-esther"]},b1:{loc:["loc-lastlight"],npc:["npc-talli"]},b2:{loc:["loc-lastlight"]},o16:{loc:["loc-lastlight"],npc:["npc-dammon"]},b4:{loc:["loc-moonrise"],npc:["npc-araj"]},o17:{loc:["loc-gauntlet"]},o7:{loc:["loc-shadowlands"]},o6:{loc:["loc-healing"],npc:["npc-malus"]},c1:{loc:["loc-hope"],tut:"tut-archive"},c2:{loc:["loc-hope"],tut:"tut-archive"},c3:{loc:["loc-hope"],npc:["npc-raphael"]},o18:{loc:["loc-grief"],tut:"tut-mirror"},c4:{loc:["loc-wyrmway"],npc:["npc-ansur"],tut:"tut-wyrmway"},o19:{loc:["loc-wyrmway"],npc:["npc-ansur"],tut:"tut-wyrmway"}},_t={H\u00E4ndler:"#c8a86b",Gegner:"#c0562c",Quest:"#8b5cf6",Lager:"#7aa2c8",Untot:"#8fc9a8"},So={"s-vow-enmity":{t:"Bonusaktion",src:"Eid der Rache 3 \xB7 Eid-Ladung",r:"3 m",d:"10 Runden",rest:"Eid-Ladung l\xE4dt bei kurzer Rast",mech:"Du hast 10 Runden lang Vorteil auf alle Angriffsw\xFCrfe gegen ein Ziel.",tac:["Vor dem ersten Schlag gegen Bosse. Vorteil gleicht den GWM-Malus (\u22125) fast komplett aus \u2013 mit dem Gel\xFCbde lohnt sich \u201EAll In\u201C praktisch immer.","Vorteil verdoppelt fast deine Krit-Chance (rund 10 % statt 5 % pro Angriff) und damit die Zahl der Krit-Smites."],warn:"Paladine haben nur eine Eid-Ladung pro kurzer Rast \u2013 Gel\xFCbde, Macht des Inquisitors und Feind bannen teilen sie sich."},"s-inquisitors-might":{t:"Bonusaktion",src:"Eid der Rache 1 \xB7 Eid-Ladung",r:"9 m",d:"2 Runden",rest:"Eid-Ladung l\xE4dt bei kurzer Rast",mech:"Du oder ein Verb\xFCndeter verursacht mit Waffenangriffen zus\xE4tzlichen glei\xDFenden Schaden in H\xF6he deines CHA-Modifikators (mindestens 1). Treffer machen Gegner 1 Runde benommen \u2013 ohne Rettungswurf.",tac:"F\xFCr einen kurzen Burst-Zug mit vielen Treffern (Tatendrang, Hast, drei Angriffe auf W/R-Hexklinge). Bei l\xE4ngeren K\xE4mpfen ist das Gel\xFCbde die bessere Wahl f\xFCr die Ladung.",warn:"Glei\xDFender Schaden \u2013 gegen Gegner mit Strahlender Vergeltung (Shar-Pr\xFCfung, Haus der Trauer) nicht benutzen."},"s-abjure-enemy":{t:"Aktion",src:"Eid der Rache 3 \xB7 Eid-Ladung",mech:"Ein Gegner wird ver\xE4ngstigt: Nachteil auf Attributs- und Angriffsw\xFCrfe, er kann sich nicht bewegen.",tac:"Notbremse gegen einen gef\xE4hrlichen Nahk\xE4mpfer. F\xFCr Schaden ist das Gel\xFCbde fast immer besser."},"s-hunters-mark":{t:"Bonusaktion",src:"Eidzauber Rache 3 \xB7 Grad 1",d:"Konzentration",k:!0,mech:"Das markierte Ziel nimmt bei jedem deiner Waffentreffer 1W6 zus\xE4tzlichen Schaden. Stirbt es, versetzt du das Mal per Bonusaktion.",tac:"G\xFCnstiger Dauerschaden \u2013 je mehr Angriffe pro Zug, desto mehr bringt es.",warn:"Konzentration: vertr\xE4gt sich nicht mit Magischer Waffe, eigener Hast oder Zornigem Niederstrecken."},"s-relentless-avenger":{t:"Passiv",src:"Eid der Rache 7",mech:"Triffst du mit einem Gelegenheitsangriff, bewegst du dich im n\xE4chsten Zug 4,5 m weiter.",tac:"Kein Schaden, aber hilft beim Nachsetzen gegen Fernk\xE4mpfer und Fliehende."},"s-misty-step":{t:"Bonusaktion",src:"Eidzauber Rache 5 \xB7 Grad 2",mech:"Teleportiert dich an einen sichtbaren Punkt in Reichweite.",tac:"Immer vorbereitet: direkt an den Boss, auf erh\xF6hte Positionen oder aus der Umzingelung \u2013 die Glaskanone kommt schneller an ihr Ziel und wieder weg."},"s-hexblade-curse":{t:"Bonusaktion",src:"Hexenmeister 1 (Hexklinge)",rest:"Kurze Rast",mech:"Verflucht ein Ziel: Deine Angriffe dagegen verursachen zus\xE4tzlichen Schaden in H\xF6he deines \xDCbungsbonus und sind schon bei 19\u201320 kritisch.",tac:"Fluch und Gel\xFCbde auf denselben Boss: Vorteil plus Krit ab 19 ergibt etwa 19 % Krit-Chance pro Angriff \u2013 fast jeder zweite Zug bringt einen Krit-Smite."},"s-shadow-blade":{t:"Bonusaktion (beschw\xF6ren)",src:"Zauberer / Hexenmeister \xB7 Grad 2",d:"Bis zur langen Rast",mech:"Beschw\xF6rt ein psychisches Kurzschwert: 2W8 psychischer Schaden, hochgewirkt 3W8, h\xF6chstens 4W8 (seit Patch 8).",tac:"Kern des Sorcadin-Wegs (R3). Aus Dunkelheit heraus mit Vorteil angreifen. Der Resonanzstein (Ende Akt 2) macht Gegner in 9 m verwundbar gegen psychischen Schaden.",warn:"Keine schwere Waffe \u2013 Meisterschaft gro\xDFer Waffen gilt nicht. Konstrukte sind gegen psychischen Schaden immun."},"s-booming-blade":{t:"Aktion (Zaubertrick)",src:"Zaubertrick (seit Patch 8)",mech:"Nahkampf-Waffenangriff mit Donnerenergie: Bewegt sich das Ziel danach, nimmt es zus\xE4tzlichen Schallschaden.",tac:"Ersetzt beim Sorcadin den Standardangriff gegen Ziele, die fliehen oder sich neu positionieren wollen."},"s-divine-smite":{t:"Reaktion bei Treffer",src:"Paladin 2 \xB7 Zauberplatz ab Grad 1",r:"Nahkampf",d:"Sofort",mech:["Nach einem Nahkampftreffer opferst du einen Zauberplatz f\xFCr glei\xDFenden Zusatzschaden. Der Schaden h\xE4ngt von keinem Attribut ab \u2013 weder ST\xC4 noch CHA \u2013, sondern nur vom Grad des Platzes:","Grad 1: 2W8 \xB7 Grad 2: 3W8 \xB7 Grad 3: 4W8 \xB7 Grad 4: 5W8 \u2013 das ist die harte Obergrenze. Gegen Untote und Unholde kommt 1W8 dazu. Bei einem kritischen Treffer werden alle Smite-W\xFCrfel verdoppelt.","ST\xC4 und CHA wirken nur indirekt: auf die Trefferchance, den Waffenschaden und (ab Stufe 7) die Aura des Hasses."],tac:"Pl\xE4tze f\xFCr Krits aufheben \u2013 gegen gel\xE4hmte Ziele (Person festhalten) ist jeder Nahkampftreffer ein Krit. Kampf mit gro\xDFen Waffen und Wilder Angreifer w\xFCrfeln Smite-W\xFCrfel in BG3 neu.",warn:["H\xF6llischer Tadel teilt sich dieselben Pl\xE4tze \u2013 dessen Reaktion ausschalten.","Strahlende Vergeltung (Radiant Retort): Die Dunklen Justiziare in der Shar-Pr\xFCfung (Akt 2) sowie die Sharraner und Viconia im Haus der Trauer (Akt 3) werfen glei\xDFenden Schaden doppelt als Energieschaden auf dich zur\xFCck. Laut bg3.wiki haben einige Justiziare die Eigenschaft erst ab Taktiker \u2013 pr\xFCfe trotzdem vor jedem Smite den Tooltip des Gegners. Ein gro\xDFer Krit-Smite kann Droughnir sonst selbst umhauen.","Im Haus der Hoffnung (Akt 3) haben Raphaels Rachs\xFCchtige Kreaturen (Cambion, Imp, Merregon) stattdessen Fl\xFCchtiger Schutz: Der erste glei\xDFende Treffer kommt doppelt als Feuerschaden zur\xFCck, danach endet der Schutz."],gear:["Helmet of Smiting"],loc:["loc-gauntlet","loc-grief","loc-hope"]},"s-control-undead":{t:"Aktion",src:"Eidbrecher 3 \xB7 Eid-Ladung",r:"6 m",d:"Bis zur langen Rast",rest:"Eid-Ladung l\xE4dt bei kurzer Rast",mech:["Ein lebender, also aktiver untoter Gegner mit niedrigerem Level als du legt einen Weisheitsrettungswurf gegen deinen Zauber-SG ab. Misslingt er, k\xE4mpft er als KI-Verb\xFCndeter f\xFCr dich.","Leichen kannst du damit nicht erwecken \u2013 daf\xFCr gibt es ab Paladin-Stufe 9 den Eidzauber Tote beleben (Animate Dead).","Heilzauber wie Wunden heilen und Handauflegen wirken nicht auf Untote. Rechne damit, dass sich dein Untoter nur \xFCber eine kurze Rast erholt."],tac:["Akt 1: Es gibt kaum Ziele \u2013 praktisch nur Gruft-Schreiber und Gruft-Krieger in der Feuchten Gruft unter den \xDCberwucherten Ruinen. Die eine Eid-Ladung ist meist besser bei Trotziges Leid (Bosse) oder Gr\xE4ssliches Aussehen (Gruppen) aufgehoben.","Ab Akt 2 lohnt es sich: Schattenverfluchte Lande, Reithwin und das Haus der Heilung mit Malus Thorm (ab Stufe 8 ein Boss-Skip) bieten viele starke Ziele.","Untote mit Waffen bevorzugen \u2013 ab Stufe 7 profitieren nur sie neben dir von der Aura des Hasses, Ghule oder Zombies mit Klauen nicht."],warn:["Gehst du zu Boden, ist der Untote endg\xFCltig weg. Teilt sich die Eid-Ladung mit Trotziges Leid und Gr\xE4ssliches Aussehen.","Die Level-Angaben gelten f\xFCr \u201EAusgewogen\u201C \u2013 auf Taktiker und Ehrenmodus k\xF6nnen Gegner h\xF6her sein."],chk:["o2","o6"],loc:["loc-ruins","loc-shadowlands","loc-healing"],npc:["npc-malus"]},"s-dreadful-aspect":{t:"Aktion",src:"Eidbrecher 3 \xB7 Eid-Ladung",r:"9 m um dich",d:"2 Runden",rest:"Eid-Ladung l\xE4dt bei kurzer Rast",mech:"Alle Feinde im Umkreis legen einen Weisheitsrettungswurf ab. Bei Misserfolg sind sie ver\xE4ngstigt: keine Bewegung, Nachteil auf Angriffe und Attributsw\xFCrfe.",tac:"Mitten in eine Gruppe laufen und z\xFCnden \u2013 danach kann niemand fliehen. Astarion mit dem Bogen der Todesfee bekommt +1W4 gegen Ver\xE4ngstigte.",gear:["Bow of the Banshee"],who:["Astarion"]},"s-spiteful-suffering":{t:"Aktion",src:"Eidbrecher 1 \xB7 Eid-Ladung",r:"3 m",d:"3 Runden",rest:"Eid-Ladung l\xE4dt bei kurzer Rast",mech:"Das Ziel legt einen Charismarettungswurf ab. Misslingt er, nimmt es jede Runde 1W4 + CHA-Mod nekrotischen Schaden, und alle Angriffe gegen es haben Vorteil. Zu Beginn jedes Zuges darf es erneut w\xFCrfeln.",tac:"Der Boss-Opener: Vorteil gleicht den GWM-Malus von \u22125 aus. Zug 1 Trotziges Leid, ab Zug 2 alles mit \u201EAll In\u201C."},"s-aura-hate":{t:"Passiv (Aura)",src:"Eidbrecher 7",r:"3 m",d:"Dauerhaft",mech:"Du und alle Unholde und Untoten in der Aura \u2013 auch feindliche \u2013 addieren deinen CHA-Modifikator zum Schaden ihrer Nahkampfwaffenangriffe.",tac:"Je mehr Treffer pro Zug, desto mehr bringt die Aura \u2013 deshalb vergleicht der Tab \u201EWege\u201C Builds mit 3 und mehr Angriffen.",warn:"Feindliche Untote und Unholde neben dir profitieren mit. Klauen-Untote ohne Waffe bekommen keinen Bonus. F\xE4llt weg, solange du bewusstlos bist.",chk:["o5"]},"s-hellish-rebuke":{t:"Reaktion",src:"Eidzauber \xB7 Grad 1",r:"Fernkampf",d:"Sofort",mech:"Wenn dich ein Feind verletzt, schl\xE4gt er Feuer zur\xFCck: 2W10 Feuerschaden, ein Geschicklichkeitsrettungswurf halbiert, +1W10 je h\xF6herem Grad.",tac:"F\xFCr eine Glaskanone kaum wert \u2013 jeder Platz geh\xF6rt in Smites.",warn:"Reaktion auf Aus stellen. Sonst l\xF6st sie bei jedem Treffer gegen dich aus und verbraucht genau die Pl\xE4tze, die du f\xFCr G\xF6ttliches Niederstrecken brauchst."},"s-inflict-wounds":{t:"Aktion",src:"Eidzauber \xB7 Grad 1",r:"Nahkampf (Ber\xFChrung)",d:"Sofort",mech:"Nahkampf-Zauberangriff mit 3W10 nekrotischem Schaden, +1W10 je h\xF6herem Grad.",tac:"Nur eine Notl\xF6sung. Ein Smite auf einen Waffentreffer bringt mit GWM und Aura fast immer mehr."},"s-animate-dead":{t:"Aktion",src:"Eidzauber Eidbrecher 9 \xB7 Grad 3",r:"Leiche in der N\xE4he",d:"Bis zur langen Rast",mech:"Erweckt eine Leiche als Skelett oder Zombie, der f\xFCr dich k\xE4mpft.",tac:"Zusammen mit Untote kontrollieren eine kleine Untoten-Truppe bis zur langen Rast \u2013 das kontrollierte Ziel z\xE4hlt nicht gegen das Limit.",warn:"Klauen-Untote bekommen keinen Bonus durch die Aura des Hasses."},"s-magic-weapon":{t:"Aktion",src:"Paladin 5 \xB7 Grad 2",r:"Ber\xFChrung (1,5 m)",d:"Bis zur langen Rast",k:!0,mech:"Die Waffe bekommt einen Verzauberungsbonus auf Angriff und Schaden; laut bg3.wiki stapelt er mit vorhandenen Verzauberungen.",tac:"Gleicht einen Teil des GWM-Malus aus und h\xE4lt als Konzentrationszauber den Ring des seltsamen Leiters (+1W4 psychisch) dauerhaft an.",warn:"Belegt deine Konzentration \u2013 Hast von Gale bleibt davon unber\xFChrt, eigene Konzentrationszauber ersetzen ihn.",gear:["Strange Conduit Ring"],chk:["o13"]},"s-divine-favour":{t:"Bonusaktion",src:"Paladin 2 \xB7 Grad 1",r:"Selbst",d:"3 Runden",k:!0,mech:"Deine Waffenangriffe verursachen 1W4 zus\xE4tzlichen glei\xDFenden Schaden.",tac:"Billiger Schadens-Boost f\xFCr kurze K\xE4mpfe und Konzentrations-Ausl\xF6ser f\xFCr den Ring des seltsamen Leiters.",warn:"Nur 3 Runden \u2013 f\xFCr lange K\xE4mpfe ist Magische Waffe besser.",gear:["Strange Conduit Ring"]},"s-hold-person":{t:"Aktion",src:"Grad 2 (Gale, Schattenherz)",r:"Fernkampf",d:"Bis zu 10 Runden",k:!0,mech:"Ein humanoides Ziel legt einen Weisheitsrettungswurf ab, sonst ist es gel\xE4hmt. Am Ende jedes seiner Z\xFCge darf es erneut w\xFCrfeln. Nahkampftreffer gegen gel\xE4hmte Ziele aus n\xE4chster N\xE4he sind automatisch kritisch.",tac:"Die Krit-Maschine: Ziel festhalten lassen, dann jeden Treffer mit dem h\xF6chsten Platz smiten \u2013 doppelte Smite-W\xFCrfel.",warn:"Bricht die Konzentration des Wirkers, ist die L\xE4hmung sofort vorbei.",gear:["Gloves of Baneful Striking"],who:["Gale","Schattenherz"]},"s-haste":{t:"Aktion",src:"Grad 3 (Gale, Zauberer 5)",r:"9 m",d:"10 Runden",k:!0,mech:"Hast: +2 RK, Vorteil auf Geschicklichkeitsrettungsw\xFCrfe, +9 m Bewegung und eine zus\xE4tzliche Aktion pro Zug.",tac:"Die zus\xE4tzliche Aktion ist ein voller Angriff mit Extra-Angriff \u2013 auf den meisten Wegen verdoppelt Hast deinen Schaden pro Zug.",warn:"Endet Hast vorzeitig, ist das Ziel einen Zug lethargisch: keine Bewegung, keine Aktionen, keine Reaktionen. Deshalb
