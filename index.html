l anklicken \xF6ffnet die Details, Name anklicken wechselt das Item. Ring 1 und Ring 2 k\xF6nnen nicht denselben Ring tragen.":"Click the icon for details, click the name to switch the item. Ring 1 and Ring 2 can't hold the same ring.","tempor\xE4re TP (Heldenmut)":"temporary HP (Heroism)","Droughnirs Upgrade-Pfade":"Droughnir's upgrade paths","Pro Slot von der Startausr\xFCstung bis zum Endgame. Karte anklicken \xF6ffnet die Details; \u201EIm Besitz\u201C ist mit der Checkliste verbunden, \u201EAnlegen\u201C r\xFCstet sofort aus.":'Per slot from starting equipment to endgame. Click a card for details; "Owned" is linked to the checklist, "Equip" equips it right away.',"Begleiter-Ausr\xFCstung":"Companion equipment","Items, die nicht Droughnir tr\xE4gt, sondern seine Unterst\xFCtzer.":"Items worn not by Droughnir but by his supporters.","Alles im Besitz.":"Everything owned.","Nur ein Elixier kann gleichzeitig aktiv sein \u2013 das aktive flie\xDFt in die Werte oben ein.":"Only one elixir can be active at a time \u2013 the active one feeds into the values above.","Aktives Elixier \u2013 entfernen":"Active elixir \u2013 remove","Als aktives Elixier setzen":"Set as active elixir","Kampfwerte, Effekte & Boni":"Combat values, effects & bonuses",Einklappen:"Collapse",Aufklappen:"Expand","\u2300 Schaden/Treffer":"\u2300 damage/hit",Anlegen:"Equip","Gesamt-RK":"Total AC","Schadensred.":"Damage red.",Zauberangriff:"Spell attack","Ausger\xFCstet \u2013 ablegen":"Equipped \u2013 unequip",Keines:"None",Heldenmut:"Heroism","Paladin-Startausr\xFCstung":"Paladin starting equipment","Paladin-Startausr\xFCstung auf der Nautiloid, zusammen mit Holzschild und zwei Wurfspeeren":"Paladin starting equipment on the Nautiloid, together with a Wooden Shield and two Javelins","Paladin-Startausr\xFCstung des Eids der Rache \u2013 jeder Eid hat seine eigene Schuppenpanzer-Variante":"Oath of Vengeance paladin starting equipment \u2013 every oath has its own scale mail variant","Kein Teil der offiziellen Paladin-Startausr\xFCstung (laut bg3.wiki: Kriegshammer, Holzschild, zwei Wurfspeere) \u2013 gew\xF6hnliche Gro\xDFschwerter gibt es fr\xFCh bei Waffenh\xE4ndlern und von Gegnern":"Not part of the official paladin starting equipment (per bg3.wiki: Warhammer, Wooden Shield, two Javelins) \u2013 common greatswords are available early from weapon traders and enemies","2W6 Hieb, zweih\xE4ndig. Grundlage f\xFCr Kampf mit gro\xDFen Waffen und GWM \u2013 Droughnirs Waffe f\xFCr den Glaskanonen-Build, bis das Gro\xDFschwert +1 da ist.":"2d6 slashing, two-handed. The basis for Great Weapon Fighting and GWM \u2013 Droughnir's weapon for the glass-cannon build until the Greatsword +1 arrives.","1W8 Wucht (vielseitig: zweih\xE4ndig 1W10). Mit dem Holzschild +2 RK \u2013 sicherer, aber ohne Kampf mit gro\xDFen Waffen und GWM. F\xFCr die Glaskanone nur die Notl\xF6sung.":"1d8 bludgeoning (versatile: two-handed 1d10). With the Wooden Shield +2 AC \u2013 safer, but without Great Weapon Fighting and GWM. Only a stopgap for the glass cannon.","Mittlere R\xFCstung: RK 14 + GES (max. 2), Nachteil auf Heimlichkeit. Mit GES 10 also RK 14 \u2013 so fr\xFCh wie m\xF6glich durch den Adamant-Schienenpanzer ersetzen.":"Medium armour: AC 14 + DEX (max. 2), disadvantage on Stealth. With DEX 10 that's AC 14 \u2013 replace it with the Adamantine Splint Armour as early as possible.","Keine Boni \u2013 nur ein Platzhalter bis zu den Stiefeln des Schreitens.":"No bonuses \u2013 just a placeholder until the Boots of Striding.",Holzschild:"Wooden Shield","Oben, was Droughnir gerade tr\xE4gt \u2013 Name anklicken zum Wechseln, Symbol f\xFCr Details. Darunter die Upgrade-Pfade vom Start bis Akt 3, die Begleiter-Ausr\xFCstung sowie Tr\xE4nke & Elixiere.":"At the top, what Droughnir is wearing right now \u2013 click a name to switch, the icon for details. Below: the upgrade paths from start to Act 3, companion equipment, and potions & elixirs.","Ihre Trickserei-Dom\xE4ne hilft dir kaum. Licht gilt in Patch-8-Guides als beste Allround-Wahl, Leben, wenn sie die einzige Heilerin ist. Sie ist kein Eidbrecher, Der Verdorrte skillt sie ganz normal um. Erstes Talent f\xFCr sie: Kampferprobter Zauberwirker (War Caster), damit Segnen h\xE4lt. Der komplette Levelbaum steht im Level-Guide.":"Her Trickery Domain barely helps you. Patch 8 guides rate Light as the best all-round choice, Life if she's the only healer. She isn't an Oathbreaker, so Withers respecs her normally. Her first feat: War Caster, so Bless holds. The full level tree is in the Level Guide.","ST\xC4 17 ohne Ethels Haar ausgleichen":"Compensate STR 17 without Ethel's Hair","Ohne Haar bleibt ST\xC4 17 (+3) \u2013 bis zu den Panzerhandschuhen in Akt 3 je \u22121 auf Treffer und Schaden, rund \u221214 % Schaden pro Zug. Ausgleich: vor harten K\xE4mpfen das Elixier der H\xFCgelriesenst\xE4rke (ST\xC4 21 = +5). Gibt es auch ohne Ethel: Derryth Bonecloak (Myconid-Kolonie), Lady Esther (Pfad zum Rosymorn-Kloster), sp\xE4ter Araj Oblodra, Talli und Mattis (Gasthaus Letztes Licht). Der Trank der ewigen Kraft bringt dich in Akt 2 auf 19 (+4).":"Without the hair STR stays 17 (+3) \u2013 until the Gauntlets in Act 3 that's \u22121 to hit and \u22121 damage each, about \u221214% damage per turn. Compensation: drink the Elixir of Hill Giant Strength (STR 21 = +5) before hard fights. You can get it without Ethel too: Derryth Bonecloak (Myconid Colony), Lady Esther (Rosymorn Monastery Trail), later Araj Oblodra, Talli and Mattis (Last Light Inn). The Potion of Everlasting Vigour brings you to 19 (+4) in Act 2.","Tantchen Ethels Haar \u2192 +1 ST\xC4 (optional)":"Auntie Ethel's Hair \u2192 +1 STR (optional)","Nicht bekommen? Kein Problem \u2013 der Plan rechnet ohne Haar, siehe \u201EST\xC4 17 ohne Ethels Haar ausgleichen\u201C. Nur im Versteck im \xFCberwucherten Tunnel \u2013 im Uferteehaus verhandelt sie nie, auch nicht unter 20 % TP. Unter 20 % TP bringen und ihren Zug abwarten. Nicht verstummen lassen, nicht bewusstlos schlagen. SG 20 T\xE4uschen oder Einsch\xFCchtern (K\xE4mpfer und Barbaren: SG 15 Einsch\xFCchtern mit Vorteil). Erfolg = Haar + Mayrina frei, Ethel geht. Misslingt eine Probe, ist die andere gesperrt \u2013 den Deal kannst du dann noch annehmen. Achtung Rache-Weg: Jeder Deal mit ihr bricht den Paladin-Eid. Details in der Anleitung.":`Didn't get it? No problem \u2013 the plan calculates without the hair, see "Compensate STR 17 without Ethel's Hair". Only in the hideout in the Overgrown Tunnel \u2013 at the Riverside Teahouse she never bargains, not even below 20% HP. Bring her below 20% HP and wait for her turn. Don't silence her, don't knock her out. DC 20 Deception or Intimidation (Fighters and Barbarians: DC 15 Intimidation with advantage). Success = hair + Mayrina freed, Ethel leaves. If one check fails, the other is locked \u2013 you can still accept the deal. Careful on the Vengeance route: any deal with her breaks the paladin oath. Details in the guide.`,"Dammon (Mulde im Smaragdhain, X 177 / Y 562)":"Dammon (Hollow in the Emerald Grove, X 177 / Y 562)","Nautiloid (Prolog): tr\xE4gt Kommandant Zhalk am Steuer \u2013 alternativ per Befehl \u201EFallenlassen\u201C abnehmen":"Nautiloid (prologue): carried by Commander Zhalk at the helm \u2013 or take it with Command: Drop","2W6 Hieb + 1W4 Feuer, ignoriert nicht-magische Hiebresistenz. Bestes fr\xFChes Gro\xDFschwert \u2013 nur im Prolog zu holen.":"2d6 slashing + 1d4 fire, ignores non-magical slashing resistance. Best early greatsword \u2013 only obtainable in the prologue.","Waukeens Rast: tr\xE4gt Gauntlet Yeva \u2013 lebt sie, sp\xE4ter im Kaulquappen-Zentrum (Akt 2)":"Waukeen's Rest: carried by Gauntlet Yeva \u2013 if she survives, later in the Tadpoling Centre (Act 2)","+1, 2W6 Hieb. Passiv: +1W4 auf Angriffe gegen Ziele, die schon Schaden genommen haben \u2013 laut Wiki f\xFCr alle Nahkampf-Waffenangriffe. Echte Alternative zum Gro\xDFschwert +1.":"+1, 2d6 slashing. Passive: +1d4 to attack rolls against targets that have already taken damage \u2013 per the wiki for all melee weapon attacks. A real alternative to the Greatsword +1.","Mordtribunal: tr\xE4gt Sarevok Anchev":"Murder Tribunal: carried by Sarevok Anchev","+2, 2W6 Hieb + 1W4 nekrotisch; jeder Schadenstreffer heilt dich um 1W6. Alternative zum Riesent\xF6ter, wenn du mehr Selbstheilung willst.":"+2, 2d6 slashing + 1d4 necrotic; every damaging hit heals you for 1d6. Alternative to the Giantslayer if you want more self-healing.","Schmiede der Neun: H\xE4ndler Dammon":"Forge of the Nine: trader Dammon","RK 20, schwer, \u22122 auf jeden erlittenen Schaden, dauerhaft Resistance (+1W4 auf Rettungsw\xFCrfe) und Blade Ward (Resistenz gegen Wucht, Stich und Hieb). Defensiv-Alternative zur H\xF6llend\xE4mmerr\xFCstung.":"AC 20, heavy, \u22122 to all damage taken, permanent Resistance (+1d4 to saving throws) and Blade Ward (resistance to bludgeoning, piercing and slashing). Defensive alternative to the Helldusk Armour.","Verfallenes Dorf: in der moosbewachsenen Truhe":"Blighted Village: in the Moss-Covered Chest","Zu Kampfbeginn 3 Z\xFCge Schwung: +1,5 m Bewegung pro verbleibendem Zug \u2013 schneller am Gegner. Fr\xFCher Helm, bis der Helm des Niederstreckens da ist.":"At the start of combat 3 turns of Momentum: +1.5 m movement per remaining turn \u2013 reach enemies faster. Early helmet until the Helmet of Smiting.","+2 auf Angriff und Schaden mit Waffen, ST\xC4-Rettung +1. Damage-Alternative zu den Panzerhandschuhen, sobald deine ST\xC4 anders hoch ist.":"+2 to attack and damage with weapons, STR saves +1. Damage alternative to the Gauntlets once your STR is high from another source.","Grymschmiede: tr\xE4gt Nere":"Grymforge: worn by Nere","Immun gegen Netz, Verstrickt und Ausrutschen; Misty Step als Bonusaktion, einmal pro kurzer Rast \u2013 bringt dich sofort an den Gegner.":"Immune to webs, Entangled and slipping; Misty Step as a bonus action once per short rest \u2013 gets you to the enemy instantly.","Ebonsee-Grotte: tr\xE4gt Thulla":"Ebonlake Grotto: worn by Thulla","Bonusaktion \u201EClick Heels\u201C: mehr Tempo und Bewegungsfreiheit. Laut Wiki-Bug trifft der Nachteil deine eigenen Reaktionsangriffe statt die der Gegner.":`Bonus action "Click Heels": more speed and freedom of movement. Per a wiki-noted bug the disadvantage hits your own reaction attacks instead of the enemies'.`,"Wyrmfels-Festung: verschlossene Goldtruhe im obersten Stock":"Wyrm's Rock Fortress: locked gilded chest on the top floor","Ignoriert schwieriges Gel\xE4nde, kann nicht verschoben werden; fehlgeschlagenen Rettungswurf per Reaktion schaffen (laut Wiki einmal pro Rast); Teleport mit 2W8 Feuer als Bonusaktion.":"Ignores difficult terrain, can't be moved by force; turn a failed saving throw into a success with a reaction (per the wiki once per rest); bonus-action teleport with 2d8 fire.","Wyrms\xFCbergang: H\xE4ndler Entharl Danthelon (Danthelons Tanzende Axt)":"Wyrm's Crossing: trader Entharl Danthelon (Danthelon's Dancing Axe)","Zu Beginn deines Zugs haben Gegner Nachteil auf Angriffe gegen dich, bis du Schaden nimmst.":"At the start of your turn enemies have disadvantage on attacks against you until you take damage.","Entweihter Tempel (Gemach von Gut) oder bei Omeluum in der Ebonsee-Grotte \u2013 nur einmal erh\xE4ltlich":"Defiled Temple (Gut's chambers) or from Omeluum in the Ebonlake Grotto \u2013 obtainable only once","Misty Step als Bonusaktion, einmal pro kurzer Rast. Fr\xFChes Amulett f\xFCr schnelles Ranlaufen.":"Misty Step as a bonus action once per short rest. Early amulet for closing the distance.","Pfad zum Rosymorn-Kloster: H\xE4ndlerin Lady Esther":"Rosymorn Monastery Trail: trader Lady Esther","Wirst du niedergeschlagen, stabilisierst du dich automatisch; jede Heilung auf dich heilt den Maximalwert \u2013 stark mit Schattenherz' Heilendem Wort.":"If you're downed you stabilise automatically; every heal on you heals the maximum \u2013 strong with Shadowheart's Healing Word.","Smaragdhain: Belohnung von Mol f\xFCr \u201EStehlt das heilige G\xF6tzenbild\u201C":'Emerald Grove: reward from Mol for "Steal the Sacred Idol"',"+1 RK und +1 auf alle Rettungsw\xFCrfe \u2013 die defensive Ring-Alternative.":"+1 AC and +1 to all saving throws \u2013 the defensive ring alternative.","Mondaufgangst\xFCrme: H\xE4ndlerin Araj Oblodra (verpasst? Sp\xE4ter im Purpurtrunk, Unterstadt)":"Moonrise Towers: trader Araj Oblodra (missed it? Later at the Crimson Draughts, Lower City)","Vorteil auf alle Angriffsw\xFCrfe, Nachteil auf alle Rettungsw\xFCrfe. F\xFCr die Glaskanone fast doppelte Krit-Chance \u2013 aber gef\xE4hrlich gegen Kontrollzauber.":"Advantage on all attack rolls, disadvantage on all saving throws. Nearly doubles crit chance for the glass cannon \u2013 but dangerous against control spells.","Shar-Pr\xFCfung: Selbstgleiche Pr\xFCfung, neben dem Kohlebecken":"Gauntlet of Shar: Self-Same Trial, next to the brazier","Nach einem Kill ist dein n\xE4chster Waffenangriff ein garantierter Krit (einmal pro langer Rast) \u2013 perfekt f\xFCr einen Krit-Smite.":"After a kill your next weapon attack is a guaranteed crit (once per long rest) \u2013 perfect for a crit smite.","Ohne Ethels Haar: ST\xC4 19 (mit Trank der ewigen Kraft) \u2192 20. Tr\xE4gst du schon die Panzerhandschuhe (ST\xC4 23), nimm lieber CHA +2.":"Without Ethel's Hair: STR 19 (with Potion of Everlasting Vigour) \u2192 20. If you already wear the Gauntlets (STR 23), take CHA +2 instead.","Auf Dom\xE4ne des Lichts umskillen (Leben, wenn sie die einzige Heilerin ist); erstes Talent Kampferprobter Zauberwirker":"Respec to Light Domain (Life if she's the only healer); first feat War Caster","Hast lieber Gale \xFCberlassen; Schattenherz mit Kampferprobter Zauberwirker":"Better leave Haste to Gale; Shadowheart with War Caster","ST\xC4 21 bis zur langen Rast. Nur ein Elixier gleichzeitig. Ethel verkauft 3 St\xFCck pro langer Rast; ohne sie bei Derryth Bonecloak, Lady Esther, Araj Oblodra, Talli und Mattis, oder per Alchemie aus H\xFCgelriesen-Fingern.":"STR 21 until long rest. Only one elixir at a time. Ethel sells 3 per long rest; without her from Derryth Bonecloak, Lady Esther, Araj Oblodra, Talli and Mattis, or via alchemy from Hill Giant fingers.","Kampferprobter Zauberwirker oder Belastbar (KON) f\xFCr die Konzentration":"War Caster or Resilient (CON) for concentration","+1 \xB7 +1W4 Treffer gegen Verletzte":"+1 \xB7 +1d4 to hit against wounded targets","RK 20 \xB7 \u22122 Schaden \xB7 Resistenzen":"AC 20 \xB7 \u22122 damage \xB7 resistances","Mehr Bewegung zu Kampfbeginn":"More movement at the start of combat","+2 Treffer & Schaden mit Waffen":"+2 to hit & damage with weapons","Nachteil f\xFCr Angreifer":"Disadvantage for attackers","Misty Step pro kurzer Rast":"Misty Step per short rest","Vorteil auf Angriffe \xB7 Nachteil auf Rettung":"Advantage on attacks \xB7 disadvantage on saves","Kill \u2192 n\xE4chster Angriff ist Krit":"Kill \u2192 next attack is a crit","Gerade kein Unterschied \u2013 ST\xC4 wird fest gesetzt durch:":"No difference right now \u2013 STR is set by:","mit Haar":"with hair","Unterschied pro Zug:":"Difference per turn:","Ausgleich: Elixier der H\xFCgelriesenst\xE4rke oben im Loadout aktivieren.":"Compensation: activate the Elixir of Hill Giant Strength in the loadout above.","Dom\xE4ne des Lichts \xB7 Warding Flare":"Light Domain \xB7 Warding Flare","Bei Der Verdorrte (Withers) im Lager umskillen und die Attribute wie rechts verteilen. Zaubertricks: Guidance, Sacred Flame und Toll the Dead \u2013 Light gibt es gratis \xFCber die Dom\xE4ne. Warding Flare ist ihre Reaktion: Ein Angreifer, der sie angreift, bekommt Nachteil.":"Respec her with Withers at camp and distribute the abilities as shown on the right. Cantrips: Guidance, Sacred Flame and Toll the Dead \u2013 Light comes free with the domain. Warding Flare is her reaction: an attacker targeting her gets disadvantage.","Radiance of the Dawn macht glei\xDFenden Fl\xE4chenschaden nur an Gegnern \u2013 sicher direkt neben Droughnir. Turn Undead lieber nicht in der N\xE4he deines kontrollierten Untoten einsetzen.":"Radiance of the Dawn deals radiant area damage to enemies only \u2013 safe right next to Droughnir. Better not use Turn Undead near your controlled undead.","Grad-2-Zauber \xB7 Dom\xE4ne: Flaming Sphere, Scorching Ray":"Level 2 spells \xB7 Domain: Flaming Sphere, Scorching Ray","Beistand (Aid) vor harten K\xE4mpfen auf Droughnir und die Gruppe \u2013 mehr maximale TP f\xFCr die Glaskanone. Sch\xFCtzendes Band (Warding Bond) gibt ihm +1 RK, +1 Rettungsw\xFCrfe und Resistenz gegen allen Schaden; Schattenherz tr\xE4gt daf\xFCr denselben Schaden mit.":"Aid before hard fights on Droughnir and the party \u2013 more maximum HP for the glass cannon. Warding Bond gives him +1 AC, +1 saving throws and resistance to all damage; Shadowheart takes the same damage in return.","Vorteil auf Konzentrationsw\xFCrfe \u2013 Segnen auf Droughnir bricht viel seltener ab. Dazu ein vierter Zaubertrick: Thaumaturgy f\xFCr Einsch\xFCchtern-Proben im Dialog.":"Advantage on concentration saves \u2013 Bless on Droughnir breaks far less often. Plus a fourth cantrip: Thaumaturgy for Intimidation checks in dialogue.","Grad-3-Zauber \xB7 Dom\xE4ne: Daylight, Fireball \xB7 Destroy Undead":"Level 3 spells \xB7 Domain: Daylight, Fireball \xB7 Destroy Undead","Wiederbeleben (Revivify) ist Pflicht \u2013 f\xE4llt die Glaskanone, holt sie dich sofort zur\xFCck. Schutzgeister (Spirit Guardians) als Konzentration, wenn Segnen gerade nicht n\xF6tig ist; Massen-Heilendes-Wort als Notfall-Heilung. Destroy Undead wie Turn Undead nicht neben deinem Untoten.":"Revivify is a must \u2013 if the glass cannon falls, she brings you right back. Spirit Guardians as concentration when Bless isn't needed; Mass Healing Word as emergency healing. Like Turn Undead, don't use Destroy Undead next to your undead.","Ab jetzt sch\xFCtzt ihr Aufflackern auch Verb\xFCndete: Greift jemand Droughnir an, gibt sie dem Angreifer per Reaktion Nachteil \u2013 Gold wert f\xFCr einen Paladin mit wenig RK.":"From now on her flare protects allies too: if someone attacks Droughnir, she gives the attacker disadvantage as a reaction \u2013 gold for a paladin with low AC.","Grad-4-Zauber \xB7 Dom\xE4ne: Guardian of Faith, Wall of Fire":"Level 4 spells \xB7 Domain: Guardian of Faith, Wall of Fire","Todesschutz (Death Ward) vor Bossk\xE4mpfen auf Droughnir: F\xE4llt er auf 0 TP, bleibt er stattdessen einmal mit 1 TP stehen. Bewegungsfreiheit gegen Festhalten und Verlangsamen.":"Death Ward on Droughnir before boss fights: if he drops to 0 HP, he stays up with 1 HP once instead. Freedom of Movement against restraints and slows.","Talent: Attributserh\xF6hung WEI +1, KON +1 \xB7 Potent Spellcasting":"Feat: Ability Improvement WIS +1, CON +1 \xB7 Potent Spellcasting","WEI 18 bringt +1 auf Zauber-SG und Zauberangriff. Potent Spellcasting addiert ihren WEI-Modifikator auf den Schaden ihrer Kleriker-Zaubertricks.":"WIS 18 gives +1 to spell DC and spell attack. Potent Spellcasting adds her WIS modifier to the damage of her cleric cantrips.","Grad-5-Zauber \xB7 Dom\xE4ne: Destructive Wave, Flame Strike":"Level 5 spells \xB7 Domain: Destructive Wave, Flame Strike","Greater Restoration gegen schwere Zust\xE4nde, Mass Cure Wounds f\xFCr die ganze Gruppe. Destructive Wave als starker Fl\xE4chenschaden.":"Greater Restoration against severe conditions, Mass Cure Wounds for the whole party. Destructive Wave as strong area damage.","G\xF6ttliches Eingreifen f\xFCr den Notfall. Neuer Zaubertrick nach Wahl, z. B. Blade Ward.":"Divine Intervention for emergencies. A new cantrip of your choice, e.g. Blade Ward.","Heldenmahl (Heroes' Feast) vor Bossk\xE4mpfen: mehr maximale TP und Schutz f\xFCr die ganze Gruppe \u2013 ideal f\xFCr eine Glaskanone. Heilung (Heal) als gro\xDFe Einzelheilung.":"Heroes' Feast before boss fights: more maximum HP and protection for the whole party \u2013 ideal for a glass cannon. Heal as a big single-target heal.","Talent: Attributserh\xF6hung WEI +2":"Feat: Ability Improvement WIS +2","WEI 20 \u2013 maximaler Zauber-SG und Zauberangriff.":"WIS 20 \u2013 maximum spell DC and spell attack.","Klerikerin der":"Cleric of the","Dom\xE4ne des Lichts":"Light Domain","Unterst\xFCtzerin f\xFCr Droughnir: Segnen halten, heilen, wiederbeleben.":"Support for Droughnir: keep Bless up, heal, revive.","Abhaken z\xE4hlt nur f\xFCr Schattenherz und \xE4ndert Droughnirs Stufe nicht.":"Ticking only counts for Shadowheart and doesn't change Droughnir's level.","Licht-Dom\xE4ne \xB7 Halbelfin \xB7 Akolythin":"Light Domain \xB7 Half-Elf \xB7 Acolyte","Punktekauf: WEI 15 und KON 15, GES 14, CHA 10, Rest 8; Volksbonus +2 WEI und +1 KON. Ihre Standardwerte (WEI 17, KON 14) funktionieren auch, wenn du nur die Dom\xE4ne wechseln willst.":"Point buy: WIS 15 and CON 15, DEX 14, CHA 10, rest 8; racial bonus +2 WIS and +1 CON. Her default scores (WIS 17, CON 14) also work if you only want to switch the domain.","Segnen auf Droughnir (und zwei weitere) \u2013 Konzentration halten.":"Bless on Droughnir (and two others) \u2013 hold concentration.","Heilendes Wort als Bonusaktion, sobald Droughnir unter die H\xE4lfte f\xE4llt.":"Healing Word as a bonus action as soon as Droughnir drops below half.","Ab Stufe 5 Wiederbeleben bereithalten, ab Stufe 7 Todesschutz vor Bossen.":"From level 5 keep Revivify ready, from level 7 Death Ward before bosses.","Danach Schaden mit Sacred Flame oder Toll the Dead.":"Then deal damage with Sacred Flame or Toll the Dead.","Ausr\xFCstung f\xFCr sie":"Equipment for her","Das fl\xFCsternde Versprechen: Heilt sie jemanden, wird das Ziel gesegnet \u2013 ohne Konzentration. Damit hat Droughnir oft doppelt Segen. Alles Weitere im Tab \u201EAusr\xFCstung\u201C unter Begleiter-Ausr\xFCstung.":"The Whispering Promise: when she heals someone, the target is blessed \u2013 without concentration. That often gives Droughnir double Bless. Everything else is in the Equipment tab under Companion equipment.","Bleibt sie in der Trickserei-Dom\xE4ne, gelten Talente und Kleriker-Zauber genauso \u2013 nur die Licht-F\xE4higkeiten und Dom\xE4nen-Zauber fallen weg.":"If she stays Trickery Domain, feats and cleric spells apply the same \u2013 only the Light features and domain spells drop out.","Levelbaum f\xFCr":"Level tree for","Ohne Ethels Haar bleibt ST\xC4 17 (+3): bis Akt 3 je \u22121 auf Treffer und Schaden, rund \u221214 % Schaden pro Zug.":"Without Ethel's Hair STR stays 17 (+3): until Act 3 \u22121 to hit and \u22121 damage each, about \u221214% damage per turn.","Elixier der H\xFCgelriesenst\xE4rke (ST\xC4 21) vor harten K\xE4mpfen \u2013 auch bei Derryth, Lady Esther, Araj, Talli und Mattis; Trank der ewigen Kraft (+2 ST\xC4 \u2192 19) \xFCber Araj Oblodra.":"Elixir of Hill Giant Strength (STR 21) before hard fights \u2013 also from Derryth, Lady Esther, Araj, Talli and Mattis; Potion of Everlasting Vigour (+2 STR \u2192 19) from Araj Oblodra.","Ohne Ethels Haar bleibt ST\xC4 17 (+3): bis Akt 3 je \u22121 auf Treffer und Schaden, rund \u221214 % Schaden pro Zug. Elixier der H\xFCgelriesenst\xE4rke vor harten K\xE4mpfen gleicht das aus.":"Without Ethel's Hair STR stays 17 (+3): until Act 3 \u22121 to hit and \u22121 damage each, about \u221214% damage per turn. The Elixir of Hill Giant Strength before hard fights makes up for it.","ST\xC4 bleibt 17 (+3), mit dem Trank der ewigen Kraft 19 (+4) \u2013 jeweils ein Punkt unter dem n\xE4chsten Modifikator. Bis zu den Panzerhandschuhen (Akt 3, ST\xC4 23) hei\xDFt das je \u22121 auf Treffer und Schaden, rund \u221214 % Schaden pro Zug. Ausgleich: Elixier der H\xFCgelriesenst\xE4rke (ST\xC4 21) vor Bossk\xE4mpfen. Die CHA-Wege (Hexklinge, Sorcadin) trifft es kaum, weil dort CHA angreift.":"STR stays 17 (+3), 19 (+4) with the Potion of Everlasting Vigour \u2013 one point short of the next modifier each time. Until the Gauntlets (Act 3, STR 23) that means \u22121 to hit and \u22121 damage each, about \u221214% damage per turn. Compensation: Elixir of Hill Giant Strength (STR 21) before boss fights. The CHA routes (Hexblade, Sorcadin) are barely affected because CHA drives their attacks.","Kampferprobter Zauberwirker (War Caster), damit Segnen h\xE4lt.":"War Caster, so Bless holds.","Ohne Ethels Haar":"Without Ethel's Hair",Levelbaum:"Level tree","Kampferprobter Zauberwirker":"War Caster","Talent: Kampferprobter Zauberwirker (War Caster)":"Feat: War Caster","Im Kampf, in dieser Reihenfolge":"In combat, in this order","Attribute beim Umskillen":"Abilities when respeccing","Divine Intervention \xB7 5. Zaubertrick":"Divine Intervention \xB7 5th cantrip","Grad-6-Zauber":"Level 6 spells","Story-Item":"Story item",Prolog:"Prologue","2W6 Hieb + 1W4 Feuer":"2d6 slashing + 1d4 fire","+2 \xB7 +1W4 nekrotisch \xB7 heilt 1W6":"+2 \xB7 +1d4 necrotic \xB7 heals 1d6","Feuer (Waffe)":"Fire (weapon)","Nekrotisch (Waffe)":"Necrotic (weapon)","Click Heels: mehr Tempo":"Click Heels: more speed","Rettungswurf erzwingen \xB7 Teleport":"Force a save success \xB7 teleport","Misty Step \xB7 immun gegen Netz":"Misty Step \xB7 immune to webs","Maximale Heilung \xB7 Auto-Stabilisierung":"Maximum healing \xB7 auto-stabilise","H\xFCgelriesen-Elixier kaufen":"Buying Hill Giant elixirs","H\xFCgelriesen-Elixier finden":"Finding Hill Giant elixirs","H\xFCgelriesen-Elixier brauen":"Brewing Hill Giant elixirs","Trank der ewigen Kraft (Araj)":"Potion of Everlasting Vigour (Araj)","So bekommst du es":"How to get it","Grundregel: H\xE4ndler f\xFCllen ihr Sortiment nach jeder langen Rast oder jedem Stufenaufstieg neu auf. Steht kein Elixier im Laden, rasten und noch einmal nachsehen.":"Basic rule: traders restock after every long rest or level-up. If there's no elixir in stock, rest and check again.","Akt 1 \u2013 Tantchen Ethel (Zelt im Smaragdhain, sp\xE4ter Uferteehaus): 3 St\xFCck pro Rast, solange ihr Laden offen ist. Zeigt sie ihre Vettel-Gestalt, flieht oder stirbt, ist er f\xFCr immer zu.":"Act 1 \u2013 Auntie Ethel (tent in the Emerald Grove, later Riverside Teahouse): 3 per rest while her shop is open. Once she reveals her hag form, flees or dies, it's closed for good.","Akt 1 \u2013 Derryth Bonecloak: Unterreich, Ebonsee-Grotte, nahe dem westlichen Eingang der Myconid-Kolonie. Hat das Elixier nur gelegentlich, bis zu 2 pro Rast. Sie verkauft auch H\xFCgelriesen-Finger zum Selberbrauen.":"Act 1 \u2013 Derryth Bonecloak: Underdark, Ebonlake Grotto, near the western entrance of the Myconid Colony. Only stocks the elixir occasionally, up to 2 per rest. She also sells Hill Giant Fingers for brewing your own.","Akt 1 \u2013 Lady Esther: Pfad zum Rosymorn-Kloster (\xFCber den Gebirgspass).":"Act 1 \u2013 Lady Esther: Rosymorn Monastery Trail (via the Mountain Pass).","Akt 2 \u2013 Araj Oblodra in den Mondaufgangst\xFCrmen (bei ihrer Alchemie-Ausr\xFCstung) sowie Quartiermeisterin Talli und Mattis im Gasthaus Letztes Licht. F\xE4llt das Gasthaus, stirbt Talli \u2013 fr\xFCh einkaufen.":"Act 2 \u2013 Araj Oblodra in Moonrise Towers (at her alchemy equipment) as well as Quartermaster Talli and Mattis at the Last Light Inn. If the inn falls, Talli dies \u2013 shop early.","Akt 3 \u2013 Entharl Danthelon (Danthelons Tanzende Axt, Wyrms\xFCbergang) und Oliver Tefoco (Beehive General Goods, Unterstadt). Ab den Panzerhandschuhen (ST\xC4 23) brauchst du es aber nicht mehr.":"Act 3 \u2013 Entharl Danthelon (Danthelon's Dancing Axe, Wyrm's Crossing) and Oliver Tefoco (Beehive General Goods, Lower City). Once you have the Gauntlets (STR 23) you won't need it anymore.","Vorrat anlegen: lieber 3\u20134 St\xFCck auf einmal kaufen. Trinken ist eine Bonusaktion und h\xE4lt bis zur langen Rast \u2013 also vor dem Bosskampf trinken, nicht mittendrin.":"Stock up: better buy 3\u20134 at once. Drinking is a bonus action and lasts until long rest \u2013 so drink before the boss fight, not in the middle of it.","In der App: im Tab \u201EAusr\xFCstung\u201C unter Aktives Elixier \u201EH\xFCgelriese\u201C w\xE4hlen \u2013 dann rechnet sie mit ST\xC4 21.":'In the app: pick "Hill Giant" under Active elixir in the Equipment tab \u2013 it then calculates with STR 21.',"Feste Fundorte gibt es laut bg3.wiki nur zwei \u2013 das meiste bekommst du \xFCber H\xE4ndler oder Alchemie.":"Per bg3.wiki there are only two fixed locations \u2013 you'll get most from traders or alchemy.","Akt 1 \u2013 Smaragdhain: ein Elixier liegt in Tantchen Ethels Laden als Ware aus. Zeigt das Hand-Symbol beim Anvisieren rot, ist Mitnehmen Diebstahl \u2013 nur unbeobachtet nehmen oder einfach kaufen.":"Act 1 \u2013 Emerald Grove: one elixir is on display in Auntie Ethel's shop. If the hand icon turns red when you hover it, taking it is theft \u2013 only take it unseen or just buy it.","Akt 3 \u2013 Wyrms\xFCbergang: zweiter Stock des S\xFCdspann-Kontrollpunkts (X \u221213 / Y 55).":"Act 3 \u2013 Wyrm's Crossing: second floor of the South Span Checkpoint (X \u221213 / Y 55).","Werfen statt trinken? Lieber nicht: Geworfen hebt es die ST\xC4 aller Figuren im Radius von 1 m nur f\xFCr 10 Z\xFCge. Getrunken h\xE4lt es bis zur langen Rast.":"Throw instead of drink? Better not: thrown, it raises the STR of everyone within 1 m for only 10 turns. Drunk, it lasts until long rest.","Gefundene Elixiere sparen und f\xFCr Bosse nutzen \u2013 im Alltag reicht deine ST\xC4 17.":"Save found elixirs for bosses \u2013 your STR 17 is fine for everyday fights.","Zutat kaufen: H\xFCgelriesen-Finger (Hill Giant Finger) bei Derryth Bonecloak an der Myconid-Kolonie im Unterreich \u2013 laut Wiki auch bei weiteren H\xE4ndlern im Spiel. Du brauchst 3 Finger pro Elixier.":"Buy the ingredient: Hill Giant Fingers from Derryth Bonecloak at the Myconid Colony in the Underdark \u2013 per the wiki also from other traders in the game. You need 3 fingers per elixir.","Generische Zutat besorgen: eine beliebige Suspension. Sie entsteht beim Extrahieren bestimmter Pflanzen, z. B. Suspension of Mergrass aus Mergrass. Einfach unterwegs Zutaten aufsammeln \u2013 sie landen automatisch im Alchemiebeutel.":"Get the generic ingredient: any Suspension. It comes from extracting certain plants, e.g. Suspension of Mergrass from Mergrass. Just pick up ingredients along the way \u2013 they go straight into the alchemy pouch.","Alchemie \xF6ffnen: Taste H, nur au\xDFerhalb des Kampfes.":"Open alchemy: H key, only outside combat.","3 H\xFCgelriesen-Finger zu Salts of Hill Giant Fingernails extrahieren. Laut Wiki schaltet genau das auch das Rezept frei.":"Extract 3 Hill Giant Fingers into Salts of Hill Giant Fingernails. Per the wiki, this is also what unlocks the recipe.","Restliche Zutaten mit \u201EAlle Zutaten extrahieren\u201C umwandeln \u2013 jede Zutat wird zu genau einem Extrakt, nichts geht verloren, und neue Rezepte werden freigeschaltet.":'Convert the remaining ingredients with "Extract All Ingredients" \u2013 each ingredient becomes exactly one extract, nothing is wasted, and new recipes unlock.',"Brauen: Salts of Hill Giant Fingernails plus eine beliebige Suspension ergibt das Elixier der H\xFCgelriesenst\xE4rke.":"Brew: Salts of Hill Giant Fingernails plus any Suspension makes the Elixir of Hill Giant Strength.","Achtung bei der Suspension: Nimm eine, die du nicht als spezielle Zutat f\xFCr ein anderes Rezept brauchst \u2013 zum Beispiel nicht die, aus der du Heiltr\xE4nke machst.":"Careful with the Suspension: use one you don't need as a specific ingredient for another recipe \u2013 e.g. not the one you make healing potions from.","Gute Zutaten-Fundorte laut Wiki: Apotheke und Keller im Verfallenen Dorf (Akt 1), Waning Moon (Akt 2), Bonecloaks Apotheke (Akt 3).":"Good ingredient spots per the wiki: the Apothecary and its cellar in the Blighted Village (Act 1), the Waning Moon (Act 2), Bonecloak's Apothecary (Act 3).","Akt 2, Mondaufgangst\xFCrme: Araj Oblodra steht bei ihrer Alchemie-Ausr\xFCstung. Astarion muss in der Gruppe sein \u2013 ist er im Lager, bittet sie dich, ihn das n\xE4chste Mal mitzubringen.":"Act 2, Moonrise Towers: Araj Oblodra stands at her alchemy equipment. Astarion must be in the party \u2013 if he's at camp, she asks you to bring him next time.","Sie bittet Astarion, sie zu bei\xDFen, damit sie Vampirbisse erforschen kann. Daf\xFCr bietet sie den Trank der ewigen Kraft an.":"She asks Astarion to bite her so she can study vampire bites. In exchange she offers the Potion of Everlasting Vigour.","Astarion z\xF6gert und warnt, mit ihrem Blut stimme etwas nicht. Er bei\xDFt, wenn seine Zustimmung hoch genug ist und er die Wahl bekommt \u2013 oder wenn du es ihm befiehlst.":"Astarion hesitates and warns that something is wrong with her blood. He bites if his approval is high enough and he's given the choice \u2013 or if you order him to.","Folge: \u22123 Zustimmung bei Astarion und eine Lagerszene, die eine Romanze mit ihm betrifft. Sonst keine Konsequenzen.":"Consequence: \u22123 approval from Astarion and a camp scene that affects a romance with him. No other consequences.","Trank trinken (Bonusaktion): +2 ST\xC4 dauerhaft \u2013 auch \xFCber 20, \xFCbersteht Tod und Umskillen. Bei Droughnir also ST\xC4 17 \u2192 19 (+4).":"Drink the potion (bonus action): +2 STR permanently \u2013 even above 20, survives death and respecs. For Droughnir that's STR 17 \u2192 19 (+4).","Er wirkt nicht, solange etwas die ST\xC4 fest setzt (Elixier, Panzerhandschuhe) \u2013 lohnt sich trotzdem f\xFCr alle K\xE4mpfe ohne Elixier.":"It has no effect while something sets STR to a fixed value (elixir, Gauntlets) \u2013 still worth it for every fight without an elixir.","In der App: Checklistenpunkt \u201ETrank der ewigen Kraft\u201C abhaken \u2013 die Werte rechnen sofort mit ST\xC4 19.":'In the app: tick the "Potion of Everlasting Vigour" checklist item \u2013 the values update to STR 19 right away.',"H\xE4ndler mit gestuftem Magie-R\xFCstungs-Sortiment bei Spielerstufe 4\u20136 \u2013 bei dir: Roah Moonglow (Zhentarim-Lager im Zerschmetterten Heiligtum)":"Traders with the levelled magic armour stock at player level 4\u20136 \u2013 for you: Roah Moonglow (Zhentarim storeroom in the Shattered Sanctum)","+1, mittlere R\xFCstung: RK 15 + GES (max. 2), Superior Material: \u22121 Hiebschaden, Nachteil auf Heimlichkeit. Mit GES 10 also RK 15 \u2013 einer mehr als der Schuppenpanzer der Rache. Deine R\xFCstung, bis der Adamant-Schienenpanzer (RK 18) aus der Grymschmiede da ist.":"+1, medium armour: AC 15 + DEX (max. 2), Superior Material: \u22121 slashing damage, disadvantage on Stealth. With DEX 10 that's AC 15 \u2013 one more than the Scale Mail of Vengeance. Your armour until the Adamantine Splint Armour (AC 18) from Grymforge.","RK 15 + GES (max. 2) \xB7 \u22121 Hiebschaden":"AC 15 + DEX (max. 2) \xB7 \u22121 slashing damage","Sel\xFBnitischer Au\xDFenposten (X 176 / Y \u2212247): verschlossene, mit einer Falle gesicherte Prunktruhe hinter einer Geheimt\xFCr \u2013 per Wahrnehmungswurf finden oder vom Raum mit dem Wegpunkt hin\xFCberspringen":"Sel\xFBnite Outpost (X 176 / Y \u2212247): locked, trapped opulent chest behind a hidden door \u2013 find it with a Perception check or jump over from the room with the waypoint","+1, mittlere R\xFCstung: RK 15 + GES (max. 2). Radiating Shockwave: Jeder glei\xDFende Schaden, den du machst \u2013 auch G\xF6ttliches Niederstrecken, G\xF6ttliche Gunst oder der Ring des kaltherzigen Leuchtens \u2013 belegt Nicht-Verb\xFCndete im Umkreis von 3 m mit Radiating Orb (\u22121 auf Angriffe je verbleibendem Zug, sie leuchten hell). Verb\xFCndete bleiben verschont. Gleiche RK wie der Schuppenpanzer +1, aber mit Effekt \u2013 \xDCbergangsr\xFCstung bis zum Adamant-Schienenpanzer.":"+1, medium armour: AC 15 + DEX (max. 2). Radiating Shockwave: any radiant damage you deal \u2013 including Divine Smite, Divine Favour or the Callous Glow Ring \u2013 inflicts Radiating Orb on non-allies within 3 m (\u22121 to attack rolls per remaining turn, they shed bright light). Allies are unaffected. Same AC as the Scale Mail +1, but with an effect \u2013 transition armour until the Adamantine Splint Armour.","RK 15 + GES (max. 2) \xB7 Glei\xDFend \u2192 Radiating Orb":"AC 15 + DEX (max. 2) \xB7 Radiant \u2192 Radiating Orb","Glei\xDFender Schaden \u2192 Radiating Orb (3 m)":"Radiant damage \u2192 Radiating Orb (3 m)","Goblinlager: Crusher tr\xE4gt ihn am Zeh (\xF6stlicher Hof beim Alten Runenkreis)":"Goblin Camp: Crusher wears it on his toe (eastern courtyard by the Ancient Rune Circle)","+3 m Bewegung, stapelt mit Longstrider. Mehr Reichweite pro Zug hei\xDFt \xF6fter an den Gegner kommen, ohne Sprint \u2013 ideal f\xFCr die Glaskanone.":"+3 m movement, stacks with Longstrider. More reach per turn means reaching the enemy more often without dashing \u2013 ideal for the glass cannon.","Fl\xFCsternde Tiefen unter dem Verfallenen Dorf: Skelett mit Rucksack (X \u2212495 / Y \u2212365)":"Whispering Depths under the Blighted Village: skeleton with a backpack (X \u2212495 / Y \u2212365)","Startest du im Kampf einen Zug mit h\xF6chstens 50 % TP, bekommst du Schwung (+1,5 m Bewegung pro verbleibendem Zug) \u2013 zum R\xFCckzug oder Nachsetzen.":"If you start a turn in combat at 50% HP or less, you gain Momentum (+1.5 m movement per remaining turn) \u2013 for retreating or pressing on.","Grymschmiede: Belohnung von Sergeant Elenna Thrinn f\xFCr \u201EFinde die verlorenen Stiefel\u201C":'Grymforge: reward from Sergeant Elenna Thrinn for "Find the Missing Boots"',"+1 RK bis zu deinem n\xE4chsten Zug, nachdem du einen Gegner st\xF6\xDFt (einmal pro Zug, jeder Sto\xDF z\xE4hlt). Mit ST\xC4 17 st\xF6\xDFt Droughnir gut \u2013 Gegner in Lava oder Abgr\xFCnde.":"+1 AC until your next turn after you shove an enemy (once per turn, any push counts). With STR 17 Droughnir shoves well \u2013 enemies into lava or chasms.","Zerschmettertes Heiligtum: Skelett im offenen Sarkophag direkt vor den Worg-Gehegen (X 338 / Y 14)":"Shattered Sanctum: skeleton in the opened sarcophagus right before the Worg Pens (X 338 / Y 14)","Resistenz gegen Giftschaden \u2013 halbiert Gift von Spinnen und Fallen. Situativ, aber kostenlos mitzunehmen.":"Resistance to poison damage \u2013 halves poison from spiders and traps. Situational, but free to grab.","Ebonsee-Grotte: Omeluum nach der Quest \u201EHilf Omeluum, den Parasiten zu untersuchen\u201C (X 144 / Y 29)":'Ebonlake Grotto: Omeluum after the quest "Help Omeluum Investigate the Parasite" (X 144 / Y 29)',"Vorteil auf Rettungsw\xFCrfe gegen Bezauberung \u2013 in Akt 1 vor allem gegen den Lockgesang der Harpyien. Eine bezauberte Glaskanone schl\xE4gt sonst die eigene Gruppe.":"Advantage on saving throws against being charmed \u2013 in Act 1 mainly against the harpies' Luring Song. Otherwise a charmed glass cannon hits its own party.","+3 m Bewegung":"+3 m movement","Schwung unter 50 % TP":"Momentum below 50% HP","+1 RK nach Sto\xDFen":"+1 AC after shoving","Resistenz gegen Gift":"Poison resistance","Vorteil gegen Bezauberung":"Advantage against charm","Halbling-H\xE4ndlerin der Zhentarim. Akt 1: im Lagerraum westlich der Haupthalle des Zerschmetterten Heiligtums (X 275 / Y \u221229). Akt 2: Eingangshalle der Mondaufgangst\xFCrme (X \u2212174 / Y \u2212176). Akt 3: Zisterne in der Kanalisation der Unterstadt, nach dem Gildenhaus-Putsch im B\xFCro des Gildenmeisters. Ihr Sortiment wird teils zuf\xE4llig gew\xFCrfelt \u2013 bei dir war der Schuppenpanzer +1 dabei. Stirbt sie vor Akt 3, ersetzt sie Friol.":"Halfling trader of the Zhentarim. Act 1: in the storeroom west of the main hall of the Shattered Sanctum (X 275 / Y \u221229). Act 2: entry hall of Moonrise Towers (X \u2212174 / Y \u2212176). Act 3: cistern in the Lower City sewers, after the Guildhall coup in the Guild Master's office. Her stock is partly randomised \u2013 yours had the Scale Mail +1. If she dies before Act 3, Friol replaces her.","Cambion-Kommandant am Steuer der Nautiloid im Prolog. K\xE4mpft dort gegen einen Gedankenschinder; der Kampf startet, sobald jemand das Steuer betritt. Ihn zu t\xF6ten ist nicht n\xF6tig, bringt aber die Everburn Blade und Extra-EP \u2013 alternativ per Befehl: Fallenlassen entwaffnen. Nach 15 Z\xFCgen kommen Cambion-Verst\xE4rkungen.":"Cambion commander at the helm of the Nautiloid in the prologue. He's fighting a mind flayer there; combat starts as soon as someone enters the helm. Killing him isn't required but gives the Everburn Blade and extra XP \u2013 alternatively disarm him with Command: Drop. After 15 turns Cambion reinforcements arrive.","K\xE4mpferin (Kampfmeisterin) des Flammenden Fausts. Versucht in der brennenden Waukeens Rast die verbarrikadierte T\xFCr aufzubrechen \u2013 ein ST\xC4-Wurf SG 10 hilft \u2013 und startet \u201ERettet den Gro\xDFherzog\u201C. Tr\xE4gt Svartlebee's Woundseeker. In Akt 2 steckt sie in einer Kapsel im Kaulquappen-Zentrum.":`Fighter (Battle Master) of the Flaming Fist. At the burning Waukeen's Rest she tries to break the barricaded door \u2013 a DC 10 STR check helps \u2013 and starts "Rescue the Grand Duke". Carries Svartlebee's Woundseeker. In Act 2 she's in a pod in the Tadpoling Centre.`,"Anf\xFChrer des Mordtribunals unter Candulhallows Grabsteinen in der Unterstadt. Tr\xE4gt das Sword of Chaos, das Amulett des Bhaal und seinen geh\xF6rnten Helm. Wird feindlich, wenn du nach Orins Tod ins Tribunal zur\xFCckkehrst.":"Leader of the Murder Tribunal under Candulhallow's Tombstones in the Lower City. Carries the Sword of Chaos, the Amulet of Bhaal and his horned helmet. Turns hostile if you return to the Tribunal after Orin's death.","Duergar-Anf\xFChrer der Absoluten in der Grymschmiede, eingeschlossen hinter einem Einsturz. Philomeen hat Sprengstoff f\xFCr den Schutt. Sprichst du mit ihm durch den Schutt, l\xE4uft ein Zeitlimit: nach zwei langen Rasten oder zweimal Grymschmiede verlassen stirbt er. Danach entweder gegen ihn k\xE4mpfen (Gnome retten) oder mit \xC4ltester Brithvar zusammenarbeiten. Beute: Disintegrating Night Walkers und 1.000 Gold.":"Duergar leader of the Absolute in Grymforge, trapped behind a cave-in. Philomeen has explosives for the rubble. Once you talk to him through the rubble, a timer runs: after two long rests or leaving Grymforge twice he dies. Then either fight him (save the gnomes) or work with Elder Brithvar. Loot: Disintegrating Night Walkers and 1,000 gold.","Tiefengnomin in der Ebonsee-Grotte (X 87 / Y \u221295) neben Spaw, vergiftet von Duergar. Startet \u201EHeile die vergiftete Gnomin\u201C \u2013 jeder Effekt gegen Vergiftung hilft. Geheilt schenkt sie dir die Boots of Speed, die sie Thrinn gestohlen hat.":'Deep gnome in the Ebonlake Grotto (X 87 / Y \u221295) next to Spaw, poisoned by duergar. Starts "Cure the Poisoned Gnome" \u2013 any effect against poison helps. Once cured she gives you the Boots of Speed she stole from Thrinn.',"Duergar-Sergeantin im Duergar-Lager der Grymschmiede (X \u2212643 / Y 300). Sucht ihre gestohlenen Stiefel (\u201EFinde die verlorenen Stiefel\u201C). Gibst du ihr die Boots of Speed, w\xE4hlst du als Belohnung das Bracing Band oder die Armour of Uninhibited Kushigo.":'Duergar sergeant in the duergar encampment of Grymforge (X \u2212643 / Y 300). Looking for her stolen boots ("Find the Missing Boots"). Give her the Boots of Speed and choose the Bracing Band or the Armour of Uninhibited Kushigo as a reward.',"Gro\xDFm\xE4uliger Goblin im \xF6stlichen Hof des Goblinlagers beim Alten Runenkreis. Tr\xE4gt Crusher's Ring am Zeh: beim erzwungenen Fu\xDFkuss abziehen (Fingerfertigkeit SG 10), per Dialog stehlen oder ihn t\xF6ten und pl\xFCndern.":"Loudmouthed goblin in the eastern courtyard of the Goblin Camp by the Ancient Rune Circle. Wears Crusher's Ring on his toe: slip it off during the forced foot kiss (DC 10 Sleight of Hand), steal it via dialogue or kill and loot him.","Anf\xFChrerin der Tiefling-Kinder im Versteck unter dem Smaragdhain. Gibt dir \u201EStehlt das heilige G\xF6tzenbild\u201C und belohnt dich mit dem Ring of Protection. Akt 2 im Letzten Licht, Akt 3 bei Sticky Dondo im Gildenhaus der Unterstadt.":'Leader of the tiefling kids in the hideout under the Emerald Grove. Gives you "Steal the Sacred Idol" and rewards you with the Ring of Protection. Act 2 at Last Light, Act 3 with Sticky Dondo at the Guildhall in the Lower City.',"Freundlicher Gedankenschinder an der Myconid-Kolonie \u2013 du triffst ihn nach einem Gespr\xE4ch mit Blurg. Quest: einen Sud aus Tongue of Madness und Timmask-Sporen bringen; danach bietet er den Ring of Mind-Shielding an. Verkauft au\xDFerdem u. a. die Boots of Stormy Clamour und den Ring of Salving.":"Friendly mind flayer at the Myconid Colony \u2013 you meet him after talking to Blurg. Quest: bring a decoction of Tongue of Madness and Timmask Spores; afterwards he offers the Ring of Mind-Shielding. Also sells the Boots of Stormy Clamour and the Ring of Salving, among others.","Waffen- und R\xFCstungsh\xE4ndler in Danthelons Tanzender Axt am Westende des Wyrms\xFCbergangs (X \u22126 / Y 133). Verkauft u. a. den Cloak of Displacement, die Gauntlets of the Warmaster und Blightbringer \u2013 und das Elixier der H\xFCgelriesenst\xE4rke.":"Weapon and armour trader at Danthelon's Dancing Axe on the west end of Wyrm's Crossing (X \u22126 / Y 133). Sells the Cloak of Displacement, the Gauntlets of the Warmaster and Blightbringer, among others \u2013 and the Elixir of Hill Giant Strength.","Das Gedankenschinder-Schiff im Prolog. Am Steuer k\xE4mpft Kommandant Zhalk mit der Everburn Blade. Nach dem Absturz nicht mehr betretbar.":"The mind flayer ship in the prologue. Commander Zhalk fights at the helm with the Everburn Blade. Can't be entered after the crash.","Verlassenes Dorf zwischen Druidenhain und Goblinlager, von Goblins besetzt. Moosbewachsene Truhe mit dem Haste Helm (X 34 / Y 394, Schl\xFCssel beim Booyahg auf dem Apothekendach), Apotheke mit Keller f\xFCr Alchemie-Zutaten, Windm\xFChle mit Barcus Wroot. Unter dem Dorf: die Fl\xFCsternden Tiefen mit dem Spurred Band \u2013 Eingang \xFCber den Brunnen (Untersuchung SG 10) oder die Schmiede.":"Abandoned village between the Druid Grove and the Goblin Camp, occupied by goblins. Moss-Covered Chest with the Haste Helm (X 34 / Y 394, key with the Booyahg on the apothecary roof), apothecary with a cellar for alchemy ingredients, windmill with Barcus Wroot. Below the village: the Whispering Depths with the Spurred Band \u2013 entrance via the well (DC 10 Investigation) or the forge.","Brennendes Gasthaus zwischen Gebirgspass und Aufgestiegener Stra\xDFe. Zeitkritisch: Schnellreise, Ortswechsel oder lange Rast lassen das Feuer alle Eingeschlossenen t\xF6ten. Gauntlet Yeva (Svartlebee's Woundseeker) bricht die T\xFCr auf, oben wartet Beraterin Florrick, hinter dem Gasthaus liegt der Geheimeingang zum Zhentarim-Versteck.":"Burning inn between the Mountain Pass and the Risen Road. Time-critical: fast travel, changing area or a long rest let the fire kill everyone trapped. Gauntlet Yeva (Svartlebee's Woundseeker) breaks open the door, Counsellor Florrick waits upstairs, and behind the inn is the secret entrance to the Zhentarim hideout.","Breite Steinbr\xFCcke von Rivington in die Unterstadt mit vielen L\xE4den \u2013 u. a. Danthelons Tanzende Axt (Cloak of Displacement). Am S\xFCdspann-Kontrollpunkt liegt ein Elixier der H\xFCgelriesenst\xE4rke, am Ende wartet die Wyrmfels-Festung mit den Helldusk Boots.":"Wide stone bridge from Rivington into the Lower City with many shops \u2013 including Danthelon's Dancing Axe (Cloak of Displacement). An Elixir of Hill Giant Strength lies at the South Span Checkpoint, and at the end the Wyrm's Rock Fortress awaits with the Helldusk Boots.","Herz von Baldur's Gate in Akt 3. Hier liegen die Schmiede der Neun (Dammon: Legacy of the Masters, Armour of Persistence), Beehive General Goods (Elixiere) und unter Candulhallows Grabsteinen das Mordtribunal mit Sarevok und dem Sword of Chaos.":"Heart of Baldur's Gate in Act 3. Here you'll find the Forge of the Nine (Dammon: Legacy of the Masters, Armour of Persistence), Beehive General Goods (elixirs) and, under Candulhallow's Tombstones, the Murder Tribunal with Sarevok and the Sword of Chaos.","Mittlere R\xFCstung: RK 15 + GES (max. +2) \u2013 mit GES 10 also RK 15":"Medium armour: AC 15 + DEX (max. +2) \u2013 with DEX 10 that's AC 15","Verzauberung +1":"Enchantment +1","Superior Material: Du nimmst 1 Hiebschaden weniger":"Superior Material: you take 1 less slashing damage","Nachteil auf Heimlichkeit":"Disadvantage on Stealth","160 gp \xB7 12 kg":"160 gp \xB7 12 kg","H\xE4ndler w\xFCrfeln magische R\xFCstungen aus einer gestuften Tabelle \u2013 der Schuppenpanzer +1 taucht bei Spielerstufe 4\u20136 auf.":"Traders roll magic armour from a levelled table \u2013 the Scale Mail +1 shows up at player level 4\u20136.","Bei dir hatte ihn Roah Moonglow im Zhentarim-Lager des Zerschmetterten Heiligtums (X 275 / Y \u221229).":"For you, Roah Moonglow had it in the Zhentarim storeroom of the Shattered Sanctum (X 275 / Y \u221229).","Steht er nicht im Angebot: nach einer langen Rast oder einem Stufenaufstieg erneut schauen.":"Not in stock? Check again after a long rest or level-up.","Mittlere R\xFCstung: RK 15 + GES (max. +2), Verzauberung +1":"Medium armour: AC 15 + DEX (max. +2), enchantment +1","Radiating Shockwave: Jeder glei\xDFende Schaden, den du machst, belegt Nicht-Verb\xFCndete im Umkreis von 3 m mit Radiating Orb":"Radiating Shockwave: any radiant damage you deal inflicts Radiating Orb on non-allies within 3 m","Radiating Orb: 2 Z\xFCge, \u22121 auf Angriffe je verbleibendem Zug, das Ziel leuchtet hell; jeder Angriff des Ziels verk\xFCrzt die Dauer um 2":"Radiating Orb: 2 turns, \u22121 to attack rolls per remaining turn, the target sheds bright light; each attack by the target reduces the duration by 2","Trifft keine Verb\xFCndeten, aber neutrale Kreaturen":"Doesn't hit allies, but does hit neutral creatures","Ausl\xF6ser f\xFCr dich: G\xF6ttliches Niederstrecken, G\xF6ttliche Gunst, Ring des kaltherzigen Leuchtens":"Triggers for you: Divine Smite, Divine Favour, Callous Glow Ring","250 gp \xB7 9 kg":"250 gp \xB7 9 kg","Im Sel\xFBnitischen Au\xDFenposten zur Stelle X 176 / Y \u2212247.":"In the Sel\xFBnite Outpost go to X 176 / Y \u2212247.","Die Prunktruhe steht hinter einer Geheimt\xFCr: per Wahrnehmungswurf entdecken \u2013 oder vom Raum mit dem Wegpunkt hin\xFCberspringen.":"The opulent chest is behind a hidden door: spot it with a Perception check \u2013 or jump over from the room with the waypoint.","Die Truhe ist verschlossen und mit einer Falle gesichert: erst die Falle entsch\xE4rfen, dann das Schloss knacken.":"The chest is locked and trapped: disarm the trap first, then pick the lock.","Im selben Au\xDFenposten liegt auch der Helm des Niederstreckens \u2013 gleich mitnehmen.":"The Helmet of Smiting is in the same outpost \u2013 grab it too.","Gro\xDFschwert, 2W6 Hieb + 1W4 Feuer":"Greatsword, 2d6 slashing + 1d4 fire","Ignoriert Resistenz gegen nicht-magischen Hiebschaden":"Ignores resistance to non-magical slashing damage","Pommel Strike (Bonusaktion): nicht-t\xF6dlicher Schlag, kann benommen machen; l\xE4dt bei kurzer Rast":"Pommel Strike (bonus action): non-lethal blow that can daze; recharges on a short rest","Prolog: Kommandant Zhalk k\xE4mpft am Steuer der Nautiloid gegen einen Gedankenschinder.":"Prologue: Commander Zhalk fights a mind flayer at the helm of the Nautiloid.","Ihn zu t\xF6ten gibt die Klinge und Extra-EP \u2013 oder ihn per Befehl: Fallenlassen entwaffnen (er besteht den Rettungswurf oft).":"Killing him gives the blade and extra XP \u2013 or disarm him with Command: Drop (he often passes the save).","Der Kampf hat ein Limit von 15 Z\xFCgen, danach kommen Cambion-Verst\xE4rkungen.":"The fight has a 15-turn limit, after which Cambion reinforcements arrive.","Nach dem Absturz nicht mehr erreichbar \u2013 f\xFCr dich also verpasst.":"Not reachable after the crash \u2013 so you've missed it.","Gro\xDFschwert +1, 2W6 Hieb":"Greatsword +1, 2d6 slashing","Deepen the Wound: +1W4 auf Angriffsw\xFCrfe mit dieser Waffe gegen Kreaturen, die schon Schaden genommen haben":"Deepen the Wound: +1d4 to attack rolls with this weapon against creatures that have already taken damage","Akt 1: Waukeens Rast (X \u221266 / Y 609) \u2013 Gauntlet Yeva vom Flammenden Faust tr\xE4gt es.":"Act 1: Waukeen's Rest (X \u221266 / Y 609) \u2013 Gauntlet Yeva of the Flaming Fist carries it.","Erbeuten l\xE4sst es sich nur, wenn Yeva f\xE4llt.":"You can only loot it if Yeva falls.","Lebt sie, steckt sie in Akt 2 in einer Kapsel im Kaulquappen-Zentrum der Gedankenschinder-Kolonie und tr\xE4gt es weiterhin.":"If she lives, in Act 2 she's in a pod in the Tadpoling Centre of the mind flayer colony and still carries it.","Gro\xDFschwert +2: 2W6 + 2 Hieb + 1W4 nekrotisch":"Greatsword +2: 2d6 + 2 slashing + 1d4 necrotic","Chaos: Jeder Schadenstreffer heilt dich um 1W6 (Schaden an Gegenst\xE4nden z\xE4hlt nicht)":"Chaos: every damaging hit heals you for 1d6 (damage to objects doesn't count)","Sehr selten \xB7 960 gp":"Very rare \xB7 960 gp","Akt 3: Mordtribunal unter Candulhallows Grabsteinen in der Unterstadt.":"Act 3: the Murder Tribunal under Candulhallow's Tombstones in the Lower City.","Sarevok Anchev tr\xE4gt es \u2013 zusammen mit dem Amulett des Bhaal und seinem geh\xF6rnten Helm.":"Sarevok Anchev carries it \u2013 along with the Amulet of Bhaal and his horned helmet.","Er wird feindlich, wenn du nach Orins Tod ins Tribunal zur\xFCckkehrst.":"He turns hostile if you return to the Tribunal after Orin's death.","Schwere R\xFCstung: RK 20":"Heavy armour: AC 20","\u22122 auf jeden erlittenen Schaden":"\u22122 to every damage taken","Dauerhaft Resistance (+1W4 auf Rettungsw\xFCrfe)":"Permanent Resistance (+1d4 to saving throws)","Dauerhaft Blade Ward (Resistenz gegen Wucht, Stich und Hieb)":"Permanent Blade Ward (resistance to bludgeoning, piercing and slashing)","Akt 3: Dammon verkauft sie in der Schmiede der Neun in der Unterstadt.":"Act 3: Dammon sells it at the Forge of the Nine in the Lower City.","Zu Kampfbeginn 3 Z\xFCge Schwung: +1,5 m Bewegung pro verbleibendem Zug":"At the start of combat 3 turns of Momentum: +1.5 m movement per remaining turn","Akt 1: Verfallenes Dorf \u2013 die Moosbewachsene Truhe steht neben einem Wagen gegen\xFCber dem Wegpunkt in der Dorfmitte (X 34 / Y 394).":"Act 1: Blighted Village \u2013 the Moss-Covered Chest stands next to a wagon across from the waypoint in the village centre (X 34 / Y 394).","Den Moosbewachsenen Schl\xFCssel tr\xE4gt ein Goblin-Booyahg auf dem Dach der Apotheke.":"A goblin Booyahg on the apothecary roof carries the Moss-Covered Key.","+2 auf Angriffs- und Schadensw\xFCrfe mit Waffen":"+2 to attack and damage rolls with weapons","+1 auf ST\xC4-Rettungsw\xFCrfe":"+1 to STR saving throws","Bekannter Bug: Die +2 auf den Angriff gelten auch f\xFCr Zauberangriffe, waffenlose und Wurfangriffe (Schaden nur bei Wurfwaffen)":"Known bug: the +2 to hit also applies to spell attacks, unarmed and throw attacks (damage only with thrown weapons)","Akt 3: Dammon verkauft sie in der Schmiede der Neun (X 5 / Y \u22127).":"Act 3: Dammon sells it at the Forge of the Nine (X 5 / Y \u22127).","Immun gegen Netz, Verstrickt und Ausrutschen":"Immune to webs, Entangled and slipping","Misty Step als Bonusaktion, einmal pro kurzer Rast":"Misty Step as a bonus action, once per short rest","Akt 1, Grymschmiede: Nere sitzt hinter einem Einsturz fest, versklavte Tiefengnome sollen ihn ausgraben.":"Act 1, Grymforge: Nere is stuck behind a cave-in; enslaved deep gnomes are supposed to dig him out.","Philomeen hat Sprengstoff f\xFCr den Schutt. Achtung: Sobald du durch den Schutt mit Nere sprichst, l\xE4uft ein Zeitlimit \u2013 nach zwei langen Rasten oder zweimal Grymschmiede verlassen stirbt er.":"Philomeen has explosives for the rubble. Careful: once you talk to Nere through the rubble, a time
