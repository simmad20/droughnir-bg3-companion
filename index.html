einem Eidbrecher drittes Talent Wilder Angreifer.":"Level 4 Great Weapon Master, second feat CHA +2, for pure Oathbreaker a third feat Savage Attacker.","Panzerhandschuhe (ST\xC4 23) und Amulett (KON 23) ohne Respec; Spiegel des Verlusts: +2 CHA \u2192 CHA 20.":"Gauntlets (STR 23) and Amulet (CON 23) without respec; Mirror of Loss: +2 CHA \u2192 CHA 20.","Maximaler Schaden (Balanced)":"Maximum damage (Balanced)","Riesent\xF6ter binden, CHA hochziehen.":"Bind the Giantslayer, raise CHA.","Ehrenmodus / kein Umdenken":"Honour Mode / no rethinking","Bleibt ein reiner ST\xC4-Build.":"Stays a pure STR build.","Einfach & robust":"Simple & robust","Keine leeren Stufen, drei Talente.":"No empty levels, three feats.","F\xFCr alle Wege":"For all routes","GWM auf Stufe 4, Schattenherz auf Licht, Eidbrecher-Ritter leben lassen.":"GWM at level 4, Shadowheart on Light, keep the Oathbreaker Knight alive.","Fluch der Hexklinge + Gel\xFCbde, drei Angriffe pro Aktion.":"Hexblade's Curse + Vow, three attacks per action.","Reiner ST\xC4-Build mit Tatendrang und Zu Fall bringen.":"Pure STR build with Action Surge and Trip Attack.","Hast als Eidzauber, keine leeren Stufen.":"Haste as an oath spell, no empty levels.","F\xFCr alle Rache-Wege":"For all Vengeance routes","R\xFCckkehr kostet beim Eidbrecher-Ritter 1.000 Gold. GWM auf Stufe 4, Gel\xFCbde vor jedem Boss.":"Returning costs 1,000 gold at the Oathbreaker Knight. GWM at level 4, Vow before every boss.","Eid-der-Rache-Wege":"Oath of Vengeance routes","Alle vergleichen":"Compare all","Normaler Zug":"Normal turn","Mit Hast":"With Haste","Er\xF6ffnungs-Burst":"Opening burst","Angriffe pro Aktion":"Attacks per action",Hauptattribut:"Main ability","H\xF6chster Platz":"Highest slot",Ehrenmodus:"Honour Mode",Aufwand:"Effort","Aktiver Eid:":"Active oath:","Umschalten links beim Charakter \u2013 hier kannst du die Wege beider Eide ansehen und vergleichen.":"Switch it on the left with the character \u2013 here you can view and compare the routes of both oaths.","Wege anzeigen":"Show routes","Eidbrecher oder Rache?":"Oathbreaker or Vengeance?","Bester Weg:":"Best route:","Schaden pro Zug auf Stufe 12":"Damage per turn at level 12","St\xE4rke: Aura des Hasses \u2013 +CHA auf jeden Nahkampftreffer, dauerhaft und ohne Aktion. Je mehr Treffer pro Zug, desto gr\xF6\xDFer der Vorsprung.":"Strength: Aura of Hate \u2013 +CHA on every melee hit, permanent and without an action. The more hits per turn, the bigger the lead.","St\xE4rke: Gel\xFCbde der Feindschaft (10 Runden Vorteil) und Hast als Eidzauber. Mehr Krits, mehr Mobilit\xE4t \u2013 aber weniger Bonus pro Treffer.":"Strength: Vow of Enmity (10 turns of advantage) and Haste as an oath spell. More crits, more mobility \u2013 but less bonus per hit.","Kurz: Auf dem Papier liegt der Eidbrecher bei gleich vielen Angriffen knapp vorn, weil die Aura jeden Treffer verst\xE4rkt. Rache gewinnt bei Krit-Smites (Vorteil, mit Hexklinge Krit ab 19) und bei der Flexibilit\xE4t. Der Wechsel zur\xFCck zur Rache kostet beim Eidbrecher-Ritter 1.000 Gold.":"In short: on paper the Oathbreaker is slightly ahead with the same number of attacks, because the aura boosts every hit. Vengeance wins on crit smites (advantage, with Hexblade crits from 19) and flexibility. Switching back to Vengeance costs 1,000 gold at the Oathbreaker Knight.","Empfehlung \xB7":"Recommendation \xB7",Gew\u00E4hlt:"Chosen",W\u00E4hlen:"Choose","Du siehst gerade die Wege des anderen Eids. \u201EW\xE4hlen\u201C stellt den aktiven Eid automatisch mit um.":`You're viewing the other oath's routes. "Choose" switches the active oath as well.`,"Vergleich auf einen Blick":"Comparison at a glance","Schaden Lv 12":"Damage Lv 12","Schaden: normaler Zug / mit Hast / Er\xF6ffnungs-Burst \u2013 \xDCberschlag (Akt-3-Gear, Gegner-RK 18, mit Segnen, ohne Smites). Rache-Wege: eigener \xDCberschlag mit denselben Annahmen \u2013 ohne Aura des Hasses, daf\xFCr mit Vorteil durch das Gel\xFCbde.":"Damage: normal turn / with Haste / opening burst \u2013 estimate (Act 3 gear, enemy AC 18, with Bless, no smites). Vengeance routes: own estimate with the same assumptions \u2013 without Aura of Hate, but with advantage from the Vow.","Diesen Weg w\xE4hlen":"Choose this route","Stufen ansehen":"View levels","Riesent\xF6ter & Pakt der Klinge":"Giantslayer & Pact of the Blade","Die Riesent\xF6ter-Passive verdoppelt nicht den Angriffs-Modifikator, sie addiert deinen ST\xC4-Modifikator einmal pauschal zum Waffenschaden. Gebunden \xFCber Pakt der Klinge greifst du mit CHA an \u2013 die Passive addiert trotzdem ST\xC4.":"The Giantslayer passive doesn't double the attack modifier, it adds your STR modifier once as a flat bonus to weapon damage. Bound via Pact of the Blade you attack with CHA \u2013 the passive still adds STR.","ST\xC4 23 \xB7 CHA 20":"STR 23 \xB7 CHA 20",Ungebunden:"Unbound","Gebunden (W4)":"Bound (W4)","+6 (ST\xC4)":"+6 (STR)","+5 (CHA)":"+5 (CHA)",Schadensbonus:"Damage bonus","+12 (ST\xC4 + ST\xC4)":"+12 (STR + STR)","+11 (CHA + ST\xC4)":"+11 (CHA + STR)","Fazit: Pro Treffer ist ungebunden minimal besser, solange ST\xC4 h\xF6her als CHA ist. Der dritte Angriff von W4 gleicht das weit mehr als aus \u2013 f\xFCr W4 also binden und CHA so hoch wie m\xF6glich ziehen.":"Verdict: per hit, unbound is marginally better as long as STR is higher than CHA. W4's third attack more than makes up for it \u2013 so for W4 bind it and raise CHA as high as possible.","Quelle: dein r/BG3Builds-Thread zum Riesent\xF6ter mit Hexklinge.":"Source: your r/BG3Builds thread on the Giantslayer with Hexblade.","Talente & Attribute":"Feats & abilities","Ethels Haar: ST\xC4 oder CHA?":"Ethel's Hair: STR or CHA?","Die Recherche r\xE4t zu CHA. Mit Talent (+2) und Spiegel des Verlusts (+2) landest du aber auch ohne Haar bei CHA 20 \u2013 das Haar macht daraus nur 21, gleicher Modifikator. Auf ST\xC4 bringt es in Akt 1\u20132 sofort +1 Treffer und Schaden, wann immer kein Elixier aktiv ist.":"The research recommends CHA. With a feat (+2) and the Mirror of Loss (+2) you reach CHA 20 even without the hair \u2013 the hair only makes it 21, same modifier. On STR it gives you +1 to hit and damage right away in Acts 1\u20132 whenever no elixir is active.","Weitere Varianten":"Further variants","Eidbrecher 9 / Champion 3":"Oathbreaker 9 / Champion 3","Krits auf 19\u201320 f\xFCr mehr Smite-Krits, Grad-3-Pl\xE4tze aus Paladin 9 \u2013 daf\xFCr keine Aura der Tapferkeit.":"Crits on 19\u201320 for more smite crits, level 3 slots from Paladin 9 \u2013 but no Aura of Courage.","Eidbrecher 8 / Champion 4":"Oathbreaker 8 / Champion 4","Laut Deltia's Gaming einer der Top-Builds in Patch 8 (mit Bhaalisten-R\xFCstung). Drei Talente, Krit-Fokus.":"According to Deltia's Gaming one of the top builds in Patch 8 (with Bhaalist Armour). Three feats, crit focus.","Eidbrecher 6 / Zauberer 6":"Oathbreaker 6 / Sorcerer 6","Der klassische \u201ESorcadin\u201C \u2013 f\xFCr Eidbrecher nicht empfohlen: ohne Aura des Hasses fehlen bei 4 Treffern rund 20 Schaden pro Runde.":'The classic "Sorcadin" \u2013 not recommended for Oathbreakers: without Aura of Hate you lose about 20 damage per round at 4 hits.',"Eid-Entscheidung":"Oath decision","Aktiv:":"Active:","Eidbrecher bleiben":"Stay Oathbreaker","Rache wiederherstellen":"Restore Vengeance","Vorteil: Trotziges Leid, Handschuhe des grummelnden Verlierers, liegende oder gel\xE4hmte Ziele.":"Advantage: Spiteful Suffering, Gloves of the Growling Underdog, prone or paralysed targets.","Boni: Segnen (+1W4), +1/+3-Waffen, Hast.":"Bonuses: Bless (+1d4), +1/+3 weapons, Haste.","Faustregel: \u201EAll In\u201C nur mit Vorteil oder gegen RK \u2264 15 \u2013 sonst aus.":'Rule of thumb: "All In" only with advantage or against AC \u2264 15 \u2013 otherwise off.',"Kills planen: angeschlagene Gegner zuerst \u2192 GWM-Bonusangriff.":"Plan kills: weakened enemies first \u2192 GWM bonus attack.","Pl\xE4tze vor allem f\xFCr G\xF6ttliches Niederstrecken auf Krits":"Slots mainly for Divine Smite on crits","Eid-Ladung gezielt: Gr\xE4ssliches Aussehen bei 3+ Feinden, Trotziges Leid gegen Bosse, Untote kontrollieren gegen starke Untote":"Channel Oath on purpose: Dreadful Aspect for 3+ enemies, Spiteful Suffering against bosses, Control Undead against strong undead","Befehl \u201EHinfallen\u201C als g\xFCnstiger Vorteil-Geber":'Command "Grovel" as a cheap advantage giver',"Ab Stufe 5: Magische Waffe gegen den GWM-Malus":"From level 5: Magic Weapon against the GWM penalty","H\xF6llischer Tadel und Wunden verursachen nur sparsam \u2013 sie kosten Smite-Pl\xE4tze":"Hellish Rebuke and Inflict Wounds only sparingly \u2013 they cost smite slots","Beistand (Aid) vor langen Rasten":"Aid before long rests",Kosten:"Cost","0 Gold":"0 gold","1.000 Gold \u2013 danach 2.000, ab dem dritten Mal 10.000":"1,000 gold \u2013 then 2,000, from the third time 10,000",Grunds\u00E4tze:"Tenets","Keine \u2013 freie Entscheidungen":"None \u2013 free decisions","Rache-Grunds\xE4tze gelten wieder":"Vengeance tenets apply again",Schaden:"Damage","Ab Stufe 7 Aura des Hasses: dauerhaft +CHA auf jeden Nahkampfwaffentreffer":"From level 7 Aura of Hate: permanently +CHA on every melee weapon hit","Gel\xFCbde der Feindschaft (Vorteil als Bonusaktion), Eidzauber Person festhalten, Nebelschritt, Hast":"Vow of Enmity (advantage as a bonus action), oath spells Hold Person, Misty Step, Haste",Kontrolle:"Control","Gr\xE4ssliches Aussehen (Angst im Bereich), Untote kontrollieren":"Dreadful Aspect (area fear), Control Undead","Feind bannen (Einzelziel-Angst)":"Abjure Enemy (single-target fear)",Umskillen:"Respec","Nicht m\xF6glich \u2013 Der Verdorrte skillt Eidbrecher nicht um":"Not possible \u2013 Withers won't respec Oathbreakers","Bei Der Verdorrte m\xF6glich":"Possible at Withers","So geht's":"How it works","Nichts zu tun":"Nothing to do","Im Lager mit dem Eidbrecher-Ritter sprechen und zahlen. Er stellt deinen urspr\xFCnglichen Eid wieder her \u2013 bei Droughnir Rache. Den Ritter daher nie t\xF6ten.":"Talk to the Oathbreaker Knight at camp and pay. He restores your original oath \u2013 Vengeance for Droughnir. So never kill the Knight.",Nachteil:"Downside","Die Aura st\xE4rkt auch feindliche Untote und Unholde":"The aura also strengthens enemy undead and fiends","Teuer in Akt 1, Grunds\xE4tze bleiben riskant":"Expensive in Act 1, tenets stay risky","Akt 1 oder Akt 2?":"Act 1 or Act 2?","Akt 1 hat kaum Ziele: Gruft-Schreiber und Gruft-Krieger in der Feuchten Gruft. Die einzige Eid-Ladung lohnt sich meist mehr f\xFCr Trotziges Leid (Bosse) oder Gr\xE4ssliches Aussehen (Gruppen).":"Act 1 has hardly any targets: Entombed Scribes and Warriors in the Dank Crypt. The single Channel Oath charge is usually worth more for Spiteful Suffering (bosses) or Dreadful Aspect (groups).","Stark wird es ab Akt 2: Schattenverfluchte Lande, Reithwin und das Haus der Heilung mit Malus Thorm.":"It gets strong from Act 2: the Shadow-Cursed Lands, Reithwin and the House of Healing with Malus Thorm.","Nur aktive Untote":"Only active undead","Wirkt nur auf lebende untote Gegner mit Weisheitsrettungswurf \u2013 nicht auf Leichen.":"Only works on living undead enemies with a Wisdom save \u2013 not on corpses.","Leichen erweckst du erst ab Paladin-Stufe 9 mit dem Eidzauber Tote beleben.":"You raise corpses only from paladin level 9 with the oath spell Animate Dead.","Waffe oder Klaue?":"Weapon or claw?","Ab Stufe 7 bekommen nur Untote mit Waffe den Bonus der Aura des Hasses.":"From level 7 only undead with weapons get the Aura of Hate bonus.","Ghule, Zombies und andere Klauen-K\xE4mpfer gehen leer aus \u2013 Skelette und Gruft-Krieger bevorzugen.":"Ghouls, zombies and other clawed fighters get nothing \u2013 prefer skeletons and Entombed Warriors.","Heilung & Schwierigkeit":"Healing & difficulty","Wunden heilen, Handauflegen und \xE4hnliche Heilzauber wirken nicht auf Untote \u2013 dein Untoter erholt sich praktisch nur \xFCber eine kurze Rast.":"Cure Wounds, Lay on Hands and similar healing spells don't work on undead \u2013 your undead practically only recovers through a short rest.","Die Level hier gelten f\xFCr \u201EAusgewogen\u201C. Auf Taktiker und im Ehrenmodus k\xF6nnen Gegner h\xF6her sein.":'Levels here apply to "Balanced". On Tactician and in Honour Mode enemies can be higher.',"Dein Rettungswurf-SG auf Stufe":"Your save DC at level","8 + \xDCbung":"8 + proficiency","+ CHA 3 \xB7 mit CHA 18 +1":"+ CHA 3 \xB7 with CHA 18 +1","Dein Level stellst du oben in der Leiste oder in der Seitenleiste ein.":"Set your level in the top bar or in the sidebar.","Aktion + Eid-Ladung (1 pro kurzer Rast, geteilt mit Trotziges Leid und Gr\xE4ssliches Aussehen)":"Action + Channel Oath charge (1 per short rest, shared with Spiteful Suffering and Dreadful Aspect)",Rettungswurf:"Saving throw","Weisheit gegen deinen Zauber-SG":"Wisdom against your spell save DC",Ziel:"Target","Level niedriger als deins. Immun: Balthazar, Gerringothe und Thisobald Thorm, Withers":"Level lower than yours. Immune: Balthazar, Gerringothe and Thisobald Thorm, Withers","Bis zur langen Rast, keine Konzentration":"Until long rest, no concentration",Steuerung:"Control","KI-Verb\xFCndeter: greift den n\xE4chsten Feind an oder folgt dir":"AI ally: attacks the nearest enemy or follows you",Verlust:"Loss","Gehst du zu Boden, ist er endg\xFCltig weg":"If you go down, it's gone for good","Ziele nach Level":"Targets by level","Werte auf \u201EAusgewogen\u201C \xB7 Klick f\xFCr Details":'Values on "Balanced" \xB7 click for details',Lv:"Lv",m\u00F6glich:"possible","Licht \u2013 Allround laut Patch-8-Guides. Leben, wenn sie die einzige Heilerin ist. Trickserei per Respec ablegen.":"Light \u2013 all-rounder according to Patch 8 guides. Life if she is the only healer. Drop Trickery via respec.","Kriegszauberer (War Caster), damit Segnen h\xE4lt.":"War Caster, so Bless holds.","Shar oder Sel\xFBne":"Shar or Sel\xFBne","F\xFCr deine Buffs kaum relevant: Shar bringt Dunkle-Justiziar-Ausr\xFCstung, Sel\xFBne den Zauber Mondstrahl.":"Hardly relevant for your buffs: Shar brings Dark Justiciar gear, Sel\xFBne the spell Moonbeam.","Sie h\xE4lt Segnen oder Schutzgeister, Gale h\xE4lt Hast oder Festhalten \u2013 nie beides. Du selbst nur Magische Waffe.":"She holds Bless or Spirit Guardians, Gale holds Haste or Hold \u2013 never both. You yourself only Magic Weapon.","Buffs & Heilung":"Buffs & Healing","Abhaken, wenn der Zauber bei der jeweiligen Figur vorbereitet ist.":"Tick when the spell is prepared on the respective character.","\xB7 ab Stufe":"\xB7 from level",Priorit\u00E4t:"Priority","von 3":"of 3","\u2013 Details":"\u2013 Details","Elixier trinken":"Drink an elixir","H\xFCgelriesenst\xE4rke in Akt 1\u20132, sp\xE4ter Blutdurst.":"Hill Giant Strength in Acts 1\u20132, later Bloodlust.",sp\u00E4ter:"later","Schattenherz: Beistand auf die Gruppe":"Shadowheart: Aid on the party","Ab Stufe 7 zus\xE4tzlich Todesschutz auf Droughnir, ab Stufe 11 Heldenmahl.":"From level 7 additionally Death Ward on Droughnir, from level 11 Heroes' Feast.","Droughnir: Magische Waffe":"Droughnir: Magic Weapon","Ab Stufe 5. H\xE4lt bis zur langen Rast und aktiviert den Ring des seltsamen Leiters \u2013 belegt nur deine eigene Konzentration.":"From level 5. Lasts until long rest and activates the Strange Conduit Ring \u2013 only uses your own concentration.","Auren pr\xFCfen":"Check auras","Aura des Schutzes ab Stufe 6, Aura des Hasses ab Stufe 7. Nach Tod oder Wiederbelebung m\xFCssen Auren oft neu angeklickt werden.":"Aura of Protection from level 6, Aura of Hate from level 7. After death or revival, auras often have to be clicked again.","\u2013 ab Stufe":"\u2013 from level","Nach der langen Rast":"After the long rest","Neue Rast":"New rest","Buffs, die bis zur n\xE4chsten langen Rast halten und keine Konzentration der Gef\xE4hrten binden. Einmal morgens abhaken, dann bleibt Platz f\xFCr Segnen und Hast.":"Buffs that last until the next long rest and don't tie up your companions' concentration. Tick them off once in the morning, then there's room for Bless and Haste.","Aktive Konzentration \u2013 1 pro Figur":"Active concentration \u2013 1 per character",Empfehlung:"Recommendation","W\xE4hle, was jede Figur gerade h\xE4lt. Ein neuer Konzentrationszauber derselben Figur beendet den alten \u2013 Konflikte innerhalb einer Spalte schlie\xDFen sich also aus.":"Choose what each character is currently holding. A new concentration spell by the same character ends the old one \u2013 so options within a column exclude each other.","h\xE4lt:":"holds:","Party & Buffs":"Party & Buffs",Unterbereiche:"Sub-sections",". Die Zeile \u201EStufe 12: Nova\u201C folgt deinem Rache-Weg. Die \xFCbrigen Kombos, die Eid-Ladungs-Tipps und \u201EUntote kontrollieren\u201C sind auf den Eidbrecher ausgelegt \u2013 als Rache ersetzt das Gel\xFCbde der Feindschaft Trotziges Leid, die Aura des Hasses entf\xE4llt.":'. The row "Level 12: nova" follows your Vengeance route. The other combos, the Channel Oath tips and "Control Undead" are designed for the Oathbreaker \u2013 as Vengeance, Vow of Enmity replaces Spiteful Suffering and Aura of Hate is gone.',"Kombos & Zug-Abl\xE4ufe":"Combos & turn sequences",Zauberplatz:"Spell slot","Welche Eid-Ladung wann?":"Which Channel Oath when?","Ein einzelner starker Untoter unter deinem Level \u2013 am besten einer mit Waffe.":"A single strong undead below your level \u2013 ideally one with a weapon.","3+ Feinde in 9 m: WEI-Rettungswurf, sonst 2 Runden ver\xE4ngstigt \u2013 keine Bewegung, Nachteil.":"3+ enemies within 9 m: WIS save or frightened for 2 turns \u2013 no movement, disadvantage.","Boss in 3 m: CHA-Rettungswurf, 3 Runden Vorteil auf alle Angriffe gegen ihn plus 1W4 + CHA nekrotisch pro Runde.":"Boss within 3 m: CHA save, 3 turns of advantage on all attacks against it plus 1d4 + CHA necrotic per turn.","Eine Eid-Ladung pro kurzer Rast \u2013 alle drei F\xE4higkeiten teilen sie sich.":"One Channel Oath charge per short rest \u2013 all three abilities share it.","GWM-Check":"GWM check","Neuer Kampf":"New fight","Malus (\u22125) ausgleichen \u2013 vor \u201EAll In\u201C abhaken.":'Offset the penalty (\u22125) \u2013 tick before "All In".',"Zauber-Priorit\xE4ten":"Spell priorities","\xB7 deine Lebensversicherung":"\xB7 your life insurance","L\xFCcken der Glaskanone \u2013 und wer sie schlie\xDFt":"Gaps of the glass cannon \u2013 and who closes them",Bereich:"Area","Orte \xB7":"Places \xB7","NPCs \xB7":"NPCs \xB7","Anleitungen \xB7":"Guides \xB7","Atlas durchsuchen":"Search atlas","Ort, NPC, Item oder Stichwort \u2026":"Place, NPC, item or keyword \u2026","Quest & Lager":"Quest & camp",Untote:"Undead",Schritte:"Steps","Keine Treffer f\xFCr diese Auswahl.":"No results for this selection.","Vollbild ist in dieser Vorschau gesperrt \u2013 Seitenleiste ausgeblendet. F\xFCr echtes Vollbild das Artefakt \xFCber seinen Link in einem eigenen Tab \xF6ffnen.":"Fullscreen is blocked in this preview \u2013 sidebar hidden. For real fullscreen, open the artifact via its link in its own tab.","Charakterbogen \xF6ffnen":"Open character sheet",Charakterbogen:"Character sheet","BG3 Companion":"BG3 Companion","Bilder & Icons verwalten":"Manage images & icons","Export, Import und Zur\xFCcksetzen":"Export, import and reset","Daten / Backup":"Data / Backup","Seitenleiste ausblenden":"Hide sidebar","Seitenleiste einblenden":"Show sidebar","Seitenleiste umschalten":"Toggle sidebar","Einstellungen: Namen, Darstellung, Bilder":"Settings: names, display, images","Vollbild beenden":"Exit fullscreen",Vollbild:"Fullscreen",Beenden:"Exit",Bereiche:"Sections","Stand: Patch 8 + Hotfixes bis 2026 \xB7 Daten laut bg3.wiki und deutschen Guides, Gegner-Level auf \u201EAusgewogen\u201C \xB7 Bilder von bg3.wiki (CC BY-NC-SA, \xA9 Larian Studios) \xB7 Fortschritt und eigene Bilder nur in diesem Browser \u2013 gelegentlich \u201EDaten / Backup\u201C nutzen \xB7 Deutsche Namen teils inoffiziell":'As of: Patch 8 + hotfixes up to 2026 \xB7 data from bg3.wiki and German guides, enemy levels on "Balanced" \xB7 images from bg3.wiki (CC BY-NC-SA, \xA9 Larian Studios) \xB7 progress and own images only in this browser \u2013 use "Data / Backup" now and then \xB7 German names partly unofficial',erledigt:"done",entfernen:"remove",aktiv:"active",ab:"from",eingeplant:"planned",halten:"hold",hochladen:"upload","Gruft-Schreiber (Entombed Scribe) sind Level 2 \u2013 auf Stufe 3 g\xFCltige Ziele, k\xE4mpfen aber nur mit Zaubern (K\xE4ltestrahl, Nebelwolke, Stille). Ab Stufe 4 der Gruft-Krieger (Level 3) mit Krumms\xE4bel. Der Untote k\xE4mpft bis zur langen Rast f\xFCr dich.":"Entombed Scribes are level 2 \u2013 valid targets at level 3, but they only fight with spells (Ray of Frost, Fog Cloud, Silence). From level 4 the Entombed Warrior (level 3) with a scimitar. The undead fights for you until a long rest.","ST\xC4 21 bis zur langen Rast \u2013 bis zu den Panzerhandschuhen dein Standard-Elixier vor Bossk\xE4mpfen. Nur ein Elixier gleichzeitig aktiv. Fr\xFCh kaufen: Tantchen Ethel verkauft im Hain 3 St\xFCck, aufgef\xFCllt nach jeder langen Rast oder jedem Stufenaufstieg \u2013 ihr Laden schlie\xDFt f\xFCr immer, sobald sie ihre Vettel-Gestalt zeigt, in den Tunnel flieht oder im Teehaus stirbt.":"STR 21 until long rest \u2013 your standard elixir before boss fights until you get the Gauntlets. Only one elixir active at a time. Buy early: Auntie Ethel sells 3 in the Grove, restocked after every long rest or level-up \u2013 her shop closes for good as soon as she reveals her hag form, flees into the tunnel or dies at the teahouse.","Garantiert bei Grat im Goblinlager (X \u221299 / Y 424), sonst zuf\xE4llig bei H\xE4ndlern mit magischen Nahkampfwaffen. 85 gp Basispreis. Ersatz f\xFCr die verpasste Immergl\xFCh-Klinge (Everburn Blade). Alternative: Blutige Gro\xDFaxt (Blooded Greataxe).":"Guaranteed at Grat in the Goblin Camp (X \u221299 / Y 424), otherwise randomly at traders with magic melee weapons. 85 gp base price. Replacement for the missed Everburn Blade. Alternative: Blooded Greataxe.","40 gp (Ehrenmodus 85 gp). Volo verkauft es am Heiligen Teich \u2013 dort \xFCber den Handel-Button unten links, nicht \xFCber den Dialog \u2013 und sp\xE4ter auch im Lager (Akt 1\u20133). Grat im Goblinlager nur, solange du es nicht von Volo hast. An Schattenherz geben.":"40 gp (Honour Mode 85 gp). Volo sells it at the Sacred Pool \u2013 use the trade button at the bottom left there, not the dialogue \u2013 and later at camp too (Acts 1\u20133). Grat in the Goblin Camp only if you didn't get it from Volo. Give it to Shadowheart.","Dammon in der Mulde des Smaragdhains (X 177 / Y 562). +1-Kurzbogen mit Vorteil gegen Monstrosit\xE4ten und Mal des J\xE4gers 1\xD7 pro langer Rast. \xDCbergangsbogen f\xFCr Astarion, bis der Bogen der Todesfee da ist.":"Dammon in the Hollow of the Emerald Grove (X 177 / Y 562). +1 shortbow with advantage against monstrosities and Hunter's Mark once per long rest. Stopgap bow for Astarion until you have the Bow of the Banshee.","Eulenb\xE4renh\xF6hle (X \u2212321 / Y \u2212135): Die Sel\xFBne-Truhe ist versiegelt. Gebetsblatt hinter der Sel\xFBne-Statue finden (Wahrnehmung) und vor der Truhe vorlesen. Effekt: bei 50 % TP oder weniger keine Gelegenheitsangriffe.":"Owlbear Nest (X \u2212321 / Y \u2212135): the Sel\xFBne chest is sealed. Find the prayer page behind the Sel\xFBne statue (Perception) and read it in front of the chest. Effect: at 50% HP or less no opportunity attacks.","Nur im Versteck im \xFCberwucherten Tunnel \u2013 im Uferteehaus verhandelt sie nie, auch nicht unter 20 % TP. Unter 20 % TP bringen und ihren Zug abwarten. Nicht verstummen lassen, nicht bewusstlos schlagen. SG 20 T\xE4uschen oder Einsch\xFCchtern (K\xE4mpfer und Barbaren: SG 15 Einsch\xFCchtern mit Vorteil). Erfolg = Haar + Mayrina frei, Ethel geht. Misslingt eine Probe, ist die andere gesperrt \u2013 den Deal kannst du dann noch annehmen. Achtung Rache-Weg: Jeder Deal mit ihr bricht den Paladin-Eid. Details in der Anleitung.":"Only in her hideout in the overgrown tunnel \u2013 at the Riverside Teahouse she never bargains, not even below 20% HP. Bring her below 20% HP and wait for her turn. Don't silence her or knock her out. DC 20 Deception or Intimidation (Fighters and Barbarians: DC 15 Intimidation with advantage). Success = hair + Mayrina free, Ethel leaves. If one check fails, the other is locked \u2013 you can still accept the deal then. Warning for the Vengeance route: any deal with her breaks the paladin oath. Details in the guide.","Grat verkauft das Gro\xDFschwert +1 immer. Das fl\xFCsternde Versprechen nur, wenn du es nicht schon von Volo hast \u2013 und nur, solange Volo noch im Goblinlager ist.":"Grat always sells the Greatsword +1. The Whispering Promise only if you don't already have it from Volo \u2013 and only while Volo is still in the Goblin Camp.","Dror Ragzlins Schatzkisten hinter dem Eisentor (X 298 / Y 66): SG 18 Fingerfertigkeit oder Drors Schl\xFCssel. Vorteil auf Nahkampf-Waffenangriffe, wenn 2+ Gegner im Umkreis von 3 m um dein Ziel stehen, +1 auf ST\xC4-Rettungsw\xFCrfe. Im Schatz liegt auch ein St\xFCck Infernales Eisen f\xFCr Dammon.":"Dror Ragzlin's treasure crates behind the iron gate (X 298 / Y 66): DC 18 Sleight of Hand or Dror's key. Advantage on melee weapon attacks when 2+ enemies stand within 3 m of your target, +1 to STR saving throws. The treasure also holds a piece of Infernal Iron for Dammon.","Guter Pfad: Minthara besiegen und pl\xFCndern (X 335 / Y 43). W\xE4hrend Konzentration nicht umsto\xDFbar und nicht verschiebbar, Konzentrationszauber geben Schwung, dazu +1 Athletik \u2013 ideal mit Krone des Wahnsinns und Hast.":"Good path: defeat and loot Minthara (X 335 / Y 43). While concentrating you can't be knocked prone or moved, concentration spells grant Momentum, plus +1 Athletics \u2013 ideal with Crown of Madness and Haste.","Verschlossene vergoldete Truhe s\xFCdwestlich des Wegpunkts (X 163 / Y \u2212248). Zugang z. B. \xFCber den Geheimgang im Zerschmetterten Heiligtum. Die tempor\xE4ren TP halten nur 2 Runden.":"Locked gilded chest south-west of the waypoint (X 163 / Y \u2212248). Access e.g. via the secret passage in the Shattered Sanctum. The temporary HP only last 2 turns.","40 gp (Ehrenmodus 590 gp), Derryth in der Ebonsee-Grotte (X \u221255 / Y \u221293). +2 S\xE4ureschaden pro Waffentreffer \u2013 doppelt wertvoll ab Zus\xE4tzlicher Angriff.":"40 gp (Honour Mode 590 gp), Derryth in Ebonlake Grotto (X \u221255 / Y \u221293). +2 acid damage per weapon hit \u2013 twice as valuable once you have Extra Attack.","+1, 2W6+1 Hieb, Spezialaktion Kolossaler Ansturm (Colossal Onslaught): trifft alle in einer Linie, +\xDCbungsbonus Schaden, profitiert von GWM. Kaufen oder pl\xFCndern. Greymon NICHT \xFCber die Athletik-Option im Dialog vom Flo\xDF sto\xDFen \u2013 dann ist die Beute dauerhaft weg. St\xF6\xDFt du ihn im Kampf ins Wasser, wird seine Leiche am S\xFCdpier des Verfallenen Dorfs angesp\xFClt.":"+1, 2d6+1 slashing, special action Colossal Onslaught: hits everyone in a line, +proficiency bonus damage, benefits from GWM. Buy or loot it. Do NOT shove Greymon off the raft via the Athletics option in dialogue \u2013 the loot is then lost for good. If you shove him into the water during combat, his body washes up at the southern pier of the Decrepit Village.","Seltener +1-Kurzbogen (190 gp): Treffer k\xF6nnen Ver\xE4ngstigt ausl\xF6sen (SG 12 Weisheit, 2 Runden); +1W4 auf Angriff und Schaden gegen ver\xE4ngstigte Ziele. Auf dem Flo\xDF pl\xFCndern oder sp\xE4ter bei Greymon in der Grymschmiede (X \u2212120 / Y \u221295) kaufen. Nicht per Athletik-Dialog vom Flo\xDF sto\xDFen.":"Rare +1 shortbow (190 gp): hits can inflict Frightened (DC 12 Wisdom, 2 turns); +1d4 to attack and damage against frightened targets. Loot it on the raft or buy it later from Greymon in the Grymforge (X \u2212120 / Y \u221295). Don't shove him off the raft via dialogue.","Schienen-Gussform (Splint Mould) auf einem Felsvorsprung bei X \u2212593 / Y 311 nahe Wegpunkt Alte Schmiede, dazu eines der zwei Mithrilerze. Beim ersten \xD6ffnen des Lavaventils erscheint Grym. RK 18, immun gegen Krits, \u22122 auf jeden erlittenen Schaden; Nahkampf-Angreifer taumeln.":"Splint Mould on a rock ledge at X \u2212593 / Y 311 near the Ancient Forge waypoint, plus one of the two Mithral Ores. The first time you open the lava valve, Grym appears. AC 18, immune to crits, \u22122 on all damage taken; melee attackers become Reeling.","Ungew\xF6hnliches +1-Gro\xDFschwert, tr\xE4gt Anders am Mauthaus der Aufgestiegenen Stra\xDFe (X 110 / Y 560). Tyrs Schutz als Bonusaktion, 1\xD7 pro kurzer Rast. Anders gibt es dir f\xFCr Karlachs Tod \u2013 oder du nimmst es ihm ab, wenn du dich auf Karlachs Seite stellst (empfohlen, so bekommst du Karlach als Gef\xE4hrtin).":"Uncommon +1 greatsword, carried by Anders at the Risen Road Toll House (X 110 / Y 560). Tyr's Protection as a bonus action, once per short rest. Anders gives it to you for Karlach's death \u2013 or you take it from him if you side with Karlach (recommended, so you get Karlach as a companion).","Prunkvolle Truhe in der Kammer des Inquisitors in der Krippe Y'llek (ca. X 1360 / Y \u2212657). +1W4 psychisch auf Waffenangriffe, solange du dich auf einen Zauber konzentrierst \u2013 mit Magischer Waffe ab Stufe 5 praktisch dauerhaft.":"Elegant chest in the Inquisitor's Chamber of the Cr\xE8che Y'llek (about X 1360 / Y \u2212657). +1d4 psychic on weapon attacks while you concentrate on a spell \u2013 with Magic Weapon from level 5 practically permanent.","90 gp, nord\xF6stlich des Wegpunkts Trielta-Klippen (X \u221243 / Y \u2212129). Sp\xE4tes Akt 1. Nach jedem Waffentreffer \u22121W4 auf den Rettungswurf des Ziels gegen deinen n\xE4chsten Zauber \u2013 laut bg3.wiki gilt der Malus per Bug sogar f\xFCr alle Rettungsw\xFCrfe in der Dauer.":"90 gp, north-east of the Trielta Crags waypoint (X \u221243 / Y \u2212129). Late Act 1. After every weapon hit \u22121d4 to the target's saving throw against your next spell \u2013 according to bg3.wiki a bug even applies it to all saving throws for the duration.","200 gp (Ehrenmodus 310 gp). +1 RK, +1 auf alle Rettungsw\xFCrfe. F\xE4llt das Gasthaus, stirbt Talli \u2013 sofort kaufen.":"200 gp (Honour Mode 310 gp). +1 AC, +1 to all saving throws. If the inn falls, Talli dies \u2013 buy it right away.","Araj Oblodra im Erdgeschoss ansprechen und Astarion \xFCberreden, sie zu bei\xDFen. Erledigen, bevor du die T\xFCrme st\xFCrmst. +2 ST\xC4 dauerhaft, auch \xFCber 20 \u2013 wirkt aber nicht, solange Elixier oder Panzerhandschuhe ST\xC4 fest setzen.":"Talk to Araj Oblodra on the ground floor and persuade Astarion to bite her. Do it before you storm the towers. +2 STR permanently, even above 20 \u2013 but it does nothing while an elixir or the Gauntlets set STR to a fixed value.","Tresort\xFCr n\xF6rdlich von Balthazars Vorraum (X \u2212822 / Y \u2212759): SG 30 Fingerfertigkeit, kein Schl\xFCssel \u2013 alternativ der Zauber Klopfen (Knock). Die Truhe ganz rechts enth\xE4lt den Ring. +2 glei\xDFend gegen hell beleuchtete Ziele \u2013 bei jeder Schadensinstanz.":"Vault door north of Balthazar's antechamber (X \u2212822 / Y \u2212759): DC 30 Sleight of Hand, no key \u2013 alternatively the spell Knock. The chest on the far right holds the ring. +2 radiant against brightly lit targets \u2013 on every damage instance.","Raphael besiegen. RK 21, Fliegen ohne Konzentration, Feuerresistenz, \u22123 Schaden aus allen Quellen, \xDCbung automatisch. Die passenden H\xF6llend\xE4mmerungs-Stiefel liegen in einer verschlossenen vergoldeten Truhe ganz oben in der Wyrmfelsen-Festung \u2013 vor Gortashs Kr\xF6nung nehmen, sonst werden er und die Stahlw\xE4chter dort feindlich.":"Defeat Raphael. AC 21, flight without concentration, fire resistance, \u22123 damage from all sources, automatic proficiency. The matching Helldusk Boots are in a locked gilded chest at the top of Wyrm's Rock Fortress \u2013 take them before Gortash's coronation, or he and the Steel Watchers there turn hostile.","Nur der Spiegel im Haus der Trauer (Kreuzgang der d\xFCsteren Umarmung) funktioniert, der in der Shar-Pr\xFCfung ist zerbrochen. Erst identifizieren: SG 20 Religion oder SG 25 Arkane Kunde (eine Figur reicht). Dann betet jede Figur einmal: SG 25 Religion \u2013 misslingt das, gibt es f\xFCr sie nie +2. Danach Erinnerungen opfern (je \u22122 auf ein Attribut bis zur langen Rast): mit Gebet etwa 60 % Chance pro Versuch auf +2 (bis max. 24). Mehr in der Anleitung.":"Only the mirror in the House of Grief (Cloister of Sombre Embrace) works, the one in the Gauntlet of Shar is broken. First identify it: DC 20 Religion or DC 25 Arcana (one character is enough). Then each character prays once: DC 25 Religion \u2013 if that fails, they can never get +2. Then sacrifice memories (each \u22122 to an ability until long rest): with the prayer about a 60% chance per attempt for +2 (up to 24). More in the guide.","Legend\xE4r, +3. Beide Drachenkopf-Fackeln mit Blitzschaden treffen, vier Pr\xFCfungen bestehen. Das Schwert liegt auf Ansurs Leichnam \u2013 Ansprechen oder Pl\xFCndern startet den Kampf gegen Ansur und zwei Wasser-Myrmidonen. Passiv: Der ST\xC4-Schaden wird verdoppelt, Vorteil gegen gro\xDFe und gr\xF6\xDFere Ziele \u2013 deine Endwaffe.":"Legendary, +3. Hit both dragon-head torches with lightning damage, pass four trials. The sword lies on Ansur's body \u2013 talking to him or looting starts the fight against Ansur and two Water Myrmidons. Passive: the STR damage is doubled, advantage against Large and bigger targets \u2013 your endgame weapon.","Auf dem Altar im Norden der H\xF6hle neben Ansur (X 636 / Y \u2212964). Seit Patch 8 kannst du ihn nehmen, ohne Ansur zu wecken. Heilt im Kampf 2 TP pro Zug, +1 RK und Rettungsw\xFCrfe, keine Krits gegen dich, immun gegen Bet\xE4ubung.":"On the altar in the north of the cave next to Ansur (X 636 / Y \u2212964). Since Patch 8 you can take it without waking Ansur. Heals 2 HP per turn in combat, +1 AC and saving throws, no crits against you, immune to Stunned.","Garantiert bei Grat (Goblinlager), zuf\xE4llig bei anderen H\xE4ndlern mit magischen Nahkampfwaffen":"Guaranteed at Grat (Goblin Camp), randomly at other traders with magic melee weapons","+1, Kolossaler Ansturm trifft alle in einer Linie (+\xDCbungsbonus Schaden, profitiert von GWM). H\xE4lt bis Akt 3.":"+1, Colossal Onslaught hits everyone in a line (+proficiency bonus damage, benefits from GWM). Lasts until Act 3.","Anders, Mauthaus der Aufgestiegenen Stra\xDFe \u2013 besiegen (Karlachs Seite) oder als Belohnung":"Anders, Risen Road Toll House \u2013 defeat him (Karlach's side) or as a reward","RK 18, Krit-Immunit\xE4t, \u22122 auf jeden erlittenen Schaden \u2013 perfekt f\xFCr einen Nahk\xE4mpfer mitten im Gedr\xE4nge.":"AC 18, crit immunity, \u22122 on all damage taken \u2013 perfect for a melee fighter in the thick of it.","RK 21, Fliegen ohne Konzentration, automatische \xDCbung, \u22123 Schaden aus allen Quellen. Die Feuerresistenz hast du als Roter Drachenbl\xFCtiger schon \u2013 f\xFCr die Glaskanone z\xE4hlen RK und Schadensreduktion.":"AC 21, flight without concentration, automatic proficiency, \u22123 damage from all sources. You already have fire resistance as a Red Dragonborn \u2013 for the glass cannon, AC and damage reduction count.","Temp-TP in H\xF6he des CHA-Mods (2 Runden), wenn ein Smite-Zauber einen Zustand ausl\xF6st; +1 auf KON-Rettungsw\xFCrfe (Konzentration f\xFCr Krone des Wahnsinns/Hast).":"Temp HP equal to your CHA modifier (2 turns) when a smite spell applies a condition; +1 to CON saving throws (concentration for Crown of Madness/Haste).","Vorteil, wenn 2+ Gegner im Umkreis von 3 m um dein Ziel stehen \u2013 gleicht den GWM-Malus aus und verdoppelt fast deine Krit-Chance.":"Advantage when 2+ enemies stand within 3 m of your target \u2013 offsets the GWM penalty and nearly doubles your crit chance.","Volo (Heiliger Teich, sp\xE4ter im Lager) oder Grat (Goblinlager)":"Volo (Sacred Pool, later at camp) or Grat (Goblin Camp)","Heilt Schattenherz dich, bekommst du 2 Runden +1W4 auf Angriffe und Rettungsw\xFCrfe \u2013 wie Segnen, stapelt aber nicht damit.":"When Shadowheart heals you, you get +1d4 to attacks and saving throws for 2 turns \u2013 like Bless, but it doesn't stack with it.","+1, Vorteil gegen Monstrosit\xE4ten, Mal des J\xE4gers 1\xD7 pro langer Rast. \xDCbergangsbogen bis zum Bogen der Todesfee.":"+1, advantage against monstrosities, Hunter's Mark once per long rest. Stopgap bow until the Bow of the Banshee.","+1, Treffer k\xF6nnen Ver\xE4ngstigt ausl\xF6sen (SG 12 Weisheit, 2 Runden); +1W4 auf Angriff und Schaden gegen ver\xE4ngstigte Ziele \u2013 perfekt nach deinem Gr\xE4sslichen Aussehen.":"+1, hits can inflict Frightened (DC 12 Wisdom, 2 turns); +1d4 to attack and damage against frightened targets \u2013 perfect after your Dreadful Aspect.","Lady Esther, Pfad zum Rosymorn-Kloster (90 gp, sp\xE4tes Akt 1)":"Lady Esther, Rosymorn Monastery Trail (90 gp, late Act 1)","+10 Schaden pro Treffer bei \u22125 Treffer, plus Bonusangriff nach Krit oder Kill mit einem Nahkampf-Waffenangriff. \u201EAll In\u201C nur mit Vorteil oder Segnen.":'+10 damage per hit at \u22125 to hit, plus a bonus attack after a crit or kill with a melee weapon attack. "All In" only with advantage or Bless.',"Man\xF6ver Riposte und Entwaffnender Angriff erg\xE4nzen den Zu-Fall-bringen-Angriff \u2013 Kampfmeisterin ab Stufe 3":"The manoeuvres Riposte and Disarming Attack complement Trip Attack \u2013 Battle Master from level 3","ST\xC4 21 bis zur langen Rast. Nur ein Elixier gleichzeitig. Tantchen Ethel verkauft 3 St\xFCck pro langer Rast, solange sie freundlich ist.":"STR 21 until long rest. Only one elixir at a time. Auntie Ethel sells 3 per long rest while she's friendly.","Bei einem Kill (1\xD7 pro Zug) eine zus\xE4tzliche Aktion und 5 tempor\xE4re TP. Bewusstlos schlagen z\xE4hlt nicht.":"On a kill (once per turn) an extra action and 5 temporary HP. Knocking out doesn't count.","Dein Standard-Elixier ab den Handschuhen \u2013 auf Ausgewogen bekommt die Aktion den vollen Extra-Angriff, im Ehrenmodus nur einen Angriff.":"Your standard elixir once you have the Gauntlets \u2013 on Balanced the action gets the full Extra Attack, in Honour Mode only one attack.","Du schl\xE4fst 2 Runden, danach Wirkung einer kurzen Rast und alle Zauberpl\xE4tze 1. und 2. Grades zur\xFCck. Wirst du geweckt, verf\xE4llt beides.":"You sleep for 2 turns, then get the effect of a short rest and all level 1 and 2 spell slots back. If you're woken, both are lost.","Smite-Nachschub zwischen zwei K\xE4mpfen \u2013 nicht mitten im Kampf.":"Smite refill between two fights \u2013 not in the middle of combat.","+2 auf Angriffsw\xFCrfe mit der beschichteten Waffe f\xFCr 10 Runden.":"+2 to attack rolls with the coated weapon for 10 turns.","10 tempor\xE4re TP und +1W4 auf Angriffs- und Rettungsw\xFCrfe bis zur langen Rast \u2013 stapelt sogar mit Segnen.":"10 temporary HP and +1d4 to attack rolls and saving throws until long rest \u2013 it even stacks with Bless.","Alternative \u2013 ein neues Elixier beendet den W4-Bonus, die TP bleiben.":"Alternative \u2013 a new elixir ends the d4 bonus, the HP stay.","Level 2 \u2013 auf Stufe 3 die ersten Ziele. Zauberwirker ohne Waffe (K\xE4ltestrahl, Nebelwolke, Stille) \u2013 also kein Aura-Bonus, aber n\xFCtzliche Kontrolle.":"Level 2 \u2013 the first targets at level 3. Spellcasters without a weapon (Ray of Frost, Fog Cloud, Silence) \u2013 so no aura bonus, but useful control.","Pfad zum Rosymorn-Kloster, Mondaufgangst\xFCrme":"Rosymorn Monastery Trail, Moonrise Towers","Laut bg3.wiki stehen NPCs, die im Schattenfluch sterben, nach ein, zwei Runden als schattenverfluchte Untote wieder auf und sind dann kontrollierbar. Ob das mit dem seltsamen Ochsen (Level 6 in Akt 2) klappt, ist nicht best\xE4tigt \u2013 eher ein Exploit.":"According to bg3.wiki, NPCs who die in the Shadow Curse rise again as Shadow-Cursed undead after a turn or two and can then be controlled. Whether this works with the Strange Ox (level 6 in Act 2) is not confirmed \u2013 more of an exploit.","Tiefling-Schmied in der Mulde des Smaragdhains. Akt 1: Jagdkurzbogen. Akt 2 im Letzten Licht: schmiedet aus Infernalem Eisen die fehlerhaften H\xF6llend\xE4mmerungs-Teile \u2013 je ein Eisen pro Teil.":"Tiefling smith in the Hollow of the Emerald Grove. Act 1: Hunting Shortbow. Act 2 at Last Light: forges the flawed Helldusk pieces from Infernal Iron \u2013 one iron per piece.","Barde mit kurzem Auftritt am Heiligen Teich. Verkauft Das fl\xFCsternde Versprechen f\xFCr 40 gp (Handel-Button unten links) \u2013 sp\xE4ter auch im Lager.":"Bard with a short performance at the Sacred Pool. Sells The Whispering Promise for 40 gp (trade button at the bottom left) \u2013 later at camp too.","Goblin-H\xE4ndler im Lager (X \u221299 / Y 424). Verkauft immer das Gro\xDFschwert +1; Das fl\xFCsternde Versprechen nur, wenn du es nicht von Volo hast und solange Volo im Lager ist.":"Goblin trader in the camp (X \u221299 / Y 424). Always sells the Greatsword +1; The Whispering Promise only if you don't have it from Volo and while Volo is in the camp.","Duergar auf dem Flo\xDF zur Grymschmiede. Tr\xE4gt Jorgorals Gro\xDFschwert und den Bogen der Todesfee, verkauft beides sp\xE4ter in der Grymschmiede. Nicht per Athletik-Dialog vom Flo\xDF sto\xDFen \u2013 sonst ist die Beute dauerhaft weg.":"Duergar on the raft to the Grymforge. Carries Jorgoral's Greatsword and the Bow of the Banshee, sells both later in the Grymforge. Don't shove him off the raft via the Athletics dialogue \u2013 or the loot is lost for good.","Verkauft den Umhang des Schutzes (200 gp) und Elixiere des Blutdursts. F\xE4llt das Letzte Licht, stirbt sie \u2013 sofort kaufen.":"Sells the Cloak of Protection (200 gp) and Elixirs of Bloodlust. If Last Light falls, she dies \u2013 buy right away.","Gr\xFCnes Weib in Verkleidung. Solange sie freundlich ist, verkauft sie 3\xD7 Elixier der H\xFCgelriesenst\xE4rke pro langer Rast. Unter 20 % TP feilscht sie im Versteck um ihr Leben \u2013 deine Chance auf das Haar.":"Green hag in disguise. While she's friendly she sells 3\xD7 Elixir of Hill Giant Strength per long rest. Below 20% HP she bargains for her life in her hideout \u2013 your chance at the hair.","Vorher Elixiere kaufen: Solange Ethel im Hain freundlich ist, verkauft sie 3\xD7 Elixier der H\xFCgelriesenst\xE4rke, aufgef\xFCllt nach jeder langen Rast oder jedem Stufenaufstieg. Sobald sie ihre Vettel-Gestalt zeigt, flieht oder im Teehaus stirbt, ist ihr Laden f\xFCr immer zu.":"Buy elixirs first: while Ethel is friendly in the Grove she sells 3\xD7 Elixir of Hill Giant Strength, restocked after every long rest or level-up. As soon as she reveals her hag form, flees or dies at the teahouse, her shop is closed for good.","Den Kampf im Versteck austragen (Uferteehaus \u2192 \xFCberwucherter Tunnel). Im Teehaus verhandelt sie nie \u2013 auch nicht unter 20 % TP.":"Fight in her hideout (Riverside Teahouse \u2192 overgrown tunnel). At the teahouse she never bargains \u2013 not even below 20% HP.","Ethel unter 20 % ihrer maximalen TP bringen und ihren Zug abwarten. Nicht verstummen lassen (Stille), nicht bewusstlos schlagen \u2013 dann kann sie nicht verhandeln. Keine Schadensfl\xE4chen (Feuer, S\xE4ure) um sie herum, die sie vor ihrem Zug t\xF6ten k\xF6nnten.":"Bring Ethel below 20% of her maximum HP and wait for her turn. Don't silence her (Silence) or knock her out \u2013 then she can't bargain. No damaging surfaces (fire, acid) around her that could kill her before her turn.","Droughnir m\xF6glichst nah an sie stellen \u2013 viele Spieler berichten, dass sie die n\xE4chststehende Figur anspricht (laut bg3.wiki nicht best\xE4tigt).":"Place Droughnir as close to her as possible \u2013 many players report she addresses the nearest character (not confirmed by bg3.wiki).","In ihrem Zug bettelt sie: SG 20 T\xE4uschen oder Einsch\xFCchtern (K\xE4mpfer und Barbaren: SG 15 Einsch\xFCchtern mit Vorteil). Erfolg = Haar plus befreite Mayrina, Ethel kommt frei.":"On her turn she begs: DC 20 Deception or Intimidation (Fighters and Barbarians: DC 15 Intimidation with advantage). Success = hair plus freed Mayrina, Ethel goes free.","G\xF6ttliche F\xFChrung (Guidance) vorher im Kampf wirken, nicht erst im W\xFCrfel-Dialog: Im Ehrenmodus vor Patch 7 brach ein Zauber dort die Verhandlung ab und das Haar war weg. Bardische Inspiration funktioniert immer.":"Cast Guidance beforehand in combat, not in the dice dialogue: in Honour Mode before Patch 7 a spell there broke off the bargain and the hair was lost. Bardic Inspiration always works.","Misslingt eine Probe, ist die andere gesperrt. Dann bleiben: Deal annehmen (Haar, Ethel beh\xE4lt Mayrina), Mayrina befreien oder Ethel t\xF6ten.":"If one check fails, the other is locked. Then you're left with: accept the deal (hair, Ethel keeps Mayrina), free Mayrina or kill Ethel.","Haar essen und ein Attribut w\xE4hlen: +1 dauerhaft, ohne Obergrenze. Wirkt nicht auf Werte, die Items oder Elixiere fest setzen.":"Eat the hair and choose an ability: +1 permanently, uncapped. Doesn't affect scores that items or elixirs set to a fixed value.","Eid: Jeder Deal mit Ethel bricht den Paladin-Eid. Als Eidbrecher egal \u2013 planst du die R\xFCckkehr zur Rache, das Haar vorher holen oder die Kosten einplanen.":"Oath: any deal with Ethel breaks the paladin oath. Irrelevant as an Oathbreaker \u2013 if you plan to return to Vengeance, get the hair first or budget the cost.","Schienen-Gussform holen: auf einem Felsvorsprung \xFCber den Lavabecken nahe dem Wegpunkt Alte Schmiede (X \u2212593 / Y 311).":"Get the Splint Mould: on a rock ledge above the lava pools near the Ancient Forge waypoint (X \u2212593 / Y 311).","Auf die Plattform der Schmiede (X \u2212558 / Y 230). Erz und Gussform in ihre Kammern legen \u2013 die Gussform-Kammer liegt neben dem Tiegel.":"Onto the forge platform (X \u2212558 / Y 230). Put the ore and mould into their chambers \u2013 the mould chamber is next to the crucible.","Hebel in der Mitte des Podests ziehen \u2013 der Hammer senkt sich. Die Plattform muss unten sein; der Knopf hinter dem Hebel hebt sie an, dann funktioniert die Schmiede nicht.":"Pull the lever in the middle of the dais \u2013 the hammer lowers. The platform must be down; the button behind the lever raises it, and then the forge doesn't work.","Hammer erneut fallen lassen, dann mit dem Hebel neben der Kammer die Gussform auswerfen und die R\xFCstung aufheben. Tipp: Droughnir ist Gildenhandwerker \u2013 hebt er das erste St\xFCck selbst auf, bekommt er die Inspiration Art Endures.":"Drop the hammer again, then eject the mould with the lever next to the chamber and pick up the armour. Tip: Droughnir is a Guild Artisan \u2013 if he picks up the first piece himself, he gets the inspiration Art Endures.","In der Eulenb\xE4renh\xF6hle (X \u2212321 / Y \u2212135) hinten zur versiegelten Sel\xFBne-Truhe.":"Go to the sealed Sel\xFBne chest in the back of the Owlbear Nest (X \u2212321 / Y \u2212135).","Hinter der Sel\xFBne-Statue liegt das Gebetsblatt auf dem Boden (Wahrnehmung).":"The prayer page lies on the ground behind the Sel\xFBne statue (Perception).","Das Gebet vor der Truhe vorlesen \u2013 sie \xF6ffnet sich. Effekt des Anh\xE4ngers: bei 50 % TP oder weniger keine Gelegenheitsangriffe. Legst du ihn erst an, wenn du schon darunter bist, greift er erst nach dem n\xE4chsten Schaden oder der n\xE4chsten Heilung.":"Read the prayer aloud in front of the chest \u2013 it opens. Pendant effect: at 50% HP or less no opportunity attacks. If you put it on while already below that, it only kicks in after the next damage or healing.","Im Westfl\xFCgel des Wyrmfelsen-Gef\xE4ngnisses beide Drachenkopf-Fackeln mit Blitzschaden treffen (Schockgriff, Hexenpfeil, Blitzpfeile). Die Flammen werden blau, die Wand dazwischen wird passierbar. Vorsicht: Angriffe k\xF6nnen Wachen alarmieren.":"In the west wing of the Wyrm's Rock prison, hit both dragon-head torches with lightning damage (Shocking Grasp, Witch Bolt, Lightning Arrows). The flames turn blue and the wall between them becomes passable. Careful: attacks can alert guards.","Pr\xFCfung der Gerechtigkeit: Zuerst den Richter-Schatten vor den Gem\xE4lden magisch entfernen (Fluch brechen auf jedes Gem\xE4lde, Verbannung oder Untote vertreiben). Dann \u201EDie Zelle\u201C auf das Pult legen \u2013 Freiheit oder Henken rufen Untote.":'Trial of Justice: first remove the Judge shadow in front of the paintings with magic (Remove Curse on each painting, Banishment or Turn Undead). Then place "The Cell" on the bookstand \u2013 Freedom or The Hanging summon undead.',"Pr\xFCfung der Einsicht: Die B\xFCcher lassen sich mit SG 15 Fingerfertigkeit fangen (ein Versuch pro Figur) oder mit Befehl stoppen. Die L\xF6sung: den Geist Suelto am Ende der Kammer angreifen (1 TP) \u2013 seine B\xFCcher zeigen eine grausame Ideologie.":"Trial of Insight: the books can be caught with DC 15 Sleight of Hand (one attempt per character) or stopped with Command. The solution: attack the ghost Suelto at the end of the chamber (1 HP) \u2013 his books reveal a cruel ideology.","Pr\xFCfung der Strategie: Lanzenbrett-R\xE4tsel \u2013 Schwarz in zwei Z\xFCgen mattsetzen, drei Versuche. Alternative: den schwarzen K\xF6nig mit Blitzschaden zerst\xF6ren (50 TP auf Ausgewogen). Gale kennt die L\xF6sung.":"Trial of Strategy: lanceboard puzzle \u2013 checkmate black in two moves, three attempts. Alternative: destroy the black king with lightning damage (50 HP on Balanced). Gale knows the solution.","Pr\xFCfung des Mutes: Wer die Statue ber\xFChrt, tr\xE4gt die Fackel. 4 Runden \xFCberleben, nicht zu Boden gehen und den Raum nicht verlassen. Heiligtum oder ein Trank der universellen Resistenz auf dem Tr\xE4ger machen es leicht.":"Trial of Courage: whoever touches the statue carries the torch. Survive 4 turns, don't go down and don't leave the room. Sanctuary or a Potion of Universal Resistance on the carrier makes it easy.","Danach \xF6ffnet sich das Heiligtum. Baldurans Riesent\xF6ter liegt auf Ansurs Leichnam \u2013 Ansprechen oder Pl\xFCndern startet den Kampf gegen Ansur und zwei Wasser-Myrmidonen. Den Helm des Balduran auf dem Altar im Norden kannst du seit Patch 8 nehmen, ohne Ansur zu wecken.":"Then the sanctum opens. Balduran's Giantslayer lies on Ansur's body \u2013 talking to him or looting starts the fight against Ansur and two Water Myrmidons. Since Patch 8 you can take the Helm of Balduran from the altar in the north without waking Ansur.","Der Spiegel in der Shar-Pr\xFCfung (Akt 2) ist zerbrochen \u2013 nutzbar ist nur der im Haus der Trauer (Kreuzgang der d\xFCsteren Umarmung, Akt 3).":"The mirror in the Gauntlet of Shar (Act 2) is broken \u2013 only the one in the House of Grief (Cloister of Sombre Embrace, Act 3) is usable.","Spiegel identifizieren: SG 20 Religion oder SG 25 Arkane Kunde \u2013 eine Figur reicht. Alternativ die hastige Notiz in der Nachtorchideen-H\xF6hle lesen.":"Identify the mirror: DC 20 Religion or DC 25 Arcana \u2013 one character is enough. Alternatively read the hastily written note in the Night Orchid cave.","Jede Figur betet einmal: SG 25 Religion. Misslingt das Gebet, ist +2 f\xFCr diese Figur nie mehr m\xF6glich \u2013 vorher alle Boni auf Religion sammeln.":"Each character prays once: DC 25 Religion. If the prayer fails, +2 is never possible for that character \u2013 gather every Religion bonus beforehand.","Erinnerungen opfern (bis zu 6, je eine pro Attribut): Jede kostet \u22122 auf das Attribut bis zur langen Rast oder bis Fluch brechen bzw. M\xE4chtige Genesung. Nach erfolgreichem Gebet etwa 60 % Chance pro Versuch auf +2 (bis max. 24), 20 % auf Patriars Erinnerung (+1 CHA).":"Sacrifice memories (up to 6, one per ability): each costs \u22122 to that ability until long rest or until Remove Curse or Greater Restoration. After a successful prayer about a 60% chance per attempt for +2 (up to 24), 20% for Patriar's Memory (+1 CHA).","In BG3 sind das zwei getrennte Reaktionen: die normale l\xF6st bei Krits nicht aus, \u201EG\xF6ttliches Niederstrecken: Kritischer Treffer\u201C nur bei Krits (4W8 auf Grad 1). Beide einzeln einstellen.":`In BG3 these are two separate reactions: the normal one doesn't trigger on crits, "Divine Smite: Critical Hit" only on crits (4d8 at level 1). Set both individually.`,"Ein humanoides Ziel legt einen Weisheitsrettungswurf ab, sonst ist es gel\xE4hmt. Am Ende jedes seiner Z\xFCge darf es erneut w\xFCrfeln. Angriffe treffen automatisch, aus 3 m oder weniger sind sie immer kritisch.":"A humanoid target makes a Wisdom saving throw or is paralysed. It may reroll at the end of each of its turns. Attacks hit automatically, and from 3 m or less they are always critical.","Endet Hast vorzeitig, ist das Ziel einen Zug lethargisch: keine Bewegung, keine Aktionen, keine Reaktionen. Deshalb lieber Gale halten lassen. Im Ehrenmodus erlaubt die Hast-Aktion wie am Tisch nur einen einzelnen Angriff, keinen Extra-Angriff.":"If Haste ends early, the target is lethargic for a turn: no movement, no actions, no reactions. That's why Gale should hold it. In Honour Mode the Haste action only allows a single attack, as on the tabletop, no Extra Attack.","Waffenangriff \xB7 bei Treffer Bonusaktion":"Weapon attack \xB7 bonus action on hit","Nur mit Vorteil, Segnen oder gegen niedrige RK aktiv lassen. Gilt nur f\xFCr zweih\xE4ndig gef\xFChrte Waffen, mit denen du ge\xFCbt bist.":"Only keep it on with advantage, Bless or against low AC. Only applies to two-handed weapons you're proficient with.","Smite-Nachschub zwischen zwei K\xE4mpfen ohne Rast \u2013 im Kampf weckt dich jeder Treffer und der Trank verpufft.":"Smite refill between two fights without a rest \u2013 in combat any hit wakes you and the potion is wasted.","Gro\xDFschwert mit Meisterschaft gro\xDFer Waffen \u2013 \u201EAll In\u201C nur mit Gel\xFCbde, Vorteil oder Segnen.":'Greatsword with Great Weapon Master \u2013 "All In" only with the Vow, advantage or Bless.',"Gro\xDFschwert mit Meisterschaft gro\xDFer Waffen \u2013 \u201EAll In\u201C nur mit Vorteil oder Segnen.":'Greatsword with Great Weapon Master \u2013 "All In" only with advantage or Bless.',"Stufen 1\u20135 sind bei allen Rache-Wegen gleich. Abhaken setzt dein Level automatisch mit.":"Levels 1\u20135 are the same on all Vengeance routes. Ticking also sets your level automatically.","Stufen 1\u20137 sind bei allen Eidbrecher-Wegen gleich. Abhaken setzt dein Level automatisch mit.":"Levels 1\u20137 are the same on all Oathbreaker routes. Ticking also sets your level automatically.","Eidbrecher-Wege":"Oathbreaker routes",GES:"DEX",KON:"CON",WEI:"WIS",INT:"INT",CHA:"CHA","Eid-Ladung":"Channel Oath","Warum f\xFCr dich":"Why it's for you","Orte & NPCs":"Places & NPCs","NPCs hier":"NPCs here","Kontrollierbare Untote":"Controllable undead","Items hier":"Items here",Wo:"Where",Mechanik:"Mechanics","F\xFCr Droughnir":"For Droughnir",Achtung:"Warning","Wer & wann":"Who & when","Passende Items":"Matching items",Wirkung:"Effect","Wer ist Droughnir?":"Who is Droughnir?",Steckbrief:"Profile","Attribute \xB7":"Abilities \xB7","Volk: Roter Drachenbl\xFCtiger":"Race: Red Dragonborn",Spielweise:"Playstyle",St\u00E4rken:"Strengths",Schw\u00E4chen:"Weaknesses","Kern-F\xE4higkeiten":"Core abilities","Fahrplan \xB7":"Roadmap \xB7","Rolle f\xFCr Droughnir":"Role for Droughnir","Build-Empfehlung":"Build recommendation","Buffs & Heilung f\xFCr Droughnir":"Buffs & healing for Droughnir","Items f\xFCr sie/ihn":"Items for them","Schritt f\xFCr Schritt":"Step by step","Attribut-Stand":"Ability state","Tabs, Buttons, \xDCberschriften, Tabellenk\xF6pfe.":"Tabs, buttons, headings, table headers.","Erkl\xE4rungen, Tipps, Fundorte, Checkliste.":"Explanations, tips, locat l anklicken \xF6ffnet die Details, Name anklicken wechselt das Item. Ring 1 und Ring 2 k\xF6nnen nicht denselben Ring tragen.":"Click the icon for details, click the name to switch the item. Ring 1 and Ring 2 can't hold the same ring.","tempor\xE4re TP (Heldenmut)":"temporary HP (Heroism)","Droughnirs Upgrade-Pfade":"Droughnir's upgrade paths","Pro Slot von der Startausr\xFCstung bis zum Endgame. Karte anklicken \xF6ffnet die Details; \u201EIm Besitz\u201C ist mit der Checkliste verbunden, \u201EAnlegen\u201C r\xFCstet sofort aus.":'Per slot from starting equipment to endgame. Click a card for details; "Owned" is linked to the checklist, "Equip" equips it right away.',"Begleiter-Ausr\xFCstung":"Companion equipment","Items, die nicht Droughnir tr\xE4gt, sondern seine Unterst\xFCtzer.":"Items worn not by Droughnir but by his supporters.","Alles im Besitz.":"Everything owned.","Nur ein Elixier kann gleichzeitig aktiv sein \u2013 das aktive flie\xDFt in die Werte oben ein.":"Only one elixir can be active at a time \u2013 the active one feeds into the values above.","Aktives Elixier \u2013 entfernen":"Active elixir \u2013 remove","Als aktives Elixier setzen":"Set as active elixir","Kampfwerte, Effekte & Boni":"Combat values, effects & bonuses",Einklappen:"Collapse",Aufklappen:"Expand","\u2300 Schaden/Treffer":"\u2300 damage/hit",Anlegen:"Equip","Gesamt-RK":"Total AC","Schadensred.":"Damage red.",Zauberangriff:"Spell attack","Ausger\xFCstet \u2013 ablegen":"Equipped \u2013 unequip",Keines:"None",Heldenmut:"Heroism","Paladin-Startausr\xFCstung":"Paladin starting equipment","Paladin-Startausr\xFCstung auf der Nautiloid, zusammen mit Holzschild und zwei Wurfspeeren":"Paladin starting equipment on the Nautiloid, together with a Wooden Shield and two Javelins","Paladin-Startausr\xFCstung des Eids der Rache \u2013 jeder Eid hat seine eigene Schuppenpanzer-Variante":"Oath of Vengeance paladin starting equipment \u2013 every oath has its own scale mail variant","Kein Teil der offiziellen Paladin-Startausr\xFCstung (laut bg3.wiki: Kriegshammer, Holzschild, zwei Wurfspeere) \u2013 gew\xF6hnliche Gro\xDFschwerter gibt es fr\xFCh bei Waffenh\xE4ndlern und von Gegnern":"Not part of the official paladin starting equipment (per bg3.wiki: Warhammer, Wooden Shield, two Javelins) \u2013 common greatswords are available early from weapon traders and enemies","2W6 Hieb, zweih\xE4ndig. Grundlage f\xFCr Kampf mit gro\xDFen Waffen und GWM \u2013 Droughnirs Waffe f\xFCr den Glaskanonen-Build, bis das Gro\xDFschwert +1 da ist.":"2d6 slashing, two-handed. The basis for Great Weapon Fighting and GWM \u2013 Droughnir's weapon for the glass-cannon build until the Greatsword +1 arrives.","1W8 Wucht (vielseitig: zweih\xE4ndig 1W10). Mit dem Holzschild +2 RK \u2013 sicherer, aber ohne Kampf mit gro\xDFen Waffen und GWM. F\xFCr die Glaskanone nur die Notl\xF6sung.":"1d8 bludgeoning (versatile: two-handed 1d10). With the Wooden Shield +2 AC \u2013 safer, but without Great Weapon Fighting and GWM. Only a stopgap for the glass cannon.","Mittlere R\xFCstung: RK 14 + GES (max. 2), Nachteil auf Heimlichkeit. Mit GES 10 also RK 14 \u2013 so fr\xFCh wie m\xF6glich durch den Adamant-Schienenpanzer ersetzen.":"Medium armour: AC 14 + DEX (max. 2), disadvantage on Stealth. With DEX 10 that's AC 14 \u2013 replace it with the Adamantine Splint Armour as early as possible.","Keine Boni \u2013 nur ein Platzhalter bis zu den Stiefeln des Schreitens.":"No bonuses \u2013 just a placeholder until the Boots of Striding.",Holzschild:"Wooden Shield","Oben, was Droughnir gerade tr\xE4gt \u2013 Name anklicken zum Wechseln, Symbol f\xFCr Details. Darunter die Upgrade-Pfade vom Start bis Akt 3, die Begleiter-Ausr\xFCstung sowie Tr\xE4nke & Elixiere.":"At the top, what Droughnir is wearing right now \u2013 click a name to switch, the icon for details. Below: the upgrade paths from start to Act 3, companion equipment, and potions & elixirs.","Ihre Trickserei-Dom\xE4ne hilft dir kaum. Licht gilt in Patch-8-Guides als beste Allround-Wahl, Leben, wenn sie die einzige Heilerin ist. Sie ist kein Eidbrecher, Der Verdorrte skillt sie ganz normal um. Erstes Talent f\xFCr sie: Kampferprobter Zauberwirker (War Caster), damit Segnen h\xE4lt. Der komplette Levelbaum steht im Level-Guide.":"Her Trickery Domain barely helps you. Patch 8 guides rate Light as the best all-round choice, Life if she's the only healer. She isn't an Oathbreaker, so Withers respecs her normally. Her first feat: War Caster, so Bless holds. The full level tree is in the Level Guide.","ST\xC4 17 ohne Ethels Haar ausgleichen":"Compensate STR 17 without Ethel's Hair","Ohne Haar bleibt ST\xC4 17 (+3) \u2013 bis zu den Panzerhandschuhen in Akt 3 je \u22121 auf Treffer und Schaden, rund \u221214 % Schaden pro Zug. Ausgleich: vor harten K\xE4mpfen das Elixier der H\xFCgelriesenst\xE4rke (ST\xC4 21 = +5). Gibt es auch ohne Ethel: Derryth Bonecloak (Myconid-Kolonie), Lady Esther (Pfad zum Rosymorn-Kloster), sp\xE4ter Araj Oblodra, Talli und Mattis (Gasthaus Letztes Licht). Der Trank der ewigen Kraft bringt dich in Akt 2 auf 19 (+4).":"Without the hair STR stays 17 (+3) \u2013 until the Gauntlets in Act 3 that's \u22121 to hit and \u22121 damage each, about \u221214% damage per turn. Compensation: drink the Elixir of Hill Giant Strength (STR 21 = +5) before hard fights. You can get it without Ethel too: Derryth Bonecloak (Myconid Colony), Lady Esther (Rosymorn Monastery Trail), later Araj Oblodra, Talli and Mattis (Last Light Inn). The Potion of Everlasting Vigour brings you to 19 (+4) in Act 2.","Tantchen Ethels Haar \u2192 +1 ST\xC4 (optional)":"Auntie Ethel's Hair \u2192 +1 STR (optional)","Nicht bekommen? Kein Problem \u2013 der Plan rechnet ohne Haar, siehe \u201EST\xC4 17 ohne Ethels Haar ausgleichen\u201C. Nur im Versteck im \xFCberwucherten Tunnel \u2013 im Uferteehaus verhandelt sie nie, auch nicht unter 20 % TP. Unter 20 % TP bringen und ihren Zug abwarten. Nicht verstummen lassen, nicht bewusstlos schlagen. SG 20 T\xE4uschen oder Einsch\xFCchtern (K\xE4mpfer und Barbaren: SG 15 Einsch\xFCchtern mit Vorteil). Erfolg = Haar + Mayrina frei, Ethel geht. Misslingt eine Probe, ist die andere gesperrt \u2013 den Deal kannst du dann noch annehmen. Achtung Rache-Weg: Jeder Deal mit ihr bricht den Paladin-Eid. Details in der Anleitung.":`Didn't get it? No problem \u2013 the plan calculates without the hair, see "Compensate STR 17 without Ethel's Hair". Only in the hideout in the Overgrown Tunnel \u2013 at the Riverside Teahouse she never bargains, not even below 20% HP. Bring her below 20% HP and wait for her turn. Don't silence her, don't knock her out. DC 20 Deception or Intimidation (Fighters and Barbarians: DC 15 Intimidation with advantage). Success = hair + Mayrina freed, Ethel leaves. If one check fails, the other is locked \u2013 you can still accept the deal. Careful on the Vengeance route: any deal with her breaks the paladin oath. Details in the guide.`,"Dammon (Mulde im Smaragdhain, X 177 / Y 562)":"Dammon (Hollow in the Emerald Grove, X 177 / Y 562)","Nautiloid (Prolog): tr\xE4gt Kommandant Zhalk am Steuer \u2013 alternativ per Befehl \u201EFallenlassen\u201C abnehmen":"Nautiloid (prologue): carried by Commander Zhalk at the helm \u2013 or take it with Command: Drop","2W6 Hieb + 1W4 Feuer, ignoriert nicht-magische Hiebresistenz. Bestes fr\xFChes Gro\xDFschwert \u2013 nur im Prolog zu holen.":"2d6 slashing + 1d4 fire, ignores non-magical slashing resistance. Best early greatsword \u2013 only obtainable in the prologue.","Waukeens Rast: tr\xE4gt Gauntlet Yeva \u2013 lebt sie, sp\xE4ter im Kaulquappen-Zentrum (Akt 2)":"Waukeen's Rest: carried by Gauntlet Yeva \u2013 if she survives, later in the Tadpoling Centre (Act 2)","+1, 2W6 Hieb. Passiv: +1W4 auf Angriffe gegen Ziele, die schon Schaden genommen haben \u2013 laut Wiki f\xFCr alle Nahkampf-Waffenangriffe. Echte Alternative zum Gro\xDFschwert +1.":"+1, 2d6 slashing. Passive: +1d4 to attack rolls against targets that have already taken damage \u2013 per the wiki for all melee weapon attacks. A real alternative to the Greatsword +1.","Mordtribunal: tr\xE4gt Sarevok Anchev":"Murder Tribunal: carried by Sarevok Anchev","+2, 2W6 Hieb + 1W4 nekrotisch; jeder Schadenstreffer heilt dich um 1W6. Alternative zum Riesent\xF6ter, wenn du mehr Selbstheilung willst.":"+2, 2d6 slashing + 1d4 necrotic; every damaging hit heals you for 1d6. Alternative to the Giantslayer if you want more self-healing.","Schmiede der Neun: H\xE4ndler Dammon":"Forge of the Nine: trader Dammon","RK 20, schwer, \u22122 auf jeden erlittenen Schaden, dauerhaft Resistance (+1W4 auf Rettungsw\xFCrfe) und Blade Ward (Resistenz gegen Wucht, Stich und Hieb). Defensiv-Alternative zur H\xF6llend\xE4mmerr\xFCstung.":"AC 20, heavy, \u22122 to all damage taken, permanent Resistance (+1d4 to saving throws) and Blade Ward (resistance to bludgeoning, piercing and slashing). Defensive alternative to the Helldusk Armour.","Verfallenes Dorf: in der moosbewachsenen Truhe":"Blighted Village: in the Moss-Covered Chest","Zu Kampfbeginn 3 Z\xFCge Schwung: +1,5 m Bewegung pro verbleibendem Zug \u2013 schneller am Gegner. Fr\xFCher Helm, bis der Helm des Niederstreckens da ist.":"At the start of combat 3 turns of Momentum: +1.5 m movement per remaining turn \u2013 reach enemies faster. Early helmet until the Helmet of Smiting.","+2 auf Angriff und Schaden mit Waffen, ST\xC4-Rettung +1. Damage-Alternative zu den Panzerhandschuhen, sobald deine ST\xC4 anders hoch ist.":"+2 to attack and damage with weapons, STR saves +1. Damage alternative to the Gauntlets once your STR is high from another source.","Grymschmiede: tr\xE4gt Nere":"Grymforge: worn by Nere","Immun gegen Netz, Verstrickt und Ausrutschen; Misty Step als Bonusaktion, einmal pro kurzer Rast \u2013 bringt dich sofort an den Gegner.":"Immune to webs, Entangled and slipping; Misty Step as a bonus action once per short rest \u2013 gets you to the enemy instantly.","Ebonsee-Grotte: tr\xE4gt Thulla":"Ebonlake Grotto: worn by Thulla","Bonusaktion \u201EClick Heels\u201C: mehr Tempo und Bewegungsfreiheit. Laut Wiki-Bug trifft der Nachteil deine eigenen Reaktionsangriffe statt die der Gegner.":`Bonus action "Click Heels": more speed and freedom of movement. Per a wiki-noted bug the disadvantage hits your own reaction attacks instead of the enemies'.`,"Wyrmfels-Festung: verschlossene Goldtruhe im obersten Stock":"Wyrm's Rock Fortress: locked gilded chest on the top floor","Ignoriert schwieriges Gel\xE4nde, kann nicht verschoben werden; fehlgeschlagenen Rettungswurf per Reaktion schaffen (laut Wiki einmal pro Rast); Teleport mit 2W8 Feuer als Bonusaktion.":"Ignores difficult terrain, can't be moved by force; turn a failed saving throw into a success with a reaction (per the wiki once per rest); bonus-action teleport with 2d8 fire.","Wyrms\xFCbergang: H\xE4ndler Entharl Danthelon (Danthelons Tanzende Axt)":"Wyrm's Crossing: trader Entharl Danthelon (Danthelon's Dancing Axe)","Zu Beginn deines Zugs haben Gegner Nachteil auf Angriffe gegen dich, bis du Schaden nimmst.":"At the start of your turn enemies have disadvantage on attacks against you until you take damage.","Entweihter Tempel (Gemach von Gut) oder bei Omeluum in der Ebonsee-Grotte \u2013 nur einmal erh\xE4ltlich":"Defiled Temple (Gut's chambers) or from Omeluum in the Ebonlake Grotto \u2013 obtainable only once","Misty Step als Bonusaktion, einmal pro kurzer Rast. Fr\xFChes Amulett f\xFCr schnelles Ranlaufen.":"Misty Step as a bonus action once per short rest. Early amulet for closing the distance.","Pfad zum Rosymorn-Kloster: H\xE4ndlerin Lady Esther":"Rosymorn Monastery Trail: trader Lady Esther","Wirst du niedergeschlagen, stabilisierst du dich automatisch; jede Heilung auf dich heilt den Maximalwert \u2013 stark mit Schattenherz' Heilendem Wort.":"If you're downed you stabilise automatically; every heal on you heals the maximum \u2013 strong with Shadowheart's Healing Word.","Smaragdhain: Belohnung von Mol f\xFCr \u201EStehlt das heilige G\xF6tzenbild\u201C":'Emerald Grove: reward from Mol for "Steal the Sacred Idol"',"+1 RK und +1 auf alle Rettungsw\xFCrfe \u2013 die defensive Ring-Alternative.":"+1 AC and +1 to all saving throws \u2013 the defensive ring alternative.","Mondaufgangst\xFCrme: H\xE4ndlerin Araj Oblodra (verpasst? Sp\xE4ter im Purpurtrunk, Unterstadt)":"Moonrise Towers: trader Araj Oblodra (missed it? Later at the Crimson Draughts, Lower City)","Vorteil auf alle Angriffsw\xFCrfe, Nachteil auf alle Rettungsw\xFCrfe. F\xFCr die Glaskanone fast doppelte Krit-Chance \u2013 aber gef\xE4hrlich gegen Kontrollzauber.":"Advantage on all attack rolls, disadvantage on all saving throws. Nearly doubles crit chance for the glass cannon \u2013 but dangerous against control spells.","Shar-Pr\xFCfung: Selbstgleiche Pr\xFCfung, neben dem Kohlebecken":"Gauntlet of Shar: Self-Same Trial, next to the brazier","Nach einem Kill ist dein n\xE4chster Waffenangriff ein garantierter Krit (einmal pro langer Rast) \u2013 perfekt f\xFCr einen Krit-Smite.":"After a kill your next weapon attack is a guaranteed crit (once per long rest) \u2013 perfect for a crit smite.","Ohne Ethels Haar: ST\xC4 19 (mit Trank der ewigen Kraft) \u2192 20. Tr\xE4gst du schon die Panzerhandschuhe (ST\xC4 23), nimm lieber CHA +2.":"Without Ethel's Hair: STR 19 (with Potion of Everlasting Vigour) \u2192 20. If you already wear the Gauntlets (STR 23), take CHA +2 instead.","Auf Dom\xE4ne des Lichts umskillen (Leben, wenn sie die einzige Heilerin ist); erstes Talent Kampferprobter Zauberwirker":"Respec to Light Domain (Life if she's the only healer); first feat War Caster","Hast lieber Gale \xFCberlassen; Schattenherz mit Kampferprobter Zauberwirker":"Better leave Haste to Gale; Shadowheart with War Caster","ST\xC4 21 bis zur langen Rast. Nur ein Elixier gleichzeitig. Ethel verkauft 3 St\xFCck pro langer Rast; ohne sie bei Derryth Bonecloak, Lady Esther, Araj Oblodra, Talli und Mattis, oder per Alchemie aus H\xFCgelriesen-Fingern.":"STR 21 until long rest. Only one elixir at a time. Ethel sells 3 per long rest; without her from Derryth Bonecloak, Lady Esther, Araj Oblodra, Talli and Mattis, or via alchemy from Hill Giant fingers.","Kampferprobter Zauberwirker oder Belastbar (KON) f\xFCr die Konzentration":"War Caster or Resilient (CON) for concentration","+1 \xB7 +1W4 Treffer gegen Verletzte":"+1 \xB7 +1d4 to hit against wounded targets","RK 20 \xB7 \u22122 Schaden \xB7 Resistenzen":"AC 20 \xB7 \u22122 damage \xB7 resistances","Mehr Bewegung zu Kampfbeginn":"More movement at the start of combat","+2 Treffer & Schaden mit Waffen":"+2 to hit & damage with weapons","Nachteil f\xFCr Angreifer":"Disadvantage for attackers","Misty Step pro kurzer Rast":"Misty Step per short rest","Vorteil auf Angriffe \xB7 Nachteil auf Rettung":"Advantage on attacks \xB7 disadvantage on saves","Kill \u2192 n\xE4chster Angriff ist Krit":"Kill \u2192 next attack is a crit","Gerade kein Unterschied \u2013 ST\xC4 wird fest gesetzt durch:":"No difference right now \u2013 STR is set by:","mit Haar":"with hair","Unterschied pro Zug:":"Difference per turn:","Ausgleich: Elixier der H\xFCgelriesenst\xE4rke oben im Loadout aktivieren.":"Compensation: activate the Elixir of Hill Giant Strength in the loadout above.","Dom\xE4ne des Lichts \xB7 Warding Flare":"Light Domain \xB7 Warding Flare","Bei Der Verdorrte (Withers) im Lager umskillen und die Attribute wie rechts verteilen. Zaubertricks: Guidance, Sacred Flame und Toll the Dead \u2013 Light gibt es gratis \xFCber die Dom\xE4ne. Warding Flare ist ihre Reaktion: Ein Angreifer, der sie angreift, bekommt Nachteil.":"Respec her with Withers at camp and distribute the abilities as shown on the right. Cantrips: Guidance, Sacred Flame and Toll the Dead \u2013 Light comes free with the domain. Warding Flare is her reaction: an attacker targeting her gets disadvantage.","Radiance of the Dawn macht glei\xDFenden Fl\xE4chenschaden nur an Gegnern \u2013 sicher direkt neben Droughnir. Turn Undead lieber nicht in der N\xE4he deines kontrollierten Untoten einsetzen.":"Radiance of the Dawn deals radiant area damage to enemies only \u2013 safe right next to Droughnir. Better not use Turn Undead near your controlled undead.","Grad-2-Zauber \xB7 Dom\xE4ne: Flaming Sphere, Scorching Ray":"Level 2 spells \xB7 Domain: Flaming Sphere, Scorching Ray","Beistand (Aid) vor harten K\xE4mpfen auf Droughnir und die Gruppe \u2013 mehr maximale TP f\xFCr die Glaskanone. Sch\xFCtzendes Band (Warding Bond) gibt ihm +1 RK, +1 Rettungsw\xFCrfe und Resistenz gegen allen Schaden; Schattenherz tr\xE4gt daf\xFCr denselben Schaden mit.":"Aid before hard fights on Droughnir and the party \u2013 more maximum HP for the glass cannon. Warding Bond gives him +1 AC, +1 saving throws and resistance to all damage; Shadowheart takes the same damage in return.","Vorteil auf Konzentrationsw\xFCrfe \u2013 Segnen auf Droughnir bricht viel seltener ab. Dazu ein vierter Zaubertrick: Thaumaturgy f\xFCr Einsch\xFCchtern-Proben im Dialog.":"Advantage on concentration saves \u2013 Bless on Droughnir breaks far less often. Plus a fourth cantrip: Thaumaturgy for Intimidation checks in dialogue.","Grad-3-Zauber \xB7 Dom\xE4ne: Daylight, Fireball \xB7 Destroy Undead":"Level 3 spells \xB7 Domain: Daylight, Fireball \xB7 Destroy Undead","Wiederbeleben (Revivify) ist Pflicht \u2013 f\xE4llt die Glaskanone, holt sie dich sofort zur\xFCck. Schutzgeister (Spirit Guardians) als Konzentration, wenn Segnen gerade nicht n\xF6tig ist; Massen-Heilendes-Wort als Notfall-Heilung. Destroy Undead wie Turn Undead nicht neben deinem Untoten.":"Revivify is a must \u2013 if the glass cannon falls, she brings you right back. Spirit Guardians as concentration when Bless isn't needed; Mass Healing Word as emergency healing. Like Turn Undead, don't use Destroy Undead next to your undead.","Ab jetzt sch\xFCtzt ihr Aufflackern auch Verb\xFCndete: Greift jemand Droughnir an, gibt sie dem Angreifer per Reaktion Nachteil \u2013 Gold wert f\xFCr einen Paladin mit wenig RK.":"From now on her flare protects allies too: if someone attacks Droughnir, she gives the attacker disadvantage as a reaction \u2013 gold for a paladin with low AC.","Grad-4-Zauber \xB7 Dom\xE4ne: Guardian of Faith, Wall of Fire":"Level 4 spells \xB7 Domain: Guardian of Faith, Wall of Fire","Todesschutz (Death Ward) vor Bossk\xE4mpfen auf Droughnir: F\xE4llt er auf 0 TP, bleibt er stattdessen einmal mit 1 TP stehen. Bewegungsfreiheit gegen Festhalten und Verlangsamen.":"Death Ward on Droughnir before boss fights: if he drops to 0 HP, he stays up with 1 HP once instead. Freedom of Movement against restraints and slows.","Talent: Attributserh\xF6hung WEI +1, KON +1 \xB7 Potent Spellcasting":"Feat: Ability Improvement WIS +1, CON +1 \xB7 Potent Spellcasting","WEI 18 bringt +1 auf Zauber-SG und Zauberangriff. Potent Spellcasting addiert ihren WEI-Modifikator auf den Schaden ihrer Kleriker-Zaubertricks.":"WIS 18 gives +1 to spell DC and spell attack. Potent Spellcasting adds her WIS modifier to the damage of her cleric cantrips.","Grad-5-Zauber \xB7 Dom\xE4ne: Destructive Wave, Flame Strike":"Level 5 spells \xB7 Domain: Destructive Wave, Flame Strike","Greater Restoration gegen schwere Zust\xE4nde, Mass Cure Wounds f\xFCr die ganze Gruppe. Destructive Wave als starker Fl\xE4chenschaden.":"Greater Restoration against severe conditions, Mass Cure Wounds for the whole party. Destructive Wave as strong area damage.","G\xF6ttliches Eingreifen f\xFCr den Notfall. Neuer Zaubertrick nach Wahl, z. B. Blade Ward.":"Divine Intervention for emergencies. A new cantrip of your choice, e.g. Blade Ward.","Heldenmahl (Heroes' Feast) vor Bossk\xE4mpfen: mehr maximale TP und Schutz f\xFCr die ganze Gruppe \u2013 ideal f\xFCr eine Glaskanone. Heilung (Heal) als gro\xDFe Einzelheilung.":"Heroes' Feast before boss fights: more maximum HP and protection for the whole party \u2013 ideal for a glass cannon. Heal as a big single-target heal.","Talent: Attributserh\xF6hung WEI +2":"Feat: Ability Improvement WIS +2","WEI 20 \u2013 maximaler Zauber-SG und Zauberangriff.":"WIS 20 \u2013 maximum spell DC and spell attack.","Klerikerin der":"Cleric of the","Dom\xE4ne des Lichts":"Light Domain","Unterst\xFCtzerin f\xFCr Droughnir: Segnen halten, heilen, wiederbeleben.":"Support for Droughnir: keep Bless up, heal, revive.","Abhaken z\xE4hlt nur f\xFCr Schattenherz und \xE4ndert Droughnirs Stufe nicht.":"Ticking only counts for Shadowheart and doesn't change Droughnir's level.","Licht-Dom\xE4ne \xB7 Halbelfin \xB7 Akolythin":"Light Domain \xB7 Half-Elf \xB7 Acolyte","Punktekauf: WEI 15 und KON 15, GES 14, CHA 10, Rest 8; Volksbonus +2 WEI und +1 KON. Ihre Standardwerte (WEI 17, KON 14) funktionieren auch, wenn du nur die Dom\xE4ne wechseln willst.":"Point buy: WIS 15 and CON 15, DEX 14, CHA 10, rest 8; racial bonus +2 WIS and +1 CON. Her default scores (WIS 17, CON 14) also work if you only want to switch the domain.","Segnen auf Droughnir (und zwei weitere) \u2013 Konzentration halten.":"Bless on Droughnir (and two others) \u2013 hold concentration.","Heilendes Wort als Bonusaktion, sobald Droughnir unter die H\xE4lfte f\xE4llt.":"Healing Word as a bonus action as soon as Droughnir drops below half.","Ab Stufe 5 Wiederbeleben bereithalten, ab Stufe 7 Todesschutz vor Bossen.":"From level 5 keep Revivify ready, from level 7 Death Ward before bosses.","Danach Schaden mit Sacred Flame oder Toll the Dead.":"Then deal damage with Sacred Flame or Toll the Dead.","Ausr\xFCstung f\xFCr sie":"Equipment for her","Das fl\xFCsternde Versprechen: Heilt sie jemanden, wird das Ziel gesegnet \u2013 ohne Konzentration. Damit hat Droughnir oft doppelt Segen. Alles Weitere im Tab \u201EAusr\xFCstung\u201C unter Begleiter-Ausr\xFCstung.":"The Whispering Promise: when she heals someone, the target is blessed \u2013 without concentration. That often gives Droughnir double Bless. Everything else is in the Equipment tab under Companion equipment.","Bleibt sie in der Trickserei-Dom\xE4ne, gelten Talente und Kleriker-Zauber genauso \u2013 nur die Licht-F\xE4higkeiten und Dom\xE4nen-Zauber fallen weg.":"If she stays Trickery Domain, feats and cleric spells apply the same \u2013 only the Light features and domain spells drop out.","Levelbaum f\xFCr":"Level tree for","Ohne Ethels Haar bleibt ST\xC4 17 (+3): bis Akt 3 je \u22121 auf Treffer und Schaden, rund \u221214 % Schaden pro Zug.":"Without Ethel's Hair STR stays 17 (+3): until Act 3 \u22121 to hit and \u22121 damage each, about \u221214% damage per turn.","Elixier der H\xFCgelriesenst\xE4rke (ST\xC4 21) vor harten K\xE4mpfen \u2013 auch bei Derryth, Lady Esther, Araj, Talli und Mattis; Trank der ewigen Kraft (+2 ST\xC4 \u2192 19) \xFCber Araj Oblodra.":"Elixir of Hill Giant Strength (STR 21) before hard fights \u2013 also from Derryth, Lady Esther, Araj, Talli and Mattis; Potion of Everlasting Vigour (+2 STR \u2192 19) from Araj Oblodra.","Ohne Ethels Haar bleibt ST\xC4 17 (+3): bis Akt 3 je \u22121 auf Treffer und Schaden, rund \u221214 % Schaden pro Zug. Elixier der H\xFCgelriesenst\xE4rke vor harten K\xE4mpfen gleicht das aus.":"Without Ethel's Hair STR stays 17 (+3): until Act 3 \u22121 to hit and \u22121 damage each, about \u221214% damage per turn. The Elixir of Hill Giant Strength before hard fights makes up for it.","ST\xC4 bleibt 17 (+3), mit dem Trank der ewigen Kraft 19 (+4) \u2013 jeweils ein Punkt unter dem n\xE4chsten Modifikator. Bis zu den Panzerhandschuhen (Akt 3, ST\xC4 23) hei\xDFt das je \u22121 auf Treffer und Schaden, rund \u221214 % Schaden pro Zug. Ausgleich: Elixier der H\xFCgelriesenst\xE4rke (ST\xC4 21) vor Bossk\xE4mpfen. Die CHA-Wege (Hexklinge, Sorcadin) trifft es kaum, weil dort CHA angreift.":"STR stays 17 (+3), 19 (+4) with the Potion of Everlasting Vigour \u2013 one point short of the next modifier each time. Until the Gauntlets (Act 3, STR 23) that means \u22121 to
