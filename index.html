t. Eidbrecher werden ist kostenlos; den Eid der Rache wiederherzustellen kostet 1.000 Gold (danach 2.000, ab dem dritten Mal 10.000).",tags:["quest"]},{id:"o11",act:1,area:"Camp",t:"Eidbrecher-Ritter niemals t\xF6ten",d:"Ist der Ritter tot, verweigert Der Verdorrte (Withers) den Respec f\xFCr den Rest des Durchgangs \u2013 auch nach einer sp\xE4teren R\xFCckkehr zum Eid.",tags:["quest","miss"]},{id:"o15",act:1,area:"Camp",t:"Schattenherz auf Dom\xE4ne des Lichts umskillen",d:"Ihre Trickserei-Dom\xE4ne hilft dir kaum. Licht gilt in Patch-8-Guides als beste Allround-Wahl, Leben, wenn sie die einzige Heilerin ist. Sie ist kein Eidbrecher, Der Verdorrte skillt sie ganz normal um. Erstes Talent f\xFCr sie: Kampferprobter Zauberwirker (War Caster), damit Segnen h\xE4lt. Der komplette Levelbaum steht im Level-Guide.",tags:["quest"]},{id:"o12",act:1,area:"Camp",t:"Elixiere der H\xFCgelriesenst\xE4rke horten",d:"ST\xC4 21 bis zur langen Rast \u2013 bis zu den Panzerhandschuhen dein Standard-Elixier vor Bossk\xE4mpfen. Nur ein Elixier gleichzeitig aktiv. Fr\xFCh kaufen: Tantchen Ethel verkauft im Hain 3 St\xFCck, aufgef\xFCllt nach jeder langen Rast oder jedem Stufenaufstieg \u2013 ihr Laden schlie\xDFt f\xFCr immer, sobald sie ihre Vettel-Gestalt zeigt, in den Tunnel flieht oder im Teehaus stirbt.",tags:["item"]},{id:"o4",act:1,area:"Camp",t:"Kein Respec mehr bei Der Verdorrte",d:"Withers skillt Eidbrecher nicht um. Stufenaufstiege bewusst planen \u2013 Klasse hinzuf\xFCgen beim Aufstieg geht weiterhin normal. Umskillen nur nach Wiederherstellung des Eides (1.000 Gold).",tags:["quest","miss"]},{id:"a2",act:1,area:"Camp",t:"ST\xC4 17 ohne Ethels Haar ausgleichen",d:"Ohne Haar bleibt ST\xC4 17 (+3) \u2013 bis zu den Panzerhandschuhen in Akt 3 je \u22121 auf Treffer und Schaden, rund \u221214 % Schaden pro Zug. Ausgleich: vor harten K\xE4mpfen das Elixier der H\xFCgelriesenst\xE4rke (ST\xC4 21 = +5). Gibt es auch ohne Ethel: Derryth Bonecloak (Myconid-Kolonie), Lady Esther (Pfad zum Rosymorn-Kloster), sp\xE4ter Araj Oblodra, Talli und Mattis (Gasthaus Letztes Licht). Der Trank der ewigen Kraft bringt dich in Akt 2 auf 19 (+4).",tags:["quest"]},{id:"a3",act:1,area:"Smaragdhain",t:"Gro\xDFschwert +1 (Greatsword +1) kaufen \u2013 \xDCbergangswaffe",d:"Garantiert bei Grat im Goblinlager (X \u221299 / Y 424), sonst zuf\xE4llig bei H\xE4ndlern mit magischen Nahkampfwaffen. 85 gp Basispreis. Ersatz f\xFCr die verpasste Immergl\xFCh-Klinge (Everburn Blade). Alternative: Blutige Gro\xDFaxt (Blooded Greataxe).",tags:["item"]},{id:"a4",act:1,area:"Smaragdhain",t:"Das fl\xFCsternde Versprechen (The Whispering Promise) bei Volo",d:"40 gp (Ehrenmodus 85 gp). Volo verkauft es am Heiligen Teich \u2013 dort \xFCber den Handel-Button unten links, nicht \xFCber den Dialog \u2013 und sp\xE4ter auch im Lager (Akt 1\u20133). Grat im Goblinlager nur, solange du es nicht von Volo hast. An Schattenherz geben.",tags:["item"]},{id:"a5",act:1,area:"Smaragdhain",t:"Jagdkurzbogen (Hunting Shortbow) f\xFCr Astarion",d:"Dammon in der Mulde des Smaragdhains (X 177 / Y 562). +1-Kurzbogen mit Vorteil gegen Monstrosit\xE4ten und Mal des J\xE4gers 1\xD7 pro langer Rast. \xDCbergangsbogen f\xFCr Astarion, bis der Bogen der Todesfee da ist.",tags:["item"]},{id:"a7",act:1,area:"Smaragdhain \u2192 Uferteehaus",t:"Quest \u201ERettet Mayrina\u201C (Tantchen Ethel) starten",d:"Ethel im Hain ansprechen; die Spur f\xFChrt zum Uferteehaus (Riverside Teahouse).",tags:["quest"]},{id:"a8",act:1,area:"Eulenb\xE4renh\xF6hle",t:"Mondtropfenanh\xE4nger (Moondrop Pendant)",d:"Eulenb\xE4renh\xF6hle (X \u2212321 / Y \u2212135): Die Sel\xFBne-Truhe ist versiegelt. Gebetsblatt hinter der Sel\xFBne-Statue finden (Wahrnehmung) und vor der Truhe vorlesen. Effekt: bei 50 % TP oder weniger keine Gelegenheitsangriffe.",tags:["item"]},{id:"a9",act:1,area:"Ethels Versteck",t:"Tantchen Ethels Haar \u2192 +1 ST\xC4 (optional)",d:"Nicht bekommen? Kein Problem \u2013 der Plan rechnet ohne Haar, siehe \u201EST\xC4 17 ohne Ethels Haar ausgleichen\u201C. Nur im Versteck im \xFCberwucherten Tunnel \u2013 im Uferteehaus verhandelt sie nie, auch nicht unter 20 % TP. Unter 20 % TP bringen und ihren Zug abwarten. Nicht verstummen lassen, nicht bewusstlos schlagen. SG 20 T\xE4uschen oder Einsch\xFCchtern (K\xE4mpfer und Barbaren: SG 15 Einsch\xFCchtern mit Vorteil). Erfolg = Haar + Mayrina frei, Ethel geht. Misslingt eine Probe, ist die andere gesperrt \u2013 den Deal kannst du dann noch annehmen. Achtung Rache-Weg: Jeder Deal mit ihr bricht den Paladin-Eid. Details in der Anleitung.",tags:["item","miss","quest"]},{id:"a9b",act:1,area:"Ethels Versteck",t:"Trank \u201EGebrochene Versprechen\u201C (Broken Promises) NICHT trinken",d:"Hexentrank aus Ethels Werkstatt: +2 ST\xC4 bis zur langen Rast, danach \u22121 ST\xC4 dauerhaft. Verkaufen oder liegen lassen.",tags:["item","miss"]},{id:"a10",act:1,area:"Goblinlager",t:"Grat: Gro\xDFschwert +1 / Das fl\xFCsternde Versprechen (Fallback)",d:"Grat verkauft das Gro\xDFschwert +1 immer. Das fl\xFCsternde Versprechen nur, wenn du es nicht schon von Volo hast \u2013 und nur, solange Volo noch im Goblinlager ist.",tags:["item"]},{id:"a11",act:1,area:"Zerschmettertes Heiligtum",t:"Handschuhe des grummelnden Verlierers (Gloves of the Growling Underdog)",d:"Dror Ragzlins Schatzkisten hinter dem Eisentor (X 298 / Y 66): SG 18 Fingerfertigkeit oder Drors Schl\xFCssel. Vorteil auf Nahkampf-Waffenangriffe, wenn 2+ Gegner im Umkreis von 3 m um dein Ziel stehen, +1 auf ST\xC4-Rettungsw\xFCrfe. Im Schatz liegt auch ein St\xFCck Infernales Eisen f\xFCr Dammon.",tags:["item"]},{id:"a12",act:1,area:"Zerschmettertes Heiligtum",t:"Stiefel des Schreitens (Boots of Striding) \u2013 Minthara",d:"Guter Pfad: Minthara besiegen und pl\xFCndern (X 335 / Y 43). W\xE4hrend Konzentration nicht umsto\xDFbar und nicht verschiebbar, Konzentrationszauber geben Schwung, dazu +1 Athletik \u2013 ideal mit Krone des Wahnsinns und Hast.",tags:["item","miss"]},{id:"a13",act:1,area:"Sel\xFBnitischer Au\xDFenposten (Unterreich)",t:"Helm des Niederstreckens (Helmet of Smiting)",d:"Verschlossene vergoldete Truhe s\xFCdwestlich des Wegpunkts (X 163 / Y \u2212248). Zugang z. B. \xFCber den Geheimgang im Zerschmetterten Heiligtum. Die tempor\xE4ren TP halten nur 2 Runden.",tags:["item"]},{id:"a14",act:1,area:"Unterreich \u2013 Myconid-Kolonie",t:"\xC4tzendes Band (Caustic Band) bei Derryth Bonecloak",d:"40 gp (Ehrenmodus 590 gp), Derryth in der Ebonsee-Grotte (X \u221255 / Y \u221293). +2 S\xE4ureschaden pro Waffentreffer \u2013 doppelt wertvoll ab Zus\xE4tzlicher Angriff.",tags:["item"]},{id:"a15",act:1,area:"Boot zur Grymschmiede",t:"Jorgorals Gro\xDFschwert (Jorgoral's Greatsword) \u2013 Korsar Greymon",d:"+1, 2W6+1 Hieb, Spezialaktion Kolossaler Ansturm (Colossal Onslaught): trifft alle in einer Linie, +\xDCbungsbonus Schaden, profitiert von GWM. Kaufen oder pl\xFCndern. Greymon NICHT \xFCber die Athletik-Option im Dialog vom Flo\xDF sto\xDFen \u2013 dann ist die Beute dauerhaft weg. St\xF6\xDFt du ihn im Kampf ins Wasser, wird seine Leiche am S\xFCdpier des Verfallenen Dorfs angesp\xFClt.",tags:["item","miss"]},{id:"o3",act:1,area:"Boot zur Grymschmiede",t:"Bogen der Todesfee (Bow of the Banshee) f\xFCr Astarion \u2013 Korsar Greymon",d:"Seltener +1-Kurzbogen (190 gp): Treffer k\xF6nnen Ver\xE4ngstigt ausl\xF6sen (SG 12 Weisheit, 2 Runden); +1W4 auf Angriff und Schaden gegen ver\xE4ngstigte Ziele. Auf dem Flo\xDF pl\xFCndern oder sp\xE4ter bei Greymon in der Grymschmiede (X \u2212120 / Y \u221295) kaufen. Nicht per Athletik-Dialog vom Flo\xDF sto\xDFen.",tags:["item","miss"]},{id:"a16",act:1,area:"Grymschmiede",t:"Adamant-Schienenpanzer (Adamantine Splint Armour) schmieden",d:"Schienen-Gussform (Splint Mould) auf einem Felsvorsprung bei X \u2212593 / Y 311 nahe Wegpunkt Alte Schmiede, dazu eines der zwei Mithrilerze. Beim ersten \xD6ffnen des Lavaventils erscheint Grym. RK 18, immun gegen Krits, \u22122 auf jeden erlittenen Schaden; Nahkampf-Angreifer taumeln.",tags:["item","quest"]},{id:"a17",act:1,area:"Gebirgspass",t:"Lae'zels Quest / Rosymorn-Kloster (optional)",d:"H\xE4ndler und Loot im Pass mitnehmen.",tags:["quest"]},{id:"o14",act:1,area:"Aufgestiegene Stra\xDFe",t:"Schwert der Gerechtigkeit (Sword of Justice) \u2013 Anders",d:"Ungew\xF6hnliches +1-Gro\xDFschwert, tr\xE4gt Anders am Mauthaus der Aufgestiegenen Stra\xDFe (X 110 / Y 560). Tyrs Schutz als Bonusaktion, 1\xD7 pro kurzer Rast. Anders gibt es dir f\xFCr Karlachs Tod \u2013 oder du nimmst es ihm ab, wenn du dich auf Karlachs Seite stellst (empfohlen, so bekommst du Karlach als Gef\xE4hrtin).",tags:["item","miss"]},{id:"o13",act:1,area:"Gebirgspass \u2013 Krippe Y'llek",t:"Ring des seltsamen Leiters (Strange Conduit Ring)",d:"Prunkvolle Truhe in der Kammer des Inquisitors in der Krippe Y'llek (ca. X 1360 / Y \u2212657). +1W4 psychisch auf Waffenangriffe, solange du dich auf einen Zauber konzentrierst \u2013 mit Magischer Waffe ab Stufe 5 praktisch dauerhaft.",tags:["item","miss"]},{id:"o10",act:1,area:"Gebirgspass \u2013 Pfad zum Rosymorn-Kloster",t:"Gloves of Baneful Striking bei Lady Esther",d:"90 gp, nord\xF6stlich des Wegpunkts Trielta-Klippen (X \u221243 / Y \u2212129). Sp\xE4tes Akt 1. Nach jedem Waffentreffer \u22121W4 auf den Rettungswurf des Ziels gegen deinen n\xE4chsten Zauber \u2013 laut bg3.wiki gilt der Malus per Bug sogar f\xFCr alle Rettungsw\xFCrfe in der Dauer.",tags:["item"]},{id:"a18",act:1,area:"Point of no Return",t:"Vor Akt 2: Akt-1-Restliste pr\xFCfen",d:"Ethels Haar, Helm (Au\xDFenposten), Adamant-R\xFCstung, Jorgoral, H\xE4ndlerk\xE4ufe. Nach dem \xDCbergang ins Schattenverfluchte Land kommst du nicht zur\xFCck.",tags:["miss","quest"]},{id:"b1",act:2,area:"Letztes Licht (Last Light Inn)",t:"Umhang des Schutzes (Cloak of Protection) \u2013 Quartiermeisterin Talli",d:"200 gp (Ehrenmodus 310 gp). +1 RK, +1 auf alle Rettungsw\xFCrfe. F\xE4llt das Gasthaus, stirbt Talli \u2013 sofort kaufen.",tags:["item","miss"]},{id:"o16",act:2,area:"Letztes Licht (Last Light Inn)",t:"Fehlerhafte H\xF6llend\xE4mmerungs-Handschuhe (Flawed Helldusk Gloves) bei Dammon",d:"Dammon schmiedet aus Infernalem Eisen in fester Reihenfolge: erst R\xFCstung, dann Helm, dann Handschuhe \u2013 du brauchst also drei St\xFCck. +1W4 Feuer auf jeden Waffenangriff.",tags:["item","miss"]},{id:"b2",act:2,area:"Letztes Licht",t:"Gasthaus und Isobel sch\xFCtzen",d:"Sichert H\xE4ndler und Story-Pfad.",tags:["quest","miss"]},{id:"b3",act:2,area:"Level 5",t:"Zus\xE4tzlicher Angriff + Magische Waffe einsatzbereit",d:"Neue Eidzauber: Krone des Wahnsinns (Crown of Madness) und Dunkelheit (Darkness). Magische Waffe (Magic Weapon) vorbereiten. Gale lernt Hast (Haste) und castet sie auf Droughnir; Person festhalten \xFCbernimmt ebenfalls Gale.",tags:["quest"]},{id:"o7",act:2,area:"Schattenverfluchte Lande",t:"Ab Stufe 6: Schatten und Gespenster kontrollieren",d:"Schatten und Gespenster (Wraiths) sind Level 5. Bonus: Wer im Schattenfluch stirbt, steht nach ein, zwei Runden als Untoter wieder auf und l\xE4sst sich dann kontrollieren.",tags:["quest"]},{id:"b4",act:2,area:"Mondaufgangst\xFCrme",t:"Trank der ewigen Kraft (Potion of Everlasting Vigour): +2 ST\xC4 dauerhaft",d:"Araj Oblodra im Erdgeschoss ansprechen und Astarion \xFCberreden, sie zu bei\xDFen. Erledigen, bevor du die T\xFCrme st\xFCrmst. +2 ST\xC4 dauerhaft, auch \xFCber 20 \u2013 wirkt aber nicht, solange Elixier oder Panzerhandschuhe ST\xC4 fest setzen.",tags:["item","miss"]},{id:"o17",act:2,area:"Shar-Pr\xFCfung (Gauntlet of Shar)",t:"Ring des kaltherzigen Leuchtens (Callous Glow Ring)",d:"Tresort\xFCr n\xF6rdlich von Balthazars Vorraum (X \u2212822 / Y \u2212759): SG 30 Fingerfertigkeit, kein Schl\xFCssel \u2013 alternativ der Zauber Klopfen (Knock). Die Truhe ganz rechts enth\xE4lt den Ring. +2 glei\xDFend gegen hell beleuchtete Ziele \u2013 bei jeder Schadensinstanz.",tags:["item"]},{id:"o5",act:2,area:"Level 7 \u2013 vor dem Haus der Heilung",t:"Aura des Hasses aktivieren",d:"+CHA-Mod Schaden auf Nahkampfwaffenangriffe f\xFCr dich und alle Unholde und Untoten in 3 m \u2013 auch feindliche. Einmal anklicken, danach bleibt sie aktiv. Feindliche Untote neben dir zuerst t\xF6ten.",tags:["quest"]},{id:"o6",act:2,area:"Haus der Heilung",t:"Ab Stufe 8: Malus Thorm kontrollieren",d:"Malus Thorm ist Level 7 und \u2013 anders als Balthazar und die anderen Thorms \u2013 nicht immun. So umgehst du den Bosskampf gro\xDFteils. Die untoten Krankenschwestern (Level 6) gehen schon ab Stufe 7.",tags:["quest","miss"]},{id:"b5",act:2,area:"Level 6",t:"Aura des Schutzes aktiv \u2013 Gruppe eng halten",d:"+CHA-Mod auf Rettungsw\xFCrfe f\xFCr alle Verb\xFCndeten in 3 m.",tags:["quest"]},{id:"c1",act:3,area:"Haus der Hoffnung \u2013 Archiv",t:"Panzerhandschuhe der H\xFCgelriesenst\xE4rke (Gauntlets of Hill Giant Strength)",d:"Setzen ST\xC4 auf 23. Sockelfalle: SG 20 Fingerfertigkeit. Kein Respec n\xF6tig \u2013 dein investierter ST\xC4-Wert ist dann einfach \xFCbersch\xFCssig.",tags:["item"]},{id:"c2",act:3,area:"Haus der Hoffnung \u2013 Archiv",t:"Amulett der gr\xF6\xDFeren Gesundheit (Amulet of Greater Health)",d:"Setzt KON auf 23 \u2013 im gleichen Raum wie die Panzerhandschuhe.",tags:["item"]},{id:"c3",act:3,area:"Haus der Hoffnung",t:"H\xF6llend\xE4mmerungs-R\xFCstung (Helldusk Armour)",d:"Raphael besiegen. RK 21, Fliegen ohne Konzentration, Feuerresistenz, \u22123 Schaden aus allen Quellen, \xDCbung automatisch. Die passenden H\xF6llend\xE4mmerungs-Stiefel liegen in einer verschlossenen vergoldeten Truhe ganz oben in der Wyrmfelsen-Festung \u2013 vor Gortashs Kr\xF6nung nehmen, sonst werden er und die Stahlw\xE4chter dort feindlich.",tags:["item","miss"]},{id:"o18",act:3,area:"Unterstadt \u2013 Haus der Trauer",t:"Spiegel des Verlusts (Mirror of Loss): +2 CHA",d:"Nur der Spiegel im Haus der Trauer (Kreuzgang der d\xFCsteren Umarmung) funktioniert, der in der Shar-Pr\xFCfung ist zerbrochen. Erst identifizieren: SG 20 Religion oder SG 25 Arkane Kunde (eine Figur reicht). Dann betet jede Figur einmal: SG 25 Religion \u2013 misslingt das, gibt es f\xFCr sie nie +2. Danach Erinnerungen opfern (je \u22122 auf ein Attribut bis zur langen Rast): mit Gebet etwa 60 % Chance pro Versuch auf +2 (bis max. 24). Mehr in der Anleitung.",tags:["item","miss"]},{id:"c4",act:3,area:"Drachenweg unter Wyrmfels",t:"Baldurans Riesent\xF6ter (Balduran's Giantslayer)",d:"Legend\xE4r, +3. Beide Drachenkopf-Fackeln mit Blitzschaden treffen, vier Pr\xFCfungen bestehen. Das Schwert liegt auf Ansurs Leichnam \u2013 Ansprechen oder Pl\xFCndern startet den Kampf gegen Ansur und zwei Wasser-Myrmidonen. Passiv: Der ST\xC4-Schaden wird verdoppelt, Vorteil gegen gro\xDFe und gr\xF6\xDFere Ziele \u2013 deine Endwaffe.",tags:["item"]},{id:"o19",act:3,area:"Drachenweg unter Wyrmfels",t:"Helm des Balduran (Helm of Balduran)",d:"Auf dem Altar im Norden der H\xF6hle neben Ansur (X 636 / Y \u2212964). Seit Patch 8 kannst du ihn nehmen, ohne Ansur zu wecken. Heilt im Kampf 2 TP pro Zug, +1 RK und Rettungsw\xFCrfe, keine Krits gegen dich, immun gegen Bet\xE4ubung.",tags:["item"]},{id:"c5",act:3,area:"Camp",t:"Handschuhe und Amulett anlegen \u2013 ohne Respec",d:"Als Eidbrecher skillt Der Verdorrte nicht um. Panzerhandschuhe (ST\xC4 23) und Amulett (KON 23) wirken trotzdem voll; CHA hebst du per Talent auf 18.",tags:["quest"]},{id:"c6",act:3,area:"Vorrat",t:"Elixiere der H\xFCgelriesenst\xE4rke (ST\xC4 21) f\xFCr Bosse",d:"Bis die Handschuhe da sind, je ein Elixier pro Bosskampf.",tags:["item"]}],dg=["a1","o2","o1","o11","o4","o15","o12","a2","a3","a4","a5","a7","a8","a9","a9b","o14","a10","a11","a12","a13","a14","a15","o3","a16","a17","o10","o13","a18","b1","o16","b2","b3","b5","o7","b4","o17","o5","o6","c1","c2","c3","c4","o19","o18","c5","c6"];De.sort((e,t)=>{let a=dg.indexOf(e.id),r=dg.indexOf(t.id);return e.act-t.act||(a<0?999:a)-(r<0?999:r)});var U1={1:"Akt 1 \xB7 Ruinen \u2192 Smaragdhain \u2192 Goblinlager \u2192 Unterreich \u2192 Grymschmiede \u2192 Gebirgspass",2:"Akt 2 \xB7 Schattenverfluchtes Land",3:"Akt 3 \xB7 Baldurs Tor"},V=[{slot:"Waffe",ic:"weapon",act:"Sofort",n:"Gro\xDFschwert +1",en:"Greatsword +1",r:"uncommon",w:"Garantiert bei Grat (Goblinlager), zuf\xE4llig bei anderen H\xE4ndlern mit magischen Nahkampfwaffen",y:"+1 Treffer und Schaden; 2W6 profitiert maximal von Kampf mit gro\xDFen Waffen. Ersatz f\xFCr die verpasste Immergl\xFCh-Klinge."},{slot:"Waffe",ic:"weapon",act:"Akt 1",n:"Jorgorals Gro\xDFschwert",en:"Jorgoral's Greatsword",r:"rare",w:"Korsar Greymon \u2013 Boot zur Grymschmiede (nicht ins Wasser sto\xDFen)",y:"+1, Kolossaler Ansturm trifft alle in einer Linie (+\xDCbungsbonus Schaden, profitiert von GWM). H\xE4lt bis Akt 3."},{slot:"Waffe",ic:"weapon",act:"Akt 1",n:"Schwert der Gerechtigkeit",en:"Sword of Justice",r:"uncommon",w:"Anders, Mauthaus der Aufgestiegenen Stra\xDFe \u2013 besiegen (Karlachs Seite) oder als Belohnung",y:"+1-Gro\xDFschwert mit dem Zauber Tyrs Schutz. Gleichwertige Alternative zum Gro\xDFschwert +1, falls du Grat und Dammon verpasst."},{slot:"Waffe",ic:"weapon",act:"Akt 3",n:"Baldurans Riesent\xF6ter",en:"Balduran's Giantslayer",r:"legendary",w:"Drache Ansur, Drachenweg unter Wyrmfels (Fackeln mit Blitz treffen, 4 Pr\xFCfungen)",y:"+3. Die Riesent\xF6ter-Passive verdoppelt nicht den Angriffs-Modifikator, sondern addiert deinen ST\xC4-Modifikator einmal pauschal: ungebunden 1\xD7 ST\xC4 + 1\xD7 ST\xC4 (mit ST\xC4 23 also +12). Als Paktwaffe gebunden: 1\xD7 CHA + 1\xD7 ST\xC4. Dazu Vorteil gegen gro\xDFe Ziele und Riesengestalt 1\xD7 pro kurzer Rast."},{slot:"R\xFCstung",ic:"armor",act:"Akt 1",n:"Adamant-Schienenpanzer",en:"Adamantine Splint Armour",r:"veryrare",w:"Adamantschmiede, Grymschmiede (Schienen-Gussform + Mithrilerz)",y:"RK 18, Krit-Immunit\xE4t, \u22122 auf jeden erlittenen Schaden \u2013 perfekt f\xFCr einen Nahk\xE4mpfer mitten im Gedr\xE4nge."},{slot:"R\xFCstung",ic:"armor",act:"Akt 3",n:"H\xF6llend\xE4mmerungs-R\xFCstung",en:"Helldusk Armour",r:"legendary",w:"Raphael besiegen, Haus der Hoffnung",y:"RK 21, Fliegen ohne Konzentration, automatische \xDCbung, \u22123 Schaden aus allen Quellen. Die Feuerresistenz hast du als Roter Drachenbl\xFCtiger schon \u2013 f\xFCr die Glaskanone z\xE4hlen RK und Schadensreduktion."},{slot:"Helm",ic:"helm",act:"Akt 1",n:"Helm des Niederstreckens",en:"Helmet of Smiting",r:"uncommon",w:"Sel\xFBnitischer Au\xDFenposten, vergoldete Truhe (X 163 / Y \u2212248)",y:"Temp-TP in H\xF6he des CHA-Mods (2 Runden), wenn ein Smite-Zauber einen Zustand ausl\xF6st; +1 auf KON-Rettungsw\xFCrfe (Konzentration f\xFCr Krone des Wahnsinns/Hast)."},{slot:"Handschuhe",ic:"gloves",act:"Akt 1",n:"Handschuhe des grummelnden Verlierers",en:"Gloves of the Growling Underdog",r:"uncommon",w:"Zerschmettertes Heiligtum, Drors Schatz (SG 18 oder Schl\xFCssel)",y:"Vorteil, wenn 2+ Gegner im Umkreis von 3 m um dein Ziel stehen \u2013 gleicht den GWM-Malus aus und verdoppelt fast deine Krit-Chance."},{slot:"Handschuhe",ic:"gloves",act:"Akt 2",n:"Fehlerhafte H\xF6llend\xE4mmerungs-Handschuhe",en:"Flawed Helldusk Gloves",r:"rare",w:"Dammon, Letztes Licht \u2013 aus Infernalem Eisen (drittes geschmiedetes Teil)",y:"+1W4 Feuer auf jeden Waffenangriff, ST\xC4-Rettungsw\xFCrfe +1. Bei 3\u20136 Treffern pro Zug sp\xFCrbar; Teufel und D\xE4monen sind oft feuerresistent."},{slot:"Handschuhe",ic:"gloves",act:"Akt 3",n:"Panzerhandschuhe der H\xFCgelriesenst\xE4rke",en:"Gauntlets of Hill Giant Strength",r:"veryrare",w:"Haus der Hoffnung, Archiv (Falle SG 20)",y:"ST\xC4 23 \u2013 als Eidbrecher ohne Respec, der investierte ST\xC4-Wert ist dann einfach \xFCbersch\xFCssig."},{slot:"Helm",ic:"helm",act:"Akt 3",n:"Helm des Balduran",en:"Helm of Balduran",r:"legendary",w:"Altar neben Ansur im Drachenheiligtum, Drachenweg (X 636 / Y \u2212964)",y:"+1 RK und Rettungsw\xFCrfe, im Kampf 2 TP Heilung zu Beginn jedes Zuges, immun gegen Bet\xE4ubung, Angreifer landen keine kritischen Treffer \u2013 ersetzt die Krit-Immunit\xE4t des Adamant-Panzers."},{slot:"Stiefel",ic:"boots",act:"Akt 1",n:"Stiefel des Schreitens",en:"Boots of Striding",r:"uncommon",w:"Minthara (Zerschmettertes Heiligtum)",y:"W\xE4hrend Konzentration nicht umsto\xDFbar, Schwung beim Wirken \u2013 passt zu Krone des Wahnsinns und Hast."},{slot:"Umhang",ic:"cloak",act:"Akt 2",n:"Umhang des Schutzes",en:"Cloak of Protection",r:"uncommon",w:"Quartiermeisterin Talli, Letztes Licht",y:"+1 RK und +1 auf alle Rettungsw\xFCrfe \u2013 stapelt mit Aura des Schutzes. Glaskanone: ablegen, sobald Schattenherz Schild des Glaubens oder Sch\xFCtzendes Band zuverl\xE4ssig h\xE4lt."},{slot:"Amulett",ic:"amulet",act:"Akt 1",n:"Mondtropfenanh\xE4nger",en:"Moondrop Pendant",r:"uncommon",w:"Eulenb\xE4renh\xF6hle, Sel\xFBne-Truhe (Gebetsblatt)",y:"Unter 50 % TP keine Gelegenheitsangriffe \u2013 sicherer R\xFCckzug ohne Nebelschritt."},{slot:"Amulett",ic:"amulet",act:"Akt 3",n:"Amulett der gr\xF6\xDFeren Gesundheit",en:"Amulet of Greater Health",r:"veryrare",w:"Haus der Hoffnung, Archiv",y:"KON 23 \u2013 mehr TP und sicherere Konzentration."},{slot:"Ring",ic:"ring",act:"Akt 1",n:"Ring des seltsamen Leiters",en:"Strange Conduit Ring",r:"uncommon",w:"Krippe Y'llek, Kammer des Inquisitors (Gebirgspass)",y:"+1W4 psychisch auf Waffenangriffe, solange du dich konzentrierst. Magische Waffe oder Elementarwaffe auf dich selbst halten den Ring dauerhaft an."},{slot:"Ring",ic:"ring",act:"Akt 2",n:"Ring des kaltherzigen Leuchtens",en:"Callous Glow Ring",r:"uncommon",w:"Shar-Pr\xFCfung, Schatzkammer neben Balthazar (T\xFCr SG 30)",y:"+2 glei\xDFend gegen beleuchtete Ziele bei jeder Schadensinstanz \u2013 mit Fackel oder Licht-Zauber von Schattenherz fast immer aktiv."},{slot:"Ring",ic:"ring",act:"Akt 1",n:"\xC4tzendes Band",en:"Caustic Band",r:"uncommon",w:"Derryth Bonecloak, Myconid-Kolonie",y:"+2 S\xE4ure pro Treffer \u2013 skaliert mit Zus\xE4tzlichem Angriff und GWM-Bonusangriff."},{slot:"Ring (Schattenherz)",ic:"ring",act:"Akt 1",n:"Das fl\xFCsternde Versprechen",en:"The Whispering Promise",r:"uncommon",w:"Volo (Heiliger Teich, sp\xE4ter im Lager) oder Grat (Goblinlager)",y:"Heilt Schattenherz dich, bekommst du 2 Runden +1W4 auf Angriffe und Rettungsw\xFCrfe \u2013 wie Segnen, stapelt aber nicht damit."},{slot:"Fernkampf (Astarion)",ic:"bow",act:"Akt 1",n:"Jagdkurzbogen",en:"Hunting Shortbow",r:"uncommon",w:"Dammon (Mulde im Smaragdhain, X 177 / Y 562)",y:"+1, Vorteil gegen Monstrosit\xE4ten, Mal des J\xE4gers 1\xD7 pro langer Rast. \xDCbergangsbogen bis zum Bogen der Todesfee."},{slot:"Fernkampf (Astarion)",ic:"bow",act:"Akt 1",n:"Bogen der Todesfee",en:"Bow of the Banshee",r:"rare",w:"Korsar Greymon \u2013 auf dem Boot pl\xFCndern oder in der Grymschmiede kaufen",y:"+1, Treffer k\xF6nnen Ver\xE4ngstigt ausl\xF6sen (SG 12 Weisheit, 2 Runden); +1W4 auf Angriff und Schaden gegen ver\xE4ngstigte Ziele \u2013 perfekt nach deinem Gr\xE4sslichen Aussehen."},{slot:"Handschuhe",ic:"gloves",act:"Akt 1",n:"Gloves of Baneful Striking",en:"Gloves of Baneful Striking",r:"uncommon",w:"Lady Esther, Pfad zum Rosymorn-Kloster (90 gp, sp\xE4tes Akt 1)",y:"Nach jedem Waffentreffer \u22121W4 auf den Rettungswurf des Ziels gegen deinen n\xE4chsten Zauber (z. B. Befehl). Ob es auch f\xFCr Eid-F\xE4higkeiten gilt, ist nicht belegt."},{slot:"Waffe",ic:"weapon",act:"Start",start:1,n:"Gro\xDFschwert",en:"Greatsword",r:"common",w:"Kein Teil der offiziellen Paladin-Startausr\xFCstung (laut bg3.wiki: Kriegshammer, Holzschild, zwei Wurfspeere) \u2013 gew\xF6hnliche Gro\xDFschwerter gibt es fr\xFCh bei Waffenh\xE4ndlern und von Gegnern",y:"2W6 Hieb, zweih\xE4ndig. Grundlage f\xFCr Kampf mit gro\xDFen Waffen und GWM \u2013 Droughnirs Waffe f\xFCr den Glaskanonen-Build, bis das Gro\xDFschwert +1 da ist."},{slot:"Waffe",ic:"weapon",act:"Start",start:1,n:"Kriegshammer",en:"Warhammer",r:"common",w:"Paladin-Startausr\xFCstung auf der Nautiloid, zusammen mit Holzschild und zwei Wurfspeeren",y:"1W8 Wucht (vielseitig: zweih\xE4ndig 1W10). Mit dem Holzschild +2 RK \u2013 sicherer, aber ohne Kampf mit gro\xDFen Waffen und GWM. F\xFCr die Glaskanone nur die Notl\xF6sung."},{slot:"R\xFCstung",ic:"armor",act:"Start",start:1,n:"Schuppenpanzer der Rache",en:"Scale Mail of Vengeance",r:"common",w:"Paladin-Startausr\xFCstung des Eids der Rache \u2013 jeder Eid hat seine eigene Schuppenpanzer-Variante",y:"Mittlere R\xFCstung: RK 14 + GES (max. 2), Nachteil auf Heimlichkeit. Mit GES 10 also RK 14 \u2013 so fr\xFCh wie m\xF6glich durch den Adamant-Schienenpanzer ersetzen."},{slot:"Stiefel",ic:"boots",act:"Start",start:1,n:"Lederstiefel",en:"Leather Boots",r:"common",w:"Paladin-Startausr\xFCstung",y:"Keine Boni \u2013 nur ein Platzhalter bis zu den Stiefeln des Schreitens."},{slot:"R\xFCstung",ic:"armor",act:"Akt 1",n:"Schuppenpanzer +1",en:"Scale Mail +1",r:"uncommon",w:"H\xE4ndler mit gestuftem Magie-R\xFCstungs-Sortiment bei Spielerstufe 4\u20136 \u2013 bei dir: Roah Moonglow (Zhentarim-Lager im Zerschmetterten Heiligtum)",y:"+1, mittlere R\xFCstung: RK 15 + GES (max. 2), Superior Material: \u22121 Hiebschaden, Nachteil auf Heimlichkeit. Mit GES 10 also RK 15 \u2013 einer mehr als der Schuppenpanzer der Rache. Deine R\xFCstung, bis der Adamant-Schienenpanzer (RK 18) aus der Grymschmiede da ist."},{slot:"R\xFCstung",ic:"armor",act:"Akt 1",n:"Luminous Armour",en:"Luminous Armour",r:"uncommon",w:"Sel\xFBnitischer Au\xDFenposten (X 176 / Y \u2212247): verschlossene, mit einer Falle gesicherte Prunktruhe hinter einer Geheimt\xFCr \u2013 per Wahrnehmungswurf finden oder vom Raum mit dem Wegpunkt hin\xFCberspringen",y:"+1, mittlere R\xFCstung: RK 15 + GES (max. 2). Radiating Shockwave: Jeder glei\xDFende Schaden, den du machst \u2013 auch G\xF6ttliches Niederstrecken, G\xF6ttliche Gunst oder der Ring des kaltherzigen Leuchtens \u2013 belegt Nicht-Verb\xFCndete im Umkreis von 3 m mit Radiating Orb (\u22121 auf Angriffe je verbleibendem Zug, sie leuchten hell). Verb\xFCndete bleiben verschont. Gleiche RK wie der Schuppenpanzer +1, aber mit Effekt \u2013 \xDCbergangsr\xFCstung bis zum Adamant-Schienenpanzer."},{slot:"Waffe",ic:"weapon",act:"Prolog",n:"Everburn Blade",en:"Everburn Blade",r:"uncommon",w:"Nautiloid (Prolog): tr\xE4gt Kommandant Zhalk am Steuer \u2013 alternativ per Befehl \u201EFallenlassen\u201C abnehmen",y:"2W6 Hieb + 1W4 Feuer, ignoriert nicht-magische Hiebresistenz. Bestes fr\xFChes Gro\xDFschwert \u2013 nur im Prolog zu holen."},{slot:"Waffe",ic:"weapon",act:"Akt 1",n:"Svartlebee's Woundseeker",en:"Svartlebee's Woundseeker",r:"uncommon",w:"Waukeens Rast: tr\xE4gt Gauntlet Yeva \u2013 lebt sie, sp\xE4ter im Kaulquappen-Zentrum (Akt 2)",y:"+1, 2W6 Hieb. Passiv: +1W4 auf Angriffe gegen Ziele, die schon Schaden genommen haben \u2013 laut Wiki f\xFCr alle Nahkampf-Waffenangriffe. Echte Alternative zum Gro\xDFschwert +1."},{slot:"Waffe",ic:"weapon",act:"Akt 3",n:"Sword of Chaos",en:"Sword of Chaos",r:"veryrare",w:"Mordtribunal: tr\xE4gt Sarevok Anchev",y:"+2, 2W6 Hieb + 1W4 nekrotisch; jeder Schadenstreffer heilt dich um 1W6. Alternative zum Riesent\xF6ter, wenn du mehr Selbstheilung willst."},{slot:"R\xFCstung",ic:"armor",act:"Akt 3",n:"Armour of Persistence",en:"Armour of Persistence",r:"veryrare",w:"Schmiede der Neun: H\xE4ndler Dammon",y:"RK 20, schwer, \u22122 auf jeden erlittenen Schaden, dauerhaft Resistance (+1W4 auf Rettungsw\xFCrfe) und Blade Ward (Resistenz gegen Wucht, Stich und Hieb). Defensiv-Alternative zur H\xF6llend\xE4mmerr\xFCstung."},{slot:"Helm",ic:"helm",act:"Akt 1",n:"Haste Helm",en:"Haste Helm",r:"rare",w:"Verfallenes Dorf: in der moosbewachsenen Truhe",y:"Zu Kampfbeginn 3 Z\xFCge Schwung: +1,5 m Bewegung pro verbleibendem Zug \u2013 schneller am Gegner. Fr\xFCher Helm, bis der Helm des Niederstreckens da ist."},{slot:"Handschuhe",ic:"gloves",act:"Akt 3",n:"Legacy of the Masters",en:"Legacy of the Masters",r:"veryrare",w:"Schmiede der Neun: H\xE4ndler Dammon",y:"+2 auf Angriff und Schaden mit Waffen, ST\xC4-Rettung +1. Damage-Alternative zu den Panzerhandschuhen, sobald deine ST\xC4 anders hoch ist."},{slot:"Stiefel",ic:"boots",act:"Akt 1",n:"Disintegrating Night Walkers",en:"Disintegrating Night Walkers",r:"story",w:"Grymschmiede: tr\xE4gt Nere",y:"Immun gegen Netz, Verstrickt und Ausrutschen; Misty Step als Bonusaktion, einmal pro kurzer Rast \u2013 bringt dich sofort an den Gegner."},{slot:"Stiefel",ic:"boots",act:"Akt 1",n:"Boots of Speed",en:"Boots of Speed",r:"rare",w:"Ebonsee-Grotte: tr\xE4gt Thulla",y:"Bonusaktion \u201EClick Heels\u201C: mehr Tempo und Bewegungsfreiheit. Laut Wiki-Bug trifft der Nachteil deine eigenen Reaktionsangriffe statt die der Gegner."},{slot:"Stiefel",ic:"boots",act:"Akt 3",n:"Helldusk Boots",en:"Helldusk Boots",r:"veryrare",w:"Wyrmfels-Festung: verschlossene Goldtruhe im obersten Stock",y:"Ignoriert schwieriges Gel\xE4nde, kann nicht verschoben werden; fehlgeschlagenen Rettungswurf per Reaktion schaffen (laut Wiki einmal pro Rast); Teleport mit 2W8 Feuer als Bonusaktion."},{slot:"Umhang",ic:"cloak",act:"Akt 3",n:"Cloak of Displacement",en:"Cloak of Displacement",r:"rare",w:"Wyrms\xFCbergang: H\xE4ndler Entharl Danthelon (Danthelons Tanzende Axt)",y:"Zu Beginn deines Zugs haben Gegner Nachteil auf Angriffe gegen dich, bis du Schaden nimmst."},{slot:"Amulett",ic:"amulet",act:"Akt 1",n:"Amulet of Misty Step",en:"Amulet of Misty Step",r:"uncommon",w:"Entweihter Tempel unter dem Zerschmetterten Heiligtum: vergoldete Truhe in Priesterin Guts Gemach (X 386 / Y 8)",y:"Misty Step als Bonusaktion, einmal pro kurzer Rast. Fr\xFChes Amulett f\xFCr schnelles Ranlaufen."},{slot:"Amulett",ic:"amulet",act:"Akt 1",n:"Periapt of Wound Closure",en:"Periapt of Wound Closure",r:"rare",w:"Pfad zum Rosymorn-Kloster: H\xE4ndlerin Lady Esther",y:"Wirst du niedergeschlagen, stabilisierst du dich automatisch; jede Heilung auf dich heilt den Maximalwert \u2013 stark mit Schattenherz' Heilendem Wort."},{slot:"Ring",ic:"ring",act:"Akt 1",n:"Ring of Protection",en:"Ring of Protection",r:"rare",w:"Smaragdha  Heiligtum: Skelett im offenen Sarkophag direkt vor den Worg-Gehegen (X 338 / Y 14)",y:"Resistenz gegen Giftschaden \u2013 halbiert Gift von Spinnen und Fallen. Situativ, aber kostenlos mitzunehmen."},{slot:"Ring",ic:"ring",act:"Akt 1",n:"Ring of Mind-Shielding",en:"Ring of Mind-Shielding",r:"rare",w:"Ebonsee-Grotte: Omeluum nach der Quest \u201EHilf Omeluum, den Parasiten zu untersuchen\u201C (X 144 / Y 29)",y:"Vorteil auf Rettungsw\xFCrfe gegen Bezauberung \u2013 in Akt 1 vor allem gegen den Lockgesang der Harpyien. Eine bezauberte Glaskanone schl\xE4gt sonst die eigene Gruppe."}],Z1=[{lv:2,cls:"Paladin 2",g:"Kampf mit gro\xDFen Waffen \xB7 G\xF6ttliches Niederstrecken (Divine Smite) \xB7 Zauberwirken",p:"Vorbereiten: Befehl (Command), Donnerndes und Zorniges Niederstrecken, Schild des Glaubens (Shield of Faith), G\xF6ttliche Gunst (Divine Favour). Segnen (Bless) \xFCbernimmt Schattenherz."},{lv:3,cls:"Paladin 3 \u2013 Eidbrecher",g:"Trotziges Leid (Spiteful Suffering) \xB7 Untote kontrollieren (Control Undead) \xB7 Gr\xE4ssliches Aussehen (Dreadful Aspect) \xB7 G\xF6ttliche Gesundheit",p:"Eine Eid-Ladung pro kurzer Rast f\xFCr alle drei F\xE4higkeiten. Eidzauber immer vorbereitet: H\xF6llischer Tadel, Wunden verursachen. Vorbereiten (6): Befehl, Schild des Glaubens, G\xF6ttliche Gunst, Donnerndes und Zorniges Niederstrecken, Wunden heilen."},{lv:4,cls:"Paladin 4",g:"Talent: Meisterschaft gro\xDFer Waffen (Great Weapon Master)",p:"+10 Schaden pro Treffer bei \u22125 Treffer, plus Bonusangriff nach Krit oder Kill mit einem Nahkampf-Waffenangriff. \u201EAll In\u201C nur mit Vorteil oder Segnen."},{lv:5,cls:"Paladin 5",g:"Zus\xE4tzlicher Angriff (Extra Attack) \xB7 Grad-2-Pl\xE4tze \xB7 Eidzauber Krone des Wahnsinns & Dunkelheit",p:"Vorbereiten: Magische Waffe (Magic Weapon) \u2013 gleicht den GWM-Malus aus und h\xE4lt den Ring des seltsamen Leiters an \u2013 plus Brandmarkendes Niederstrecken (Branding Smite)."},{lv:6,cls:"Paladin 6",g:"Aura des Schutzes (Aura of Protection): +CHA auf Rettungsw\xFCrfe in 3 m",p:"Die wichtigste Defensive der Glaskanone \u2013 sch\xFCtzt auch Schattenherz' Konzentration, wenn sie nah bei dir steht."},{lv:7,cls:"Paladin 7",g:"Aura des Hasses (Aura of Hate): +CHA-Schaden auf jeden Nahkampfwaffentreffer",p:"Ab hier trennen sich die Wege. Jeder zus\xE4tzliche Angriff pro Zug bekommt den Aura-Bonus \u2013 deshalb lohnen Wege mit vielen Angriffen. Vorbereiten: Schwache Genesung (Lesser Restoration)."}],ea=[{id:"w4",oath:"ob",main:"CHA (gebundene Waffe) + ST\xC4",n:"Eidbrecher 7 / Hexenmeister 5",sub:"Pakt der Klinge",tag:"Bester Schaden",rank:1,att:"3 pro Aktion, mit Hast 6",feats:2,slot:"Grad 3 (Hexer, kurze Rast)",hm:"Nein \u2013 dort nur 2 Angriffe",effort:"Mittel bis hoch",dpr:[75,150,150],ic:["s-aura-hate","s-pact-blade","s-haste"],engine:"Paladin-Extra-Angriff und Vertiefter Pakt stapeln au\xDFerhalb des Ehrenmodus: drei Angriffe pro Aktion. Jeder davon bekommt GWM (+10), Aura des Hasses (+CHA) und die Riesent\xF6ter-Passive. Hexer-Pl\xE4tze laden bei kurzer Rast \u2013 zwei Smites 3. Grades pro Kampf.",pro:["Die meisten Treffer pro Zug \u2013 also die meisten Aura-, GWM- und Item-Boni","Hexer-Pl\xE4tze laden bei kurzer Rast","Riesent\xF6ter beh\xE4lt als Paktwaffe seinen ST\xC4-Bonus (CHA + ST\xC4)"],con:["Funktioniert im Ehrenmodus nicht (nur 2 Angriffe)","Stufen 8\u20139 bringen kaum Fortschritt","Als Paktwaffe greifst du mit CHA an \u2013 CHA wird so wichtig wie ST\xC4"],levels:[{lv:8,cls:"Hexenmeister 1",g:"Unterklasse Hexklinge (Hexblade, seit Patch 8) oder Unhold (Fiend) \xB7 Hexer-Pl\xE4tze",p:"Zaubertrick Schauerlicher Strahl (Eldritch Blast), Zauber Hexerfluch (Hex). Hexer-Pl\xE4tze laden bei kurzer Rast."},{lv:9,cls:"Hexenmeister 2",g:"Zwei Schauerliche Anrufungen",p:"Qualvoller Strahl (Agonising Blast) und Teufelssicht (Devil's Sight) \u2013 oder was dir im Nahkampf n\xFCtzt."},{lv:10,cls:"Hexenmeister 3",g:"Pakt der Klinge (Pact of the Blade)",p:"Waffe binden: Angriff und Schaden da Untoter wieder aufstehen \u2013 Schatten und Gespenster (Level 5) sind ab deiner Stufe 6 kontrollierbar."},{id:"loc-healing",n:"Haus der Heilung",en:"House of Healing",act:2,I:ci,d:"Verlassenes Spital in Reithwin. Untote Krankenschwestern und Malus Thorm \u2013 ab Stufe 8 kontrollierbar."},{id:"loc-gauntlet",n:"Shar-Pr\xFCfung",en:"Gauntlet of Shar",act:2,I:Na,d:"Unterirdische Tempelanlage. In der Schatzkammer neben Balthazar (T\xFCr SG 30) liegt der Ring des kaltherzigen Leuchtens."},{id:"loc-hope",n:"Haus der Hoffnung",en:"House of Hope",act:3,I:Jt,tut:"tut-archive",d:"Raphaels H\xF6llenpalast. Im Archiv die Panzerhandschuhe der H\xFCgelriesenst\xE4rke und das Amulett der gr\xF6\xDFeren Gesundheit; Raphael selbst tr\xE4gt die H\xF6llend\xE4mmerungs-R\xFCstung."},{id:"loc-wyrmway",n:"Drachenweg",en:"The Wyrmway",act:3,I:Ee,tut:"tut-wyrmway",d:"Pr\xFCfungsgruft unter der Wyrmfelsen-Festung. Vier Pr\xFCfungen, dann Ansur \u2013 und dahinter Baldurans Riesent\xF6ter und der Helm des Balduran."},{id:"loc-grief",n:"Haus der Trauer",en:"House of Grief",act:3,I:ci,tut:"tut-mirror",d:"Shar-Tempel in der Unterstadt, Teil von Schattenherz' Quest. Nur hier funktioniert der Spiegel des Verlusts."},{id:"loc-nautiloid",n:"Nautiloid",en:"Nautiloid",act:1,I:Qt,d:"Das Gedankenschinder-Schiff im Prolog. Am Steuer k\xE4mpft Kommandant Zhalk mit der Everburn Blade. Nach dem Absturz nicht mehr betretbar."},{id:"loc-blighted",n:"Verfallenes Dorf",en:"Blighted Village",act:1,I:Ba,d:"Verlassenes Dorf zwischen Druidenhain und Goblinlager, von Goblins besetzt. Moosbewachsene Truhe mit dem Haste Helm (X 34 / Y 394, Schl\xFCssel beim Booyahg auf dem Apothekendach), Apotheke mit Keller f\xFCr Alchemie-Zutaten, Windm\xFChle mit Barcus Wroot. Unter dem Dorf: die Fl\xFCsternden Tiefen mit dem Spurred Band \u2013 Eingang \xFCber den Brunnen (Untersuchung SG 10) oder die Schmiede."},{id:"loc-waukeen",n:"Waukeens Rast",en:"Waukeen's Rest",act:1,I:gi,d:"Brennendes Gasthaus zwischen Gebirgspass und Aufgestiegener Stra\xDFe. Zeitkritisch: Schnellreise, Ortswechsel oder lange Rast lassen das Feuer alle Eingeschlossenen t\xF6ten. Gauntlet Yeva (Svartlebee's Woundseeker) bricht die T\xFCr auf, oben wartet Beraterin Florrick, hinter dem Gasthaus liegt der Geheimeingang zum Zhentarim-Versteck."},{id:"loc-wyrmscrossing",n:"Wyrms\xFCbergang",en:"Wyrm's Crossing",act:3,I:wi,d:"Breite Steinbr\xFCcke von Rivington in die Unterstadt mit vielen L\xE4den \u2013 u. a. Danthelons Tanzende Axt (Cloak of Displacement). Am S\xFCdspann-Kontrollpunkt liegt ein Elixier der H\xFCgelriesenst\xE4rke, am Ende wartet die Wyrmfels-Festung mit den Helldusk Boots."},{id:"loc-lowercity",n:"Unterstadt",en:"Lower City",act:3,I:di,d:"Herz von Baldur's Gate in Akt 3. Hier liegen die Schmiede der Neun (Dammon: Legacy of the Masters, Armour of Persistence), Beehive General Goods (Elixiere) und unter Candulhallows Grabsteinen das Mordtribunal mit Sarevok und dem Sword of Chaos."}],Va=[{id:"npc-roah",n:"Roah Moonglow",en:"Roah Moonglow",kind:"H\xE4ndler",act:1,loc:["loc-goblin","loc-moonrise"],d:"Halbling-H\xE4ndlerin der Zhentarim. Akt 1: im Lagerraum westlich der Haupthalle des Zerschmetterten Heiligtums (X 275 / Y \u221229). Akt 2: Eingangshalle der Mondaufgangst\xFCrme (X \u2212174 / Y \u2212176). Akt 3: Zisterne in der Kanalisation der Unterstadt, nach dem Gildenhaus-Putsch im B\xFCro des Gildenmeisters. Ihr Sortiment wird teils zuf\xE4llig gew\xFCrfelt \u2013 bei dir war der Schuppenpanzer +1 dabei. Stirbt sie vor Akt 3, ersetzt sie Friol."},{id:"npc-zhalk",n:"Kommandant Zhalk",en:"Commander Zhalk",kind:"Gegner",act:1,loc:["loc-nautiloid"],d:"Cambion-Kommandant am Steuer der Nautiloid im Prolog. K\xE4mpft dort gegen einen Gedankenschinder; der Kampf startet, sobald jemand das Steuer betritt. Ihn zu t\xF6ten ist nicht n\xF6tig, bringt aber die Everburn Blade und Extra-EP \u2013 alternativ per Befehl: Fallenlassen entwaffnen. Nach 15 Z\xFCgen kommen Cambion-Verst\xE4rkungen."},{id:"npc-yeva",n:"Gauntlet Yeva",en:"Gauntlet Yeva",kind:"Quest",act:1,loc:["loc-waukeen"],d:"K\xE4mpferin (Kampfmeisterin) des Flammenden Fausts. Versucht in der brennenden Waukeens Rast die verbarrikadierte T\xFCr aufzubrechen \u2013 ein ST\xC4-Wurf SG 10 hilft \u2013 und startet \u201ERettet den Gro\xDFherzog\u201C. Tr\xE4gt Svartlebee's Woundseeker. In Akt 2 steckt sie in einer Kapsel im Kaulquappen-Zentrum."},{id:"npc-sarevok",n:"Sarevok Anchev",en:"Sarevok Anchev",kind:"Gegner",act:3,loc:["loc-lowercity"],d:"Anf\xFChrer des Mordtribunals unter Candulhallows Grabsteinen in der Unterstadt. Tr\xE4gt das Sword of Chaos, das Amulett des Bhaal und seinen geh\xF6rnten Helm. Wird feindlich, wenn du nach Orins Tod ins Tribunal zur\xFCckkehrst."},{id:"npc-nere",n:"Nere",en:"Nere",kind:"Gegner",act:1,loc:["loc-grymforge"],d:"Duergar-Anf\xFChrer der Absoluten in der Grymschmiede, eingeschlossen hinter einem Einsturz. Philomeen hat Sprengstoff f\xFCr den Schutt. Sprichst du mit ihm durch den Schutt, l\xE4uft ein Zeitlimit: nach zwei langen Rasten oder zweimal Grymschmiede verlassen stirbt er. Danach entweder gegen ihn k\xE4mpfen (Gnome retten) oder mit \xC4ltester Brithvar zusammenarbeiten. Beute: Disintegrating Night Walkers und 1.000 Gold."},{id:"npc-thulla",n:"Thulla",en:"Thulla",kind:"Quest",act:1,loc:["loc-myconid"],d:"Tiefengnomin in der Ebonsee-Grotte (X 87 / Y \u221295) neben Spaw, vergiftet von Duergar. Startet \u201EHeile die vergiftete Gnomin\u201C \u2013 jeder Effekt gegen Vergiftung hilft. Geheilt schenkt sie dir die Boots of Speed, die sie Thrinn gestohlen hat."},{id:"npc-thrinn",n:"Sergeant Elenna Thrinn",en:"Elenna Thrinn",kind:"Quest",act:1,loc:["loc-grymforge"],d:"Duergar-Sergeantin im Duergar-Lager der Grymschmiede (X \u2212643 / Y 300). Sucht ihre gestohlenen Stiefel (\u201EFinde die verlorenen Stiefel\u201C). Gibst du ihr die Boots of Speed, w\xE4hlst du als Belohnung das Bracing Band oder die Armour of Uninhibited Kushigo."},{id:"npc-crusher",n:"Crusher",en:"Crusher",kind:"Gegner",act:1,loc:["loc-goblin"],d:"Gro\xDFm\xE4uliger Goblin im \xF6stlichen Hof des Goblinlagers beim Alten Runenkreis. Tr\xE4gt Crusher's Ring am Zeh: beim erzwungenen Fu\xDFkuss abziehen (Fingerfertigkeit SG 10), per Dialog stehlen oder ihn t\xF6ten und pl\xFCndern."},{id:"npc-mol",n:"Mol",en:"Mol",kind:"Quest",act:1,loc:["loc-grove","loc-lastlight","loc-lowercity"],d:"Anf\xFChrerin der Tiefling-Kinder im Versteck unter dem Smaragdhain. Gibt dir \u201EStehlt das heilige G\xF6tzenbild\u201C und belohnt dich mit dem Ring of Protection. Akt 2 im Letzten Licht, Akt 3 bei Sticky Dondo im Gildenhaus der Unterstadt."},{id:"npc-omeluum",n:"Omeluum",en:"Omeluum",kind:"H\xE4ndler",act:1,loc:["loc-myconid"],d:"Freundlicher Gedankenschinder an der Myconid-Kolonie \u2013 du triffst ihn nach einem Gespr\xE4ch mit Blurg. Quest: einen Sud aus Tongue of Madness und Timmask-Sporen bringen; danach bietet er den Ring of Mind-Shielding an. Verkauft au\xDFerdem u. a. die Boots of Stormy Clamour und den Ring of Salving."},{id:"npc-entharl",n:"Entharl Danthelon",en:"Entharl Danthelon",kind:"H\xE4ndler",act:3,loc:["loc-wyrmscrossing"],d:"Waffen- und R\xFCstungsh\xE4ndler in Danthelons Tanzender Axt am Westende des Wyrms\xFCbergangs (X \u22126 / Y 133). Verkauft u. a. den Cloak of Displacement, die Gauntlets of the Warmaster und Blightbringer \u2013 und das Elixier der H\xFCgelriesenst\xE4rke."},{id:"npc-withers",n:"Der Verdorrte",en:"Withers",kind:"Lager",act:0,loc:["loc-camp"],d:"Skillt f\xFCr 100 Gold um \u2013 Begleiter jederzeit, dich als Eidbrecher aber nicht. Ist immun gegen Untote kontrollieren."},{id:"npc-knight",n:"Eidbrecher-Ritter",en:"Oathbreaker Knight",kind:"Lager",act:0,loc:["loc-camp"],d:"Erscheint nach dem Eidbruch. Stellt deinen alten Eid f\xFCr 1.000 Gold wieder her oder best\xE4tigt dich als Eidbrecher. Niemals t\xF6ten \u2013 sonst gibt es f\xFCr den Rest des Spiels keinen Respec mehr."},{id:"npc-dammon",n:"Dammon",en:"Dammon",kind:"H\xE4ndler",act:1,loc:["loc-grove","loc-lastlight","loc-lowercity"],d:"Tiefling-Schmied in der Mulde des Smaragdhains. Akt 1: Jagdkurzbogen. Akt 2 im Letzten Licht: schmiedet aus Infernalem Eisen die fehlerhaften H\xF6llend\xE4mmerungs-Teile \u2013 je ein Eisen pro Teil. Akt 3 in der Schmiede der Neun (Unterstadt): verkauft Legacy of the Masters und die Armour of Persistence."},{id:"npc-volo",n:"Volo",en:"Volo",kind:"H\xE4ndler",act:1,loc:["loc-grove"],d:"Barde mit kurzem Auftritt am Heiligen Teich. Verkauft Das fl\xFCsternde Versprechen f\xFCr 40 gp (Handel-Button unten links) \u2013 sp\xE4ter auch im Lager."},{id:"npc-grat",n:"Grat",en:"Grat",kind:"H\xE4ndler",act:1,loc:["loc-goblin"],d:"Goblin-H\xE4ndler im Lager (X \u221299 / Y 424). Verkauft immer das Gro\xDFschwert +1; Das fl\xFCsternde Versprechen nur, wenn du es nicht von Volo hast und solange Volo im Lager ist."},{id:"npc-derryth",n:"Derryth Bonecloak",en:"Derryth Bonecloak",kind:"H\xE4ndler",act:1,loc:["loc-myconid"],d:"H\xE4ndlerin in der Ebonsee-Grotte nahe dem westlichen Eingang der Myconid-Kolonie. Verkauft das \xC4tzende Band, gelegentlich bis zu 2 Elixiere der H\xFCgelriesenst\xE4rke pro Rast und H\xFCgelriesen-Finger zum Brauen. In Akt 3 betreibt sie Bonecloaks Apotheke in der Unterstadt."},{id:"npc-greymon",n:"Korsar Greymon",en:"Corsair Greymon",kind:"H\xE4ndler",act:1,loc:["loc-grymforge"],d:"Duergar auf dem Flo\xDF zur Grymschmiede. Tr\xE4gt Jorgorals Gro\xDFschwert und den Bogen der Todesfee, verkauft beides sp\xE4ter in der Grymschmiede. Nicht per Athletik-Dialog vom Flo\xDF sto\xDFen \u2013 sonst ist die Beute dauerhaft weg."},{id:"npc-esther",n:"Lady Esther",en:"Lady Esther",kind:"H\xE4ndler",act:1,loc:["loc-rosymorn"],d:"H\xE4ndlerin auf dem Pfad zum Rosymorn-Kloster. Verkauft die Gloves of Baneful Striking, das Periapt of Wound Closure und Elixiere der H\xFCgelriesenst\xE4rke."},{id:"npc-talli",n:"Quartiermeisterin Talli",en:"Quartermaster Talli",kind:"H\xE4ndler",act:2,loc:["loc-lastlight"],d:"Verkauft den Umhang des Schutzes (200 gp) und Elixiere des Blutdursts. F\xE4llt das Letzte Licht, stirbt sie \u2013 sofort kaufen."},{id:"npc-araj",n:"Araj Oblodra",en:"Araj Oblodra",kind:"Quest",act:2,loc:["loc-moonrise"],d:"Vampir-affine Tr\xE4nkebrauerin bei ihrer Alchemie-Ausr\xFCstung in den Mondaufgangst\xFCrmen. Lass Astarion sie bei\xDFen und du bekommst den Trank der ewigen Kraft (+2 ST\xC4 dauerhaft). Verkauft den Risky Ring und Elixiere der H\xFCgelriesenst\xE4rke. In Akt 3 (falls sie lebt und Blut gespendet wurde) im Purpurtrunk in der Unterstadt."},{id:"npc-ethel",n:"Tantchen Ethel",en:"Auntie Ethel",kind:"Gegner",act:1,loc:["loc-grove","loc-ethel"],d:"Gr\xFCnes Weib in Verkleidung. Solange sie freundlich ist, verkauft sie 3\xD7 Elixier der H\xFCgelriesenst\xE4rke pro langer Rast. Unter 20 % TP feilscht sie im Versteck um ihr Leben \u2013 deine Chance auf das Haar."},{id:"npc-dror",n:"Dror Ragzlin",en:"Dror Ragzlin",kind:"Gegner",act:1,loc:["loc-goblin"],d:"Goblin-Anf\xFChrer im Heiligtum. Hinter dem Eisentor (X 298 / Y 66) liegen seine Schatzkisten mit den Handschuhen des grummelnden Verlierers."},{id:"npc-minthara",n:"Minthara",en:"Minthara",kind:"Gegner",act:1,loc:["loc-goblin"],d:"Drow-Anf\xFChrerin. Auf dem guten Pfad besiegen: Sie tr\xE4gt die Stiefel des Schreitens."},{id:"npc-anders",n:"Anders",en:"Anders",kind:"Gegner",act:1,loc:["loc-risen"],d:"Falscher Tyr-Paladin, jagt Karlach. Besiegst du ihn, geh\xF6rt das Schwert der Gerechtigkeit dir \u2013 und Karlach schlie\xDFt sich an."},{id:"npc-grym",n:"Grym",en:"Grym",kind:"Gegner",act:1,loc:["loc-grymforge"],d:"Adamant-Golem der Schmiede. Erscheint, sobald du das Lavaventil zum ersten Mal \xF6ffnest; gilt als immun gegen Klingen und Zauber. Droppt den Grymskull-Helm."},{id:"npc-malus",n:"Malus Thorm",en:"Malus Thorm",kind:"Gegner",act:2,loc:["loc-healing"],d:"Level-7-Boss ohne Immunit\xE4t gegen Untote kontrollieren \u2013 ab deiner Stufe 8 einfach \xFCbernehmen."},{id:"npc-raphael",n:"Raphael",en:"Raphael",kind:"Gegner",act:3,loc:["loc-hope"],d:"Teufel und Hausherr. Besiegst du ihn, bekommst du die H\xF6llend\xE4mmerungs-R\xFCstung."},{id:"npc-ansur",n:"Ansur",en:"Ansur",kind:"Gegner",act:3,loc:["loc-wyrmway"],d:"Bronzedrache und einstiger Gef\xE4hrte Baldurans. Droppt Baldurans Riesent\xF6ter."}],$c=[{id:"tut-ethel",n:"Tantchen Ethels Haar",loc:"loc-ethel",steps:["Vorher Elixiere kaufen: Solange Ethel im Hain freundlich ist, verkauft sie 3\xD7 Elixier der H\xFCgelriesenst\xE4rke, aufgef\xFCllt nach jeder langen Rast oder jedem Stufenaufstieg. Sobald sie ihre Vettel-Gestalt zeigt, flieht oder im Teehaus stirbt, ist ihr Laden f\xFCr immer zu.","Den Kampf im Versteck austragen (Uferteehaus \u2192 \xFCberwucherter Tunnel). Im Teehaus verhandelt sie nie \u2013 auch nicht unter 20 % TP.","Ethel unter 20 % ihrer maximalen TP bringen und ihren Zug abwarten. Nicht verstummen lassen (Stille), nicht bewusstlos schlagen \u2013 dann kann sie nicht verhandeln. Keine Schadensfl\xE4chen (Feuer, S\xE4ure) um sie herum, die sie vor ihrem Zug t\xF6ten k\xF6nnten.","Droughnir m\xF6glichst nah an sie stellen \u2013 viele Spieler berichten, dass sie die n\xE4chststehende Figur anspricht (laut bg3.wiki nicht best\xE4tigt).","In ihrem Zug bettelt sie: SG 20 T\xE4uschen oder Einsch\xFCchtern (K\xE4mpfer und Barbaren: SG 15 Einsch\xFCchtern mit Vorteil). Erfolg = Haar plus befreite Mayrina, Ethel kommt frei.","G\xF6ttliche F\xFChrung (Guidance) vorher im Kampf wirken, nicht erst im W\xFCrfel-Dialog: Im Ehrenmodus vor Patch 7 brach ein Zauber dort die Verhandlung ab und das Haar war weg. Bardische Inspiration funktioniert immer.","Misslingt eine Probe, ist die andere gesperrt. Dann bleiben: Deal annehmen (Haar, Ethel beh\xE4lt Mayrina), Mayrina befreien oder Ethel t\xF6ten.","Haar essen und ein Attribut w\xE4hlen: +1 dauerhaft, ohne Obergrenze. Wirkt nicht auf Werte, die Items oder Elixiere fest setzen.","Eid: Jeder Deal mit Ethel bricht den Paladin-Eid. Als Eidbrecher egal \u2013 planst du die R\xFCckkehr zur Rache, das Haar vorher holen oder die Kosten einplanen."]},{id:"tut-forge",n:"Adamant-Schienenpanzer schmieden",loc:"loc-grymforge",steps:["Schienen-Gussform holen: auf einem Felsvorsprung \xFCber den Lavabecken nahe dem Wegpunkt Alte Schmiede (X \u2212593 / Y 311).","Mithrilerz holen \u2013 es gibt nur zwei: am Lavafluss s\xFCdwestlich des Wegpunkts (X \u2212645 / Y 255) und in einem Torbogen \xF6stlich des Abstiegs (X \u2212558 / Y 278).","Auf die Plattform der Schmiede (X \u2212558 / Y 230). Erz und Gussform in ihre Kammern legen \u2013 die Gussform-Kammer liegt neben dem Tiegel.","Hebel in der Mitte des Podests ziehen \u2013 der Hammer senkt sich. Die Plattform muss unten sein; der Knopf hinter dem Hebel hebt sie an, dann funktioniert die Schmiede nicht.","Lavaventil am Ofen \xF6ffnen. Achtung: Beim ersten \xD6ffnen erscheinen Grym und Magma-Mephiten.","Hammer erneut fallen lassen, dann mit dem Hebel neben der Kammer die Gussform auswerfen und die R\xFCstung aufheben. Tipp: Droughnir ist Gildenhandwerker \u2013 hebt er das erste St\xFCck selbst auf, bekommt er die Inspiration Art Endures."]},{id:"tut-moondrop",n:"Mondtropfenanh\xE4nger",loc:"loc-owlbear",steps:["In der Eulenb\xE4renh\xF6hle (X \u2212321 / Y \u2212135) hinten zur versiegelten Sel\xFBne-Truhe.","Hinter der Sel\xFBne-Statue liegt das Gebetsblatt auf dem Boden (Wahrnehmung).","Das Gebet vor der Truhe vorlesen \u2013 sie \xF6ffnet sich. Effekt des Anh\xE4ngers: bei 50 % TP oder weniger keine Gelegenheitsangriffe. Legst du ihn erst an, wenn du schon darunter bist, greift er erst nach dem n\xE4chsten Schaden oder der n\xE4chsten Heilung."]},{id:"tut-wyrmway",n:"Drachenweg & Riesent\xF6ter",loc:"loc-wyrmway",steps:["Im Westfl\xFCgel des Wyrmfelsen-Gef\xE4ngnisses beide Drachenkopf-Fackeln mit Blitzschaden treffen (Schockgriff, Hexenpfeil, Blitzpfeile). Die Flammen werden blau, die Wand dazwischen wird passierbar. Vorsicht: Angriffe k\xF6nnen Wachen alarmieren.","Pr\xFCfung der Gerechtigkeit: Zuerst den Richter-Schatten vor den Gem\xE4lden magisch entfernen (Fluch brechen auf jedes Gem\xE4lde, Verbannung oder Untote vertreiben). Dann \u201EDie Zelle\u201C auf das Pult legen \u2013 Freiheit oder Henken rufen Untote.","Pr\xFCfung der Einsicht: Die B\xFCcher lassen sich mit SG 15 Fingerfertigkeit fangen (ein Versuch pro Figur) oder mit Befehl stoppen. Die L\xF6sung: den Geist Suelto am Ende der Kammer angreifen (1 TP) \u2013 seine B\xFCcher zeigen eine grausame Ideologie.","Pr\xFCfung der Strategie: Lanzenbrett-R\xE4tsel \u2013 Schwarz in zwei Z\xFCgen mattsetzen, drei Versuche. Alternative: den schwarzen K\xF6nig mit Blitzschaden zerst\xF6ren (50 TP auf Ausgewogen). Gale kennt die L\xF6sung.","Pr\xFCfung des Mutes: Wer die Statue ber\xFChrt, tr\xE4gt die Fackel. 4 Runden \xFCberleben, nicht zu Boden gehen und den Raum nicht verlassen. Heiligtum oder ein Trank der universellen Resistenz auf dem Tr\xE4ger machen es leicht.","Danach \xF6ffnet sich das Heiligtum. Baldurans Riesent\xF6ter liegt auf Ansurs Leichnam \u2013 Ansprechen oder Pl\xFCndern startet den Kampf gegen Ansur und zwei Wasser-Myrmidonen. Den Helm des Balduran auf dem Altar im Norden kannst du seit Patch 8 nehmen, ohne Ansur zu wecken."]},{id:"tut-archive",n:"Archiv im Haus der Hoffnung",loc:"loc-hope",steps:["Im Archiv liegen die Panzerhandschuhe der H\xFCgelriesenst\xE4rke auf einem Sockel; das Amulett der gr\xF6\xDFeren Gesundheit ist im selben Raum.","Falle vor dem Nehmen entsch\xE4rfen: SG 20 Fingerfertigkeit.","Alternative: einen Gegenstand mit gleichem Gewicht auf den Sockel legen und dann die Handschuhe nehmen \u2013 so sparst du dir Wahrnehmung und Entsch\xE4rfen.","Kein Respec n\xF6tig: Handschuhe und Amulett setzen ST\xC4 und KON auch als Eidbrecher auf 23."]},{id:"tut-mirror",n:"Spiegel des Verlusts",loc:"loc-grief",steps:["Der Spiegel in der Shar-Pr\xFCfung (Akt 2) ist zerbrochen \u2013 nutzbar ist nur der im Haus der Trauer (Kreuzgang der d\xFCsteren Umarmung, Akt 3).","Spiegel identifizieren: SG 20 Religion oder SG 25 Arkane Kunde \u2013 eine Figur reicht. Alternativ die hastige Notiz in der Nachtorchideen-H\xF6hle lesen.","Jede Figur betet einmal: SG 25 Religion. Misslingt das Gebet, ist +2 f\xFCr diese Figur nie mehr m\xF6glich \u2013 vorher alle Boni auf Religion sammeln.","Erinnerungen opfern (bis zu 6, je eine pro Attribut): Jede kostet \u22122 auf das Attribut bis zur langen Rast oder bis Fluch brechen bzw. M\xE4chtige Genesung. Nach erfolgreichem Gebet etwa 60 % Chance pro Versuch auf +2 (bis max. 24), 20 % auf Patriars Erinnerung (+1 CHA).","Nach einem +2 kannst du keine weiteren Erinnerungen opfern. Jede Figur bekommt +2 nur einmal."]},{id:"tut-hgs-shop",n:"H\xFCgelriesen-Elixier kaufen",loc:"loc-myconid",steps:["Grundregel: H\xE4ndler f\xFCllen ihr Sortiment nach jeder langen Rast oder jedem Stufenaufstieg neu auf. Steht kein Elixier im Laden, rasten und noch einmal nachsehen.","Akt 1 \u2013 Tantchen Ethel (Zelt im Smaragdhain, sp\xE4ter Uferteehaus): 3 St\xFCck pro Rast, solange ihr Laden offen ist. Zeigt sie ihre Vettel-Gestalt, flieht oder stirbt, ist er f\xFCr immer zu.","Akt 1 \u2013 Derryth Bonecloak: Unterreich, Ebonsee-Grotte, nahe dem westlichen Eingang der Myconid-Kolonie. Hat das Elixier nur gelegentlich, bis zu 2 pro Rast. Sie verkauft auch H\xFCgelriesen-Finger zum Selberbrauen.","Akt 1 \u2013 Lady Esther: Pfad zum Rosymorn-Kloster (\xFCber den Gebirgspass).","Akt 2 \u2013 Araj Oblodra in den Mondaufgangst\xFCrmen (bei ihrer Alchemie-Ausr\xFCstung) sowie Quartiermeisterin Talli und Mattis im Gasthaus Letztes Licht. F\xE4llt das Gasthaus, stirbt Talli \u2013 fr\xFCh einkaufen.","Akt 3 \u2013 Entharl Danthelon (Danthelons Tanzende Axt, Wyrms\xFCbergang) und Oliver Tefoco (Beehive General Goods, Unterstadt). Ab den Panzerhandschuhen (ST\xC4 23) brauchst du es aber nicht mehr.","Vorrat anlegen: lieber 3\u20134 St\xFCck auf einmal kaufen. Trinken ist eine Bonusaktion und h\xE4lt bis zur langen Rast \u2013 also vor dem Bosskampf trinken, nicht mittendrin.","In der App: im Tab \u201EAusr\xFCstung\u201C unter Aktives Elixier \u201EH\xFCgelriese\u201C w\xE4hlen \u2013 dann rechnet sie mit ST\xC4 21."]},{id:"tut-hgs-loot",n:"H\xFCgelriesen-Elixier finden",loc:"loc-grove",steps:["Feste Fundorte gibt es laut bg3.wiki nur zwei \u2013 das meiste bekommst du \xFCber H\xE4ndler oder Alchemie.","Akt 1 \u2013 Smaragdhain: ein Elixier liegt in Tantchen Ethels Laden als Ware aus. Zeigt das Hand-Symbol beim Anvisieren rot, ist Mitnehmen Diebstahl \u2013 nur unbeobachtet nehmen oder einfach kaufen.","Akt 3 \u2013 Wyrms\xFCbergang: zweiter Stock des S\xFCdspann-Kontrollpunkts (X \u221213 / Y 55).","Werfen statt trinken? Lieber nicht: Geworfen hebt es die ST\xC4 aller Figuren im Radius von 1 m nur f\xFCr 10 Z\xFCge. Getrunken h\xE4lt es bis zur langen Rast.","Gefundene Elixiere sparen und f\xFCr Bosse nutzen \u2013 im Alltag reicht deine ST\xC4 17."]},{id:"tut-hgs-brew",n:"H\xFCgelriesen-Elixier brauen",loc:"loc-myconid",steps:["Zutat kaufen: H\xFCgelriesen-Finger (Hill Giant Finger) bei Derryth Bonecloak an der Myconid-Kolonie im Unterreich \u2013 laut Wiki auch bei weiteren H\xE4ndlern im Spiel. Du brauchst 3 Finger pro Elixier.","Generische Zutat besorgen: eine beliebige Suspension. Sie entsteht beim Extrahieren bestimmter Pflanzen, z. B. Suspension of Mergrass aus Mergrass. Einfach unterwegs Zutaten aufsammeln \u2013 sie landen automatisch im Alchemiebeutel.","Alchemie \xF6ffnen: Taste H, nur au\xDFerhalb des Kampfes.","3 H\xFCgelriesen-Finger zu Salts of Hill Giant Fingernails extrahieren. Laut Wiki schaltet genau das auch das Rezept frei.","Restliche Zutaten mit \u201EAlle Zutaten extrahieren\u201C umwandeln \u2013 jede Zutat wird zu genau einem Extrakt, nichts geht verloren, und neue Rezepte werden freigeschaltet.","Brauen: Salts of Hill Giant Fingernails plus eine beliebige Suspension ergibt das Elixier der H\xFCgelriesenst\xE4rke.","Achtung bei der Suspension: Nimm eine, die du nicht als spezielle Zutat f\xFCr ein anderes Rezept brauchst \u2013 zum Beispiel nicht die, aus der du Heiltr\xE4nke machst.","Gute Zutaten-Fundorte laut Wiki: Apotheke und Keller im Verfallenen Dorf (Akt 1), Waning Moon (Akt 2), Bonecloaks Apotheke (Akt 3)."]},{id:"tut-vigour",n:"Trank der ewigen Kraft (Araj)",loc:"loc-moonrise",steps:["Akt 2, Mondaufgangst\xFCrme: Araj Oblodra steht bei ihrer Alchemie-Ausr\xFCstung. Astarion muss in der Gruppe sein \u2013 ist er im Lager, bittet sie dich, ihn das n\xE4chste Mal mitzubringen.","Sie bittet Astarion, sie zu bei\xDFen, damit sie Vampirbisse erforschen kann. Daf\xFCr bietet sie den Trank der ewigen Kraft an.","Astarion z\xF6gert und warnt, mit ihrem Blut stimme etwas nicht. Er bei\xDFt, wenn seine Zustimmung hoch genug ist und er die Wahl bekommt \u2013 oder wenn du es ihm befiehlst.","Folge: \u22123 Zustimmung bei Astarion und eine Lagerszene, die eine Romanze mit ihm betrifft. Sonst keine Konsequenzen.","Trank trinken (Bonusaktion): +2 ST\xC4 dauerhaft \u2013 auch \xFCber 20, \xFCbersteht Tod und Umskillen. Bei Droughnir also ST\xC4 17 \u2192 19 (+4).","Er wirkt nicht, solange etwas die ST\xC4 fest setzt (Elixier, Panzerhandschuhe) \u2013 lohnt sich trotzdem f\xFCr alle K\xE4mpfe ohne Elixier.","In der App: Checklistenpunkt \u201ETrank der ewigen Kraft\u201C abhaken \u2013 die Werte rechnen sofort mit ST\xC4 19."]},{id:"tut-knight",n:"Eid gebrochen \u2013 was jetzt?",loc:"loc-camp",steps:["Nach dem Eidbruch sind deine Eid-F\xE4higkeiten gesperrt, bis du im Lager mit dem Eidbrecher-Ritter sprichst.","Eidbrecher annehmen (kostenlos) \u2013 oder den alten Eid f\xFCr 1.000 Gold wiederherstellen (danach 2.000, ab dem dritten Mal 10.000).","Als Eidbrecher: keine Grunds\xE4tze, aber kein Respec bei Der Verdorrte.","Den Ritter niemals t\xF6ten \u2013 sonst gibt es f\xFCr den Rest des Spiels keinen Respec mehr."]}],Mt=Object.fromEntries(wr.map(e=>[e.id,e])),co=Object.fromEntries(Va.map(e=>[e.id,e])),Ti=Object.fromEntries($c.map(e=>[e.id,e])),Hi={a1:{loc:["loc-ruins"]},o2:{loc:["loc-ruins"]},o1:{loc:["loc-camp"],npc:["npc-knight"],tut:"tut-knight"},o11:{loc:["loc-camp"],npc:["npc-knight"],tut:"tut-knight"},o15:{loc:["loc-camp"],npc:["npc-withers"]},o4:{loc:["loc-camp"],npc:["npc-withers"]},a2:{loc:["loc-myconid","loc-rosymorn","loc-lastlight"],npc:["npc-ethel"],tut:"tut-hgs-shop"},a3:{loc:["loc-grove","loc-goblin"],npc:["npc-dammon","npc-grat"]},a4:{loc:["loc-grove"],npc:["npc-volo","npc-grat"]},a5:{loc:["loc-grove"],npc:["npc-dammon"]},a6:{},a7:{loc:["loc-grove","loc-ethel"],npc:["npc-ethel"]},a8:{loc:["loc-owlbear"],tut:"tut-moondrop"},a9:{loc:["loc-ethel"],npc:["npc-ethel"],tut:"tut-ethel"},a9b:{loc:["loc-ethel"]},a10:{loc:["loc-goblin"],npc:["npc-grat"]},a11:{loc:["loc-goblin"],npc:["npc-dror"]},a12:{loc:["loc-goblin"],npc:["npc-minthara"]},a13:{loc:["loc-outpost"]},a14:{loc:["loc-myconid"],npc:["npc-derryth"]},a15:{loc:["loc-grymforge"],npc:["npc-greymon"]},o3:{loc:["loc-grymforge"],npc:["npc-greymon"]},a16:{loc:["loc-grymforge"],npc:["npc-grym"],tut:"tut-forge"},o14:{loc:["loc-risen"],npc:["npc-anders"]},o13:{loc:["loc-creche"]},o10:{loc:["loc-rosymorn"],npc:["npc-esther"]},b1:{loc:["loc-lastlight"],npc:["npc-talli"]},b2:{loc:["loc-lastlight"]},o16:{loc:["loc-lastlight"],npc:["npc-dammon"]},b4:{loc:["loc-moonrise"],npc:["npc-araj"],tut:"tut-vigour"},o17:{loc:["loc-gauntlet"]},o7:{loc:["loc-shadowlands"]},o6:{loc:["loc-healing"],npc:["npc-malus"]},c1:{loc:["loc-hope"],tut:"tut-archive"},c2:{loc:["loc-hope"],tut:"tut-archive"},c3:{loc:["loc-hope"],npc:["npc-raphael"]},o18:{loc:["loc-grief"],tut:"tut-mirror"},c4:{loc:["loc-wyrmway"],npc:["npc-ansur"],tut:"tut-wyrmway"},o19:{loc:["loc-wyrmway"],npc:["npc-ansur"],tut:"tut-wyrmway"}},ha={H\u00E4ndler:"#c8a86b",Gegner:"#c0562c",Quest:"#8b5cf6",Lager:"#7aa2c8",Untot:"#8fc9a8"},ld={"s-vow-enmity":{t:"Bonusaktion",src:"Eid der Rache 3 \xB7 Eid-Ladung",r:"3 m",d:"10 Runden",rest:"Eid-Ladung l\xE4dt bei kurzer Rast",mech:"Du hast 10 Runden lang Vorteil auf alle Angriffsw\xFCrfe gegen ein Ziel.",tac:["Vor dem ersten Schlag gegen Bosse. Vorteil gleicht den GWM-Malus (\u22125) fast komplett aus \u2013 mit dem Gel\xFCbde lohnt sich \u201EAll In\u201C praktisch immer.","Vorteil verdoppelt fast deine Krit-Chance (rund 10 % statt 5 % pro Angriff) und damit die Zahl der Krit-Smites."],warn:"Paladine haben nur eine Eid-Ladung pro kurzer Rast \u2013 Gel\xFCbde, Macht des Inquisitors und Feind bannen teilen sie sich."},"s-inquisitors-might":{t:"Bonusaktion",src:"Eid der Rache 1 \xB7 Eid-Ladung",r:"9 m",d:"2 Runden",rest:"Eid-Ladung l\xE4dt bei kurzer Rast",mech:"Du oder ein Verb\xFCndeter verursacht mit Waffenangriffen zus\xE4tzlichen glei\xDFenden Schaden in H\xF6he deines CHA-Modifikators (mindestens 1). Treffer machen Gegner 1 Runde benommen \u2013 ohne Rettungswurf.",tac:"F\xFCr einen kurzen Burst-Zug mit vielen Treffern (Tatendrang, Hast, drei Angriffe auf W/R-Hexklinge). Bei l\xE4ngeren K\xE4mpfen ist das Gel\xFCbde die bessere Wahl f\xFCr die Ladung.",warn:"Glei\xDFender Schaden \u2013 gegen Gegner mit Strahlender Vergeltung (Shar-Pr\xFCfung, Haus der Trauer) nicht benutzen."},"s-abjure-enemy":{t:"Aktion",src:"Eid der Rache 3 \xB7 Eid-Ladung",mech:"Ein Gegner wird ver\xE4ngstigt: Nachteil auf Attributs- und Angriffsw\xFCrfe, er kann sich nicht bewegen.",tac:"Notbremse gegen einen gef\xE4hrlichen Nahk\xE4mpfer. F\xFCr Schaden ist das Gel\xFCbde fast immer besser."},"s-hunters-mark":{t:"Bonusaktion",src:"Eidzauber Rache 3 \xB7 Grad 1",d:"Konzentration",k:!0,mech:"Das markierte Ziel nimmt bei jedem deiner Waffentreffer 1W6 zus\xE4tzlichen Schaden. Stirbt es, versetzt du das Mal per Bonusaktion.",tac:"G\xFCnstiger Dauerschaden \u2013 je mehr Angriffe pro Zug, desto mehr bringt es.",warn:"Konzentration: vertr\xE4gt sich nicht mit Magischer Waffe, eigener Hast oder Zornigem Niederstrecken."},"s-relentless-avenger":{t:"Passiv",src:"Eid der Rache 7",mech:"Triffst du mit einem Gelegenheitsangriff, bewegst du dich im n\xE4chsten Zug 4,5 m weiter.",tac:"Kein Schaden, aber hilft beim Nachsetzen gegen Fernk\xE4mpfer und Fliehende."},"s-misty-step":{t:"Bonusaktion",src:"Eidzauber Rache 5 \xB7 Grad 2",mech:"Teleportiert dich an einen sichtbaren Punkt in Reichweite.",tac:"Immer vorbereitet: direkt an den Boss, auf erh\xF6hte Positionen oder aus der Umzingelung \u2013 die Glaskanone kommt schneller an ihr Ziel und wieder weg."},"s-hexblade-curse":{t:"Bonusaktion",src:"Hexenmeister 1 (Hexklinge)",rest:"Kurze Rast",mech:"Verflucht ein Ziel: Deine Angriffe dagegen verursachen zus\xE4tzlichen Schaden in H\xF6he deines \xDCbungsbonus und sind schon bei 19\u201320 kritisch.",tac:"Fluch und Gel\xFCbde auf denselben Boss: Vorteil plus Krit ab 19 ergibt etwa 19 % Krit-Chance pro Angriff \u2013 fast jeder zweite Zug bringt einen Krit-Smite."},"s-shadow-blade":{t:"Bonusaktion (beschw\xF6ren)",src:"Zauberer / Hexenmeister \xB7 Grad 2",d:"Bis zur langen Rast",mech:"Beschw\xF6rt ein psychisches Kurzschwert: 2W8 psychischer Schaden, hochgewirkt 3W8, h\xF6chstens 4W8 (seit Patch 8).",tac:"Kern des Sorcadin-Wegs (R3). Aus Dunkelheit heraus mit Vorteil angreifen. Der Resonanzstein (Ende Akt 2) macht Gegner in 9 m verwundbar gegen psychischen Schaden.",warn:"Keine schwere Waffe \u2013 Meisterschaft gro\xDFer Waffen gilt nicht. Konstrukte sind gegen psychischen Schaden immun."},"s-booming-blade":{t:"Aktion (Zaubertrick)",src:"Zaubertrick (seit Patch 8)",mech:"Nahkampf-Waffenangriff mit Donnerenergie: Bewegt sich das Ziel danach, nimmt es zus\xE4tzlichen Schallschaden.",tac:"Ersetzt beim Sorcadin den Standardangriff gegen Ziele, die fliehen oder sich neu positionieren wollen."},"s-divine-smite":{t:"Reaktion bei Treffer",src:"Paladin 2 \xB7 Zauberplatz ab Grad 1",r:"Nahkampf",d:"Sofort",mech:["Nach einem Nahkampftreffer opferst du einen Zauberplatz f\xFCr glei\xDFenden Zusatzschaden. Der Schaden h\xE4ngt von keinem Attribut ab \u2013 weder ST\xC4 noch CHA \u2013, sondern nur vom Grad des Platzes:","Grad 1: 2W8 \xB7 Grad 2: 3W8 \xB7 Grad 3: 4W8 \xB7 Grad 4: 5W8 \u2013 das ist die harte Obergrenze. Gegen Untote und Unholde kommt 1W8 dazu. Bei einem kritischen Treffer werden alle Smite-W\xFCrfel verdoppelt.","In BG3 sind das zwei getrennte Reaktionen: die normale l\xF6st bei Krits nicht aus, \u201EG\xF6ttliches Niederstrecken: Kritischer Treffer\u201C nur bei Krits (4W8 auf Grad 1). Beide einzeln einstellen.","ST\xC4 und CHA wirken nur indirekt: auf die Trefferchance, den Waffenschaden und (ab Stufe 7) die Aura des Hasses."],tac:"Pl\xE4tze f\xFCr Krits aufheben \u2013 gegen gel\xE4hmte Ziele (Person festhalten) ist jeder Nahkampftreffer ein Krit. Kampf mit gro\xDFen Waffen und Wilder Angreifer w\xFCrfeln Smite-W\xFCrfel in BG3 neu.",warn:["H\xF6llischer Tadel teilt sich dieselben Pl\xE4tze \u2013 dessen Reaktion ausschalten.","Strahlende Vergeltung (Radiant Retort): Die Dunklen Justiziare in der Shar-Pr\xFCfung (Akt 2) sowie die Sharraner und Viconia im Haus der Trauer (Akt 3) werfen glei\xDFenden Schaden doppelt als Energieschaden auf dich zur\xFCck. Laut bg3.wiki haben einige Justiziare die Eigenschaft erst ab Taktiker \u2013 pr\xFCfe trotzdem vor jedem Smite den Tooltip des Gegners. Ein gro\xDFer Krit-Smite kann Droughnir sonst selbst umhauen.","Im Haus der Hoffnung (Akt 3) haben Raphaels Rachs\xFCchtige Kreaturen (Cambion, Imp, Merregon) stattdessen Fl\xFCchtiger Schutz: Der erste glei\xDFende Treffer kommt doppelt als Feuerschaden zur\xFCck, danach endet der Schutz."],gear:["Helmet of Smiting"],loc:["loc-gauntlet","loc-grief","loc-hope"]},"s-control-undead":{t:"Aktion",src:"Eidbrecher 3 \xB7 Eid-Ladung",r:"6 m",d:"Bis zur langen Rast",rest:"Eid-Ladung l\xE4dt bei kurzer Rast",mech:["Ein lebender, also aktiver untoter Gegner mit niedrigerem Level als du legt einen Weisheitsrettungswurf gegen deinen Zauber-SG ab. Misslingt er, k\xE4mpft er als KI-Verb\xFCndeter f\xFCr dich.","Leichen kannst du damit nicht erwecken \u2013 daf\xFCr gibt es ab Paladin-Stufe 9 den Eidzauber Tote beleben (Animate Dead).","Heilzauber wie Wunden heilen und Handauflegen wirken nicht auf Untote. Rechne damit, dass sich dein Untoter nur \xFCber eine kurze Rast erholt."],tac:["Akt 1: Es gibt kaum Ziele \u2013 praktisch nur Gruft-Schreiber und Gruft-Krieger in der Feuchten Gruft unter den \xDCberwucherten Ruinen. Die eine Eid-Ladung ist meist besser bei Trotziges Leid (Bosse) oder Gr\xE4ssliches Aussehen (Gruppen) aufgehoben.","Ab Akt 2 lohnt es sich: Schattenverfluchte Lande, Reithwin und das Haus der Heilung mit Malus Thorm (ab Stufe 8 ein Boss-Skip) bieten viele starke Ziele.","Untote mit Waffen bevorzugen \u2013 ab Stufe 7 profitieren nur sie neben dir von der Aura des Hasses, Ghule oder Zombies mit Klauen nicht."],warn:["Gehst du zu Boden, ist der Untote endg\xFCltig weg. Teilt sich die Eid-Ladung mit Trotziges Leid und Gr\xE4ssliches Aussehen.","Die Level-Angaben gelten f\xFCr \u201EAusgewogen\u201C \u2013 auf Taktiker und Ehrenmodus k\xF6nnen Gegner h\xF6her sein."],chk:["o2","o6"],loc:["loc-ruins","loc-shadowlands","loc-healing"],npc:["npc-malus"]},"s-dreadful-aspect":{t:"Aktion",src:"Eidbrecher 3 \xB7 Eid-Ladung",r:"9 m um dich",d:"2 Runden",rest:"Eid-Ladung l\xE4dt bei kurzer Rast",mech:"Alle Feinde im Umkreis legen einen Weisheitsrettungswurf ab. Bei Misserfolg sind sie ver\xE4ngstigt: keine Bewegung, Nachteil auf Angriffe und Attributsw\xFCrfe.",tac:"Mitten in eine Gruppe laufen und z\xFCnden \u2013 danach kann niemand fliehen. Astarion mit dem Bogen der Todesfee bekommt +1W4 gegen Ver\xE4ngstigte.",gear:["Bow of the Banshee"],who:["Astarion"]},"s-spiteful-suffering":{t:"Aktion",src:"Eidbrecher 1 \xB7 Eid-Ladung",r:"3 m",d:"3 Runden",rest:"Eid-Ladung l\xE4dt bei kurzer Rast",mech:"Das Ziel legt einen Charismarettungswurf ab. Misslingt er, nimmt es jede Runde 1W4 + CHA-Mod nekrotischen Schaden, und alle Angriffe gegen es haben Vorteil. Zu Beginn jedes Zuges darf es erneut w\xFCrfeln.",tac:"Der Boss-Opener: Vorteil gleicht den GWM-Malus von \u22125 aus. Zug 1 Trotziges Leid, ab Zug 2 alles mit \u201EAll In\u201C."},"s-aura-hate":{t:"Passiv (Aura)",src:"Eidbrecher 7",r:"3 m",d:"Dauerhaft",mech:"Du und alle Unholde und Untoten in der Aura \u2013 auch feindliche \u2013 addieren deinen CHA-Modifikator zum Schaden ihrer Nahkampfwaffenangriffe.",tac:"Je mehr Treffer pro Zug, desto mehr bringt die Aura \u2013 deshalb vergleicht der Tab \u201EWege\u201C Builds mit 3 und mehr Angriffen.",warn:"Feindliche Untote und Unholde neben dir profitieren mit. Klauen-Untote ohne Waffe bekommen keinen Bonus. F\xE4llt weg, solange du bewusstlos bist.",chk:["o5"]},"s-hellish-rebuke":{t:"Reaktion",src:"Eidzauber \xB7 Grad 1",r:"Fernkampf",d:"Sofort",mech:"Wenn dich ein Feind verletzt, schl\xE4gt er Feuer zur\xFCck: 2W10 Feuerschaden, ein Geschicklichkeitsrettungswurf halbiert, +1W10 je h\xF6herem Grad.",tac:"F\xFCr eine Glaskanone kaum wert \u2013 jeder Platz geh\xF6rt in Smites.",warn:"Reaktion auf Aus stellen. Sonst l\xF6st sie bei jedem Treffer gegen dich aus und verbraucht genau die Pl\xE4tze, die du f\xFCr G\xF6ttliches Niederstrecken brauchst."},"s-inflict-wounds":{t:"Aktion",src:"Eidzauber \xB7 Grad 1",r:"Nahkampf (Ber\xFChrung)",d:"Sofort",mech:"Nahkampf-Zauberangriff mit 3W10 nekrotischem Schaden, +1W10 je h\xF6herem Grad.",tac:"Nur eine Notl\xF6sung. Ein Smite auf einen Waffentreffer bringt mit GWM und Aura fast immer mehr."},"s-animate-dead":{t:"Aktion",src:"Eidzauber Eidbrecher 9 \xB7 Grad 3",r:"Leiche in der N\xE4he",d:"Bis zur langen Rast",mech:"Erweckt eine Leiche als Skelett oder Zombie, der f\xFCr dich k\xE4mpft.",tac:"Zusammen mit Untote kontrollieren eine kleine Untoten-Truppe bis zur langen Rast \u2013 das kontrollierte Ziel z\xE4hlt nicht gegen das Limit.",warn:"Klauen-Untote bekommen keinen Bonus durch die Aura des Hasses."},"s-magic-weapon":{t:"Aktion",src:"Paladin 5 \xB7 Grad 2",r:"Ber\xFChrung (1,5 m)",d:"Bis zur langen Rast",k:!0,mech:"Die Waffe bekommt einen Verzauberungsbonus auf Angriff und Schaden; laut bg3.wiki stapelt er mit vorhandenen Verzauberungen.",tac:"Gleicht einen Teil des GWM-Malus aus und h\xE4lt als Konzentrationszauber den Ring des seltsamen Leiters (+1W4 psychisch) dauerhaft an.",warn:"Belegt deine Konzentration \u2013 Hast von Gale bleibt davon unber\xFChrt, eigene Konzentrationszauber ersetzen ihn.",gear:["Strange Conduit Ring"],chk:["o13"]},"s-divine-favour":{t:"Bonusaktion",src:"Paladin 2 \xB7 Grad 1",r:"Selbst",d:"3 Runden",k:!0,mech:"Deine Waffenangriffe verursachen 1W4 zus\xE4tzlichen glei\xDFenden Schaden.",tac:"Billiger Schadens-Boost f\xFCr kurze K\xE4mpfe und Konzentrations-Ausl\xF6ser f\xFCr den Ring des seltsamen Leiters.",warn:"Nur 3 Runden \u2013 f\xFCr lange K\xE4mpfe ist Magische Waffe besser.",gear:["Strange Conduit Ring"]},"s-hold-person":{t:"Aktion",src:"Grad 2 (Gale, Schattenherz)",r:"Fernkampf",d:"Bis zu 10 Runden",k:!0,mech:"Ein humanoides Ziel legt einen Weisheitsrettungswurf ab, sonst ist es gel\xE4hmt. Am Ende jedes seiner Z\xFCge darf es erneut w\xFCrfeln. Angriffe treffen automatisch, aus 3 m oder weniger sind sie immer kritisch.",tac:"Die Krit-Maschine: Ziel festhalten lassen, dann jeden Treffer mit dem h\xF6chsten Platz smiten \u2013 doppelte Smite-W\xFCrfel.",warn:"Bricht die Konzentration des Wirkers, ist die L\xE4hmung sofort vorbei.",gear:["Gloves of Baneful Striking"],who:["Gale","Schattenherz"]},"s-haste":{t:"Aktion",src:"Grad 3 (Gale, Zauberer 5)",r:"9 m",d:"10 Runden",k:!0,mech:"Hast: +2 RK, Vorteil auf Geschicklichkeitsrettungsw\xFCrfe, +9 m Bewegung und eine zus\xE4tzliche Aktion pro Zug.",tac:"Die zus\xE4tzliche Aktion ist ein voller Angriff mit Extra-Angriff \u2013 auf den meisten Wegen verdoppelt Hast deinen Schaden pro Zug.",warn:"Endet Hast vorzeitig, ist das Ziel einen Zug lethargisch: keine Bewegung, keine Aktionen, keine Reaktionen. Deshalb lieber Gale halten lassen. Im Ehrenmodus erlaubt die Hast-Aktion wie am Tisch nur einen einzelnen Angriff, keinen Extra-Angriff.",who:["Gale"]},"s-wrathful-smite":{t:"Waffenangriff \xB7 bei Treffer Bonusaktion",src:"Paladin \xB7 Grad 1",r:"Nahkampf",d:"Ver\xE4ngstigt 2 Runden",k:!0,mech:"Waffenangriff mit 1W6 zus\xE4tzlichem psychischem Schaden. Das Ziel legt einen Weisheitsrettungswurf ab, sonst ist es ver\xE4ngstigt.",tac:"Stapelt mit G\xF6ttlichem Niederstrecken \u2013 bei Treffer kommt zus\xE4tzlich die Smite-Abfrage.",warn:"Braucht Konzentration und ersetzt damit Magische Waffe oder G\xF6ttliche Gunst."},"s-gwm":{t:"Passiv (Talent, umschaltbar)",src:"Talent \xB7 Paladin 4",r:"Nahkampf",d:"Dauerhaft",mech:"\u201EAll In\u201C: \u22125 auf den Angriffswurf, daf\xFCr +10 Schaden mit schweren Nahkampfwaffen. Nach einem Krit oder Kill bekommst du einen Bonusangriff.",tac:"Nur mit Vorteil, Segnen oder gegen niedrige RK aktiv lassen. Gilt nur f\xFCr zweih\xE4ndig gef\xFChrte Waffen, mit denen du ge\xFCbt bist.",gear:["Gloves of the Growling Underdog"]},"s-bless":{t:"Aktion",src:"Grad 1 (Schattenherz)",r:"Fernkampf, bis zu 3 Ziele",d:"10 Runden",k:!0,mech:"Gesegnete Ziele addieren 1W4 zu Angriffsw\xFCrfen und Rettungsw\xFCrfen.",tac:"Gleicht im Schnitt 2,5 Punkte des GWM-Malus aus. \xDCber Das fl\xFCsternde Versprechen bekommst du den Segen sogar ohne ihre Konzentration.",gear:["The Whispering Promise"],chk:["a4"],who:["Schattenherz"]},"s-healing-word":{t:"Bonusaktion",src:"Grad 1 (Schattenherz)",r:"Fernkampf",d:"Sofort",mech:"Heilt ein Ziel aus der Distanz um 1W4 + Weisheitsmodifikator.",tac:"Tr\xE4gt Schattenherz Das fl\xFCsternde Versprechen, wird das geheilte Ziel zus\xE4tzlich gesegnet \u2013 ohne dass sie sich konzentrieren muss. So bleibt ihre Konzentration f\xFCr Schutzgeister oder Person festhalten frei.",gear:["The Whispering Promise"],chk:["a4"],who:["Schattenherz"]},"s-aura-protection":{t:"Passiv (Aura)",src:"Paladin 6",r:"3 m",d:"Dauerhaft",mech:"Du und Verb\xFCndete in der Aura addieren deinen CHA-Modifikator (mindestens +1) zu allen Rettungsw\xFCrfen.",tac:"Die wichtigste Defensive der Glaskanone. Steht Schattenherz nah bei dir, h\xE4lt sie ihre Konzentration viel zuverl\xE4ssiger.",chk:["b5"]},"s-shield":{t:"Reaktion",src:"Zauberer 1 \xB7 Grad 1",r:"Selbst",d:"Bis zu deinem n\xE4chsten Zug",mech:"+5 RK, bis dein n\xE4chster Zug beginnt; Magische Geschosse prallen ab.",tac:"Nur auf dem Zauberer-Weg verf\xFCgbar. Auf Nachfragen stellen, damit sie nicht an kleine Treffer verpufft."},"s-pact-blade":{t:"Klassenmerkmal",src:"Hexenmeister 3",r:"Eigene Waffe",d:"Bis zur langen Rast",mech:"Du bindest eine Waffe: Angriff und Schaden laufen \xFCber CHA, die Waffe gilt als magisch. Mit Vertieftem Pakt (Hexenmeister 5) kommt au\xDFerhalb des Ehrenmodus ein dritter Angriff dazu.",tac:"Baldurans Riesent\xF6ter binden: Die Passive addiert weiterhin ST\xC4, du bekommst also CHA + ST\xC4 auf den Schaden.",warn:"Der dritte Angriff braucht laut deiner Quelle die gebundene Waffe \u2013 im Spiel pr\xFCfen.",gear:["Balduran's Giantslayer"]},"s-action-surge":{t:"Frei (keine Aktion)",src:"K\xE4mpfer 2",r:"Selbst",d:"Dieser Zug",rest:"Kurze Rast",mech:"Du bekommst sofort eine zus\xE4tzliche Aktion \u2013 mit vollem Extra-Angriff, auch im Ehrenmodus.",tac:"F\xFCr den Er\xF6ffnungs-Burst: Angriff, Tatendrang, Hast-Aktion \u2013 bis zu sechs Angriffe in einem Zug."},"s-improved-smite":{t:"Passiv",src:"Paladin 11",r:"Nahkampf",d:"Dauerhaft",mech:"Jeder Nahkampfwaffentreffer verursacht 1W8 zus\xE4tzlichen glei\xDFenden Schaden \u2013 ohne Zauberplatz.",tac:"Nur der reine Eidbrecher kommt hierhin. Wirkt auch beim GWM-Bonusangriff."},"s-savage-attacker":{t:"Passiv (Talent)",src:"Talent",r:"Nahkampf",d:"Dauerhaft",mech:"Waffenschadensw\xFCrfel werden zweimal geworfen, der h\xF6here Wurf z\xE4hlt.",tac:"W\xFCrfelt in BG3 auch die W\xFCrfel von G\xF6ttliches Niederstrecken neu \u2013 deshalb das dritte Talent beim reinen Eidbrecher."},"s-quickened":{t:"Metamagie",src:"Zauberer 2 \xB7 3 Zauberpunkte",r:"\u2013",d:"\u2013",mech:"Ein Zauber, der eine Aktion kostet, kostet nur eine Bonusaktion.",tac:"Hast als Bonusaktion auf dich selbst, dann direkt angreifen. Nur auf dem Zauberer-Weg."},"s-shield-of-faith":{t:"Bonusaktion",src:"Grad 1 (Paladin, Schattenherz)",r:"Fernkampf",d:"10 Runden",k:!0,mech:"+2 RK f\xFCr ein Ziel.",tac:"Schattenherz' Alternative zu Segnen, wenn du viel Schaden frisst.",who:["Schattenherz"]},"s-aid":{t:"Aktion",src:"Grad 2 (Paladin, Schattenherz)",r:"Bis zu 3 Verb\xFCndete",d:"Bis zur langen Rast",mech:"Erh\xF6ht die maximalen und aktuellen TP der Ziele (5 auf Grad 2, mehr auf h\xF6heren Graden).",tac:"Direkt nach der langen Rast wirken \u2013 kostet keine Konzentration und h\xE4lt den ganzen Tag.",who:["Schattenherz"]},"s-warding-bond":{t:"Aktion",src:"Grad 2 (Schattenherz)",r:"Ber\xFChrung",d:"Bis zur langen Rast",mech:"+1 RK und Rettungsw\xFCrfe sowie Resistenz gegen allen Schaden f\xFCr dich \u2013 Schattenherz nimmt daf\xFCr denselben Schaden.",tac:"Macht die Glaskanone deutlich z\xE4her. Nur nutzen, wenn Schattenherz selbst hinten sicher steht.",warn:"F\xE4llt Schattenherz, endet der Schutz \u2013 und du verlierst deine Heilerin.",who:["Schattenherz"]},"s-spirit-guardians":{t:"Aktion",src:"Grad 3 (Schattenherz)",r:"Aura um die Wirkerin",d:"10 Runden",k:!0,mech:"Geister umkreisen Schattenherz: Feinde in der Aura nehmen Schaden (Weisheitsrettungswurf halbiert) und sind verlangsamt.",tac:"Schattenherz direkt hinter dir in den Nahkampf stellen \u2013 Feinde, die zu dir wollen, laufen durch die Geister.",who:["Schattenherz"]},"s-mass-healing-word":{t:"Bonusaktion",src:"Grad 3 (Schattenherz)",r:"Fernkampf, mehrere Ziele",d:"Sofort",mech:"Heilt bis zu sechs Verb\xFCndete gleichzeitig aus der Distanz.",tac:"Die Notbremse, wenn mehrere am Boden liegen \u2013 kostet keine Aktion.",who:["Schattenherz"]},"s-revivify":{t:"Aktion",src:"Grad 3 (Schattenherz)",r:"Ber\xFChrung",d:"Sofort",mech:"Holt eine gerade gestorbene Figur mit 1 TP zur\xFCck.",tac:"Pflicht f\xFCr die Glaskanone. Bei Untote kontrollieren gilt: F\xE4llst du, ist der Untote trotzdem weg.",who:["Schattenherz"]},"s epen the Wound: +1W4 auf Angriffsw\xFCrfe mit dieser Waffe gegen Kreaturen, die schon Schaden genommen haben"],how:["Akt 1: Waukeens Rast (X \u221266 / Y 609) \u2013 Gauntlet Yeva vom Flammenden Faust tr\xE4gt es.","Erbeuten l\xE4sst es sich nur, wenn Yeva f\xE4llt.","Lebt sie, steckt sie in Akt 2 in einer Kapsel im Kaulquappen-Zentrum der Gedankenschinder-Kolonie und tr\xE4gt es weiterhin."],npc:["npc-yeva"],loc:["loc-waukeen"]},"Sword of Chaos":{props:["Gro\xDFschwert +2: 2W6 + 2 Hieb + 1W4 nekrotisch","Chaos: Jeder Schadenstreffer heilt dich um 1W6 (Schaden an Gegenst\xE4nden z\xE4hlt nicht)","Sehr selten \xB7 960 gp"],how:["Akt 3: Mordtribunal unter Candulhallows Grabsteinen in der Unterstadt.","Sarevok Anchev tr\xE4gt es \u2013 zusammen mit dem Amulett des Bhaal und seinem geh\xF6rnten Helm.","Er wird feindlich, wenn du nach Orins Tod ins Tribunal zur\xFCckkehrst."],npc:["npc-sarevok"],loc:["loc-lowercity"]},"Armour of Persistence":{props:["Schwere R\xFCstung: RK 20","\u22122 auf jeden erlittenen Schaden","Dauerhaft Resistance (+1W4 auf Rettungsw\xFCrfe)","Dauerhaft Blade Ward (Resistenz gegen Wucht, Stich und Hieb)"],how:["Akt 3: Dammon verkauft sie in der Schmiede der Neun in der Unterstadt."],npc:["npc-dammon"],loc:["loc-lowercity"]},"Haste Helm":{props:["Zu Kampfbeginn 3 Z\xFCge Schwung: +1,5 m Bewegung pro verbleibendem Zug"],how:["Akt 1: Verfallenes Dorf \u2013 die Moosbewachsene Truhe steht neben einem Wagen gegen\xFCber dem Wegpunkt in der Dorfmitte (X 34 / Y 394).","Den Moosbewachsenen Schl\xFCssel tr\xE4gt ein Goblin-Booyahg auf dem Dach der Apotheke."],loc:["loc-blighted"]},"Legacy of the Masters":{props:["+2 auf Angriffs- und Schadensw\xFCrfe mit Waffen","+1 auf ST\xC4-Rettungsw\xFCrfe","Bekannter Bug: Die +2 auf den Angriff gelten auch f\xFCr Zauberangriffe, waffenlose und Wurfangriffe (Schaden nur bei Wurfwaffen)","Sehr selten"],how:["Akt 3: Dammon verkauft sie in der Schmiede der Neun (X 5 / Y \u22127)."],npc:["npc-dammon"],loc:["loc-lowercity"]} her dort, einfach seine Leiche durchsuchen."],npc:["npc-crusher"],loc:["loc-goblin"]},"Spurred Band":{props:["Startest du im Kampf einen Zug mit h\xF6chstens 50 % TP, bekommst du Schwung f\xFCr 1 Zug","Schwung: +1,5 m Bewegung pro verbleibendem Zug (max. 5 Z\xFCge)","Endet bei Festgehalten, Kampfunf\xE4hig, Liegend oder Verlangsamt","Ungew\xF6hnlich \xB7 40 gp"],how:["Akt 1: Fl\xFCsternde Tiefen unter dem Verfallenen Dorf.","Eingang: der verwachsene Brunnen westlich der Dorfmitte (Untersuchung SG 10) oder durch den Keller der Schmiede.","Achtung: Phasenspinnen, Ettercaps und die Phasenspinnen-Matriarchin; Netze verlangen einen GES-Rettungswurf SG 12.","Der Ring liegt bei einem Skelett mit Rucksack (X \u2212495 / Y \u2212365).","Nicht ohne Federfall in die zentrale Grube springen \u2013 der Sturz ins Unterreich ist t\xF6dlich."],loc:["loc-blighted"]},"Bracing Band":{props:["Nachdem du einen Gegner st\xF6\xDFt: +1 RK bis zu deinem n\xE4chsten Zug","H\xF6chstens einmal pro Zug, jeder Sto\xDF z\xE4hlt (nicht nur \u201ESto\xDFen\u201C)","Ungew\xF6hnlich \xB7 40 gp"],how:["Akt 1: Sergeant Elenna Thrinn steht im Duergar-Lager der Grymschmiede (X \u2212643 / Y 300).","Sie sucht ihre gestohlenen Stiefel \u2013 die Boots of Speed, die Thulla in der Ebonsee-Grotte hat.","Gib Thrinn die Stiefel und w\xE4hle das Bracing Band (die andere Wahl w\xE4re die Armour of Uninhibited Kushigo)."],npc:["npc-thrinn","npc-thulla"],loc:["loc-grymforge","loc-myconid"]},"Ring of Poison Resistance":{props:["Resistenz gegen Giftschaden","Selten"],how:["Akt 1: Zerschmettertes Heiligtum \u2013 Skelett im offenen Sarkophag direkt vor den Worg-Gehegen (X 338 / Y 14).","Ihr wart schon im Heiligtum: Falls noch nicht gepl\xFCndert, kurz zur\xFCck."],loc:["loc-goblin"]},"Ring of Mind-Shielding":{props:["Vorteil auf Rettungsw\xFCrfe gegen Bezauberung","Zus\xE4tzlich der Effekt Shelter","Selten \xB7 70 gp"],how:["Akt 1: Omeluum triffst du an der Myconid-Kolonie, nachdem du mit Blurg gesprochen hast.","Er b
