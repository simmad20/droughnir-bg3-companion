1\u20132, later Bloodlust.",sp\u00E4ter:"later","Schattenherz: Beistand auf die Gruppe":"Shadowheart: Aid on the party","Ab Stufe 7 zus\xE4tzlich Todesschutz auf Droughnir, ab Stufe 11 Heldenmahl.":"From level 7 additionally Death Ward on Droughnir, from level 11 Heroes' Feast.","Droughnir: Magische Waffe":"Droughnir: Magic Weapon","Ab Stufe 5. H\xE4lt bis zur langen Rast und aktiviert den Ring des seltsamen Leiters \u2013 belegt nur deine eigene Konzentration.":"From level 5. Lasts until long rest and activates the Strange Conduit Ring \u2013 only uses your own concentration.","Auren pr\xFCfen":"Check auras","Aura des Schutzes ab Stufe 6, Aura des Hasses ab Stufe 7. Nach Tod oder Wiederbelebung m\xFCssen Auren oft neu angeklickt werden.":"Aura of Protection from level 6, Aura of Hate from level 7. After death or revival, auras often have to be clicked again.","\u2013 ab Stufe":"\u2013 from level","Nach der langen Rast":"After the long rest","Neue Rast":"New rest","Buffs, die bis zur n\xE4chsten langen Rast halten und keine Konzentration der Gef\xE4hrten binden. Einmal morgens abhaken, dann bleibt Platz f\xFCr Segnen und Hast.":"Buffs that last until the next long rest and don't tie up your companions' concentration. Tick them off once in the morning, then there's room for Bless and Haste.","Aktive Konzentration \u2013 1 pro Figur":"Active concentration \u2013 1 per character",Empfehlung:"Recommendation","W\xE4hle, was jede Figur gerade h\xE4lt. Ein neuer Konzentrationszauber derselben Figur beendet den alten \u2013 Konflikte innerhalb einer Spalte schlie\xDFen sich also aus.":"Choose what each character is currently holding. A new concentration spell by the same character ends the old one \u2013 so options within a column exclude each other.","h\xE4lt:":"holds:","Party & Buffs":"Party & Buffs",Unterbereiche:"Sub-sections",". Die Zeile \u201EStufe 12: Nova\u201C folgt deinem Rache-Weg. Die \xFCbrigen Kombos, die Eid-Ladungs-Tipps und \u201EUntote kontrollieren\u201C sind auf den Eidbrecher ausgelegt \u2013 als Rache ersetzt das Gel\xFCbde der Feindschaft Trotziges Leid, die Aura des Hasses entf\xE4llt.":'. The row "Level 12: nova" follows your Vengeance route. The other combos, the Channel Oath tips and "Control Undead" are designed for the Oathbreaker \u2013 as Vengeance, Vow of Enmity replaces Spiteful Suffering and Aura of Hate is gone.',"Kombos & Zug-Abl\xE4ufe":"Combos & turn sequences",Zauberplatz:"Spell slot","Welche Eid-Ladung wann?":"Which Channel Oath when?","Ein einzelner starker Untoter unter deinem Level \u2013 am besten einer mit Waffe.":"A single strong undead below your level \u2013 ideally one with a weapon.","3+ Feinde in 9 m: WEI-Rettungswurf, sonst 2 Runden ver\xE4ngstigt \u2013 keine Bewegung, Nachteil.":"3+ enemies within 9 m: WIS save or frightened for 2 turns \u2013 no movement, disadvantage.","Boss in 3 m: CHA-Rettungswurf, 3 Runden Vorteil auf alle Angriffe gegen ihn plus 1W4 + CHA nekrotisch pro Runde.":"Boss within 3 m: CHA save, 3 turns of advantage on all attacks against it plus 1d4 + CHA necrotic per turn.","Eine Eid-Ladung pro kurzer Rast \u2013 alle drei F\xE4higkeiten teilen sie sich.":"One Channel Oath charge per short rest \u2013 all three abilities share it.","GWM-Check":"GWM check","Neuer Kampf":"New fight","Malus (\u22125) ausgleichen \u2013 vor \u201EAll In\u201C abhaken.":'Offset the penalty (\u22125) \u2013 tick before "All In".',"Zauber-Priorit\xE4ten":"Spell priorities","\xB7 deine Lebensversicherung":"\xB7 your life insurance","L\xFCcken der Glaskanone \u2013 und wer sie schlie\xDFt":"Gaps of the glass cannon \u2013 and who closes them",Bereich:"Area","Orte \xB7":"Places \xB7","NPCs \xB7":"NPCs \xB7","Anleitungen \xB7":"Guides \xB7","Atlas durchsuchen":"Search atlas","Ort, NPC, Item oder Stichwort \u2026":"Place, NPC, item or keyword \u2026","Quest & Lager":"Quest & camp",Untote:"Undead",Schritte:"Steps","Keine Treffer f\xFCr diese Auswahl.":"No results for this selection.","Vollbild ist in dieser Vorschau gesperrt \u2013 Seitenleiste ausgeblendet. F\xFCr echtes Vollbild das Artefakt \xFCber seinen Link in einem eigenen Tab \xF6ffnen.":"Fullscreen is blocked in this preview \u2013 sidebar hidden. For real fullscreen, open the artifact via its link in its own tab.","Charakterbogen \xF6ffnen":"Open character sheet",Charakterbogen:"Character sheet","BG3 Companion":"BG3 Companion","Bilder & Icons verwalten":"Manage images & icons","Export, Import und Zur\xFCcksetzen":"Export, import and reset","Daten / Backup":"Data / Backup","Seitenleiste ausblenden":"Hide sidebar","Seitenleiste einblenden":"Show sidebar","Seitenleiste umschalten":"Toggle sidebar","Einstellungen: Namen, Darstellung, Bilder":"Settings: names, display, images","Vollbild beenden":"Exit fullscreen",Vollbild:"Fullscreen",Beenden:"Exit",Bereiche:"Sections","Stand: Patch 8 + Hotfixes bis 2026 \xB7 Daten laut bg3.wiki und deutschen Guides, Gegner-Level auf \u201EAusgewogen\u201C \xB7 Bilder von bg3.wiki (CC BY-NC-SA, \xA9 Larian Studios) \xB7 Fortschritt und eigene Bilder nur in diesem Browser \u2013 gelegentlich \u201EDaten / Backup\u201C nutzen \xB7 Deutsche Namen teils inoffiziell":'As of: Patch 8 + hotfixes up to 2026 \xB7 data from bg3.wiki and German guides, enemy levels on "Balanced" \xB7 images from bg3.wiki (CC BY-NC-SA, \xA9 Larian Studios) \xB7 progress and own images only in this browser \u2013 use "Data / Backup" now and then \xB7 German names partly unofficial',erledigt:"done",entfernen:"remove",aktiv:"active",ab:"from",eingeplant:"planned",halten:"hold",hochladen:"upload","Gro\xDFschwert mit Meisterschaft gro\xDFer Waffen \u2013 \u201EAll In\u201C nur mit Gel\xFCbde, Vorteil oder Segnen.":'Greatsword with Great Weapon Master \u2013 "All In" only with the Vow, advantage or Bless.',"Gro\xDFschwert mit Meisterschaft gro\xDFer Waffen \u2013 \u201EAll In\u201C nur mit Vorteil oder Segnen.":'Greatsword with Great Weapon Master \u2013 "All In" only with advantage or Bless.',"Stufen 1\u20135 sind bei allen Rache-Wegen gleich. Abhaken setzt dein Level automatisch mit.":"Levels 1\u20135 are the same on all Vengeance routes. Ticking also sets your level automatically.","Stufen 1\u20137 sind bei allen Eidbrecher-Wegen gleich. Abhaken setzt dein Level automatisch mit.":"Levels 1\u20137 are the same on all Oathbreaker routes. Ticking also sets your level automatically.","Eidbrecher-Wege":"Oathbreaker routes",GES:"DEX",KON:"CON",WEI:"WIS",INT:"INT",CHA:"CHA","Eid-Ladung":"Channel Oath","Warum f\xFCr dich":"Why it's for you","Orte & NPCs":"Places & NPCs","NPCs hier":"NPCs here","Kontrollierbare Untote":"Controllable undead","Items hier":"Items here",Wo:"Where",Mechanik:"Mechanics","F\xFCr Droughnir":"For Droughnir",Achtung:"Warning","Wer & wann":"Who & when","Passende Items":"Matching items",Wirkung:"Effect","Wer ist Droughnir?":"Who is Droughnir?",Steckbrief:"Profile","Attribute \xB7":"Abilities \xB7","Volk: Roter Drachenbl\xFCtiger":"Race: Red Dragonborn",Spielweise:"Playstyle",St\u00E4rken:"Strengths",Schw\u00E4chen:"Weaknesses","Kern-F\xE4higkeiten":"Core abilities","Fahrplan \xB7":"Roadmap \xB7","Rolle f\xFCr Droughnir":"Role for Droughnir","Build-Empfehlung":"Build recommendation","Buffs & Heilung f\xFCr Droughnir":"Buffs & healing for Droughnir","Items f\xFCr sie/ihn":"Items for them","Schritt f\xFCr Schritt":"Step by step","Attribut-Stand":"Ability state","Tabs, Buttons, \xDCberschriften, Tabellenk\xF6pfe.":"Tabs, buttons, headings, table headers.","Erkl\xE4rungen, Tipps, Fundorte, Checkliste.":"Explanations, tips, locations, checklist.","Die andere Sprache klein unter dem Namen, z. B. in Popups und Listen.":"The other language in small print under the name, e.g. in pop-ups and lists.","Skaliert die ganze Seite \u2013 praktisch auf gro\xDFen Monitoren.":"Scales the whole page \u2013 handy on large monitors.","\xDCberg\xE4nge und Einblendungen.":"Transitions and fade-ins.","Weniger Abstand in Checkliste und Tabellen.":"Less spacing in the checklist and tables.","Seitenleiste mit Charakter":"Sidebar with character","Breite Bildschirme: Charakter links dauerhaft sichtbar.":"Wide screens: character permanently visible on the left.","Abgehakte Punkte in der Checkliste verstecken.":"Hide ticked items in the checklist.","Aus: nur eigene Uploads und Icons \u2013 l\xE4dt schneller, spart Daten.":"Off: only your own uploads and icons \u2013 loads faster, saves data.","Bild-Links":"Image links","Gefundene Links in der Browser-Konsole (F12) ausgeben oder den Cache leeren.":"Print found links to the browser console (F12) or clear the cache.","Beim \xD6ffnen zeigen":"Show on opening",Gale:"Gale","Lae'zel":"Lae'zel",Astarion:"Astarion","Angriffswurf-Bonus":"Attack roll bonus","Auto-Krit":"Auto-crit","Begleiter-Item":"Companion item","Charakter-Level":"Character level","Ehrenmodus-Burst":"Honour Mode burst","Hast-Aktion":"Haste action","Item-Icon":"Item icon","Kampf-Referenz":"Combat reference","Kern-Zauber":"Core spells","Start-Tab":"Start tab","Trank-Icon":"Potion icon","Untoten-Brecher":"Undead breaker","Upgrade-Pfad":"Upgrade path","Zauber-Hybrid":"Spell hybrid","Zauber-Icon":"Spell icon","Zauber-SG":"Spell DC",TP:"HP",RK:"AC",SG:"DC","Gruft-Schreiber (Entombed Scribe) sind Level 2 \u2013 auf Stufe 3 g\xFCltige Ziele, k\xE4mpfen aber nur mit Zaubern (K\xE4ltestrahl, Nebelwolke, Stille). Ab Stufe 4 der Gruft-Krieger (Level 3) mit Krumms\xE4bel. Der Untote k\xE4mpft bis zur langen Rast f\xFCr dich.":"Entombed Scribes are level 2 \u2013 valid targets at level 3, but they only fight with spells (Ray of Frost, Fog Cloud, Silence). From level 4 the Entombed Warrior (level 3) with a scimitar. The undead fights for you until a long rest.","ST\xC4 21 bis zur langen Rast \u2013 bis zu den Panzerhandschuhen dein Standard-Elixier vor Bossk\xE4mpfen. Nur ein Elixier gleichzeitig aktiv. Fr\xFCh kaufen: Tantchen Ethel verkauft im Hain 3 St\xFCck, aufgef\xFCllt nach jeder langen Rast oder jedem Stufenaufstieg \u2013 ihr Laden schlie\xDFt f\xFCr immer, sobald sie ihre Vettel-Gestalt zeigt, in den Tunnel flieht oder im Teehaus stirbt.":"STR 21 until long rest \u2013 your standard elixir before boss fights until you get the Gauntlets. Only one elixir active at a time. Buy early: Auntie Ethel sells 3 in the Grove, restocked after every long rest or level-up \u2013 her shop closes for good as soon as she reveals her hag form, flees into the tunnel or dies at the teahouse.","Garantiert bei Grat im Goblinlager (X \u221299 / Y 424), sonst zuf\xE4llig bei H\xE4ndlern mit magischen Nahkampfwaffen. 85 gp Basispreis. Ersatz f\xFCr die verpasste Immergl\xFCh-Klinge (Everburn Blade). Alternative: Blutige Gro\xDFaxt (Blooded Greataxe).":"Guaranteed at Grat in the Goblin Camp (X \u221299 / Y 424), otherwise randomly at traders with magic melee weapons. 85 gp base price. Replacement for the missed Everburn Blade. Alternative: Blooded Greataxe.","40 gp (Ehrenmodus 85 gp). Volo verkauft es am Heiligen Teich \u2013 dort \xFCber den Handel-Button unten links, nicht \xFCber den Dialog \u2013 und sp\xE4ter auch im Lager (Akt 1\u20133). Grat im Goblinlager nur, solange du es nicht von Volo hast. An Schattenherz geben.":"40 gp (Honour Mode 85 gp). Volo sells it at the Sacred Pool \u2013 use the trade button at the bottom left there, not the dialogue \u2013 and later at camp too (Acts 1\u20133). Grat in the Goblin Camp only if you didn't get it from Volo. Give it to Shadowheart.","Dammon in der Mulde des Smaragdhains (X 177 / Y 562). +1-Kurzbogen mit Vorteil gegen Monstrosit\xE4ten und Mal des J\xE4gers 1\xD7 pro langer Rast. \xDCbergangsbogen f\xFCr Astarion, bis der Bogen der Todesfee da ist.":"Dammon in the Hollow of the Emerald Grove (X 177 / Y 562). +1 shortbow with advantage against monstrosities and Hunter's Mark once per long rest. Stopgap bow for Astarion until you have the Bow of the Banshee.","Eulenb\xE4renh\xF6hle (X \u2212321 / Y \u2212135): Die Sel\xFBne-Truhe ist versiegelt. Gebetsblatt hinter der Sel\xFBne-Statue finden (Wahrnehmung) und vor der Truhe vorlesen. Effekt: bei 50 % TP oder weniger keine Gelegenheitsangriffe.":"Owlbear Nest (X \u2212321 / Y \u2212135): the Sel\xFBne chest is sealed. Find the prayer page behind the Sel\xFBne statue (Perception) and read it in front of the chest. Effect: at 50% HP or less no opportunity attacks.","Nur im Versteck im \xFCberwucherten Tunnel \u2013 im Uferteehaus verhandelt sie nie, auch nicht unter 20 % TP. Unter 20 % TP bringen und ihren Zug abwarten. Nicht verstummen lassen, nicht bewusstlos schlagen. SG 20 T\xE4uschen oder Einsch\xFCchtern (K\xE4mpfer und Barbaren: SG 15 Einsch\xFCchtern mit Vorteil). Erfolg = Haar + Mayrina frei, Ethel geht. Misslingt eine Probe, ist die andere gesperrt \u2013 den Deal kannst du dann noch annehmen. Achtung Rache-Weg: Jeder Deal mit ihr bricht den Paladin-Eid. Details in der Anleitung.":"Only in her hideout in the overgrown tunnel \u2013 at the Riverside Teahouse she never bargains, not even below 20% HP. Bring her below 20% HP and wait for her turn. Don't silence her or knock her out. DC 20 Deception or Intimidation (Fighters and Barbarians: DC 15 Intimidation with advantage). Success = hair + Mayrina free, Ethel leaves. If one check fails, the other is locked \u2013 you can still accept the deal then. Warning for the Vengeance route: any deal with her breaks the paladin oath. Details in the guide.","Grat verkauft das Gro\xDFschwert +1 immer. Das fl\xFCsternde Versprechen nur, wenn du es nicht schon von Volo hast \u2013 und nur, solange Volo noch im Goblinlager ist.":"Grat always sells the Greatsword +1. The Whispering Promise only if you don't already have it from Volo \u2013 and only while Volo is still in the Goblin Camp.","Dror Ragzlins Schatzkisten hinter dem Eisentor (X 298 / Y 66): SG 18 Fingerfertigkeit oder Drors Schl\xFCssel. Vorteil auf Nahkampf-Waffenangriffe, wenn 2+ Gegner im Umkreis von 3 m um dein Ziel stehen, +1 auf ST\xC4-Rettungsw\xFCrfe. Im Schatz liegt auch ein St\xFCck Infernales Eisen f\xFCr Dammon.":"Dror Ragzlin's treasure crates behind the iron gate (X 298 / Y 66): DC 18 Sleight of Hand or Dror's key. Advantage on melee weapon attacks when 2+ enemies stand within 3 m of your target, +1 to STR saving throws. The treasure also holds a piece of Infernal Iron for Dammon.","Guter Pfad: Minthara besiegen und pl\xFCndern (X 335 / Y 43). W\xE4hrend Konzentration nicht umsto\xDFbar und nicht verschiebbar, Konzentrationszauber geben Schwung, dazu +1 Athletik \u2013 ideal mit Krone des Wahnsinns und Hast.":"Good path: defeat and loot Minthara (X 335 / Y 43). While concentrating you can't be knocked prone or moved, concentration spells grant Momentum, plus +1 Athletics \u2013 ideal with Crown of Madness and Haste.","Verschlossene vergoldete Truhe s\xFCdwestlich des Wegpunkts (X 163 / Y \u2212248). Zugang z. B. \xFCber den Geheimgang im Zerschmetterten Heiligtum. Die tempor\xE4ren TP halten nur 2 Runden.":"Locked gilded chest south-west of the waypoint (X 163 / Y \u2212248). Access e.g. via the secret passage in the Shattered Sanctum. The temporary HP only last 2 turns.","40 gp (Ehrenmodus 590 gp), Derryth in der Ebonsee-Grotte (X \u221255 / Y \u221293). +2 S\xE4ureschaden pro Waffentreffer \u2013 doppelt wertvoll ab Zus\xE4tzlicher Angriff.":"40 gp (Honour Mode 590 gp), Derryth in Ebonlake Grotto (X \u221255 / Y \u221293). +2 acid damage per weapon hit \u2013 twice as valuable once you have Extra Attack.","+1, 2W6+1 Hieb, Spezialaktion Kolossaler Ansturm (Colossal Onslaught): trifft alle in einer Linie, +\xDCbungsbonus Schaden, profitiert von GWM. Kaufen oder pl\xFCndern. Greymon NICHT \xFCber die Athletik-Option im Dialog vom Flo\xDF sto\xDFen \u2013 dann ist die Beute dauerhaft weg. St\xF6\xDFt du ihn im Kampf ins Wasser, wird seine Leiche am S\xFCdpier des Verfallenen Dorfs angesp\xFClt.":"+1, 2d6+1 slashing, special action Colossal Onslaught: hits everyone in a line, +proficiency bonus damage, benefits from GWM. Buy or loot it. Do NOT shove Greymon off the raft via the Athletics option in dialogue \u2013 the loot is then lost for good. If you shove him into the water during combat, his body washes up at the southern pier of the Decrepit Village.","Seltener +1-Kurzbogen (190 gp): Treffer k\xF6nnen Ver\xE4ngstigt ausl\xF6sen (SG 12 Weisheit, 2 Runden); +1W4 auf Angriff und Schaden gegen ver\xE4ngstigte Ziele. Auf dem Flo\xDF pl\xFCndern oder sp\xE4ter bei Greymon in der Grymschmiede (X \u2212120 / Y \u221295) kaufen. Nicht per Athletik-Dialog vom Flo\xDF sto\xDFen.":"Rare +1 shortbow (190 gp): hits can inflict Frightened (DC 12 Wisdom, 2 turns); +1d4 to attack and damage against frightened targets. Loot it on the raft or buy it later from Greymon in the Grymforge (X \u2212120 / Y \u221295). Don't shove him off the raft via dialogue.","Schienen-Gussform (Splint Mould) auf einem Felsvorsprung bei X \u2212593 / Y 311 nahe Wegpunkt Alte Schmiede, dazu eines der zwei Mithrilerze. Beim ersten \xD6ffnen des Lavaventils erscheint Grym. RK 18, immun gegen Krits, \u22122 auf jeden erlittenen Schaden; Nahkampf-Angreifer taumeln.":"Splint Mould on a rock ledge at X \u2212593 / Y 311 near the Ancient Forge waypoint, plus one of the two Mithral Ores. The first time you open the lava valve, Grym appears. AC 18, immune to crits, \u22122 on all damage taken; melee attackers become Reeling.","Ungew\xF6hnliches +1-Gro\xDFschwert, tr\xE4gt Anders am Mauthaus der Aufgestiegenen Stra\xDFe (X 110 / Y 560). Tyrs Schutz als Bonusaktion, 1\xD7 pro kurzer Rast. Anders gibt es dir f\xFCr Karlachs Tod \u2013 oder du nimmst es ihm ab, wenn du dich auf Karlachs Seite stellst (empfohlen, so bekommst du Karlach als Gef\xE4hrtin).":"Uncommon +1 greatsword, carried by Anders at the Risen Road Toll House (X 110 / Y 560). Tyr's Protection as a bonus action, once per short rest. Anders gives it to you for Karlach's death \u2013 or you take it from him if you side with Karlach (recommended, so you get Karlach as a companion).","Prunkvolle Truhe in der Kammer des Inquisitors in der Krippe Y'llek (ca. X 1360 / Y \u2212657). +1W4 psychisch auf Waffenangriffe, solange du dich auf einen Zauber konzentrierst \u2013 mit Magischer Waffe ab Stufe 5 praktisch dauerhaft.":"Elegant chest in the Inquisitor's Chamber of the Cr\xE8che Y'llek (about X 1360 / Y \u2212657). +1d4 psychic on weapon attacks while you concentrate on a spell \u2013 with Magic Weapon from level 5 practically permanent.","90 gp, nord\xF6stlich des Wegpunkts Trielta-Klippen (X \u221243 / Y \u2212129). Sp\xE4tes Akt 1. Nach jedem Waffentreffer \u22121W4 auf den Rettungswurf des Ziels gegen deinen n\xE4chsten Zauber \u2013 laut bg3.wiki gilt der Malus per Bug sogar f\xFCr alle Rettungsw\xFCrfe in der Dauer.":"90 gp, north-east of the Trielta Crags waypoint (X \u221243 / Y \u2212129). Late Act 1. After every weapon hit \u22121d4 to the target's saving throw against your next spell \u2013 according to bg3.wiki a bug even applies it to all saving throws for the duration.","200 gp (Ehrenmodus 310 gp). +1 RK, +1 auf alle Rettungsw\xFCrfe. F\xE4llt das Gasthaus, stirbt Talli \u2013 sofort kaufen.":"200 gp (Honour Mode 310 gp). +1 AC, +1 to all saving throws. If the inn falls, Talli dies \u2013 buy it right away.","Araj Oblodra im Erdgeschoss ansprechen und Astarion \xFCberreden, sie zu bei\xDFen. Erledigen, bevor du die T\xFCrme st\xFCrmst. +2 ST\xC4 dauerhaft, auch \xFCber 20 \u2013 wirkt aber nicht, solange Elixier oder Panzerhandschuhe ST\xC4 fest setzen.":"Talk to Araj Oblodra on the ground floor and persuade Astarion to bite her. Do it before you storm the towers. +2 STR permanently, even above 20 \u2013 but it does nothing while an elixir or the Gauntlets set STR to a fixed value.","Tresort\xFCr n\xF6rdlich von Balthazars Vorraum (X \u2212822 / Y \u2212759): SG 30 Fingerfertigkeit, kein Schl\xFCssel \u2013 alternativ der Zauber Klopfen (Knock). Die Truhe ganz rechts enth\xE4lt den Ring. +2 glei\xDFend gegen hell beleuchtete Ziele \u2013 bei jeder Schadensinstanz.":"Vault door north of Balthazar's antechamber (X \u2212822 / Y \u2212759): DC 30 Sleight of Hand, no key \u2013 alternatively the spell Knock. The chest on the far right holds the ring. +2 radiant against brightly lit targets \u2013 on every damage instance.","Raphael besiegen. RK 21, Fliegen ohne Konzentration, Feuerresistenz, \u22123 Schaden aus allen Quellen, \xDCbung automatisch. Die passenden H\xF6llend\xE4mmerungs-Stiefel liegen in einer verschlossenen vergoldeten Truhe ganz oben in der Wyrmfelsen-Festung \u2013 vor Gortashs Kr\xF6nung nehmen, sonst werden er und die Stahlw\xE4chter dort feindlich.":"Defeat Raphael. AC 21, flight without concentration, fire resistance, \u22123 damage from all sources, automatic proficiency. The matching Helldusk Boots are in a locked gilded chest at the top of Wyrm's Rock Fortress \u2013 take them before Gortash's coronation, or he and the Steel Watchers there turn hostile.","Nur der Spiegel im Haus der Trauer (Kreuzgang der d\xFCsteren Umarmung) funktioniert, der in der Shar-Pr\xFCfung ist zerbrochen. Erst identifizieren: SG 20 Religion oder SG 25 Arkane Kunde (eine Figur reicht). Dann betet jede Figur einmal: SG 25 Religion \u2013 misslingt das, gibt es f\xFCr sie nie +2. Danach Erinnerungen opfern (je \u22122 auf ein Attribut bis zur langen Rast): mit Gebet etwa 60 % Chance pro Versuch auf +2 (bis max. 24). Mehr in der Anleitung.":"Only the mirror in the House of Grief (Cloister of Sombre Embrace) works, the one in the Gauntlet of Shar is broken. First identify it: DC 20 Religion or DC 25 Arcana (one character is enough). Then each character prays once: DC 25 Religion \u2013 if that fails, they can never get +2. Then sacrifice memories (each \u22122 to an ability until long rest): with the prayer about a 60% chance per attempt for +2 (up to 24). More in the guide.","Legend\xE4r, +3. Beide Drachenkopf-Fackeln mit Blitzschaden treffen, vier Pr\xFCfungen bestehen. Das Schwert liegt auf Ansurs Leichnam \u2013 Ansprechen oder Pl\xFCndern startet den Kampf gegen Ansur und zwei Wasser-Myrmidonen. Passiv: Der ST\xC4-Schaden wird verdoppelt, Vorteil gegen gro\xDFe und gr\xF6\xDFere Ziele \u2013 deine Endwaffe.":"Legendary, +3. Hit both dragon-head torches with lightning damage, pass four trials. The sword lies on Ansur's body \u2013 talking to him or looting starts the fight against Ansur and two Water Myrmidons. Passive: the STR damage is doubled, advantage against Large and bigger targets \u2013 your endgame weapon.","Auf dem Altar im Norden der H\xF6hle neben Ansur (X 636 / Y \u2212964). Seit Patch 8 kannst du ihn nehmen, ohne Ansur zu wecken. Heilt im Kampf 2 TP pro Zug, +1 RK und Rettungsw\xFCrfe, keine Krits gegen dich, immun gegen Bet\xE4ubung.":"On the altar in the north of the cave next to Ansur (X 636 / Y \u2212964). Since Patch 8 you can take it without waking Ansur. Heals 2 HP per turn in combat, +1 AC and saving throws, no crits against you, immune to Stunned.","Garantiert bei Grat (Goblinlager), zuf\xE4llig bei anderen H\xE4ndlern mit magischen Nahkampfwaffen":"Guaranteed at Grat (Goblin Camp), randomly at other traders with magic melee weapons","+1, Kolossaler Ansturm trifft alle in einer Linie (+\xDCbungsbonus Schaden, profitiert von GWM). H\xE4lt bis Akt 3.":"+1, Colossal Onslaught hits everyone in a line (+proficiency bonus damage, benefits from GWM). Lasts until Act 3.","Anders, Mauthaus der Aufgestiegenen Stra\xDFe \u2013 besiegen (Karlachs Seite) oder als Belohnung":"Anders, Risen Road Toll House \u2013 defeat him (Karlach's side) or as a reward","RK 18, Krit-Immunit\xE4t, \u22122 auf jeden erlittenen Schaden \u2013 perfekt f\xFCr einen Nahk\xE4mpfer mitten im Gedr\xE4nge.":"AC 18, crit immunity, \u22122 on all damage taken \u2013 perfect for a melee fighter in the thick of it.","RK 21, Fliegen ohne Konzentration, automatische \xDCbung, \u22123 Schaden aus allen Quellen. Die Feuerresistenz hast du als Roter Drachenbl\xFCtiger schon \u2013 f\xFCr die Glaskanone z\xE4hlen RK und Schadensreduktion.":"AC 21, flight without concentration, automatic proficiency, \u22123 damage from all sources. You already have fire resistance as a Red Dragonborn \u2013 for the glass cannon, AC and damage reduction count.","Temp-TP in H\xF6he des CHA-Mods (2 Runden), wenn ein Smite-Zauber einen Zustand ausl\xF6st; +1 auf KON-Rettungsw\xFCrfe (Konzentration f\xFCr Krone des Wahnsinns/Hast).":"Temp HP equal to your CHA modifier (2 turns) when a smite spell applies a condition; +1 to CON saving throws (concentration for Crown of Madness/Haste).","Vorteil, wenn 2+ Gegner im Umkreis von 3 m um dein Ziel stehen \u2013 gleicht den GWM-Malus aus und verdoppelt fast deine Krit-Chance.":"Advantage when 2+ enemies stand within 3 m of your target \u2013 offsets the GWM penalty and nearly doubles your crit chance.","Volo (Heiliger Teich, sp\xE4ter im Lager) oder Grat (Goblinlager)":"Volo (Sacred Pool, later at camp) or Grat (Goblin Camp)","Heilt Schattenherz dich, bekommst du 2 Runden +1W4 auf Angriffe und Rettungsw\xFCrfe \u2013 wie Segnen, stapelt aber nicht damit.":"When Shadowheart heals you, you get +1d4 to attacks and saving throws for 2 turns \u2013 like Bless, but it doesn't stack with it.","+1, Vorteil gegen Monstrosit\xE4ten, Mal des J\xE4gers 1\xD7 pro langer Rast. \xDCbergangsbogen bis zum Bogen der Todesfee.":"+1, advantage against monstrosities, Hunter's Mark once per long rest. Stopgap bow until the Bow of the Banshee.","+1, Treffer k\xF6nnen Ver\xE4ngstigt ausl\xF6sen (SG 12 Weisheit, 2 Runden); +1W4 auf Angriff und Schaden gegen ver\xE4ngstigte Ziele \u2013 perfekt nach deinem Gr\xE4sslichen Aussehen.":"+1, hits can inflict Frightened (DC 12 Wisdom, 2 turns); +1d4 to attack and damage against frightened targets \u2013 perfect after your Dreadful Aspect.","Lady Esther, Pfad zum Rosymorn-Kloster (90 gp, sp\xE4tes Akt 1)":"Lady Esther, Rosymorn Monastery Trail (90 gp, late Act 1)","+10 Schaden pro Treffer bei \u22125 Treffer, plus Bonusangriff nach Krit oder Kill mit einem Nahkampf-Waffenangriff. \u201EAll In\u201C nur mit Vorteil oder Segnen.":'+10 damage per hit at \u22125 to hit, plus a bonus attack after a crit or kill with a melee weapon attack. "All In" only with advantage or Bless.',"Man\xF6ver Riposte und Entwaffnender Angriff erg\xE4nzen den Zu-Fall-bringen-Angriff \u2013 Kampfmeisterin ab Stufe 3":"The manoeuvres Riposte and Disarming Attack complement Trip Attack \u2013 Battle Master from level 3","ST\xC4 21 bis zur langen Rast. Nur ein Elixier gleichzeitig. Tantchen Ethel verkauft 3 St\xFCck pro langer Rast, solange sie freundlich ist.":"STR 21 until long rest. Only one elixir at a time. Auntie Ethel sells 3 per long rest while she's friendly.","Bei einem Kill (1\xD7 pro Zug) eine zus\xE4tzliche Aktion und 5 tempor\xE4re TP. Bewusstlos schlagen z\xE4hlt nicht.":"On a kill (once per turn) an extra action and 5 temporary HP. Knocking out doesn't count.","Dein Standard-Elixier ab den Handschuhen \u2013 auf Ausgewogen bekommt die Aktion den vollen Extra-Angriff, im Ehrenmodus nur einen Angriff.":"Your standard elixir once you have the Gauntlets \u2013 on Balanced the action gets the full Extra Attack, in Honour Mode only one attack.","Du schl\xE4fst 2 Runden, danach Wirkung einer kurzen Rast und alle Zauberpl\xE4tze 1. und 2. Grades zur\xFCck. Wirst du geweckt, verf\xE4llt beides.":"You sleep for 2 turns, then get the effect of a short rest and all level 1 and 2 spell slots back. If you're woken, both are lost.","Smite-Nachschub zwischen zwei K\xE4mpfen \u2013 nicht mitten im Kampf.":"Smite refill between two fights \u2013 not in the middle of combat.","+2 auf Angriffsw\xFCrfe mit der beschichteten Waffe f\xFCr 10 Runden.":"+2 to attack rolls with the coated weapon for 10 turns.","10 tempor\xE4re TP und +1W4 auf Angriffs- und Rettungsw\xFCrfe bis zur langen Rast \u2013 stapelt sogar mit Segnen.":"10 temporary HP and +1d4 to attack rolls and saving throws until long rest \u2013 it even stacks with Bless.","Alternative \u2013 ein neues Elixier beendet den W4-Bonus, die TP bleiben.":"Alternative \u2013 a new elixir ends the d4 bonus, the HP stay.","Level 2 \u2013 auf Stufe 3 die ersten Ziele. Zauberwirker ohne Waffe (K\xE4ltestrahl, Nebelwolke, Stille) \u2013 also kein Aura-Bonus, aber n\xFCtzliche Kontrolle.":"Level 2 \u2013 the first targets at level 3. Spellcasters without a weapon (Ray of Frost, Fog Cloud, Silence) \u2013 so no aura bonus, but useful control.","Pfad zum Rosymorn-Kloster, Mondaufgangst\xFCrme":"Rosymorn Monastery Trail, Moonrise Towers","Laut bg3.wiki stehen NPCs, die im Schattenfluch sterben, nach ein, zwei Runden als schattenverfluchte Untote wieder auf und sind dann kontrollierbar. Ob das mit dem seltsamen Ochsen (Level 6 in Akt 2) klappt, ist nicht best\xE4tigt \u2013 eher ein Exploit.":"According to bg3.wiki, NPCs who die in the Shadow Curse rise again as Shadow-Cursed undead after a turn or two and can then be controlled. Whether this works with the Strange Ox (level 6 in Act 2) is not confirmed \u2013 more of an exploit.","Tiefling-Schmied in der Mulde des Smaragdhains. Akt 1: Jagdkurzbogen. Akt 2 im Letzten Licht: schmiedet aus Infernalem Eisen die fehlerhaften H\xF6llend\xE4mmerungs-Teile \u2013 je ein Eisen pro Teil.":"Tiefling smith in the Hollow of the Emerald Grove. Act 1: Hunting Shortbow. Act 2 at Last Light: forges the flawed Helldusk pieces from Infernal Iron \u2013 one iron per piece.","Barde mit kurzem Auftritt am Heiligen Teich. Verkauft Das fl\xFCsternde Versprechen f\xFCr 40 gp (Handel-Button unten links) \u2013 sp\xE4ter auch im Lager.":"Bard with a short performance at the Sacred Pool. Sells The Whispering Promise for 40 gp (trade button at the bottom left) \u2013 later at camp too.","Goblin-H\xE4ndler im Lager (X \u221299 / Y 424). Verkauft immer das Gro\xDFschwert +1; Das fl\xFCsternde Versprechen nur, wenn du es nicht von Volo hast und solange Volo im Lager ist.":"Goblin trader in the camp (X \u221299 / Y 424). Always sells the Greatsword +1; The Whispering Promise only if you don't have it from Volo and while Volo is in the camp.","Duergar auf dem Flo\xDF zur Grymschmiede. Tr\xE4gt Jorgorals Gro\xDFschwert und den Bogen der Todesfee, verkauft beides sp\xE4ter in der Grymschmiede. Nicht per Athletik-Dialog vom Flo\xDF sto\xDFen \u2013 sonst ist die Beute dauerhaft weg.":"Duergar on the raft to the Grymforge. Carries Jorgoral's Greatsword and the Bow of the Banshee, sells both later in the Grymforge. Don't shove him off the raft via the Athletics dialogue \u2013 or the loot is lost for good.","Verkauft den Umhang des Schutzes (200 gp) und Elixiere des Blutdursts. F\xE4llt das Letzte Licht, stirbt sie \u2013 sofort kaufen.":"Sells the Cloak of Protection (200 gp) and Elixirs of Bloodlust. If Last Light falls, she dies \u2013 buy right away.","Gr\xFCnes Weib in Verkleidung. Solange sie freundlich ist, verkauft sie 3\xD7 Elixier der H\xFCgelriesenst\xE4rke pro langer Rast. Unter 20 % TP feilscht sie im Versteck um ihr Leben \u2013 deine Chance auf das Haar.":"Green hag in disguise. While she's friendly she sells 3\xD7 Elixir of Hill Giant Strength per long rest. Below 20% HP she bargains for her life in her hideout \u2013 your chance at the hair.","Vorher Elixiere kaufen: Solange Ethel im Hain freundlich ist, verkauft sie 3\xD7 Elixier der H\xFCgelriesenst\xE4rke, aufgef\xFCllt nach jeder langen Rast oder jedem Stufenaufstieg. Sobald sie ihre Vettel-Gestalt zeigt, flieht oder im Teehaus stirbt, ist ihr Laden f\xFCr immer zu.":"Buy elixirs first: while Ethel is friendly in the Grove she sells 3\xD7 Elixir of Hill Giant Strength, restocked after every long rest or level-up. As soon as she reveals her hag form, flees or dies at the teahouse, her shop is closed for good.","Den Kampf im Versteck austragen (Uferteehaus \u2192 \xFCberwucherter Tunnel). Im Teehaus verhandelt sie nie \u2013 auch nicht unter 20 % TP.":"Fight in her hideout (Riverside Teahouse \u2192 overgrown tunnel). At the teahouse she never bargains \u2013 not even below 20% HP.","Ethel unter 20 % ihrer maximalen TP bringen und ihren Zug abwarten. Nicht verstummen lassen (Stille), nicht bewusstlos schlagen \u2013 dann kann sie nicht verhandeln. Keine Schadensfl\xE4chen (Feuer, S\xE4ure) um sie herum, die sie vor ihrem Zug t\xF6ten k\xF6nnten.":"Bring Ethel below 20% of her maximum HP and wait for her turn. Don't silence her (Silence) or knock her out \u2013 then she can't bargain. No damaging surfaces (fire, acid) around her that could kill her before her turn.","Droughnir m\xF6glichst nah an sie stellen \u2013 viele Spieler berichten, dass sie die n\xE4chststehende Figur anspricht (laut bg3.wiki nicht best\xE4tigt).":"Place Droughnir as close to her as possible \u2013 many players report she addresses the nearest character (not confirmed by bg3.wiki).","In ihrem Zug bettelt sie: SG 20 T\xE4uschen oder Einsch\xFCchtern (K\xE4mpfer und Barbaren: SG 15 Einsch\xFCchtern mit Vorteil). Erfolg = Haar plus befreite Mayrina, Ethel kommt frei.":"On her turn she begs: DC 20 Deception or Intimidation (Fighters and Barbarians: DC 15 Intimidation with advantage). Success = hair plus freed Mayrina, Ethel goes free.","G\xF6ttliche F\xFChrung (Guidance) vorher im Kampf wirken, nicht erst im W\xFCrfel-Dialog: Im Ehrenmodus vor Patch 7 brach ein Zauber dort die Verhandlung ab und das Haar war weg. Bardische Inspiration funktioniert immer.":"Cast Guidance beforehand in combat, not in the dice dialogue: in Honour Mode before Patch 7 a spell there broke off the bargain and the hair was lost. Bardic Inspiration always works.","Misslingt eine Probe, ist die andere gesperrt. Dann bleiben: Deal annehmen (Haar, Ethel beh\xE4lt Mayrina), Mayrina befreien oder Ethel t\xF6ten.":"If one check fails, the other is locked. Then you're left with: accept the deal (hair, Ethel keeps Mayrina), free Mayrina or kill Ethel.","Haar essen und ein Attribut w\xE4hlen: +1 dauerhaft, ohne Obergrenze. Wirkt nicht auf Werte, die Items oder Elixiere fest setzen.":"Eat the hair and choose an ability: +1 permanently, uncapped. Doesn't affect scores that items or elixirs set to a fixed value.","Eid: Jeder Deal mit Ethel bricht den Paladin-Eid. Als Eidbrecher egal \u2013 planst du die R\xFCckkehr zur Rache, das Haar vorher holen oder die Kosten einplanen.":"Oath: any deal with Ethel breaks the paladin oath. Irrelevant as an Oathbreaker \u2013 if you plan to return to Vengeance, get the hair first or budget the cost.","Schienen-Gussform holen: auf einem Felsvorsprung \xFCber den Lavabecken nahe dem Wegpunkt Alte Schmiede (X \u2212593 / Y 311).":"Get the Splint Mould: on a rock ledge above the lava pools near the Ancient Forge waypoint (X \u2212593 / Y 311).","Auf die Plattform der Schmiede (X \u2212558 / Y 230). Erz und Gussform in ihre Kammern legen \u2013 die Gussform-Kammer liegt neben dem Tiegel.":"Onto the forge platform (X \u2212558 / Y 230). Put the ore and mould into their chambers \u2013 the mould chamber is next to the crucible.","Hebel in der Mitte des Podests ziehen \u2013 der Hammer senkt sich. Die Plattform muss unten sein; der Knopf hinter dem Hebel hebt sie an, dann funktioniert die Schmiede nicht.":"Pull the lever in the middle of the dais \u2013 the hammer lowers. The platform must be down; the button behind the lever raises it, and then the forge doesn't work.","Hammer erneut fallen lassen, dann mit dem Hebel neben der Kammer die Gussform auswerfen und die R\xFCstung aufheben. Tipp: Droughnir ist Gildenhandwerker \u2013 hebt er das erste St\xFCck selbst auf, bekommt er die Inspiration Art Endures.":"Drop the hammer again, then eject the mould with the lever next to the chamber and pick up the armour. Tip: Droughnir is a Guild Artisan \u2013 if he picks up the first piece himself, he gets the inspiration Art Endures.","In der Eulenb\xE4renh\xF6hle (X \u2212321 / Y \u2212135) hinten zur versiegelten Sel\xFBne-Truhe.":"Go to the sealed Sel\xFBne chest in the back of the Owlbear Nest (X \u2212321 / Y \u2212135).","Hinter der Sel\xFBne-Statue liegt das Gebetsblatt auf dem Boden (Wahrnehmung).":"The prayer page lies on the ground behind the Sel\xFBne statue (Perception).","Das Gebet vor der Truhe vorlesen \u2013 sie \xF6ffnet sich. Effekt des Anh\xE4ngers: bei 50 % TP oder weniger keine Gelegenheitsangriffe. Legst du ihn erst an, wenn du schon darunter bist, greift er erst nach dem n\xE4chsten Schaden oder der n\xE4chsten Heilung.":"Read the prayer aloud in front of the chest \u2013 it opens. Pendant effect: at 50% HP or less no opportunity attacks. If you put it on while already below that, it only kicks in after the next damage or healing.","Im Westfl\xFCgel des Wyrmfelsen-Gef\xE4ngnisses beide Drachenkopf-Fackeln mit Blitzschaden treffen (Schockgriff, Hexenpfeil, Blitzpfeile). Die Flammen werden blau, die Wand dazwischen wird passierbar. Vorsicht: Angriffe k\xF6nnen Wachen alarmieren.":"In the west wing of the Wyrm's Rock prison, hit both dragon-head torches with lightning damage (Shocking Grasp, Witch Bolt, Lightning Arrows). The flames turn blue and the wall between them becomes passable. Careful: attacks can alert guards.","Pr\xFCfung der Gerechtigkeit: Zuerst den Richter-Schatten vor den Gem\xE4lden magisch entfernen (Fluch brechen auf jedes Gem\xE4lde, Verbannung oder Untote vertreiben). Dann \u201EDie Zelle\u201C auf das Pult legen \u2013 Freiheit oder Henken rufen Untote.":'Trial of Justice: first remove the Judge shadow in front of the paintings with magic (Remove Curse on each painting, Banishment or Turn Undead). Then place "The Cell" on the bookstand \u2013 Freedom or The Hanging summon undead.',"Pr\xFCfung der Einsicht: Die B\xFCcher lassen sich mit SG 15 Fingerfertigkeit fangen (ein Versuch pro Figur) oder mit Befehl stoppen. Die L\xF6sung: den Geist Suelto am Ende der Kammer angreifen (1 TP) \u2013 seine B\xFCcher zeigen eine grausame Ideologie.":"Trial of Insight: the books can be caught with DC 15 Sleight of Hand (one attempt per character) or stopped with Command. The solution: attack the ghost Suelto at the end of the chamber (1 HP) \u2013 his books reveal a cruel ideology.","Pr\xFCfung der Strategie: Lanzenbrett-R\xE4tsel \u2013 Schwarz in zwei Z\xFCgen mattsetzen, drei Versuche. Alternative: den schwarzen K\xF6nig mit Blitzschaden zerst\xF6ren (50 TP auf Ausgewogen). Gale kennt die L\xF6sung.":"Trial of Strategy: lanceboard puzzle \u2013 checkmate black in two moves, three attempts. Alternative: destroy the black king with lightning damage (50 HP on Balanced). Gale knows the solution.","Pr\xFCfung des Mutes: Wer die Statue ber\xFChrt, tr\xE4gt die Fackel. 4 Runden \xFCberleben, nicht zu Boden gehen und den Raum nicht verlassen. Heiligtum oder ein Trank der universellen Resistenz auf dem Tr\xE4ger machen es leicht.":"Trial of Courage: whoever touches the statue carries the torch. Survive 4 turns, don't go down and don't leave the room. Sanctuary or a Potion of Universal Resistance on the carrier makes it easy.","Danach \xF6ffnet sich das Heiligtum. Baldurans Riesent\xF6ter liegt auf Ansurs Leichnam \u2013 Ansprechen oder Pl\xFCndern startet den Kampf gegen Ansur und zwei Wasser-Myrmidonen. Den Helm des Balduran auf dem Altar im Norden kannst du seit Patch 8 nehmen, ohne Ansur zu wecken.":"Then the sanctum opens. Balduran's Giantslayer lies on Ansur's body \u2013 talking to him or looting starts the fight against Ansur and two Water Myrmidons. Since Patch 8 you can take the Helm of Balduran from the altar in the north without waking Ansur.","Der Spiegel in der Shar-Pr\xFCfung (Akt 2) ist zerbrochen \u2013 nutzbar ist nur der im Haus der Trauer (Kreuzgang der d\xFCsteren Umarmung, Akt 3).":"The mirror in the Gauntlet of Shar (Act 2) is broken \u2013 only the one in the House of Grief (Cloister of Sombre Embrace, Act 3) is usable.","Spiegel identifizieren: SG 20 Religion oder SG 25 Arkane Kunde \u2013 eine Figur reicht. Alternativ die hastige Notiz in der Nachtorchideen-H\xF6hle lesen.":"Identify the mirror: DC 20 Religion or DC 25 Arcana \u2013 one character is enough. Alternatively read the hastily written note in the Night Orchid cave.","Jede Figur betet einmal: SG 25 Religion. Misslingt das Gebet, ist +2 f\xFCr diese Figur nie mehr m\xF6glich \u2013 vorher alle Boni auf Religion sammeln.":"Each character prays once: DC 25 Religion. If the prayer fails, +2 is never possible for that character \u2013 gather every Religion bonus beforehand.","Erinnerungen opfern (bis zu 6, je eine pro Attribut): Jede kostet \u22122 auf das Attribut bis zur langen Rast oder bis Fluch brechen bzw. M\xE4chtige Genesung. Nach erfolgreichem Gebet etwa 60 % Chance pro Versuch auf +2 (bis max. 24), 20 % auf Patriars Erinnerung (+1 CHA).":"Sacrifice memories (up to 6, one per ability): each costs \u22122 to that ability until long rest or until Remove Curse or Greater Restoration. After a successful prayer about a 60% chance per attempt for +2 (up to 24), 20% for Patriar's Memory (+1 CHA).","In BG3 sind das zwei getrennte Reaktionen: die normale l\xF6st bei Krits nicht aus, \u201EG\xF6ttliches Niederstrecken: Kritischer Treffer\u201C nur bei Krits (4W8 auf Grad 1). Beide einzeln einstellen.":`In BG3 these are two separate reactions: the normal one doesn't trigger on crits, "Divine Smite: Critical Hit" only on crits (4d8 at level 1). Set both individually.`,"Ein humanoides Ziel legt einen Weisheitsrettungswurf ab, sonst ist es gel\xE4hmt. Am Ende jedes seiner Z\xFCge darf es erneut w\xFCrfeln. Angriffe treffen automatisch, aus 3 m oder weniger sind sie immer kritisch.":"A humanoid target makes a Wisdom saving throw or is paralysed. It may reroll at the end of each of its turns. Attacks hit automatically, and from 3 m or less they are always critical.","Endet Hast vorzeitig, ist das Ziel einen Zug lethargisch: keine Bewegung, keine Aktionen, keine Reaktionen. Deshalb lieber Gale halten lassen. Im Ehrenmodus erlaubt die Hast-Aktion wie am Tisch nur m Eidbrecher-Ritter (Oathbreaker Knight) sprichst. Eidbrecher werden ist kostenlos; den Eid der Rache wiederherzustellen kostet 1.000 Gold (danach 2.000, ab dem dritten Mal 10.000).",tags:["quest"]},{id:"o11",act:1,area:"Camp",t:"Eidbrecher-Ritter niemals t\xF6ten",d:"Ist der Ritter tot, verweigert Der Verdorrte (Withers) den Respec f\xFCr den Rest des Durchgangs \u2013 auch nach einer sp\xE4teren R\xFCckkehr zum Eid.",tags:["quest","miss"]},{id:"o15",act:1,area:"Camp",t:"Schattenherz auf Dom\xE4ne des Lichts umskillen",d:"Ihre Trickserei-Dom\xE4ne hilft dir kaum. Licht gilt in Patch-8-Guides als beste Allround-Wahl, Leben, wenn sie die einzige Heilerin ist. Sie ist kein Eidbrecher, Der Verdorrte skillt sie ganz normal um. Erstes Talent f\xFCr sie: Kriegszauberer (War Caster), damit Segnen h\xE4lt.",tags:["quest"]},{id:"o12",act:1,area:"Camp",t:"Elixiere der H\xFCgelriesenst\xE4rke horten",d:"ST\xC4 21 bis zur langen Rast \u2013 bis zu den Panzerhandschuhen dein Standard-Elixier vor Bossk\xE4mpfen. Nur ein Elixier gleichzeitig aktiv. Fr\xFCh kaufen: Tantchen Ethel verkauft im Hain 3 St\xFCck, aufgef\xFCllt nach jeder langen Rast oder jedem Stufenaufstieg \u2013 ihr Laden schlie\xDFt f\xFCr immer, sobald sie ihre Vettel-Gestalt zeigt, in den Tunnel flieht oder im Teehaus stirbt.",tags:["item"]},{id:"o4",act:1,area:"Camp",t:"Kein Respec mehr bei Der Verdorrte",d:"Withers skillt Eidbrecher nicht um. Stufenaufstiege bewusst planen \u2013 Klasse hinzuf\xFCgen beim Aufstieg geht weiterhin normal. Umskillen nur nach Wiederherstellung des Eides (1.000 Gold).",tags:["quest","miss"]},{id:"a2",act:1,area:"Camp",t:"ST\xC4-17-Entscheidung treffen",d:"ST\xC4 17 behalten und mit Tantchen Ethels Haar (Auntie Ethel's Hair) vor Stufe 4 auf 18 bringen. Der alte Plan B (Umskillen bei Der Verdorrte) geht als Eidbrecher nicht mehr.",tags:["quest"]},{id:"a3",act:1,area:"Smaragdhain",t:"Gro\xDFschwert +1 (Greatsword +1) kaufen \u2013 \xDCbergangswaffe",d:"Garantiert bei Grat im Goblinlager (X \u221299 / Y 424), sonst zuf\xE4llig bei H\xE4ndlern mit magischen Nahkampfwaffen. 85 gp Basispreis. Ersatz f\xFCr die verpasste Immergl\xFCh-Klinge (Everburn Blade). Alternative: Blutige Gro\xDFaxt (Blooded Greataxe).",tags:["item"]},{id:"a4",act:1,area:"Smaragdhain",t:"Das fl\xFCsternde Versprechen (The Whispering Promise) bei Volo",d:"40 gp (Ehrenmodus 85 gp). Volo verkauft es am Heiligen Teich \u2013 dort \xFCber den Handel-Button unten links, nicht \xFCber den Dialog \u2013 und sp\xE4ter auch im Lager (Akt 1\u20133). Grat im Goblinlager nur, solange du es nicht von Volo hast. An Schattenherz geben.",tags:["item"]},{id:"a5",act:1,area:"Smaragdhain",t:"Jagdkurzbogen (Hunting Shortbow) f\xFCr Astarion",d:"Dammon in der Mulde des Smaragdhains (X 177 / Y 562). +1-Kurzbogen mit Vorteil gegen Monstrosit\xE4ten und Mal des J\xE4gers 1\xD7 pro langer Rast. \xDCbergangsbogen f\xFCr Astarion, bis der Bogen der Todesfee da ist.",tags:["item"]},{id:"a7",act:1,area:"Smaragdhain \u2192 Uferteehaus",t:"Quest \u201ERettet Mayrina\u201C (Tantchen Ethel) starten",d:"Ethel im Hain ansprechen; die Spur f\xFChrt zum Uferteehaus (Riverside Teahouse).",tags:["quest"]},{id:"a8",act:1,area:"Eulenb\xE4renh\xF6hle",t:"Mondtropfenanh\xE4nger (Moondrop Pendant)",d:"Eulenb\xE4renh\xF6hle (X \u2212321 / Y \u2212135): Die Sel\xFBne-Truhe ist versiegelt. Gebetsblatt hinter der Sel\xFBne-Statue finden (Wahrnehmung) und vor der Truhe vorlesen. Effekt: bei 50 % TP oder weniger keine Gelegenheitsangriffe.",tags:["item"]},{id:"a9",act:1,area:"Ethels Versteck",t:"Tantchen Ethels Haar \u2192 +1 ST\xC4",d:"Nur im Versteck im \xFCberwucherten Tunnel \u2013 im Uferteehaus verhandelt sie nie, auch nicht unter 20 % TP. Unter 20 % TP bringen und ihren Zug abwarten. Nicht verstummen lassen, nicht bewusstlos schlagen. SG 20 T\xE4uschen oder Einsch\xFCchtern (K\xE4mpfer und Barbaren: SG 15 Einsch\xFCchtern mit Vorteil). Erfolg = Haar + Mayrina frei, Ethel geht. Misslingt eine Probe, ist die andere gesperrt \u2013 den Deal kannst du dann noch annehmen. Achtung Rache-Weg: Jeder Deal mit ihr bricht den Paladin-Eid. Details in der Anleitung.",tags:["item","miss","quest"]},{id:"a9b",act:1,area:"Ethels Versteck",t:"Trank \u201EGebrochene Versprechen\u201C (Broken Promises) NICHT trinken",d:"Hexentrank aus Ethels Werkstatt: +2 ST\xC4 bis zur langen Rast, danach \u22121 ST\xC4 dauerhaft. Verkaufen oder liegen lassen.",tags:["item","miss"]},{id:"a10",act:1,area:"Goblinlager",t:"Grat: Gro\xDFschwert +1 / Das fl\xFCsternde Versprechen (Fallback)",d:"Grat verkauft das Gro\xDFschwert +1 immer. Das fl\xFCsternde Versprechen nur, wenn du es nicht schon von Volo hast \u2013 und nur, solange Volo noch im Goblinlager ist.",tags:["item"]},{id:"a11",act:1,area:"Zerschmettertes Heiligtum",t:"Handschuhe des grummelnden Verlierers (Gloves of the Growling Underdog)",d:"Dror Ragzlins Schatzkisten hinter dem Eisentor (X 298 / Y 66): SG 18 Fingerfertigkeit oder Drors Schl\xFCssel. Vorteil auf Nahkampf-Waffenangriffe, wenn 2+ Gegner im Umkreis von 3 m um dein Ziel stehen, +1 auf ST\xC4-Rettungsw\xFCrfe. Im Schatz liegt auch ein St\xFCck Infernales Eisen f\xFCr Dammon.",tags:["item"]},{id:"a12",act:1,area:"Zerschmettertes Heiligtum",t:"Stiefel des Schreitens (Boots of Striding) \u2013 Minthara",d:"Guter Pfad: Minthara besiegen und pl\xFCndern (X 335 / Y 43). W\xE4hrend Konzentration nicht umsto\xDFbar und nicht verschiebbar, Konzentrationszauber geben Schwung, dazu +1 Athletik \u2013 ideal mit Krone des Wahnsinns und Hast.",tags:["item","miss"]},{id:"a13",act:1,area:"Sel\xFBnitischer Au\xDFenposten (Unterreich)",t:"Helm des Niederstreckens (Helmet of Smiting)",d:"Verschlossene vergoldete Truhe s\xFCdwestlich des Wegpunkts (X 163 / Y \u2212248). Zugang z. B. \xFCber den Geheimgang im Zerschmetterten Heiligtum. Die tempor\xE4ren TP halten nur 2 Runden.",tags:["item"]},{id:"a14",act:1,area:"Unterreich \u2013 Myconid-Kolonie",t:"\xC4tzendes Band (Caustic Band) bei Derryth Bonecloak",d:"40 gp (Ehrenmodus 590 gp), Derryth in der Ebonsee-Grotte (X \u221255 / Y \u221293). +2 S\xE4ureschaden pro Waffentreffer \u2013 doppelt wertvoll ab Zus\xE4tzlicher Angriff.",tags:["item"]},{id:"a15",act:1,area:"Boot zur Grymschmiede",t:"Jorgorals Gro\xDFschwert (Jorgoral's Greatsword) \u2013 Korsar Greymon",d:"+1, 2W6+1 Hieb, Spezialaktion Kolossaler Ansturm (Colossal Onslaught): trifft alle in einer Linie, +\xDCbungsbonus Schaden, profitiert von GWM. Kaufen oder pl\xFCndern. Greymon NICHT \xFCber die Athletik-Option im Dialog vom Flo\xDF sto\xDFen \u2013 dann ist die Beute dauerhaft weg. St\xF6\xDFt du ihn im Kampf ins Wasser, wird seine Leiche am S\xFCdpier des Verfallenen Dorfs angesp\xFClt.",tags:["item","miss"]},{id:"o3",act:1,area:"Boot zur Grymschmiede",t:"Bogen der Todesfee (Bow of the Banshee) f\xFCr Astarion \u2013 Korsar Greymon",d:"Seltener +1-Kurzbogen (190 gp): Treffer k\xF6nnen Ver\xE4ngstigt ausl\xF6sen (SG 12 Weisheit, 2 Runden); +1W4 auf Angriff und Schaden gegen ver\xE4ngstigte Ziele. Auf dem Flo\xDF pl\xFCndern oder sp\xE4ter bei Greymon in der Grymschmiede (X \u2212120 / Y \u221295) kaufen. Nicht per Athletik-Dialog vom Flo\xDF sto\xDFen.",tags:["item","miss"]},{id:"a16",act:1,area:"Grymschmiede",t:"Adamant-Schienenpanzer (Adamantine Splint Armour) schmieden",d:"Schienen-Gussform (Splint Mould) auf einem Felsvorsprung bei X \u2212593 / Y 311 nahe Wegpunkt Alte Schmiede, dazu eines der zwei Mithrilerze. Beim ersten \xD6ffnen des Lavaventils erscheint Grym. RK 18, immun gegen Krits, \u22122 auf jeden erlittenen Schaden; Nahkampf-Angreifer taumeln.",tags:["item","quest"]},{id:"a17",act:1,area:"Gebirgspass",t:"Lae'zels Quest / Rosymorn-Kloster (optional)",d:"H\xE4ndler und Loot im Pass mitnehmen.",tags:["quest"]},{id:"o14",act:1,area:"Aufgestiegene Stra\xDFe",t:"Schwert der Gerechtigkeit (Sword of Justice) \u2013 Anders",d:"Ungew\xF6hnliches +1-Gro\xDFschwert, tr\xE4gt Anders am Mauthaus der Aufgestiegenen Stra\xDFe (X 110 / Y 560). Tyrs Schutz als Bonusaktion, 1\xD7 pro kurzer Rast. Anders gibt es dir f\xFCr Karlachs Tod \u2013 oder du nimmst es ihm ab, wenn du dich auf Karlachs Seite stellst (empfohlen, so bekommst du Karlach als Gef\xE4hrtin).",tags:["item","miss"]},{id:"o13",act:1,area:"Gebirgspass \u2013 Krippe Y'llek",t:"Ring des seltsamen Leiters (Strange Conduit Ring)",d:"Prunkvolle Truhe in der Kammer des Inquisitors in der Krippe Y'llek (ca. X 1360 / Y \u2212657). +1W4 psychisch auf Waffenangriffe, solange du dich auf einen Zauber konzentrierst \u2013 mit Magischer Waffe ab Stufe 5 praktisch dauerhaft.",tags:["item","miss"]},{id:"o10",act:1,area:"Gebirgspass \u2013 Pfad zum Rosymorn-Kloster",t:"Gloves of Baneful Striking bei Lady Esther",d:"90 gp, nord\xF6stlich des Wegpunkts Trielta-Klippen (X \u221243 / Y \u2212129). Sp\xE4tes Akt 1. Nach jedem Waffentreffer \u22121W4 auf den Rettungswurf des Ziels gegen deinen n\xE4chsten Zauber \u2013 laut bg3.wiki gilt der Malus per Bug sogar f\xFCr alle Rettungsw\xFCrfe in der Dauer.",tags:["item"]},{id:"a18",act:1,area:"Point of no Return",t:"Vor Akt 2: Akt-1-Restliste pr\xFCfen",d:"Ethels Haar, Helm (Au\xDFenposten), Adamant-R\xFCstung, Jorgoral, H\xE4ndlerk\xE4ufe. Nach dem \xDCbergang ins Schattenverfluchte Land kommst du nicht zur\xFCck.",tags:["miss","quest"]},{id:"b1",act:2,area:"Letztes Licht (Last Light Inn)",t:"Umhang des Schutzes (Cloak of Protection) \u2013 Quartiermeisterin Talli",d:"200 gp (Ehrenmodus 310 gp). +1 RK, +1 auf alle Rettungsw\xFCrfe. F\xE4llt das Gasthaus, stirbt Talli \u2013 sofort kaufen.",tags:["item","miss"]},{id:"o16",act:2,area:"Letztes Licht (Last Light Inn)",t:"Fehlerhafte H\xF6llend\xE4mmerungs-Handschuhe (Flawed Helldusk Gloves) bei Dammon",d:"Dammon schmiedet aus Infernalem Eisen in fester Reihenfolge: erst R\xFCstung, dann Helm, dann Handschuhe \u2013 du brauchst also drei St\xFCck. +1W4 Feuer auf jeden Waffenangriff.",tags:["item","miss"]},{id:"b2",act:2,area:"Letztes Licht",t:"Gasthaus und Isobel sch\xFCtzen",d:"Sichert H\xE4ndler und Story-Pfad.",tags:["quest","miss"]},{id:"b3",act:2,area:"Level 5",t:"Zus\xE4tzlicher Angriff + Magische Waffe einsatzbereit",d:"Neue Eidzauber: Krone des Wahnsinns (Crown of Madness) und Dunkelheit (Darkness). Magische Waffe (Magic Weapon) vorbereiten. Gale lernt Hast (Haste) und castet sie auf Droughnir; Person festhalten \xFCbernimmt ebenfalls Gale.",tags:["quest"]},{id:"o7",act:2,area:"Schattenverfluchte Lande",t:"Ab Stufe 6: Schatten und Gespenster kontrollieren",d:"Schatten und Gespenster (Wraiths) sind Level 5. Bonus: Wer im Schattenfluch stirbt, steht nach ein, zwei Runden als Untoter wieder auf und l\xE4sst sich dann kontrollieren.",tags:["quest"]},{id:"b4",act:2,area:"Mondaufgangst\xFCrme",t:"Trank der ewigen Kraft (Potion of Everlasting Vigour): +2 ST\xC4 dauerhaft",d:"Araj Oblodra im Erdgeschoss ansprechen und Astarion \xFCberreden, sie zu bei\xDFen. Erledigen, bevor du die T\xFCrme st\xFCrmst. +2 ST\xC4 dauerhaft, auch \xFCber 20 \u2013 wirkt aber nicht, solange Elixier oder Panzerhandschuhe ST\xC4 fest setzen.",tags:["item","miss"]},{id:"o17",act:2,area:"Shar-Pr\xFCfung (Gauntlet of Shar)",t:"Ring des kaltherzigen Leuchtens (Callous Glow Ring)",d:"Tresort\xFCr n\xF6rdlich von Balthazars Vorraum (X \u2212822 / Y \u2212759): SG 30 Fingerfertigkeit, kein Schl\xFCssel \u2013 alternativ der Zauber Klopfen (Knock). Die Truhe ganz rechts enth\xE4lt den Ring. +2 glei\xDFend gegen hell beleuchtete Ziele \u2013 bei jeder Schadensinstanz.",tags:["item"]},{id:"o5",act:2,area:"Level 7 \u2013 vor dem Haus der Heilung",t:"Aura des Hasses aktivieren",d:"+CHA-Mod Schaden auf Nahkampfwaffenangriffe f\xFCr dich und alle Unholde und Untoten in 3 m \u2013 auch feindliche. Einmal anklicken, danach bleibt sie aktiv. Feindliche Untote neben dir zuerst t\xF6ten.",tags:["quest"]},{id:"o6",act:2,area:"Haus der Heilung",t:"Ab Stufe 8: Malus Thorm kontrollieren",d:"Malus Thorm ist Level 7 und \u2013 anders als Balthazar und die anderen Thorms \u2013 nicht immun. So umgehst du den Bosskampf gro\xDFteils. Die untoten Krankenschwestern (Level 6) gehen schon ab Stufe 7.",tags:["quest","miss"]},{id:"b5",act:2,area:"Level 6",t:"Aura des Schutzes aktiv \u2013 Gruppe eng halten",d:"+CHA-Mod auf Rettungsw\xFCrfe f\xFCr alle Verb\xFCndeten in 3 m.",tags:["quest"]},{id:"c1",act:3,area:"Haus der Hoffnung \u2013 Archiv",t:"Panzerhandschuhe der H\xFCgelriesenst\xE4rke (Gauntlets of Hill Giant Strength)",d:"Setzen ST\xC4 auf 23. Sockelfalle: SG 20 Fingerfertigkeit. Kein Respec n\xF6tig \u2013 dein investierter ST\xC4-Wert ist dann einfach \xFCbersch\xFCssig.",tags:["item"]},{id:"c2",act:3,area:"Haus der Hoffnung \u2013 Archiv",t:"Amulett der gr\xF6\xDFeren Gesundheit (Amulet of Greater Health)",d:"Setzt KON auf 23 \u2013 im gleichen Raum wie die Panzerhandschuhe.",tags:["item"]},{id:"c3",act:3,area:"Haus der Hoffnung",t:"H\xF6llend\xE4mmerungs-R\xFCstung (Helldusk Armour)",d:"Raphael besiegen. RK 21, Fliegen ohne Konzentration, Feuerresistenz, \u22123 Schaden aus allen Quellen, \xDCbung automatisch. Die passenden H\xF6llend\xE4mmerungs-Stiefel liegen in einer verschlossenen vergoldeten Truhe ganz oben in der Wyrmfelsen-Festung \u2013 vor Gortashs Kr\xF6nung nehmen, sonst werden er und die Stahlw\xE4chter dort feindlich.",tags:["item","miss"]},{id:"o18",act:3,area:"Unterstadt \u2013 Haus der Trauer",t:"Spiegel des Verlusts (Mirror of Loss): +2 CHA",d:"Nur der Spiegel im Haus der Trauer (Kreuzgang der d\xFCsteren Umarmung) funktioniert, der in der Shar-Pr\xFCfung ist zerbrochen. Erst identifizieren: SG 20 Religion oder SG 25 Arkane Kunde (eine Figur reicht). Dann betet jede Figur einmal: SG 25 Religion \u2013 misslingt das, gibt es f\xFCr sie nie +2. Danach Erinnerungen opfern (je \u22122 auf ein Attribut bis zur langen Rast): mit Gebet etwa 60 % Chance pro Versuch auf +2 (bis max. 24). Mehr in der Anleitung.",tags:["item","miss"]},{id:"c4",act:3,area:"Drachenweg unter Wyrmfels",t:"Baldurans Riesent\xF6ter (Balduran's Giantslayer)",d:"Legend\xE4r, +3. Beide Drachenkopf-Fackeln mit Blitzschaden treffen, vier Pr\xFCfungen bestehen. Das Schwert liegt auf Ansurs Leichnam \u2013 Ansprechen oder Pl\xFCndern startet den Kampf gegen Ansur und zwei Wasser-Myrmidonen. Passiv: Der ST\xC4-Schaden wird verdoppelt, Vorteil gegen gro\xDFe und gr\xF6\xDFere Ziele \u2013 deine Endwaffe.",tags:["item"]},{id:"o19",act:3,area:"Drachenweg unter Wyrmfels",t:"Helm des Balduran (Helm of Balduran)",d:"Auf dem Altar im Norden der H\xF6hle neben Ansur (X 636 / Y \u2212964). Seit Patch 8 kannst du ihn nehmen, ohne Ansur zu wecken. Heilt im Kampf 2 TP pro Zug, +1 RK und Rettungsw\xFCrfe, keine Krits gegen dich, immun gegen Bet\xE4ubung.",tags:["item"]},{id:"c5",act:3,area:"Camp",t:"Handschuhe und Amulett anlegen \u2013 ohne Respec",d:"Als Eidbrecher skillt Der Verdorrte nicht um. Panzerhandschuhe (ST\xC4 23) und Amulett (KON 23) wirken trotzdem voll; CHA hebst du per Talent auf 18.",tags:["quest"]},{id:"c6",act:3,area:"Vorrat",t:"Elixiere der H\xFCgelriesenst\xE4rke (ST\xC4 21) f\xFCr Bosse",d:"Bis die Handschuhe da sind, je ein Elixier pro Bosskampf.",tags:["item"]}],Um=["a1","o2","o1","o11","o4","o15","o12","a2","a3","a4","a5","a7","a8","a9","a9b","o14","a10","a11","a12","a13","a14","a15","o3","a16","a17","o10","o13","a18","b1","o16","b2","b3","b5","o7","b4","o17","o5","o6","c1","c2","c3","c4","o19","o18","c5","c6"];ze.sort((e,t)=>{let a=Um.indexOf(e.id),r=Um.indexOf(t.id);return e.act-t.act||(a<0?999:a)-(r<0?999:r)});var yk={1:"Akt 1 \xB7 Ruinen \u2192 Smaragdhain \u2192 Goblinlager \u2192 Unterreich \u2192 Grymschmiede \u2192 Gebirgspass",2:"Akt 2 \xB7 Schattenverfluchtes Land",3:"Akt 3 \xB7 Baldurs Tor"},$=[{slot:"Waffe",ic:"weapon",act:"Sofort",n:"Gro\xDFschwert +1",en:"Greatsword +1",r:"uncommon",w:"Garantiert bei Grat (Goblinlager), zuf\xE4llig bei anderen H\xE4ndlern mit magischen Nahkampfwaffen",y:"+1 Treffer und Schaden; 2W6 profitiert maximal von Kampf mit gro\xDFen Waffen. Ersatz f\xFCr die verpasste Immergl\xFCh-Klinge."},{slot:"Waf rosit\xE4ten, Mal des J\xE4gers 1\xD7 pro langer Rast. \xDCbergangsbogen bis zum Bogen der Todesfee."},{slot:"Fernkampf (Astarion)",ic:"bow",act:"Akt 1",n:"Bogen der Todesfee",en:"Bow of the Banshee",r:"rare",w:"Korsar Greymon \u2013 auf dem Boot pl\xFCndern oder in der Grymschmiede kaufen",y:"+1, Treffer k\xF6nnen Ver\xE4ngstigt ausl\xF6sen (SG 12 Weisheit, 2 Runden); +1W4 auf Angriff und Schaden gegen ver\xE4ngstigte Ziele \u2013 perfekt nach deinem Gr\xE4sslichen Aussehen."},{slot:"Handschuhe",ic:"gloves",act:"Akt 1",n:"Gloves of Baneful Striking",en:"Gloves of Baneful Striking",r:"uncommon",w:"Lady Esther, Pfad zum Rosymorn-Kloster (90 gp, sp\xE4tes Akt 1)",y:"Nach jedem Waffentreffer \u22121W4 auf den Rettungswurf des Ziels gegen deinen n\xE4chsten Zauber (z. B. Befehl). Ob es auch f\xFCr Eid-F\xE4higkeiten gilt, ist nicht belegt."}],Lk=[{lv:2,cls:"Paladin 2",g:"Kampf mit gro\xDFen Waffen \xB7 G\xF6ttliches Niederstrecken (Divine Smite) \xB7 Zauberwirken",p:"Vorbereiten: Befehl (Command), Donnerndes und Zorniges Niederstrecken, Schild des Glaubens (Shield of Faith), G\xF6ttliche Gunst (Divine Favour). Segnen (Bless) \xFCbernimmt Schattenherz."},{lv:3,cls:"Paladin 3 \u2013 Eidbrecher",g:"Trotziges Leid (Spiteful Suffering) \xB7 Untote kontrollieren (Control Undead) \xB7 Gr\xE4ssliches Aussehen (Dreadful Aspect) \xB7 G\xF6ttliche Gesundheit",p:"Eine Eid-Ladung pro kurzer Rast f\xFCr alle drei F\xE4higkeiten. Eidzauber immer vorbereitet: H\xF6llischer Tadel, Wunden verursachen. Vorbereiten (6): Befehl, Schild des Glaubens, G\xF6ttliche Gunst, Donnerndes und Zorniges Niederstrecken, Wunden heilen."},{lv:4,cls:"Paladin 4",g:"Talent: Meisterschaft gro\xDFer Waffen (Great Weapon Master)",p:"+10 Schaden pro Treffer bei \u22125 Treffer, plus Bonusangriff nach Krit oder Kill mit einem Nahkampf-Waffenangriff. \u201EAll In\u201C nur mit Vorteil oder Segnen."},{lv:5,cls:"Paladin 5",g:"Zus\xE4tzlicher Angriff (Extra Attack) \xB7 Grad-2-Pl\xE4tze \xB7 Eidzauber Krone des Wahnsinns & Dunkelheit",p:"Vorbereiten: Magische Waffe (Magic Weapon) \u2013 gleicht den GWM-Malus aus und h\xE4lt den Ring des seltsamen Leiters an \u2013 plus Brandmarkendes Niederstrecken (Branding Smite)."},{lv:6,cls:"Paladin 6",g:"Aura des Schutzes (Aura of Protection): +CHA auf Rettungsw\xFCrfe in 3 m",p:"Die wichtigste Defensive der Glaskanone \u2013 sch\xFCtzt auch Schattenherz' Konzentration, wenn sie nah bei dir steht."},{lv:7,cls:"Paladin 7",g:"Aura des Hasses (Aura of Hate): +CHA-Schaden auf jeden Nahkampfwaffentreffer",p:"Ab hier trennen sich die Wege. Jeder zus\xE4tzliche Angriff pro Zug bekommt den Aura-Bonus \u2013 deshalb lohnen Wege mit vielen Angriffen. Vorbereiten: Schwache Genesung (Lesser Restoration)."}],Vt=[{id:"w4",oath:"ob",main:"CHA (gebundene Waffe) + ST\xC4",n:"Eidbrecher 7 / Hexenmeister 5",sub:"Pakt der Klinge",tag:"Bester Schaden",rank:1,att:"3 pro Aktion, mit Hast 6",feats:2,slot:"Grad 3 (Hexer, kurze Rast)",hm:"Nein \u2013 dort nur 2 Angriffe",effort:"Mittel bis hoch",dpr:[75,150,150],ic:["s-aura-hate","s-pact-blade","s-haste"],engine:"Paladin-Extra-Angriff und Vertiefter Pakt stapeln au\xDFerhalb des Ehrenmodus: drei Angriffe pro Aktion. Jeder davon bekommt GWM (+10), Aura des Hasses (+CHA) und die Riesent\xF6ter-Passive. Hexer-Pl\xE4tze laden bei kurzer Rast \u2013 zwei Smites 3. Grades pro Kampf.",pro:["Die meisten Treffer pro Zug \u2013 also die meisten Aura-, GWM- und Item-Boni","Hexer-Pl\xE4tze laden bei kurzer Rast","Riesent\xF6ter beh\xE4lt als Paktwaffe seinen ST\xC4-Bonus (CHA + ST\xC4)"],con:["Funktioniert im Ehrenmodus nicht (nur 2 Angriffe)","Stufen 8\u20139 bringen kaum Fortschritt","Als Paktwaffe greifst du mit CHA an \u2013 CHA wird so wichtig wie ST\xC4"],levels:[{lv:8,cls:"Hexenmeister 1",g:"Unterklasse Hexklinge (Hexblade, seit Patch 8) oder Unhold (Fiend) \xB7 Hexer-Pl\xE4tze",p:"Zaubertrick Schauerlicher Strahl (Eldritch Blast), Zauber Hexerfluch (Hex). Hexer-Pl\xE4tze laden bei kurzer Rast."},{lv:9,cls:"Hexenmeister 2",g:"Zwei Schauerliche Anrufungen",p:"Qualvoller Strahl (Agonising Blast) und Teufelssicht (Devil's Sight) \u2013 oder was dir im Nahkampf n\xFCtzt."},{lv:10,cls:"Hexenmeister 3",g:"Pakt der Klinge (Pact of the Blade)",p:"Waffe binden: Angriff und Schaden dann mit CHA, die Riesent\xF6ter-Passive addiert weiter einmal ST\xC4. Der dritte Angriff braucht laut deiner Quelle die gebundene Waffe \u2013 im Spiel pr\xFCfen."},{lv:11,cls:"Hexenmeister 4",g:"Talent: Attributserh\xF6hung CHA +2",p:"Jetzt doppelt wichtig: CHA ist dein Angriffs- und Schadensattribut und skaliert beide Auren."},{lv:12,cls:"Hexenmeister 5",g:"Vertiefter Pakt (Deepened Pact): 3 Angriffe pro Aktion \xB7 Grad-3-Hexerpl\xE4tze",p:"Nur au\xDFerhalb des Ehrenmodus. Nach dem Aufstieg kurz testen: Einige Spieler meldeten Probleme, mindestens teilweise wegen Mods."}],nova:["Gale wirkt Hast auf dich (oder Trank der Geschwindigkeit)","Aktion: 3 Angriffe mit GWM, Smite nur auf Krits","Hast-Aktion: 3 weitere Angriffe","Kill mit Elixier des Blutdursts \u2192 noch eine Aktion (Balanced)"]},{id:"w3",oath:"ob",main:"ST\xC4",n:"Eidbrecher 10 / K\xE4mpfer 2",sub:"Tatendrang",tag:"Passt zum Jetzt",rank:2,att:"2, mit Tatendrang + Hast bis 6",feats:2,slot:"Grad 3",hm:"Ja \u2013 beste Ehrenmodus-Option",effort:"Leicht",dpr:[50,100,150],ic:["s-aura-hate","s-action-surge","s-haste"],engine:"Tatendrang gibt einmal pro kurzer Rast eine volle zweite Angriffs-Aktion \u2013 mit Hast bis zu sechs Angriffe im Er\xF6ffnungszug. Bleibt ein reiner ST\xC4-Build, alle deine ST\xC4-Items wirken voll.",pro:["St\xE4rkster ehrenmodus-sicherer Burst","Kein Umdenken: ST\xC4 bleibt dein Angriffsattribut","Zweiter Kampfstil (Verteidigung +1 RK) und Aura der Tapferkeit"],con:["Kein Verbessertes G\xF6ttliches Niederstrecken","Ein Talent weniger als reiner Eidbrecher"],levels:[{lv:8,cls:"Paladin 8",g:"Talent: Attributserh\xF6hung CHA +2",p:"Hebt Aura des Hasses, Aura des Schutzes und deinen Zauber-SG."},{lv:9,cls:"K\xE4mpfer 1",g:"Kampfstil
