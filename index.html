mon:{n:"Gew\xF6hnlich",c:"#9ca3af"},uncommon:{n:"Ungew\xF6hnlich",c:"#22c55e"},rare:{n:"Selten",c:"#3b82f6"},veryrare:{n:"Sehr selten",c:"#a855f7"},legendary:{n:"Legend\xE4r",c:"#f59e0b"},story:{n:"Story-Item",c:"#d4a373"}},Ee=[{id:"a1",act:1,area:"\xDCberwucherte Ruinen",t:"Fallenraum mit den feuerspeienden Drachenk\xF6pfen",d:"Astarion vorschicken (Wahrnehmung, Fallen entsch\xE4rfen). Als Roter Drachenbl\xFCtiger hast du Feuerresistenz und kannst Hebel oder Truhen notfalls selbst erreichen. Alles looten.",tags:["quest"]},{id:"o2",act:1,area:"\xDCberwucherte Ruinen \u2013 Feuchte Gruft",t:"Untote kontrollieren an einem Gruft-Schreiber testen",d:"Gruft-Schreiber (Entombed Scribe) sind Level 2 \u2013 auf Stufe 3 g\xFCltige Ziele, k\xE4mpfen aber nur mit Zaubern (K\xE4ltestrahl, Nebelwolke, Stille). Ab Stufe 4 der Gruft-Krieger (Level 3) mit Krumms\xE4bel. Der Untote k\xE4mpft bis zur langen Rast f\xFCr dich.",tags:["quest"]},{id:"o1",act:1,area:"Camp",t:"Eidbrecher-Ritter: Eidbrecher best\xE4tigen",d:"Nach dem Eidbruch sind deine Eid-Ladungs-F\xE4higkeiten gesperrt, bis du im Lager mit dem Eidbrecher-Ritter (Oathbreaker Knight) sprichst. Eidbrecher werden ist kostenlos; den Eid der Rache wiederherzustellen kostet 1.000 Gold (danach 2.000, ab dem dritten Mal 10.000).",tags:["quest"]},{id:"o11",act:1,area:"Camp",t:"Eidbrecher-Ritter niemals t\xF6ten",d:"Ist der Ritter tot, verweigert Der Verdorrte (Withers) den Respec f\xFCr den Rest des Durchgangs \u2013 auch nach einer sp\xE4teren R\xFCckkehr zum Eid.",tags:["quest","miss"]},{id:"o15",act:1,area:"Camp",t:"Schattenherz auf Dom\xE4ne des Lichts umskillen",d:"Ihre Trickserei-Dom\xE4ne hilft dir kaum. Licht gilt in Patch-8-Guides als beste Allround-Wahl, Leben, wenn sie die einzige Heilerin ist. Sie ist kein Eidbrecher, Der Verdorrte skillt sie ganz normal um. Erstes Talent f\xFCr sie: Kampferprobter Zauberwirker (War Caster), damit Segnen h\xE4lt. Der komplette Levelbaum steht im Level-Guide.",tags:["quest"]},{id:"o12",act:1,area:"Camp",t:"Elixiere der H\xFCgelriesenst\xE4rke horten",d:"ST\xC4 21 bis zur langen Rast \u2013 bis zu den Panzerhandschuhen dein Standard-Elixier vor Bossk\xE4mpfen. Nur ein Elixier gleichzeitig aktiv. Fr\xFCh kaufen: Tantchen Ethel verkauft im Hain 3 St\xFCck, aufgef\xFCllt nach jeder langen Rast oder jedem Stufenaufstieg \u2013 ihr Laden schlie\xDFt f\xFCr immer, sobald sie ihre Vettel-Gestalt zeigt, in den Tunnel flieht oder im Teehaus stirbt.",tags:["item"]},{id:"o4",act:1,area:"Camp",t:"Kein Respec mehr bei Der Verdorrte",d:"Withers skillt Eidbrecher nicht um. Stufenaufstiege bewusst planen \u2013 Klasse hinzuf\xFCgen beim Aufstieg geht weiterhin normal. Umskillen nur nach Wiederherstellung des Eides (1.000 Gold).",tags:["quest","miss"]},{id:"a2",act:1,area:"Camp",t:"ST\xC4 17 ohne Ethels Haar ausgleichen",d:"Ohne Haar bleibt ST\xC4 17 (+3) \u2013 bis zu den Panzerhandschuhen in Akt 3 je \u22121 auf Treffer und Schaden, rund \u221214 % Schaden pro Zug. Ausgleich: vor harten K\xE4mpfen das Elixier der H\xFCgelriesenst\xE4rke (ST\xC4 21 = +5). Gibt es auch ohne Ethel: Derryth Bonecloak (Myconid-Kolonie), Lady Esther (Pfad zum Rosymorn-Kloster), sp\xE4ter Araj Oblodra, Talli und Mattis (Gasthaus Letztes Licht). Der Trank der ewigen Kraft bringt dich in Akt 2 auf 19 (+4).",tags:["quest"]},{id:"a3",act:1,area:"Smaragdhain",t:"Gro\xDFschwert +1 (Greatsword +1) kaufen \u2013 \xDCbergangswaffe",d:"Garantiert bei Grat im Goblinlager (X \u221299 / Y 424), sonst zuf\xE4llig bei H\xE4ndlern mit magischen Nahkampfwaffen. 85 gp Basispreis. Ersatz f\xFCr die verpasste Immergl\xFCh-Klinge (Everburn Blade). Alternative: Blutige Gro\xDFaxt (Blooded Greataxe).",tags:["item"]},{id:"a4",act:1,area:"Smaragdhain",t:"Das fl\xFCsternde Versprechen (The Whispering Promise) bei Volo",d:"40 gp (Ehrenmodus 85 gp). Volo verkauft es am Heiligen Teich \u2013 dort \xFCber den Handel-Button unten links, nicht \xFCber den Dialog \u2013 und sp\xE4ter auch im Lager (Akt 1\u20133). Grat im Goblinlager nur, solange du es nicht von Volo hast. An Schattenherz geben.",tags:["item"]},{id:"a7",act:1,area:"Smaragdhain \u2192 Uferteehaus",t:"Quest \u201ERettet Mayrina\u201C (Tantchen Ethel) starten",d:"Ethel im Hain ansprechen; die Spur f\xFChrt zum Uferteehaus (Riverside Teahouse).",tags:["quest"]},{id:"a8",act:1,area:"Eulenb\xE4renh\xF6hle",t:"Mondtropfenanh\xE4nger (Moondrop Pendant)",d:"Eulenb\xE4renh\xF6hle (X \u2212321 / Y \u2212135): Die Sel\xFBne-Truhe ist versiegelt. Gebetsblatt hinter der Sel\xFBne-Statue finden (Wahrnehmung) und vor der Truhe vorlesen. Effekt: bei 50 % TP oder weniger keine Gelegenheitsangriffe.",tags:["item"]},{id:"a9",act:1,area:"Ethels Versteck",t:"Tantchen Ethels Haar \u2192 +1 ST\xC4 (optional)",d:"Nicht bekommen? Kein Problem \u2013 der Plan rechnet ohne Haar, siehe \u201EST\xC4 17 ohne Ethels Haar ausgleichen\u201C. Nur im Versteck im \xFCberwucherten Tunnel \u2013 im Uferteehaus verhandelt sie nie, auch nicht unter 20 % TP. Unter 20 % TP bringen und ihren Zug abwarten. Nicht verstummen lassen, nicht bewusstlos schlagen. SG 20 T\xE4uschen oder Einsch\xFCchtern (K\xE4mpfer und Barbaren: SG 15 Einsch\xFCchtern mit Vorteil). Erfolg = Haar + Mayrina frei, Ethel geht. Misslingt eine Probe, ist die andere gesperrt \u2013 den Deal kannst du dann noch annehmen. Achtung Rache-Weg: Jeder Deal mit ihr bricht den Paladin-Eid. Details in der Anleitung.",tags:["item","miss","quest"]},{id:"a9b",act:1,area:"Ethels Versteck",t:"Trank \u201EGebrochene Versprechen\u201C (Broken Promises) NICHT trinken",d:"Hexentrank aus Ethels Werkstatt: +2 ST\xC4 bis zur langen Rast, danach \u22121 ST\xC4 dauerhaft. Verkaufen oder liegen lassen.",tags:["item","miss"]},{id:"a10",act:1,area:"Goblinlager",t:"Grat: Gro\xDFschwert +1 / Das fl\xFCsternde Versprechen (Fallback)",d:"Grat verkauft das Gro\xDFschwert +1 immer. Das fl\xFCsternde Versprechen nur, wenn du es nicht schon von Volo hast \u2013 und nur, solange Volo noch im Goblinlager ist.",tags:["item"]},{id:"a11",act:1,area:"Zerschmettertes Heiligtum",t:"Handschuhe des grummelnden Verlierers (Gloves of the Growling Underdog)",d:"Dror Ragzlins Schatzkisten hinter dem Eisentor (X 298 / Y 66): SG 18 Fingerfertigkeit oder Drors Schl\xFCssel. Vorteil auf Nahkampf-Waffenangriffe, wenn 2+ Gegner im Umkreis von 3 m um dein Ziel stehen, +1 auf ST\xC4-Rettungsw\xFCrfe. Im Schatz liegt auch ein St\xFCck Infernales Eisen f\xFCr Dammon.",tags:["item"]},{id:"a12",act:1,area:"Zerschmettertes Heiligtum",t:"Stiefel des Schreitens (Boots of Striding) \u2013 Minthara",d:"Guter Pfad: Minthara besiegen und pl\xFCndern (X 335 / Y 43). W\xE4hrend Konzentration nicht umsto\xDFbar und nicht verschiebbar, Konzentrationszauber geben Schwung, dazu +1 Athletik \u2013 ideal mit Krone des Wahnsinns und Hast.",tags:["item","miss"]},{id:"a13",act:1,area:"Sel\xFBnitischer Au\xDFenposten (Unterreich)",t:"Helm des Niederstreckens (Helmet of Smiting)",d:"Verschlossene vergoldete Truhe s\xFCdwestlich des Wegpunkts (X 163 / Y \u2212248). Zugang z. B. \xFCber den Geheimgang im Zerschmetterten Heiligtum. Die tempor\xE4ren TP halten nur 2 Runden.",tags:["item"]},{id:"a14",act:1,area:"Unterreich \u2013 Myconid-Kolonie",t:"\xC4tzendes Band (Caustic Band) bei Derryth Bonecloak",d:"40 gp (Ehrenmodus 590 gp), Derryth in der Ebonsee-Grotte (X \u221255 / Y \u221293). +2 S\xE4ureschaden pro Waffentreffer \u2013 doppelt wertvoll ab Zus\xE4tzlicher Angriff.",tags:["item"]},{id:"a15",act:1,area:"Boot zur Grymschmiede",t:"Jorgorals Gro\xDFschwert (Jorgoral's Greatsword) \u2013 Korsar Greymon",d:"+1, 2W6+1 Hieb, Spezialaktion Kolossaler Ansturm (Colossal Onslaught): trifft alle in einer Linie, +\xDCbungsbonus Schaden, profitiert von GWM. Kaufen oder pl\xFCndern. Greymon NICHT \xFCber die Athletik-Option im Dialog vom Flo\xDF sto\xDFen \u2013 dann ist die Beute dauerhaft weg. St\xF6\xDFt du ihn im Kampf ins Wasser, wird seine Leiche am S\xFCdpier des Verfallenen Dorfs angesp\xFClt.",tags:["item","miss"]},{id:"a16",act:1,area:"Grymschmiede",t:"Adamant-Schienenpanzer (Adamantine Splint Armour) schmieden",d:"Schienen-Gussform (Splint Mould) auf einem Felsvorsprung bei X \u2212593 / Y 311 nahe Wegpunkt Alte Schmiede, dazu eines der zwei Mithrilerze. Beim ersten \xD6ffnen des Lavaventils erscheint Grym. RK 18, immun gegen Krits, \u22122 auf jeden erlittenen Schaden; Nahkampf-Angreifer taumeln.",tags:["item","quest"]},{id:"a17",act:1,area:"Gebirgspass",t:"Lae'zels Quest / Rosymorn-Kloster (optional)",d:"H\xE4ndler und Loot im Pass mitnehmen.",tags:["quest"]},{id:"o14",act:1,area:"Aufgestiegene Stra\xDFe",t:"Schwert der Gerechtigkeit (Sword of Justice) \u2013 Anders",d:"Ungew\xF6hnliches +1-Gro\xDFschwert, tr\xE4gt Anders am Mauthaus der Aufgestiegenen Stra\xDFe (X 110 / Y 560). Tyrs Schutz als Bonusaktion, 1\xD7 pro kurzer Rast. Anders gibt es dir f\xFCr Karlachs Tod \u2013 oder du nimmst es ihm ab, wenn du dich auf Karlachs Seite stellst (empfohlen, so bekommst du Karlach als Gef\xE4hrtin).",tags:["item","miss"]},{id:"o13",act:1,area:"Gebirgspass \u2013 Krippe Y'llek",t:"Ring des seltsamen Leiters (Strange Conduit Ring)",d:"Prunkvolle Truhe in der Kammer des Inquisitors in der Krippe Y'llek (ca. X 1360 / Y \u2212657). +1W4 psychisch auf Waffenangriffe, solange du dich auf einen Zauber konzentrierst \u2013 mit Magischer Waffe ab Stufe 5 praktisch dauerhaft.",tags:["item","miss"]},{id:"o10",act:1,area:"Gebirgspass \u2013 Pfad zum Rosymorn-Kloster",t:"Gloves of Baneful Striking bei Lady Esther",d:"90 gp, nord\xF6stlich des Wegpunkts Trielta-Klippen (X \u221243 / Y \u2212129). Sp\xE4tes Akt 1. Nach jedem Waffentreffer \u22121W4 auf den Rettungswurf des Ziels gegen deinen n\xE4chsten Zauber \u2013 laut bg3.wiki gilt der Malus per Bug sogar f\xFCr alle Rettungsw\xFCrfe in der Dauer.",tags:["item"]},{id:"a18",act:1,area:"Point of no Return",t:"Vor Akt 2: Akt-1-Restliste pr\xFCfen",d:"Ethels Haar, Helm (Au\xDFenposten), Adamant-R\xFCstung, Jorgoral, H\xE4ndlerk\xE4ufe. Nach dem \xDCbergang ins Schattenverfluchte Land kommst du nicht zur\xFCck.",tags:["miss","quest"]},{id:"b1",act:2,area:"Letztes Licht (Last Light Inn)",t:"Umhang des Schutzes (Cloak of Protection) \u2013 Quartiermeisterin Talli",d:"200 gp (Ehrenmodus 310 gp). +1 RK, +1 auf alle Rettungsw\xFCrfe. F\xE4llt das Gasthaus, stirbt Talli \u2013 sofort kaufen.",tags:["item","miss"]},{id:"o16",act:2,area:"Letztes Licht (Last Light Inn)",t:"Fehlerhafte H\xF6llend\xE4mmerungs-Handschuhe (Flawed Helldusk Gloves) bei Dammon",d:"Dammon schmiedet aus Infernalem Eisen in fester Reihenfolge: erst R\xFCstung, dann Helm, dann Handschuhe \u2013 du brauchst also drei St\xFCck. +1W4 Feuer auf jeden Waffenangriff.",tags:["item","miss"]},{id:"b2",act:2,area:"Letztes Licht",t:"Gasthaus und Isobel sch\xFCtzen",d:"Sichert H\xE4ndler und Story-Pfad.",tags:["quest","miss"]},{id:"b3",act:2,area:"Level 5",t:"Zus\xE4tzlicher Angriff + Magische Waffe einsatzbereit",d:"Neue Eidzauber: Krone des Wahnsinns (Crown of Madness) und Dunkelheit (Darkness). Magische Waffe (Magic Weapon) vorbereiten. Gale lernt Hast (Haste) und castet sie auf Droughnir; Person festhalten \xFCbernimmt ebenfalls Gale.",tags:["quest"]},{id:"o7",act:2,area:"Schattenverfluchte Lande",t:"Ab Stufe 6: Schatten und Gespenster kontrollieren",d:"Schatten und Gespenster (Wraiths) sind Level 5. Bonus: Wer im Schattenfluch stirbt, steht nach ein, zwei Runden als Untoter wieder auf und l\xE4sst sich dann kontrollieren.",tags:["quest"]},{id:"b4",act:2,area:"Mondaufgangst\xFCrme",t:"Trank der ewigen Kraft (Potion of Everlasting Vigour): +2 ST\xC4 dauerhaft",d:"Araj Oblodra im Erdgeschoss ansprechen und Astarion \xFCberreden, sie zu bei\xDFen. Erledigen, bevor du die T\xFCrme st\xFCrmst. +2 ST\xC4 dauerhaft, auch \xFCber 20 \u2013 wirkt aber nicht, solange Elixier oder Panzerhandschuhe ST\xC4 fest setzen.",tags:["item","miss"]},{id:"o17",act:2,area:"Shar-Pr\xFCfung (Gauntlet of Shar)",t:"Ring des kaltherzigen Leuchtens (Callous Glow Ring)",d:"Tresort\xFCr n\xF6rdlich von Balthazars Vorraum (X \u2212822 / Y \u2212759): SG 30 Fingerfertigkeit, kein Schl\xFCssel \u2013 alternativ der Zauber Klopfen (Knock). Die Truhe ganz rechts enth\xE4lt den Ring. +2 glei\xDFend gegen hell beleuchtete Ziele \u2013 bei jeder Schadensinstanz.",tags:["item"]},{id:"o5",act:2,area:"Level 7 \u2013 vor dem Haus der Heilung",t:"Aura des Hasses aktivieren",d:"+CHA-Mod Schaden auf Nahkampfwaffenangriffe f\xFCr dich und alle Unholde und Untoten in 3 m \u2013 auch feindliche. Einmal anklicken, danach bleibt sie aktiv. Feindliche Untote neben dir zuerst t\xF6ten.",tags:["quest"]},{id:"o6",act:2,area:"Haus der Heilung",t:"Ab Stufe 8: Malus Thorm kontrollieren",d:"Malus Thorm ist Level 7 und \u2013 anders als Balthazar und die anderen Thorms \u2013 nicht immun. So umgehst du den Bosskampf gro\xDFteils. Die untoten Krankenschwestern (Level 6) gehen schon ab Stufe 7.",tags:["quest","miss"]},{id:"b5",act:2,area:"Level 6",t:"Aura des Schutzes aktiv \u2013 Gruppe eng halten",d:"+CHA-Mod auf Rettungsw\xFCrfe f\xFCr alle Verb\xFCndeten in 3 m.",tags:["quest"]},{id:"c1",act:3,area:"Haus der Hoffnung \u2013 Archiv",t:"Panzerhandschuhe der H\xFCgelriesenst\xE4rke (Gauntlets of Hill Giant Strength)",d:"Setzen ST\xC4 auf 23. Sockelfalle: SG 20 Fingerfertigkeit. Kein Respec n\xF6tig \u2013 dein investierter ST\xC4-Wert ist dann einfach \xFCbersch\xFCssig.",tags:["item"]},{id:"c2",act:3,area:"Haus der Hoffnung \u2013 Archiv",t:"Amulett der gr\xF6\xDFeren Gesundheit (Amulet of Greater Health)",d:"Setzt KON auf 23 \u2013 im gleichen Raum wie die Panzerhandschuhe.",tags:["item"]},{id:"c3",act:3,area:"Haus der Hoffnung",t:"H\xF6llend\xE4mmerungs-R\xFCstung (Helldusk Armour)",d:"Raphael besiegen. RK 21, Fliegen ohne Konzentration, Feuerresistenz, \u22123 Schaden aus allen Quellen, \xDCbung automatisch. Die passenden H\xF6llend\xE4mmerungs-Stiefel liegen in einer verschlossenen vergoldeten Truhe ganz oben in der Wyrmfelsen-Festung \u2013 vor Gortashs Kr\xF6nung nehmen, sonst werden er und die Stahlw\xE4chter dort feindlich.",tags:["item","miss"]},{id:"o18",act:3,area:"Unterstadt \u2013 Haus der Trauer",t:"Spiegel des Verlusts (Mirror of Loss): +2 CHA",d:"Nur der Spiegel im Haus der Trauer (Kreuzgang der d\xFCsteren Umarmung) funktioniert, der in der Shar-Pr\xFCfung ist zerbrochen. Erst identifizieren: SG 20 Religion oder SG 25 Arkane Kunde (eine Figur reicht). Dann betet jede Figur einmal: SG 25 Religion \u2013 misslingt das, gibt es f\xFCr sie nie +2. Danach Erinnerungen opfern (je \u22122 auf ein Attribut bis zur langen Rast): mit Gebet etwa 60 % Chance pro Versuch auf +2 (bis max. 24). Mehr in der Anleitung.",tags:["item","miss"]},{id:"c4",act:3,area:"Drachenweg unter Wyrmfels",t:"Baldurans Riesent\xF6ter (Balduran's Giantslayer)",d:"Legend\xE4r, +3. Beide Drachenkopf-Fackeln mit Blitzschaden treffen, vier Pr\xFCfungen bestehen. Das Schwert liegt auf Ansurs Leichnam \u2013 Ansprechen oder Pl\xFCndern startet den Kampf gegen Ansur und zwei Wasser-Myrmidonen. Passiv: Der ST\xC4-Schaden wird verdoppelt, Vorteil gegen gro\xDFe und gr\xF6\xDFere Ziele \u2013 deine Endwaffe.",tags:["item"]},{id:"o19",act:3,area:"Drachenweg unter Wyrmfels",t:"Helm des Balduran (Helm of Balduran)",d:"Auf dem Altar im Norden der H\xF6hle neben Ansur (X 636 / Y \u2212964). Seit Patch 8 kannst du ihn nehmen, ohne Ansur zu wecken. Heilt im Kampf 2 TP pro Zug, +1 RK und Rettungsw\xFCrfe, keine Krits gegen dich, immun gegen Bet\xE4ubung.",tags:["item"]},{id:"c5",act:3,area:"Camp",t:"Handschuhe und Amulett anlegen \u2013 ohne Respec",d:"Als Eidbrecher skillt Der Verdorrte nicht um. Panzerhandschuhe (ST\xC4 23) und Amulett (KON 23) wirken trotzdem voll; CHA hebst du per Talent auf 18.",tags:["quest"]},{id:"c6",act:3,area:"Vorrat",t:"Elixiere der H\xFCgelriesenst\xE4rke (ST\xC4 21) f\xFCr Bosse",d:"Bis die Handschuhe da sind, je ein Elixier pro Bosskampf.",tags:["item"]}],up=["a1","o2","o1","o11","o4","o15","o12","a2","a3","a4","a7","a8","a9","a9b","o14","a10","a11","a12","a13","a14","a15","a16","a17","o10","o13","a18","b1","o16","b2","b3","b5","o7","b4","o17","o5","o6","c1","c2","c3","c4","o19","o18","c5","c6"];Ee.sort((e,t)=>{let a=up.indexOf(e.id),r=up.indexOf(t.id);return e.act-t.act||(a<0?999:a)-(r<0?999:r)});var U1={1:"Akt 1 \xB7 Ruinen \u2192 Smaragdhain \u2192 Goblinlager \u2192 Unterreich \u2192 Grymschmiede \u2192 Gebirgspass",2:"Akt 2 \xB7 Schattenverfluchtes Land",3:"Akt 3 \xB7 Baldurs Tor"},V=[{slot:"Waffe",ic:"weapon",act:"Sofort",n:"Gro\xDFschwert +1",en:"Greatsword +1",r:"uncommon",w:"Garantiert bei Grat (Goblinlager), zuf\xE4llig bei anderen H\xE4ndlern mit magischen Nahkampfwaffen",y:"+1 Treffer und Schaden; 2W6 profitiert maximal von Kampf mit gro\xDFen Waffen. Ersatz f\xFCr die verpasste Immergl\xFCh-Klinge."},{slot:"Waffe",ic:"weapon",act:"Akt 1",n:"Jorgorals Gro\xDFschwert",en:"Jorgoral's Greatsword",r:"rare",w:"Korsar Greymon \u2013 Boot zur Grymschmiede (nicht ins Wasser sto\xDFen)",y:"+1, Kolossaler Ansturm trifft alle in einer Linie (+\xDCbungsbonus Schaden, profitiert von GWM). H\xE4lt bis Akt 3."},{slot:"Waffe",ic:"weapon",act:"Akt 1",n:"Schwert der Gerechtigkeit",en:"Sword of Justice",r:"uncommon",w:"Anders, Mauthaus der Aufgestiegenen Stra\xDFe \u2013 besiegen (Karlachs Seite) oder als Belohnung",y:"+1-Gro\xDFschwert mit dem Zauber Tyrs Schutz. Gleichwertige Alternative zum Gro\xDFschwert +1, falls du Grat und Dammon verpasst."},{slot:"Waffe",ic:"weapon",act:"Akt 3",n:"Baldurans Riesent\xF6ter",en:"Balduran's Giantslayer",r:"legendary",w:"Drache Ansur, Drachenweg unter Wyrmfels (Fackeln mit Blitz treffen, 4 Pr\xFCfungen)",y:"+3. Die Riesent\xF6ter-Passive verdoppelt nicht den Angriffs-Modifikator, sondern addiert deinen ST\xC4-Modifikator einmal pauschal: ungebunden 1\xD7 ST\xC4 + 1\xD7 ST\xC4 (mit ST\xC4 23 also +12). Als Paktwaffe gebunden: 1\xD7 CHA + 1\xD7 ST\xC4. Dazu Vorteil gegen gro\xDFe Ziele und Riesengestalt 1\xD7 pro kurzer Rast."},{slot:"R\xFCstung",ic:"armor",act:"Akt 1",n:"Adamant-Schienenpanzer",en:"Adamantine Splint Armour",r:"veryrare",w:"Adamantschmiede, Grymschmiede (Schienen-Gussform + Mithrilerz)",y:"RK 18, Krit-Immunit\xE4t, \u22122 auf jeden erlittenen Schaden \u2013 perfekt f\xFCr einen Nahk\xE4mpfer mitten im Gedr\xE4nge."},{slot:"R\xFCstung",ic:"armor",act:"Akt 3",n:"H\xF6llend\xE4mmerungs-R\xFCstung",en:"Helldusk Armour",r:"legendary",w:"Raphael besiegen, Haus der Hoffnung",y:"RK 21, Fliegen ohne Konzentration, automatische \xDCbung, \u22123 Schaden aus allen Quellen. Die Feuerresistenz hast du als Roter Drachenbl\xFCtiger schon \u2013 f\xFCr die Glaskanone z\xE4hlen RK und Schadensreduktion."},{slot:"Helm",ic:"helm",act:"Akt 1",n:"Helm des Niederstreckens",en:"Helmet of Smiting",r:"uncommon",w:"Sel\xFBnitischer Au\xDFenposten, vergoldete Truhe (X 163 / Y \u2212248)",y:"Temp-TP in H\xF6he des CHA-Mods (2 Runden), wenn ein Smite-Zauber einen Zustand ausl\xF6st; +1 auf KON-Rettungsw\xFCrfe (Konzentration f\xFCr Krone des Wahnsinns/Hast)."},{slot:"Handschuhe",ic:"gloves",act:"Akt 1",n:"Handschuhe des grummelnden Verlierers",en:"Gloves of the Growling Underdog",r:"uncommon",w:"Zerschmettertes Heiligtum, Drors Schatz (SG 18 oder Schl\xFCssel)",y:"Vorteil, wenn 2+ Gegner im Umkreis von 3 m um dein Ziel stehen \u2013 gleicht den GWM-Malus aus und verdoppelt fast deine Krit-Chance."},{slot:"Handschuhe",ic:"gloves",act:"Akt 2",n:"Fehlerhafte H\xF6llend\xE4mmerungs-Handschuhe",en:"Flawed Helldusk Gloves",r:"rare",w:"Dammon, Letztes Licht \u2013 aus Infernalem Eisen (drittes geschmiedetes Teil)",y:"+1W4 Feuer auf jeden Waffenangriff, ST\xC4-Rettungsw\xFCrfe +1. Bei 3\u20136 Treffern pro Zug sp\xFCrbar; Teufel und D\xE4monen sind oft feuerresistent."},{slot:"Handschuhe",ic:"gloves",act:"Akt 3",n:"Panzerhandschuhe der H\xFCgelriesenst\xE4rke",en:"Gauntlets of Hill Giant Strength",r:"veryrare",w:"Haus der Hoffnung, Archiv (Falle SG 20)",y:"ST\xC4 23 \u2013 als Eidbrecher ohne Respec, der investierte ST\xC4-Wert ist dann einfach \xFCbersch\xFCssig."},{slot:"Helm",ic:"helm",act:"Akt 3",n:"Helm des Balduran",en:"Helm of Balduran",r:"legendary",w:"Altar neben Ansur im Drachenheiligtum, Drachenweg (X 636 / Y \u2212964)",y:"+1 RK und Rettungsw\xFCrfe, im Kampf 2 TP Heilung zu Beginn jedes Zuges, immun gegen Bet\xE4ubung, Angreifer landen keine kritischen Treffer \u2013 ersetzt die Krit-Immunit\xE4t des Adamant-Panzers."},{slot:"Stiefel",ic:"boots",act:"Akt 1",n:"Stiefel des Schreitens",en:"Boots of Striding",r:"uncommon",w:"Minthara (Zerschmettertes Heiligtum)",y:"W\xE4hrend Konzentration nicht umsto\xDFbar, Schwung beim Wirken \u2013 passt zu Krone des Wahnsinns und Hast."},{slot:"Umhang",ic:"cloak",act:"Akt 2",n:"Umhang des Schutzes",en:"Cloak of Protection",r:"uncommon",w:"Quartiermeisterin Talli, Letztes Licht",y:"+1 RK und +1 auf alle Rettungsw\xFCrfe \u2013 stapelt mit Aura des Schutzes. Glaskanone: ablegen, sobald Schattenherz Schild des Glaubens oder Sch\xFCtzendes Band zuverl\xE4ssig h\xE4lt."},{slot:"Amulett",ic:"amulet",act:"Akt 1",n:"Mondtropfenanh\xE4nger",en:"Moondrop Pendant",r:"uncommon",w:"Eulenb\xE4renh\xF6hle, Sel\xFBne-Truhe (Gebetsblatt)",y:"Unter 50 % TP keine Gelegenheitsangriffe \u2013 sicherer R\xFCckzug ohne Nebelschritt."},{slot:"Amulett",ic:"amulet",act:"Akt 3",n:"Amulett der gr\xF6\xDFeren Gesundheit",en:"Amulet of Greater Health",r:"veryrare",w:"Haus der Hoffnung, Archiv",y:"KON 23 \u2013 mehr TP und sicherere Konzentration."},{slot:"Ring",ic:"ring",act:"Akt 1",n:"Ring des seltsamen Leiters",en:"Strange Conduit Ring",r:"uncommon",w:"Krippe Y'llek, Kammer des Inquisitors (Gebirgspass)",y:"+1W4 psychisch auf Waffenangriffe, solange du dich konzentrierst. Magische Waffe oder Elementarwaffe auf dich selbst halten den Ring dauerhaft an."},{slot:"Ring",ic:"ring",act:"Akt 2",n:"Ring des kaltherzigen Leuchtens",en:"Callous Glow Ring",r:"uncommon",w:"Shar-Pr\xFCfung, Schatzkammer neben Balthazar (T\xFCr SG 30)",y:"+2 glei\xDFend gegen beleuchtete Ziele bei jeder Schadensinstanz \u2013 mit Fackel oder Licht-Zauber von Schattenherz fast immer aktiv."},{slot:"Ring",ic:"ring",act:"Akt 1",n:"\xC4tzendes Band",en:"Caustic Band",r:"uncommon",w:"Derryth Bonecloak, Myconid-Kolonie",y:"+2 S\xE4ure pro Treffer \u2013 skaliert mit Zus\xE4tzlichem Angriff und GWM-Bonusangriff."},{slot:"Ring (Schattenherz)",ic:"ring",act:"Akt 1",n:"Das fl\xFCsternde Versprechen",en:"The Whispering Promise",r:"uncommon",w:"Volo (Heiliger Teich, sp\xE4ter im Lager) oder Grat (Goblinlager)",y:"Heilt Schattenherz dich, bekommst du 2 Runden +1W4 auf Angriffe und Rettungsw\xFCrfe \u2013 wie Segnen, stapelt aber nicht damit."},{slot:"Helm (Schattenherz)",ic:"helm",act:"Akt 1",n:"Wapira's Crown",en:"Wapira's Crown",r:"uncommon",w:"Smaragdhain: Belohnung von Zevlor f\xFCr \u201ERettet die Fl\xFCchtlinge\u201C \u2013 nur wenn du die Geldbelohnung annimmst (Abgeschiedene Kammer, X \u221253 / Y 67)",y:"Heilt Schattenherz einen Verb\xFCndeten, heilt sie sich selbst um 1W6 mit. So bleibt deine Heilerin l\xE4nger stehen \u2013 und kann dich weiter hochheilen."},{slot:"Umhang (Schattenherz)",ic:"cloak",act:"Akt 3",n:"Mantle of the Holy Warrior",en:"Mantle of the Holy Warrior",r:"veryrare",w:"Sturmufer-Tabernakel (Unterstadt): Vikar Humbletoes verkauft ihn (X 107 / Y \u221222)",y:"Kreuzrittermantel (Crusader's Mantle) als Grad-3-Zauber, l\xE4dt bei kurzer Rast. Verb\xFCndete in der Aura machen mit Waffenangriffen zus\xE4tzlich 1W4 glei\xDFenden Schaden \u2013 also auch Droughnir und Lae'zel."},{slot:"R\xFCstung (Schattenherz)",ic:"armor",act:"Akt 1",n:"Adamantine Scale Mail",en:"Adamantine Scale Mail",r:"veryrare",w:"Grymschmiede: Gussform Schuppenpanzer (X \u2212618 / Y 264) + Mithril-Erz an der Adamant-Schmiede",y:"Mittlere R\xFCstung mit RK 16 + GES (max. +2), keine kritischen Treffer und 1 Schaden weniger pro Treffer. Schattenherz steht dicht hinter dir \u2013 so h\xE4lt sie Segnen und Schutzgeister l\xE4nger."},{slot:"Handschuhe (Schattenherz)",ic:"gloves",act:"Akt 1",n:"Hellrider's Pride",en:"Hellrider's Pride",r:"uncommon",w:"Smaragdhain: Zevlor (Abgeschiedene Kammer, X \u221253 / Y 67) \u2013 Belohnung f\xFCr \u201ET\xF6te Kagha\u201C oder \u201EUntersuche Kagha\u201C, sonst stehlen oder pl\xFCndern",y:"Heilt Schattenherz dich, hast du 2 Runden Resistenz gegen Wucht-, Stich- und Hiebschaden von Waffenangriffen \u2013 genau das, was der Glaskanone fehlt."},{slot:"Stiefel (Schattenherz)",ic:"boots",act:"Akt 1",n:"Boots of Aid and Comfort",en:"Boots of Aid and Comfort",r:"uncommon",w:"Goblinlager: H\xE4ndler Grat (X \u221299 / Y 424)",y:"Jede Heilung von Schattenherz gibt dem Ziel zus\xE4tzlich 3 tempor\xE4re TP \u2013 auch bei Gruppenheilung und bei vollen TP. Ein Puffer vor dem ersten Treffer."},{slot:"Waffe (Schattenherz)",ic:"weapon",act:"Akt 1",n:"The Blood of Lathander",en:"The Blood of Lathander",r:"legendary",w:"Rosymorn-Kloster: Quest \u201EFinde das Blut Lathanders\u201C",y:"Legend\xE4rer +3-Streitkolben. F\xE4llt die Tr\xE4gerin auf 0 TP, steht sie 1\xD7 pro langer Rast mit 2W6 TP wieder auf und heilt alle Verb\xFCndeten im Umkreis von 9 m um 1W6."},{slot:"Amulett (Schattenherz)",ic:"amulet",act:"Akt 1",n:"Broodmother's Revenge",en:"Broodmother's Revenge",r:"uncommon",w:"Smaragdhain: tr\xE4gt Kagha im Inneren Heiligtum (X \u2212461 / Y \u221222); alternativ auf Kolls Warentisch in der High Hall (X 235 / Y 44)",y:"Wird Schattenherz geheilt, macht ihre Waffe 3 Runden lang +1W6 Giftschaden. Passt zur Kampf-Klerikerin mit dem Blut Lathanders, die sich selbst mitheilt (Wapira's Crown)."},{slot:"Amulett (Schattenherz)",ic:"amulet",act:"Akt 3",n:"Amulet of the Devout",en:"Amulet of the Devout",r:"veryrare",w:"Sturmufer-Tabernakel (Unterstadt): zentrale Opfertruhe im Keller",y:"+2 auf den Zauber-SG und eine zus\xE4tzliche Ladung G\xF6ttliche Macht (Channel Divinity) \u2013 mehr Untote vertreiben, mehr Strahlende Abwehr. F\xFCr Klerikerinnen gemacht, f\xFCr Paladine fast nutzlos."},{slot:"Ring (Schattenherz)",ic:"ring",act:"Akt 1",n:"Ring of Salving",en:"Ring of Salving",r:"uncommon",w:"Ebonsee-Grotte: Omeluum nach \u201EHilf Omeluum, den Parasiten zu untersuchen\u201C (X 144 / Y 29)",y:"Jede Heilung von Schattenherz an anderen heilt 2 TP mehr. Mit Wapira's Crown, den Boots of Aid and Comfort und Hellrider's Pride wird jedes Heilende Wort zum Komplettpaket."},{slot:"Helm (Gale)",ic:"helm",act:"Akt 1",n:"Circlet of Blasting",en:"Circlet of Blasting",r:"rare",w:"Ebonsee-Grotte: H\xE4ndler Blurg (X 111 / Y \u221289)",y:"Ein kostenloser Sengender Strahl (Scorching Ray, Grad 2) pro langer Rast \u2013 Burst gegen ein Ziel, das Droughnir gerade nicht erreicht."},{slot:"Helm (Gale)",ic:"helm",act:"Akt 3",n:"Hood of the Weave",en:"Hood of the Weave",r:"veryrare",w:"Philgraves Anwesen (Unterstadt): Mystic Carrion verkauft sie (X 14 / Y \u2212160)",y:"+2 auf Zauber-SG und Zauberangriffe \u2013 Person festhalten und Monster festhalten sitzen deutlich \xF6fter, das hei\xDFt Auto-Krits f\xFCr deine Smites."},{slot:"Umhang (Gale)",ic:"cloak",act:"Akt 3",n:"Cloak of the Weave",en:"Cloak of the Weave",r:"veryrare",w:"Devil's Fee (Unterstadt): Helsik, sobald ihr Sonderangebot freigeschaltet ist (X \u221238 / Y 17)",y:"+1 auf Zauber-SG und Zauberangriffe plus Elemente absorbieren 1\xD7 pro kurzer Rast \u2013 Gale \xFCberlebt Feuerb\xE4lle besser."},{slot:"R\xFCstung (Gale)",ic:"armor",act:"Akt 1",n:"Robe of Summer",en:"Robe of Summer",r:"uncommon",w:"Smaragdhain: Truhe im Geheimgew\xF6lbe des Inneren Heiligtums (X 183 / Y \u221282); laut Gale-Questseite auch Belohnung f\xFCr \u201ERettet den Druiden Halsin\u201C",y:"Kleidung (RK 10 + GES) mit K\xE4lteresistenz. Als Zauberer tr\xE4gt Gale keine R\xFCstung \u2013 so funktionieren Magierr\xFCstung und Bracers of Defence weiter."},{slot:"R\xFCstung (Gale)",ic:"armor",act:"Akt 3",n:"Robe of the Weave",en:"Robe of the Weave",r:"veryrare",w:"Ramazith's Tower (Tempelbezirk): in einem Globus der Unverwundbarkeit (X 4970 / Y 705)",y:"Endgame-Robe: RK +2, +1 auf Zauber-SG und Zauberangriffe und Heilung, wenn Gale einen Rettungswurf gegen einen Zauber schafft."},{slot:"Handschuhe (Gale)",ic:"gloves",act:"Akt 1",n:"Bracers of Defence",en:"Bracers of Defence",r:"rare",w:"Verfallenes Dorf: vergoldete Truhe im Keller der Apotheke (X \u2212656 / Y \u2212370)",y:"+2 RK, solange Gale keine R\xFCstung und keinen Schild tr\xE4gt \u2013 Roben z\xE4hlen nicht als R\xFCstung, Magierr\xFCstung stapelt mit."},{slot:"Stiefel (Gale)",ic:"boots",act:"Akt 1",n:"Boots of Stormy Clamour",en:"Boots of Stormy Clamour",r:"uncommon",w:"Ebonsee-Grotte: Omeluum nach \u201EHilf Omeluum, den Parasiten zu untersuchen\u201C (X 144 / Y 29)",y:"Belegt Gale einen Feind mit einem Zustand, bekommt dieser 2 Runden Nachhall (Reverberation) dazu \u2013 senkt Rettungsw\xFCrfe gegen ST\xC4/GES/KON und stapelt zu Donnerschaden."},{slot:"Waffe (Gale)",ic:"weapon",act:"Akt 1",n:"Melf's First Staff",en:"Melf's First Staff",r:"uncommon",w:"Ebonsee-Grotte: H\xE4ndler Blurg (X 111 / Y \u221289)",y:"+1 auf Zauber-SG und Zauberangriffe schon in Akt 1 \u2013 wirkt als Stat-Stick, auch wenn Gale nie damit zuschl\xE4gt. Dazu Melfs S\xE4urepfeil 1\xD7 pro langer Rast."},{slot:"Waffe (Gale)",ic:"weapon",act:"Akt 3",n:"Markoheshkir",en:"Markoheshkir",r:"legendary",w:"Ramazith's Tower (Tempelbezirk): im Globus der Unverwundbarkeit (X 4970 / Y 705)",y:"Legend\xE4rer +2-Kampfstab: verst\xE4rkt Gales Zauber, l\xE4sst sich auf ein Element einstimmen und wirkt 1\xD7 pro langer Rast einen Zauber kostenlos."},{slot:"Amulett (Gale)",ic:"amulet",act:"Akt 1",n:"Pearl of Power Amulet",en:"Pearl of Power Amulet",r:"uncommon",w:"Ebonsee-Grotte: Omeluum nach \u201EHilf Omeluum, den Parasiten zu untersuchen\u201C (X 144 / Y 29)",y:"Stellt 1\xD7 pro langer Rast einen verbrauchten Zauberplatz bis Grad 3 wieder her \u2013 in Akt 2 ein zweites Hast f\xFCr Droughnir. Akt-1-Vorstufe zum Spellcrux Amulet."},{slot:"Amulett (Gale)",ic:"amulet",act:"Akt 2",n:"Spellcrux Amulet",en:"Spellcrux Amulet",r:"veryrare",w:"Gef\xE4ngnis der Mondaufgangst\xFCrme: tr\xE4gt die W\xE4rterin (X 569 / Y \u2212650)",y:"Stellt 1\xD7 pro langer Rast als Bonusaktion einen verbrauchten Zauberplatz beliebigen Grades wieder her. Ab Akt 3 hei\xDFt das ein zweites Monster festhalten oder ein verbrauchter Grad-6-Platz zur\xFCck."},{slot:"Ring (Gale)",ic:"ring",act:"Akt 1",n:"Sunwalker's Gift",en:"Sunwalker's Gift",r:"uncommon",w:"Ebonsee-Grotte: H\xE4ndler Blurg (X 111 / Y \u221289)",y:"Dunkelsicht 12 m f\xFCr den Menschen Gale \u2013 im Unterreich und in den Schattenverfluchten Landen sieht er Ziele, die er sonst nicht anvisieren kann."},{slot:"Ring (Gale)",ic:"ring",act:"Akt 2",n:"Shifting Corpus Ring",en:"Shifting Corpus Ring",r:"rare",w:"Letztes Licht: tr\xE4gt Faust Marcus (X \u221263 / Y 163)",y:"Unsichtbarkeit und Verschwimmen je 1\xD7 pro langer Rast ohne Zauberplatz \u2013 Gale bleibt aus dem Fokus, w\xE4hrend er Hast auf Droughnir h\xE4lt."},{slot:"Handschuhe",ic:"gloves",act:"Akt 1",n:"Gloves of Baneful Striking",en:"Gloves of Baneful Striking",r:"uncommon",w:"Lady Esther, Pfad zum Rosymorn-Kloster (90 gp, sp\xE4tes Akt 1)",y:"Nach jedem Waffentreffer \u22121W4 auf den Rettungswurf des Ziels gegen deinen n\xE4chsten Zauber (z. B. Befehl). Ob es auch f\xFCr Eid-F\xE4higkeiten gilt, ist nicht belegt."},{slot:"Waffe",ic:"weapon",act:"Start",start:1,n:"Gro\xDFschwert",en:"Greatsword",r:"common",w:"Kein Teil der offiziellen Paladin-Startausr\xFCstung (laut bg3.wiki: Kriegshammer, Holzschild, zwei Wurfspeere) \u2013 gew\xF6hnliche Gro\xDFschwerter gibt es fr\xFCh bei Waffenh\xE4ndlern und von Gegnern",y:"2W6 Hieb, zweih\xE4ndig. Grundlage f\xFCr Kampf mit gro\xDFen Waffen und GWM \u2013 Droughnirs Waffe f\xFCr den Glaskanonen-Build, bis das Gro\xDFschwert +1 da ist."},{slot:"Waffe",ic:"weapon",act:"Start",start:1,n:"Kriegshammer",en:"Warhammer",r:"common",w:"Paladin-Startausr\xFCstung auf der Nautiloid, zusammen mit Holzschild und zwei Wurfspeeren",y:"1W8 Wucht (vielseitig: zweih\xE4ndig 1W10). Mit dem Holzschild +2 RK \u2013 sicherer, aber ohne Kampf mit gro\xDFen Waffen und GWM. F\xFCr die Glaskanone nur die Notl\xF6sung."},{slot:"R\xFCstung",ic:"armor",act:"Start",start:1,n:"Schuppenpanzer der Rache",en:"Scale Mail of Vengeance",r:"common",w:"Paladin-Startausr\xFCstung des Eids der Rache \u2013 jeder Eid hat seine eigene Schuppenpanzer-Variante",y:"Mittlere R\xFCstung: RK 14 + GES (max. 2), Nachteil auf Heimlichkeit. Mit GES 10 also RK 14 \u2013 so fr\xFCh wie m\xF6glich durch den Adamant-Schienenpanzer ersetzen."},{slot:"Stiefel",ic:"boots",act:"Start",start:1,n:"Lederstiefel",en:"Leather Boots",r:"common",w:"Paladin-Startausr\xFCstung",y:"Keine Boni \u2013 nur ein Platzhalter bis zu den Stiefeln des Schreitens."},{slot:"R\xFCstung",ic:"armor",act:"Akt 1",n:"Schuppenpanzer +1",en:"Scale Mail +1",r:"uncommon",w:"H\xE4ndler mit gestuftem Magie-R\xFCstungs-Sortiment bei Spielerstufe 4\u20136 \u2013 bei dir: Roah Moonglow (Zhentarim-Lager im Zerschmetterten Heiligtum)",y:"+1, mittlere R\xFCstung: RK 15 + GES (max. 2), Superior Material: \u22121 Hiebschaden, Nachteil auf Heimlichkeit. Mit GES 10 also RK 15 \u2013 einer mehr als der Schuppenpanzer der Rache. Deine R\xFCstung, bis der Adamant-Schienenpanzer (RK 18) aus der Grymschmiede da ist."},{slot:"R\xFCstung",ic:"armor",act:"Akt 1",n:"Luminous Armour",en:"Luminous Armour",r:"uncommon",w:"Sel\xFBnitischer Au\xDFenposten (X 176 / Y \u2212247): verschlossene, mit einer Falle gesicherte Prunktruhe hinter einer Geheimt\xFCr \u2013 per Wahrnehmungswurf finden oder vom Raum mit dem Wegpunkt hin\xFCberspringen",y:"+1, mittlere R\xFCstung: RK 15 + GES (max. 2). Radiating Shockwave: Jeder glei\xDFende Schaden, den du machst \u2013 auch G\xF6ttliches Niederstrecken, G\xF6ttliche Gunst oder der Ring des kaltherzigen Leuchtens \u2013 belegt Nicht-Verb\xFCndete im Umkreis von 3 m mit Radiating Orb (\u22121 auf Angriffe je verbleibendem Zug, sie leuchten hell). Verb\xFCndete bleiben verschont. Gleiche RK wie der Schuppenpanzer +1, aber mit Effekt \u2013 \xDCbergangsr\xFCstung bis zum Adamant-Schienenpanzer."},{slot:"Waffe",ic:"weapon",act:"Prolog",n:"Everburn Blade",en:"Everburn Blade",r:"uncommon",w:"Nautiloid (Prolog): tr\xE4gt Kommandant Zhalk am Steuer \u2013 alternativ per Befehl \u201EFallenlassen\u201C abnehmen",y:"2W6 Hieb + 1W4 Feuer, ignoriert nicht-magische Hiebresistenz. Bestes fr\xFChes Gro\xDFschwert \u2013 nur im Prolog zu holen."},{slot:"Waffe",ic:"weapon",act:"Akt 1",n:"Svartlebee's Woundseeker",en:"Svartlebee's Woundseeker",r:"uncommon",w:"Waukeens Rast: tr\xE4gt Gauntlet Yeva \u2013 lebt sie, sp\xE4ter im Kaulquappen-Zentrum (Akt 2)",y:"+1, 2W6 Hieb. Passiv: +1W4 auf Angriffe gegen Ziele, die schon Schaden genommen haben \u2013 laut Wiki f\xFCr alle Nahkampf-Waffenangriffe. Echte Alternative zum Gro\xDFschwert +1."},{slot:"Waffe",ic:"weapon",act:"Akt 3",n:"Sword of Chaos",en:"Sword of Chaos",r:"veryrare",w:"Mordtribunal: tr\xE4gt Sarevok Anchev",y:"+2, 2W6 Hieb + 1W4 nekrotisch; jeder Schadenstreffer heilt dich um 1W6. Alternative zum Riesent\xF6ter, wenn du mehr Selbstheilung willst."},{slot:"R\xFCstung",ic:"armor",act:"Akt 3",n:"Armour of Persistence",en:"Armour of Persistence",r:"veryrare",w:"Schmiede der Neun: H\xE4ndler Dammon",y:"RK 20, schwer, \u22122 auf jeden erlittenen Schaden, dauerhaft Resistance (+1W4 auf Rettungsw\xFCrfe) und Blade Ward (Resistenz gegen Wucht, Stich und Hieb). Defensiv-Alternative zur H\xF6llend\xE4mmerr\xFCstung."},{slot:"Helm",ic:"helm",act:"Akt 1",n:"Haste Helm",en:"Haste Helm",r:"rare",w:"Verfallenes Dorf: in der moosbewachsenen Truhe",y:"Zu Kampfbeginn 3 Z\xFCge Schwung: +1,5 m Bewegung pro verbleibendem Zug \u2013 schneller am Gegner. Fr\xFCher Helm, bis der Helm des Niederstreckens da ist."},{slot:"Handschuhe",ic:"gloves",act:"Akt 3",n:"Legacy of the Masters",en:"Legacy of the Masters",r:"veryrare",w:"Schmiede der Neun: H\xE4ndler Dammon",y:"+2 auf Angriff und Schaden mit Waffen, ST\xC4-Rettung +1. Damage-Alternative zu den Panzerhandschuhen, sobald deine ST\xC4 anders hoch ist."},{slot:"Stiefel",ic:"boots",act:"Akt 1",n:"Disintegrating Night Walkers",en:"Disintegrating Night Walkers",r:"story",w:"Grymschmiede: tr\xE4gt Nere",y:"Immun gegen Netz, Verstrickt und Ausrutschen; Misty Step als Bonusaktion, einmal pro kurzer Rast \u2013 bringt dich sofort an den Gegner."},{slot:"Stiefel",ic:"boots",act:"Akt 1",n:"Boots of Speed",en:"Boots of Speed",r:"rare",w:"Ebonsee-Grotte: tr\xE4gt Thulla",y:"Bonusaktion \u201EClick Heels\u201C: mehr Tempo und Bewegungsfreiheit. Laut Wiki-Bug trifft der Nachteil deine eigenen Reaktionsangriffe statt die der Gegner."},{slot:"Stiefel",ic:"boots",act:"Akt 3",n:"Helldusk Boots",en:"Helldusk Boots",r:"veryrare",w:"Wyrmfels-Festung: verschlossene Goldtruhe im obersten Stock",y:"Ignoriert schwieriges Gel\xE4nde, kann nicht verschoben werden; fehlgeschlagenen Rettungswurf per Reaktion schaffen (laut Wiki einmal pro Rast); Teleport mit 2W8 Feuer als Bonusaktion."},{slot:"Umhang",ic:"cloak",act:"Akt 2",n:"Vivacious Cloak",en:"Vivacious Cloak",r:"uncommon",w:"Gro\xDFes Mausoleum in Reithwin (Schattenverfluchte Lande): verschlossene Reisetruhe in der S\xFCdostecke (X \u2212259 / Y \u2212882), Fingerfertigkeit SG 14",y:"8 tempor\xE4re TP, wann immer du im Nahkampf einen Zauber wirkst \u2013 auch wenn er verfehlt oder das Ziel den Rettungswurf schafft. F\xFCr Droughnir mit Wrathful Smite, Magischer Waffe, Befehl oder Person festhalten mitten im Gemenge ein kostenloses Polster. Defensiv-Alternative zum Umhang des Schutzes."},{slot:"Umhang",ic:"cloak",act:"Akt 3",n:"Cloak of Displacement",en:"Cloak of Displacement",r:"rare",w:"Wyrms\xFCbergang: H\xE4ndler Entharl Danthelon (Danthelons Tanzende Axt)",y:"Zu Beginn deines Zugs haben Gegner Nachteil auf Angriffe gegen dich, bis du Schaden nimmst."},{slot:"Amulett",ic:"amulet",act:"Akt 1",n:"Amulet of Misty Step",en:"Amulet of Misty Step",r:"uncommon",w:"Entweihter Tempel unter dem Zerschmetterten Heiligtum: vergoldete Truhe in Priesterin Guts Gemach (X 386 / Y 8)",y:"Misty Step als Bonusaktion, einmal pro kurzer Rast. Fr\xFChes Amulett f\xFCr schnelles Ranlaufen."},{slot:"Amulett",ic:"amulet",act:"Akt 1",n:"Periapt of Wound Closure",en:"Periapt of Wound Closure",r:"rare",w:"Pfad zum Rosymorn-Kloster: H\xE4ndlerin Lady Esther",y:"Wirst du niedergeschlagen, stabilisierst du dich automatisch; jede Heilung auf dich heilt den Maximalwert \u2013 stark mit Schattenherz' Heilendem Wort."},{slot:"Ring",ic:"ring",act:"Akt 1",n:"Ring of Protection",en:"Ring of Protection",r:"rare",w:"Smaragdhain: Belohnung von Mol f\xFCr \u201EStehlt das heilige G\xF6tzenbild\u201C",y:"+1 RK und +1 auf alle Rettungsw\xFCrfe \u2013 die defensive Ring-Alternative."},{slot:"Ring",ic:"ring",act:"Akt 2",n:"Risky Ring",en:"Risky Ring",r:"rare",w:"Mondaufgangst\xFCrme: H\xE4ndlerin Araj Oblodra (verpasst? Sp\xE4ter im Purpurtrunk, Unterstadt)",y:"Vorteil auf alle Angriffsw\xFCrfe, Nachteil auf alle Rettungsw\xFCrfe. F\xFCr die Glaskanone fast doppelte Krit-Chance \u2013 aber gef\xE4hrlich gegen Kontrollzauber."},{slot:"Ring",ic:"ring",act:"Akt 2",n:"Killer's Sweetheart",en:"Killer's Sweetheart",r:"veryrare",w:"Shar-Pr\xFCfung: Selbstgleiche Pr\xFCfung, neben dem Kohlebecken",y:"Nach einem Kill ist dein n\xE4chster Waffenangriff ein garantierter Krit (einmal pro langer Rast) \u2013 perfekt f\xFCr einen Krit-Smite."},{slot:"Ring",ic:"ring",act:"Akt 1",n:"Crusher's Ring",en:"Crusher's Ring",r:"uncommon",w:"Goblinlager: Crusher tr\xE4gt ihn am Zeh (\xF6stlicher Hof beim Alten Runenkreis)",y:"+3 m Bewegung, stapelt mit Longstrider. Mehr Reichweite pro Zug hei\xDFt \xF6fter an den Gegner kommen, ohne Sprint \u2013 ideal f\xFCr die Glaskanone."},{slot:"Ring",ic:"ring",act:"Akt 1",n:"Spurred Band",en:"Spurred Band",r:"uncommon",w:"Fl\xFCsternde Tiefen unter dem Verfallenen Dorf: Skelett mit Rucksack (X \u2212495 / Y \u2212365)",y:"Startest du im Kampf einen Zug mit h\xF6chstens 50 % TP, bekommst du Schwung (+1,5 m Bewegung pro verbleibendem Zug) \u2013 zum R\xFCckzug oder Nachsetzen."},{slot:"Ring",ic:"ring",act:"Akt 1",n:"Bracing Band",en:"Bracing Band",r:"uncommon",w:"Grymschmiede: Belohnung von Sergeant Elenna Thrinn f\xFCr \u201EFinde die verlorenen Stiefel\u201C",y:"+1 RK bis zu deinem n\xE4chsten Zug, nachdem du einen Gegner st\xF6\xDFt (einmal pro Zug, jeder Sto\xDF z\xE4hlt). Mit ST\xC4 17 st\xF6\xDFt Droughnir gut \u2013 Gegner in Lava oder Abgr\xFCnde."},{slot:"Ring",ic:"ring",act:"Akt 1",n:"Ring of Poison Resistance",en:"Ring of Poison Resistance",r:"rare",w:"Zerschmettertes Heiligtum: Skelett im offenen Sarkophag direkt vor den Worg-Gehegen (X 338 / Y 14)",y:"Resistenz gegen Giftschaden \u2013 halbiert Gift von Spinnen und Fallen. Situativ, aber kostenlos mitzunehmen."},{slot:"Ring",ic:"ring",act:"Akt 1",n:"Ring of Mind-Shielding",en:"Ring of Mind-Shielding",r:"rare",w:"Ebonsee-Grotte: Omeluum nach der Quest \u201EHilf Omeluum, den Parasiten zu untersuchen\u201C (X 144 / Y 29)",y:"Vorteil auf Rettungsw\xFCrfe gegen Bezauberung \u2013 in Akt 1 vor allem gegen den Lockgesang der Harpyien. Eine bezauberte Glaskanone schl\xE4gt sonst die eigene Gruppe."}],Z1=[{lv:2,cls:"Paladin 2",g:"Kampf mit gro\xDFen Waffen \xB7 G\xF6ttliches Niederstrecken (Divine Smite) \xB7 Zauberwirken",p:"Vorbereiten: Befehl (Command), Donnerndes und Zorniges Niederstrecken, Schild des Glaubens (Shield of Faith), G\xF6ttliche Gunst (Divine Favour). Segnen (Bless) \xFCbernimmt Schattenherz."},{lv:3,cls:"Paladin 3 \u2013 Eidbrecher",g:"Trotziges Leid (Spiteful Suffering) \xB7 Untote kontrollieren (Control Undead) \xB7 Gr\xE4ssliches Aussehen (Dreadful Aspect) \xB7 G\xF6ttliche Gesundheit",p:"Eine Eid-Ladung pro kurzer Rast f\xFCr alle drei F\xE4higkeiten. Eidzauber immer vorbereitet: H\xF6llischer Tadel, Wunden verursachen. Vorbereiten (6): Befehl, Schild des Glaubens, G\xF6ttliche Gunst, Donnerndes und Zorniges Niederstrecken, Wunden heilen."},{lv:4,cls:"Paladin 4",g:"Talent: Meisterschaft gro\xDFer Waffen (Great Weapon Master)
