mpf & Team","Team",za],["atlas","Atlas","Atlas",fn]],zk={ausgeruestet:"Lege an, was Droughnir tr\xE4gt \u2013 wie im Inventar. Attribute, TP, RK, Angriff und Schaden werden daraus, aus Level, Weg und aktiven Effekten berechnet.",checkliste:"Alles, was du f\xFCr die Glaskanone holen und erledigen musst \u2013 nach Akt und Gebiet, Verpassbares rot markiert.",wege:"Je vier Wege zum maximalen Schaden als Eidbrecher und mit dem Eid der Rache. Oben umschalten oder alle vergleichen, einen w\xE4hlen, dann im Level-Guide Stufe f\xFCr Stufe abhaken.",ausruestung:"Droughnirs Ausr\xFCstung, Alternativen und Begleiter-Items \u2013 als Raster oder als Upgrade-Pfad pro Slot. Klick auf eine Kachel f\xFCr Fundort und Synergie.",level:"Dein gew\xE4hlter Weg als Zeitleiste. Hake jede Stufe ab, sobald du sie im Spiel genommen hast.",atlas:"Orte, H\xE4ndler, Gegner und Schritt-f\xFCr-Schritt-Anleitungen. Klick auf eine Karte \xF6ffnet Details mit Bildergalerie \u2013 eigene Screenshots l\xE4dst du direkt dort hoch.",taktik:"Drei Bereiche: die Kampf-Referenz f\xFCr den laufenden Kampf, Party & Buffs f\xFCr die Vorbereitung und Untote kontrollieren."},qm=[["all","Alle"],["miss","Verpassbar"],["item","Items"],["quest","Quests"]],Tk=["Alle","Sofort","Akt 1","Akt 2","Akt 3"],Tc=e=>e.replace(/\s*[✔✖⚠⚙]️?\s*/g," ").replace(/\s{2,}/g," ").trim(),Dc=e=>{let t=Math.floor((e-10)/2);return t>=0?"+"+t:"\u2212"+Math.abs(t)},jm=()=>{let e=location.hash.slice(1);return ir.some(t=>t[0]===e)?e:"checkliste"},Ot={get(e,t){try{let a=JSON.parse(localStorage.getItem(e));return a!=null?a:t}catch{return t}},set(e,t){try{localStorage.setItem(e,JSON.stringify(t))}catch{}}},dr=[{id:"loc-camp",n:"Lager",en:"Camp",act:0,I:Oi,d:"Dein Rastplatz. Hier warten Der Verdorrte (Umskillen, Begleiter) und nach dem Eidbruch der Eidbrecher-Ritter."},{id:"loc-ruins",n:"\xDCberwucherte Ruinen",en:"Overgrown Ruins",act:1,I:Ti,d:"Alte Kapelle nahe der Absturzstelle. Fallenraum mit feuerspeienden Drachenk\xF6pfen; darunter die Feuchte Gruft mit den ersten Untoten, die du kontrollieren kannst."},{id:"loc-grove",n:"Smaragdhain",en:"Emerald Grove",act:1,I:_i,d:"Druidenhain mit Tiefling-Fl\xFCchtlingen. H\xE4ndler Dammon und Volo, Start der Quest um Mayrina und Tantchen Ethel."},{id:"loc-owlbear",n:"Eulenb\xE4renh\xF6hle",en:"Owlbear Nest",act:1,I:Ei,tut:"tut-moondrop",d:"H\xF6hle der Eulenb\xE4rin. Hinten steht die versiegelte Sel\xFBne-Truhe mit dem Mondtropfenanh\xE4nger."},{id:"loc-ethel",n:"Ethels Versteck",en:"Auntie Ethel's Ancient Abode",act:1,I:on,tut:"tut-ethel",d:"Erreichbar \xFCber das Uferteehaus und den \xFCberwucherten Tunnel. Nur hier verhandelt Ethel um Mayrina \u2013 und gibt dir ihr Haar."},{id:"loc-goblin",n:"Goblinlager & Zerschmettertes Heiligtum",en:"Goblin Camp & Shattered Sanctum",act:1,I:$r,d:"H\xE4ndler Grat, Anf\xFChrer Dror Ragzlin (Schatzkammer mit den Handschuhen des grummelnden Verlierers) und Minthara (Stiefel des Schreitens). Geheimgang Richtung Unterreich."},{id:"loc-risen",n:"Aufgestiegene Stra\xDFe",en:"Risen Road",act:1,I:Jn,d:"Hier triffst du Anders und seine falschen Tyr-Paladine \u2013 und die Entscheidung f\xFCr oder gegen Karlach."},{id:"loc-outpost",n:"Sel\xFBnitischer Au\xDFenposten",en:"Sel\xFBnite Outpost",act:1,I:ya,d:"Ruine im Unterreich. Verschlossene vergoldete Truhe (X 163 / Y \u2212248) mit dem Helm des Niederstreckens."},{id:"loc-myconid",n:"Myconid-Kolonie",en:"Myconid Colony",act:1,I:Fi,d:"Pilzvolk im Unterreich. H\xE4ndlerin Derryth Bonecloak verkauft das \xC4tzende Band."},{id:"loc-grymforge",n:"Grymschmiede",en:"Grymforge",act:1,I:ln,tut:"tut-forge",d:"Duergar-Festung mit der Adamant-Schmiede. Auf dem Weg dorthin Korsar Greymon mit Jorgorals Gro\xDFschwert und dem Bogen der Todesfee."},{id:"loc-rosymorn",n:"Pfad zum Rosymorn-Kloster",en:"Rosymorn Monastery Trail",act:1,I:Sa,d:"Erreichbar \xFCber den Gebirgspass oder die Goblinlager-Seite. H\xE4ndlerin Lady Esther, Ghule und Todeshirte."},{id:"loc-creche",n:"Krippe Y'llek",en:"Cr\xE8che Y'llek",act:1,I:gi,d:"Githyanki-Brutst\xE4tte am Gebirgspass. In der Kammer des Inquisitors liegt der Ring des seltsamen Leiters."},{id:"loc-lastlight",n:"Letztes Licht",en:"Last Light Inn",act:2,I:bn,d:"Letzte sichere Zuflucht im Schattenfluch. Quartiermeisterin Talli und Dammon \u2013 f\xE4llt das Gasthaus, sind die H\xE4ndler weg."},{id:"loc-moonrise",n:"Mondaufgangst\xFCrme",en:"Moonrise Towers",act:2,I:$r,d:"Festung des Absolut-Kults. Im Erdgeschoss Araj Oblodra mit dem Trank der ewigen Kraft."},{id:"loc-shadowlands",n:"Schattenverfluchte Lande & Reithwin",en:"Shadow-Cursed Lands",act:2,I:ya,d:"Vom Schattenfluch verdunkeltes Land rund um Reithwin. Wer hier stirbt, kann als Untoter wieder aufstehen \u2013 Schatten und Gespenster (Level 5) sind ab deiner Stufe 6 kontrollierbar."},{id:"loc-healing",n:"Haus der Heilung",en:"House of Healing",act:2,I:Xr,d:"Verlassenes Spital in Reithwin. Untote Krankenschwestern und Malus Thorm \u2013 ab Stufe 8 kontrollierbar."},{id:"loc-gauntlet",n:"Shar-Pr\xFCfung",en:"Gauntlet of Shar",act:2,I:ya,d:"Unterirdische Tempelanlage. In der Schatzkammer neben Balthazar (T\xFCr SG 30) liegt der Ring des kaltherzigen Leuchtens."},{id:"loc-hope",n:"Haus der Hoffnung",en:"House of Hope",act:3,I:Ct,tut:"tut-archive",d:"Raphaels H\xF6llenpalast. Im Archiv die Panzerhandschuhe der H\xFCgelriesenst\xE4rke und das Amulett der gr\xF6\xDFeren Gesundheit; Raphael selbst tr\xE4gt die H\xF6llend\xE4mmerungs-R\xFCstung."},{id:"loc-wyrmway",n:"Drachenweg",en:"The Wyrmway",act:3,I:Ae,tut:"tut-wyrmway",d:"Pr\xFCfungsgruft unter der Wyrmfelsen-Festung. Vier Pr\xFCfungen, dann Ansur \u2013 und dahinter Baldurans Riesent\xF6ter und der Helm des Balduran."},{id:"loc-grief",n:"Haus der Trauer",en:"House of Grief",act:3,I:Xr,tut:"tut-mirror",d:"Shar-Tempel in der Unterstadt, Teil von Schattenherz' Quest. Nur hier funktioniert der Spiegel des Verlusts."}],Ga=[{id:"npc-withers",n:"Der Verdorrte",en:"Withers",kind:"Lager",act:0,loc:["loc-camp"],d:"Skillt f\xFCr 100 Gold um \u2013 Begleiter jederzeit, dich als Eidbrecher aber nicht. Ist immun gegen Untote kontrollieren."},{id:"npc-knight",n:"Eidbrecher-Ritter",en:"Oathbreaker Knight",kind:"Lager",act:0,loc:["loc-camp"],d:"Erscheint nach dem Eidbruch. Stellt deinen alten Eid f\xFCr 1.000 Gold wieder her oder best\xE4tigt dich als Eidbrecher. Niemals t\xF6ten \u2013 sonst gibt es f\xFCr den Rest des Spiels keinen Respec mehr."},{id:"npc-dammon",n:"Dammon",en:"Dammon",kind:"H\xE4ndler",act:1,loc:["loc-grove","loc-lastlight"],d:"Tiefling-Schmied in der Mulde des Smaragdhains. Akt 1: Jagdkurzbogen. Akt 2 im Letzten Licht: schmiedet aus Infernalem Eisen die fehlerhaften H\xF6llend\xE4mmerungs-Teile \u2013 je ein Eisen pro Teil."},{id:"npc-volo",n:"Volo",en:"Volo",kind:"H\xE4ndler",act:1,loc:["loc-grove"],d:"Barde mit kurzem Auftritt am Heiligen Teich. Verkauft Das fl\xFCsternde Versprechen f\xFCr 40 gp (Handel-Button unten links) \u2013 sp\xE4ter auch im Lager."},{id:"npc-grat",n:"Grat",en:"Grat",kind:"H\xE4ndler",act:1,loc:["loc-goblin"],d:"Goblin-H\xE4ndler im Lager (X \u221299 / Y 424). Verkauft immer das Gro\xDFschwert +1; Das fl\xFCsternde Versprechen nur, wenn du es nicht von Volo hast und solange Volo im Lager ist."},{id:"npc-derryth",n:"Derryth Bonecloak",en:"Derryth Bonecloak",kind:"H\xE4ndler",act:1,loc:["loc-myconid"],d:"H\xE4ndlerin in der Myconid-Kolonie, verkauft das \xC4tzende Band \u2013 in Akt 3 erneut."},{id:"npc-greymon",n:"Korsar Greymon",en:"Corsair Greymon",kind:"H\xE4ndler",act:1,loc:["loc-grymforge"],d:"Duergar auf dem Flo\xDF zur Grymschmiede. Tr\xE4gt Jorgorals Gro\xDFschwert und den Bogen der Todesfee, verkauft beides sp\xE4ter in der Grymschmiede. Nicht per Athletik-Dialog vom Flo\xDF sto\xDFen \u2013 sonst ist die Beute dauerhaft weg."},{id:"npc-esther",n:"Lady Esther",en:"Lady Esther",kind:"H\xE4ndler",act:1,loc:["loc-rosymorn"],d:"H\xE4ndlerin auf dem Pfad zum Rosymorn-Kloster. Verkauft die Gloves of Baneful Striking."},{id:"npc-talli",n:"Quartiermeisterin Talli",en:"Quartermaster Talli",kind:"H\xE4ndler",act:2,loc:["loc-lastlight"],d:"Verkauft den Umhang des Schutzes (200 gp) und Elixiere des Blutdursts. F\xE4llt das Letzte Licht, stirbt sie \u2013 sofort kaufen."},{id:"npc-araj",n:"Araj Oblodra",en:"Araj Oblodra",kind:"Quest",act:2,loc:["loc-moonrise"],d:"Vampir-affine Tr\xE4nkebrauerin. Lass Astarion sie bei\xDFen und du bekommst den Trank der ewigen Kraft (+2 ST\xC4 dauerhaft)."},{id:"npc-ethel",n:"Tantchen Ethel",en:"Auntie Ethel",kind:"Gegner",act:1,loc:["loc-grove","loc-ethel"],d:"Gr\xFCnes Weib in Verkleidung. Solange sie freundlich ist, verkauft sie 3\xD7 Elixier der H\xFCgelriesenst\xE4rke pro langer Rast. Unter 20 % TP feilscht sie im Versteck um ihr Leben \u2013 deine Chance auf das Haar."},{id:"npc-dror",n:"Dror Ragzlin",en:"Dror Ragzlin",kind:"Gegner",act:1,loc:["loc-goblin"],d:"Goblin-Anf\xFChrer im Heiligtum. Hinter dem Eisentor (X 298 / Y 66) liegen seine Schatzkisten mit den Handschuhen des grummelnden Verlierers."},{id:"npc-minthara",n:"Minthara",en:"Minthara",kind:"Gegner",act:1,loc:["loc-goblin"],d:"Drow-Anf\xFChrerin. Auf dem guten Pfad besiegen: Sie tr\xE4gt die Stiefel des Schreitens."},{id:"npc-anders",n:"Anders",en:"Anders",kind:"Gegner",act:1,loc:["loc-risen"],d:"Falscher Tyr-Paladin, jagt Karlach. Besiegst du ihn, geh\xF6rt das Schwert der Gerechtigkeit dir \u2013 und Karlach schlie\xDFt sich an."},{id:"npc-grym",n:"Grym",en:"Grym",kind:"Gegner",act:1,loc:["loc-grymforge"],d:"Adamant-Golem der Schmiede. Erscheint, sobald du das Lavaventil zum ersten Mal \xF6ffnest; gilt als immun gegen Klingen und Zauber. Droppt den Grymskull-Helm."},{id:"npc-malus",n:"Malus Thorm",en:"Malus Thorm",kind:"Gegner",act:2,loc:["loc-healing"],d:"Level-7-Boss ohne Immunit\xE4t gegen Untote kontrollieren \u2013 ab deiner Stufe 8 einfach \xFCbernehmen."},{id:"npc-raphael",n:"Raphael",en:"Raphael",kind:"Gegner",act:3,loc:["loc-hope"],d:"Teufel und Hausherr. Besiegst du ihn, bekommst du die H\xF6llend\xE4mmerungs-R\xFCstung."},{id:"npc-ansur",n:"Ansur",en:"Ansur",kind:"Gegner",act:3,loc:["loc-wyrmway"],d:"Bronzedrache und einstiger Gef\xE4hrte Baldurans. Droppt Baldurans Riesent\xF6ter."}],Nc=[{id:"tut-ethel",n:"Tantchen Ethels Haar",loc:"loc-ethel",steps:["Vorher Elixiere kaufen: Solange Ethel im Hain freundlich ist, verkauft sie 3\xD7 Elixier der H\xFCgelriesenst\xE4rke, aufgef\xFCllt nach jeder langen Rast oder jedem Stufenaufstieg. Sobald sie ihre Vettel-Gestalt zeigt, flieht oder im Teehaus stirbt, ist ihr Laden f\xFCr immer zu.","Den Kampf im Versteck austragen (Uferteehaus \u2192 \xFCberwucherter Tunnel). Im Teehaus verhandelt sie nie \u2013 auch nicht unter 20 % TP.","Ethel unter 20 % ihrer maximalen TP bringen und ihren Zug abwarten. Nicht verstummen lassen (Stille), nicht bewusstlos schlagen \u2013 dann kann sie nicht verhandeln. Keine Schadensfl\xE4chen (Feuer, S\xE4ure) um sie herum, die sie vor ihrem Zug t\xF6ten k\xF6nnten.","Droughnir m\xF6glichst nah an sie stellen \u2013 viele Spieler berichten, dass sie die n\xE4chststehende Figur anspricht (laut bg3.wiki nicht best\xE4tigt).","In ihrem Zug bettelt sie: SG 20 T\xE4uschen oder Einsch\xFCchtern (K\xE4mpfer und Barbaren: SG 15 Einsch\xFCchtern mit Vorteil). Erfolg = Haar plus befreite Mayrina, Ethel kommt frei.","G\xF6ttliche F\xFChrung (Guidance) vorher im Kampf wirken, nicht erst im W\xFCrfel-Dialog: Im Ehrenmodus vor Patch 7 brach ein Zauber dort die Verhandlung ab und das Haar war weg. Bardische Inspiration funktioniert immer.","Misslingt eine Probe, ist die andere gesperrt. Dann bleiben: Deal annehmen (Haar, Ethel beh\xE4lt Mayrina), Mayrina befreien oder Ethel t\xF6ten.","Haar essen und ein Attribut w\xE4hlen: +1 dauerhaft, ohne Obergrenze. Wirkt nicht auf Werte, die Items oder Elixiere fest setzen.","Eid: Jeder Deal mit Ethel bricht den Paladin-Eid. Als Eidbrecher egal \u2013 planst du die R\xFCckkehr zur Rache, das Haar vorher holen oder die Kosten einplanen."]},{id:"tut-forge",n:"Adamant-Schienenpanzer schmieden",loc:"loc-grymforge",steps:["Schienen-Gussform holen: auf einem Felsvorsprung \xFCber den Lavabecken nahe dem Wegpunkt Alte Schmiede (X \u2212593 / Y 311).","Mithrilerz holen \u2013 es gibt nur zwei: am Lavafluss s\xFCdwestlich des Wegpunkts (X \u2212645 / Y 255) und in einem Torbogen \xF6stlich des Abstiegs (X \u2212558 / Y 278).","Auf die Plattform der Schmiede (X \u2212558 / Y 230). Erz und Gussform in ihre Kammern legen \u2013 die Gussform-Kammer liegt neben dem Tiegel.","Hebel in der Mitte des Podests ziehen \u2013 der Hammer senkt sich. Die Plattform muss unten sein; der Knopf hinter dem Hebel hebt sie an, dann funktioniert die Schmiede nicht.","Lavaventil am Ofen \xF6ffnen. Achtung: Beim ersten \xD6ffnen erscheinen Grym und Magma-Mephiten.","Hammer erneut fallen lassen, dann mit dem Hebel neben der Kammer die Gussform auswerfen und die R\xFCstung aufheben. Tipp: Droughnir ist Gildenhandwerker \u2013 hebt er das erste St\xFCck selbst auf, bekommt er die Inspiration Art Endures."]},{id:"tut-moondrop",n:"Mondtropfenanh\xE4nger",loc:"loc-owlbear",steps:["In der Eulenb\xE4renh\xF6hle (X \u2212321 / Y \u2212135) hinten zur versiegelten Sel\xFBne-Truhe.","Hinter der Sel\xFBne-Statue liegt das Gebetsblatt auf dem Boden (Wahrnehmung).","Das Gebet vor der Truhe vorlesen \u2013 sie \xF6ffnet sich. Effekt des Anh\xE4ngers: bei 50 % TP oder weniger keine Gelegenheitsangriffe. Legst du ihn erst an, wenn du schon darunter bist, greift er erst nach dem n\xE4chsten Schaden oder der n\xE4chsten Heilung."]},{id:"tut-wyrmway",n:"Drachenweg & Riesent\xF6ter",loc:"loc-wyrmway",steps:["Im Westfl\xFCgel des Wyrmfelsen-Gef\xE4ngnisses beide Drachenkopf-Fackeln mit Blitzschaden treffen (Schockgriff, Hexenpfeil, Blitzpfeile). Die Flammen werden blau, die Wand dazwischen wird passierbar. Vorsicht: Angriffe k\xF6nnen Wachen alarmieren.","Pr\xFCfung der Gerechtigkeit: Zuerst den Richter-Schatten vor den Gem\xE4lden magisch entfernen (Fluch brechen auf jedes Gem\xE4lde, Verbannung oder Untote vertreiben). Dann \u201EDie Zelle\u201C auf das Pult legen \u2013 Freiheit oder Henken rufen Untote.","Pr\xFCfung der Einsicht: Die B\xFCcher lassen sich mit SG 15 Fingerfertigkeit fangen (ein Versuch pro Figur) oder mit Befehl stoppen. Die L\xF6sung: den Geist Suelto am Ende der Kammer angreifen (1 TP) \u2013 seine B\xFCcher zeigen eine grausame Ideologie.","Pr\xFCfung der Strategie: Lanzenbrett-R\xE4tsel \u2013 Schwarz in zwei Z\xFCgen mattsetzen, drei Versuche. Alternative: den schwarzen K\xF6nig mit Blitzschaden zerst\xF6ren (50 TP auf Ausgewogen). Gale kennt die L\xF6sung.","Pr\xFCfung des Mutes: Wer die Statue ber\xFChrt, tr\xE4gt die Fackel. 4 Runden \xFCberleben, nicht zu Boden gehen und den Raum nicht verlassen. Heiligtum oder ein Trank der universellen Resistenz auf dem Tr\xE4ger machen es leicht.","Danach \xF6ffnet sich das Heiligtum. Baldurans Riesent\xF6ter liegt auf Ansurs Leichnam \u2013 Ansprechen oder Pl\xFCndern startet den Kampf gegen Ansur und zwei Wasser-Myrmidonen. Den Helm des Balduran auf dem Altar im Norden kannst du seit Patch 8 nehmen, ohne Ansur zu wecken."]},{id:"tut-archive",n:"Archiv im Haus der Hoffnung",loc:"loc-hope",steps:["Im Archiv liegen die Panzerhandschuhe der H\xFCgelriesenst\xE4rke auf einem Sockel; das Amulett der gr\xF6\xDFeren Gesundheit ist im selben Raum.","Falle vor dem Nehmen entsch\xE4rfen: SG 20 Fingerfertigkeit.","Alternative: einen Gegenstand mit gleichem Gewicht auf den Sockel legen und dann die Handschuhe nehmen \u2013 so sparst du dir Wahrnehmung und Entsch\xE4rfen.","Kein Respec n\xF6tig: Handschuhe und Amulett setzen ST\xC4 und KON auch als Eidbrecher auf 23."]},{id:"tut-mirror",n:"Spiegel des Verlusts",loc:"loc-grief",steps:["Der Spiegel in der Shar-Pr\xFCfung (Akt 2) ist zerbrochen \u2013 nutzbar ist nur der im Haus der Trauer (Kreuzgang der d\xFCsteren Umarmung, Akt 3).","Spiegel identifizieren: SG 20 Religion oder SG 25 Arkane Kunde \u2013 eine Figur reicht. Alternativ die hastige Notiz in der Nachtorchideen-H\xF6hle lesen.","Jede Figur betet einmal: SG 25 Religion. Misslingt das Gebet, ist +2 f\xFCr diese Figur nie mehr m\xF6glich \u2013 vorher alle Boni auf Religion sammeln.","Erinnerungen opfern (bis zu 6, je eine pro Attribut): Jede kostet \u22122 auf das Attribut bis zur langen Rast oder bis Fluch brechen bzw. M\xE4chtige Genesung. Nach erfolgreichem Gebet etwa 60 % Chance pro Versuch auf +2 (bis max. 24), 20 % auf Patriars Erinnerung (+1 CHA).","Nach einem +2 kannst du keine weiteren Erinnerungen opfern. Jede Figur bekommt +2 nur einmal."]},{id:"tut-knight",n:"Eid gebrochen \u2013 was jetzt?",loc:"loc-camp",steps:["Nach dem Eidbruch sind deine Eid-F\xE4higkeiten gesperrt, bis du im Lager mit dem Eidbrecher-Ritter sprichst.","Eidbrecher annehmen (kostenlos) \u2013 oder den alten Eid f\xFCr 1.000 Gold wiederherstellen (danach 2.000, ab dem dritten Mal 10.000).","Als Eidbrecher: keine Grunds\xE4tze, aber kein Respec bei Der Verdorrte.","Den Ritter niemals t\xF6ten \u2013 sonst gibt es f\xFCr den Rest des Spiels keinen Respec mehr."]}],_t=Object.fromEntries(dr.map(e=>[e.id,e])),Ko=Object.fromEntries(Ga.map(e=>[e.id,e])),Vi=Object.fromEntries(Nc.map(e=>[e.id,e])),hs={a1:{loc:["loc-ruins"]},o2:{loc:["loc-ruins"]},o1:{loc:["loc-camp"],npc:["npc-knight"],tut:"tut-knight"},o11:{loc:["loc-camp"],npc:["npc-knight"],tut:"tut-knight"},o15:{loc:["loc-camp"],npc:["npc-withers"]},o4:{loc:["loc-camp"],npc:["npc-withers"]},a2:{npc:["npc-ethel"],tut:"tut-ethel"},a3:{loc:["loc-grove","loc-goblin"],npc:["npc-dammon","npc-grat"]},a4:{loc:["loc-grove"],npc:["npc-volo","npc-grat"]},a5:{loc:["loc-grove"],npc:["npc-dammon"]},a6:{},a7:{loc:["loc-grove","loc-ethel"],npc:["npc-ethel"]},a8:{loc:["loc-owlbear"],tut:"tut-moondrop"},a9:{loc:["loc-ethel"],npc:["npc-ethel"],tut:"tut-ethel"},a9b:{loc:["loc-ethel"]},a10:{loc:["loc-goblin"],npc:["npc-grat"]},a11:{loc:["loc-goblin"],npc:["npc-dror"]},a12:{loc:["loc-goblin"],npc:["npc-minthara"]},a13:{loc:["loc-outpost"]},a14:{loc:["loc-myconid"],npc:["npc-derryth"]},a15:{loc:["loc-grymforge"],npc:["npc-greymon"]},o3:{loc:["loc-grymforge"],npc:["npc-greymon"]},a16:{loc:["loc-grymforge"],npc:["npc-grym"],tut:"tut-forge"},o14:{loc:["loc-risen"],npc:["npc-anders"]},o13:{loc:["loc-creche"]},o10:{loc:["loc-rosymorn"],npc:["npc-esther"]},b1:{loc:["loc-lastlight"],npc:["npc-talli"]},b2:{loc:["loc-lastlight"]},o16:{loc:["loc-lastlight"],npc:["npc-dammon"]},b4:{loc:["loc-moonrise"],npc:["npc-araj"]},o17:{loc:["loc-gauntlet"]},o7:{loc:["loc-shadowlands"]},o6:{loc:["loc-healing"],npc:["npc-malus"]},c1:{loc:["loc-hope"],tut:"tut-archive"},c2:{loc:["loc-hope"],tut:"tut-archive"},c3:{loc:["loc-hope"],npc:["npc-raphael"]},o18:{loc:["loc-grief"],tut:"tut-mirror"},c4:{loc:["loc-wyrmway"],npc:["npc-ansur"],tut:"tut-wyrmway"},o19:{loc:["loc-wyrmway"],npc:["npc-ansur"],tut:"tut-wyrmway"}},ra={H\u00E4ndler:"#c8a86b",Gegner:"#c0562c",Quest:"#8b5cf6",Lager:"#7aa2c8",Untot:"#8fc9a8"},Vo={"s-vow-enmity":{t:"Bonusaktion",src:"Eid der Rache 3 \xB7 Eid-Ladung",r:"3 m",d:"10 Runden",rest:"Eid-Ladung l\xE4dt bei kurzer Rast",mech:"Du hast 10 Runden lang Vorteil auf alle Angriffsw\xFCrfe gegen ein Ziel.",tac:["Vor dem ersten Schlag gegen Bosse. Vorteil gleicht den GWM-Malus (\u22125) fast komplett aus \u2013 mit dem Gel\xFCbde lohnt sich \u201EAll In\u201C praktisch immer.","Vorteil verdoppelt fast deine Krit-Chance (rund 10 % statt 5 % pro Angriff) und damit die Zahl der Krit-Smites."],warn:"Paladine haben nur eine Eid-Ladung pro kurzer Rast \u2013 Gel\xFCbde, Macht des Inquisitors und Feind bannen teilen sie sich."},"s-inquisitors-might":{t:"Bonusaktion",src:"Eid der Rache 1 \xB7 Eid-Ladung",r:"9 m",d:"2 Runden",rest:"Eid-Ladung l\xE4dt bei kurzer Rast",mech:"Du oder ein Verb\xFCndeter verursacht mit Waffenangriffen zus\xE4tzlichen glei\xDFenden Schaden in H\xF6he deines CHA-Modifikators (mindestens 1). Treffer machen Gegner 1 Runde benommen \u2013 ohne Rettungswurf.",tac:"F\xFCr einen kurzen Burst-Zug mit vielen Treffern (Tatendrang, Hast, drei Angriffe auf W/R-Hexklinge). Bei l\xE4ngeren K\xE4mpfen ist das Gel\xFCbde die bessere Wahl f\xFCr die Ladung.",warn:"Glei\xDFender Schaden \u2013 gegen Gegner mit Strahlender Vergeltung (Shar-Pr\xFCfung, Haus der Trauer) nicht benutzen."},"s-abjure-enemy":{t:"Aktion",src:"Eid der Rache 3 \xB7 Eid-Ladung",mech:"Ein Gegner wird ver\xE4ngstigt: Nachteil auf Attributs- und Angriffsw\xFCrfe, er kann sich nicht bewegen.",tac:"Notbremse gegen einen gef\xE4hrlichen Nahk\xE4mpfer. F\xFCr Schaden ist das Gel\xFCbde fast immer besser."},"s-hunters-mark":{t:"Bonusaktion",src:"Eidzauber Rache 3 \xB7 Grad 1",d:"Konzentration",k:!0,mech:"Das markierte Ziel nimmt bei jedem deiner Waffentreffer 1W6 zus\xE4tzlichen Schaden. Stirbt es, versetzt du das Mal per Bonusaktion.",tac:"G\xFCnstiger Dauerschaden \u2013 je mehr Angriffe pro Zug, desto mehr bringt es.",warn:"Konzentration: vertr\xE4gt sich nicht mit Magischer Waffe, eigener Hast oder Zornigem Niederstrecken."},"s-relentless-avenger":{t:"Passiv",src:"Eid der Rache 7",mech:"Triffst du mit einem Gelegenheitsangriff, bewegst du dich im n\xE4chsten Zug 4,5 m weiter.",tac:"Kein Schaden, aber hilft beim Nachsetzen gegen Fernk\xE4mpfer und Fliehende."},"s-misty-step":{t:"Bonusaktion",src:"Eidzauber Rache 5 \xB7 Grad 2",mech:"Teleportiert dich an einen sichtbaren Punkt in Reichweite.",tac:"Immer vorbereitet: direkt an den Boss, auf erh\xF6hte Positionen oder aus der Umzingelung \u2013 die Glaskanone kommt schneller an ihr Ziel und wieder weg."},"s-hexblade-curse":{t:"Bonusaktion",src:"Hexenmeister 1 (Hexklinge)",rest:"Kurze Rast",mech:"Verflucht ein Ziel: Deine Angriffe dagegen verursachen zus\xE4tzlichen Schaden in H\xF6he deines \xDCbungsbonus und sind schon bei 19\u201320 kritisch.",tac:"Fluch und Gel\xFCbde auf denselben Boss: Vorteil plus Krit ab 19 ergibt etwa 19 % Krit-Chance pro Angriff \u2013 fast jeder zweite Zug bringt einen Krit-Smite."},"s-shadow-blade":{t:"Bonusaktion (beschw\xF6ren)",src:"Zauberer / Hexenmeister \xB7 Grad 2",d:"Bis zur langen Rast",mech:"Beschw\xF6rt ein psychisches Kurzschwert: 2W8 psychischer Schaden, hochgewirkt 3W8, h\xF6chstens 4W8 (seit Patch 8).",tac:"Kern des Sorcadin-Wegs (R3). Aus Dunkelheit heraus mit Vorteil angreifen. Der Resonanzstein (Ende Akt 2) macht Gegner in 9 m verwundbar gegen psychischen Schaden.",warn:"Keine schwere Waffe \u2013 Meisterschaft gro\xDFer Waffen gilt nicht. Konstrukte sind gegen psychischen Schaden immun."},"s-booming-blade":{t:"Aktion (Zaubertrick)",src:"Zaubertrick (seit Patch 8)",mech:"Nahkampf-Waffenangriff mit Donnerenergie: Bewegt sich das Ziel danach, nimmt es zus\xE4tzlichen Schallschaden.",tac:"Ersetzt beim Sorcadin den Standardangriff gegen Ziele, die fliehen oder sich neu positionieren wollen."},"s-divine-smite":{t:"Reaktion bei Treffer",src:"Paladin 2 \xB7 Zauberplatz ab Grad 1",r:"Nahkampf",d:"Sofort",mech:["Nach einem Nahkampftreffer opferst du einen Zauberplatz f\xFCr glei\xDFenden Zusatzschaden. Der Schaden h\xE4ngt von keinem Attribut ab \u2013 weder ST\xC4 noch CHA \u2013, sondern nur vom Grad des Platzes:","Grad 1: 2W8 \xB7 Grad 2: 3W8 \xB7 Grad 3: 4W8 \xB7 Grad 4: 5W8 \u2013 das ist die harte Obergrenze. Gegen Untote und Unholde kommt 1W8 dazu. Bei einem kritischen Treffer werden alle Smite-W\xFCrfel verdoppelt.","In BG3 sind das zwei getrennte Reaktionen: die normale l\xF6st bei Krits nicht aus, \u201EG\xF6ttliches Niederstrecken: Kritischer Treffer\u201C nur bei Krits (4W8 auf Grad 1). Beide einzeln einstellen.","ST\xC4 und CHA wirken nur indirekt: auf die Trefferchance, den Waffenschaden und (ab Stufe 7) die Aura des Hasses."],tac:"Pl\xE4tze f\xFCr Krits aufheben \u2013 gegen gel\xE4hmte Ziele (Person festhalten) ist jeder Nahkampftreffer ein Krit. Kampf mit gro\xDFen Waffen und Wilder Angreifer w\xFCrfeln Smite-W\xFCrfel in BG3 neu.",warn:["H\xF6llischer Tadel teilt sich dieselben Pl\xE4tze \u2013 dessen Reaktion ausschalten.","Strahlende Vergeltung (Radiant Retort): Die Dunklen Justiziare in der Shar-Pr\xFCfung (Akt 2) sowie die Sharraner und Viconia im Haus der Trauer (Akt 3) werfen glei\xDFenden Schaden doppelt als Energieschaden auf dich zur\xFCck. Laut bg3.wiki haben einige Justiziare die Eigenschaft erst ab Taktiker \u2013 pr\xFCfe trotzdem vor jedem Smite den Tooltip des Gegners. Ein gro\xDFer Krit-Smite kann Droughnir sonst selbst umhauen.","Im Haus der Hoffnung (Akt 3) haben Raphaels Rachs\xFCchtige Kreaturen (Cambion, Imp, Merregon) stattdessen Fl\xFCchtiger Schutz: Der erste glei\xDFende Treffer kommt doppelt als Feuerschaden zur\xFCck, danach endet der Schutz."],gear:["Helmet of Smiting"],loc:["loc-gauntlet","loc-grief","loc-hope"]},"s-control-undead":{t:"Aktion",src:"Eidbrecher 3 \xB7 Eid-Ladung",r:"6 m",d:"Bis zur langen Rast",rest:"Eid-Ladung l\xE4dt bei kurzer Rast",mech:["Ein lebender, also aktiver untoter Gegner mit niedrigerem Level als du legt einen Weisheitsrettungswurf gegen deinen Zauber-SG ab. Misslingt er, k\xE4mpft er als KI-Verb\xFCndeter f\xFCr dich.","Leichen kannst du damit nicht erwecken \u2013 daf\xFCr gibt es ab Paladin-Stufe 9 den Eidzauber Tote beleben (Animate Dead).","Heilzauber wie Wunden heilen und Handauflegen wirken nicht auf Untote. Rechne damit, dass sich dein Untoter nur \xFCber eine kurze Rast erholt."],tac:["Akt 1: Es gibt kaum Ziele \u2013 praktisch nur Gruft-Schreiber und Gruft-Krieger in der Feuchten Gruft unter den \xDCberwucherten Ruinen. Die eine Eid-Ladung ist meist besser bei Trotziges Leid (Bosse) oder Gr\xE4ssliches Aussehen (Gruppen) aufgehoben.","Ab Akt 2 lohnt es sich: Schattenverfluchte Lande, Reithwin und das Haus der Heilung mit Malus Thorm (ab Stufe 8 ein Boss-Skip) bieten viele starke Ziele.","Untote mit Waffen bevorzugen \u2013 ab Stufe 7 profitieren nur sie neben dir von der Aura des Hasses, Ghule oder Zombies mit Klauen nicht."],warn:["Gehst du zu Boden, ist der Untote endg\xFCltig weg. Teilt sich die Eid-Ladung mit Trotziges Leid und Gr\xE4ssliches Aussehen.","Die Level-Angaben gelten f\xFCr \u201EAusgewogen\u201C \u2013 auf Taktiker und Ehrenmodus k\xF6nnen Gegner h\xF6her sein."],chk:["o2","o6"],loc:["loc-ruins","loc-shadowlands","loc-healing"],npc:["npc-malus"]},"s-dreadful-aspect":{t:"Aktion",src:"Eidbrecher 3 \xB7 Eid-Ladung",r:"9 m um dich",d:"2 Runden",rest:"Eid-Ladung l\xE4dt bei kurzer Rast",mech:"Alle Feinde im Umkreis legen einen Weisheitsrettungswurf ab. Bei Misserfolg sind sie ver\xE4ngstigt: keine Bewegung, Nachteil auf Angriffe und Attributsw\xFCrfe.",tac:"Mitten in eine Gruppe laufen und z\xFCnden \u2013 danach kann niemand fliehen. Astarion mit dem Bogen der Todesfee bekommt +1W4 gegen Ver\xE4ngstigte.",gear:["Bow of the Banshee"],who:["Astarion"]},"s-spiteful-suffering":{t:"Aktion",src:"Eidbrecher 1 \xB7 Eid-Ladung",r:"3 m",d:"3 Runden",rest:"Eid-Ladung l\xE4dt bei kurzer Rast",mech:"Das Ziel legt einen Charismarettungswurf ab. Misslingt er, nimmt es jede Runde 1W4 + CHA-Mod nekrotischen Schaden, und alle Angriffe gegen es haben Vorteil. Zu Beginn jedes Zuges darf es erneut w\xFCrfeln.",tac:"Der Boss-Opener: Vorteil gleicht den GWM-Malus von \u22125 aus. Zug 1 Trotziges Leid, ab Zug 2 alles mit \u201EAll In\u201C."},"s-aura-hate":{t:"Passiv (Aura)",src:"Eidbrecher 7",r:"3 m",d:"Dauerhaft",mech:"Du und alle Unholde und Untoten in der Aura \u2013 auch feindliche \u2013 addieren deinen CHA-Modifikator zum Schaden ihrer Nahkampfwaffenangriffe.",tac:"Je mehr Treffer pro Zug, desto mehr bringt die Aura \u2013 deshalb vergleicht der Tab \u201EWege\u201C Builds mit 3 und mehr Angriffen.",warn:"Feindliche Untote und Unholde neben dir profitieren mit. Klauen-Untote ohne Waffe bekommen keinen Bonus. F\xE4llt weg, solange du bewusstlos bist.",chk:["o5"]},"s-hellish-rebuke":{t:"Reaktion",src:"Eidzauber \xB7 Grad 1",r:"Fernkampf",d:"Sofort",mech:"Wenn dich ein Feind verletzt, schl\xE4gt er Feuer zur\xFCck: 2W10 Feuerschaden, ein Geschicklichkeitsrettungswurf halbiert, +1W10 je h\xF6herem Grad.",tac:"F\xFCr eine Glaskanone kaum wert \u2013 jeder Platz geh\xF6rt in Smites.",warn:"Reaktion auf Aus stellen. Sonst l\xF6st sie bei jedem Treffer gegen dich aus und verbraucht genau die Pl\xE4tze, die du f\xFCr G\xF6ttliches Niederstrecken brauchst."},"s-inflict-wounds":{t:"Aktion",src:"Eidzauber \xB7 Grad 1",r:"Nahkampf (Ber\xFChrung)",d:"Sofort",mech:"Nahkampf-Zauberangriff mit 3W10 nekrotischem Schaden, +1W10 je h\xF6herem Grad.",tac:"Nur eine Notl\xF6sung. Ein Smite auf einen Waffentreffer bringt mit GWM und Aura fast immer mehr."},"s-animate-dead":{t:"Aktion",src:"Eidzauber Eidbrecher 9 \xB7 Grad 3",r:"Leiche in der N\xE4he",d:"Bis zur langen Rast",mech:"Erweckt eine Leiche als Skelett oder Zombie, der f\xFCr dich k\xE4mpft.",tac:"Zusammen mit Untote kontrollieren eine kleine Untoten-Truppe bis zur langen Rast \u2013 das kontrollierte Ziel z\xE4hlt nicht gegen das Limit.",warn:"Klauen-Untote bekommen keinen Bonus durch die Aura des Hasses."},"s-magic-weapon":{t:"Aktion",src:"Paladin 5 \xB7 Grad 2",r:"Ber\xFChrung (1,5 m)",d:"Bis zur langen Rast",k:!0,mech:"Die Waffe bekommt einen Verzauberungsbonus auf Angriff und Schaden; laut bg3.wiki stapelt er mit vorhandenen Verzauberungen.",tac:"Gleicht einen Teil des GWM-Malus aus und h\xE4lt als Konzentrationszauber den Ring des seltsamen Leiters (+1W4 psychisch) dauerhaft an.",warn:"Belegt deine Konzentration \u2013 Hast von Gale bleibt davon unber\xFChrt, eigene Konzentrationszauber ersetzen ihn.",gear:["Strange Conduit Ring"],chk:["o13"]},"s-divine-favour":{t:"Bonusaktion",src:"Paladin 2 \xB7 Grad 1",r:"Selbst",d:"3 Runden",k:!0,mech:"Deine Waffenangriffe verursachen 1W4 zus\xE4tzlichen glei\xDFenden Schaden.",tac:"Billiger Schadens-Boost f\xFCr kurze K\xE4mpfe und Konzentrations-Ausl\xF6ser f\xFCr den Ring des seltsamen Leiters.",warn:"Nur 3 Runden \u2013 f\xFCr lange K\xE4mpfe ist Magische Waffe besser.",gear:["Strange Conduit Ring"]},"s-hold-person":{t:"Aktion",src:"Grad 2 (Gale, Schattenherz)",r:"Fernkampf",d:"Bis zu 10 Runden",k:!0,mech:"Ein humanoides Ziel legt einen Weisheitsrettungswurf ab, sonst ist es gel\xE4hmt. Am Ende jedes seiner Z\xFCge darf es erneut w\xFCrfeln. Angriffe treffen automatisch, aus 3 m oder weniger sind sie immer kritisch.",tac:"Die Krit-Maschine: Ziel festhalten lassen, dann jeden Treffer mit dem h\xF6chsten Platz smiten \u2013 doppelte Smite-W\xFCrfel.",warn:"Bricht die Konzentration des Wirkers, ist die L\xE4hmung sofort vorbei.",gear:["Gloves of Baneful Striking"],who:["Gale","Schattenherz"]},"s-haste":{t:"Aktion",src:"Grad 3 (Gale, Zauberer 5)",r:"9 m",d:"10 Runden",k:!0,mech:"Hast: +2 RK, Vorteil auf Geschicklichkeitsrettungsw\xFCrfe, +9 m Bewegung und eine zus\xE4tzliche Aktion pro Zug.",tac:"Die zus\xE4tzliche Aktion ist ein voller Angriff mit Extra-Angriff \u2013 auf den meisten Wegen verdoppelt Hast deinen Schaden pro Zug.",warn:"Endet Hast vorzeitig, ist das Ziel einen Zug lethargisch: keine Bewegung, keine Aktionen, keine Reaktionen. Deshalb lieber Gale halten lassen. Im Ehrenmodus erlaubt die Hast-Aktion wie am Tisch nur einen einzelnen Angriff, keinen Extra-Angriff.",who:["Gale"]},"s-wrathful-smite":{t:"Waffenangriff \xB7 bei Treffer Bonusaktion",src:"Paladin \xB7 Grad 1",r:"Nahkampf",d:"Ver\xE4ngstigt 2 Runden",k:!0,mech:"Waffenangriff mit 1W6 zus\xE4tzlichem psychischem Schaden. Das Ziel legt einen Weisheitsrettungswurf ab, sonst ist es ver\xE4ngstigt.",tac:"Stapelt mit G\xF6ttlichem Niederstrecken \u2013 bei Treffer kommt zus\xE4tzlich die Smite-Abfrage.",warn:"Braucht Konzentration und ersetzt damit Magische Waffe oder G\xF6ttliche Gunst."},"s-gwm":{t:"Passiv (Talent, umschaltbar)",src:"Talent \xB7 Paladin 4",r:"Nahkampf",d:"Dauerhaft",mech:"\u201EAll In\u201C: \u22125 auf den Angriffswurf, daf\xFCr +10 Schaden mit schweren Nahkampfwaffen. Nach einem Krit oder Kill bekommst du einen Bonusangriff.",tac:"Nur mit Vorteil, Segnen oder gegen niedrige RK aktiv lassen. Gilt nur f\xFCr zweih\xE4ndig gef\xFChrte Waffen, mit denen du ge\xFCbt bist.",gear:["Gloves of the Growl
