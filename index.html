s Roter Drachenbl\xFCtiger hast du Feuerresistenz und kannst Hebel oder Truhen notfalls selbst erreichen. Alles looten.":"Only in her hideout in the overgrown tunnel \u2013 at the Riverside Teahouse she never bargains, not even below 20% HP. Bring her below 20% HP and wait for her turn. Don't silence her or knock her out. DC 20 Deception or Intimidation (Fighters and Barbarians: DC 15 Intimidation with advantage). Success = hair + Mayrina free, Ethel leaves. If one check fails, the other is locked \u2013 you can still accept the deal then. Warning for the Vengeance route: any deal with her breaks the paladin oath. Details in the guide.","\xDCberwucherte Ruinen \u2013 Feuchte Gruft":"Grat always sells the Greatsword +1. The Whispering Promise only if you don't already have it from Volo \u2013 and only while Volo is still in the Goblin Camp.","Untote kontrollieren an einem Gruft-Schreiber testen":"Dror Ragzlin's treasure crates behind the iron gate (X 298 / Y 66): DC 18 Sleight of Hand or Dror's key. Advantage on melee weapon attacks when 2+ enemies stand within 3 m of your target, +1 to STR saving throws. The treasure also holds a piece of Infernal Iron for Dammon.","Gruft-Schreiber (Entombed Scribe) sind Level 2 \u2013 auf Stufe 3 g\xFCltige Ziele. Ab Stufe 4 auch der Gruft-Krieger (Level 3). Der Untote k\xE4mpft bis zur langen Rast f\xFCr dich.":"Good path: defeat and loot Minthara (X 335 / Y 43). While concentrating you can't be knocked prone or moved, concentration spells grant Momentum, plus +1 Athletics \u2013 ideal with Crown of Madness and Haste.","Eidbrecher-Ritter: Eidbrecher best\xE4tigen":"Locked gilded chest south-west of the waypoint (X 163 / Y \u2212248). Access e.g. via the secret passage in the Shattered Sanctum. The temporary HP only last 2 turns.","Nach dem Eidbruch sind deine Eid-Ladungs-F\xE4higkeiten gesperrt, bis du im Lager mit dem Eidbrecher-Ritter (Oathbreaker Knight) sprichst. Eidbrecher werden ist kostenlos; den Eid der Rache wiederherzustellen kostet 1.000 Gold (danach 2.000, ab dem dritten Mal 10.000).":"40 gp (Honour Mode 590 gp), Derryth in Ebonlake Grotto (X \u221255 / Y \u221293). +2 acid damage per weapon hit \u2013 twice as valuable once you have Extra Attack.","Eidbrecher-Ritter niemals t\xF6ten":"+1, 2d6+1 slashing, special action Colossal Onslaught: hits everyone in a line, +proficiency bonus damage, benefits from GWM. Buy or loot it. Do NOT shove Greymon off the raft via the Athletics option in dialogue \u2013 the loot is then lost for good. If you shove him into the water during combat, his body washes up at the southern pier of the Decrepit Village.","Ist der Ritter tot, verweigert Der Verdorrte (Withers) den Respec f\xFCr den Rest des Durchgangs \u2013 auch nach einer sp\xE4teren R\xFCckkehr zum Eid.":"Rare +1 shortbow (190 gp): hits can inflict Frightened (DC 12 Wisdom, 2 turns); +1d4 to attack and damage against frightened targets. Loot it on the raft or buy it later from Greymon in the Grymforge (X \u2212120 / Y \u221295). Don't shove him off the raft via dialogue.","Schattenherz auf Dom\xE4ne des Lichts umskillen":"Splint Mould on a rock ledge at X \u2212593 / Y 311 near the Ancient Forge waypoint, plus one of the two Mithral Ores. The first time you open the lava valve, Grym appears. AC 18, immune to crits, \u22122 on all damage taken; melee attackers become Reeling.","Ihre Trickserei-Dom\xE4ne hilft dir kaum. Licht gilt in Patch-8-Guides als beste Allround-Wahl, Leben, wenn sie die einzige Heilerin ist. Sie ist kein Eidbrecher, Der Verdorrte skillt sie ganz normal um. Erstes Talent f\xFCr sie: Kriegszauberer (War Caster), damit Segnen h\xE4lt.":"Uncommon +1 greatsword, carried by Anders at the Risen Road Toll House (X 110 / Y 560). Tyr's Protection as a bonus action, once per short rest. Anders gives it to you for Karlach's death \u2013 or you take it from him if you side with Karlach (recommended, so you get Karlach as a companion).","Elixiere der H\xFCgelriesenst\xE4rke horten":"Elegant chest in the Inquisitor's Chamber of the Cr\xE8che Y'llek (about X 1360 / Y \u2212657). +1d4 psychic on weapon attacks while you concentrate on a spell \u2013 with Magic Weapon from level 5 practically permanent.","ST\xC4 21 bis zur langen Rast \u2013 bis zu den Panzerhandschuhen dein Standard-Elixier vor Bossk\xE4mpfen. Nur ein Elixier gleichzeitig aktiv.":"90 gp, north-east of the Trielta Crags waypoint (X \u221243 / Y \u2212129). Late Act 1. After every weapon hit \u22121d4 to the target's saving throw against your next spell \u2013 according to bg3.wiki a bug even applies it to all saving throws for the duration.","Kein Respec mehr bei Der Verdorrte":"200 gp (Honour Mode 310 gp). +1 AC, +1 to all saving throws. If the inn falls, Talli dies \u2013 buy it right away.","Withers skillt Eidbrecher nicht um. Stufenaufstiege bewusst planen \u2013 Klasse hinzuf\xFCgen beim Aufstieg geht weiterhin normal. Umskillen nur nach Wiederherstellung des Eides (1.000 Gold).":"Talk to Araj Oblodra on the ground floor and persuade Astarion to bite her. Do it before you storm the towers. +2 STR permanently, even above 20 \u2013 but it does nothing while an elixir or the Gauntlets set STR to a fixed value.","ST\xC4-17-Entscheidung treffen":"Vault door north of Balthazar's antechamber (X \u2212822 / Y \u2212759): DC 30 Sleight of Hand, no key \u2013 alternatively the spell Knock. The chest on the far right holds the ring. +2 radiant against brightly lit targets \u2013 on every damage instance.","ST\xC4 17 behalten und mit Tantchen Ethels Haar (Auntie Ethel's Hair) vor Stufe 4 auf 18 bringen. Der alte Plan B (Umskillen bei Der Verdorrte) geht als Eidbrecher nicht mehr.":"Defeat Raphael. AC 21, flight without concentration, fire resistance, \u22123 damage from all sources, automatic proficiency. The matching Helldusk Boots are in a locked gilded chest at the top of Wyrm's Rock Fortress \u2013 take them before Gortash's coronation, or he and the Steel Watchers there turn hostile.","Gro\xDFschwert +1 (Greatsword +1) kaufen \u2013 \xDCbergangswaffe":"Only the mirror in the House of Grief (Cloister of Sombre Embrace) works, the one in the Gauntlet of Shar is broken. First identify it: DC 20 Religion or DC 25 Arcana (one character is enough). Then each character prays once: DC 25 Religion \u2013 if that fails, they can never get +2. Then sacrifice memories (each \u22122 to an ability until long rest): with the prayer about a 60% chance per attempt for +2 (up to 24). More in the guide.","Ersatz f\xFCr die verpasste Immergl\xFCh-Klinge (Everburn Blade). Bei Dammon oft im Sortiment, bei Grat im Goblinlager garantiert. Rund 85 gp Basispreis. Alternative: Blutige Gro\xDFaxt (Blooded Greataxe).":"Legendary, +3. Hit both dragon-head torches with lightning damage, pass four trials. The sword lies on Ansur's body \u2013 talking to him or looting starts the fight against Ansur and two Water Myrmidons. Passive: the STR damage is doubled, advantage against Large and bigger targets \u2013 your endgame weapon.","Das fl\xFCsternde Versprechen (The Whispering Promise) bei Volo":"On the altar in the north of the cave next to Ansur (X 636 / Y \u2212964). Since Patch 8 you can take it without waking Ansur. Heals 2 HP per turn in combat, +1 AC and saving throws, no crits against you, immune to Stunned.","Rund 84 gp. Volo verschwindet nach seinem Auftritt im Hain; Fallback ist Grat im Goblinlager. An Schattenherz geben.":"Guaranteed at Grat (Goblin Camp), randomly at other traders with magic melee weapons","Jagdkurzbogen (Hunting Shortbow) f\xFCr Astarion":"+1, Colossal Onslaught hits everyone in a line (+proficiency bonus damage, benefits from GWM). Lasts until Act 3.","Bei Dammon (laut Nizar GG). \xDCbergangsbogen f\xFCr Astarion, bis der Bogen der Todesfee da ist.":"Anders, Risen Road Toll House \u2013 defeat him (Karlach's side) or as a reward","Smaragdhain \u2192 Uferteehaus":"AC 18, crit immunity, \u22122 on all damage taken \u2013 perfect for a melee fighter in the thick of it.","Quest \u201ERettet Mayrina\u201C (Tantchen Ethel) starten":"AC 21, flight without concentration, automatic proficiency, \u22123 damage from all sources. You already have fire resistance as a Red Dragonborn \u2013 for the glass cannon, AC and damage reduction count.","Ethel im Hain ansprechen; die Spur f\xFChrt zum Uferteehaus (Riverside Teahouse).":"Temp HP equal to your CHA modifier (2 turns) when a smite spell applies a condition; +1 to CON saving throws (concentration for Crown of Madness/Haste).","Mondtropfenanh\xE4nger (Moondrop Pendant)":"Advantage when 2+ enemies stand within 3 m of your target \u2013 offsets the GWM penalty and nearly doubles your crit chance.","Die Sel\xFBne-Truhe ist versiegelt: Gebetsblatt hinter der Sel\xFBne-Statue finden (Wahrnehmung) und davor vorlesen. Effekt: unter 50 % TP keine Gelegenheitsangriffe.":"Volo (Sacred Pool, later at camp) or Grat (Goblin Camp)","Tantchen Ethels Haar \u2192 +1 ST\xC4":"When Shadowheart heals you, you get +1d4 to attacks and saving throws for 2 turns \u2013 like Bless, but it doesn't stack with it.","Nur im Versteck (nicht im Teehaus) unter etwa 20 % TP bringen und warten \u2013 sie feilscht um ihr Leben. Nicht verstummen lassen! Mayrina kannst du per \xDCberzeugen trotzdem retten. Das Haar kann Werte \xFCber 20 heben. ST\xC4 oder CHA? Siehe Tab \u201EWege\u201C \u2013 kurz: ST\xC4 bringt dir in Akt 1\u20132 sofort +1 Treffer und Schaden, CHA erst mit weiteren ungeraden Boni.":"+1, advantage against monstrosities, Hunter's Mark once per long rest. Stopgap bow until the Bow of the Banshee.","Trank \u201EGebrochene Versprechen\u201C (Broken Promises) NICHT trinken":"+1, hits can inflict Frightened (DC 12 Wisdom, 2 turns); +1d4 to attack and damage against frightened targets \u2013 perfect after your Dreadful Aspect.","Hexentrank aus Ethels Werkstatt: +2 ST\xC4 bis zur langen Rast, danach \u22121 ST\xC4 dauerhaft. Verkaufen oder liegen lassen.":"Lady Esther, Rosymorn Monastery Trail (90 gp, late Act 1)",Goblinlager:'+10 damage per hit at \u22125 to hit, plus a bonus attack after a crit or kill with a melee weapon attack. "All In" only with advantage or Bless.',"Grat: Gro\xDFschwert +1 / Das fl\xFCsternde Versprechen (Fallback)":"The manoeuvres Riposte and Disarming Attack complement Trip Attack \u2013 Battle Master from level 3","Falls im Hain verpasst.":"STR 21 until long rest. Only one elixir at a time. Auntie Ethel sells 3 per long rest while she's friendly.","Zerschmettertes Heiligtum":"On a kill (once per turn) an extra action and 5 temporary HP. Knocking out doesn't count.","Handschuhe des grummelnden Verlierers (Gloves of the Growling Underdog)":"Your standard elixir once you have the Gauntlets \u2013 on Balanced the action gets the full Extra Attack, in Honour Mode only one attack.","Dror Ragzlins Schatzkisten hinter dem Eisentor (X 298 / Y 66): SG 18 Fingerfertigkeit oder Drors Schl\xFCssel. Vorteil auf Angriffe, wenn 2+ Gegner nahe dem Ziel stehen.":"You sleep for 2 turns, then get the effect of a short rest and all level 1 and 2 spell slots back. If you're woken, both are lost.","Stiefel des Schreitens (Boots of Striding) \u2013 Minthara":"Smite refill between two fights \u2013 not in the middle of combat.","Guter Pfad: Minthara besiegen und pl\xFCndern. W\xE4hrend Konzentration nicht umsto\xDFbar, Konzentrationszauber geben Schwung \u2013 ideal mit Krone des Wahnsinns und Hast.":"+2 to attack rolls with the coated weapon for 10 turns.","Sel\xFBnitischer Au\xDFenposten (Unterreich)":"10 temporary HP and +1d4 to attack rolls and saving throws until long rest \u2013 it even stacks with Bless.","Helm des Niederstreckens (Helmet of Smiting)":"Alternative \u2013 a new elixir ends the d4 bonus, the HP stay.","Verschlossene vergoldete Truhe (X 163 / Y \u2212248). Zugang z. B. \xFCber den Geheimgang im Zerschmetterten Heiligtum.":"Level 2 \u2013 the first targets at level 3. Spellcasters without a weapon (Ray of Frost, Fog Cloud, Silence) \u2013 so no aura bonus, but useful control.","Unterreich \u2013 Myconid-Kolonie":"Rosymorn Monastery Trail, Moonrise Towers","\xC4tzendes Band (Caustic Band) bei Derryth Bonecloak":"According to bg3.wiki, NPCs who die in the Shadow Curse rise again as Shadow-Cursed undead after a turn or two and can then be controlled. Whether this works with the Strange Ox (level 6 in Act 2) is not confirmed \u2013 more of an exploit.","+2 S\xE4ureschaden pro Waffentreffer \u2013 doppelt wertvoll ab Zus\xE4tzlicher Angriff. Derryth verkauft es in Akt 3 erneut.":"Tiefling smith in the Hollow of the Emerald Grove. Act 1: Hunting Shortbow. Act 2 at Last Light: forges the flawed Helldusk pieces from Infernal Iron \u2013 one iron per piece.","Boot zur Grymschmiede":"Bard with a short performance at the Sacred Pool. Sells The Whispering Promise for 40 gp (trade button at the bottom left) \u2013 later at camp too.","Jorgorals Gro\xDFschwert (Jorgoral's Greatsword) \u2013 Korsar Greymon":"Goblin trader in the camp (X \u221299 / Y 424). Always sells the Greatsword +1; The Whispering Promise only if you don't have it from Volo and while Volo is in the camp.","+1, 2W6+1 Hieb, Spezialaktion Kolossaler Ansturm (Colossal Onslaught). Kaufen oder pl\xFCndern \u2013 Greymon NICHT ins Wasser sto\xDFen, sonst ist die Beute weg.":"Duergar on the raft to the Grymforge. Carries Jorgoral's Greatsword and the Bow of the Banshee, sells both later in the Grymforge. Don't shove him off the raft via the Athletics dialogue \u2013 or the loot is lost for good.","Bogen der Todesfee (Bow of the Banshee) f\xFCr Astarion \u2013 Korsar Greymon":"Sells the Cloak of Protection (200 gp) and Elixirs of Bloodlust. If Last Light falls, she dies \u2013 buy right away.","Seltener +1-Kurzbogen: kann bei Treffer Ver\xE4ngstigt ausl\xF6sen und gibt +1W4 auf Angriff und Schaden gegen ver\xE4ngstigte Ziele. Auf dem Boot pl\xFCndern oder sp\xE4ter bei Greymon in der Grymschmiede kaufen.":"Green hag in disguise. While she's friendly she sells 3\xD7 Elixir of Hill Giant Strength per long rest. Below 20% HP she bargains for her life in her hideout \u2013 your chance at the hair.","Adamant-Schienenpanzer (Adamantine Splint Armour) schmieden":"Buy elixirs first: while Ethel is friendly in the Grove she sells 3\xD7 Elixir of Hill Giant Strength, restocked after every long rest or level-up. As soon as she reveals her hag form, flees or dies at the teahouse, her shop is closed for good.","Schienen-Gussform (Splint Mould) bei X \u2212593 / Y 311 nahe Wegpunkt Alte Schmiede, dazu Mithrilerz. Danach Grym besiegen. RK 18, immun gegen Krits.":"Fight in her hideout (Riverside Teahouse \u2192 overgrown tunnel). At the teahouse she never bargains \u2013 not even below 20% HP.",Gebirgspass:"Bring Ethel below 20% of her maximum HP and wait for her turn. Don't silence her (Silence) or knock her out \u2013 then she can't bargain. No damaging surfaces (fire, acid) around her that could kill her before her turn.","Lae'zels Quest / Rosymorn-Kloster (optional)":"Place Droughnir as close to her as possible \u2013 many players report she addresses the nearest character (not confirmed by bg3.wiki).","H\xE4ndler und Loot im Pass mitnehmen.":"On her turn she begs: DC 20 Deception or Intimidation (Fighters and Barbarians: DC 15 Intimidation with advantage). Success = hair plus freed Mayrina, Ethel goes free.","Schwert der Gerechtigkeit (Sword of Justice) \u2013 Anders":"Cast Guidance beforehand in combat, not in the dice dialogue: in Honour Mode before Patch 7 a spell there broke off the bargain and the hair was lost. Bardic Inspiration always works.","Ungew\xF6hnliches +1-Gro\xDFschwert mit dem Zauber Tyrs Schutz. Anders gibt es dir f\xFCr Karlachs Kopf \u2013 oder du nimmst es ihm ab, wenn du dich auf Karlachs Seite stellst und ihn besiegst (empfohlen, so bekommst du Karlach als Gef\xE4hrtin).":"If one check fails, the other is locked. Then you're left with: accept the deal (hair, Ethel keeps Mayrina), free Mayrina or kill Ethel.","Gebirgspass \u2013 Krippe Y'llek":"Eat the hair and choose an ability: +1 permanently, uncapped. Doesn't affect scores that items or elixirs set to a fixed value.","Ring des seltsamen Leiters (Strange Conduit Ring)":"Oath: any deal with Ethel breaks the paladin oath. Irrelevant as an Oathbreaker \u2013 if you plan to return to Vengeance, get the hair first or budget the cost.","Truhe in der Kammer des Inquisitors in der Krippe Y'llek. +1W4 psychisch auf Waffenangriffe, solange du dich auf einen Zauber konzentrierst \u2013 mit Magische Waffe ab Stufe 5 praktisch dauerhaft.":"Get the Splint Mould: on a rock ledge above the lava pools near the Ancient Forge waypoint (X \u2212593 / Y 311).","Gebirgspass \u2013 Pfad zum Rosymorn-Kloster":"Onto the forge platform (X \u2212558 / Y 230). Put the ore and mould into their chambers \u2013 the mould chamber is next to the crucible.","Gloves of Baneful Striking bei Lady Esther":"Pull the lever in the middle of the dais \u2013 the hammer lowers. The platform must be down; the button behind the lever raises it, and then the forge doesn't work.","Ungew\xF6hnlich, sp\xE4tes Akt 1. Erreichbar \xFCber den Gebirgspass oder von der Goblinlager-Seite. Nach jedem Waffentreffer \u22121W4 auf den Rettungswurf des Ziels gegen deinen n\xE4chsten Zauber.":"Drop the hammer again, then eject the mould with the lever next to the chamber and pick up the armour. Tip: Droughnir is a Guild Artisan \u2013 if he picks up the first piece himself, he gets the inspiration Art Endures.","Point of no Return":"Go to the sealed Sel\xFBne chest in the back of the Owlbear Nest (X \u2212321 / Y \u2212135).","Vor Akt 2: Akt-1-Restliste pr\xFCfen":"The prayer page lies on the ground behind the Sel\xFBne statue (Perception).","Ethels Haar, Helm (Au\xDFenposten), Adamant-R\xFCstung, Jorgoral, H\xE4ndlerk\xE4ufe. Nach dem \xDCbergang ins Schattenverfluchte Land kommst du nicht zur\xFCck.":"Read the prayer aloud in front of the chest \u2013 it opens. Pendant effect: at 50% HP or less no opportunity attacks. If you put it on while already below that, it only kicks in after the next damage or healing.","Letztes Licht (Last Light Inn)":"In the west wing of the Wyrm's Rock prison, hit both dragon-head torches with lightning damage (Shocking Grasp, Witch Bolt, Lightning Arrows). The flames turn blue and the wall between them becomes passable. Careful: attacks can alert guards.","Umhang des Schutzes (Cloak of Protection) \u2013 Quartiermeisterin Talli":'Trial of Justice: first remove the Judge shadow in front of the paintings with magic (Remove Curse on each painting, Banishment or Turn Undead). Then place "The Cell" on the bookstand \u2013 Freedom or The Hanging summon undead.',"+1 RK, +1 auf alle Rettungsw\xFCrfe. F\xE4llt das Gasthaus, stirbt Talli \u2013 sofort kaufen.":"Trial of Insight: the books can be caught with DC 15 Sleight of Hand (one attempt per character) or stopped with Command. The solution: attack the ghost Suelto at the end of the chamber (1 HP) \u2013 his books reveal a cruel ideology.","Fehlerhafte H\xF6llend\xE4mmerungs-Handschuhe (Flawed Helldusk Gloves) bei Dammon":"Trial of Strategy: lanceboard puzzle \u2013 checkmate black in two moves, three attempts. Alternative: destroy the black king with lightning damage (50 HP on Balanced). Gale knows the solution.","Dammon schmiedet aus Infernalem Eisen in fester Reihenfolge: erst R\xFCstung, dann Helm, dann Handschuhe \u2013 du brauchst also drei St\xFCck. +1W4 Feuer auf jeden Waffenangriff.":"Trial of Courage: whoever touches the statue carries the torch. Survive 4 turns, don't go down and don't leave the room. Sanctuary or a Potion of Universal Resistance on the carrier makes it easy.","Gasthaus und Isobel sch\xFCtzen":"Then the sanctum opens. Balduran's Giantslayer lies on Ansur's body \u2013 talking to him or looting starts the fight against Ansur and two Water Myrmidons. Since Patch 8 you can take the Helm of Balduran from the altar in the north without waking Ansur.","Sichert H\xE4ndler und Story-Pfad.":"The mirror in the Gauntlet of Shar (Act 2) is broken \u2013 only the one in the House of Grief (Cloister of Sombre Embrace, Act 3) is usable.","Level 5":"Identify the mirror: DC 20 Religion or DC 25 Arcana \u2013 one character is enough. Alternatively read the hastily written note in the Night Orchid cave.","Zus\xE4tzlicher Angriff + Magische Waffe einsatzbereit":"Each character prays once: DC 25 Religion. If the prayer fails, +2 is never possible for that character \u2013 gather every Religion bonus beforehand.","Neue Eidzauber: Krone des Wahnsinns (Crown of Madness) und Dunkelheit (Darkness). Magische Waffe (Magic Weapon) vorbereiten. Gale lernt Hast (Haste) und castet sie auf Droughnir; Person festhalten \xFCbernimmt ebenfalls Gale.":"Sacrifice memories (up to 6, one per ability): each costs \u22122 to that ability until long rest or until Remove Curse or Greater Restoration. After a successful prayer about a 60% chance per attempt for +2 (up to 24), 20% for Patriar's Memory (+1 CHA).","Schattenverfluchte Lande":`In BG3 these are two separate reactions: the normal one doesn't trigger on crits, "Divine Smite: Critical Hit" only on crits (4d8 at level 1). Set both individually.`,"Ab Stufe 6: Schatten und Gespenster kontrollieren":"A humanoid target makes a Wisdom saving throw or is paralysed. It may reroll at the end of each of its turns. Attacks hit automatically, and from 3 m or less they are always critical.","Schatten und Gespenster (Wraiths) sind Level 5. Bonus: Wer im Schattenfluch stirbt, steht nach ein, zwei Runden als Untoter wieder auf und l\xE4sst sich dann kontrollieren.":"If Haste ends early, the target is lethargic for a turn: no movement, no actions, no reactions. That's why Gale should hold it. In Honour Mode the Haste action only allows a single attack, as on the tabletop, no Extra Attack.","Trank der ewigen Kraft (Potion of Everlasting Vigour): +2 ST\xC4 dauerhaft":"Weapon attack \xB7 bonus action on hit","Araj Oblodra im Erdgeschoss ansprechen und Astarion \xFCberreden, sie zu bei\xDFen. Erledigen, bevor du die T\xFCrme st\xFCrmst.":"Only keep it on with advantage, Bless or against low AC. Only applies to two-handed weapons you're proficient with.","Shar-Pr\xFCfung (Gauntlet of Shar)":"Smite refill between two fights without a rest \u2013 in combat any hit wakes you and the potion is wasted.","Ring des kaltherzigen Leuchtens (Callous Glow Ring)":"Callous Glow Ring","Prunktruhe ganz rechts in der Schatzkammer neben Balthazar; die T\xFCr hat SG 30 Fingerfertigkeit. +2 glei\xDFend gegen beleuchtete Ziele \u2013 bei jeder Schadensinstanz.":"Ornate chest on the far right in the treasury next to Balthazar; the door is DC 30 Sleight of Hand. +2 radiant against illuminated targets \u2013 on every damage instance.","Level 7 \u2013 vor dem Haus der Heilung":"Level 7 \u2013 before the House of Healing","Aura des Hasses aktivieren":"Activate Aura of Hate","+CHA-Mod Schaden auf Nahkampfwaffenangriffe f\xFCr dich und alle Unholde und Untoten in 3 m \u2013 auch feindliche. Einmal anklicken, danach bleibt sie aktiv. Feindliche Untote neben dir zuerst t\xF6ten.":"+CHA modifier damage on melee weapon attacks for you and all fiends and undead within 3 m \u2013 enemies too. Click it once, then it stays active. Kill enemy undead next to you first.","Ab Stufe 8: Malus Thorm kontrollieren":"From level 8: control Malus Thorm","Malus Thorm ist Level 7 und \u2013 anders als Balthazar und die anderen Thorms \u2013 nicht immun. So umgehst du den Bosskampf gro\xDFteils. Die untoten Krankenschwestern (Level 6) gehen schon ab Stufe 7.":"Malus Thorm is level 7 and \u2013 unlike Balthazar and the other Thorms \u2013 not immune. This way you mostly skip the boss fight. The undead nurses (level 6) already work from level 7.","Level 6":"Level 6","Aura des Schutzes aktiv \u2013 Gruppe eng halten":"Aura of Protection active \u2013 keep the party close","+CHA-Mod auf Rettungsw\xFCrfe f\xFCr alle Verb\xFCndeten in 3 m.":"+CHA modifier on saving throws for all allies within 3 m.","Haus der Hoffnung \u2013 Archiv":"House of Hope \u2013 Archive","Panzerhandschuhe der H\xFCgelriesenst\xE4rke (Gauntlets of Hill Giant Strength)":"Gauntlets of Hill Giant Strength","Setzen ST\xC4 auf 23. Sockelfalle: SG 20 Fingerfertigkeit. Kein Respec n\xF6tig \u2013 dein investierter ST\xC4-Wert ist dann einfach \xFCbersch\xFCssig.":"Set STR to 23. Pedestal trap: DC 20 Sleight of Hand. No respec needed \u2013 your invested STR is then simply surplus.","Amulett der gr\xF6\xDFeren Gesundheit (Amulet of Greater Health)":"Amulet of Greater Health","Setzt KON auf 23 \u2013 im gleichen Raum wie die Panzerhandschuhe.":"Sets CON to 23 \u2013 in the same room as the Gauntlets.","H\xF6llend\xE4mmerungs-R\xFCstung (Helldusk Armour)":"Helldusk Armour","Raphael besiegen. RK 21, Fliegen ohne Konzentration, Feuerresistenz (f\xFCr dich doppelt). Die passenden Stiefel tr\xE4gt Gortash (Wyrmfels).":"Defeat Raphael. AC 21, flight without concentration, fire resistance (doubled up for you). The matching boots are worn by Gortash (Wyrm's Rock).","Unterstadt \u2013 Haus der Trauer":"Lower City \u2013 House of Grief","Spiegel des Verlusts (Mirror of Loss): +2 CHA":"Mirror of Loss: +2 CHA","Nur der Spiegel im Haus der Trauer (Schattenherz' Quest) funktioniert, der in der Shar-Pr\xFCfung ist zerbrochen. SG 25 Arkane Kunde und SG 20 Religion, dann eine Erinnerung opfern: \u22122 auf ein unwichtiges Attribut (mit Fluch brechen entfernbar), +2 dauerhaft auf CHA.":"Only the mirror in the House of Grief (Shadowheart's quest) works, the one in the Gauntlet of Shar is broken. DC 25 Arcana and DC 20 Religion, then sacrifice a memory: \u22122 on an unimportant ability (removable with Remove Curse), +2 permanently on CHA.","Drachenweg unter Wyrmfels":"Wyrmway beneath Wyrm's Rock","Baldurans Riesent\xF6ter (Balduran's Giantslayer)":"Balduran's Giantslayer","Legend\xE4r, +3. Beide Drachenkopf-Fackeln mit Blitzschaden treffen, vier Pr\xFCfungen bestehen, Ansur besiegen. Die Passive addiert deinen ST\xC4-Modifikator ein zweites Mal, Vorteil gegen gro\xDFe Ziele \u2013 deine Endwaffe.":"Legendary, +3. Hit both dragon-head torches with lightning damage, pass four trials, defeat Ansur. The passive adds your STR modifier a second time, advantage against large targets \u2013 your endgame weapon.","Helm des Balduran (Helm of Balduran)":"Helm of Balduran","Auf dem Altar hinter Ansur. Heilt 2 TP pro Zug \u2013 kleine Dauer-Regeneration f\xFCr die Glaskanone.":"On the altar behind Ansur. Heals 2 HP per turn \u2013 small permanent regeneration for the glass cannon.","Handschuhe und Amulett anlegen \u2013 ohne Respec":"Equip Gauntlets and Amulet \u2013 no respec","Als Eidbrecher skillt Der Verdorrte nicht um. Panzerhandschuhe (ST\xC4 23) und Amulett (KON 23) wirken trotzdem voll; CHA hebst du per Talent auf 18.":"As an Oathbreaker, Withers won't respec you. Gauntlets (STR 23) and Amulet (CON 23) still work fully; raise CHA to 18 with a feat.",Vorrat:"Supplies","Elixiere der H\xFCgelriesenst\xE4rke (ST\xC4 21) f\xFCr Bosse":"Elixirs of Hill Giant Strength (STR 21) for bosses","Bis die Handschuhe da sind, je ein Elixier pro Bosskampf.":"Until you have the Gauntlets, one elixir per boss fight.","Akt 1 \xB7 Ruinen \u2192 Smaragdhain \u2192 Goblinlager \u2192 Unterreich \u2192 Grymschmiede \u2192 Gebirgspass":"Act 1 \xB7 Ruins \u2192 Emerald Grove \u2192 Goblin Camp \u2192 Underdark \u2192 Grymforge \u2192 Mountain Pass","Akt 2 \xB7 Schattenverfluchtes Land":"Act 2 \xB7 Shadow-Cursed Lands","Akt 3 \xB7 Baldurs Tor":"Act 3 \xB7 Baldur's Gate",Waffe:"Weapon",Sofort:"Immediately","Dammon (Smaragdhain) oder garantiert bei Grat (Goblinlager)":"Dammon (Emerald Grove) or guaranteed at Grat (Goblin Camp)","+1 Treffer und Schaden; 2W6 profitiert maximal von Kampf mit gro\xDFen Waffen. Ersatz f\xFCr die verpasste Immergl\xFCh-Klinge.":"+1 to hit and damage; 2d6 benefits most from Great Weapon Fighting. Replacement for the missed Everburn Blade.","Akt 1":"Act 1","Korsar Greymon \u2013 Boot zur Grymschmiede (nicht ins Wasser sto\xDFen)":"Corsair Greymon \u2013 boat to the Grymforge (don't push him into the water)","+1, Kolossaler Ansturm trifft alle in einer Linie. H\xE4lt bis Akt 3.":"+1, Colossal Onslaught hits everyone in a line. Lasts until Act 3.","Anders, Aufgestiegene Stra\xDFe \u2013 besiegen (Karlachs Seite) oder als Belohnung":"Anders, Risen Road \u2013 defeat him (Karlach's side) or as a reward","+1-Gro\xDFschwert mit dem Zauber Tyrs Schutz. Gleichwertige Alternative zum Gro\xDFschwert +1, falls du Grat und Dammon verpasst.":"+1 greatsword with the spell Tyr's Protection. An equal alternative to the Greatsword +1 if you miss Grat and Dammon.","Akt 3":"Act 3","Drache Ansur, Drachenweg unter Wyrmfels (Fackeln mit Blitz treffen, 4 Pr\xFCfungen)":"Dragon Ansur, Wyrmway beneath Wyrm's Rock (hit torches with lightning, 4 trials)","+3. Die Riesent\xF6ter-Passive verdoppelt nicht den Angriffs-Modifikator, sondern addiert deinen ST\xC4-Modifikator einmal pauschal: ungebunden 1\xD7 ST\xC4 + 1\xD7 ST\xC4 (mit ST\xC4 23 also +12). Als Paktwaffe gebunden: 1\xD7 CHA + 1\xD7 ST\xC4. Dazu Vorteil gegen gro\xDFe Ziele und Riesengestalt 1\xD7 pro kurzer Rast.":"+3. The Giantslayer passive does not double the attack modifier, it adds your STR modifier once as a flat bonus: unbound 1\xD7 STR + 1\xD7 STR (so +12 with STR 23). Bound as a pact weapon: 1\xD7 CHA + 1\xD7 STR. Plus advantage against large targets and Giant Form once per short rest.",R\u00FCstung:"Armour","Adamantschmiede, Grymschmiede (Schienen-Gussform + Mithrilerz)":"Adamantine Forge, Grymforge (Splint Mould + Mithral Ore)","RK 18, Krit-Immunit\xE4t \u2013 perfekt f\xFCr einen Nahk\xE4mpfer mitten im Gedr\xE4nge.":"AC 18, crit immunity \u2013 perfect for a melee fighter in the thick of it.","Raphael besiegen, Haus der Hoffnung":"Defeat Raphael, House of Hope","RK 21, Fliegen ohne Konzentration, automatische \xDCbung. Die Feuerresistenz hast du als Roter Drachenbl\xFCtiger schon \u2013 f\xFCr die Glaskanone z\xE4hlt die RK.":"AC 21, flight without concentration, automatic proficiency. You already have fire resistance as a Red Dragonborn \u2013 for the glass cannon the AC is what counts.",Helm:"Helmet","Sel\xFBnitischer Au\xDFenposten, vergoldete Truhe (X 163 / Y \u2212248)":"Sel\xFBnite Outpost, gilded chest (X 163 / Y \u2212248)","Temp-TP in H\xF6he des CHA-Mods, wenn ein Smite-Zauber einen Zustand ausl\xF6st; +1 auf KON-Rettungsw\xFCrfe (Konzentration f\xFCr Krone des Wahnsinns/Hast).":"Temp HP equal to your CHA modifier when a smite spell applies a condition; +1 to CON saving throws (concentration for Crown of Madness/Haste).",Handschuhe:"Gloves","Zerschmettertes Heiligtum, Drors Schatz (SG 18 oder Schl\xFCssel)":"Shattered Sanctum, Dror's treasure (DC 18 or key)","Gratis-Vorteil gleicht den GWM-Malus aus und verdoppelt fast deine Krit-Chance.":"Free advantage offsets the GWM penalty and nearly doubles your crit chance.","Akt 2":"Act 2","Dammon, Letztes Licht \u2013 aus Infernalem Eisen (drittes geschmiedetes Teil)":"Dammon, Last Light Inn \u2013 from Infernal Iron (third forged piece)","+1W4 Feuer auf jeden Waffenangriff, ST\xC4-Rettungsw\xFCrfe +1. Bei 3\u20136 Treffern pro Zug sp\xFCrbar; Teufel und D\xE4monen sind oft feuerresistent.":"+1d4 fire on every weapon attack, STR saving throws +1. Noticeable at 3\u20136 hits per turn; devils and demons are often fire resistant.","Haus der Hoffnung, Archiv (Falle SG 20)":"House of Hope, Archive (trap DC 20)","ST\xC4 23 \u2013 als Eidbrecher ohne Respec, der investierte ST\xC4-Wert ist dann einfach \xFCbersch\xFCssig.":"STR 23 \u2013 as an Oathbreaker without respec, your invested STR is then simply surplus.","Altar neben Ansur im Drachenheiligtum, Drachenweg (X 636 / Y \u2212964)":"Altar next to Ansur in the dragon sanctum, Wyrmway (X 636 / Y \u2212964)","+1 RK und Rettungsw\xFCrfe, im Kampf 2 TP Heilung zu Beginn jed
